<!DOCTYPE html>

<head>

<title>4.1 Basic Concepts - inferno &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>4.1 &mdash; Basic Concepts</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Inferno &mdash; Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the correct IUPAC name for the compound CH₃CHClCH(CH₃)CH₂CH₃?","A":"3-chloro-4-methylpentane","B":"2-chloro-3-methylpentane","C":"2-chloro-4-methylpentane","D":"4-chloro-3-methylpentane","correct":"B","explain":"Step 1: identify the longest continuous chain. The chain containing both the Cl and the methyl-bearing carbon has 5 atoms: C1(CH₃)–C2(CHCl)–C3(CH(CH₃))–C4(CH₂)–C5(CH₃). Root = pent–. Step 2: number to give the lowest set of locants. Numbering left-to-right: Cl at C2, methyl branch at C3 → locant set {2, 3}. Numbering right-to-left: Cl at C4, methyl at C3 → locant set {3, 4}. The set {2, 3} is lower, so number left-to-right. Step 3: name substituents alphabetically: chloro (C2), methyl (C3). Result: 2-chloro-3-methylpentane. Option A has the locants reversed; option C has Cl at C2 but the methyl wrongly at C4."},{"stem":"How many structural isomers of C₅H₁₁Cl exist in total?","A":"6","B":"7","C":"8","D":"10","correct":"C","explain":"Systematic count by carbon skeleton: Pentane skeleton (no branching): Cl at C1 (= C5), C2 (= C4), C3 → 3 isomers. 2-methylbutane skeleton (one methyl branch at C2 of 4-carbon chain): Cl at C1, C2, C3, C4 (= 1-chloro-3-methylbutane) → 4 isomers. 2,2-dimethylpropane skeleton (two methyl branches at C2 of 3-carbon chain): Cl can only go on the unsubstituted C1 → 1 isomer (1-chloro-2,2-dimethylpropane). Total: 3 + 4 + 1 = 8 structural isomers. This exact question appeared in H432/02 November 2021 Q1 and is a reliable OCR Section A MCQ type."},{"stem":"A student is asked to identify the two functional groups in a molecule. The mark scheme says one is a carbonyl and the other is an amine. The student writes: \"carbonyl, aldehyde, amine.\" According to OCR's marking convention, how many marks does the student receive?","A":"2 marks (both correct groups identified, the extra entry is ignored)","B":"1 mark (the incorrect entry \"aldehyde\" is marked first, cancelling one of the correct entries)","C":"0 marks (any incorrect entry nullifies all marks)","D":"2 marks, but with a note of caution about over-listing","correct":"B","explain":"OCR's convention (stated explicitly in H432/03 June 2018 examiner report) is that incorrect groups are marked first. The student listed three groups: carbonyl (✓), aldehyde (✗ — because the mark scheme shows carbonyl, which already encompasses the C=O; listing \"aldehyde\" separately is wrong if the C=O is not specifically terminal), amine (✓). The examiner marks the wrong entry first (1 wrong = 1 mark deducted from a positive total), then the remaining correct ones. With one wrong out of three, the student loses 1 mark and gets only 1 out of 2. The lesson: only list groups you are confident are present; extra guesses actively harm the score."},{"stem":"Which statement best explains why ethanol (b.p. 78°C) has a much higher boiling point than methoxymethane (b.p. −24°C), given they share the molecular formula C₂H₆O?","A":"Ethanol has a higher Mr, so more energy is needed to vaporise it","B":"Methoxymethane is more polar, giving it weaker intermolecular forces","C":"Ethanol contains an O–H bond and can act as both a hydrogen-bond donor and acceptor; methoxymethane has no O–H bond and cannot donate hydrogen bonds, so only weaker dipole–dipole and London forces act between methoxymethane molecules","D":"Ethanol has stronger London forces because it is a straight-chain molecule","correct":"C","explain":"Both compounds have Mr = 46 g mol⁻¹, ruling out option A. Hydrogen bonding requires an O–H (or N–H) bond and a lone pair on O or N. Ethanol has O–H: it can both donate (from the O–H) and accept (lone pairs on O) hydrogen bonds, giving strong intermolecular attractions. Methoxymethane has lone pairs on O (potential acceptor) but no O–H bond: it cannot act as an H-bond donor. Only weak dipole–dipole and London forces operate. The enormous boiling point difference (102°C) for identical Mr compounds is entirely attributable to this difference in intermolecular forces — the most dramatic example of functional group isomers in AS chemistry."},{"stem":"In the heterolytic fission H–Br → H⁺ + Br⁻, which explanation correctly accounts for bromine taking both bonding electrons?","A":"Bromine is larger, so it can physically hold more electrons","B":"Bromine is less electronegative than hydrogen, so the bonding pair is displaced towards H","C":"Bromine is more electronegative than hydrogen; the bonding pair is already displaced towards Br in the δ+H–δ−Br dipole, so when the bond breaks heterolytically, Br retains both electrons and becomes Br⁻","D":"This is homolytic fission; each atom takes one electron","correct":"C","explain":"Electronegativity (the ability of an atom to attract bonding electrons) is the key: Br is significantly more electronegative than H, pulling the bonding pair towards itself. The bond is already polarised (Hδ+–Brδ−). When the bond breaks heterolytically, the pair completes its migration to Br, giving Br⁻. H, which was already electron-deficient (δ+), becomes fully electron-deficient: H⁺. This is why drawing the δ+/δ− dipole before the curly arrow is separately marked in OCR: the dipole justifies the direction in which the electron pair moves. Option D is wrong because this is specifically heterolytic, not homolytic (which would give H• and Br•, two radicals, not ions)."},{"stem":"Propanal (CH₃CH₂CHO) and propanone (CH₃COCH₃) are functional group isomers of formula C₃H₆O. Which reagent and expected result correctly distinguishes them?","A":"Bromine water: propanal decolourises it; propanone does not","B":"Tollens' reagent (ammoniacal silver nitrate): propanal gives a silver mirror; propanone does not","C":"Sodium carbonate solution: propanal effervesces; propanone does not","D":"Aqueous sodium hydroxide: propanone turns it pink; propanal does not","correct":"B","explain":"Tollens' reagent contains the complex ion [Ag(NH₃)₂]⁺. Aldehydes are oxidised by this mild oxidant (the CHO group is oxidised to –COO⁻) and the silver ion is reduced to silver metal, which deposits as a \"silver mirror\" on the inside of the tube. Ketones have no H on the carbonyl carbon and cannot be oxidised by Tollens': no silver mirror. This is the definitive test for an aldehyde vs a ketone in OCR. Neither compound decolourises bromine water (option A: both lack a C=C). Neither effervesces with Na₂CO₃ (option C: that tests for –COOH). Tollens' is used specifically because it is a mild enough oxidant to distinguish the two carbonyl types."},{"stem":"How many structural isomers of C₃H₆O that are specifically aldehydes or ketones exist?","A":"1","B":"2","C":"3","D":"4","correct":"B","explain":"The molecular formula C₃H₆O has one degree of unsaturation (calculated: (2×3+2−6)/2 = 1), which can be one C=C or one C=O. Restricting to aldehyde or ketone (C=O only): Aldehyde (–CHO at chain end): propanal, CH₃CH₂CHO. There is only one 3-carbon aldehyde (the CHO is always C1; the chain has only 2 additional carbons). Ketone (internal C=O, flanked by 2 C atoms): propanone, CH₃COCH₃. For 3 carbons, the carbonyl carbon must be C2 — there is only one position. Total: 2 isomers. Additional C₃H₆O isomers exist (e.g. prop-2-en-1-ol, which contains C=C and OH), but these are not aldehydes or ketones as required by the question."},{"stem":"Explain why a student who defines structural isomers as \"compounds with the same formula but a different arrangement of atoms\" would not achieve full marks on an OCR paper.","A":"This definition is correct and complete; the student deserves full marks","B":"\"Same formula\" does not specify molecular formula (empirical or general formulae would also qualify), and \"different arrangement of atoms\" includes stereoisomers (same connectivity, different spatial arrangement), which are not structural isomers; the required definition is \"same molecular formula, different structural formulae\"","C":"The definition is wrong because structural isomers must have different molecular formulae","D":"The definition is incomplete because it does not list the three types of structural isomerism","correct":"B","explain":"The OCR mark scheme awards two separate marks. Mark 1: \"same molecular formula\" — the word \"molecular\" is required; \"same formula\" alone is not specific enough. Mark 2: \"different structural formulae\" — the word \"structural\" (or \"structure\") is required; \"different arrangement of atoms\" is insufficient because it describes stereoisomers as well (which differ in spatial arrangement without changing connectivity). The H032/01 June 2018 mark scheme explicitly states: \"DO NOT ALLOW any reference to spatial/space/3D.\" The student's definition fails on both counts: the formula is under-specified and the difference is described too broadly."},{"stem":"A compound has the molecular formula C₄H₈O₂. Which pair of functional group classes both produce compounds with this molecular formula?","A":"Aldehyde and ketone (both CₙH₂ₙO)","B":"Carboxylic acid and ester","C":"Alcohol and ether (both CₙH₂ₙ₊₂O)","D":"Alkene and alcohol (CₙH₂ₙ + oxygen substituent)","correct":"B","explain":"C₄H₈O₂ has degree of unsaturation = (2×4+2−8)/2 = 1. One double bond and two oxygen atoms. Carboxylic acid (–COOH): butanoic acid CH₃CH₂CH₂COOH ✓. Ester (–COO–): multiple possibilities — ethyl ethanoate CH₃COOC₂H₅, methyl propanoate CH₃CH₂COOCH₃, propyl methanoate HCOOC₃H₇. Both carboxylic acid and ester have one C=O and two oxygens per formula unit. They are the classic pair of functional group isomers tested in OCR organic synthesis (e.g. H432/02 and H032/02). The pair ethanoic acid (CH₃COOH) and methyl methanoate (HCOOCH₃) shares C₂H₄O₂: a shorter-chain analogue of the same relationship."},{"stem":"The OCR examiner mark scheme for a question on functional groups states: \"treat carbonyl with aldehyde OR with ketone as one functional group.\" A student writes \"carbonyl and aldehyde\" as two of their answers for a molecule that contains one –CHO group. Explain what the examiner will do.","A":"Award 2 marks because the student has identified the two most important features of the functional group","B":"Treat \"carbonyl and aldehyde\" as one functional group (not two), and apply the wrong-first marking rule if a third incorrect group is also listed","C":"Award 0 marks because \"carbonyl\" is too vague to be accepted","D":"Accept both entries and award 2 marks as long as no incorrect groups are listed alongside them","correct":"B","explain":"An aldehyde already contains the C=O (carbonyl) bond: listing \"aldehyde\" and \"carbonyl\" separately is double-counting the same functional group. OCR's marking instruction recognises this: \"treat carbonyl with aldehyde OR with ketone as one functional group.\" So \"carbonyl and aldehyde\" scores 1 mark (for one correct functional group), not 2. If the student also listed a genuinely incorrect third group, the wrong-first convention applies and that incorrect entry is marked before the correct ones, potentially cancelling a correct entry. The practical rule: write \"aldehyde\" (specific) rather than \"carbonyl\" (generic), never write both for the same C=O group, and never write more groups than the question asks for."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
