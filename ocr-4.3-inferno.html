<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}

.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}

<body>
<header class="site-header">

  <h1>4.3 Alkenes</h1>

<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Inferno: Multi-step &amp; analyse</span>
  </div>

</main>
<script>
const QUESTIONS=[{"stem":"The OCR June 2022 examiner report for H432/02 states that the first curly arrow in the electrophilic addition of HBr to an alkene must \"start from, OR be traced back to, any point across the width of the C=C.\" Explain, in terms of the electronic structure of the C=C, why starting the arrow from a single carbon atom instead would be chemically incorrect.","A":"Starting from one carbon atom is acceptable if the molecule is asymmetric","B":"The π electrons of a C=C are shared between both carbons (they are delocalised over the whole C=C unit via sideways p-orbital overlap). Drawing the arrow from one carbon only implies that electrons originate from that single atom, whereas they are distributed across both. The arrow must start from the bond to correctly represent the π electron pair moving as a unit toward the electrophile","C":"It is incorrect because the arrow should start from the H–Br bond, not from the alkene at all","D":"The error is in using a double-headed arrow; a single-headed fish-hook arrow is required for the first step","correct":"B","explain":"The π-bond of a C=C consists of two p-orbital lobes above and one p-orbital lobe below the C–C internuclear axis, one lobe from each carbon. These lobes overlap laterally and the resulting electron density is shared between both carbons. There is no sense in which the π electrons belong to only one carbon. An arrow starting from one carbon atom suggests that carbon is the source of two electrons in the way a lone pair on N or O would be — but the π pair is genuinely delocalised. Option D is wrong: the correct arrow for an electron-pair movement in a heterolytic step is always a full (double-headed) curly arrow; the fish-hook is for radicals."},{"stem":"2-Methylpropene ((CH₃)₂C=CH₂) reacts with HBr. Identify the major product and explain, in terms of carbocation stability, why it forms rather than the minor product. State the type of effect that alkyl groups exert.","A":"Major product: 1-bromo-2-methylpropane; forms because H adds to the more substituted carbon","B":"Major product: 2-bromo-2-methylpropane; forms because H adds to the =CH₂ end, giving the tertiary carbocation (CH₃)₃C⁺ which is more stable than the primary carbocation (CH₃)₂CHCH₂⁺, due to the positive inductive effect (+I) of three methyl groups donating electron density to the positively charged carbon","C":"Major product: 2-bromo-2-methylpropane; forms because Markovnikov's rule states H goes to the carbon with fewest H atoms","D":"Equal amounts of both products form, because 2-methylpropene is symmetric","correct":"B","explain":"2-Methylpropene is unsymmetrical: the left C of C=C carries two CH₃ groups and no H; the right C carries two H atoms. Route A: H⁺ adds to the left C (which already has no H) → positive charge on the right C → primary carbocation (CH₃)₂CHCH₂⁺. Route B: H⁺ adds to the right C (which already has 2H) → positive charge on the left C → tertiary carbocation (CH₃)₃C⁺. The tertiary carbocation is more stable than the primary: three methyl groups each donate electron density toward the positive carbon via the positive inductive effect (+I), partially neutralising the charge. The tertiary route has a lower-energy transition state, so it is strongly preferred. Br⁻ then attacks the more stable carbocation to give 2-bromo-2-methylpropane (major). Option C states the outcome (Markovnikov) but does not give the required carbocation-stability explanation — this phrasing scores zero on OCR H032/02 June 2024."},{"stem":"A student attempts to draw the repeat unit of poly(propenal) from the monomer propenal (acrolein, CH₂=CH–CHO). They draw the chain passing through the carbonyl carbon (routing the backbone through the C=O group). Explain the error and state the correct repeat unit.","A":"There is no error; the carbonyl group can be the polymerisation site in addition polymerisation","B":"The error is that propenal is not an alkene and cannot undergo addition polymerisation","C":"The polymerisation site is always the C=C π-bond, not the C=O bond. The C=O is a pendant functional group that must be preserved intact on the same carbon. The backbone should pass through the two C=C carbons only; the correct repeat unit is –[CH₂–CH(CHO)]ₙ– with the aldehyde group as a side chain","D":"The student should have drawn the double bond between the chain carbons in the repeat unit","correct":"C","explain":"In any addition polymerisation, only the C=C alkene π-bond opens to form the polymer chain. Functional groups attached to the C=C carbons remain intact as pendant side chains. In propenal, the C=C is between C1 and C2; the –CHO group is on C2. The backbone passes through C1 and C2 (as in all vinyl-type monomers), giving –[CH₂–CH(CHO)]ₙ–. The aldehyde (–CHO) stays exactly as it was in the monomer: C double-bonded to O, with one H on the carbonyl C. OCR's June 2023 examiner report for H432/02 specifically penalised this exact error: \"Many lost marks for incorrect connectivity on the aldehyde, e.g. –COH or attempting to make a polymer via connection of the aldehyde group.\""},{"stem":"The compound BrClC=CH₂ (1-bromo-1-chloroethene) is examined for E/Z isomerism. Does it show E/Z isomerism? Apply CIP rules to justify your answer.","A":"Yes, E/Z isomerism exists because the left carbon has Br and Cl (two different groups)","B":"No, E/Z isomerism does not exist because the right carbon (=CH₂) has two identical substituents (H and H); although the left carbon has two different groups (Br and Cl), both carbons of the C=C must simultaneously carry two different groups for E/Z isomerism to arise","C":"Yes, E/Z isomerism exists because Br and Cl are different halogens with different atomic numbers","D":"No, E/Z isomerism does not exist because the molecule is too small","correct":"B","explain":"CIP check: at the left carbon of C=C, the two substituents are Br (Z=35) and Cl (Z=17) — these are different. At the right carbon of C=C, the two substituents are H and H — these are identical. Because the right carbon has two identical substituents, any attempt to create a \"different arrangement\" simply gives back the same molecule: the two H atoms are indistinguishable, so there is no Z form distinct from an E form. E/Z isomerism requires two different groups on each carbon of the C=C; if either carbon fails this condition, no E/Z isomerism exists. Contrast with 1,2-dibromoethene (CHBr=CHBr), where each C has H and Br (different) — E/Z isomerism does exist."},{"stem":"A student states that biodegradable polymers will solve all plastic waste problems, including plastic in landfill sites. Evaluate this claim, distinguishing biodegradable from photodegradable polymers.","A":"The claim is fully correct; biodegradable polymers break down in any environment, including landfill","B":"The claim is partially correct: biodegradable polymers (broken down by microorganisms/enzymes) require oxygen, moisture, and warm temperatures that are often absent deep in landfill; photodegradable polymers (broken down by UV light from sunlight) are similarly ineffective in landfill. Biodegradable polymers are most effective in industrial composting facilities or in environments accessible to microorganisms","C":"Biodegradable polymers and photodegradable polymers are the same thing and both work in landfill","D":"Neither type of polymer is commercially available, so the comparison is hypothetical","correct":"B","explain":"Biodegradable polymers (e.g. PLA, poly(lactic acid)) are broken down by microorganisms (bacteria, fungi) via their enzymes, which hydrolyse the ester or amide groups in the polymer backbone. This requires moisture, oxygen, warmth, and microbial activity — conditions that may be restricted in compacted landfill. Industrial composting at 55–60°C in aerated heaps is usually needed. Photodegradable polymers contain C=O bonds that absorb UV light and fragment; they are useful for outdoor applications (agricultural mulch films, bin liners left exposed to sunlight) but receive no UV once buried. Neither type solves landfill waste well; the spec requires students to know both limitations. \"Broken down by water\" is also an incorrect description of biodegradation (H432/02 June 2017): enzymes/microorganisms must be specified."},{"stem":"Rank the following carbocations from least stable to most stable: CH₃⁺ (methyl), CH₃CH₂⁺ (primary), (CH₃)₂CH⁺ (secondary), (CH₃)₃C⁺ (tertiary). Explain the trend.","A":"Methyl < primary < secondary < tertiary, because more alkyl groups donate electron density via the positive inductive effect (+I), spreading and reducing the positive charge","B":"Tertiary < secondary < primary < methyl, because a tertiary carbocation is surrounded by bulky groups that destabilise it","C":"All four have equal stability because they all carry the same +1 charge","D":"Methyl < primary = secondary < tertiary, because secondary and primary are equally stabilised by alkyl groups","correct":"A","explain":"Alkyl groups (R–) donate electron density toward the positively charged carbon through the σ-bonds connecting them (positive inductive effect, +I). Each additional alkyl group distributes the positive charge over a greater number of atoms, lowering the overall energy of the species. Methyl cation CH₃⁺ has no alkyl groups: no +I stabilisation, most unstable. A primary carbocation (one R group) has partial stabilisation. A secondary (two R groups) is more stable still. A tertiary (three R groups) has the most alkyl groups donating and is most stable. This stability order directly determines the product distribution in Markovnikov addition: the reaction pathway through the more stable carbocation has a lower activation energy and is preferred."},{"stem":"Why does benzene not decolourise bromine water, even though by formal definition it is unsaturated (it contains a C=C unit)? Link your explanation to the electronic structure of benzene.","A":"Benzene is actually saturated; the historical picture of alternating C=C and C–C bonds is wrong and modern benzene has no multiple bonds at all","B":"Benzene's six π electrons are fully delocalised around the ring into a system of lower energy than any localised C=C arrangement. Adding Br₂ across one bond would disrupt this delocalisation and produce a less stable, higher-energy product. The energy cost of disrupting the aromatic system is not offset by the energy of the two new C–Br bonds, so addition is energetically unfavourable","C":"Bromine is not electronegative enough to attack benzene's π electrons","D":"Benzene reacts with bromine water but the product is colourless and dissolves in the water layer, so the colour change is not visible","correct":"B","explain":"In benzene (C₆H₆), the six p-orbitals above and below the ring overlap laterally to form a continuous ring of delocalized electron density — six electrons spread over six carbons, rather than being localised in three alternating C=C bonds. This delocalisation stabilises benzene by about 150 kJ mol⁻¹ relative to a hypothetical cyclohexatriene with localised bonds. If benzene were to undergo electrophilic addition (like a simple alkene), the product would have four of the original six delocalized electrons pulled into two specific C–Br bonds, destroying the aromatic ring. The energy gain from forming two C–Br bonds (~2 × 290 kJ mol⁻¹) is not large enough to compensate for losing the resonance stabilisation energy. Benzene therefore reacts by electrophilic substitution instead, which restores the aromatic ring in the product and preserves the delocalisation."},{"stem":"But-1-ene (CH₂=CH–CH₂–CH₃) reacts with HBr at room temperature. Identify the major product, name it, and explain the choice using carbocation stability.","A":"1-bromobutane (major), formed via a secondary carbocation","B":"2-bromobutane (major), formed because H adds to C1 (the =CH₂ end, giving the more stable secondary carbocation CH₃CH₂CH⁺CH₃), whereas H adding to C2 would give the less stable primary carbocation (⁺CH₂CH₂CH₂CH₃)","C":"1,2-dibromobutane, because Br₂ adds across the double bond","D":"Equal amounts of 1-bromobutane and 2-bromobutane, because but-1-ene is symmetric","correct":"B","explain":"But-1-ene is unsymmetrical: C1 of C=C (=CH₂) has two H atoms; C2 (=CH–) has one H and a propyl chain. Route A: H⁺ adds to C1 → positive charge on C2 → secondary carbocation CH₃CH₂CH⁺CH₃ (flanked by both ethyl and H). Route B: H⁺ adds to C2 → positive charge on C1 → primary carbocation ⁺CH₂CH₂CH₂CH₃ (only one chain substituent). The secondary carbocation (Route A) is more stable due to greater electron-density donation from alkyl groups via the +I effect. Br⁻ then attacks the more stable secondary carbocation at C2, giving 2-bromobutane (CH₃CHBrCH₂CH₃) as the major product."},{"stem":"A section of an addition polymer has the repeating structure –CH₂–C(CH₃)₂–CH₂–C(CH₃)₂–. Identify the monomer that produced this polymer, draw its structure, and state its IUPAC name.","A":"Monomer: CH₂=CH(CH₃) — propene","B":"Monomer: CH₂=C(CH₃)₂ — 2-methylpropene","C":"Monomer: (CH₃)₂CHCH₂OH — 2-methylpropan-1-ol (an alcohol, not an alkene)","D":"Monomer: CH₃CH=CH₂ — propene (with an error in the repeat unit)","correct":"B","explain":"Find the repeat unit: two adjacent backbone carbons form each repeat. The pattern –CH₂–C(CH₃)₂– repeats. One backbone C is –CH₂– (two H, no substituents); the other is –C(CH₃)₂– (two methyl groups, no H). To find the monomer, replace the single C–C bond between these two backbone carbons with a C=C double bond: CH₂=C(CH₃)₂. This is 2-methylpropene (also called isobutylene). IUPAC name: 2-methylpropene (the longest chain containing the C=C is 3 carbons: prop; suffix –ene; methyl branch at C2). Propene (option A or D) would give –[CH₂–CH(CH₃)]ₙ– with only one methyl on the substituted carbon, not two."},{"stem":"Describe all three methods by which waste addition polymers can be processed to benefit sustainability, as required by the OCR specification, and explain one environmental limitation of combustion as a disposal method.","A":"Method 1: recycling by remelting; Method 2: burying in landfill; Method 3: releasing into the sea. Limitation: combustion releases CO₂","B":"Method 1: combustion with energy recovery; Method 2: use as organic feedstock for new chemicals (cracking/gasification); Method 3: mechanical/physical recycling (sorting, remelting and reforming into new products). Limitation: combustion irreversibly destroys the carbon in the polymer and releases CO₂ (a greenhouse gas), so it does not close the carbon loop or address climate change","C":"Method 1: composting; Method 2: photodegradation; Method 3: ocean dumping. Limitation: composting releases CH₄","D":"Method 1: combustion; Method 2: composting; Method 3: landfill. Limitation: combustion produces HCl which is acidic","correct":"B","explain":"The three OCR spec methods for disposal of waste addition polymers are: (1) <b>Combustion with energy recovery</b> — plastics have high calorific value; incineration generates electricity/heat. When halogenated polymers (e.g. PVC) burn, HCl is produced; Ca(OH)₂ scrubbers neutralise this — but scrubbing is a pollution-control sub-process within combustion, not a separate disposal method. (2) <b>Feedstock recycling</b> — cracking or gasification of plastic waste yields small hydrocarbons or syngas (CO + H₂) used to make new plastics or other organic chemicals, recovering the carbon atoms. (3) <b>Mechanical/physical recycling</b> — sorting polymers by type, remelting and reforming into new products (e.g. mixed PVC into drain pipes, HDPE into bin bags). Performance may be lower than the virgin polymer. Limitation of combustion: it converts all carbon in the polymer irreversibly to CO₂ (a greenhouse gas), rather than recovering them for reuse. Feedstock recycling (method 2) is more sustainable because it returns the carbon to productive use."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
