<script>
const QUESTIONS=[{"stem":"An unknown compound gives the following IR data: broad absorption at 3200–3500 cm⁻¹; strong absorption at 2900 cm⁻¹; no absorption in the 1630–1820 cm⁻¹ region. What compound class is indicated, and what is ruled out?","A":"Carboxylic acid is indicated; esters are ruled out","B":"Alcohol is indicated (broad O–H at 3200–3500 cm⁻¹; no C=O); aldehydes, ketones, carboxylic acids and esters are all ruled out (all require C=O at 1630–1820 cm⁻¹)","C":"Aldehyde is indicated; ketones are ruled out","D":"Amine is indicated; alcohols are ruled out","correct":"B","explain":"Step-by-step analysis using the OCR data sheet: (1) Broad at 3200–3500 cm⁻¹ → <b>O–H stretch of an alcohol</b> (broad but not very broad, so not a carboxylic acid). (2) Sharp at ~2900 cm⁻¹ → <b>C–H stretch</b> (present in almost every organic compound). (3) <b>No absorption at 1630–1820 cm⁻¹</b> → <b>no C=O bond</b>: this rules out aldehydes (C=O ~1720 cm⁻¹), ketones (C=O ~1715 cm⁻¹), carboxylic acids (C=O ~1710 cm⁻¹), esters (C=O ~1735 cm⁻¹), and amides (C=O ~1640 cm⁻¹). The broad O–H combined with the absence of C=O leaves only <b>alcohol</b> as the consistent identification. Absence of a peak is as diagnostic as the presence of one — the H432/02 June 2024 mark scheme rewards citing both what is present and what is absent."},{"stem":"The mass spectrum of compound A (Mr = 46) shows a base peak at m/z = 31 and a peak at m/z = 29. Identify A and the fragments responsible for each peak.","A":"A is propane (Mr = 44, not 46); m/z = 31 is CH₃⁺","B":"A is ethanol (Mr = 46); m/z = 31 is CH₂OH⁺ (loss of •CH₃, i.e. M − 15); m/z = 29 is CHO⁺ or C₂H₅⁺ (loss of •OH, i.e. M − 17)","C":"A is methanoic acid (Mr = 46); m/z = 31 is COOH⁺ and m/z = 29 is CH₃CO⁺","D":"A is ethanol; m/z = 31 is C₂H₅⁺ and m/z = 29 is CHO⁺ (two different fragments from the same cleavage)","correct":"B","explain":"Ethanol (C₂H₅OH, Mr = 46). The fragmentation of ethanol follows two main pathways: (1) Loss of •CH₃ (15 mass units): M⁺ loses the methyl radical from the ethyl chain, giving <b>CH₂OH⁺</b> at m/z = 46 − 15 = <b>31</b>. This is typically the base peak for ethanol. (2) Loss of •OH (17 mass units): M⁺ loses the hydroxyl radical, giving <b>C₂H₅⁺</b> (ethyl cation) at m/z = 46 − 17 = <b>29</b>. The pair 31 + 29 with Mr = 46 is a recognised fingerprint for ethanol. Methanoic acid (option C) also has Mr = 46 but its spectrum shows COOH⁺ at m/z = 45 (loss of H•) and CHO⁺ at m/z = 29 (loss of •OH) — a different pattern with 45 as a prominent peak rather than 31."},{"stem":"The IR spectrum of compound B shows a strong sharp absorption at 1720 cm⁻¹ and no broad absorption above 3000 cm⁻¹. Its mass spectrum shows M⁺ at m/z = 58. Identify two possible structures for B and state what further experiment would distinguish them.","A":"Both must be esters; no further test is needed","B":"B could be <b>propanone</b> (CH₃COCH₃, Mr = 58, ketone) or <b>propanal</b> (CH₃CH₂CHO, Mr = 58, aldehyde). Both show C=O around 1720 cm⁻¹ and no broad O–H. To distinguish: (i) use Tollens' reagent (ammoniacal AgNO₃) — propanal (aldehyde) gives a silver mirror; propanone (ketone) gives no reaction; or (ii) note that in the mass spectrum, propanal shows a strong CHO⁺ peak at m/z = 29 (loss of •CH₃), while propanone shows a CH₃CO⁺ peak at m/z = 43 (base peak, loss of •CH₃) and no 57 peak","C":"B must be an ester because the C=O is at 1720 cm⁻¹ (ester C=O is at 1735 cm⁻¹, ketone/aldehyde at ~1715 cm⁻¹ — 1720 cm⁻¹ is consistent with aldehyde or ketone, not ester)","D":"B is butane (Mr = 58) — the C=O would not appear in a non-oxygenated compound","correct":"B","explain":"Mr = 58, C=O at ~1720 cm⁻¹, no broad O–H → the compound is an <b>aldehyde or ketone</b>. Both propanone (CH₃COCH₃, Mr = 58) and propanal (CH₃CH₂CHO, Mr = 58) are consistent with these data. The ester C=O is slightly higher (~1735 cm⁻¹), and an ester would also show C–O stretches in the fingerprint region. To distinguish propanone from propanal: (1) <b>Tollens' reagent</b>: propanal reduces Ag⁺ to Ag (silver mirror); propanone does not react — this is the OCR-specified test for aldehydes vs ketones. (2) <b>Mass spectrum</b>: propanone shows a dominant acylium base peak at <b>m/z = 43</b> (CH₃CO⁺, from loss of •CH₃); propanal shows a peak at <b>m/z = 29</b> (CHO⁺ from α-cleavage next to the carbonyl, or C₂H₅⁺ from loss of CHO•) and a strong 57 peak (loss of H•) — the patterns differ clearly."},{"stem":"An unknown compound C has the following data: elemental analysis: C 52.2%, H 13.0%, O 34.8% (by mass); M⁺ at m/z = 46. Determine the molecular formula of compound C, showing all working.","A":"C₂H₆O — Mr = 46 and empirical formula is CH₃O, but that gives Mr = 31, so n = 46/31 — not whole number","B":"Step 1 — empirical formula: C: 52.2/12.0 = 4.35 mol; H: 13.0/1.0 = 13.0 mol; O: 34.8/16.0 = 2.175 mol. Divide by smallest (2.175): C = 2.00, H = 5.98 ≈ 6, O = 1.00. Empirical formula = C₂H₆O. Empirical mass = (2×12)+(6×1)+16 = 46. Step 2 — n = 46/46 = 1. Molecular formula = <b>C₂H₆O</b>","C":"C₁H₃O — Mr would be 31, not 46","D":"C₃H₈O₂ — Mr would be 76, not 46","correct":"B","explain":"Working through the four-step procedure: (1) Divide each % by Ar: C = 52.2/12.0 = 4.350; H = 13.0/1.0 = 13.00; O = 34.8/16.0 = 2.175. (2) Divide all by smallest (2.175): C = 4.350/2.175 = <b>2.00</b>; H = 13.00/2.175 = <b>5.98 ≈ 6</b>; O = 2.175/2.175 = <b>1.00</b>. Empirical formula = <b>C₂H₆O</b>. Empirical mass = 24 + 6 + 16 = <b>46</b>. (3) n = Mr/empirical mass = 46/46 = <b>1</b>. Molecular formula = C₂H₆O × 1 = <b>C₂H₆O</b>. (4) C₂H₆O at Mr = 46 could be <b>ethanol</b> (CH₃CH₂OH) or <b>methoxymethane / dimethyl ether</b> (CH₃OCH₃). The IR and mass-spectrum fragmentation would be needed to distinguish these isomers. Ethanol typically shows a broad O–H at 3300 cm⁻¹ and a base peak at m/z = 31 (CH₂OH⁺); dimethyl ether shows no O–H absorption and a different fragmentation."},{"stem":"Explain why CO₂ absorbs IR radiation at ~2350 cm⁻¹ (asymmetric stretch) but not at ~1388 cm⁻¹ (symmetric stretch), using the concept of change in dipole moment.","A":"CO₂ absorbs at 2350 cm⁻¹ because that is a higher energy photon, which has more energy to interact with the bond","B":"The asymmetric stretch (~2350 cm⁻¹) of CO₂ moves the two oxygen atoms in opposite directions, breaking the centre of symmetry and creating an oscillating dipole moment — IR photons with matching energy are absorbed. The symmetric stretch moves both O atoms outward simultaneously; at every point the molecule retains its centre of symmetry and zero dipole moment — no change in dipole means no IR absorption","C":"CO₂ absorbs at 2350 cm⁻¹ because C=O bonds are stronger than C–O bonds","D":"CO₂ cannot absorb at 1388 cm⁻¹ because that wavenumber falls below the minimum the spectrometer can detect","correct":"B","explain":"The rule for IR absorption is that a vibrational mode absorbs IR only if the vibration causes a <b>change in dipole moment</b>. CO₂ (O=C=O) is a linear, symmetric molecule with no permanent dipole. (i) <b>Asymmetric stretch</b>: the two C=O bonds lengthen and shorten out-of-phase — one O moves right while the other moves left. The molecule transiently has an unequal charge distribution at every moment of the vibration, creating an oscillating dipole. IR photons matching this frequency are absorbed → absorption at ~2350 cm⁻¹. (ii) <b>Symmetric stretch</b>: both C=O bonds lengthen and shorten in-phase — both O atoms move away from C simultaneously. At every point the molecule remains centrosymmetric: the dipole moment is zero throughout the vibration. No IR absorption occurs. This is a direct application of the symmetry-based IR selection rule and also explains why N₂ (symmetric homonuclear bond) is IR-inactive."},{"stem":"A mass spectrum shows M⁺ at m/z = 78 and an M+2 peak of approximately 1/3 the height of M⁺. There is also a prominent fragment at m/z = 43. What is the most likely compound?","A":"Chloroethane (M = 64, not 78)","B":"2-Chloropropane (CH₃CHClCH₃, Mr = 78): the M : M+2 ratio of ~3 : 1 confirms one chlorine atom; m/z = 43 is C₃H₇⁺ (loss of •Cl, i.e. M − 35) or CH₃CO⁺","C":"1-Bromopropane (Mr = 123, not 78)","D":"Propanoic acid (Mr = 74, not 78)","correct":"B","explain":"Key deductions: (1) <b>M : M+2 ≈ 3 : 1</b> → one <b>chlorine</b> atom (³⁵Cl ~75% : ³⁷Cl ~25%, giving ~3 : 1 for the molecular ion). (2) <b>Mr = 78</b> and one Cl (Mr = 35) leaves Mr − 35 = 43 mass units for the organic part. An organic fragment of mass 43 is C₃H₇ (3×12 + 7×1 = 43). So the molecule is C₃H₇Cl, with Mr = 43 + 35 = 78. ✓. (3) The fragment at <b>m/z = 43 = C₃H₇⁺</b> (loss of •Cl from M⁺): this confirms a propyl group. 2-Chloropropane (CH₃CHClCH₃) and 1-chloropropane (CH₃CH₂CH₂Cl) are both C₃H₇Cl. The fragmentation would distinguish them further: 2-chloropropane gives a more prominent CH₃CHCl⁺ or (CH₃)₂CH⁺ fragment; 1-chloropropane gives CH₃CH₂CH₂⁺. At MCQ level, the key deductions are Cl present (3:1 ratio), Mr = 78, and C₃H₇Cl as the molecular formula."},{"stem":"An organic compound D has: elemental analysis 66.7% C, 11.1% H, 22.2% O; M⁺ at m/z = 72; IR spectrum shows a strong sharp peak at ~1715 cm⁻¹ and no broad absorption above 3000 cm⁻¹. Identify compound D and state the two fragmentation peaks you would expect to find in its mass spectrum.","A":"D is butan-1-ol; expected fragments at m/z = 31 and m/z = 57","B":"D is butan-2-one (CH₃COCH₂CH₃, Mr = 72): empirical formula C₂H₄O (mass 44), n = 72/44 ≈ not integer; or C₄H₈O (mass 72, n = 1). C=O at 1715 + no O–H → ketone. Expected fragments: m/z = 43 (CH₃CO⁺, loss of •C₂H₅) and m/z = 57 (C₂H₅CO⁺, loss of •CH₃)","C":"D is butanal (CH₃CH₂CH₂CHO); fragments at m/z = 29 and m/z = 57","D":"D is butanoic acid (Mr = 88, not 72)","correct":"B","explain":"(1) Empirical formula: C: 66.7/12 = 5.558; H: 11.1/1 = 11.1; O: 22.2/16 = 1.388. Divide by 1.388: C = 4.00, H = 8.00, O = 1.00. Empirical formula = C₄H₈O. Empirical mass = 48 + 8 + 16 = 72. n = 72/72 = 1. Molecular formula = <b>C₄H₈O</b>. (2) IR: strong C=O at 1715 cm⁻¹, no broad O–H → <b>ketone or aldehyde</b> (not carboxylic acid — no very broad O–H; not alcohol — no O–H at all). (3) C₄H₈O ketone = <b>butan-2-one</b> (CH₃COCH₂CH₃). Expected fragmentation: α-cleavage on either side of the C=O: (i) loss of •CH₃ (15 mass units) → <b>CH₃CH₂CO⁺</b> at m/z = 57; (ii) loss of •C₂H₅ (29 mass units) → <b>CH₃CO⁺</b> at m/z = <b>43</b> (typically the base peak). Note: butanal (C₄H₈O aldehyde) would show CHO⁺ at m/z = 29 as a prominent fragment and m/z = 57 (loss of CHO•) — a different pattern, and the question would need Tollens'/Fehling's to distinguish them."},{"stem":"Explain why the fingerprint region of an IR spectrum (400–1500 cm⁻¹) is used for identifying an unknown compound by comparison with a database rather than by looking for single diagnostic peaks.","A":"The fingerprint region absorbs UV, not IR — it is only used by specialised UV instruments","B":"The fingerprint region contains a complex, overlapping pattern of absorptions from C–C, C–O, and C–halogen single-bond stretches and bending vibrations. Every compound has a unique pattern of absorptions in this region (like a fingerprint), so comparing an unknown's fingerprint with a database confirms identity definitively, even between compounds with the same functional groups. No single peak in this region is diagnostic for any one compound","C":"The fingerprint region has only one peak per molecule, which gives a unique identification","D":"The fingerprint region is too low in energy to cause vibrations and is only included for completeness","correct":"B","explain":"Below ~1500 cm⁻¹, the spectrum becomes a dense, overlapping pattern of single-bond stretches (C–C, C–O, C–halogen) and bending modes. Unlike the distinctive diagnostic absorptions in the 1500–4000 cm⁻¹ region (e.g. a sharp C=O at 1715 cm⁻¹ or a broad O–H at 3300 cm⁻¹), no single peak in the fingerprint region can identify a specific bond because many different bonds absorb in overlapping ranges. However, the <b>complete pattern</b> of peaks in the fingerprint region is unique to each molecular structure (except enantiomers) — two compounds with different structures never produce identical fingerprint patterns. This makes fingerprint comparison against a reference database the gold standard for <b>confirmatory identification</b> of a pure compound, as used in pharmaceutical quality control, forensics, and environmental monitoring. At AS level, candidates should know the function of the fingerprint region but are not expected to interpret individual peaks within it."},{"stem":"An unknown compound E has Mr = 88 from its mass spectrum. The IR spectrum shows a strong sharp peak at ~1735 cm⁻¹ and a peak at ~1200 cm⁻¹ in the fingerprint region, but no broad O–H absorption. Elemental analysis gives 54.5% C, 9.1% H, 36.4% O. Identify compound E and name the functional group present.","A":"Compound E is butanoic acid (carboxylic acid); functional group is –COOH","B":"Compound E is an ester (C=O at 1735 cm⁻¹, no O–H absorption): empirical formula from analysis = C₂H₄O (mass 44), n = 88/44 = 2, molecular formula C₄H₈O₂. Possible esters with this formula: ethyl ethanoate (CH₃COOC₂H₅) or methyl propanoate (CH₃CH₂COOCH₃). Functional group: ester (–COO–)","C":"Compound E is propanone (C=O at 1715 cm⁻¹, not 1735 cm⁻¹, and Mr = 58, not 88)","D":"Compound E is a ketone; functional group is C=O","correct":"B","explain":"(1) Empirical formula: C: 54.5/12 = 4.542; H: 9.1/1 = 9.1; O: 36.4/16 = 2.275. Divide by 2.275: C = 2.00, H = 4.00, O = 1.00. Empirical formula = C₂H₄O, mass = 44. n = 88/44 = 2. Molecular formula = <b>C₄H₈O₂</b>. (2) IR: C=O at 1735 cm⁻¹ is in the <b>ester</b> range (~1735 cm⁻¹ — slightly higher than ketone/aldehyde ~1715 cm⁻¹ and acid ~1710 cm⁻¹); absence of any broad O–H rules out alcohol and carboxylic acid. The peak at ~1200 cm⁻¹ is consistent with the C–O–C stretch of an ester linkage. (3) Conclusion: compound E is an <b>ester</b> with formula C₄H₈O₂. Possible structures: ethyl ethanoate (CH₃COOC₂H₅), methyl propanoate (CH₃CH₂COOCH₃), or propyl methanoate (HCOOC₃H₇). The exact isomer would require mass-spectrum fragmentation analysis. Note: the C=O position at 1735 vs 1710 cm⁻¹ is the key IR feature distinguishing esters from carboxylic acids — a distinction worth memorising."},{"stem":"A mass spectrum shows peaks at m/z = 74 (M⁺), 57 (M − 17), and 29 (M − 45). Using the \"mass lost\" approach, identify the compound.","A":"Mr = 74, loss of 17 = loss of OH (→ acylium cation, C₃H₅CO⁺ at 57), loss of 45 = loss of COOH (→ C₂H₅⁺ at 29). This is a carboxylic acid with Mr = 74 and two-carbon fragment C₂H₅⁺: compound is <b>propanoic acid</b> (CH₃CH₂COOH, Mr = 74)","B":"Mr = 74, loss of 17 = loss of CH₃ (fragment at 57 is C₃H₇CO⁺), loss of 45 = loss of C₃H₉ (not a standard neutral)","C":"Mr = 74, loss of 17 = loss of NH₃ (→ amine), loss of 45 = loss of COOH (→ contradiction)","D":"Mr = 74, loss of 17 gives m/z = 57, loss of 45 gives m/z = 29; compound is butan-1-ol (Mr = 74, but its main fragment is m/z = 31 and m/z = 56 — not 29 and 57)","correct":"A","explain":"Working through the mass losses: <b>M − 17 = 57</b>: loss of 17 mass units = loss of <b>•OH</b> → the M − 17 fragment at 57 is a stable acylium cation [R–CO]⁺ formed by α-cleavage adjacent to the C=O of a carboxylic acid. For Mr = 74: acylium is C₃H₅CO⁺ (57) → the acid has a 3-carbon chain ending in COOH. <b>M − 45 = 29</b>: loss of 45 mass units = loss of <b>•COOH</b> → the fragment at 29 is <b>C₂H₅⁺</b> (ethyl cation, mass = 29). This tells us the acid has an ethyl group (C₂H₅) on the carbon adjacent to –COOH. Compound: <b>CH₃CH₂COOH</b> (propanoic acid, Mr = 12 + 12 + 12 + 16 + 12 + 2 + 16 + 1 = 74 ✓, i.e. 3C + 6H + 2O = 74). The three-peak pattern 74 → 57 → 29 (M, M − 17, M − 45) is the characteristic fragmentation fingerprint of propanoic acid."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
