<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>6.1 Aromatic Chemistry - spark &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.1 &mdash; Aromatic Chemistry</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark &mdash; Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"According to the Kekulé model, what is the predicted enthalpy change of hydrogenation of benzene (C₆H₆ + 3H₂)?","A":"−120 kJ mol⁻¹","B":"−152 kJ mol⁻¹","C":"−208 kJ mol⁻¹","D":"−360 kJ mol⁻¹","correct":"D","explain":"Kekulé proposed benzene was cyclohexa-1,3,5-triene with three independent C=C bonds. Cyclohexene (one C=C) has ΔH_hyd = −120 kJ mol⁻¹, so three C=C bonds should release 3 × (−120) = <b>−360 kJ mol⁻¹</b>. The measured value is only −208 kJ mol⁻¹, so benzene is 152 kJ mol⁻¹ more stable than Kekulé predicts — this difference is the delocalisation (resonance) energy. Option (A) is the value for one C=C (cyclohexene). Option (B) is the delocalisation energy itself (152 kJ mol⁻¹). Option (C) is the actual measured value — the most common wrong answer from candidates who confuse the Kekulé prediction with the experimental result."},{"stem":"What is the C–C bond length in benzene as determined by X-ray diffraction?","A":"0.120 nm","B":"0.134 nm","C":"0.139 nm","D":"0.154 nm","correct":"C","explain":"All six C–C bonds in benzene are identical at <b>0.139 nm</b> — intermediate between a C–C single bond (0.154 nm) and a C=C double bond (0.134 nm). This uniform, intermediate length is direct evidence that six π-electrons are delocalised evenly over all six carbons; no individual pair of carbons \"owns\" a localised double bond. If the Kekulé structure were correct, alternating 0.134 nm and 0.154 nm bonds would be observed. Option (B) is a typical C=C double bond; option (D) is a typical C–C single bond."},{"stem":"Why does benzene NOT decolourise bromine water in the dark?","A":"Benzene contains no π electrons.","B":"The delocalised π-system spreads electron density over six carbons, making it insufficient to polarise the Br–Br bond and generate the electrophile needed for reaction.","C":"Benzene reacts with bromine water but produces a colourless product, so no decolourisation is observed.","D":"The Br–Br bond energy is too high for any organic compound to break it.","correct":"B","explain":"In an alkene, the localised C=C π-bond concentrates high electron density above two carbons, polarising approaching Br₂ and generating Br⁺. In benzene the same six electrons are spread evenly over six carbons: the electron density at any one position is lower and <b>insufficient to polarise</b> the non-polar Br–Br bond without assistance from a Lewis acid halogen carrier (FeBr₃ or AlBr₃). Option (A) is factually wrong — benzene has six π-electrons in the delocalised system. Option (C) confuses benzene with phenol, which does react with bromine water giving a white precipitate. Option (D) is irrelevant — Br–Br bond energy is independent of the organic substrate."},{"stem":"What are the correct reagents and conditions for the mononitration of benzene?","A":"Dilute HNO₃ and dilute H₂SO₄ at room temperature","B":"Concentrated HNO₃ and concentrated H₂SO₄ at approximately 50 °C","C":"Dilute HNO₃ alone at 50 °C","D":"Concentrated HNO₃ alone at 100 °C","correct":"B","explain":"Nitration of benzene requires <b>concentrated H₂SO₄</b> as a catalyst to generate the active electrophile NO₂⁺ from concentrated HNO₃. The reaction is run at <b>approximately 50 °C</b>: above ~55 °C, di-nitration becomes significant; below 50 °C the rate is impractically slow. Dilute HNO₃ cannot generate sufficient NO₂⁺, and omitting H₂SO₄ leaves HNO₃ largely unprotonated. This is a direct contrast with phenol, which needs only dilute HNO₃ at room temperature — the –OH group activates the ring so strongly that a weaker electrophile suffices."},{"stem":"Which species is the electrophile in the nitration of benzene?","A":"H₂SO₄","B":"OH⁻","C":"NO₂⁺","D":"NO₃⁻","correct":"C","explain":"The nitryl (nitronium) cation <b>NO₂⁺</b> is generated when concentrated H₂SO₄ protonates HNO₃ and the protonated species loses water (HNO₃ + 2H₂SO₄ → NO₂⁺ + 2HSO₄⁻ + H₃O⁺). The nitrogen in NO₂⁺ carries a formal positive charge, making it a powerful electrophile that attacks the electron-rich benzene ring. H₂SO₄ is the catalyst that generates the electrophile — it is not the electrophile itself. OH⁻ is a nucleophile, not an electrophile. NO₃⁻ is the conjugate base of HNO₃ and is a leaving group, not the attacking species."},{"stem":"Phenol reacts with aqueous sodium hydroxide. Which statement correctly describes this reaction?","A":"Phenol does not react with NaOH because it is too weakly acidic to react with any base.","B":"Phenol reacts with NaOH to form sodium phenoxide and water.","C":"Phenol reacts with NaOH to form an ester.","D":"Phenol reacts with NaOH to release carbon dioxide gas.","correct":"B","explain":"Phenol is a weak acid (pKa ≈ 10) that is fully deprotonated by the strong base NaOH in a neutralisation reaction: <b>C₆H₅OH + NaOH → C₆H₅O⁻Na⁺ + H₂O</b>. Even weak acids react completely with strong bases. No CO₂ is released — CO₂ would only form if a carbonate were displaced, but phenol (pKa ≈ 10) is weaker than carbonic acid (pKa ≈ 6.4) and cannot do this. Ester formation requires a carboxylic acid and an alcohol with a different mechanism; phenol's reaction with NaOH is a straightforward acid–base neutralisation."},{"stem":"When phenol is added to bromine water, which observation is correct?","A":"The bromine water is not decolourised because phenol is not an alkene.","B":"The bromine water is slowly decolourised and a yellow precipitate forms.","C":"The bromine water is rapidly decolourised and a white precipitate of 2,4,6-tribromophenol forms.","D":"The bromine water is decolourised by an addition reaction producing a soluble product.","correct":"C","explain":"The –OH group donates a lone pair into the benzene π-system, making the ring far more reactive than benzene towards electrophiles. Br₂ in water (no catalyst needed) causes electrophilic substitution at <b>all three</b> 2-, 4- and 6-positions simultaneously, giving <b>2,4,6-tribromophenol</b> as a white solid precipitate (C₆H₅OH + 3Br₂ → C₆H₂Br₃OH + 3HBr). This contrasts sharply with benzene, which needs anhydrous Br₂ + FeBr₃ and gives only bromobenzene. Option (D) describes the alkene test — alkenes also decolourise bromine water but by addition, producing a soluble dibromoalkane with no precipitate. The white precipitate is the diagnostic distinction between phenol and an alkene."},{"stem":"Which statement about directing effects in electrophilic substitution is correct?","A":"The –NO₂ group is 2,4-directing because it is strongly electron-withdrawing.","B":"The –OH group is 3-directing because its oxygen lone pairs point away from the ring.","C":"The –NH₂ group is 2,4-directing because it donates a lone pair into the π-system of the ring.","D":"The –NO₂ group has no effect on the position of the next electrophilic substitution.","correct":"C","explain":"The –NH₂ group (like –OH) carries lone pairs on the nitrogen atom in a p-orbital aligned parallel to the ring's p-orbitals. Donation of this lone pair into the ring (+M effect) increases electron density specifically at the <b>2, 4 and 6 positions</b> (ortho and para), directing incoming electrophiles there. –NO₂ is <b>3-directing</b> (meta), not 2,4-directing, because it withdraws electron density from the ring (–M effect), depleting the 2, 4 and 6 positions and leaving position 3 relatively more electron-rich. Option (B) is wrong — the –OH lone pair is donated INTO the ring, not away from it."},{"stem":"What is the organic product of the Friedel-Crafts acylation of benzene with ethanoyl chloride (CH₃COCl) in the presence of anhydrous AlCl₃?","A":"Chlorobenzene (C₆H₅Cl)","B":"Ethylbenzene (C₆H₅CH₂CH₃)","C":"Phenylethanone (C₆H₅COCH₃)","D":"Methylbenzene (C₆H₅CH₃)","correct":"C","explain":"In Friedel-Crafts acylation, AlCl₃ abstracts Cl⁻ from CH₃COCl to generate the acylium ion <b>CH₃CO⁺</b>. This electrophile attacks the benzene ring, and after loss of H⁺ (with regeneration of AlCl₃ and formation of HCl), the product is <b>phenylethanone C₆H₅COCH₃</b> — an aryl ketone with a new C–C bond. Option (A) is wrong; Cl is a by-product (HCl), not the ring substituent. Option (B) is the product of Friedel-Crafts <b>alkylation</b> with chloroethane (CH₃CH₂Cl). Option (D) is the product of alkylation with chloromethane (CH₃Cl). Acylation and alkylation are often confused — remember that acylation uses an <b>acyl chloride</b> (RCOCl) and gives an aryl ketone."},{"stem":"What is the role of AlBr₃ (a halogen carrier) in the bromination of benzene?","A":"AlBr₃ acts as a solvent that dissolves Br₂ and benzene together.","B":"AlBr₃ acts as a Lewis acid, abstracting Br⁻ from Br₂ to generate Br⁺ — a sufficiently strong electrophile to attack the benzene ring.","C":"AlBr₃ acts as a Brønsted acid, donating H⁺ to Br₂ to polarise it.","D":"AlBr₃ prevents addition reactions by blocking ring positions.","correct":"B","explain":"AlBr₃ is a <b>Lewis acid</b>: it accepts a lone pair from Br₂ (acting as Lewis base) to form a polarised complex Br–Br→AlBr₃, effectively abstracting Br⁻ and leaving <b>Br⁺</b> (or a strongly δ+ bromine) as the electrophile. Without AlBr₃, benzene's delocalised π-system has too low a concentration of electron density at any one point to polarise the non-polar Br–Br bond. AlBr₃ is a <b>catalyst</b> — it is regenerated at the end of the mechanism when H⁺ (lost from the ring to restore aromaticity) combines with AlBr₄⁻ to give HBr + AlBr₃. Option (C) confuses Lewis acidity (electron-pair acceptance) with Brønsted acidity (H⁺ donation)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
