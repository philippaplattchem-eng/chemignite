<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Paper 1 Inferno | Combined Science Chemistry</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--inf);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#e8eaf6;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--inf)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#e8eaf6;border-left:4px solid var(--inf);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--inf);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(13,53,117,.4);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(13,53,117,.5)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Combined Science — Paper 1 (Topics 1–5)</h1>
  <span class="tier-badge inferno">Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Topics 1–5</span>
    <span>Inferno: Exam Challenge</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"Silicon exists as three isotopes: ²⁸Si (92.2%), ²⁹Si (4.7%), ³⁰Si (3.1%). Calculate the relative atomic mass of silicon to one decimal place.","A":"28.0","B":"28.1","C":"29.0","D":"28.5","correct":"B","explain":"Ar = (92.2 × 28 + 4.7 × 29 + 3.1 × 30) ÷ 100 = (2581.6 + 136.3 + 93.0) ÷ 100 = 2810.9 ÷ 100 = 28.11 ≈ 28.1. Each mass is multiplied by its percentage abundance, summed, then divided by 100. Common errors: using only two of the three isotopes and omitting ³⁰Si; taking a simple unweighted average — (28 + 29 + 30) ÷ 3 = 29.0 — which treats all three as equally abundant; rounding to 28.0 — the question specifies one decimal place and 28.11 rounds to 28.1, not 28.0."},
{"stem":"A student states: 'The atomic number of an element tells you the number of neutrons in its atoms.' Evaluate this claim.","A":"Correct — in a neutral atom the number of protons always equals the number of neutrons","B":"Incorrect — the atomic number gives the number of protons (and electrons in a neutral atom). Neutron number = mass number − atomic number, and this varies between isotopes of the same element","C":"Correct for elements with atomic number below 20, but not for heavier elements","D":"Incorrect — the atomic number gives the mass number minus the electron number","correct":"B","explain":"The atomic number = number of protons = number of electrons in a neutral atom. Neutron number = mass number − atomic number. For lighter elements the proton and neutron numbers often happen to be equal (e.g. ¹²C: 6 protons, 6 neutrons), which is likely the source of this misconception — but ¹⁴C has 6 protons and 8 neutrons, showing they differ. Common errors: choosing A — agreeing with the student because common isotopes look equal; choosing C — there is no such cut-off; ⁷Li has 3 protons and 4 neutrons; vague evaluation that does not state what atomic number actually means (number of protons)."},
{"stem":"An unknown substance has a melting point of 2852°C, does not conduct electricity as a solid, but does conduct electricity when dissolved in water. It contains only magnesium and oxygen. Deduce the bonding type and most likely formula.","A":"Giant covalent; formula MgO₂","B":"Giant ionic; formula MgO","C":"Simple molecular; formula Mg₂O","D":"Metallic; formula MgO","correct":"B","explain":"Very high melting point → giant structure (eliminates simple molecular). Conducts when dissolved (ions free to move) but not as a solid (ions fixed) → ionic (eliminates metallic, which conducts as a solid; eliminates giant covalent, which never conducts). Mg forms Mg²⁺ (Group 2); O forms O²⁻ (Group 6). Charges balance 2+:2− = 1:1 → formula MgO. Common errors: choosing A (giant covalent) — giant covalent never conducts; choosing D (metallic) — metals conduct as solids; choosing MgO₂ as the formula even after correctly identifying ionic — Mg²⁺ needs only one O²⁻ to balance."},
{"stem":"Explain why graphite conducts electricity but diamond does not, despite both being made entirely of carbon atoms.","A":"Graphite contains ionic carbon atoms; diamond contains covalent carbon atoms — ionic species carry charge but covalent ones do not","B":"In graphite, each carbon forms 3 covalent bonds, leaving 1 electron per atom delocalised and free to move; in diamond, each carbon forms 4 covalent bonds using all outer electrons, leaving none free","C":"Graphite has metallic bonding between its layers; diamond has only covalent bonds","D":"Graphite atoms have more electrons than diamond atoms because they are in a different allotrope","correct":"B","explain":"In graphite, each C forms 3 bonds in hexagonal layers. The fourth outer electron per C is delocalised — free to move — and these mobile electrons carry electrical charge. In diamond, each C forms 4 covalent bonds; all outer electrons are used. No free electrons → cannot conduct. Common errors: choosing A — both graphite and diamond are entirely covalently bonded; choosing C — graphite does not have metallic bonding; stating 'graphite has free electrons' without explaining why (each C forms only 3 bonds, leaving one electron per atom delocalised) — the causal link must be stated."},
{"stem":"Aluminium forms Al³⁺ ions and fluorine forms F⁻ ions. Deduce the formula of aluminium fluoride using charge balance.","A":"AlF","B":"AlF₂","C":"Al₂F₃","D":"AlF₃","correct":"D","explain":"Al³⁺ has charge 3+. F⁻ has charge 1−. To balance: 3 F⁻ ions (3 × 1− = 3−) cancel one Al³⁺ (3+). Formula: AlF₃. Cross-multiplication method: charge on Al (3) becomes subscript on F; charge on F (1) becomes subscript on Al → Al₁F₃ = AlF₃. Common errors: choosing A (AlF) — assuming a 1:1 ratio without checking charge balance; choosing B (AlF₂) — 2 F⁻ gives 2−, which does not balance the 3+ of Al³⁺; choosing C (Al₂F₃) — applying the cross-multiplication with incorrect ion charges."},
{"stem":"A substance has the empirical formula SiO₂, a melting point of 1710°C, and does not conduct electricity in any state. Predict its structure and explain why it has a very high melting point.","A":"Simple molecular; high melting point because the intermolecular forces between SiO₂ molecules are unusually strong","B":"Giant ionic; high melting point because ionic bonds are very strong","C":"Giant covalent; very high melting point because all strong Si–O covalent bonds throughout the entire continuous lattice must be broken to melt the substance","D":"Metallic; high melting point because the sea of electrons strongly attracts the positive silicon ions","correct":"C","explain":"SiO₂ (silicon dioxide) is a giant covalent structure — each Si bonds to 4 O atoms in a continuous 3D lattice. Breaking any bonds requires breaking strong covalent bonds → very high melting point. No ions or free electrons → does not conduct in any state. Common errors: choosing B (giant ionic) — ionic substances conduct when molten; SiO₂ never conducts, so it is not ionic; choosing A (simple molecular) — any substance melting above a few hundred degrees cannot be simple molecular; describing the structure as 'giant molecular' — the correct term is 'giant covalent.'"},
{"stem":"2.4 g of magnesium reacts completely with excess oxygen: 2Mg + O₂ → 2MgO. Calculate the mass of magnesium oxide produced. (Mg = 24, O = 16)","A":"2.4 g","B":"4.0 g","C":"8.0 g","D":"3.2 g","correct":"B","explain":"Moles of Mg = 2.4 ÷ 24 = 0.1 mol. From the equation: 2 mol Mg → 2 mol MgO (1:1 ratio). So 0.1 mol Mg → 0.1 mol MgO. Mr(MgO) = 24 + 16 = 40. Mass = 0.1 × 40 = 4.0 g. Common errors: choosing A (2.4 g) — assuming mass of product equals mass of reactant used, without using Mr of MgO; choosing C (8.0 g) — confusing the coefficient 2 in the equation with a mass multiplier; getting Mr(MgO) wrong by using 24 + 8 = 32, taking half the mass of O₂ instead of using the Ar of one O atom."},
{"stem":"0.160 g of a hydrocarbon burns completely in oxygen, producing 0.440 g of CO₂ and 0.360 g of H₂O. Determine the empirical formula of the hydrocarbon. (C = 12, H = 1, O = 16)","A":"CH₂","B":"CH₃","C":"CH₄","D":"C₂H₅","correct":"C","explain":"Moles of CO₂ = 0.440 ÷ 44 = 0.010 mol → moles of C = 0.010. Moles of H₂O = 0.360 ÷ 18 = 0.020 mol → moles of H = 0.040 (each H₂O contains 2 H atoms). Ratio C:H = 0.010:0.040 = 1:4. Empirical formula = CH₄. Common errors: choosing A (CH₂) — forgetting to multiply moles of H₂O by 2 to get moles of H atoms (using 0.020 instead of 0.040 gives ratio 1:2 → CH₂); using the masses of CO₂ and H₂O directly in the ratio without converting to moles; trying to subtract the oxygen mass from the products — the oxygen in the products comes from O₂ used in combustion, not from the hydrocarbon."},
{"stem":"25.0 cm³ of sodium hydroxide solution is exactly neutralised by 20.0 cm³ of 0.150 mol/dm³ hydrochloric acid. NaOH + HCl → NaCl + H₂O. Calculate the concentration of the sodium hydroxide solution.","A":"0.150 mol/dm³","B":"0.120 mol/dm³","C":"0.075 mol/dm³","D":"0.188 mol/dm³","correct":"B","explain":"Moles of HCl = 0.150 × (20.0 ÷ 1000) = 0.00300 mol. NaOH:HCl = 1:1, so moles of NaOH = 0.00300 mol. Volume of NaOH = 25.0 ÷ 1000 = 0.0250 dm³. Concentration of NaOH = 0.00300 ÷ 0.0250 = 0.120 mol/dm³. Common errors: not converting either or both volumes from cm³ to dm³; choosing C (0.075) — dividing the HCl concentration by 2 without justification; using the volume of HCl (20.0 cm³) as the denominator when calculating NaOH concentration — confusing which substance's volume to use."},
{"stem":"During the electrolysis of concentrated sodium chloride solution (brine), which ions are responsible for each product at the electrodes?","A":"Cl⁻ → chlorine at anode; Na⁺ → sodium metal at cathode (no hydrogen produced)","B":"Cl⁻ → chlorine at anode; H⁺ ions from water → hydrogen at cathode","C":"OH⁻ → chlorine at anode; Na⁺ → hydrogen at cathode","D":"Na⁺ → chlorine at anode; Cl⁻ → hydrogen at cathode","correct":"B","explain":"At the anode (+): Cl⁻ ions are oxidised — 2Cl⁻ → Cl₂ + 2e⁻. Concentrated solution means Cl⁻ is preferentially discharged over OH⁻. At the cathode (−): H⁺ ions from water are reduced — 2H⁺ + 2e⁻ → H₂. Na⁺ ions are not discharged because sodium is too reactive. The three products of brine electrolysis are Cl₂, H₂, and NaOH. Common errors: choosing A — sodium metal would form if molten NaCl were electrolysed; in aqueous solution, H⁺ ions are preferentially discharged; choosing C — in concentrated brine, Cl⁻ not OH⁻ is preferentially discharged at the anode; confusing anode and cathode directions."},
{"stem":"A student titrates 20.0 cm³ of an unknown acid (HA) against 0.100 mol/dm³ sodium hydroxide. It takes 24.0 cm³ of NaOH to reach the end point. HA + NaOH → NaA + H₂O. Calculate the concentration of the acid.","A":"0.100 mol/dm³","B":"0.120 mol/dm³","C":"0.083 mol/dm³","D":"0.240 mol/dm³","correct":"B","explain":"Moles of NaOH = 0.100 × (24.0 ÷ 1000) = 0.00240 mol. Molar ratio HA:NaOH = 1:1, so moles of HA = 0.00240 mol. Volume of HA = 20.0 ÷ 1000 = 0.0200 dm³. Concentration of HA = 0.00240 ÷ 0.0200 = 0.120 mol/dm³. Common errors: choosing C (0.083) — dividing volumes the wrong way round; using 20/24 instead of 24/20 in the first step gives the inverse result; not converting cm³ to dm³; choosing A (0.100) — assuming the concentration of the acid equals that of the NaOH, ignoring the different volumes used."},
{"stem":"Zinc reacts with dilute sulfuric acid: Zn + H₂SO₄ → ZnSO₄ + H₂. A student uses 1.30 g of zinc with excess acid but only collects 0.016 g of hydrogen gas. Calculate the percentage yield. (Zn = 65, H = 1)","A":"80%","B":"25%","C":"40%","D":"50%","correct":"C","explain":"Moles of Zn = 1.30 ÷ 65 = 0.0200 mol. 1:1 ratio → theoretical moles of H₂ = 0.0200 mol. Mr(H₂) = 2. Theoretical mass = 0.0200 × 2 = 0.0400 g. % yield = (0.016 ÷ 0.040) × 100 = 40%. Common errors: using 1.30 g directly in the formula — writing (0.016 ÷ 1.30) × 100 = 1.2%, which is the actual yield as a percentage of the starting mass of zinc, not the theoretical yield of hydrogen; getting Mr(H₂) wrong — using Mr = 1 instead of 2 (forgetting H₂ is diatomic), giving theoretical mass 0.0200 g and yield of 80%."},
{"stem":"The Haber process: N₂ + 3H₂ → 2NH₃. Bond energies: N≡N = 944 kJ/mol · H–H = 436 kJ/mol · N–H = 388 kJ/mol. Calculate the overall energy change (ΔH).","A":"ΔH = +76 kJ/mol — endothermic","B":"ΔH = −76 kJ/mol — exothermic","C":"ΔH = −2252 kJ/mol — exothermic","D":"ΔH = +2252 kJ/mol — endothermic","correct":"B","explain":"Bonds broken: 1 × N≡N = 944; 3 × H–H = 3 × 436 = 1308. Total energy in = 2252 kJ/mol. Bonds made: 2 × 3 × N–H = 6 × 388 = 2328 kJ/mol (each NH₃ has 3 N–H bonds; 2 molecules are produced). ΔH = 2252 − 2328 = −76 kJ/mol. Negative = exothermic. Common errors: only counting 3 N–H bonds made instead of 6 — forgetting the equation produces 2 NH₃ molecules; getting the correct magnitude (76) but the wrong sign; choosing C or D — presenting only the bonds-broken total (2252) as the final answer."},
{"stem":"A student writes: 'The catalyst speeds up the reaction because it gives the reactant particles more energy, so more collisions are successful.' Identify the error and give the correct explanation.","A":"The statement is fully correct — catalysts provide energy to particles, increasing successful collisions","B":"The error is 'gives particles more energy' — catalysts lower the activation energy by providing an alternative pathway, meaning more particles already have sufficient energy to react, without changing particle energies","C":"The error is 'speeds up the reaction' — catalysts actually slow down the reverse reaction only","D":"The error is 'reactant particles' — catalysts only affect product particles","correct":"B","explain":"Catalysts work by providing an alternative reaction pathway with a lower activation energy. They do not change the energy of individual particles — particle kinetic energy depends on temperature, not on a catalyst. A lower Eₐ means a greater fraction of particles already have sufficient energy to react, increasing successful collisions per unit time. The overall energy change ΔH is also unchanged by a catalyst. Common errors: accepting the student's statement as correct; evaluating only part of the error without providing the correct mechanism (lower Eₐ via alternative pathway); saying 'a catalyst increases the rate because more particles have energy greater than the activation energy' without stating why — the causal link (Eₐ has been lowered) must be stated."},
{"stem":"A student draws an exothermic reaction profile and places the Eₐ arrow from the product energy level to the peak. They score zero marks. Explain the error and describe a correct exothermic reaction profile.","A":"There is no Eₐ arrow in an exothermic reaction because the reaction releases energy without needing activation energy","B":"The Eₐ arrow must start at the reactant energy level and end at the peak; in an exothermic reaction, the product energy level is lower than the reactant energy level, and the ΔH arrow runs downward from reactant level to product level","C":"The Eₐ arrow should run from the peak downward to the product level — this shows the energy released as the transition state converts to products","D":"In an exothermic reaction, Eₐ is measured from the x-axis baseline up to the peak — the student was drawing from the wrong baseline","correct":"B","explain":"Activation energy = minimum energy reactants must have to reach the transition state. The Eₐ arrow always starts at the reactant energy level and ends at the peak. The student's arrow (product level to peak) gives the Eₐ of the reverse, endothermic reaction — a different quantity entirely. For an exothermic profile: reactant energy level is higher than product level; ΔH is negative; the curve rises from reactants to peak, then falls below the reactant level to reach the products. Common errors: choosing A — all reactions (exothermic and endothermic) have activation energy; choosing D — Eₐ is measured from the reactant energy level, not from the x-axis baseline; correctly identifying the error but then drawing the exothermic profile incorrectly (products higher than reactants, which would be endothermic)."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'— Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'% &mdash; '+
    (pct>=80?'Outstanding — exam-level thinking!':pct>=60?'Strong work — review the questions you missed.':'These are tough. Read every explanation carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
