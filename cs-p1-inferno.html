<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--inf);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#e8eaf6;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--inf)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#e8eaf6;border-left:4px solid var(--inf);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--inf);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#060f2e,#0d1f5c 50%,var(--inf));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(13,53,117,.4);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(13,53,117,.5)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Combined Science: Paper 1 (Topics 1&ndash;5)</h1>
  <span class="tier-badge inferno">Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Topics 1&ndash;5</span>
    <span>Inferno: Exam Challenge</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"Silicon exists as three isotopes: ²⁸Si (92.2%), ²⁹Si (4.7%), ³⁰Si (3.1%). Calculate the relative atomic mass of silicon to one decimal place.","A":"28.0","B":"28.1","C":"29.0","D":"28.5","correct":"B","explain":"Ar = (92.2 × 28 + 4.7 × 29 + 3.1 × 30) ÷ 100. Working: (92.2 × 28) = 2581.6; (4.7 × 29) = 136.3; (3.1 × 30) = 93.0. Sum = 2810.9. Ar = 2810.9 ÷ 100 = 28.11, which rounds to 28.1 to one decimal place. All three isotopes must be included; omitting ³⁰Si gives a slightly different answer that rounds to 28.0 and scores zero. A simple average (28 + 29 + 30) ÷ 3 = 29.0 ignores the very different abundances and is completely wrong. A useful check: because 92.2% of silicon is ²⁸Si, the answer should be very close to 28. An answer of 29.0 should immediately look suspicious."},
{"stem":"A student states: 'The atomic number of an element tells you the number of neutrons in its atoms.' Evaluate this claim.","A":"Correct, in a neutral atom the number of protons always equals the number of neutrons","B":"Incorrect. The atomic number gives the number of protons (and electrons in a neutral atom). Neutron number = mass number minus atomic number, and this varies between isotopes of the same element","C":"Correct for elements with atomic number below 20, but not for heavier elements","D":"Incorrect. The atomic number gives the mass number minus the electron number","correct":"B","explain":"The atomic number gives the number of protons. In a neutral atom it also equals the number of electrons. The number of neutrons is: mass number minus atomic number. For some common lighter isotopes, the proton number and neutron number happen to be equal (for example, carbon-12 has 6 protons and 6 neutrons), which is likely the source of this misconception. However, carbon-14 has 6 protons and 8 neutrons, and lithium-7 has 3 protons and 4 neutrons, immediately disproving the claim even for light elements. An evaluation question needs: (1) a clear verdict that the claim is incorrect, (2) what atomic number actually means, (3) the correct formula for neutron number, and (4) a counterexample."},
{"stem":"An unknown substance has a melting point of 2852°C, does not conduct electricity as a solid, but does conduct when dissolved in water. It contains only magnesium and oxygen. Deduce the bonding type and most likely formula.","A":"Giant covalent; formula MgO₂","B":"Giant ionic; formula MgO","C":"Simple molecular; formula Mg₂O","D":"Metallic; formula MgO","correct":"B","explain":"Work through the properties step by step. Very high melting point (2852°C): rules out simple molecular structures, which melt well below 300°C. Does not conduct as a solid: rules out metallic bonding, which conducts as a solid via delocalised electrons. Does conduct when dissolved: rules out giant covalent (which never conducts in any state) and confirms ionic (ions released into solution are free to move). For the formula: magnesium is in Group 2, so it forms Mg²⁺. Oxygen is in Group 6, so it forms O²⁻. The 2+ and 2- charges balance in a 1:1 ratio, giving the formula MgO. Option A would require Mg⁴⁺, which magnesium does not form."},
{"stem":"Explain why graphite conducts electricity but diamond does not, despite both being made entirely of carbon atoms.","A":"Graphite contains ionic carbon atoms; diamond contains covalent carbon atoms and ionic species carry charge but covalent ones do not","B":"In graphite, each carbon forms 3 covalent bonds, leaving 1 electron per atom delocalised and free to move. In diamond, each carbon forms 4 covalent bonds using all outer electrons, leaving none free","C":"Graphite has metallic bonding between its layers; diamond has only covalent bonds","D":"Graphite atoms have more electrons than diamond atoms because they are in a different allotrope","correct":"B","explain":"Both graphite and diamond are allotropes of carbon: same element, different structures. In diamond, each carbon atom forms 4 covalent bonds with its four neighbours in a tetrahedral arrangement. All four outer electrons of each carbon are used in bonding, leaving no electrons free to move. In graphite, each carbon forms only 3 covalent bonds in hexagonal layers. The fourth outer electron per carbon is not used in bonding, so it becomes delocalised across the layers and is free to move, allowing graphite to conduct electricity. A full-mark answer must include: (1) in graphite, each C forms 3 bonds; (2) one electron per C is delocalised; (3) in diamond, each C forms 4 bonds; (4) no delocalised electrons in diamond. Simply writing 'graphite has delocalised electrons' without explaining why will score only partial marks."},
{"stem":"Aluminium forms Al³⁺ ions and fluorine forms F⁻ ions. Deduce the formula of aluminium fluoride using charge balance.","A":"AlF","B":"AlF₂","C":"Al₂F₃","D":"AlF₃","correct":"D","explain":"The total positive charge must equal the total negative charge in an ionic compound. Al³⁺ has charge 3+. F⁻ has charge 1-. Three F⁻ ions (total charge 3-) are needed to balance one Al³⁺ (charge 3+). Formula: AlF₃. The cross-multiplication method: the charge on aluminium (3) becomes the subscript on fluoride, and the charge on fluoride (1) becomes the subscript on aluminium, giving Al₁F₃ = AlF₃. To check: 1 × 3+ from Al plus 3 × 1- from F gives 3+ and 3-, which cancel to give zero net charge. Zero net charge confirms the formula is correct. Option A (AlF) would give a net charge of 2+, not zero."},
{"stem":"A substance has the empirical formula SiO₂, a melting point of 1710°C, and does not conduct electricity in any state. Predict its structure and explain why it has a very high melting point.","A":"Simple molecular; high melting point because the intermolecular forces between SiO₂ molecules are unusually strong","B":"Giant ionic; high melting point because ionic bonds are very strong","C":"Giant covalent; very high melting point because all strong Si-O covalent bonds throughout the entire continuous lattice must be broken to melt the substance","D":"Metallic; high melting point because the sea of electrons strongly attracts the positive silicon ions","correct":"C","explain":"Silicon dioxide (SiO₂, also known as silica or quartz) is a giant covalent structure. Each silicon atom is bonded to four oxygen atoms, and each oxygen bridges two silicon atoms, forming a continuous three-dimensional network of Si-O covalent bonds. To melt SiO₂, every one of these strong covalent bonds throughout the entire network must be broken, requiring enormous energy. Because there are no ions and no delocalised electrons, SiO₂ cannot conduct electricity in any state. Option B (giant ionic) is wrong because ionic substances conduct when molten; SiO₂ never conducts. Option A is ruled out because any substance with a melting point of 1710°C cannot be simple molecular. A common error is describing the structure as 'giant molecular'; the correct term is giant covalent."},
{"stem":"2.4 g of magnesium reacts completely with excess oxygen: 2Mg + O₂ → 2MgO. Calculate the mass of magnesium oxide produced. (Mg = 24, O = 16)","A":"2.4 g","B":"4.0 g","C":"8.0 g","D":"3.2 g","correct":"B","explain":"Step 1: moles of Mg = 2.4 ÷ 24 = 0.1 mol. Step 2: use the molar ratio. From 2Mg + O₂ → 2MgO, the ratio Mg:MgO = 2:2 = 1:1. So 0.1 mol Mg produces 0.1 mol MgO. Step 3: Mr(MgO) = 24 + 16 = 40. Mass of MgO = 0.1 × 40 = 4.0 g. Option A (2.4 g) comes from assuming the mass of product equals the mass of reactant used, ignoring that oxygen atoms are added from the air. Option C (8.0 g) often comes from confusing the coefficient 2 in the equation with a mass multiplier. A common arithmetic error is using O = 8 instead of O = 16 (perhaps by halving the mass of O₂), giving Mr(MgO) = 32 and a final mass of 3.2 g (option D)."},
{"stem":"0.160 g of a hydrocarbon burns completely in oxygen, producing 0.440 g of CO₂ and 0.360 g of H₂O. Determine the empirical formula of the hydrocarbon. (C = 12, H = 1, O = 16)","A":"CH₂","B":"CH₃","C":"CH₄","D":"C₂H₅","correct":"C","explain":"Step 1: moles of CO₂ = 0.440 ÷ 44 = 0.010 mol. Each CO₂ contains one C, so moles of C = 0.010. Step 2: moles of H₂O = 0.360 ÷ 18 = 0.020 mol. Each H₂O contains two H atoms, so moles of H = 0.020 × 2 = 0.040. Step 3: ratio C:H = 0.010:0.040 = 1:4. Empirical formula = CH₄. The most common error is forgetting to multiply moles of H₂O by 2 to get moles of H atoms. Using 0.020 mol H instead of 0.040 gives ratio 1:2, leading to the wrong answer CH₂ (option A). All the carbon and hydrogen came from the hydrocarbon; the oxygen in the products came from the oxygen gas used in combustion, not from the hydrocarbon itself."},
{"stem":"25.0 cm³ of sodium hydroxide solution is exactly neutralised by 20.0 cm³ of 0.150 mol/dm³ hydrochloric acid. NaOH + HCl → NaCl + H₂O. Calculate the concentration of the sodium hydroxide solution.","A":"0.150 mol/dm³","B":"0.120 mol/dm³","C":"0.075 mol/dm³","D":"0.188 mol/dm³","correct":"B","explain":"Step 1: moles of HCl = 0.150 × (20.0 ÷ 1000) = 0.150 × 0.0200 = 0.00300 mol. Step 2: molar ratio NaOH:HCl = 1:1, so moles of NaOH = 0.00300 mol. Step 3: concentration of NaOH = 0.00300 ÷ (25.0 ÷ 1000) = 0.00300 ÷ 0.0250 = 0.120 mol/dm³. Both volumes must be converted to dm³ (divide by 1000) before using them. A useful sense-check: the NaOH needed a larger volume (25 cm³) than the HCl (20 cm³) to reach the end point, so the NaOH must be less concentrated than the HCl. 0.120 < 0.150, which is consistent. Option A (0.150) is wrong because the concentration of the acid is only equal to the concentration of the alkali when both volumes are equal."},
{"stem":"During the electrolysis of concentrated sodium chloride solution (brine), which ions are responsible for each product at the electrodes?","A":"Cl⁻ ions form chlorine at the anode; Na⁺ ions form sodium metal at the cathode (no hydrogen produced)","B":"Cl⁻ ions form chlorine at the anode; H⁺ ions from water form hydrogen at the cathode","C":"OH⁻ ions form chlorine at the anode; Na⁺ ions form hydrogen at the cathode","D":"Na⁺ ions form chlorine at the anode; Cl⁻ ions form hydrogen at the cathode","correct":"B","explain":"Four types of ions are present in brine: Na⁺, Cl⁻, H⁺ (from water), and OH⁻ (from water). At the anode (positive electrode): both Cl⁻ and OH⁻ are attracted, but in concentrated brine, Cl⁻ is preferentially discharged. Reaction: 2Cl⁻ → Cl₂ + 2e⁻. At the cathode (negative electrode): both Na⁺ and H⁺ are attracted, but H⁺ is preferentially discharged because sodium is too reactive to deposit from aqueous solution. Reaction: 2H⁺ + 2e⁻ → H₂. The Na⁺ and OH⁻ remain in solution and form sodium hydroxide (NaOH). Option A is wrong because sodium metal only forms when molten NaCl is electrolysed, not when aqueous. Option C is wrong because in concentrated brine, Cl⁻ (not OH⁻) is preferentially discharged at the anode."},
{"stem":"A student titrates 20.0 cm³ of an unknown acid (HA) against 0.100 mol/dm³ sodium hydroxide. It takes 24.0 cm³ of NaOH to reach the end point. HA + NaOH → NaA + H₂O. Calculate the concentration of the acid.","A":"0.100 mol/dm³","B":"0.120 mol/dm³","C":"0.083 mol/dm³","D":"0.240 mol/dm³","correct":"B","explain":"Step 1: moles of NaOH = 0.100 × (24.0 ÷ 1000) = 0.100 × 0.0240 = 0.00240 mol. Step 2: molar ratio HA:NaOH = 1:1, so moles of HA = 0.00240 mol. Step 3: concentration of HA = 0.00240 ÷ (20.0 ÷ 1000) = 0.00240 ÷ 0.0200 = 0.120 mol/dm³. Always use the acid's own volume (20.0 cm³) in the final step, not the NaOH volume. A quick sense-check: more NaOH (24 cm³) was needed than acid (20 cm³), so the acid must be more concentrated than the NaOH. 0.120 > 0.100, which is consistent. Option C (0.083) typically comes from dividing volumes the wrong way round in step 1, giving the ratio 20/24 instead of 24/20."},
{"stem":"Zinc reacts with dilute sulfuric acid: Zn + H₂SO₄ → ZnSO₄ + H₂. A student uses 1.30 g of zinc with excess acid but only collects 0.016 g of hydrogen gas. Calculate the percentage yield. (Zn = 65, H = 1)","A":"80%","B":"25%","C":"40%","D":"50%","correct":"C","explain":"Step 1: moles of Zn = 1.30 ÷ 65 = 0.0200 mol. Step 2: from the equation (1:1 ratio), theoretical moles of H₂ = 0.0200 mol. Step 3: Mr(H₂) = 2, not 1. Hydrogen is diatomic (H₂), so two hydrogen atoms are joined together. Theoretical mass = 0.0200 × 2 = 0.0400 g. Step 4: % yield = (actual ÷ theoretical) × 100 = (0.016 ÷ 0.040) × 100 = 40%. Using Mr(H₂) = 1 instead of 2 gives theoretical mass = 0.0200 g and % yield = 80% (option A), a very common error. Option B and D come from different calculation routes. A common error is writing % yield = (actual yield ÷ mass of reactant) × 100 = (0.016 ÷ 1.30) × 100 = 1.2%, which is not percentage yield at all."},
{"stem":"The Haber process: N₂ + 3H₂ → 2NH₃. Bond energies: N≡N = 944 kJ/mol, H–H = 436 kJ/mol, N–H = 388 kJ/mol. Calculate the overall energy change (ΔH).","A":"ΔH = +76 kJ/mol (endothermic)","B":"ΔH = &#8722;76 kJ/mol (exothermic)","C":"ΔH = &#8722;2252 kJ/mol (exothermic)","D":"ΔH = +2252 kJ/mol (endothermic)","correct":"B","explain":"Step 1, bonds broken: 1 × N≡N = 944 kJ/mol; 3 × H-H = 3 × 436 = 1308 kJ/mol. Total energy in = 944 + 1308 = 2252 kJ/mol. Step 2, bonds made: the equation produces 2 NH₃ molecules. Each NH₃ has 3 N-H bonds, so 2 × 3 = 6 N-H bonds are made. Energy out = 6 × 388 = 2328 kJ/mol. Step 3: ΔH = energy in minus energy out = 2252 - 2328 = -76 kJ/mol. Negative means exothermic. The most common error is counting only 3 N-H bonds made (for one NH₃ molecule) instead of 6 (for two). This gives 2252 - 1164 = +1088 kJ/mol, which is completely wrong in both magnitude and sign. Always check the coefficient in front of NH₃ in the balanced equation: it is 2, meaning 2 × 3 = 6 N-H bonds are formed."},
{"stem":"A student writes: 'The catalyst speeds up the reaction because it gives the reactant particles more energy, so more collisions are successful.' Identify the error and give the correct explanation.","A":"The statement is fully correct; catalysts provide energy to particles, increasing successful collisions","B":"The error is 'gives particles more energy.' Catalysts lower the activation energy by providing an alternative pathway, meaning more particles already have sufficient energy to react without changing particle energies","C":"The error is 'speeds up the reaction'; catalysts actually slow down the reverse reaction only","D":"The error is 'reactant particles'; catalysts only affect product particles","correct":"B","explain":"A catalyst works by providing an alternative reaction pathway with a lower activation energy. It does not give particles more energy. Particle kinetic energy depends on temperature, not on a catalyst. Because the activation energy is lower, a larger fraction of particles already possess enough energy to react successfully, so more collisions per unit time are productive, increasing the rate. The overall energy change ΔH is also unchanged by a catalyst: a catalyst makes a reaction faster but does not change whether it is exothermic or endothermic. A complete correct answer must include: (1) alternative reaction pathway; (2) lower activation energy; (3) more particles have sufficient energy to react. Identifying only part of the error without providing the correct mechanism will not gain full marks on a 3-mark evaluation question."},
{"stem":"A student draws an exothermic reaction profile and places the Eₐ arrow from the product energy level to the peak. They score zero marks. Explain the error and describe what a correct exothermic reaction profile looks like.","A":"There is no Eₐ arrow in an exothermic reaction because the reaction releases energy without needing activation energy","B":"The Eₐ arrow must start at the reactant energy level and end at the peak. In an exothermic reaction, the product energy level is lower than the reactant energy level, and the ΔH arrow runs downward from reactant level to product level","C":"The Eₐ arrow should run from the peak downward to the product level, showing the energy released as the transition state converts to products","D":"In an exothermic reaction, Eₐ is measured from the x-axis baseline up to the peak, so the student was drawing from the wrong baseline","correct":"B","explain":"Activation energy is the minimum energy reactants must have to reach the transition state. The Eₐ arrow always starts at the reactant energy level and ends at the peak of the curve. The student placed the Eₐ arrow from the product level to the peak, which gives the activation energy of the reverse (endothermic) reaction. This is a completely different value. For a correct exothermic profile: the reactant energy level is drawn higher than the product energy level; the curve rises from the reactant level to a peak, then falls below the reactant level to reach the product level; the Eₐ arrow runs upward from the reactant level to the peak; the ΔH arrow runs downward from the reactant level to the product level. Option A is wrong: all reactions, exothermic and endothermic alike, require activation energy to start."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Outstanding. Exam-level thinking!':pct>=60?'Strong work. Review the questions you missed.':'These are tough. Read every explanation carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
