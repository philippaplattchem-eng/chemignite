<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.1 Periodicity - inferno &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>3.1 &mdash; Periodicity</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>6 questions</span>
    <span>Inferno &mdash; Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"The successive ionisation energies of element X are (in kJ mol⁻¹): 578, 1817, 2745, 11577. Identify which group X belongs to and explain your reasoning.","A":"Group 1 — the first ionisation energy (578) is the lowest, suggesting one outer electron","B":"Group 2 — the first two ionisation energies are below 2000 kJ mol⁻¹","C":"Group 3","D":"Group 4 — four ionisation energies are given","correct":"C","explain":"The large jump between the 3rd IE (2745) and 4th IE (11577) — roughly a 4× increase — indicates that three outer electrons have been removed before reaching the inner-shell electrons. The first three IEs are in the same \"tier\" (removed from the same shell), but the 4th electron comes from a shell much closer to the nucleus, requiring far more energy. Therefore X has 3 outer electrons → Group 3. The values given exactly match aluminium (Al, Z = 13, [Ne]3s²3p¹)."},{"stem":"Elements X and Y both belong to Period 3. X has 1st IE = 496 kJ mol⁻¹ and 2nd IE = 4562 kJ mol⁻¹. Y has 1st IE = 738 kJ mol⁻¹ and 2nd IE = 1451 kJ mol⁻¹. Which row correctly identifies the groups of X and Y?","A":"X = Group 2; Y = Group 3","B":"X = Group 1; Y = Group 2","C":"X = Group 1; Y = Group 1","D":"X = Group 3; Y = Group 2","correct":"B","explain":"For X: the ratio of 2nd IE to 1st IE is 4562/496 ≈ 9.2. This enormous jump after the 1st electron shows that only 1 outer electron exists → Group 1. (X is sodium.) For Y: the ratio of 2nd to 1st IE is 1451/738 ≈ 2.0 — a modest increase that does not signal a shell-crossing. The jump to Y's 3rd IE would be dramatic (Mg's 3rd IE = 7733 kJ mol⁻¹), confirming 2 outer electrons → Group 2. (Y is magnesium.) The pattern of \"successive IEs\" deducing group membership is a standard Inferno-level OCR question type."},{"stem":"The first ionisation energies across Period 3 show a general upward trend from Na (496) to Ar (1521 kJ mol⁻¹), but with two unexpected dips. Which answer correctly identifies and explains both dips?","A":"Dip at Mg (shielding by 3s electrons) and dip at Cl (extra 3p electron repulsion)","B":"Dip at Al (3p electron is higher energy than 3s; easier to remove) and dip at S (paired 3p electron experiences extra repulsion)","C":"Dip at Al (smaller atomic radius) and dip at P (3p³ is unstable)","D":"No genuine dips occur — the data contains experimental error","correct":"B","explain":"The general increase reflects rising nuclear charge with constant shielding. Two exceptions: (1) Al [Ne]3s²3p¹ vs Mg [Ne]3s²: Al's outer electron enters the 3p sub-shell, which is at higher energy than 3s — easier to remove despite Al having one more proton. (2) S [Ne]3s²3p⁴ vs P [Ne]3s²3p³: P's three 3p electrons each occupy a separate orbital (spin-parallel, no repulsion); S's fourth 3p electron must pair up, experiencing extra electron–electron repulsion → slightly easier to remove. Both dips are real and reproducible features of the Period 3 IE trend."},{"stem":"The melting point of silicon (1414°C) is much higher than that of magnesium (650°C), which is itself higher than that of sodium (98°C). Give a structural explanation for the two-stage comparison.","A":"All three are metallic — they differ only in the number of outer electrons: Na (1) < Mg (2) < Si (4)","B":"Na and Mg are metallic; Si is ionic — MgO is more stable than NaO, explaining the difference","C":"Na < Mg (stronger metallic bonding: Mg²⁺ more charged than Na⁺, more delocalised electrons, smaller cation → stronger electrostatic attraction); Mg < Si (Si has a giant covalent lattice with many strong Si–Si covalent bonds throughout, requiring far more energy to disrupt than metallic bonds)","D":"Si has the highest melting point because it has the most isotopes of any Period 3 element","correct":"C","explain":"Two distinct comparisons are needed. Na → Mg: both are giant metallic lattices, but Mg has 2 delocalised electrons per atom (vs Na's 1), a more highly charged cation (Mg²⁺ vs Na⁺), and a smaller cation → stronger cation-to-electron sea attraction → higher mp. Mg → Si: the structure type changes entirely. Si is a giant covalent lattice where every Si atom is tetrahedrally bonded to four others by strong covalent bonds in a 3D network. These bonds are both numerous and strong — overcoming them requires far more energy than overcoming metallic bonding in Mg."},{"stem":"Across Period 3, the melting points of simple molecular substances (P₄, S₈, Cl₂) decrease in the order S₈ > P₄ > Cl₂. Explain this trend in terms of London forces.","A":"S₈ has the most covalent bonds, which attract neighbouring molecules more strongly","B":"S₈ > P₄ > Cl₂ because the number of atoms per molecule (and therefore electrons per molecule) decreases: S₈ has 128e, P₄ has 60e, Cl₂ has 34e; more electrons → stronger instantaneous dipoles → stronger London forces → higher melting point","C":"The trend is caused by differences in polarity — S₈ and P₄ are more polar than Cl₂","D":"Cl₂ melts at the lowest temperature because it has the highest oxidising power","correct":"B","explain":"All three are simple molecular structures; the only IMF between molecules is London forces (all three are non-polar). London force strength depends on the number of electrons per molecule (more electrons → larger, more polarisable cloud → stronger instantaneous dipoles). S₈ contains 8 sulfur atoms (Z = 16 each) → 8 × 16 = 128 electrons per molecule. P₄ contains 4 × 15 = 60 electrons per molecule. Cl₂ contains 2 × 17 = 34 electrons per molecule. The pattern S₈ > P₄ > Cl₂ in boiling point directly mirrors the electron count."},{"stem":"A student argues: \"Group 2 metals become less reactive going down the group because their ionisation energies decrease.\" Identify the error in this claim.","A":"There is no error — decreasing ionisation energy does make metals less reactive","B":"The trend is correct (more reactive down the group) but the reasoning is wrong: lower ionisation energies make electron donation easier, increasing reactivity — the student's conclusion contradicts their reasoning","C":"Both the trend and the reasoning are wrong — Group 2 metals become less reactive down the group because atomic radius increases","D":"The claim is entirely correct; all aspects of the student's reasoning are sound","correct":"B","explain":"This question tests two things: the actual trend and the mechanistic link. The actual trend: Group 2 metals become MORE reactive going down the group (Ba reacts more vigorously with water than Mg; Ca reacts with cold water but Mg only reacts with steam). The reasoning about ionisation energy is partially correct — first IE does decrease down the group — but the student drew the opposite conclusion. Decreasing IE means the outer electrons are MORE easily removed, so the metal is MORE easily oxidised → MORE reactive as a reducing agent. The student said \"decreasing IE → less reactive\", which has the logic backwards."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
