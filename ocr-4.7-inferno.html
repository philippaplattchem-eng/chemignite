<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>4.7 &mdash; Analytical Techniques (AS)</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>6 questions</span>
    <span>Inferno &mdash; Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"The mass spectrum of compound F (molecular formula C₃H₈O, Mr = 60) shows a base peak at m/z = 45 and a secondary fragment at m/z = 31. The IR shows a broad O–H absorption at 3200–3550 cm⁻¹ with no C=O peak. Identify F and explain how the fragmentation pattern distinguishes it from its structural isomers.","A":"F is propan-1-ol; m/z = 45 is consistent with propan-1-ol since it loses 15 mass units","B":"F is propan-2-ol ((CH₃)₂CHOH). Molecular formula C₃H₈O (Mr = 36+8+16 = 60 ✓). IR: broad O–H (alcohol), no C=O. Base peak m/z = 45 = (CH₃)CHOH⁺ (loss of •CH₃ from C2, M − 15): α-cleavage at the branched carbon gives the stable secondary fragment. m/z = 31 (CH₂OH⁺, loss of •C₂H₅) is the minor fragment. Propan-1-ol shows the reverse pattern: base peak m/z = 31 (CH₂OH⁺, loss of •C₂H₅) and minor m/z = 45","C":"F is propanal; the C=O would appear at ~1720 cm⁻¹ in the IR, but no C=O is observed","D":"F is methyl ethanoate (ester, C₂H₄O₂, Mr = 60); an ester would show C=O at ~1735 cm⁻¹ in IR, not an alcohol O–H","correct":"B","explain":"Molecular formula C₃H₈O, Mr = 60. No C=O in IR, but broad O–H at 3200–3550 cm⁻¹ → alcohol. The two C₃H₈O structural isomers that are alcohols: propan-1-ol (CH₃CH₂CH₂OH) and propan-2-ol ((CH₃)₂CHOH). They are distinguished by their fragmentation patterns: <b>Propan-2-ol</b> — the branching at C2 means α-cleavage preferentially breaks the C–C bond between C2 and CH₃, giving (CH₃)CHOH⁺ at <b>m/z = 45</b> (base peak). <b>Propan-1-ol</b> — α-cleavage at C1 gives CH₂OH⁺ at <b>m/z = 31</b> (base peak), with m/z = 45 as a minor peak. The base peak at m/z = 45 in compound F's spectrum identifies it as propan-2-ol. Option D (methyl ethanoate, HCOOC₂H₅) also has Mr = 60 and formula C₂H₄O₂ but would show an ester C=O at ~1735 cm⁻¹ and no O–H."},{"stem":"Explain why the IR spectrum of a carboxylic acid shows the O–H absorption at a lower wavenumber (2500–3300 cm⁻¹) and much broader than the O–H absorption in an alcohol (3200–3550 cm⁻¹), using hydrogen bonding to account for both the shift and the broadening.","A":"The carboxylic acid O–H is at lower wavenumber because the O–H bond is longer and weaker than in an alcohol","B":"Carboxylic acids exist predominantly as centrosymmetric dimers in the liquid phase: two O–H···O=C hydrogen bonds link pairs of –COOH groups. This extensive hydrogen bonding (stronger and more ordered than in alcohols) elongates the O–H bond and lowers its vibrational frequency, shifting the absorption to lower wavenumber (2500–3300 cm⁻¹). The spread of H-bonding strengths in the dynamic liquid mixture distributes the vibrational frequency over a wider range, producing greater breadth than in alcohol O–H","C":"The carboxylic acid O–H is at lower wavenumber simply because the molecule is heavier — more mass means lower frequency","D":"The carboxylic acid O–H and alcohol O–H absorb at the same wavenumber; the apparent difference is because the acid C–H peak overlaps with the O–H in the same region","correct":"B","explain":"The key physics: bond strength ↔ vibrational frequency via the Hooke's law analogy (f ∝ √(k/μ), where k = force constant related to bond strength). Hydrogen bonding in the carboxylic acid dimer is stronger and more extensive than in isolated alcohol molecules — each –COOH donates and accepts one H-bond, creating a ring structure. These strong H-bonds elongate the O–H bond and reduce its restoring force (lower k), which lowers the vibrational frequency and shifts the absorption to lower wavenumber (2500–3300 vs 3200–3550 cm⁻¹ for alcohols). The breadth arises because in the liquid phase, molecules are in a dynamic range of H-bonding environments (some dimers, some monomers, some oligomers). Each environment gives a slightly different O–H bond length and frequency. The superposition of all these slightly different frequencies produces the observed very broad absorption spanning ~800 cm⁻¹."},{"stem":"The M+1 peak of compound G (M⁺ at m/z = 70) has a relative abundance of 5.5% (relative to M⁺ = 100%). (a) Calculate the number of carbon atoms in G. (b) If the only elements present are C and H, determine the molecular formula. (c) G decolourises bromine water and has no IR absorption above 1500 cm⁻¹ other than C–H stretches. Identify G.","A":"n = 5 carbons; molecular formula C₅H₁₀; compound G is pent-1-yne (a terminal alkyne)","B":"(a) n = 5.5/1.1 = <b>5 carbon atoms</b>. (b) 5C = 60 mass units; remaining = 70 − 60 = 10H → molecular formula <b>C₅H₁₀</b> (Mr = 70 ✓); DoU = (2×5+2−10)/2 = 1. (c) Decolourises Br₂(aq) → C=C (eliminates cycloalkane); no IR above 1500 cm⁻¹ other than C–H → no O–H, C=O, or C≡C–H (~3300 cm⁻¹) → G is a <b>pentene isomer</b> (e.g. pent-1-ene)","C":"n = 6 carbons (error: 5.5/1.1 misread); molecular formula C₆H₁₂; hex-1-ene (Mr = 84)","D":"n = 5 carbons; molecular formula C₅H₁₀; compound G is cyclopentane (a cycloalkane)","correct":"B","explain":"(a) n = 5.5/1.1 = <b>5 carbon atoms</b>. (b) 5C contributes 5 × 12 = 60 mass units. Remaining = 70 − 60 = 10 → with only C and H, H count = 10 → <b>C₅H₁₀</b> (Mr = 70 ✓). Degree of unsaturation = (2×5 + 2 − 10)/2 = 1 → one ring or one C=C. (c) Decolourises Br₂(aq) → C=C is present (cycloalkanes do not decolourise Br₂ water), so the DoU is from a C=C, not a ring. G is a <b>pentene isomer</b>. Option A is wrong: pent-1-yne has a terminal ≡C–H, which produces an IR absorption at ~3300 cm⁻¹ — but the spectrum shows no absorptions above 1500 cm⁻¹ other than C–H. Option C is wrong: 5.5/1.1 = 5, not 6; hex-1-ene has M+ = 84. Option D is wrong: cyclopentane (a cycloalkane) has no C=C and would not decolourise bromine water."},{"stem":"A breathalyser registers 0.35 mg per 100 mL of breath as ethanol. The legal driving limit in England is 35 μg per 100 mL of breath. Is the driver over the limit? By what factor? Explain the chemistry of how the breathalyser detected ethanol.","A":"0.35 mg = 350 μg per 100 mL, which is 10 times the limit (35 μg). Over the limit by a factor of 10","B":"0.35 mg = 0.35 μg per 100 mL, which is just below the limit. Not over the limit","C":"Units cannot be compared; mg and μg are incompatible units","D":"0.35 mg = 35 μg exactly; the driver is at the limit but not over","correct":"A","explain":"<b>Unit conversion</b>: 1 mg = 1000 μg, so 0.35 mg = <b>350 μg</b> per 100 mL. The legal limit is 35 μg per 100 mL. 350 / 35 = <b>10 times over the limit</b>. The driver is well over the limit. <b>Chemistry of detection</b>: (1) The driver exhales into the breathalyser. (2) Breath passes through an IR cell. (3) An IR source shines through the cell; a detector measures transmittance at ~1050 cm⁻¹ (C–O stretching vibration of ethanol). (4) The greater the concentration of ethanol in the breath, the greater the absorption (the lower the % transmittance) at 1050 cm⁻¹. (5) The absorbance is calibrated against known ethanol concentrations to give a quantitative reading. Cross-checks at ~2950 cm⁻¹ (C–H) confirm ethanol is the absorbing species and distinguish it from breath acetone (which has a different IR pattern). The system is non-destructive and the sample can be retained for re-analysis."},{"stem":"A candidate writes: \"The IR spectrum shows an absorption at 1715 cm⁻¹, which indicates a carbonyl group is present, so the compound is an aldehyde or ketone.\" Evaluate this reasoning and state what additional evidence would be needed to: (a) confirm it is not a carboxylic acid; (b) distinguish aldehyde from ketone; (c) confirm it is not an ester.","A":"The reasoning is complete; no additional evidence is needed","B":"The reasoning is partially correct but incomplete. (a) Check for a <b>very broad O–H absorption at 2500–3300 cm⁻¹</b>: if present, the compound is a carboxylic acid (both C=O and very broad O–H). If absent, a carboxylic acid is ruled out. (b) Use <b>Tollens' reagent</b>: a silver mirror confirms aldehyde; no reaction confirms ketone. Alternatively, compare fragmentation patterns (aldehyde shows CHO⁺ at m/z = 29; ketone shows acylium peaks). (c) Ester C=O typically appears at ~1735 cm⁻¹ (slightly higher than 1715 cm⁻¹); check for C–O–C absorption in the fingerprint region (~1200 cm⁻¹) without any O–H","C":"The reasoning is wrong; 1715 cm⁻¹ indicates an alcohol, not a carbonyl","D":"The reasoning is correct for carboxylic acids only; aldehydes and ketones absorb at different wavenumbers","correct":"B","explain":"The candidate's reasoning correctly identifies a C=O group (1715 cm⁻¹ falls in the 1630–1820 cm⁻¹ C=O range) but is <b>incomplete</b> — the same wavenumber region is shared by aldehydes, ketones, carboxylic acids, and esters. (a) <b>Ruling out carboxylic acid</b>: look for the very broad O–H absorption at 2500–3300 cm⁻¹. Its presence alongside C=O = carboxylic acid; its absence rules the acid out. (b) <b>Aldehyde vs ketone</b>: Tollens' reagent (ammoniacal AgNO₃) distinguishes them chemically (silver mirror = aldehyde); alternatively in the MS, a CHO⁺ peak at m/z = 29 from α-cleavage is diagnostic for an aldehyde. (c) <b>Ruling out ester</b>: esters typically absorb at slightly higher wavenumber (~1735 cm⁻¹) and show a C–O–C stretching peak at ~1200 cm⁻¹; no O–H of any kind is present. The June 2024 H432/02 mark scheme rewards Level 3 answers that cite both the wavenumber and the bond, and use absence of peaks to rule out alternatives."},{"stem":"Account quantitatively for the M+2 peak in the mass spectrum of chloroethane (CH₃CH₂³⁵Cl / CH₃CH₂³⁷Cl). Show that the M : M+2 ratio should be approximately 3 : 1.","A":"³⁵Cl is 75% and ³⁷Cl is 25% of natural chlorine. For chloroethane: M⁺ contains ³⁵Cl → relative abundance proportional to 75; M+2⁺ contains ³⁷Cl → proportional to 25. Ratio M : M+2 = 75 : 25 = 3 : 1","B":"The M+2 peak arises from ¹³C, not from ³⁷Cl; two ¹³C atoms in chloroethane give the M+2 peak","C":"The ratio M : M+2 = 1 : 1 because both isotopes of chlorine are equally abundant","D":"The M+2 peak is always exactly half the height of M⁺ regardless of the element","correct":"A","explain":"Natural chlorine: ³⁵Cl ≈ <b>75%</b> and ³⁷Cl ≈ <b>25%</b>. For a compound containing exactly <b>one chlorine atom</b>, the molecular ion cluster consists of: (1) <b>M⁺</b> = molecule containing ³⁵Cl → relative abundance ∝ 75 (probability of picking a ³⁵Cl from natural Cl). (2) <b>M+2⁺</b> = molecule containing ³⁷Cl (two more mass units than ³⁵Cl) → relative abundance ∝ 25. Therefore <b>M : M+2 = 75 : 25 = 3 : 1</b>. This 3 : 1 doublet is instantly recognisable in any mass spectrum and is the fastest method of confirming that the compound contains chlorine. Two chlorine atoms would give three peaks (M, M+2, M+4) in approximately 9 : 6 : 1 ratio (from the expansion of (3+1)² = 9+6+1 in terms of ³⁵Cl²:³⁵Cl³⁷Cl:³⁷Cl²). The M+2 peak from ¹³C (option B) is tiny (~1.1% per carbon atom) and is a different, much smaller feature entirely unrelated to the 3:1 chlorine doublet."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
