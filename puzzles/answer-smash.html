<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemistry Cracked — Answer Smash</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pr:#7c3aed;--pr-dk:#5b21b6;--pr-lt:#f3e8ff;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--r:14px;--sh:0 2px 12px rgba(124,58,237,.08);--sh2:0 8px 28px rgba(124,58,237,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}

.topbar{background:#0d1b3e;color:#fff;padding:.6rem 1.5rem;display:flex;align-items:center;gap:.8rem}
.topbar-back{color:rgba(255,255,255,.75);text-decoration:none;font-size:.82rem;font-weight:700;border:1px solid rgba(255,255,255,.3);padding:.22rem .7rem;border-radius:20px;transition:background .15s}
.topbar-back:hover{background:rgba(255,255,255,.12)}
.topbar-title{font-size:.88rem;font-weight:600;opacity:.65}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2e1065 0%,#5b21b6 45%,#7c3aed 80%,#8b5cf6 100%);color:#fff;padding:2.2rem 1.5rem 4.8rem;text-align:center}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero h1{font-size:1.9rem;font-weight:900;letter-spacing:-.02em;margin-bottom:.3rem;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.hero p{font-size:.95rem;opacity:.87;font-weight:600}
.hero-wave{position:absolute;bottom:-1px;left:0;width:100%;height:52px;pointer-events:none}

main{flex:1;max-width:660px;margin:0 auto;padding:1.8rem 1.2rem 4rem;width:100%}

/* Status */
.status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.3rem;gap:1rem}
.progress-wrap{flex:1}
.progress-label{font-size:.78rem;font-weight:700;color:var(--txm);margin-bottom:.35rem}
.progress-bar{height:7px;background:var(--bdr);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pr-dk),var(--pr));border-radius:10px;transition:width .4s ease}
.score-badge{background:linear-gradient(135deg,#2e1065,#7c3aed);color:#fff;border-radius:12px;padding:.5rem 1.1rem;text-align:center;flex-shrink:0;min-width:70px}
.score-num{font-size:1.5rem;font-weight:900;line-height:1}
.score-lbl{font-size:.66rem;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.06em}

/* Question card */
.q-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);border:1.5px solid var(--bdr);overflow:hidden}

.q-instruction{padding:.85rem 1.3rem .6rem;background:var(--pr-lt);border-bottom:1.5px solid #e9d5ff;font-size:.82rem;font-weight:800;color:var(--pr);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:.4rem}

/* Smash display */
.smash-area{display:grid;grid-template-columns:1fr auto 1fr;gap:.7rem;align-items:center;padding:1.2rem 1.1rem .9rem}

/* Element tile */
.el-tile{background:linear-gradient(155deg,#1e3a5f,#2563eb);color:#fff;border-radius:10px;padding:.7rem .8rem .65rem;text-align:center;box-shadow:0 3px 10px rgba(37,99,235,.3)}
.el-num{font-size:.68rem;font-weight:700;opacity:.75;margin-bottom:.1rem}
.el-sym{font-size:2rem;font-weight:900;line-height:1;margin-bottom:.15rem}
.el-name{font-size:.72rem;font-weight:700;opacity:.85}

/* Chemistry card (non-element) */
.chem-card{background:linear-gradient(155deg,#2e1065,#7c3aed);color:#fff;border-radius:10px;padding:.75rem .9rem .7rem;text-align:center;box-shadow:0 3px 10px rgba(124,58,237,.3)}
.chem-icon{font-size:1.5rem;line-height:1;margin-bottom:.25rem}
.chem-name{font-size:1.05rem;font-weight:900;line-height:1.2}
.chem-sub{font-size:.7rem;font-weight:600;opacity:.78;margin-top:.18rem}

/* Plus sign */
.smash-plus{font-size:2rem;font-weight:900;color:#c4b5fd;text-align:center;flex-shrink:0}

/* Clue box */
.clue-box{background:linear-gradient(155deg,#064e3b,#059669);color:#fff;border-radius:10px;padding:.75rem .9rem;box-shadow:0 3px 10px rgba(5,150,105,.3)}
.clue-label{font-size:.66rem;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.3rem}
.clue-text{font-size:.88rem;font-weight:700;line-height:1.45}

/* Equals row */
.equals-row{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.2rem 1.1rem .9rem;font-size:.88rem;font-weight:700;color:var(--txm)}
.eq-smash{font-size:1.7rem;font-weight:900;color:var(--pr);letter-spacing:.03em}

/* Options */
.opts-wrap{padding:.1rem 1.1rem 1.2rem}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.opt-btn{background:#fff;border:2px solid var(--bdr);border-radius:10px;padding:.65rem .8rem;font-size:.95rem;font-weight:800;color:var(--tx);cursor:pointer;text-align:center;transition:background .12s,border-color .12s,color .12s;font-family:inherit;letter-spacing:.02em;line-height:1.3;word-break:break-word}
.opt-btn:hover:not(:disabled){background:var(--pr-lt);border-color:#c4b5fd;color:var(--pr)}
.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534!important}
.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b!important}
.opt-btn:disabled{cursor:default}

/* Feedback */
.feedback{margin:0 1.1rem .7rem;border-radius:10px;padding:.8rem 1rem;font-size:.88rem;font-weight:700;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.correct{background:#dcfce7;color:#166534;border:1.5px solid #86efac}
.feedback.wrong{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5}
.smash-breakdown{margin-top:.5rem;font-size:1.05rem;letter-spacing:.04em}
.bd-w1{color:#1d4ed8;font-weight:900}
.bd-ov{color:#7c3aed;font-weight:900;background:rgba(124,58,237,.12);border-radius:4px;padding:0 2px}
.bd-w2{color:#065f46;font-weight:900}
.bd-info{font-size:.75rem;font-weight:600;opacity:.7;margin-top:.3rem}

.btn-next{display:block;margin:.8rem 1.1rem 1.1rem auto;background:linear-gradient(135deg,var(--pr-dk),var(--pr));color:#fff;border:none;border-radius:10px;padding:.62rem 1.5rem;font-size:.92rem;font-weight:800;cursor:pointer;transition:opacity .15s,transform .12s;font-family:inherit;float:right}
.btn-next:hover{opacity:.9;transform:translateY(-1px)}
.clearfix::after{content:'';display:table;clear:both}

/* End screen */
.end-screen{display:none;text-align:center;padding:2.5rem 1rem 1rem}
.end-screen.show{display:block}
.end-trophy{font-size:3.5rem;margin-bottom:.7rem}
.end-title{font-size:1.55rem;font-weight:900;margin-bottom:.5rem}
.end-score{font-size:3.2rem;font-weight:900;color:var(--pr);line-height:1}
.end-max{font-size:.88rem;color:var(--txm);margin-bottom:1.4rem;margin-top:.15rem}
.end-msg{font-size:.95rem;font-weight:600;color:var(--txm);max-width:360px;margin:0 auto 2rem;line-height:1.55}
.btn-play-again{background:linear-gradient(135deg,var(--pr-dk),var(--pr));color:#fff;border:none;border-radius:12px;padding:.85rem 2.2rem;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .12s}
.btn-play-again:hover{opacity:.9;transform:translateY(-2px)}

footer{text-align:center;padding:1.3rem;font-size:.78rem;color:var(--txm);border-top:1px solid var(--bdr);background:var(--card);font-weight:600;margin-top:auto}
footer a{color:var(--pr);text-decoration:none}

@media(max-width:480px){.smash-area{grid-template-columns:1fr;grid-template-rows:auto auto auto}.smash-plus{transform:rotate(90deg)}.options-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.el-sym{font-size:1.6rem}}
</style>
</head>
<body>

<div class="topbar">
  <a href="../puzzles.html" class="topbar-back">&#8592; Puzzles</a>
  <span class="topbar-title">Answer Smash</span>
</div>

<div class="hero">
  <div class="hero-inner">
    <svg style="display:block;width:52px;height:52px;margin:0 auto .75rem;filter:drop-shadow(0 3px 10px rgba(0,0,0,.3))" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="10" width="20" height="32" rx="4" fill="rgba(255,255,255,.22)" stroke="white" stroke-width="2.2"/>
      <text x="13" y="30" font-family="Nunito,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">Zn</text>
      <text x="26" y="28" font-family="Nunito,sans-serif" font-size="20" font-weight="900" fill="rgba(255,255,255,.7)" text-anchor="middle">+</text>
      <rect x="29" y="10" width="20" height="32" rx="4" fill="rgba(255,255,255,.22)" stroke="white" stroke-width="2.2"/>
      <text x="39" y="30" font-family="Nunito,sans-serif" font-size="10" font-weight="900" fill="white" text-anchor="middle">clue</text>
    </svg>
    <h1>Answer Smash</h1>
    <p>Combine the chemistry clue and the description into one smashed word!</p>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 52" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,26 C240,52 480,0 720,26 C960,52 1200,0 1440,26 L1440,52 L0,52 Z" fill="#f4f6fb"/>
  </svg>
</div>

<main>

<div id="game">
  <div class="status-bar">
    <div class="progress-wrap">
      <div class="progress-label" id="progress-label">Question 1 of 10</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="score-badge">
      <div class="score-num" id="score-num">0</div>
      <div class="score-lbl">pts</div>
    </div>
  </div>

  <div class="q-card">
    <div class="q-instruction">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Smash the two answers together!
    </div>

    <div class="smash-area">
      <div id="visual1"></div>
      <div class="smash-plus">+</div>
      <div class="clue-box">
        <div class="clue-label">&#128270; What is it?</div>
        <div class="clue-text" id="clue-text"></div>
      </div>
    </div>

    <div class="equals-row">
      <span style="font-size:1.5rem;color:#c4b5fd">=</span>
      <span class="eq-smash">?</span>
    </div>

    <div class="opts-wrap">
      <div class="options-grid" id="options-grid"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="clearfix">
      <button class="btn-next" id="btn-next" style="display:none">Next question &#8250;</button>
    </div>
  </div>
</div>

<div class="end-screen" id="end-screen">
  <div class="end-trophy" id="end-trophy">&#127942;</div>
  <div class="end-title">Smashing work!</div>
  <div class="end-score" id="end-score">0</div>
  <div class="end-max" id="end-max">out of 10</div>
  <div class="end-msg" id="end-msg"></div>
  <button class="btn-play-again" onclick="startGame()">Play again &#8635;</button>
</div>

</main>

<footer>
  Chemistry Cracked Puzzles &nbsp;&bull;&nbsp; <a href="../puzzles.html">&#8592; Back to puzzles</a>
</footer>

<script>
const ALL_Q = [
  {
    word1:'ZINC', word2:'INCORRECT', smash:'ZINCORRECT', overlap:'INC',
    visual:{type:'element', symbol:'Zn', name:'Zinc', number:30},
    clue:'Not right; the opposite of accurate',
    opts:['ZINCORRECT','ZINCSENTIAL','ZINCEPTABLE','ZINCOGNITO']
  },
  {
    word1:'TIN', word2:'INDICATOR', smash:'TINDICATOR', overlap:'IN',
    visual:{type:'element', symbol:'Sn', name:'Tin', number:50},
    clue:'Something that points to or signals a trend or level',
    opts:['TINDICATOR','TINTUITION','TINVENTION','TINSPECTOR']
  },
  {
    word1:'NICKEL', word2:'ELECTRON', smash:'NICKELECTRON', overlap:'EL',
    visual:{type:'element', symbol:'Ni', name:'Nickel', number:28},
    clue:'A subatomic particle carrying a negative charge',
    opts:['NICKELECTRON','NICKELUSIVE','NICKELEGANT','NICKELOQUENT']
  },
  {
    word1:'SILICON', word2:'ONION', smash:'SILICONION', overlap:'ON',
    visual:{type:'element', symbol:'Si', name:'Silicon', number:14},
    clue:'A pungent bulb vegetable that can make your eyes water',
    opts:['SILICONION','SILICONQUER','SILICONJURE','SILICONTACT']
  },
  {
    word1:'CHLORINE', word2:'INERT', smash:'CHLORINERT', overlap:'INE',
    visual:{type:'element', symbol:'Cl', name:'Chlorine', number:17},
    clue:'Not reactive; unlikely to take part in chemical reactions',
    opts:['CHLORINERT','CHLORINEER','CHLORINIST','CHLORINEPT']
  },
  {
    word1:'OXYGEN', word2:'GENIUS', smash:'OXYGENIUS', overlap:'GEN',
    visual:{type:'element', symbol:'O', name:'Oxygen', number:8},
    clue:'A person of exceptional intelligence or remarkable talent',
    opts:['OXYGENIUS','OXYGENUINE','OXYGENTLE','OXYGENTEEL']
  },
  {
    word1:'ALKALI', word2:'ALIBI', smash:'ALKALIBI', overlap:'ALI',
    visual:{type:'card', name:'ALKALI', sub:'soluble base, pH &gt; 7', icon:'base'},
    clue:"A claim that you were somewhere else at the time of a crime",
    opts:['ALKALIBI','ALKALIBERAL','ALKALIBRATE','ALKALIBRARY']
  },
  {
    word1:'ETHANOL', word2:'OLIVE', smash:'ETHANOLIVE', overlap:'OL',
    visual:{type:'card', name:'ETHANOL', sub:'C&#8322;H&#8325;OH', icon:'chem'},
    clue:'A small Mediterranean fruit often pressed to make cooking oil',
    opts:['ETHANOLIVE','ETHANOLYMPIC','ETHANOLOGIST','ETHANOLOGICAL']
  },
  {
    word1:'ATOM', word2:'TOMATO', smash:'ATOMATO', overlap:'TOM',
    visual:{type:'card', name:'ATOM', sub:'smallest unit of an element', icon:'atom'},
    clue:'A red salad fruit often used in pasta sauces and sandwiches',
    opts:['ATOMATO','ATOMANGO','ATOMELERY','ATOMORANGE']
  },
  {
    word1:'GAS', word2:'ASTRONOMY', smash:'GASTRONOMY', overlap:'AS',
    visual:{type:'card', name:'GAS', sub:'state of matter', icon:'gas'},
    clue:'The scientific study of stars, planets and the universe',
    opts:['GASTRONOMY','GASTONISHING','GASTROPHYSICS','GASGEOLOGY']
  },
  {
    word1:'FLAME', word2:'AMERICA', smash:'FLAMERICA', overlap:'AME',
    visual:{type:'card', name:'FLAME TEST', sub:'identifies metal ions', icon:'flame'},
    clue:'The country with the Stars and Stripes flag',
    opts:['FLAMERICA','FLAMENGLAND','FLAMEXICO','FLAMETHYST']
  },
  {
    word1:'BENZENE', word2:'ENERGY', smash:'BENZENERGY', overlap:'ENE',
    visual:{type:'card', name:'BENZENE', sub:'C&#8326;H&#8326;, ring structure', icon:'chem'},
    clue:'The ability to do work; measured in joules',
    opts:['BENZENERGY','BENZENTERTAIN','BENZENCHANT','BENZENFORCE']
  },
  {
    word1:'ALKENE', word2:'ENEMY', smash:'ALKENEMY', overlap:'ENE',
    visual:{type:'card', name:'ALKENE', sub:'C=C double bond', icon:'chem'},
    clue:'A rival, opponent or adversary',
    opts:['ALKENEMY','ALKENERGETIC','ALKENEIGHBOR','ALKENERGISED']
  },
  {
    word1:'POLYMER', word2:'MERCURY', smash:'POLYMERCURY', overlap:'MER',
    visual:{type:'card', name:'POLYMER', sub:'large molecule, repeating units', icon:'chem'},
    clue:'The closest planet to the Sun, or a liquid metal element',
    opts:['POLYMERCURY','POLYMERCHANT','POLYMERITAGE','POLYMERMALADE']
  },
  {
    word1:'ELEMENT', word2:'ENTHALPY', smash:'ELEMENTHALPY', overlap:'ENT',
    visual:{type:'card', name:'ELEMENT', sub:'one type of atom only', icon:'chem'},
    clue:'The heat energy content of a system (symbol: H)',
    opts:['ELEMENTHALPY','ELEMENTROPY','ELEMENTRANCE','ELEMENTANGLE']
  },
];

const GAME_SIZE = 10;
let gameQs, qi, totalScore, answered;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function startGame(){
  gameQs = shuffle(ALL_Q).slice(0, GAME_SIZE);
  qi = 0; totalScore = 0;
  document.getElementById('score-num').textContent = '0';
  document.getElementById('game').style.display = '';
  document.getElementById('end-screen').classList.remove('show');
  renderQ();
}

function buildVisualHTML(v){
  if(v.type === 'element'){
    return `<div class="el-tile"><div class="el-num">${v.number}</div><div class="el-sym">${v.symbol}</div><div class="el-name">${v.name}</div></div>`;
  }
  // chemistry card
  let iconHTML = '';
  switch(v.icon){
    case 'atom':
      iconHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linecap="round"><circle cx="14" cy="14" r="3" fill="white" stroke="none"/><ellipse cx="14" cy="14" rx="13" ry="5"/><ellipse cx="14" cy="14" rx="13" ry="5" transform="rotate(60 14 14)"/><ellipse cx="14" cy="14" rx="13" ry="5" transform="rotate(120 14 14)"/></svg>';
      break;
    case 'flame':
      iconHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3c0 5-7 7-5 14 1.5 5 5.5 8 5.5 8s4-3 5.5-8c2-7-5-9-5-14z"/><path d="M14 17a2.5 2.5 0 000 5" stroke-width="1.5" opacity=".7"/></svg>';
      break;
    case 'base':
      iconHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22L12 6h4l4 16"/><line x1="9.5" y1="16" x2="18.5" y2="16"/><circle cx="14" cy="4" r="1.8" fill="rgba(255,255,255,.7)" stroke="none"/></svg>';
      break;
    case 'gas':
      iconHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="12" r="3.5"/><circle cx="18" cy="10" r="3.5"/><circle cx="14" cy="18" r="3.5"/></svg>';
      break;
    default:
      iconHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22l4-4 8-8 4-4"/><path d="M10 18l-4 4"/><circle cx="20" cy="8" r="3"/><path d="M14 6l2 2-6 6-2-2z" fill="rgba(255,255,255,.2)"/></svg>';
  }
  return `<div class="chem-card"><div class="chem-icon">${iconHTML}</div><div class="chem-name">${v.name}</div><div class="chem-sub">${v.sub}</div></div>`;
}

function renderQ(){
  const q = gameQs[qi];
  answered = false;

  document.getElementById('progress-label').textContent = `Question ${qi+1} of ${GAME_SIZE}`;
  document.getElementById('progress-fill').style.width = (qi / GAME_SIZE * 100) + '%';

  document.getElementById('visual1').innerHTML = buildVisualHTML(q.visual);
  document.getElementById('clue-text').textContent = q.clue;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';

  // Options
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  shuffle(q.opts).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.dataset.val = opt;
    btn.addEventListener('click', () => pick(btn, q, grid));
    grid.appendChild(btn);
  });
}

function pick(btn, q, grid){
  if(answered) return;
  answered = true;

  grid.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if(b.dataset.val === q.smash) b.classList.add('correct');
  });

  const isCorrect = btn.dataset.val === q.smash;
  if(!isCorrect) btn.classList.add('wrong');
  if(isCorrect){ totalScore++; document.getElementById('score-num').textContent = totalScore; }

  // Build breakdown
  const ov = q.overlap;
  const w1pre = q.word1.slice(0, q.word1.length - ov.length);
  const w2suf = q.word2.slice(ov.length);

  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect
    ? `&#10003; Correct! Well smashed!`
    : `&#10007; The smash was <strong>${q.smash}</strong>`;

  fb.innerHTML += `<div class="smash-breakdown">
    <span class="bd-w1">${w1pre}</span><span class="bd-ov">${ov}</span><span class="bd-w2">${w2suf}</span>
  </div>
  <div class="bd-info">${q.word1} + ${q.word2} = ${q.smash} &nbsp;(shared: ${ov})</div>`;

  document.getElementById('btn-next').style.display = '';
}

document.getElementById('btn-next').addEventListener('click', function(){
  qi++;
  if(qi >= GAME_SIZE) showEnd(); else renderQ();
});

function showEnd(){
  document.getElementById('game').style.display = 'none';
  document.getElementById('end-screen').classList.add('show');
  const max = GAME_SIZE;
  const pct = totalScore / max;
  document.getElementById('end-score').textContent = totalScore;
  document.getElementById('end-max').textContent = 'out of ' + max;
  let trophy, msg;
  if(pct >= 0.9){ trophy = '&#129351;'; msg = 'Incredible — you smashed it! Every chemistry clue cracked and combined perfectly.'; }
  else if(pct >= 0.7){ trophy = '&#127942;'; msg = 'Great smashing! You clearly know your chemistry. Try again for a perfect score!'; }
  else if(pct >= 0.5){ trophy = '&#129353;'; msg = 'Good effort! Review the clues you found tricky and have another go.'; }
  else { trophy = '&#128170;'; msg = 'Keep practising — the more chemistry you know, the easier the smashes become!'; }
  document.getElementById('end-trophy').innerHTML = trophy;
  document.getElementById('end-msg').textContent = msg;
}

startGame();
</script>
