<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

<body>

  <h1>2.5 &mdash; Shapes of Molecules and Ions</h1>

</header>
<main>
  <div class="quiz-meta">
    <span>6 questions</span>
    <span>Inferno &mdash; Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>

  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Predict the shape and bond angle of the sulfate ion, SO₄²⁻.","A":"Bent, 104.5° — sulfur has lone pairs just like oxygen in H₂O","B":"Trigonal pyramidal, 107° — the 2− charge adds two extra electrons to the central atom","C":"Tetrahedral, 109.5°","D":"Octahedral, 90° — sulfur uses six bonds to the four oxygen atoms","correct":"C","explain":"Count electron regions around the central S atom in SO₄²⁻: S forms four bonds to O (4 bonded pairs) and the −2 charge is distributed across the four O atoms, not stored as lone pairs on S. So S has 4 bonded regions and 0 lone pairs → tetrahedral geometry, 109.5°. A common error is to assume the 2− charge gives S two lone pairs (as in water) — but the charge is in the bonded O–S framework. NH₄⁺ (also tetrahedral, 109.5°) is the positive-ion analogue: the extra charge does not add lone pairs to the central atom."},{"stem":"The boiling point of ammonia (NH₃, Mr = 17) is −33°C, while that of nitrogen (N₂, Mr = 28) is −196°C. Explain why NH₃ has a considerably higher boiling point despite having a lower molar mass.","A":"NH₃ has a higher molar mass than N₂, so its London forces are stronger","B":"N₂ has a triple bond which uses up all available electrons, preventing intermolecular attractions","C":"NH₃ molecules form hydrogen bonds (H bonded to N; lone pair on N of adjacent molecule); N₂ molecules can only form London forces, which are much weaker","D":"NH₃ is a polar molecule and N₂ is non-polar; permanent dipole forces in NH₃ are always stronger than London forces in N₂","correct":"C","explain":"N₂ is a non-polar diatomic molecule — only London forces act between its molecules. NH₃ has H bonded to N and N has a lone pair, so it satisfies both hydrogen bonding conditions: H–N···N hydrogen bonds form between adjacent NH₃ molecules. Hydrogen bonds are significantly stronger than London forces. Even though N₂ (Mr = 28) has more electrons per molecule than NH₃ (Mr = 17) and therefore stronger London forces than NH₃ would have alone, the hydrogen bonding in NH₃ dominates and more than compensates, giving the much higher boiling point. Distractor D is partly true but incomplete — it doesn't identify hydrogen bonding specifically."},{"stem":"Xenon tetrafluoride (XeF₄) has six electron regions around Xe. Predict its shape, bond angle, and explain why it is not tetrahedral.","A":"Tetrahedral, 109.5° — four F atoms bonded, so shape must be tetrahedral","B":"Octahedral, 90° — six electron regions always give an octahedral shape","C":"Square planar, 90°","D":"Trigonal bipyramidal, 90° and 120° — five pairs of electrons including one lone pair","correct":"C","explain":"Xe has 8 valence electrons; 4 are used in bonds to F, leaving 4 non-bonding electrons = 2 lone pairs. Total regions: 4BP + 2LP = 6 → underlying octahedral geometry. The two lone pairs adopt positions that maximise the angle between them: they sit on opposite sides of Xe (180° apart, trans positions) to minimise the strong lone pair–lone pair repulsion. This pushes the four F atoms into a flat square in the equatorial plane → square planar, 90°. The shape is NOT tetrahedral (4BP, 0LP) because XeF₄ has additional lone pairs that reshape the geometry."},{"stem":"The Pauling electronegativity values are: Na = 0.9, H = 2.1, Cl = 3.0, I = 2.5. Rank the bonds Na–Cl, H–Cl, H–I, and H–H in order of decreasing polarity, and classify each bond type.","A":"Na–Cl > H–Cl > H–I > H–H; all are polar covalent bonds","B":"H–Cl > Na–Cl > H–I > H–H; Na–Cl and H–Cl are ionic, rest are covalent","C":"Na–Cl > H–Cl > H–I > H–H; Na–Cl is ionic, H–Cl and H–I are polar covalent, H–H is non-polar covalent","D":"H–Cl > H–I > Na–Cl > H–H; H–Cl is most polar because Cl is most electronegative","correct":"C","explain":"Calculate Δχ for each bond: Na–Cl = |3.0 − 0.9| = 2.1; H–Cl = |3.0 − 2.1| = 0.9; H–I = |2.5 − 2.1| = 0.4; H–H = |2.1 − 2.1| = 0.0. Decreasing Δχ → decreasing polarity: Na–Cl > H–Cl > H–I > H–H. Bond character: Δχ > 1.7 → ionic (Na–Cl, 2.1); Δχ 0.3–1.7 → polar covalent (H–Cl, H–I); Δχ < 0.3 → non-polar covalent (H–H). Na–Cl has Δχ = 2.1, putting it in the ionic range — consistent with NaCl being a solid ionic lattice."},{"stem":"Water (bp = 100°C) has a much higher boiling point than hydrogen sulfide (bp = −60°C), despite H₂S having a higher molar mass (Mr 34 vs 18). Account for this anomaly.","A":"H₂O molecules have stronger London forces because the O–H bond is more polarisable than the S–H bond","B":"H₂O molecules form hydrogen bonds (H bonded to O; lone pair on O of adjacent molecule) whereas H₂S cannot form hydrogen bonds because S is not electronegative enough; London forces in H₂S are insufficient to compensate","C":"The S–H bond in H₂S is weaker than O–H in H₂O, allowing H₂S molecules to drift apart at lower temperatures","D":"H₂O has ionic character from the highly polar O–H bond, giving it stronger ion–ion attractions than the covalent H₂S","correct":"B","explain":"O (χ = 3.5) is electronegative enough to qualify for hydrogen bonding (condition: H bonded to N, O, or F). S (χ = 2.5) does not qualify. In liquid water, an extensive network of H–O···H hydrogen bonds links molecules — much stronger than London forces or permanent dipole-dipole interactions. H₂S has only London forces + weak permanent dipole-dipole forces. Although H₂S has more electrons per molecule (18 vs 10 for H₂O) and therefore stronger London forces than water would have alone, the hydrogen bonding in H₂O is overwhelmingly stronger, raising the boiling point by ~160°C above the expected trend."},{"stem":"Boron trifluoride (BF₃) contains three polar B–F bonds (χ_B = 2.0, χ_F = 4.0, Δχ = 2.0). A student argues that BF₃ must be polar. Evaluate this claim.","A":"Correct — Δχ = 2.0 > 1.7 means the B–F bonds are ionic, making the molecule highly polar","B":"Correct — three polar bonds always produce a polar molecule","C":"Incorrect — BF₃ is trigonal planar (3BP, 0LP, bond angle 120°); the three equal B–F bond dipoles point outward at 120° to each other and cancel exactly, giving a net dipole of zero","D":"Incorrect — the lone pairs on F cancel the B–F bond dipoles","correct":"C","explain":"Each B–F bond is polar (Δχ = 2.0), so there are three bond dipoles pointing from B toward each F. However, BF₃ is trigonal planar: three bonded pairs, zero lone pairs, 120° bond angles. The three identical dipoles are symmetrically arranged at 120° to each other — they add vectorially to zero. Net molecular dipole = 0 → BF₃ is non-polar. This is one of the most important conceptual points in Section 2.5: polar bonds do NOT automatically give a polar molecule — the geometry determines whether dipoles cancel. Compare with NH₃: also three equivalent bonds, but one lone pair makes it pyramidal, so the dipoles do not cancel → NH₃ is polar."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
