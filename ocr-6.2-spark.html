<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6.2 Carbonyl Chemistry | ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.2 Carbonyl Chemistry</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the organic product when ethanal (CH₃CHO) is heated under reflux with acidified potassium dichromate(VI) (K₂Cr₂O₇/H₂SO₄)?","A":"Ethanol (CH₃CH₂OH)","B":"Ethanoic acid (CH₃COOH)","C":"Ethanone","D":"Propanal (CH₃CH₂CHO)","correct":"B","explain":"Aldehydes are oxidised to <b>carboxylic acids</b> by acidified K₂Cr₂O₇ under heat and reflux: RCHO + [O] → RCOOH. For ethanal specifically: CH₃CHO + [O] → CH₃COOH. The [O] notation is mandatory in OCR equations for organic redox — do not try to balance the half-equation with Cr₂O₇²⁻ explicitly against the organic species. Option (A) is the wrong direction — reduction of ethanal gives ethanol; oxidation goes the other way. Option (C) does not exist as a compound. Option (D) would require a chain-lengthening reaction, which K₂Cr₂O₇ does not do."},{"stem":"What colour change is observed when an aldehyde is heated under reflux with acidified potassium dichromate(VI)?","A":"Yellow to colourless","B":"Colourless to blue","C":"Orange to green","D":"Green to orange","correct":"C","explain":"Acidified K₂Cr₂O₇ contains the orange dichromate(VI) ion (Cr₂O₇²⁻, Cr in oxidation state +6). When the aldehyde is oxidised, the dichromate is reduced to the green chromium(III) ion (Cr³⁺, oxidation state +3): <b>orange → green</b>. This colour change is the positive result for aldehyde oxidation, and also serves as a test to distinguish aldehydes (turns green) from ketones (stays orange, no reaction). Option (D) is the reverse, which would occur if Cr³⁺ were oxidised back — not relevant here."},{"stem":"Why is a ketone NOT oxidised by acidified potassium dichromate(VI) (K₂Cr₂O₇/H₂SO₄) under reflux?","A":"Ketones are insoluble in the aqueous acidified dichromate solution.","B":"The ketone has no H atom on the carbonyl carbon, so oxidation to a carboxylic acid would require breaking a C–C bond, which these conditions cannot achieve.","C":"Ketones are already at the maximum possible oxidation state for organic compounds.","D":"The C=O bond in a ketone is stronger than in an aldehyde and cannot be broken.","correct":"B","explain":"Oxidation of an aldehyde to a carboxylic acid involves replacing the C–H bond on the carbonyl carbon with C–OH (formally inserting an O into C–H). In a <b>ketone</b>, the carbonyl carbon is bonded to two carbon groups and carries <b>no H atom</b> — to oxidise further, a C–C bond would have to be broken. K₂Cr₂O₇/H₂SO₄ lacks the energy to cleave C–C bonds under reflux conditions, so ketones are unchanged and the dichromate <b>stays orange</b>. This orange/green test is therefore a diagnostic for aldehydes vs ketones."},{"stem":"Which nucleophile is supplied by NaBH₄ in a nucleophilic addition reaction with a carbonyl compound?","A":"Na⁺","B":"BH₄⁻ (tetrahydridoborate ion)","C":"H⁻ (hydride ion)","D":"OH⁻","correct":"C","explain":"NaBH₄ (sodium tetrahydridoborate) delivers the <b>hydride ion H⁻</b> as the nucleophile. H⁻ is a hydrogen atom carrying a lone pair and a negative charge — it is strongly nucleophilic and attacks the electrophilic carbonyl carbon (Cδ⁺). The BH₄⁻ ion as a whole is the reducing species, but the actual attacking nucleophile in the mechanism is H⁻. Na⁺ is a spectator ion. OH⁻ is a different nucleophile encountered in hydrolysis reactions. The overall reaction is written as RCHO + 2[H] → RCH₂OH using the [H] convention for reduction."},{"stem":"What is the product when propanone (CH₃COCH₃) is reduced by NaBH₄?","A":"Propan-1-ol (a primary alcohol)","B":"Propan-2-ol (a secondary alcohol)","C":"Propanal (an aldehyde)","D":"Propanoic acid (a carboxylic acid)","correct":"B","explain":"NaBH₄ reduction of a <b>ketone</b> gives a <b>secondary alcohol</b>. In propanone, the carbonyl carbon (C2) is flanked by two methyl groups; after H⁻ attack and protonation, the product is CH₃CH(OH)CH₃ — <b>propan-2-ol</b>, a secondary alcohol. This contrasts with NaBH₄ reduction of an aldehyde (RCHO), which gives a primary alcohol (RCH₂OH), because the aldehyde carbonyl carbon is at the end of the chain. The type of alcohol produced (primary vs secondary) is a useful diagnostic clue in the Inferno tier."},{"stem":"Which reagent detects the carbonyl group (C=O) in both aldehydes AND ketones?","A":"Tollens' reagent (ammoniacal silver nitrate)","B":"2,4-dinitrophenylhydrazine (Brady's reagent)","C":"Acidified potassium dichromate(VI) (K₂Cr₂O₇/H₂SO₄)","D":"Aqueous sodium carbonate","correct":"B","explain":"<b>2,4-DNPH (2,4-dinitrophenylhydrazine, Brady's reagent)</b> reacts with the C=O group in both aldehydes and ketones, giving a yellow, orange, or red crystalline precipitate in each case. It cannot on its own distinguish an aldehyde from a ketone — a second test (Tollens') is needed for that. Tollens' reagent only gives a positive result with aldehydes (not ketones). Acidified K₂Cr₂O₇ only oxidises aldehydes and primary/secondary alcohols; ketones give a negative result (no colour change). Na₂CO₃ is used to test for carboxylic acids, not carbonyls."},{"stem":"What is the correct observation when 2,4-DNPH (Brady's reagent) is added to a ketone?","A":"The solution turns from orange to green.","B":"A silver mirror forms on the inside of the test tube.","C":"A yellow, orange, or red precipitate forms.","D":"Colourless bubbles of gas are released.","correct":"C","explain":"2,4-DNPH reacts with the C=O group to form a <b>2,4-dinitrophenylhydrazone</b>, which is insoluble and crystallises out as a <b>yellow, orange, or red solid precipitate</b>. OCR accepts any of the three colour descriptions. The word <b>\"precipitate\"</b> must appear — a colour change alone (e.g., \"turns yellow\") is insufficient and will not earn the mark. Option (A) describes the K₂Cr₂O₇ colour change. Option (B) describes the Tollens' test. Option (D) describes the Na₂CO₃ test for carboxylic acids."},{"stem":"Which observation correctly identifies the presence of an aldehyde when Tollens' reagent is used?","A":"An orange precipitate forms immediately at room temperature.","B":"A silver mirror or grey/black precipitate of silver forms on warming the test tube.","C":"The solution turns from orange to green.","D":"The solution turns blue, indicating reduction.","correct":"B","explain":"When an aldehyde is warmed with Tollens' reagent [Ag(NH₃)₂]⁺ in a clean test tube at about 50–60 °C, the aldehyde is oxidised to a carboxylate while Ag⁺ is <b>reduced to silver metal</b>. The silver deposits as a <b>silver mirror</b> on the glass (if the test tube is clean) or as a <b>grey or black precipitate</b> (if the surface is rough). OCR accepts all three descriptions. A <b>ketone gives no reaction</b> (colourless solution unchanged). The Tollens' test must be prepared fresh and warmed gently in a water bath — never directly with a flame. Option (C) describes K₂Cr₂O₇; option (D) is not a feature of any carbonyl test on the OCR spec."},{"stem":"What type of organic product is formed when HCN adds to a ketone?","A":"An amine","B":"A primary alcohol","C":"A hydroxynitrile","D":"A carboxylic acid","correct":"C","explain":"In nucleophilic addition of HCN (provided as NaCN/H⁺), the cyanide ion CN⁻ attacks the electrophilic carbonyl carbon, and protonation of the resulting alkoxide gives a <b>hydroxynitrile</b> (cyanohydrin) — a molecule containing both an <b>–OH</b> group and a <b>–CN</b> group on the same carbon: R₂C(OH)CN. This is not an amine (which would require a nitrogen-only addition or reduction of a nitrile). It is not a primary alcohol (which results from NaBH₄ reduction of an aldehyde). Carboxylic acid is the product of oxidation of an aldehyde."},{"stem":"Which of the following reactions extends the carbon skeleton of the organic starting material by one carbon?","A":"NaBH₄ reduction of an aldehyde","B":"Oxidation of an aldehyde with K₂Cr₂O₇/H₂SO₄","C":"Addition of HCN to a carbonyl compound","D":"Reaction of a carbonyl with 2,4-DNPH","correct":"C","explain":"HCN addition is one of the <b>very few OCR reactions that lengthens the carbon chain</b>. The CN⁻ nucleophile contributes a carbon atom (plus nitrogen) to the new C–C bond formed at the carbonyl carbon. For example, ethanal (2 carbons) + HCN → 2-hydroxypropanenitrile (3 carbons). All the other options — NaBH₄ reduction, K₂Cr₂O₇ oxidation, and 2,4-DNPH — leave the number of carbon atoms unchanged; they modify functional groups without altering the carbon skeleton. The –CN group in the hydroxynitrile product can later be hydrolysed to –COOH or reduced to –CH₂NH₂, making HCN addition a key step in carbon-chain-building synthesis."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
