<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.6 Transition Elements | ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.6 Transition Elements</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the electron configuration of a chromium atom (Z = 24)?","A":"[Ar] 3d⁴ 4s²","B":"[Ar] 3d⁵ 4s¹","C":"[Ar] 3d⁵ 4s²","D":"[Ar] 3d⁶","correct":"B","explain":"Chromium adopts [Ar] 3d⁵ 4s¹ rather than the expected [Ar] 3d⁴ 4s². Promoting one 4s electron into the 3d sub-shell produces a half-filled 3d⁵ arrangement, which carries extra stability. Option A ([Ar] 3d⁴ 4s²) is the predicted configuration from simple filling order — it is the single most common wrong answer in Cr questions. Option C is the configuration of Mn (Z = 25, [Ar] 3d⁵ 4s²). Copper (Z = 29) shows the analogous anomaly: [Ar] 3d¹⁰ 4s¹ rather than the predicted [Ar] 3d⁹ 4s², because a completely filled d sub-shell also carries extra stability. Both anomalies must be memorised as specific exceptions to the normal filling order."},{"stem":"Which statement correctly explains why zinc is not classified as a transition element?","A":"Zinc does not form complex ions with ligands","B":"Zinc has only one common oxidation state in its compounds","C":"The only stable zinc ion, Zn²⁺, has a completely full 3d sub-shell ([Ar] 3d¹⁰)","D":"Zinc is not a d-block element","correct":"C","explain":"A transition element is defined as a d-block element that forms at least one stable ion with an incomplete (partially-filled) d-sub-shell. Zn²⁺ is formed by removing the 4s² pair from [Ar] 3d¹⁰ 4s², giving [Ar] 3d¹⁰ — a completely full d-sub-shell, which fails the definition. OCR examiners (H432/01 June 2023 and November 2021) insist on the language \"d-sub-shell\" or \"d-orbital\" — never \"d-shell\" — and require the argument to be made about the ion, not the atom. Option A is incorrect: Zn²⁺ does form complexes, e.g. [Zn(NH₃)₄]²⁺. Option B is a consequence of Zn not being a transition element, not the reason. Option D is wrong: zinc IS a d-block element — its highest-energy electrons in the neutral atom occupy the 3d sub-shell."},{"stem":"What is the correct electron configuration for Fe²⁺?","A":"[Ar] 3d⁴ 4s²","B":"[Ar] 3d⁶","C":"[Ar] 3d⁵ 4s¹","D":"[Ar] 3d⁵","correct":"B","explain":"Iron (Z = 26) has configuration [Ar] 3d⁶ 4s². When forming Fe²⁺, the 4s electrons are removed first (they lie at higher energy than 3d in the positive ion), giving [Ar] 3d⁶. Option A ([Ar] 3d⁴ 4s²) is the classic error — removing two 3d electrons while keeping the 4s electrons. This is consistently the most penalised mistake in electron configuration questions and OCR marks it as wrong every time. Option C ([Ar] 3d⁵ 4s¹) is the anomalous ground-state configuration of chromium metal, not an iron ion. Option D ([Ar] 3d⁵) is Fe³⁺, formed by removing the two 4s electrons and then one further 3d electron; the half-filled 3d⁵ gives Fe³⁺ extra stability relative to Fe²⁺."},{"stem":"What colour change is observed when excess aqueous ammonia is added to [Cu(H₂O)₆]²⁺(aq)?","A":"Pale blue → yellow","B":"Pale blue → rust-brown","C":"Pale blue → deep blue","D":"Pale blue → grey-green","correct":"C","explain":"[Cu(H₂O)₆]²⁺ is pale blue. When excess NH₃ is added, four water ligands are replaced by ammonia in the substitution [Cu(H₂O)₆]²⁺ + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O. The product [Cu(NH₃)₄(H₂O)₂]²⁺ is deep (royal) blue — a distinctive result. The different ligand environment changes the d-orbital splitting energy (Δ) and therefore the wavelength of visible light absorbed, intensifying the blue. Option A (yellow) is the colour of [CuCl₄]²⁻, the product with concentrated HCl — the other major colour change for Cu²⁺. Option D (grey-green) is Cr(OH)₃, formed when NaOH is added to Cr³⁺. Both distractors are genuine transition-metal observations, making them realistic exam traps."},{"stem":"What is the coordination number of Ni²⁺ in the complex [Ni(NH₂CH₂CH₂NH₂)₃]²⁺?","A":"2","B":"3","C":"4","D":"6","correct":"D","explain":"Ethane-1,2-diamine ('en') is a bidentate ligand — it donates two lone pairs, one from each nitrogen atom, forming two coordinate bonds to the central metal. With three 'en' ligands, total coordinate bonds = 3 × 2 = 6. The coordination number is the total number of coordinate bonds to the central metal ion, not the number of ligand molecules. Coordination number = 6 and the shape is octahedral, with bond angles of 90°. Option B (3) counts ligand molecules — the most common error in this type of question. Recognising that bidentate ligands each contribute two bonds is essential throughout the transition elements topic, particularly for deduc­ing both coordination number and geometry from a complex formula."},{"stem":"Cisplatin, Pt(NH₃)₂Cl₂, has four-fold coordination. What shape is the complex and what are its bond angles?","A":"Tetrahedral, 109.5°","B":"Square planar, 90°","C":"Octahedral, 90°","D":"Linear, 180°","correct":"B","explain":"Platinum(II) is a d⁸ ion that characteristically adopts square planar geometry. All four ligands occupy the corners of a square in the same plane as the metal, with all L–Pt–L angles equal to 90°. This contrasts with a tetrahedral four-coordinate complex (such as [CuCl₄]²⁻, which has bond angles of 109.5°). The distinction between square planar and tetrahedral four-coordination is important: Cl⁻ ligands give tetrahedral geometry with first-row transition metals because of their size, whereas Pt²⁺ (and other d⁸ second/third-row ions) adopt square planar geometry for electronic reasons. In cisplatin, the two Cl⁻ ligands are adjacent (cis, 90° apart), which is what makes it a biologically active anti-cancer drug."},{"stem":"What is the oxidation state of iron in oxyhaemoglobin, and what type of bond does O₂ form with the iron centre?","A":"Fe³⁺; ionic bond","B":"Fe²⁺; coordinate (dative covalent) bond","C":"Fe³⁺; coordinate (dative covalent) bond","D":"Fe²⁺; metallic bond","correct":"B","explain":"In haemoglobin, iron is in the +2 oxidation state throughout the oxygen transport cycle — the binding and release of O₂ is a ligand substitution, not a redox reaction. O₂ acts as a ligand, donating a lone pair into an empty orbital on Fe²⁺ to form a coordinate (dative covalent) bond at the sixth coordination site. If iron were oxidised to Fe³⁺ (forming methaemoglobin), oxygen transport would be impossible. OCR June 2019 Q17b specifically awarded the mark for \"O₂ (coordinately or datively) bonds with Fe²⁺/Fe(II)\" — stating Fe³⁺ or calling the bond ionic would both lose marks. The distinction between coordinate bonding (used in ligand binding) and redox (change in Fe oxidation state) is fundamental to this subtopic."},{"stem":"What colours are the precipitates formed when acidified silver nitrate solution is added to separate solutions containing Cl⁻, Br⁻, and I⁻ respectively?","A":"White, yellow, cream","B":"Cream, white, yellow","C":"White, cream, yellow","D":"Yellow, cream, white","correct":"C","explain":"AgNO₃ gives: AgCl (white), AgBr (cream), AgI (yellow). The colours deepen in the order Cl → Br → I, corresponding to increasing covalent character in the Ag–X bond and decreasing solubility product (AgCl > AgBr > AgI). The ammonia test confirms identity: AgCl dissolves in dilute NH₃ (forming [Ag(NH₃)₂]⁺), AgBr dissolves only in concentrated NH₃, and AgI is insoluble in concentrated NH₃. AgNO₃ must be acidified with dilute HNO₃ to prevent interference from carbonate (which gives pale Ag₂CO₃) or hydroxide ions. Option A transposes Br and I, Option B scrambles all three — common errors when candidates have partially memorised the sequence."},{"stem":"Which equation correctly represents the disproportionation of Cu⁺ in aqueous solution?","A":"Cu⁺(aq) → Cu²⁺(aq) + e⁻","B":"2Cu⁺(aq) → Cu²⁺(aq) + Cu(s)","C":"Cu⁺(aq) + e⁻ → Cu(s)","D":"3Cu⁺(aq) → Cu³⁺(aq) + Cu²⁺(aq) + Cu(s)","correct":"B","explain":"Disproportionation involves the simultaneous oxidation and reduction of the same element. For Cu⁺(aq): one Cu⁺ is oxidised to Cu²⁺ (Cu⁺ → Cu²⁺ + e⁻) and another Cu⁺ is reduced to Cu (Cu⁺ + e⁻ → Cu(s)). Adding both half-equations gives 2Cu⁺(aq) → Cu²⁺(aq) + Cu(s). This reaction is feasible because E°cell = E°(Cu⁺/Cu) − E°(Cu²⁺/Cu⁺) = +0.52 − 0.15 = +0.37 V > 0. Cu⁺(aq) is therefore thermodynamically unstable in water. Options A and C are each only one half of the disproportionation — without both the oxidation and reduction occurring simultaneously there is no disproportionation. Cu⁺ is stable in the solid state as CuI and Cu₂O, because the low solubility product removes the driving force."},{"stem":"Which statement correctly describes the behaviour of Cr(OH)₃ precipitate when excess NaOH(aq) and excess NH₃(aq) are added in separate tests?","A":"Dissolves in excess NaOH only (gives a dark green solution)","B":"Dissolves in excess NH₃ only (gives a violet/purple solution)","C":"Dissolves in neither excess NaOH nor excess NH₃","D":"Dissolves in both excess NaOH (giving dark green [Cr(OH)₆]³⁻) and excess NH₃ (giving violet [Cr(NH₃)₆]³⁺)","correct":"D","explain":"Cr(OH)₃ is amphoteric — unique among the five OCR-named transition-metal hydroxides. In excess NaOH, it undergoes further deprotonation (Cr(OH)₃ + 3OH⁻ → [Cr(OH)₆]³⁻, dark green) — an acid-base reaction, not ligand substitution. In excess NH₃, it undergoes ligand substitution (Cr(OH)₃ + 6NH₃ → [Cr(NH₃)₆]³⁺ + 3OH⁻, violet/purple). Dissolving in both excess reagents is the diagnostic feature of Cr(OH)₃. Cu(OH)₂ dissolves only in excess NH₃ (giving deep-blue [Cu(NH₃)₄(H₂O)₂]²⁺). Fe(OH)₂, Fe(OH)₃ and Mn(OH)₂ are insoluble in excess of either reagent — the persistent precipitate is itself the diagnostic result for those three ions."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
