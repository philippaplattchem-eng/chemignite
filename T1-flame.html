<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T1 Flame &mdash; Atomic Structure & the Periodic Table</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}

/* ── landing hero ── */
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#4a1d96 0%,#6d28d9 45%,#9333ea 80%,#c084fc 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto .5rem}
.hero-pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
.hero-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:600}

/* ── tier legend ── */
.tier-legend{display:flex;gap:0;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}

/* ── topic grid ── */
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem;padding-left:.2rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

/* ── quiz page ── */
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T1 &mdash; Atomic Structure &amp; the Periodic Table</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>20 questions</span>
    <span>Flame &mdash; Apply</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"In Rutherford's gold foil experiment, most alpha particles passed straight through the foil. What does this tell us about the atom?","A":"The positive charge is spread evenly through the atom","B":"Alpha particles are too small to interact with atoms","C":"Most of the atom is empty space","D":"The nucleus is very large and takes up most of the atom","correct":"C","explain":"If the positive charge were spread throughout the atom (as in the plum pudding model), all alpha particles would be deflected slightly. The fact that most passed straight through shows the atom is mostly empty space, with mass and charge concentrated in a tiny nucleus."},{"stem":"Carbon-12 and carbon-14 are both isotopes of carbon. Which statement about them is correct?","A":"They have different numbers of protons and different chemical properties","B":"They have the same number of neutrons but different mass numbers","C":"They have the same number of protons and identical chemical properties","D":"They have different numbers of electrons so react differently","correct":"C","explain":"Isotopes have the same number of protons (and therefore electrons) so they have identical electronic configurations and identical chemical properties. Carbon-12 has 6 neutrons and carbon-14 has 8 neutrons, the extra neutrons affect mass but not chemistry."},{"stem":"A sodium atom (Na) has 11 protons. When it forms an Na⁺ ion, what has happened?","A":"It has gained a proton, increasing the positive charge","B":"It has lost one electron, so the 11 protons now outweigh the 10 electrons","C":"It has gained an electron, becoming more negative","D":"It has lost a neutron, reducing its mass number","correct":"B","explain":"Sodium loses 1 electron from its outer shell to achieve a stable full outer shell. It still has 11 protons (+11) but now only 10 electrons (−10), giving a net charge of +1. The atomic number (protons) never changes in a chemical reaction."},{"stem":"A student says \"the neutrons in a nucleus cancel out the charge of the protons.\" Why is this incorrect?","A":"Neutrons are too heavy to cancel proton charge","B":"Neutrons carry no charge at all, only electrons can cancel proton charge","C":"Neutrons carry a negative charge so they would add to the protons","D":"There are always fewer neutrons than protons so they cannot cancel them","correct":"B","explain":"Neutrons have a relative charge of 0, they carry no electrical charge. Only electrons (charge −1) can cancel the positive charge of protons (+1). The atom is neutral because the number of protons equals the number of electrons, not because of neutrons."},{"stem":"Chlorine has a relative atomic mass of 35.5. What does this tell us?","A":"Every chlorine atom has a mass number of 35.5","B":"Chlorine has two isotopes; 35.5 is the weighted average of their masses based on natural abundance","C":"Chlorine atoms contain 35.5 neutrons on average","D":"The most common chlorine isotope has mass number 35.5","correct":"B","explain":"No atom can have a non-whole-number mass, 35.5 is a weighted average. Chlorine exists as two isotopes: ³⁵Cl (~75%) and ³⁷Cl (~25%). The weighted average = (75×35 + 25×37) ÷ 100 = 35.5. This is why Ar values on the periodic table are often non-whole numbers."},{"stem":"An atom has 15 protons and 16 neutrons. What is its mass number and how many electrons does it have in its neutral form?","A":"Mass number 15; 16 electrons","B":"Mass number 31; 15 electrons","C":"Mass number 16; 15 electrons","D":"Mass number 31; 16 electrons","correct":"B","explain":"Mass number = protons + neutrons = 15 + 16 = 31. In a neutral atom, electrons = protons = 15. This is phosphorus-31 (³¹P), the only stable isotope of phosphorus. Electronic configuration: 2, 8, 5."},{"stem":"Magnesium (Group 2) reacts with chlorine (Group 7). What is the formula of the ionic compound formed?","A":"MgCl","B":"Mg₂Cl","C":"MgCl₂","D":"MgCl₃","correct":"C","explain":"Magnesium forms Mg²⁺ (loses 2 electrons). Chlorine forms Cl⁻ (gains 1 electron). To balance charges: 2+ needs two 1− ions, so the formula is MgCl₂. Always check that the total positive charge equals the total negative charge."},{"stem":"Which element has the electronic configuration 2, 8, 7?","A":"Sodium (Na)","B":"Argon (Ar)","C":"Chlorine (Cl)","D":"Fluorine (F)","correct":"C","explain":"2 + 8 + 7 = 17 electrons, so atomic number = 17 = chlorine. 7 outer electrons places it in Group 7. Fluorine has only 2 shells (2, 7). Sodium has configuration 2, 8, 1. Argon has 2, 8, 8."},{"stem":"A substance has a very high melting point and does not conduct electricity in any state. What type of structure does it most likely have?","A":"Metallic","B":"Simple molecular","C":"Ionic","D":"Giant covalent","correct":"D","explain":"Giant covalent substances (e.g. diamond, silicon dioxide) have very high melting points because all the strong covalent bonds throughout the lattice must be broken. They do not conduct electricity because there are no free electrons or ions, all electrons are used in covalent bonds."},{"stem":"Diamond and graphite are both made entirely of carbon atoms. Why do they have such different properties?","A":"Diamond contains carbon-12 and graphite contains carbon-13","B":"Diamond is an ionic compound but graphite is covalent","C":"They have different structures, in diamond each C bonds to 4 others; in graphite each C bonds to only 3, leaving delocalised electrons","D":"Diamond has more protons per carbon atom than graphite","correct":"C","explain":"Structure determines properties. In diamond: each C forms 4 covalent bonds → giant rigid lattice → very hard, no free electrons, non-conductor. In graphite: each C forms 3 bonds in layers → weak forces between layers (slides easily), one delocalised electron per C → good conductor."},{"stem":"Calculate the Mr of calcium carbonate, CaCO₃. (Ca = 40, C = 12, O = 16)","A":"68","B":"84","C":"100","D":"116","correct":"C","explain":"Mr(CaCO₃) = 40 + 12 + (3 × 16) = 40 + 12 + 48 = 100. Always multiply the atomic mass by the subscript number for each element. CaCO₃ is the formula for calcium carbonate, used in limestone, chalk and marble."},{"stem":"Why is the Dalton model of the atom no longer accepted?","A":"Dalton was not a qualified scientist so his ideas were ignored","B":"New experimental evidence (discovery of electrons, then the nuclear model) showed atoms contain subatomic particles and a nucleus, which a solid sphere cannot explain","C":"The Dalton model was replaced simply because newer technology made it outdated","D":"Dalton's model was disproved because atoms can be created and destroyed","correct":"B","explain":"Scientific models change when new evidence cannot be explained by the old model. Thomson's discovery of the electron (1897) showed atoms are not solid spheres. Rutherford's gold foil experiment (1909) showed positive charge is concentrated in a tiny nucleus. Both findings are incompatible with Dalton's model."},{"stem":"A substance dissolves in water to give a solution that conducts electricity, and it has a melting point of 801°C. What type of bonding does it have?","A":"Covalent","B":"Metallic","C":"Ionic","D":"Giant covalent","correct":"C","explain":"High melting point (strong electrostatic forces in a giant lattice) + conducts when dissolved (ions free to move in solution) = ionic compound. NaCl melts at 801°C, this is a classic ionic property combination. Giant covalent substances have high melting points but do not conduct electricity."},{"stem":"How many neutrons are in an atom of ³⁷Cl (atomic number 17)?","A":"17","B":"37","C":"54","D":"20","correct":"D","explain":"Number of neutrons = mass number − atomic number = 37 − 17 = 20. The mass number (top, 37) includes both protons and neutrons. Subtracting the proton count (atomic number, 17) gives the neutron count."},{"stem":"Why do metals conduct electricity?","A":"Metal ions can move freely through the solid lattice","B":"Metals contain delocalised electrons that are free to move and carry charge","C":"Metals dissolve in water to release ions","D":"Metal atoms share electrons in covalent bonds that can move","correct":"B","explain":"In metallic bonding, outer electrons become delocalised, they are not attached to any single atom and are free to move throughout the structure. When a voltage is applied, these electrons drift and carry electrical charge. Metal ions are fixed in the lattice and do not move."},{"stem":"A student calculates the Mr of ethane (C₂H₆) as 30. Are they correct? (C = 12, H = 1)","A":"No, they forgot to multiply carbon by 2; the answer is 14","B":"No, they should have added atomic numbers not masses; the answer is 14","C":"Yes, Mr = (2 × 12) + (6 × 1) = 30","D":"No, the Mr of ethane is 28","correct":"C","explain":"Mr(C₂H₆) = (2 × 12) + (6 × 1) = 24 + 6 = 30. The student is correct. Always multiply atomic mass by the number of atoms of that element in the formula. C₂H₆ is ethane."},{"stem":"Calculate the percentage yield if a student collects 3.6 g of product from a reaction with a theoretical yield of 4.8 g.","A":"4.8%","B":"133%","C":"75%","D":"25%","correct":"C","explain":"% yield = (actual yield ÷ theoretical yield) × 100 = (3.6 ÷ 4.8) × 100 = 75%. Yields are always below 100% due to reversible reactions, product lost during transfer, or incomplete reactions."},{"stem":"Explain why a simple molecular substance such as iodine (I₂) has a low melting point.","A":"The covalent bonds within I₂ molecules are weak and easily broken on melting","B":"Iodine atoms have a small relative atomic mass so require little energy to separate","C":"The intermolecular forces between I₂ molecules are weak and require little energy to overcome, the covalent bonds within molecules are NOT broken","D":"Iodine is a non-metal so it always has a low melting point","correct":"C","explain":"On melting, only the weak intermolecular forces (London dispersion forces) between I₂ molecules are broken, NOT the strong I−I covalent bond within each molecule. Weak intermolecular forces require little energy to overcome → low melting point. This is a very common exam misconception."},{"stem":"An atom X has atomic number 19 and mass number 39. How many neutrons does X have, and which group of the periodic table is it in?","A":"20 neutrons; Group 2","B":"19 neutrons; Group 1","C":"20 neutrons; Group 1","D":"39 neutrons; Group 7","correct":"C","explain":"Neutrons = 39 − 19 = 20. The element with atomic number 19 is potassium (K), which has electronic configuration 2, 8, 8, 1, one outer electron → Group 1. Potassium-39 is the most abundant naturally occurring isotope of potassium."},{"stem":"A compound has the empirical formula CH₂O and a Mr of 180. What is its molecular formula? (C=12, H=1, O=16)","A":"CH₂O","B":"C₂H₄O₂","C":"C₆H₁₂O₆","D":"C₃H₆O₃","correct":"C","explain":"Mr of CH₂O = 12 + 2 + 16 = 30. 180 ÷ 30 = 6. So multiply each subscript by 6: C₆H₁₂O₆. This is glucose, the molecular formula is 6 times the empirical formula. Always divide the given Mr by the empirical formula Mr to find the multiplier."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
