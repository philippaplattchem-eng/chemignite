<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6.4 Nitrogen Compounds | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.4 Nitrogen Compounds</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"A compound has the formula (CH₃)₂NH. What type of amine is this?","A":"Primary amine","B":"Secondary amine","C":"Tertiary amine","D":"Quaternary ammonium salt","correct":"B","explain":"To classify an amine, <b>count the number of carbon atoms bonded directly to the nitrogen</b>. In (CH₃)₂NH: the N atom has two CH₃ groups and one H. Two C atoms on N → <b>secondary amine</b> (general formula R₂NH). This is different from the way alcohols are classified — for amines it is always about how many C–N bonds there are, not the degree of the C bearing the functional group. A primary amine (RNH₂) has one C on N. A tertiary amine (R₃N) has three C on N and no N–H. A quaternary ammonium salt (R₄N⁺X⁻) has four C on N and a permanent positive charge."},{"stem":"What is the functional group present in ethanamide (CH₃CONH₂)?","A":"Amine (–NH₂ only)","B":"Amide (–CONH₂)","C":"Ester (–COO–)","D":"Nitrile (–C≡N)","correct":"B","explain":"The defining functional group of an amide is <b>–C(=O)–N–</b>: a carbonyl carbon bonded directly to a nitrogen atom. In ethanamide (CH₃CONH₂) this is clearly the –CONH₂ group, which contains the carbonyl C double-bonded to O and single-bonded to NH₂. Option (A) is wrong because the amine functional group (–NH₂) is only part of what makes an amide — the carbonyl must also be there and bonded directly to the N. An amine has R–NH₂ with no adjacent carbonyl; an amide has R–CO–NH₂. Ethanamide is a <b>primary amide</b> (two N–H bonds), derived from ethanoic acid by replacing –OH with –NH₂."},{"stem":"Which of the following α-amino acids does NOT have a chiral centre?","A":"Alanine (R = CH₃)","B":"Serine (R = CH₂OH)","C":"Glycine (R = H)","D":"Phenylalanine (R = CH₂C₆H₅)","correct":"C","explain":"A chiral centre requires a carbon atom bonded to <b>four different groups</b>. In a general α-amino acid RCH(NH₂)COOH, the four groups on the α-carbon are R, H, –NH₂, and –COOH. When R ≠ H all four are different — the amino acid is chiral. In <b>glycine (R = H)</b>, the α-carbon carries <b>H, H, –NH₂, –COOH</b> — only three different groups. Two H atoms are identical, so the carbon is <b>NOT a chiral centre</b>. Glycine is the only proteinogenic amino acid without a chiral centre, and it is the only one that does not exhibit optical isomerism."},{"stem":"Which reagent converts nitrobenzene (C₆H₅NO₂) into phenylamine (C₆H₅NH₂) according to the OCR specification?","A":"H₂/Ni catalyst (hydrogenation)","B":"LiAlH₄ in dry ether","C":"Sn + concentrated HCl","D":"NaBH₄ in aqueous methanol","correct":"C","explain":"OCR specifies <b>tin (Sn) and concentrated hydrochloric acid (HCl)</b> as the reducing agent for converting a nitroarene to an aromatic amine. The Sn/HCl combination supplies the \"nascent hydrogen\" [H] needed for the 6-electron reduction: C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O. Option (A) H₂/Ni works industrially but is <b>explicitly excluded</b> by OCR mark schemes — candidates who write H₂ for this step score zero. LiAlH₄ is a more powerful reducing agent mainly used for nitriles. NaBH₄ is too mild to reduce nitro groups. Note: after the Sn/HCl step, <b>NaOH(aq)</b> is added to liberate the free amine from the protonated phenylammonium salt."},{"stem":"Ethylamine (CH₃CH₂NH₂) is added to dilute hydrochloric acid. What is the organic product?","A":"Ethanol (CH₃CH₂OH)","B":"Diethylamine ((CH₃CH₂)₂NH)","C":"Ethyl chloride (CH₃CH₂Cl)","D":"Ethylammonium chloride (CH₃CH₂NH₃⁺Cl⁻)","correct":"D","explain":"Amines are Brønsted–Lowry bases. The lone pair on nitrogen accepts H⁺ from HCl: CH₃CH₂NH₂ + HCl → <b>CH₃CH₂NH₃⁺Cl⁻</b>. The product is an <b>ionic salt</b> — ethylammonium chloride — consisting of the protonated ethylammonium cation (CH₃CH₂NH₃⁺) and a chloride anion. This is entirely analogous to NH₃ + HCl → NH₄⁺Cl⁻. The amine is not oxidised, not substituted at carbon, and does not lose nitrogen. It is a simple, direct proton-transfer reaction at nitrogen."},{"stem":"What type of amide is the product when ethanoyl chloride (CH₃COCl) reacts with excess ammonia (NH₃)?","A":"Secondary amide","B":"Tertiary amide","C":"Primary amide","D":"Quaternary ammonium salt","correct":"C","explain":"CH₃COCl + 2NH₃ → CH₃CONH₂ + NH₄Cl. When an acyl chloride reacts with <b>ammonia (NH₃)</b>, the product is a <b>primary amide</b> (RCONH₂) — the N bears <b>two H atoms</b> and one acyl group. A <b>secondary amide</b> (RCONHR') would require a <b>primary amine</b> (RNH₂) as the nucleophile. The \"two equivalents\" of NH₃ are required because: (i) one equivalent is the nucleophile that attacks the carbonyl C; (ii) the second equivalent acts as a base, neutralising the HCl produced to give NH₄Cl."},{"stem":"What are the correct reagents and conditions for preparing ethylamine from bromoethane by nucleophilic substitution?","A":"Dilute ammonia solution, room temperature","B":"Concentrated aqueous KOH, reflux","C":"Excess ethanolic ammonia, reflux in a sealed tube","D":"Excess aqueous NaOH, 50 °C","correct":"C","explain":"The aliphatic amine preparation requires: (1) <b>ammonia dissolved in ethanol</b> (ethanolic ammonia) — ethanol is used because both NH₃ and the haloalkane dissolve in it, and using aqueous solvent would favour hydrolysis to an alcohol instead; (2) <b>in excess</b> — to suppress further substitution to secondary and tertiary amines (the primary amine formed is itself a nucleophile); (3) <b>reflux in a sealed tube</b> — ammonia is volatile at room temperature and must be kept in a sealed system to maintain the pressure needed. Dilute aqueous ammonia (option A) is too dilute and wrong solvent. Conditions in options B and D produce an alkene (elimination) or an alcohol (nucleophilic substitution with NaOH) from the haloalkane."},{"stem":"What is the correct definition of a zwitterion in the context of amino acids?","A":"A molecule that contains both a C=O and an N–H bond.","B":"A negatively charged ion with two amine groups.","C":"A neutral molecule with both a positive and a negative formal charge on different parts of the same molecule.","D":"An ion formed when an amino acid loses a water molecule.","correct":"C","explain":"A <b>zwitterion</b> is a dipolar ion that is <b>overall electrically neutral</b> but carries a <b>positive formal charge at one site</b> and a <b>negative formal charge at another site</b> within the same molecule. For an α-amino acid: the –COOH proton is transferred internally to the –NH₂ group, giving –NH₃⁺ and –COO⁻ on the same molecule. The full zwitterion formula is <b>RCH(NH₃⁺)COO⁻</b>, with net charge = +1 + (−1) = 0. Zwitterions are the predominant form of amino acids in the solid state and at neutral pH. They are not ions in the usual sense (they migrate to neither electrode if the pH is at the isoelectric point)."},{"stem":"What is the general formula of an α-amino acid according to the OCR specification?","A":"RCH(NH₂)CHO","B":"RCONH₂","C":"RCH₂NH₂","D":"RCH(NH₂)COOH","correct":"D","explain":"The OCR-specified general formula is <b>RCH(NH₂)COOH</b>: a central <b>α-carbon</b> (C directly attached to the –COOH group) bearing a hydrogen atom, an amine group (–NH₂), a carboxylic acid group (–COOH), and a variable side chain (R). The \"α\" indicates that the amine group is on the carbon adjacent to (and specifically the same carbon as) the carboxyl group. Option (A) is an α-amino aldehyde (not an amino acid). Option (B) RCONH₂ is a primary amide. Option (C) RCH₂NH₂ is a simple alkylamine without a carboxylic acid. All natural proteins are made from L-amino acids with this formula."},{"stem":"What type of amide is N-methylethanamide (CH₃CONHCH₃)?","A":"Primary amide (RCONH₂)","B":"Secondary amide (RCONHR')","C":"Tertiary amide (RCONR'R'')","D":"Quaternary ammonium salt","correct":"B","explain":"Count the <b>N–H bonds</b> in the amide: in N-methylethanamide (CH₃CO–NH–CH₃), the nitrogen carries one H, one CH₃ group, and the acyl (CH₃CO–) group. <b>One N–H bond</b> means it is a <b>secondary amide</b> (general formula RCONHR'). Alternatively, check the \"N-\" prefix: the presence of one \"N-methyl\" substituent in the name signals that the N carries one organic substituent — secondary. If there were no substituent on N (just two H atoms), it would be a primary amide. Two \"N-\" substituents → tertiary amide. The <b>peptide bond</b> in proteins (–CO–NH–) is also a secondary amide."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
