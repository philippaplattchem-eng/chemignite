<script>
const QUESTIONS=[{"stem":"The H432/03 June 2023 Examiner Report criticised candidates who, when asked to use ¹³C NMR to distinguish between isomers, gave \"generic responses\" and also \"discussed splitting patterns or relative peak areas/heights.\" Why are both of these errors fatal in a ¹³C NMR question?","A":"Generic responses are acceptable if the chemistry is correct; splitting patterns are relevant to ¹³C but not to ¹H NMR.","B":"Generic responses (e.g. \"¹³C NMR shows the number of carbon environments\") score no marks because the mark scheme requires the technique to be applied to the specific structures in question; splitting patterns and peak heights belong to ¹H NMR, not proton-decoupled ¹³C NMR, where every peak is a singlet and heights/areas are not meaningful.","C":"Both errors are minor and only lose 1 mark; the structure identification itself earns all the marks.","D":"Splitting patterns are mentioned in proton-decoupled ¹³C only if the molecule has no symmetry.","correct":"B","explain":"Two separate errors the examiner report flagged: (1) <b>Generic responses</b> — statements like \"¹³C NMR gives the number of carbon environments\" or \"chemical shift shows positions relative to electronegative groups\" are true in principle but score <b>nothing</b> in a question that asks you to distinguish, say, propan-1-ol from propan-2-ol. The mark scheme wants you to count the carbon environments in <b>each named isomer</b> (propan-1-ol: 3 peaks at ~64, ~26, ~10 ppm; propan-2-ol: 2 peaks at ~64, ~26 ppm) and identify which observation distinguishes them. Specificity is mandatory. (2) <b>Splitting patterns / peak heights</b>: in <b>proton-decoupled</b> ¹³C NMR, all ¹H–¹³C coupling is removed → every peak is a <b>singlet</b>. No splitting patterns exist. Peak heights in proton-decoupled ¹³C are not proportional to the number of carbons (unlike ¹H NMR integration) due to the nuclear Overhauser effect. Writing about splitting or integration in ¹³C is the clearest sign of confusion with ¹H NMR."},{"stem":"The OCR H432/02 June 2023 examiner report specifically identified candidate confusion between TMS, CDCl₃, and D₂O. Give the correct role of each, and explain why confusing CDCl₃ with D₂O is chemically wrong.","A":"TMS = proton exchange; CDCl₃ = reference; D₂O = solvent. These are all equivalent roles in practice.","B":"TMS = reference standard (δ = 0 ppm); CDCl₃ = deuterated solvent (so the solvent gives no ¹H signal); D₂O = proton exchange reagent (O–H and N–H peaks disappear on shaking). Confusing CDCl₃ with D₂O is wrong because CDCl₃ is an aprotic solvent — it has no exchangeable protons (only C–D, and there is no O–D or N–D to exchange with the analyte's OH/NH).","C":"TMS = reference; CDCl₃ = proton exchange; D₂O = solvent. These all contain deuterium and are interchangeable.","D":"TMS = reference; CDCl₃ = standard; D₂O = deuterated solvent only, not an exchange agent.","correct":"B","explain":"The three roles are completely distinct: (1) <b>TMS</b> (Si(CH₃)₄): added as a reference standard. All 12 ¹H and all 4 ¹³C atoms are equivalent → one sharp peak at δ = 0 ppm in both ¹H and ¹³C NMR. (2) <b>CDCl₃</b> (deuterochloroform): a deuterated solvent — the one H of CHCl₃ has been replaced by D. Used to dissolve the sample without adding ¹H signals (the residual CDHCl₂ impurity gives a known peak at 7.3 ppm). CDCl₃ is <b>aprotic</b> (C–D bond) — it cannot donate O–H or N–D to exchange with analyte OH/NH. (3) <b>D₂O</b> (deuterium oxide, heavy water): the proton exchange reagent. D₂O has exchangeable O–D groups: R–OH + D₂O ⇌ R–OD + HOD; R–NH + D₂O ⇌ R–ND + HOD. So the peaks from O–H and N–H disappear. CDCl₃ cannot do this because it has no O–D."},{"stem":"How many peaks would appear in the proton-decoupled ¹³C NMR spectrum of (a) benzene and (b) methylbenzene (toluene)? Explain the difference.","A":"Benzene: 6 peaks (one for each ring carbon). Toluene: 7 peaks (one for each carbon in the molecule).","B":"Benzene: 1 peak; toluene: 5 peaks.","C":"Benzene: 1 peak; toluene: 4 peaks.","D":"Benzene: 2 peaks (alternating positions); toluene: 6 peaks.","correct":"B","explain":"(a) <b>Benzene (C₆H₆)</b>: the six-fold rotational symmetry of benzene makes all six ring carbons <b>equivalent</b>. All appear at the same chemical shift (~128 ppm, aromatic region) → <b>1 peak</b>. (b) <b>Methylbenzene (C₆H₅CH₃, toluene)</b>: adding a methyl group breaks the six-fold symmetry of benzene. The ring now has: the <b>ipso</b> carbon (bonded to CH₃, 1 unique C); the <b>ortho</b> carbons (two equivalent C, both adjacent to ipso, 1 peak); the <b>meta</b> carbons (two equivalent C, 1 peak); the <b>para</b> carbon (opposite to CH₃, 1 unique C); plus the <b>CH₃</b> carbon itself (1 unique C). Total: <b>5 unique environments → 5 peaks</b>. The OCR H432 specification does not require knowledge of the specific ppm values for each ring position, but counting the environments by symmetry is the required skill (H432/02 November 2020 Q8 style)."},{"stem":"In the AgNO₃/ethanol test for haloalkanes, the precipitate colours are: white (AgCl), cream (AgBr), yellow (AgI). The rate of precipitate formation also differs — AgI forms fastest and AgCl slowest. Explain both the colour trend and the rate trend in terms of bonding.","A":"The rate increases from Cl → I because the C–X bond polarity increases down the group, making the bond more susceptible to nucleophilic attack; the colour change reflects the anion size.","B":"The rate increases from Cl → I because C–X bond enthalpy decreases down the group (C–Cl ~338 kJ mol⁻¹ > C–Br ~276 kJ mol⁻¹ > C–I ~238 kJ mol⁻¹), so the C–I bond breaks most easily and AgI precipitates fastest; the colour change reflects differences in the Ksp and electronic structure of the silver halide lattice.","C":"The rate increases from Cl → I because C–X bond length increases down the group, making the bond more reactive.","D":"Both trends reflect increasing atomic mass down Group 7; heavier halogens react faster and their precipitates are yellow.","correct":"B","explain":"<b>Rate</b> is determined by how easily the C–X bond breaks in the rate-determining step (a slow nucleophilic substitution by water in the ethanol/water mix): <b>C–X bond enthalpy decreases down Group 7</b> (Cl → Br → I), because the X atom gets larger, the carbon–halogen orbital overlap worsens, and the bond weakens. C–I is weakest → breaks most easily → AgI precipitates fastest. C–Cl is strongest → slowest reaction → AgCl takes the longest (sometimes several minutes). Note: this is the <b>opposite</b> of what bond polarity would predict (C–Cl is the most polar due to the electronegativity difference, which would favour nucleophilic attack, but the rate is actually dominated by bond enthalpy). <b>Colour</b>: the silver halide colours (white/cream/yellow) reflect the properties of the silver halide ionic lattice — the electron arrangements and light-absorption characteristics of each AgX compound — not a simple periodic trend in polarity."},{"stem":"An unknown compound W gives: a positive result with 2,4-DNP (orange precipitate), a positive result with Tollens' reagent (silver mirror), and a positive result with bromine water (decolourises from orange to colourless). What functional groups must compound W contain, and suggest a type of compound consistent with all three results?","A":"Compound W contains an alkene (bromine water), an aldehyde (Tollens' + 2,4-DNP). An unsaturated aldehyde (e.g. propenal, CH₂=CH–CHO) would give all three positive results.","B":"Compound W contains a ketone (2,4-DNP) and phenol (bromine water) — the Tollens' result is irrelevant to the phenol.","C":"Compound W is a carboxylic acid: 2,4-DNP detects the C=O of –COOH; Tollens' oxidises the –COOH further; bromine reacts with the C–OH.","D":"Compound W is an ester with a C=C side chain.","correct":"A","explain":"Mapping each test result: (1) <b>2,4-DNP positive</b> → compound contains a <b>carbonyl (C=O)</b> in an aldehyde or ketone; (2) <b>Tollens' positive</b> (silver mirror) → the carbonyl is specifically an <b>aldehyde (–CHO)</b>, not a ketone; (3) <b>Bromine water decolourises</b> (orange → colourless) → compound contains a <b>C=C double bond</b> (alkene). All three results are consistent with a compound that has both an aldehyde AND an alkene: an <b>unsaturated aldehyde</b>. The simplest example is <b>propenal (acrolein), CH₂=CH–CHO</b>: the C=C (gives bromine decolourisation), the –CHO (gives both 2,4-DNP and Tollens' silver mirror). Option (C) is wrong — 2,4-DNP does not react with carboxylic acid carbonyls; Tollens' does not oxidise carboxylic acids. Option (B) is wrong — ketone C=O doesn't give silver mirror."},{"stem":"An organic compound contains 48.6% C, 8.1% H, and 43.2% O by mass. The mass spectrum shows M⁺ = 74. Calculate the empirical formula and hence the molecular formula.","A":"Empirical formula CH₂O; molecular formula C₃H₆O₃","B":"Empirical formula C₃H₆O₂; molecular formula C₃H₆O₂","C":"Empirical formula C₂H₄O; molecular formula C₄H₈O₂","D":"Empirical formula CH₂O; molecular formula C₂H₄O₂","correct":"B","explain":"Step 1 — divide each percentage by A_r (moles per 100 g): C: 48.6 / 12.0 = <b>4.05</b>; H: 8.1 / 1.0 = <b>8.1</b>; O: 43.2 / 16.0 = <b>2.70</b>. Step 2 — divide by the smallest (2.70): C: 4.05/2.70 = <b>1.50</b>; H: 8.1/2.70 = <b>3.00</b>; O: 2.70/2.70 = <b>1.00</b>. Step 3 — the ratio 1.5 : 3 : 1 is not a whole number; multiply by 2: C: <b>3</b>, H: <b>6</b>, O: <b>2</b> → empirical formula = <b>C₃H₆O₂</b> (empirical mass = 36 + 6 + 32 = <b>74 g mol⁻¹</b>). Step 4 — n = M_r / empirical mass = 74 / 74 = <b>1</b> → molecular formula = <b>C₃H₆O₂</b> (same as empirical). Possible structures with this molecular formula include propanoic acid (CH₃CH₂COOH), methyl ethanoate (CH₃COOCH₃), and ethyl methanoate (HCOOC₂H₅) — spectroscopic data would be needed to distinguish them."},{"stem":"A student uses a GC column to separate the components of an alcoholic beverage sample. They identify ethanol by comparing its retention time with a reference standard. A colleague suggests using GC–MS instead. Why is coupling GC to a mass spectrometer (GC–MS) more reliable for identification than GC alone?","A":"GC–MS is faster than GC alone, so the student can identify more components in less time.","B":"GC alone cannot separate components — the mass spectrometer provides the separation, while the GC provides the identification.","C":"Retention time (R_t) from GC alone is not unique — two different compounds can have the same R_t on a given column. The mass spectrometer provides a fragmentation pattern that acts as a molecular \"fingerprint\" unique to each compound, giving an independent, unambiguous identification.","D":"GC–MS is needed because GC detectors cannot measure amounts — only mass spectrometers can quantify.","correct":"C","explain":"The fundamental limitation of GC identification by R_t alone: <b>two different compounds can coincidentally have the same retention time</b> on a particular column under the same conditions. This is especially likely for structural isomers or compounds with very similar physical properties. GC–MS overcomes this by coupling the <b>separation power of GC</b> (each component exits the column at a different time) with the <b>identification power of mass spectrometry</b> (as each component exits, it is ionised and its fragmentation pattern — a unique \"mass spectrum fingerprint\" — is recorded). The combination gives both physical separation AND chemical identification: retention time confirms the elution timing, and the mass spectrum confirms (or corrects) the identity. Option (D) is incorrect — GC detectors (especially flame ionisation detectors) do quantify very well; peak area is proportional to amount."},{"stem":"A compound with molecular formula C₂H₄O₂ shows a proton-decoupled ¹³C NMR spectrum with exactly two peaks: one at δ ≈ 21 ppm and one at δ ≈ 178 ppm. Deduce the structure, and explain why a structural isomer (methyl methanoate, HCOOCH₃) would be excluded by this spectrum.","A":"The compound is methyl ethanoate (CH₃COOCH₃) — excluded by wrong molecular formula (C₃H₆O₂, not C₂H₄O₂) and too many ¹³C environments (3 peaks expected, not 2).","B":"The compound is ethanoic acid (CH₃COOH): the CH₃ carbon at ~21 ppm (alkyl region) and the C=O of COOH at ~178 ppm (carboxylic acid carbonyl region) — only 2 carbons, 2 unique environments; methyl methanoate (HCOOCH₃) would give a peak at ~161 ppm (ester C=O) and a peak at ~54 ppm (OCH₃), so its pattern is incompatible.","C":"The compound is propanoic acid (CH₃CH₂COOH) — excluded by wrong molecular formula (C₃H₆O₂, not C₂H₄O₂).","D":"The compound is methyl methanoate (HCOOCH₃): the CHO carbon at 21 ppm and the OCH₃ at 178 ppm.","correct":"B","explain":"C₂H₄O₂, 2 peaks: (1) δ ~21 ppm = alkyl CH₃ (only C–C bonds at this carbon, no electronegative neighbour); (2) δ ~178 ppm = carboxylic acid C=O (carbonyl region 165–185 ppm). The molecular formula C₂H₄O₂ has exactly 2 carbons, consistent with 2 ¹³C peaks. <b>Ethanoic acid (CH₃COOH)</b>: 2 carbons in 2 unique environments (CH₃ ~21 ppm + COOH ~178 ppm). Matches perfectly. <b>Why methyl methanoate is excluded</b>: HCOOCH₃ (also C₂H₄O₂, a structural isomer) has 2 carbons in 2 unique environments, but at different shifts — the formyl C (H–C=O, ~161 ppm) and the OCH₃ (~54 ppm). Neither of these matches the observed peaks at 21 and 178 ppm, so methyl methanoate is excluded by the chemical shift data."},{"stem":"A compound K has molecular formula C₄H₈O₂. Its IR spectrum shows a strong absorption at 1735 cm⁻¹ and a second band at ~1200 cm⁻¹, but no broad band in the 2500–3550 cm⁻¹ region. Its ¹H NMR spectrum shows three peaks: a triplet at δ 0.9 ppm (3H), a quartet at δ 4.1 ppm (2H), and a singlet at δ 2.0 ppm (3H). Determine the structure of compound K.","A":"Compound K is propan-1-ol — the triplet/quartet pattern matches the ethyl group in an alcohol.","B":"Compound K is butanoic acid (CH₃CH₂CH₂COOH) — the carboxylic acid carbonyl absorbs at 1735 cm⁻¹.","C":"Compound K is ethyl ethanoate (CH₃COOCH₂CH₃): triplet at 0.9 ppm = CH₃ of ethyl; quartet at 4.1 ppm = OCH₂ of ethyl; singlet at 2.0 ppm = CH₃CO acyl methyl; 1735 cm⁻¹ = ester C=O; no O–H confirmed by absence of broad 2500–3550 cm⁻¹; molecular formula C₄H₈O₂ ✓.","D":"Compound K is methyl propanoate (CH₃CH₂COOCH₃) — 4 unique environments → 4 NMR peaks, but only 3 are observed, so this is excluded.","correct":"C","explain":"Step-by-step: (1) <b>DoU</b> = (2×4+2–8)/2 = 1 → one C=O or ring. (2) <b>IR</b>: 1735 cm⁻¹ = ester C=O (characteristic range for ester); ~1200 cm⁻¹ = C–O of ester; <b>no broad O–H</b> → not alcohol or carboxylic acid → <b>ester confirmed</b>. (3) <b>¹H NMR</b>: three peaks → 3 H environments; total 3+2+3 = 8 H (matches C₄H₈O₂, 8 H ✓). Triplet at 0.9 ppm + quartet at 4.1 ppm = <b>triplet/quartet pair from CH₃CH₂– (ethyl group)</b>. The quartet at 4.1 ppm is in the O–CH₂ region (3.5–4.5 ppm) → <b>–OCH₂CH₃</b> (ester ethoxy group). Singlet at 2.0 ppm, 3H, no neighbours → CH₃ with no adjacent C–H, adjacent to carbonyl → <b>CH₃CO–</b> (acyl methyl). (4) <b>Assembly</b>: CH₃CO– + –OCH₂CH₃ = <b>CH₃COOCH₂CH₃ = ethyl ethanoate</b>. (5) <b>Verify</b>: C₄H₈O₂ ✓; 3 H environments ✓; triplet/quartet for ethyl ✓; singlet for acyl CH₃ ✓; IR ester C=O ✓; no O–H ✓."},{"stem":"The OCR H432 specification states that candidates will NOT be expected to interpret mass spectra of organic halogen compounds. Which specific aspect of halogen compound mass spectra does this exclusion address, and what feature would appear in such spectra that you are not required to analyse?","A":"The exclusion covers the fact that halogen compounds are too toxic to measure by mass spectrometry, so the spectra are never collected.","B":"The exclusion covers the (M+2) isotope pattern arising from the natural abundance of ³⁵Cl/³⁷Cl (3:1) and ⁷⁹Br/⁸¹Br (1:1), which produces characteristic paired molecular ion peaks. Candidates are not required to identify a halogenated compound from its isotope signature.","C":"The exclusion covers the fact that halogen compounds fragment into dozens of peaks making the spectrum impossible to interpret at A Level.","D":"The exclusion covers mass spectra measured in negative ion mode, which is used only for haloalkanes.","correct":"B","explain":"Chlorine has two major isotopes: ³⁵Cl (75.5%) and ³⁷Cl (24.5%) → a monochlorinated compound shows a <b>M⁺ and (M+2)⁺ molecular ion pair in ~3:1 ratio</b>. Bromine has ⁷⁹Br (50.5%) and ⁸¹Br (49.5%) → a monobromo compound shows M⁺ and (M+2)⁺ in <b>approximately equal heights (1:1 ratio)</b> — one of the most diagnostic patterns in mass spectrometry. These isotope patterns are an additional layer of structural information that helps identify halogenated compounds. The OCR H432 specification explicitly excludes this from the A Level assessment — you will not be given a halogenated organic mass spectrum and asked to reason about the (M+2) pattern. You are only expected to interpret mass spectra of C/H/N/O compounds. Knowing this exclusion is also useful for exam strategy: if you see an unusual (M+2) peak in a given spectrum, it probably isn't the focus of the question."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
