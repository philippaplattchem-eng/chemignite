<style>:root{--pr:#7c3aed;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(124,58,237,.10);--sh2:0 6px 24px rgba(124,58,237,.18)}

  <h1>T7 &mdash; Rates of Reaction &amp; Energy Changes</h1>

</header>
<main>
  <div class="quiz-meta">
    <span>20 questions</span>
    <span>Flame &mdash; Apply</span>
  </div>
  <div id="score-banner" class="score-banner"></div>

<script>
const QUESTIONS=[{"stem":"A student measures the rate of the reaction between marble chips and hydrochloric acid by collecting CO₂ gas. She collects 60 cm³ of gas in 30 seconds. What is the mean rate of reaction?","A":"1800 cm³/s","B":"0.5 cm³/s","C":"2.0 cm³/s","D":"90 cm³/s","correct":"C","explain":"Mean rate = change in quantity ÷ time = 60 cm³ ÷ 30 s = 2.0 cm³/s. The unit comes from the y-axis unit (cm³) divided by the x-axis unit (s). 1800 would be 60 × 30 (wrong operation); 0.5 would be 30 ÷ 60 (upside-down)."},{"stem":"A student compares the reaction of large marble chips with that of marble powder in excess hydrochloric acid. Both use the same mass of marble. Which graph correctly describes the result?","A":"Powder reaches the same plateau, faster (steeper curve)","B":"Powder reaches a higher plateau because more surface is exposed","C":"Powder reaches a lower plateau because some marble is lost as dust","D":"Powder has the same rate initially but finishes at the same time","correct":"A","explain":"Using powder instead of lumps increases the surface area, so the frequency of collisions increases and the reaction is faster (steeper curve). However, the same mass of marble is used, so the same total amount of CO₂ is produced, the plateau height is identical. Surface area does not change how much product is formed, only how quickly."},{"stem":"Explain, in terms of particles, why increasing the temperature of a reaction increases its rate more significantly than increasing the concentration.","A":"Higher temperature adds more particles to the solution, increasing collision frequency more than concentration does","B":"Higher temperature increases both collision frequency AND the proportion of particles with energy ≥ Eₐ, while concentration increases frequency only","C":"Higher temperature decreases the activation energy, while concentration keeps it the same","D":"Higher temperature and concentration have identical effects on rate","correct":"B","explain":"Temperature is special because it affects two things: particles move faster (more frequent collisions) AND a greater proportion of particles have energy at or above the activation energy (more successful collisions per collision event). Concentration only increases the number of particles per unit volume, the energy per collision is unchanged. This double effect makes temperature the most powerful rate factor per unit change."},{"stem":"A catalyst is used in the industrial Haber process for making ammonia. Which of the following is the correct catalyst?","A":"Vanadium(V) oxide","B":"Nickel","C":"Platinum","D":"Iron","correct":"D","explain":"The Haber process uses iron as a catalyst for N₂ + 3H₂ ⇌ 2NH₃. Vanadium(V) oxide is used in the Contact process (making SO₃). Nickel catalyses hydrogenation of vegetable oils. The iron catalyst lowers the activation energy for the forward reaction, allowing the process to run at a more economical temperature."},{"stem":"A student mixes hydrochloric acid with sodium hydroxide in a polystyrene cup and records a temperature rise of 6.8°C. What type of reaction is this, and why?","A":"Endothermic, because energy is taken from the surroundings to increase the temperature","B":"Exothermic, because heat energy is given out by the reaction to the surroundings, causing the temperature to rise","C":"Exothermic, because the temperature of the reactants fell before the products were made","D":"Endothermic, because the acid and alkali need energy to react","correct":"B","explain":"A temperature rise means the surroundings (the solution) absorbed heat energy. This heat came from the reaction, so the reaction gave out heat to the surroundings, making it exothermic. The classic misconception is to think \"energy taken in = temperature rise\", it is the opposite: energy given OUT to surroundings causes a temperature rise in those surroundings."},{"stem":"Which of the following correctly explains why a catalyst increases the rate of reaction in terms of activation energy?","A":"The catalyst makes the particles move faster, increasing the energy of collisions","B":"The catalyst provides an alternative pathway with a lower activation energy, so a greater proportion of collisions are successful","C":"The catalyst increases the concentration of reactant particles","D":"The catalyst breaks the bonds in the reactants before they collide","correct":"B","explain":"A catalyst provides an alternative reaction pathway with a lower activation energy. This means more of the colliding particles have enough energy (≥ the new, lower Eₐ) to react successfully. The catalyst does not speed up the particles (that would require a temperature increase), nor does it change the number of particles."},{"stem":"A rate graph shows two curves: Curve A (original) and Curve B (same reactant amounts, catalyst added). Which description correctly shows both curves?","A":"Curve B steeper and reaches a higher plateau than A","B":"Curve B steeper and reaches the same plateau height as A","C":"Curve B shallower and reaches the same plateau height as A","D":"Curve B starts at the same rate and reaches the same plateau faster","correct":"B","explain":"Adding a catalyst speeds up the reaction (steeper initial gradient, shorter time to finish) but does not change how much product is formed (same plateau height). The same amount of limiting reactant is present in both cases, so the same total amount of product must be formed. A higher plateau would imply more product, not possible without adding more reactant."},{"stem":"The bond energy of a C–H bond is 413 kJ/mol. A reaction breaks four C–H bonds and makes four O–H bonds (bond energy 463 kJ/mol). What is the overall energy change?","A":"+200 kJ/mol","B":"−200 kJ/mol","C":"+3752 kJ/mol","D":"−413 kJ/mol","correct":"B","explain":"Energy in (breaking bonds) = 4 × 413 = 1652 kJ/mol. Energy out (making bonds) = 4 × 463 = 1852 kJ/mol. ΔH = 1652 − 1852 = −200 kJ/mol. The negative sign shows the reaction is exothermic, more energy is released making O–H bonds than was put in to break C–H bonds."},{"stem":"A student carries out the sodium thiosulfate and hydrochloric acid reaction at three different temperatures. She records the time until the cross disappears: 20°C → 80s, 30°C → 40s, 40°C → 20s. What is the rate at 30°C?","A":"40 s⁻¹","B":"0.025 s⁻¹","C":"0.80 s⁻¹","D":"80 s⁻¹","correct":"B","explain":"For the disappearing cross method, rate is proportional to 1/time. Rate at 30°C = 1/time = 1/40 = 0.025 s⁻¹. The data also shows the rate roughly doubling for every 10°C rise (80s → 40s → 20s), consistent with the temperature-doubling rule for many reactions."},{"stem":"An endothermic reaction is carried out in a polystyrene cup. What would you observe with a thermometer in the reaction mixture?","A":"The temperature rises by several degrees","B":"The temperature stays constant","C":"The temperature falls below the starting temperature","D":"The temperature rises then returns to the starting value","correct":"C","explain":"In an endothermic reaction, the chemicals absorb heat energy from the surroundings (the solution). This removes thermal energy from the solution, cooling it down. The thermometer reading falls below the starting temperature. ΔT = T_final − T_starting is negative for endothermic reactions."},{"stem":"On a reaction profile, the activation energy is measured as:","A":"The energy difference between the products and the reactants","B":"The energy of the products above the zero line","C":"The energy from the reactant level to the peak of the curve","D":"The energy from the peak of the curve to the product level","correct":"C","explain":"Activation energy is the minimum energy particles must have to react. On a reaction profile, this is represented as the difference in energy between the reactant level (starting line on the left) and the top of the curve (the peak/hump). It is NOT the gap from peak to products, that would give the wrong value for both exothermic and endothermic reactions."},{"stem":"Why does the gradient of a rate graph decrease as the reaction proceeds?","A":"The temperature decreases as the reaction goes on","B":"The reactants become more concentrated as the reaction proceeds","C":"As reactants are used up, their concentration falls, reducing collision frequency","D":"The catalyst becomes less effective over time","correct":"C","explain":"At the start of a reaction, reactant concentrations are highest, giving maximum collision frequency. As reactants are consumed, there are fewer reactant particles per unit volume, so collisions between reactants happen less often. The frequency of successful collisions falls, and so does the rate, shown by a decreasing gradient on the curve."},{"stem":"A student designs an experiment to show that a catalyst is unchanged in mass after a reaction. What must they do after the reaction that most candidates miss?","A":"Weigh the flask with the products inside","B":"Filter, wash and dry the catalyst, then reweigh it","C":"Add more reactant and measure the temperature change","D":"Add indicator to the reaction mixture","correct":"B","explain":"To isolate and reweigh the solid catalyst, it must be filtered out of the reaction mixture, washed with distilled water (to remove attached chemicals), and then dried (to remove water that would add to the mass). The 2019 examiner report specifically noted that most candidates scored only 2/3 because they failed to mention the filter-wash-dry recovery step."},{"stem":"H₂(g) + Cl₂(g) → 2HCl(g). Bond energies: H–H = 436 kJ/mol, Cl–Cl = 243 kJ/mol, H–Cl = 432 kJ/mol. What is the ΔH for this reaction?","A":"+1111 kJ/mol","B":"−185 kJ/mol","C":"+185 kJ/mol","D":"−679 kJ/mol","correct":"B","explain":"Bonds broken: 1 × H–H (436) + 1 × Cl–Cl (243) = 679 kJ/mol. Bonds made: 2 × H–Cl (2 × 432) = 864 kJ/mol. ΔH = 679 − 864 = −185 kJ/mol. Negative = exothermic. This makes chemical sense: hydrogen burning in chlorine is highly exothermic."},{"stem":"A student uses a gas syringe instead of a measuring cylinder to collect gas from a reaction. State one advantage of the gas syringe.","A":"The gas syringe is always cheaper and more widely available","B":"The gas syringe gives more accurate readings because it has finer graduations and works for soluble gases","C":"The gas syringe automatically records the volume without the student reading it","D":"The gas syringe prevents gas from escaping into the air","correct":"B","explain":"A gas syringe is more accurate (finer scale, lower friction, not affected by the pressure of water) and works for soluble gases like CO₂ that would dissolve in water during over-water collection. This was specifically tested in the 2022 Higher tier paper, where \"gas syringe\" with a reason (finer graduations) earned both marks."},{"stem":"A reaction between citric acid and sodium hydrogen carbonate in a test tube makes the glass feel cold. What type of reaction is this?","A":"Exothermic, heat is given out, making the glass feel cold","B":"Endothermic, heat is taken in from the surroundings, cooling the glass","C":"Exothermic, the glass is acting as the surroundings and absorbing heat","D":"Neither, only temperature probes can detect endothermic reactions","correct":"B","explain":"When the glass feels cold, the reaction inside is absorbing heat from the glass (and from your hand). The reaction takes in heat energy from the surroundings, the glass and your skin, making them feel cold. This is the classic endothermic reaction demonstration. Exothermic reactions would make the glass feel warm."},{"stem":"A student increases the pressure of a gas-phase reaction. What effect does this have on the rate, and why?","A":"The rate decreases because there is less space for particles to move","B":"The rate stays the same because pressure does not affect gases","C":"The rate increases because more particles are in the same volume, increasing collision frequency","D":"The rate increases because higher pressure raises the temperature of the gas","correct":"C","explain":"Increasing pressure compresses the gas into a smaller volume (or equivalently places more gas particles into the same volume). This is analogous to increasing concentration: more particles per unit volume means more frequent collisions between reactant particles. Pressure only affects reactions involving gases, it has no significant effect on liquids or solids."},{"stem":"The reaction profile for a catalysed reaction is compared with the uncatalysed one. Which features are the same in both profiles?","A":"The activation energy","B":"The height of the peak","C":"The energy levels of the reactants and products, and the overall energy change","D":"The time taken to complete the reaction","correct":"C","explain":"A catalyst provides an alternative pathway with a lower activation energy (lower peak) but does NOT change the energy of the reactants or products. Therefore the overall energy change (ΔH, the difference between the reactant and product energy levels) is unchanged. The reaction profile for the catalysed version has the same starting and ending heights, just a lower hump in the middle."},{"stem":"In the reaction A → B, 500 kJ/mol is needed to break the bonds in A, and 600 kJ/mol is released when bonds form in B. What is the ΔH and what type of reaction is it?","A":"+100 kJ/mol, endothermic","B":"−100 kJ/mol, exothermic","C":"+1100 kJ/mol, endothermic","D":"−600 kJ/mol, exothermic","correct":"B","explain":"ΔH = energy in (bonds broken) − energy out (bonds made) = 500 − 600 = −100 kJ/mol. Negative ΔH = exothermic. More energy is released making bonds in B than was absorbed breaking bonds in A, so the surplus energy is released to the surroundings as heat."},{"stem":"A student is monitoring a rate-of-reaction experiment and notices the graph levels off at 45 cm³ of gas. She then repeats the experiment with twice the amount of acid (but keeps the marble chips the same). What will the new plateau height be?","A":"90 cm³, double because twice the acid is used","B":"45 cm³, same, because the marble chips are the limiting reactant","C":"22.5 cm³, half because the acid takes longer to react","D":"0 cm³, no gas is produced because there is too much acid","correct":"B","explain":"The plateau height depends on the limiting reactant. The marble chips are used in the same amount, so the same number of moles of CaCO₃ can react, producing the same number of moles of CO₂, regardless of how much excess acid is present. Doubling the acid just means the acid is not the limiting reactant; it doesn't produce more product."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
