<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>3.4 Enthalpy Changes</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Which sign of ΔH indicates an exothermic reaction?","A":"ΔH is positive, as energy is released","B":"ΔH is zero, as the system is at equilibrium","C":"ΔH is negative","D":"ΔH is always positive for reactions involving combustion","correct":"C","explain":"ΔH = H(products) − H(reactants). In an exothermic reaction, products have lower enthalpy than reactants, so H(products) < H(reactants) and ΔH is negative. Heat energy leaves the system and enters the surroundings, which is why the surroundings (and any thermometer) get warmer. The common error is thinking \"the beaker gets hot so energy is going up\" and writing a positive ΔH; always remember that ΔH refers to the system (the reacting chemicals), not the surroundings."},{"stem":"What is the definition of activation energy?","A":"The enthalpy change between reactants and products","B":"The total energy released when bonds form in the products","C":"The minimum energy required for a reaction to occur","D":"The energy difference between the products and the top of the enthalpy profile curve","correct":"C","explain":"Activation energy (Ea) is the minimum energy that colliding particles must possess before a reaction can take place. It corresponds to the energy needed to break bonds in the reactants and form the transition state (the high-energy arrangement at the peak of the enthalpy profile). Even strongly exothermic reactions have an activation energy, which is why a spark is needed to ignite methane rather than it combusting spontaneously at room temperature."},{"stem":"What are the standard conditions used in thermochemistry?","A":"100 kPa and 273 K","B":"100 Pa and 298 K","C":"100 kPa and 298 K","D":"101 kPa and 298 K","correct":"C","explain":"Standard conditions are 100 kPa (1 bar) and 298 K (25°C). The OCR June 2023 H032/01 examiner report flagged that only just over half of candidates scored this mark, with the most common errors being 273 K (the temperature used in STP for gas law calculations, which is a different convention) and 100 Pa (out by a factor of 1000). Learn these as a pair: 100 kPa and 298 K."},{"stem":"What is the standard enthalpy change of formation of any element in its standard state?","A":"Equal to its standard enthalpy of combustion","B":"Dependent on the physical state of the element","C":"Zero","D":"Approximately −57 kJ mol⁻¹","correct":"C","explain":"The definition of ΔfH° is the enthalpy change to form 1 mole of a compound from its elements in their standard states. If the substance you are forming is itself an element in its standard state, no chemical change occurs: you start with the element and end with the same element, so ΔH = 0. For example, ΔfH°[O₂(g)] = 0 and ΔfH°[C(graphite)] = 0. This fact is essential for Hess' law calculations: ΔfH° terms for elements cancel out, simplifying the arithmetic."},{"stem":"What is the standard state of water at 298 K and 100 kPa?","A":"H₂O(g)","B":"H₂O(l)","C":"H₂O(s)","D":"It depends on the reaction","correct":"B","explain":"The standard state of a substance is its most stable physical form under standard conditions (298 K and 100 kPa). At 298 K (25°C), water is a liquid (it freezes at 273 K and boils at 373 K). Using H₂O(g) in equations for ΔcH° or ΔneutH° is one of the most common errors in enthalpy calculations, and loses marks in both definition-writing and Hess' law questions. Always write H₂O(l) as the product of combustion and neutralisation."},{"stem":"Which of the following statements about the standard enthalpy change of combustion (ΔcH°) is correct?","A":"It can be positive or negative depending on the fuel","B":"It is always negative","C":"It is always positive, as bond breaking is endothermic","D":"It equals the enthalpy of formation of CO₂ for carbon-containing fuels","correct":"B","explain":"Combustion is the reaction of a substance with oxygen to form the fully oxidised products (CO₂ and H₂O for organic compounds). Combustion always releases energy because the strong C=O bonds in CO₂ and O–H bonds in H₂O release more energy on formation than is required to break the C–H, C–C, and O=O bonds in the reactants. Therefore ΔcH° is always negative (exothermic). It can never be positive; a substance that required energy to combust would be endothermic under those conditions, which is not physically what combustion means."},{"stem":"What is the approximate value of ΔneutH° for the reaction of a strong acid with a strong base?","A":"+57 kJ mol⁻¹","B":"−57 kJ mol⁻¹","C":"−285 kJ mol⁻¹","D":"It varies widely depending on which acid and base are used","correct":"B","explain":"For any strong acid + strong base reaction, the only chemical change that occurs is H⁺(aq) + OH⁻(aq) → H₂O(l), as both acid and base are fully ionised and the counter-ions are spectators. Since the same ionic reaction occurs every time, ΔneutH° is approximately the same regardless of which strong acid and which strong base are used: approximately −57 kJ mol⁻¹ per mole of water formed. Weak acids give values slightly less exothermic (e.g. −55 kJ mol⁻¹) because energy is consumed in fully ionising the weak acid before it can react."},{"stem":"Which statement correctly describes bond breaking?","A":"Bond breaking is exothermic, as energy is released when bonds break","B":"Bond breaking is endothermic, requiring energy input","C":"Bond breaking has ΔH = 0, as it is the reverse of bond making","D":"Bond breaking is exothermic for strong bonds and endothermic for weak bonds","correct":"B","explain":"A covalent bond exists because two atoms are held together by electrostatic attraction between the shared electron pair and both nuclei. To break the bond, this attraction must be overcome, which requires an input of energy from the surroundings. Bond breaking is therefore always endothermic (ΔH positive). Bond making is the opposite: always exothermic (ΔH negative). This asymmetry is the key to understanding why some reactions are exothermic overall (bonds made release more energy than bonds broken absorb) and others are endothermic (the reverse)."},{"stem":"What are the units of the specific heat capacity of water?","A":"J K⁻¹","B":"J g⁻¹ K⁻¹","C":"kJ mol⁻¹ K⁻¹","D":"J kg⁻¹ °C⁻¹ only, not J g⁻¹ K⁻¹","correct":"B","explain":"Specific heat capacity (c) is defined as the energy required to raise the temperature of 1 gram of a substance by 1 kelvin (or equivalently 1°C, since 1 K = 1°C in size). For water, c = 4.18 J g⁻¹ K⁻¹. Note that the units include grams (not kg), which matters when substituting into q = mcΔT: the mass m must be in grams to match these units. Using mass in kg with c in J g⁻¹ K⁻¹ would give q values 1000 times too large."},{"stem":"State Hess' law.","A":"The enthalpy change of a reaction equals the sum of the bond enthalpies of the products minus those of the reactants","B":"The total enthalpy change for a chemical reaction is independent of the route taken, provided the initial and final conditions are the same","C":"The total enthalpy change is equal to the enthalpy of combustion of the reactants","D":"Enthalpy change equals the activation energy multiplied by the number of moles reacting","correct":"B","explain":"Hess' law states that the total enthalpy change of a reaction is independent of the route, as long as the starting and ending conditions are identical. This works because enthalpy is a state function: it depends only on the current state of the system, not on the path taken to reach it. This allows unknown ΔH values to be calculated by summing known ΔH values along an alternative indirect route between the same reactants and products."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
