<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>3.6 Chemical Equilibrium - inferno &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>3.6 &mdash; Chemical Equilibrium</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Inferno &mdash; Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"At equilibrium, [SO₂] = 0.30 mol dm⁻³, [O₂] = 0.10 mol dm⁻³, and [SO₃] = 0.60 mol dm⁻³ for the reaction 2SO₂(g) + O₂(g) ⇌ 2SO₃(g). Calculate Kc and state its units.","A":"Kc = 13.3 mol⁻¹ dm³","B":"Kc = 40.0 mol⁻¹ dm³","C":"Kc = 40.0 mol dm⁻³","D":"Kc = 0.0225 mol dm⁻³","correct":"B","explain":"Kc = [SO₃]² / ([SO₂]²[O₂]) = (0.60)² / ((0.30)² × 0.10) = 0.36 / (0.09 × 0.10) = 0.36 / 0.009 = 40.0. Units: derive from the expression. Numerator: (mol dm⁻³)². Denominator: (mol dm⁻³)² × (mol dm⁻³) = (mol dm⁻³)³. Overall units: (mol dm⁻³)²/(mol dm⁻³)³ = (mol dm⁻³)⁻¹ = mol⁻¹ dm³. The large Kc (40.0 mol⁻¹ dm³) confirms SO₃ is strongly favoured at this temperature, consistent with the Contact process using lower temperatures (around 450°C) to maximise yield."},{"stem":"0.50 mol of N₂O₄(g) is placed in a 1.00 dm³ sealed flask. At equilibrium at 350 K, 30% of the N₂O₄ has dissociated: N₂O₄(g) ⇌ 2NO₂(g). Calculate Kc.","A":"Kc = 0.129 mol dm⁻³","B":"Kc = 0.257 mol dm⁻³","C":"Kc = 0.514 mol dm⁻³","D":"Kc = 0.090 mol dm⁻³","correct":"B","explain":"ICE table (in mol, volume = 1.00 dm³ so concentrations = moles numerically): N₂O₄ initial = 0.50; change = −0.15 (30% of 0.50); equilibrium = 0.35 mol dm⁻³. NO₂ initial = 0; change = +0.30 (stoichiometry 1:2, so 2 × 0.15); equilibrium = 0.30 mol dm⁻³. Kc = [NO₂]²/[N₂O₄] = (0.30)²/0.35 = 0.090/0.35 = 0.257 mol dm⁻³. Units: (mol dm⁻³)²/(mol dm⁻³) = mol dm⁻³. Option A used change = 0.15 in [NO₂] without multiplying by the 1:2 stoichiometric ratio."},{"stem":"The Haber process operates at 450°C and approximately 200 atm with an iron catalyst. Use Le Chatelier's principle and kinetics to explain why these conditions are chosen rather than (a) lower temperature with higher yield, or (b) lower pressure with greater safety.","A":"450°C and 200 atm both maximise yield; lower T and lower p give worse yield and slower rates","B":"A lower temperature would give a higher equilibrium yield of NH₃ (forward reaction is exothermic) but an unacceptably slow rate even with a catalyst; higher pressure gives better yield (fewer moles of gas on the right) but is limited by cost and engineering safety. The 450°C and 200 atm compromise gives a commercially acceptable rate at a still-reasonable yield, and the catalyst lowers Ea to make the rate viable at 450°C","C":"450°C is the temperature at which Kc is maximised; 200 atm prevents the catalyst being poisoned","D":"Lower temperature and lower pressure both give worse yields; only the conditions stated optimise the yield","correct":"B","explain":"N₂ + 3H₂ ⇌ 2NH₃, ΔH = −92 kJ mol⁻¹. Le Chatelier for temperature: forward reaction is exothermic, so lower T favours NH₃ (higher Kc and yield). However, at lower temperatures the Boltzmann distribution shows far fewer molecules with E ≥ Ea: the rate is economically unviable without a catalyst, and even with Fe it is too slow below about 350°C. Le Chatelier for pressure: 4 moles reactant gas vs 2 moles product gas, so higher pressure improves yield. But very high pressures require expensive, thick-walled reactors and pose explosion risks. The 450°C/200 atm compromise sacrifices some yield (only ~15% conversion per pass) but achieves a commercially useful rate; unreacted gases are recycled, giving overall conversion approaching 97%."},{"stem":"Explain why changing the concentration of a reactant shifts the position of equilibrium but does not change the value of Kc.","A":"Kc does not include reactant concentrations, so they cannot affect it","B":"Kc is fixed at a given temperature; adding reactant creates a reaction quotient Q < Kc, so the system shifts forward until Q = Kc again, restoring the same ratio of product to reactant concentrations required by Kc","C":"Kc only changes when a new catalyst is added, not when concentration changes","D":"Adding reactant lowers the temperature, which stabilises Kc at its original value","correct":"B","explain":"Kc is a thermodynamic quantity determined solely by temperature. Adding more reactant transiently raises [reactant], making the reaction quotient Q = [products]/[reactants] smaller than Kc. Since Q < Kc, the forward reaction is favoured and the system shifts right until Q rises back to equal Kc. At the new equilibrium, concentrations have changed (there is more product than before the disturbance), but the ratio [products]/[reactants] (to the power of stoichiometric coefficients) equals the same Kc as before. Temperature is unchanged, so Kc is unchanged. The equilibrium position moved; Kc did not."},{"stem":"If Kc = 37.5 for H₂(g) + I₂(g) ⇌ 2HI(g) at 500 K, what is the value of Kc for the reverse reaction 2HI(g) ⇌ H₂(g) + I₂(g) at the same temperature?","A":"37.5","B":"75.0","C":"0.0267","D":"1.0 (Kc is the same for both directions)","correct":"C","explain":"When an equation is reversed, the new Kc is the reciprocal of the original. For the reverse reaction: Kc(reverse) = [H₂][I₂] / [HI]² = 1 / (37.5) = 0.0267 (no units). This makes physical sense: if the forward reaction strongly favours HI (Kc >> 1), then starting from HI the reverse reaction is unfavourable (Kc << 1). This reciprocal relationship holds because the same equilibrium concentrations satisfy both expressions: if [HI]²/([H₂][I₂]) = 37.5, then [H₂][I₂]/[HI]² = 1/37.5. Temperature is the same, so the equilibrium concentrations are the same, just described by the inverted expression."},{"stem":"A reaction X ⇌ Y has Kc = 3.0 × 10⁻⁴ at 600 K (no units). What does this value tell you about the equilibrium position, and what would happen to Kc if the temperature were raised to 700 K for an endothermic forward reaction?","A":"Reactants dominate at 600 K; Kc decreases at 700 K","B":"Reactants dominate at 600 K; Kc increases at 700 K","C":"Products dominate at 600 K; Kc decreases at 700 K","D":"Products dominate at 600 K; Kc increases at 700 K","correct":"B","explain":"Kc = 3.0 × 10⁻⁴ << 1 means [reactants] >> [products] at equilibrium: the equilibrium lies well to the left and reactants dominate. For an endothermic forward reaction (ΔH positive), increasing temperature provides the energy the forward reaction needs: Le Chatelier's principle predicts the equilibrium shifts right, increasing [Y] relative to [X]. Since Kc = [Y]/[X], Kc increases when T increases for an endothermic forward reaction. This is the opposite of an exothermic forward reaction, where Kc decreases with temperature."},{"stem":"A student observes a sealed flask of N₂O₄(g) ⇌ 2NO₂(g) at room temperature and concludes: \"Since the concentrations aren't changing, the reaction must have stopped.\" Evaluate this claim.","A":"Correct: equilibrium and stopped reaction are equivalent; no movement means no change","B":"Incorrect: at equilibrium both the forward and reverse reactions continue at equal rates; the macroscopic concentrations are constant because the rates exactly balance, but at the molecular level N₂O₄ is continuously dissociating and NO₂ is continuously recombining","C":"Correct for N₂O₄ specifically, as this equilibrium has a high Ea and is effectively frozen at room temperature","D":"Incorrect: at equilibrium only the forward reaction continues; the reverse has stopped","correct":"B","explain":"This is the \"dynamic\" vs \"static\" distinction. At dynamic equilibrium, both reactions proceed continuously at the molecular level. Individual N₂O₄ molecules dissociate to give NO₂ at the same rate that pairs of NO₂ molecules recombine to give N₂O₄. The bulk concentration of each species appears unchanged because the rates of formation and removal are equal. The analogy is an escalator going up alongside one going down: the numbers on each appear constant, but no one is standing still. Radioactive labelling experiments confirm this: isotopically labelled atoms distribute themselves between both species over time, proving the reactions continue."},{"stem":"Removing a product continuously from an industrial equilibrium can drive a reaction forward to near-completion. Evaluate whether this is always economically beneficial.","A":"Yes, removing product always maximises yield at minimal cost","B":"Not always: while removing product shifts the equilibrium right (Le Chatelier) and increases overall conversion, the energy and cost of separation must be compared with the benefit of higher conversion. For some reactions (e.g. NH₃ liquefaction from the Haber process) the separation is straightforward and economical; for others the separation cost may exceed the gain in yield","C":"No, removing product always lowers the rate too much to be economical","D":"Not always: removal of product lowers the temperature, which shifts the equilibrium left for exothermic reactions","correct":"B","explain":"Le Chatelier's principle predicts that removing a product shifts equilibrium to the right to replace it, increasing overall conversion. In the Haber process, NH₃ is continuously liquefied (it condenses at −33°C, while N₂ and H₂ remain gaseous at the operating temperature) and separated, allowing the unreacted gases to be recycled. This is economically viable because the liquefaction is cheap and the recycling approach achieves ~97% overall conversion from multiple passes. However, if the product is chemically similar to the reactants (e.g. isomers), the separation step may require expensive distillation or chromatography whose cost outweighs the yield benefit."},{"stem":"At equilibrium, a 2.00 dm³ flask contains 0.40 mol SO₂, 0.20 mol O₂, and 0.80 mol SO₃ for 2SO₂(g) + O₂(g) ⇌ 2SO₃(g). The temperature is then increased. Given that the forward reaction is exothermic, predict what happens to [SO₃], [SO₂], [O₂], and Kc, and calculate the original Kc.","A":"All concentrations increase; Kc increases","B":"[SO₃] decreases; [SO₂] and [O₂] increase; Kc decreases; original Kc = 40.0 mol⁻¹ dm³","C":"[SO₃] increases; [SO₂] and [O₂] decrease; Kc decreases; original Kc = 40.0 mol⁻¹ dm³","D":"Nothing changes; Kc is independent of temperature","correct":"B","explain":"Original concentrations: [SO₂] = 0.40/2.00 = 0.20 mol dm⁻³; [O₂] = 0.20/2.00 = 0.10 mol dm⁻³; [SO₃] = 0.80/2.00 = 0.40 mol dm⁻³. Kc = (0.40)² / ((0.20)² × 0.10) = 0.16 / (0.04 × 0.10) = 0.16 / 0.004 = 40.0 mol⁻¹ dm³. Increasing temperature for an exothermic forward reaction: shifts equilibrium left (endothermic direction) to absorb the added heat. So [SO₃] decreases and [SO₂] and [O₂] increase. Kc decreases (temperature changes Kc; for exothermic forward reactions, Kc decreases as T rises). This is why the Contact process uses a compromise temperature of ~450°C rather than the lowest possible temperature: below ~450°C the rate is too slow even with V₂O₅ catalyst."},{"stem":"The following Kc values are measured for A(g) ⇌ B(g) at different temperatures: 400 K → Kc = 0.10; 500 K → Kc = 0.50; 600 K → Kc = 2.5. Using this data, determine whether the forward reaction is exothermic or endothermic, predict the effect of increasing pressure at 500 K, and state what happens to Kc if a catalyst is added at 500 K.","A":"Exothermic; pressure shifts equilibrium right; Kc increases with catalyst","B":"Endothermic; no effect of pressure change; Kc unchanged with catalyst","C":"Exothermic; no effect of pressure change; Kc decreases with catalyst","D":"Endothermic; pressure shifts equilibrium right; Kc increases with catalyst","correct":"B","explain":"Kc increases with temperature (0.10 → 0.50 → 2.5 as T rises from 400 K to 600 K). For Kc to increase with rising temperature, the equilibrium must shift right at higher T. By Le Chatelier, a system shifts right when heated if the forward reaction is endothermic (it absorbs the added heat). So the forward reaction A → B is endothermic. Pressure effect: A(g) ⇌ B(g) has equal moles of gas on both sides (1 = 1), so pressure changes have no effect on the equilibrium position. Catalyst: a catalyst lowers Ea for both forward and reverse reactions equally, does not change T, and therefore does not change Kc. Kc remains 0.50 at 500 K."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
