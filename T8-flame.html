<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T8 Flame | Fuels & Earth Science</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}

/* ── landing hero ── */
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#4a1d96 0%,#6d28d9 45%,#9333ea 80%,#c084fc 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto .5rem}
.hero-pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
.hero-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:600}

/* ── tier legend ── */
.tier-legend{display:flex;gap:0;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}

/* ── topic grid ── */
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem;padding-left:.2rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

/* ── quiz page ── */
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>

<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T8 Fuels &amp; Earth Science</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>20 questions</span>
    <span>Flame: Apply</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"A student compares petrol (C₈H₁₈) and diesel (C₁₄H₃₀) fractions. Which property correctly distinguishes them?","A":"Petrol has a higher boiling point than diesel","B":"Diesel is more flammable than petrol","C":"Petrol is more volatile and less viscous than diesel","D":"Diesel is collected nearer the top of the fractional distillation column","correct":"C","explain":"Going from short to long chains: boiling point rises, viscosity increases, flammability and volatility decrease. Petrol has shorter chains so it is more volatile (evaporates more easily) and less viscous (flows more easily). Diesel is collected lower in the column because its longer chains need more heat to vaporise."},{"stem":"Methane undergoes complete combustion. Write the balanced equation.","A":"CH₄ + O₂ → CO₂ + H₂O","B":"CH₄ + 2O₂ → CO₂ + 2H₂O","C":"2CH₄ + O₂ → 2CO + 4H₂O","D":"CH₄ + O₂ → C + 2H₂O","correct":"B","explain":"CH₄ + 2O₂ → CO₂ + 2H₂O. Balance carbon first (1 C → 1 CO₂ ✓), then hydrogen (4 H → 2 H₂O ✓), then oxygen (2 O₂ = 4 O atoms; 1×2 from CO₂ + 2×1 from H₂O = 4 O atoms ✓). Two oxygen molecules are needed."},{"stem":"A gas heater in a poorly-ventilated room burns methane in a limited oxygen supply. Which products form?","A":"Carbon dioxide and water only","B":"Carbon monoxide, soot, carbon dioxide and water","C":"Carbon monoxide only","D":"Nitrogen dioxide and soot","correct":"B","explain":"In a limited oxygen supply, incomplete combustion occurs. Depending on exactly how much oxygen is available, carbon atoms may be oxidised fully to CO₂, partially to CO, or not at all (forming solid carbon/soot). All three carbon-containing products can form simultaneously, alongside water."},{"stem":"Describe how the properties of crude oil fractions change from the top to the bottom of the fractionating column.","A":"Boiling point decreases; viscosity decreases; chain length decreases","B":"Boiling point increases; viscosity increases; chain length increases","C":"Boiling point decreases; viscosity increases; chain length decreases","D":"Boiling point increases; chain length decreases; flammability increases","correct":"B","explain":"The fractionating column is hottest at the bottom and cooler at the top. Longer-chain hydrocarbons (higher BP) can only condense lower in the column. Going from top to bottom: chain length increases → BP increases → viscosity increases → flammability decreases → volatility decreases."},{"stem":"Why does acid rain damage limestone buildings?","A":"SO₂ reacts directly with limestone in a displacement reaction","B":"Acid rain reacts with calcium carbonate in the limestone","C":"Acid rain dehydrates the CaCO₃ to CaO","D":"Nitrogen oxides oxidise the calcium in limestone to calcium nitride","correct":"B","explain":"Limestone contains calcium carbonate (CaCO₃). When acidic rain (containing sulfurous/sulfuric acid or nitric acid) falls on it, the acid reacts with the carbonate: CaCO₃ + H₂SO₄ → CaSO₄ + H₂O + CO₂. This erodes statues and buildings over time."},{"stem":"A student says: \"Nitrogen oxides come from nitrogen impurities in the fuel.\" What is wrong with this?","A":"Nothing, nitrogen is always an impurity in hydrocarbon fuels","B":"Nitrogen oxides come from CO in the exhaust, not from the fuel","C":"Petrol and diesel are hydrocarbons and contain no nitrogen; the N comes from air","D":"Nitrogen oxides are only produced from diesel, not petrol","correct":"C","explain":"Petrol and diesel are hydrocarbons, they contain only C and H, with no nitrogen. The nitrogen in NOₓ comes from N₂ in the air drawn into the engine. At high engine temperatures, N₂ + O₂ → 2NO. This is a key misconception flagged in examiner reports."},{"stem":"Why is hydrogen produced by steam reforming not considered a \"clean\" fuel overall?","A":"It produces CO instead of CO₂ when burned","B":"The process uses a lot of water which is wasteful","C":"Steam reforming of methane produces CO₂ as a by-product","D":"Hydrogen is radioactive when produced industrially","correct":"C","explain":"Steam reforming: CH₄ + 2H₂O → CO₂ + 4H₂. Although the hydrogen itself only produces water when burned, the CO₂ released during production means overall carbon emissions may be no better than burning fossil fuels directly. Hydrogen from renewable electrolysis avoids this."},{"stem":"What is cracking, and why is it necessary?","A":"Cooling long-chain alkanes until they solidify, because solids are more useful","B":"Breaking long-chain alkanes into shorter, more useful alkanes and alkenes","C":"Burning long-chain alkanes in limited oxygen to produce CO and alkenes","D":"Reacting long alkanes with steam to produce hydrogen","correct":"B","explain":"Cracking breaks down large alkane molecules using high temperature (and often a catalyst such as aluminium oxide). The products are shorter alkanes (more useful as fuel) and alkenes (used to make polymers). It is necessary because crude oil produces too many heavy fractions and not enough petrol and alkene feedstocks."},{"stem":"Why is CO₂ described as a greenhouse gas?","A":"It absorbs visible light from the Sun and heats the atmosphere directly","B":"It reflects infrared radiation away from the Earth into space","C":"It absorbs infrared radiation emitted by the Earth and re-emits energy back towards the surface","D":"It reacts with O₂ to form ozone, which traps heat","correct":"C","explain":"The Earth absorbs visible light from the Sun and re-emits longer-wavelength infrared (heat) radiation. CO₂ molecules absorb this infrared and re-emit energy in all directions, including back down to Earth's surface. This keeps the Earth warmer than it would otherwise be."},{"stem":"In the early atmosphere there was little or no oxygen. Why?","A":"All the oxygen had dissolved in the oceans","B":"The Sun's UV radiation broke down any oxygen that formed","C":"There were no photosynthesising organisms to produce oxygen","D":"Oxygen did not exist as a chemical until plants evolved","correct":"C","explain":"Today's oxygen-rich atmosphere exists because of photosynthesis by plants, algae and cyanobacteria. In Earth's first few hundred million years, none of these existed. Any oxygen produced by volcanic activity would quickly react with iron or other minerals and be removed, keeping atmospheric O₂ at negligible levels."},{"stem":"Why are petrol, kerosene and diesel oil described as non-renewable?","A":"They can only be used once and then must be recycled","B":"They form over millions of years and are used up far faster than they form","C":"They contain no renewable materials from living organisms","D":"They cannot be replaced by any other fuel","correct":"B","explain":"Non-renewable means the rate of use far exceeds the rate of formation. Crude oil took tens to hundreds of millions of years to form from ancient organisms buried without oxygen. We are burning those reserves in decades. Once gone, they cannot be replenished on any useful human timescale."},{"stem":"A member of a homologous series has the formula C₅H₁₂. What is the formula of the next member?","A":"C₅H₁₄","B":"C₆H₁₂","C":"C₆H₁₄","D":"C₇H₁₆","correct":"C","explain":"Members of a homologous series differ by CH₂ between successive members. Starting with C₅H₁₂, add CH₂ to get C₆H₁₄. This matches the alkane formula CₙH₂ₙ₊₂: for n=6, 2×6+2=14 ✓. Alkanes form a homologous series with similar chemical properties and a gradual change in physical properties."},{"stem":"Which of the following correctly explains why SO₂ causes acid rain?","A":"SO₂ reacts with nitrogen in clouds to form sulfuric acid","B":"SO₂ dissolves in water droplets in clouds to form acidic solutions","C":"SO₂ absorbs UV radiation and splits water molecules","D":"SO₂ reacts with CO₂ in the atmosphere to form carbonic acid","correct":"B","explain":"SO₂ dissolves in atmospheric water droplets: SO₂ + H₂O → H₂SO₃ (sulfurous acid). This then falls as acid rain (pH well below the natural 5.6). SO₂ may also be oxidised further to SO₃, which dissolves to form H₂SO₄ (sulfuric acid). Both are much stronger acids than carbonic acid."},{"stem":"Hydrogen is stored as a compressed gas in a car. Give one disadvantage of this.","A":"Hydrogen burns to produce CO₂ so it is not clean","B":"Compressed hydrogen is highly flammable and poses a safety risk","C":"Hydrogen has a lower energy density than petrol, so it gives less energy per gram","D":"Hydrogen is very expensive because it is rare in the universe","correct":"B","explain":"Hydrogen is highly flammable and, when compressed at high pressure, poses a significant safety risk if the tank ruptures or leaks. This is one of the major practical disadvantages of hydrogen as a road fuel, storage and infrastructure are far less safe and developed than petrol distribution networks."},{"stem":"Why does burning methane in a plentiful supply of oxygen not produce soot?","A":"Methane has too few carbon atoms to form soot","B":"With enough oxygen, all carbon atoms are fully oxidised to CO₂","C":"The flame temperature is too low to produce carbon particles","D":"Methane is a gas so the carbon cannot form solid particles","correct":"B","explain":"Soot (solid carbon) forms when there is so little oxygen that some carbon atoms are not oxidised at all. In a plentiful oxygen supply, every carbon atom is fully oxidised to CO₂, there is no carbon left over to form soot. This is complete combustion."},{"stem":"Which human activity releases methane as a greenhouse gas?","A":"Burning petrol in car engines","B":"Livestock farming, especially cattle","C":"Cement production from limestone","D":"Using aerosol spray cans","correct":"B","explain":"Methane is released from multiple human activities. Cattle and other ruminants have bacteria in their guts that produce methane as they digest plant material. This methane is exhaled or belched into the atmosphere. Other CH₄ sources include rice paddies, landfill sites and leaks from natural gas pipelines."},{"stem":"Deduce the correct products when propane (C₃H₈) undergoes incomplete combustion to form carbon monoxide only.","A":"C₃H₈ + 2O₂ → 3C + 4H₂O","B":"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O","C":"2C₃H₈ + 7O₂ → 6CO + 8H₂O","D":"C₃H₈ + 3O₂ → 3CO + 4H₂O","correct":"C","explain":"For the CO pathway of incomplete combustion of C₃H₈: balance C → 3CO; balance H → 4H₂O; then O: 3 (from CO) + 4 (from H₂O) = 7 O atoms, requiring 3.5 O₂ molecules → double everything to get whole numbers: 2C₃H₈ + 7O₂ → 6CO + 8H₂O ✓."},{"stem":"Why is correlation between rising CO₂ and rising temperature not by itself proof that CO₂ causes warming?","A":"The data only goes back 50 years, which is not enough time","B":"Temperature and CO₂ always rise together naturally, so correlation is expected","C":"Correlation shows two variables change together but does not prove one causes the other","D":"The measurements are taken in Antarctica so they do not represent the whole world","correct":"C","explain":"Two variables can be correlated by coincidence or because both are caused by a third factor. Correlation shows a pattern, not a mechanism. For CO₂ and temperature, there is also a physical mechanism (the enhanced greenhouse effect), this combination of correlation plus mechanism makes the case for causation much stronger than correlation alone."},{"stem":"A crude oil fraction contains molecules with 10–14 carbon atoms. Where would it condense in the fractionating column?","A":"Near the top, it has relatively short chains","B":"Near the bottom, it has relatively long chains","C":"It would leave as a gas from the top of the column","D":"In the middle, chain length has no effect on boiling point","correct":"B","explain":"Longer chains have stronger intermolecular forces, giving higher boiling points. A C₁₀–C₁₄ fraction (diesel range) has a high boiling point and will only condense at the hotter lower regions of the column. Shorter-chain petrol (C₅–C₁₀) condenses higher up; gases (C₁–C₄) leave from the top."},{"stem":"Why is it scientifically important that early-atmosphere composition is described as \"thought to contain\" rather than \"proven to contain\"?","A":"Scientists are uncertain about chemistry and prefer vague language","B":"We cannot directly sample air from 4.5 billion years ago, so the evidence is indirect","C":"The early atmosphere may not have existed at all","D":"Different countries have different theories about the early atmosphere","correct":"B","explain":"No one was alive 4.5 billion years ago to measure the early atmosphere directly. Scientists infer its composition from indirect evidence: modern volcanic gas compositions, ancient rock chemistry, and fossil records. Indirect evidence could be misinterpreted and new evidence could refine the model, hence the qualifier \"thought to contain\"."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
