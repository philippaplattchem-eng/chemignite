<script>
const QUESTIONS=[{"stem":"Design a fair experiment to compare the rates of hydrolysis of 1-chlorobutane, 1-bromobutane and 1-iodobutane. State every controlled variable, the dependent variable, and the observation that indicates a faster rate.","A":"Add each haloalkane directly to water; observe which dissolves fastest; use volume as the controlled variable","B":"Dissolve equal volumes (or moles) of each haloalkane in the same volume of ethanol; add the same volume of aqueous AgNO₃ at the same temperature (≈50 °C water bath); start timers simultaneously; record the time to first visible precipitate — shorter time = faster rate. Controlled variables: concentration, volume of ethanol, volume of AgNO₃, temperature. Independent variable: identity of halogen. Dependent variable: time to precipitate","C":"Mix each haloalkane with aqueous NaOH and observe the colour change of the solution using universal indicator","D":"Add each haloalkane to concentrated H₂SO₄ and measure the temperature change","correct":"B","explain":"A valid comparative experiment requires: (1) <b>Same moles of each haloalkane</b> — or same volume if pure liquid haloalkanes of similar density; this controls for concentration. (2) <b>Same volume of ethanol</b> as co-solvent (haloalkanes are insoluble in water; ethanol creates a single phase). (3) <b>Same volume and concentration of aqueous AgNO₃</b> — this controls the [Ag⁺] available to precipitate the halide. (4) <b>Same temperature</b> — using a water bath at ≈50 °C is essential because 1-chlorobutane reacts too slowly at room temperature for a comparison within lesson time. (5) <b>Only the halogen identity varies</b> (the independent variable). The <b>dependent variable</b> is the time to first visible precipitate (cloudiness): faster hydrolysis → more X⁻ released sooner → AgX precipitates earlier. The colours also confirm which halide was released: white = Cl⁻, cream = Br⁻, yellow = I⁻."},{"stem":"A student performs the AgNO₃/ethanol experiment and records: 1-chlorobutane — no precipitate after 10 min; 1-bromobutane — cream precipitate after 45 s; 1-iodobutane — yellow precipitate after 8 s. An unknown haloalkane X gives a white precipitate after 4 min. Identify X and explain the reasoning.","A":"X is 1-iodobutane; the long delay is due to experimental error","B":"X is 1-fluorobutane; the white colour means no Cl is present","C":"X contains a C–Cl bond (white precipitate = AgCl) and hydrolyses more slowly than 1-bromobutane but faster than \"no precipitate\" threshold of 1-chlorobutane; the 4 min time suggests X may be a secondary or tertiary chloroalkane, or a shorter-chain chloroalkane, but its precipitate colour confirms chlorine","D":"X must be a fluoroalkane because white precipitates are only produced from fluorides","correct":"C","explain":"The precipitate colour identifies the halide ion released: <b>white = AgCl → X contains chlorine</b>. The time of 4 minutes places X between 1-bromobutane (45 s; C–Br) and 1-chlorobutane (>10 min; C–Cl). Since X gives a white precipitate (confirming C–Cl, not C–Br), but hydrolyses faster than 1-chlorobutane, the most likely explanation is that X is a <b>chloroalkane with a weaker or more reactive C–Cl bond</b> — for instance, a secondary or tertiary chloroalkane (where the C* carbon is more substituted, making substitution faster) or a shorter chain that changes solubility. A secondary chloroalkane undergoes substitution more readily than a primary one under these mild conditions. The analytical approach: (1) precipitate colour → identify the halogen; (2) time to precipitate → rank relative to known compounds."},{"stem":"Draw and explain the full SN2 mechanism for the reaction of 1-bromopropane with the ethanoate ion (CH₃COO⁻). State which atom of the ethanoate ion carries out the attack, the product, and the two exam errors that OCR November 2021 examiner reports flagged.","A":"The carbon of –COO⁻ attacks the δ⁺ C of C–Br; product is CH₃CH₂CH₂OCOCH₃ (propyl ethanoate); OCR errors were: curly arrow from C of CH₃ instead of O of COO⁻, and wrong carbon count in the product","B":"One of the oxygen atoms of –COO⁻ attacks the δ⁺ C of C–Br; product is CH₃CH₂CH₂OCOCH₃ (propyl ethanoate / 1-propyl ethanoate); OCR errors (H432/03 Nov 2021) were: curly arrows not starting from a lone pair or − charge on carboxylate oxygen, and products with wrong numbers of carbon atoms","C":"Nitrogen of the ethanoate attacks; product is an amide; OCR flagged use of half-headed arrows","D":"The H of CH₃ in ethanoate attacks; product is propyl ethanoate + HBr; OCR flagged wrong arrow direction","correct":"B","explain":"The ethanoate ion (CH₃COO⁻) has the negative charge delocalised over both oxygen atoms of the –COO⁻ group. The nucleophilic attack proceeds from a <b>lone pair on one of the carboxylate oxygens</b> (or from the − charge on that O). The mechanism is identical in shape to the OH⁻ mechanism: first arrow from the O lone pair (or − charge) to the δ⁺ carbon of C–Br; second arrow from C–Br bond to Br. Product: CH₃CH₂CH₂OCOCH₃ (propyl ethanoate, an ester). Carbon count: 3C (from propane chain) + 2C (from CH₃CO–) = 5C total; the Br carries no carbons and leaves. The H432/03 November 2021 examiner report identified two specific errors: (1) \"curly arrows not starting from either a lone pair or the − charge on the carboxylate oxygen\" — candidates guessed at the arrow start and placed it from carbon or from the middle of the –COO⁻; (2) \"reactants and products with the wrong number of carbon atoms\" — candidates inserted extra –CH₂– groups or dropped carbons."},{"stem":"Evaluate the claim: \"Once CFCs are banned, the ozone layer will recover within a few years.\" Use data on atmospheric lifetimes and the catalytic nature of Cl• to assess this claim.","A":"The claim is correct; banning CFCs immediately stops ozone depletion because CFC production is the only source of stratospheric Cl•","B":"The claim is incorrect: CFCs already released have atmospheric lifetimes of 50–100 years and will continue diffusing upward for decades. Additionally, each Cl• atom can destroy ~100,000 ozone molecules before termination, so a large reservoir of Cl• already exists in the stratosphere. Recovery is projected for the mid-to-late 21st century, not within years","C":"The claim is correct for mid-latitudes but incorrect for Antarctica, where Cl• is permanently present","D":"The claim is incorrect because HFCs (introduced as replacements) destroy ozone just as efficiently as CFCs","correct":"B","explain":"The Montreal Protocol (1987) eliminated new CFC production in developed countries by 1996, but recovery of the ozone layer is measured in <b>decades</b>, not years: (1) <b>Long atmospheric lifetime</b>: CFCs emitted before 1996 have lifetimes of 50–100 years in the atmosphere. They continue rising through the troposphere and reaching the stratosphere — banning new production stops new releases but does not remove existing molecules. (2) <b>Catalytic amplification</b>: once a Cl• is produced, each atom catalyses the destruction of ~100,000 O₃ molecules before termination. The Cl• reservoir in the stratosphere is sustained by the slow photolysis of the large stock of CFCs already in the atmosphere. (3) <b>Recovery trajectory</b>: the ozone layer is slowly recovering (recovery of the Antarctic ozone hole to 1980 levels is projected for approximately 2065–2080). HFCs (option D) contain no chlorine — their ozone-depleting potential is zero, although they are greenhouse gases."},{"stem":"A student claims: \"Ammonia is a better nucleophile than hydroxide because nitrogen is less electronegative than oxygen, so the lone pair is more available.\" Evaluate this reasoning and state whether the claim is correct for reactions with haloalkanes.","A":"The student is incorrect on both counts: electronegativity has no bearing on nucleophilicity, and OH⁻ is always the better nucleophile","B":"The student's reasoning about electronegativity has some validity — a less electronegative atom holds its lone pair less tightly — but the claim overstates it: OH⁻ is a stronger nucleophile than NH₃ because the negative charge on O concentrates electron density and makes it more reactive. NH₃ > H₂O but NH₃ < OH⁻ in terms of nucleophilicity towards haloalkanes","C":"The student is entirely correct; NH₃ always reacts faster than OH⁻ with all haloalkanes","D":"Nucleophilicity depends only on charge, so OH⁻ and NH₃ are equally nucleophilic","correct":"B","explain":"The student correctly identifies that <b>electronegativity influences lone pair availability</b>: on a more electronegative atom, the lone pair is held more tightly, reducing its tendency to donate. Oxygen (electronegativity 3.5) holds its lone pairs more tightly than nitrogen (3.0). However, <b>charge dominates</b>: OH⁻ carries a full negative charge, concentrating electron density on the O far more than the electronegativity effect depresses it. The nucleophilicity order is: <b>OH⁻ > NH₃ > H₂O</b>. OH⁻ (negatively charged oxygen) attacks fastest; NH₃ (neutral nitrogen, intermediate electronegativity) attacks more slowly; H₂O (neutral, more electronegative oxygen) attacks most slowly of the three. In practical terms, haloalkane hydrolysis with NaOH (OH⁻ nucleophile) is much faster than with water alone, consistent with OH⁻ being the stronger nucleophile. Ammonia is intermediate — fast enough to be useful in synthesis, but not as reactive as OH⁻."},{"stem":"2-Bromo-2-methylpropane ((CH₃)₃CBr) is a tertiary haloalkane. Predict whether its rate of hydrolysis with aqueous AgNO₃/ethanol would be faster or slower than 1-bromobutane, and identify the complication that arises with tertiary haloalkanes under these conditions.","A":"Slower, because the three methyl groups block the nucleophile from accessing the δ⁺ carbon in an SN2 mechanism; elimination may also occur forming an alkene","B":"Faster, because tertiary carbons are more electron-rich and stabilise the transition state better","C":"The same rate, because only the C–Br bond enthalpy matters and both compounds have C–Br bonds","D":"No reaction, because tertiary haloalkanes never react with nucleophiles","correct":"A","explain":"Tertiary haloalkanes cannot easily undergo <b>SN2</b> substitution — the three large alkyl groups around the central carbon create steric hindrance that prevents the nucleophile approaching the δ⁺ C from the back in the SN2 transition state. Tertiary haloalkanes are therefore generally <b>slower</b> than primary haloalkanes in SN2 reactions at the same temperature, despite having comparable C–X bond enthalpies. A secondary complication with tertiary haloalkanes under the AgNO₃/ethanol experiment is that <b>elimination</b> can compete: the conditions (heat, ethanol as solvent, possible base present) can cause loss of HBr to form an alkene (2-methylpropene). This is a competing pathway that also releases Br⁻ and produces a precipitate, but the organic product is an alkene rather than an alcohol. In exam contexts at AS, the primary factor is that tertiary carbons are more hindered toward SN2 substitution. At A Level the SN1 vs SN2 competition and elimination competition are addressed more fully."},{"stem":"A researcher proposes replacing all HFCs in refrigeration with perfluorocarbons (PFCs — CₙF₂ₙ₊₂, containing only C and F). Evaluate this proposal in terms of ozone-depleting potential and greenhouse effect, using the chemistry of C–F bonds.","A":"PFCs are ideal replacements: zero ozone-depleting potential and zero greenhouse effect, because C–F bonds are too strong to absorb any radiation","B":"PFCs have zero ozone-depleting potential (no Cl, so no Cl• can form) but are potentially strong greenhouse gases with very long atmospheric lifetimes, because C–F bonds are too strong to be broken by tropospheric UV or by •OH radicals; PFCs persist in the atmosphere for thousands of years","C":"PFCs deplete ozone because UV-C in the stratosphere can break C–F bonds and release F•","D":"PFCs have no greenhouse effect because they are non-polar and cannot absorb infrared radiation","correct":"B","explain":"PFCs contain only C–C and C–F bonds. Since there is no chlorine or bromine, <b>no halogen radical capable of catalysing ozone destruction</b> is produced — ozone-depleting potential is <b>zero</b> (like HFCs). However, C–F bonds are extremely strong (~485 kJ mol⁻¹): (1) <b>Tropospheric OH• radicals</b> cannot abstract F from a C–F bond, so PFCs are not removed in the troposphere as HCFCs are. (2) <b>UV photons</b> in the troposphere lack enough energy to cleave C–F bonds. As a result, PFCs have <b>atmospheric lifetimes of thousands to tens of thousands of years</b> — far longer than CFCs. They are also <b>potent greenhouse gases</b> because C–F bonds absorb strongly in the mid-infrared region. Global warming potential values of common PFCs are 7,000–12,000 times that of CO₂ per molecule over 100 years. Option D is wrong: PFCs do absorb infrared because C–F bonds vibrate at frequencies that coincide with the Earth's outgoing IR spectrum."},{"stem":"For the reaction of 1-bromopropane with excess ethanolic ammonia, a product mixture is formed. State all organic products in order of likelihood and explain why excess ammonia is specified.","A":"Only propylamine is formed; excess NH₃ prevents all other products","B":"In order of likelihood with excess NH₃: primarily CH₃CH₂CH₂NH₂ (primary amine), with smaller amounts of (CH₃CH₂CH₂)₂NH (secondary amine), (CH₃CH₂CH₂)₃N (tertiary amine), and (CH₃CH₂CH₂)₄N⁺Br⁻ (quaternary ammonium salt). Excess NH₃ suppresses the secondary and higher products by ensuring NH₃ is always in large excess relative to the amine products","C":"Only the quaternary ammonium salt is formed because ammonia is fully alkylated","D":"Only propan-1-ol is formed; ammonia acts as a base that hydrolyses the haloalkane","correct":"B","explain":"The primary amine product (CH₃CH₂CH₂NH₂) is itself nucleophilic — it has a lone pair on nitrogen and can attack another molecule of 1-bromopropane. This over-alkylation sequence can proceed: RBr + NH₃ → RNH₂ + HBr; RBr + RNH₂ → R₂NH + HBr; RBr + R₂NH → R₃N + HBr; RBr + R₃N → R₄N⁺Br⁻. In practice, a mixture of all four products forms. Using a <b>large excess of NH₃</b> shifts the equilibrium: the probability that any given 1-bromopropane molecule encounters an NH₃ molecule first (rather than the scarce RNH₂) is maximised, so the primary amine is the dominant product. However, total selectivity cannot be achieved this way — some secondary and tertiary products always form. The question of how to obtain a pure primary amine more selectively is addressed in A Level synthesis (e.g. via the Gabriel synthesis or reduction of a nitrile)."},{"stem":"Explain the entire chain of events from CFC production at ground level to ozone depletion in the stratosphere, including why C–Cl but not C–F is photolysed. Use bond enthalpy values in your answer.","A":"CFCs are immediately transported to the stratosphere by wind; C–F photolyses there because F is more reactive than Cl","B":"CFCs are chemically inert at ground level (no C–H bonds for OH• to attack; strong C–F and C–Cl bonds resist thermal cleavage at tropospheric temperatures and energies). They diffuse upward over ≈50–100 years. In the stratosphere, shorter-wavelength UV (UV-C/UV-B) provides photon energies sufficient to cleave the weaker C–Cl bond (~339 kJ mol⁻¹) homolytically, but not the stronger C–F bond (~484 kJ mol⁻¹). Cl• is released and enters the catalytic cycle","C":"CFCs are broken down by ozone in the troposphere, releasing Cl•; the Cl• then rises to the stratosphere","D":"C–F bonds photolyse first because F is more electronegative and absorbs UV more efficiently","correct":"B","explain":"The journey from ground to ozone hole has six steps: (1) CFC released (refrigerant leak, aerosol propellant, etc.) at ground level. (2) <b>No tropospheric removal</b>: unlike HCFCs, there are no C–H bonds for tropospheric •OH to abstract; the C–F and C–Cl bonds are too strong to be cleaved by low-energy tropospheric photons or by thermal energy at ambient temperatures. (3) <b>Slow upward diffusion</b> over decades — atmospheric lifetimes 50–100 years. (4) Reaches the <b>stratosphere</b> (15–35 km), where shorter-wavelength UV-B/C photons (higher energy) are present. (5) <b>Selective photolysis of C–Cl</b>: UV photon energy ≈ 370–600 kJ mol⁻¹ matches the C–Cl bond enthalpy (~339 kJ mol⁻¹). C–F (~484 kJ mol⁻¹) requires more energy than most stratospheric photons can supply, so C–F remains intact. (6) <b>Cl• released</b>: catalytic cycle begins. The bond enthalpy difference (~145 kJ mol⁻¹ between C–Cl and C–F) is the fundamental chemical reason why C–Cl photolyses and C–F does not."},{"stem":"A Level Paper 3 synthesis question: starting from 1-bromopropane, outline a route to butanenitrile (CH₃CH₂CH₂CN), giving reagents, conditions and the type of reaction. Then verify that the carbon count is correct.","A":"Step 1: add Br₂ to get 1,2-dibromopropane; Step 2: eliminate HBr to get propene (no — this is only 3 carbons and gives an alkene, not a nitrile)","B":"Step 1: 1-bromopropane + KCN (in ethanol, reflux) → butanenitrile (CH₃CH₂CH₂CN) + KBr; this is a <b>one-step</b> route — nucleophilic substitution with CN⁻ directly gives butanenitrile in a single step, extending the chain from 3C to 4C","C":"Step 1: hydrolyse to propan-1-ol; Step 2: oxidise to propanenitrile — carbon count 3 → 3, not 4","D":"Step 1: react with NH₃ to give propylamine; Step 2: oxidise the amine to the nitrile — carbon count is 3 at both stages","correct":"B","explain":"1-Bromopropane has <b>3 carbons</b>. Butanenitrile (CH₃CH₂CH₂CN) has <b>4 carbons</b>. The only reagent in the OCR AS specification that adds one carbon to a haloalkane in a single step is the cyanide ion (CN⁻) — because CN⁻ attacks through its carbon, forming a new C–C bond. <b>Step 1 (and only step)</b>: 1-bromopropane + KCN (in ethanol, heat under reflux) → butanenitrile + KBr. Nucleophilic substitution: CN⁻ (electron pair donor on C) attacks δ⁺ C of C–Br; Br⁻ leaves. Carbon check: 3C (propyl chain) + 1C (from CN) = 4C in product ✓. This is actually a <b>one-step</b> synthesis. The question stem says \"two-step route\" as a distractor — if the question were \"two-step\" it could mean 1-bromopropane → propan-1-ol → oxidise to propanal → etc., but none of those routes reach butanenitrile. The direct CN⁻ substitution is the definitive one-step chain-extension reaction and is the answer every OCR synthesis question expects."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
