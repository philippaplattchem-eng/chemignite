<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}

.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}

.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}

.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}

<body>

  <h1>4.6 &mdash; Organic Synthesis (AS)</h1>

<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame &mdash; Apply in context</span>
  </div>

<script>
const QUESTIONS=[{"stem":"A student heats propan-1-ol with acidified K₂Cr₂O₇ under reflux to produce propanoic acid. The round-bottomed flask is fitted with a <b>vertical</b> condenser. Explain why the product is propanoic acid and not propanal, even though both are possible oxidation products.","A":"Propanoic acid forms because the vertical condenser makes the apparatus hotter","B":"Reflux keeps the intermediate propanal in contact with excess oxidant: the vertical condenser returns propanal vapour (lower bp than propan-1-ol) to the flask before it can escape, where excess dichromate oxidises it further to propanoic acid","C":"Propanoic acid forms because K₂Cr₂O₇ is not powerful enough to stop at the aldehyde","D":"Propanal is actually the product; propanoic acid requires a different oxidant","correct":"B","explain":"Propanal (bp 49 °C) has a lower boiling point than propan-1-ol (bp 97 °C) because it cannot hydrogen-bond to itself — the C=O group is polar but has no H attached to an electronegative atom. Under distillation conditions, propanal volatilises as fast as it forms and is removed from the flask before it contacts more oxidant. Under <b>reflux</b> conditions, the vertical Liebig condenser cools all vapours and returns them as liquid to the flask. Even the low-boiling propanal condenses before it can exit the top of the condenser; it drips back down into the flask where excess K₂Cr₂O₇ is present and is oxidised a second time to propanoic acid (using a further 1[O]). The apparatus — not the oxidant concentration — is the determining factor."},{"stem":"Describe in detail the five-step purification of 1-bromobutane prepared from butan-1-ol and concentrated HBr/H₂SO₄. Include the specific drying agent, how drying completion is judged, and what is collected during redistillation.","A":"Add MgSO₄ to the whole mixture; filter; heat to boiling point of 1-bromobutane; collect at 102 °C","B":"(1) Transfer to separating funnel; drain off the aqueous (lower) layer, keep the organic (upper) layer. Wait — 1-bromobutane is denser than water; it forms the <b>lower</b> layer. Drain organic layer into a conical flask. (2) Wash with sodium carbonate solution to neutralise HBr/H₂SO₄; vent the funnel. (3) Dry with anhydrous MgSO₄; swirl until granules flow freely. (4) Filter to remove the hydrated salt. (5) Redistil; collect the fraction boiling at 101–102 °C (boiling point of 1-bromobutane)","C":"Filter the crude product through charcoal; boil; collect all liquid above 60 °C as the product","D":"Add aqueous NaOH, shake; use the upper layer; heat with CaCl₂ for 10 minutes; distil at 78 °C","correct":"B","explain":"Several features of this question deserve attention. (1) <b>Layer identity</b>: 1-bromobutane (density ≈1.22 g cm⁻³) is <b>denser than water</b> and forms the <b>lower</b> layer in the separating funnel — this is the organic layer. Many students assume the organic layer is always the upper layer; halogenated organic liquids are exceptions. (2) <b>Washing</b>: aqueous Na₂CO₃ neutralises residual acid (HBr and H₂SO₄); CO₂ gas may be released so the funnel must be inverted with the tap open periodically to release pressure. (3) <b>Drying agent</b>: anhydrous MgSO₄ is correct. CaCl₂ would be acceptable here (no alcohol or amine present), but MgSO₄ is the default. The drying is complete when granules run freely. (4) <b>Filter</b> before redistillation to remove hydrated salt. (5) <b>Redistil</b> and collect only the fraction boiling at 101–102 °C — fore-runnings and tails are discarded."},{"stem":"Plan a two-stage synthesis of propan-2-ol from propene. State the reagents, conditions, and reaction type for each stage.","A":"Stage 1: propene + Br₂(aq) → 1,2-dibromopropane (electrophilic addition); Stage 2: 1,2-dibromopropane + 2NaOH(aq), reflux → propane-1,2-diol (substitution) — wrong product (a diol, not propan-2-ol)","B":"propene + steam (H₂O), H₃PO₄ catalyst, high temperature and pressure → propan-2-ol (Markovnikov addition: OH to C2) — this is a <b>one-stage</b> route, not two stages","C":"Stage 1: propene + HBr → 2-bromopropane (electrophilic addition, Markovnikov's rule: Br⁻ attacks the more stable secondary carbocation at C2); Stage 2: 2-bromopropane + NaOH(aq), heat under reflux → propan-2-ol + NaBr (nucleophilic substitution)","D":"Stage 1: propene + acidified KMnO₄ → propane-1,2-diol (oxidation); Stage 2: reduce with H₂/Ni → propan-2-ol — wrong: cold dilute KMnO₄ gives a diol, not a step toward a single alcohol; the reduction step does not give propan-2-ol","correct":"C","explain":"Markovnikov's rule for HBr adding to propene: H⁺ adds to C1 (the less substituted carbon, CH₂=), generating the <b>secondary</b> carbocation at C2 (CH₃–⁺CH–CH₃), which is more stable than the primary carbocation at C1. Br⁻ then attacks C2 → <b>2-bromopropane</b> (Stage 1). In Stage 2, aqueous NaOH provides OH⁻ as a nucleophile; SN2 attack on C2 displaces Br⁻ → <b>propan-2-ol</b>. Carbon count: propene (3C) → 2-bromopropane (3C) → propan-2-ol (3C) ✓. Option B gives propan-2-ol in one step (direct hydration, also Markovnikov); correct product but not a two-stage route, so B does not answer the question. Options A and D both give the wrong products."},{"stem":"Explain the difference in reagents and conditions between the following two conversions, both starting from 1-bromopropane: (a) 1-bromopropane → propan-1-ol; (b) 1-bromopropane → propene.","A":"Both use aqueous NaOH; the only difference is temperature","B":"(a) uses aqueous NaOH (or KOH), heat under reflux → nucleophilic substitution gives the alcohol; (b) uses ethanolic NaOH (or KOH), heat under reflux → elimination gives propene + NaBr + H₂O. The solvent distinguishes them: aqueous → substitution; ethanolic → elimination","C":"(a) uses K₂Cr₂O₇/H₂SO₄; (b) uses NaOH(aq); the functional group change is oxidation vs substitution","D":"(a) uses ethanolic NaOH; (b) uses aqueous NaOH; the product depends on the temperature","correct":"B","explain":"The two conditions are: (a) <b>aqueous NaOH</b>, heat under reflux: OH⁻ (from water) acts as a nucleophile and attacks the δ⁺ carbon, displacing Br⁻ to give propan-1-ol (nucleophilic substitution, SN2). (b) <b>Ethanolic NaOH</b> (or hot ethanolic KOH), heat under reflux: the NaOH acts as a base rather than a nucleophile, abstracting a β-hydrogen (from C2) and removing the Br from C1, eliminating HBr to give propene + NaBr + H₂O (elimination, E2). The distinction <b>aqueous → substitution, ethanolic → elimination</b> is one of the most commonly tested distinctions in OCR synthesis questions and is also one of the most commonly confused. Mixing up the two is explicitly flagged by OCR examiner reports as a frequent error."},{"stem":"Starting from ethanol, plan a two-stage synthesis of ethyl ethanoate (an ester). State reagents and conditions for each stage and the reaction type.","A":"Stage 1: ethanol + acidified K₂Cr₂O₇, distil → ethanal; Stage 2: ethanal + ethanol → ester","B":"Esterification of ethanol with ethanoic acid in a single step is possible: reagents — ethanoic acid + ethanol; conditions — concentrated H₂SO₄ catalyst, heat under reflux. This is actually one stage, not two","C":"Stage 1: ethanol + K₂Cr₂O₇/H₂SO₄, reflux → ethanoic acid (oxidation); Stage 2: ethanoic acid + ethanol + concentrated H₂SO₄ catalyst, reflux → ethyl ethanoate + water (esterification) (valid two-stage route if starting material must be ethanol)","D":"Stage 1: ethanol + PCl₃ → chloroethane; Stage 2: chloroethane + CH₃COO⁻ → ester","correct":"C","explain":"Two approaches: (1) <b>Direct one-stage esterification</b>: ethanol + ethanoic acid + concentrated H₂SO₄ (catalyst) at reflux → ethyl ethanoate + water. The H₂SO₄ is a catalyst and regenerates; the reaction is reversible and an equilibrium is established. (2) <b>Two-stage route from ethanol alone</b>: Stage 1 — ethanol oxidised to ethanoic acid (K₂Cr₂O₇/H₂SO₄, reflux); Stage 2 — ethanoic acid + fresh ethanol + concentrated H₂SO₄, reflux → ethyl ethanoate. Carbon count: ethanol (2C) → ethanoic acid (2C) → combined with another 2C ethanol to give ethyl ethanoate (4C in total). This two-stage route is necessary only if the question specifies ethanol as the sole starting material. If ethanoic acid is available, a single esterification step suffices."},{"stem":"An unknown compound A has the molecular formula C₃H₆O. Compound A decolourises bromine water and also gives an orange → green colour change with acidified K₂Cr₂O₇. Name two functional groups that could be present and state which observation supports each.","A":"Alkene (bromine water) and alcohol (dichromate), but C₃H₆O cannot contain both simultaneously","B":"Alkene (decolourises Br₂(aq) by electrophilic addition) and aldehyde (orange → green with K₂Cr₂O₇ by oxidation) — but C₃H₆O can only have one degree of unsaturation; a compound with both C=C and CHO would need C₃H₄O₂ (two degrees of unsaturation). The two reactions cannot both come from the same molecule of C₃H₆O (the question asks what functional groups could explain each separately)","C":"Ketone (both Br₂ and dichromate) and ester (neither)","D":"Alkene (dichromate) and aldehyde (Br₂ water)","correct":"B","explain":"C₃H₆O has a degree of unsaturation (DoU) of (2×3 + 2 − 6)/2 = 1 — exactly one double bond or ring. Possible structures with one DoU: (i) propanal (CH₃CH₂CHO) — has an aldehyde (C=O) which is oxidised by dichromate (orange → green) and does not decolourise Br₂(aq); (ii) propan-1-ol would be C₃H₈O (saturated), so is not this formula; (iii) prop-2-en-1-ol (allyl alcohol) CH₂=CHCH₂OH has both a C=C (decolourises Br₂(aq)) and an –OH (does not react with dichromate as an alkene). A key point: K₂Cr₂O₇ gives orange → green only with primary or secondary alcohols (and aldehydes) — a C=C alkene does NOT react with dichromate. The question as posed is testing whether students can match observations to the correct functional group: <b>Br₂(aq) decolourises → C=C (alkene)</b>; <b>K₂Cr₂O₇ orange → green → aldehyde or primary/secondary alcohol</b>. No single C₃H₆O isomer shows both — but different C₃H₆O isomers could show each one."},{"stem":"A synthesis of butanenitrile (CH₃CH₂CH₂CN) from propan-1-ol is planned in two stages. Identify both stages with reagents, conditions and products, and verify the carbon count.","A":"Stage 1: propan-1-ol + K₂Cr₂O₇/H₂SO₄ → propanal; Stage 2: propanal + KCN → butanenitrile (carbon count: 3 → 4 ✓)","B":"Stage 1: propan-1-ol + HBr (or NaBr/H₂SO₄), heat → 1-bromopropane (nucleophilic substitution; 3C → 3C); Stage 2: 1-bromopropane + KCN (in ethanol, reflux) → butanenitrile + KBr (nucleophilic substitution; 3C → 4C ✓)","C":"Stage 1: propan-1-ol → propene (elimination with H₂SO₄); Stage 2: propene + KCN → butanenitrile","D":"Stage 1: propan-1-ol + KCN → butanamide; Stage 2: butanamide → butanenitrile by dehydration","correct":"B","explain":"Propan-1-ol (3C) → butanenitrile (4C): the chain must be extended by one carbon using KCN. KCN reacts with <b>haloalkanes</b>, not directly with alcohols. The route is: Stage 1 — convert the alcohol to a haloalkane: propan-1-ol + concentrated HBr (or NaBr/concentrated H₂SO₄) → 1-bromopropane + H₂O. Reaction type: substitution. Product: 1-bromopropane (still 3C). Stage 2 — react the haloalkane with KCN in ethanol, reflux: 1-bromopropane + KCN → butanenitrile + KBr. Reaction type: nucleophilic substitution. Chain extended: 3C → 4C (the CN group adds its carbon). Atom check: Stage 1 is CH₃CH₂CH₂OH → CH₃CH₂CH₂Br (3C → 3C); Stage 2 is CH₃CH₂CH₂Br + CN⁻ → CH₃CH₂CH₂CN (3C + 1C = 4C) ✓."},{"stem":"Explain why the percentage yield of a two-stage synthesis is always lower than the percentage yield of either individual stage, even when each stage is carried out correctly.","A":"Two-stage syntheses always involve a slower rate-determining step that reduces yield","B":"The overall yield is the product of the individual stage yields; if stage 1 gives 80% and stage 2 gives 80%, the overall yield is 80% × 80% = 64%, not 80%. Each stage loses some material, and the losses multiply","C":"The extra glassware used in a two-stage synthesis adsorbs more product","D":"Overall yield is the average of the two stage yields: (80% + 80%)/2 = 80%","correct":"B","explain":"In a two-stage synthesis, the product of stage 1 is the starting material for stage 2. If stage 1 gives a yield of Y₁ and stage 2 gives a yield of Y₂ (expressed as fractions), the overall yield is Y₁ × Y₂. Example: two stages at 80% each give 0.80 × 0.80 = 0.64 → <b>64% overall</b>. Three stages at 70% each give 0.70³ = 0.343 → <b>34% overall</b>. This multiplicative relationship is why industrial chemists try to minimise the number of synthetic steps — each additional step multiplies the yield losses, however well-controlled each individual step is. OCR synthesis questions sometimes ask candidates to \"suggest a shorter alternative route\" because fewer steps give a higher overall yield even if the per-step yield is the same."},{"stem":"A student identifies compound B as an ester. State two chemical observations you would expect from an ester and two you would NOT expect.","A":"Ester: reacts with NaOH to give ethanoic acid and ethanol; does NOT react with Na to give H₂ gas","B":"Ester: strong C=O peak in IR (~1735 cm⁻¹) + no broad O–H absorption; does NOT decolourise Br₂(aq) (no C=C); does NOT react with Na metal (no –OH); does NOT give orange → green with acidified K₂Cr₂O₇","C":"Ester: reacts with Br₂(aq) to decolourise it; does NOT show a C=O peak in IR","D":"Ester: gives orange → green with K₂Cr₂O₇ because the C=O can be oxidised; does NOT react with Na","correct":"B","explain":"An ester contains a C=O bond (~1735 cm⁻¹ in IR — slightly higher than a ketone or aldehyde) and a C–O–C linkage, but <b>no –OH group</b>. Consequences: (1) <b>Does NOT react with Na metal</b> — Na only reacts with compounds containing acidic O–H bonds (alcohols, carboxylic acids, water). (2) <b>Does NOT decolourise Br₂(aq)</b> — esters contain no C=C double bond (in a simple ester). (3) <b>Does NOT give K₂Cr₂O₇ colour change</b> — esters have no oxidisable primary/secondary alcohol group or aldehyde. (4) <b>Does react with aqueous NaOH</b> (hydrolysis/saponification) — this distinguishes esters from ketones, which also have no –OH but do not hydrolyse with NaOH under mild conditions. The question tests whether students can predict the negative results as well as the positive ones."},{"stem":"Complete the following flowchart entry: reagents and conditions to convert ethene into ethane-1,2-diol via 1,2-dibromoethane.","A":"Stage 1: ethene + HBr(g) → 1,2-dibromoethane; Stage 2: + NaOH(aq) → ethane-1,2-diol","B":"Stage 1: ethene + Br₂, room temperature → 1,2-dibromoethane (electrophilic addition); Stage 2: 1,2-dibromoethane + NaOH(aq), reflux → ethane-1,2-diol (nucleophilic substitution ×2, each Br replaced by OH)","C":"Stage 1: ethene + HBr → 1,2-dibromoethane; Stage 2: + KMnO₄ → ethane-1,2-diol","D":"Stage 1: ethene + NaOH(aq) → ethanol; Stage 2: ethanol + Br₂ → ethane-1,2-diol","correct":"B","explain":"Stage 1 — <b>ethene + Br₂ (room temperature, no catalyst)</b> → 1,2-dibromoethane (BrCH₂CH₂Br). Reaction type: electrophilic addition. The π-electrons of the C=C attack Br₂, inducing a dipole; Br⁺ attacks the alkene and the other Br⁻ closes the bromonium ion. Note: Br₂ is added across both carbons of the double bond — NOT just one — giving the 1,2-dibromo product. Stage 2 — <b>1,2-dibromoethane + NaOH(aq), heat under reflux</b> → ethane-1,2-diol + 2NaBr. Reaction type: nucleophilic substitution (the same OH⁻-displacement mechanism as single-haloalkane hydrolysis, but applied twice — once to each C–Br bond). Conditions must be <b>aqueous</b> NaOH — ethanolic KOH would cause elimination, giving CH₂=CH₂ back. Carbon count: 2C → 2C → 2C ✓."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
