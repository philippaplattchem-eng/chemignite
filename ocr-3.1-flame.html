<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.1 Periodicity - flame &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>3.1 &mdash; Periodicity</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>7 questions</span>
    <span>Flame &mdash; Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"The first ionisation energy of aluminium (578 kJ mol⁻¹) is lower than that of magnesium (738 kJ mol⁻¹), despite Al having a higher nuclear charge. Why?","A":"Aluminium has a larger atomic radius than magnesium","B":"Aluminium has more inner-shell electrons, so shielding is greater","C":"Aluminium's outer electron is in a 3p orbital, which is at a higher energy than magnesium's 3s orbital and is therefore easier to remove","D":"Aluminium's 3s² sub-shell provides extra stability, making the 3p electron easier to eject","correct":"C","explain":"Mg's outer electron is in the 3s sub-shell. Al's outer electron is in the 3p sub-shell. A p orbital is at higher energy than an s orbital in the same shell — the 3p electron is further from the nucleus on average and is easier to remove. The effect outweighs the increase in nuclear charge from Z = 12 to Z = 13. This dip at Al is one of the two standard deviations from the general upward trend in Period 3 IE."},{"stem":"The first ionisation energy of sulfur (1000 kJ mol⁻¹) is lower than that of phosphorus (1012 kJ mol⁻¹), despite S having a higher atomic number. Why?","A":"Sulfur has more electrons, which increase the shielding of the outer electron","B":"Phosphorus has a half-full 3p sub-shell with one electron per orbital; sulfur has a paired 3p electron that experiences additional electron–electron repulsion, making it slightly easier to remove","C":"Sulfur's 3p⁴ configuration is less stable than phosphorus's 3p³ because the extra electron is in a higher-energy orbital","D":"The ionisation energy of S is actually higher than P — this data is incorrect","correct":"B","explain":"P is [Ne]3s²3p³ with one electron in each 3p orbital (spin-parallel, no repulsion within orbitals). S is [Ne]3s²3p⁴ — the fourth electron must pair up in one 3p orbital, experiencing repulsion from the electron already there. That extra repulsion slightly destabilises the paired electron, reducing the energy needed to remove it. The half-filled 3p³ configuration of P has extra stability; S's 3p⁴ loses it."},{"stem":"Arrange Na, Mg, and Al in order of increasing melting point. Which explanation is correct?","A":"Al > Mg > Na; Al³⁺ produces a denser, more tightly held electron sea than Mg²⁺ or Na⁺","B":"Na > Mg > Al; Na has the largest atomic radius, so London forces are strongest","C":"Mg > Na > Al; magnesium has the highest charge density","D":"Al > Na > Mg; aluminium has the most protons","correct":"A","explain":"All three are giant metallic lattices; melting point depends on metallic bond strength. Three factors increase in the order Na → Mg → Al: (1) Number of delocalised electrons per atom: Na gives 1e; Mg gives 2e; Al gives 3e — denser electron sea. (2) Cation charge: Na⁺ (+1) < Mg²⁺ (+2) < Al³⁺ (+3). (3) Cation size decreases (more protons, same shell) → higher charge density. All three factors produce stronger electrostatic attraction in Al → highest melting point."},{"stem":"Write the equation representing the second ionisation energy of sodium. Which option is correct?","A":"Na(g) → Na²⁺(g) + 2e⁻","B":"Na⁺(g) + e⁻ → Na(g)","C":"Na⁺(aq) → Na²⁺(aq) + e⁻","D":"Na⁺(g) → Na²⁺(g) + e⁻","correct":"D","explain":"The 2nd IE starts from the gaseous 1+ ion (the result of the 1st IE). The equation is Na⁺(g) → Na²⁺(g) + e⁻. Both ions must be in the gaseous state. Option A shows two electrons removed in one step (that would be the sum of 1st and 2nd IEs). Option C uses aqueous state symbols (wrong — IE is defined for gaseous isolated species). The 2nd IE of Na (4562 kJ mol⁻¹) is about 9× its 1st IE (496 kJ mol⁻¹) because the 2nd electron comes from an inner shell much closer to the nucleus."},{"stem":"An element in Period 3 has the electron configuration [Ne]3s²3p⁶. What is this element, and which structural type applies at room temperature?","A":"Sulfur; simple molecular","B":"Chlorine; diatomic gas","C":"Argon; monatomic gas","D":"Silicon; giant covalent","correct":"C","explain":"[Ne]3s²3p⁶ = 8 outer electrons + 10 inner electrons = 18 total → Z = 18 → argon. Ar is a noble gas with a complete outer shell (3s²3p⁶), so it exists as isolated atoms — a monatomic gas. The only IMFs are very weak London forces between Ar atoms → extremely low boiling point (−186°C) and melting point (−189°C). Options A (S: [Ne]3s²3p⁴) and B (Cl: [Ne]3s²3p⁵) have fewer outer electrons."},{"stem":"Why is the melting point of silicon (1414°C) so much higher than that of white phosphorus (44°C), given that both are Period 3 non-metals?","A":"Silicon has stronger London forces because it has more electrons per atom","B":"Silicon forms P₄ molecules with strong P–P bonds; phosphorus is monatomic","C":"Silicon has a giant covalent structure in which strong covalent bonds extend throughout the lattice; P₄ has a simple molecular structure held together only by weak London forces between P₄ molecules","D":"Silicon is a metal with strong metallic bonding; phosphorus is a non-metal","correct":"C","explain":"Si has a giant covalent lattice — each Si atom is tetrahedrally bonded to four others by strong covalent bonds in a continuous 3D network (like diamond). Melting requires breaking many of these bonds. P exists as P₄ molecules; only weak London forces act between these molecules. The bond-type change (giant covalent → simple molecular) crossing from Si to P is responsible for the dramatic drop in melting point, one of the most tested discontinuities in Period 3."},{"stem":"Aluminium oxide (Al₂O₃) reacts with dilute sulfuric acid. Which ionic equation correctly represents this reaction?","A":"Al₂O₃(s) + 3H₂SO₄(aq) → Al₂(SO₄)₃(aq) + 3H₂O(l)","B":"Al₂O₃(s) + 6H⁺(aq) → 2Al³⁺(aq) + 3H₂O(l)","C":"Al³⁺(aq) + 3OH⁻(aq) → Al(OH)₃(s)","D":"Al₂O₃(s) + 2H⁺(aq) → 2Al⁺(aq) + H₂O(l)","correct":"B","explain":"Al₂O₃ is insoluble — it stays as (s) and is not split into ions. H₂SO₄ is a strong acid (fully ionised); SO₄²⁻ is a spectator ion. The oxide ion O²⁻ accepts 2H⁺ to form H₂O. Balance: 1 Al₂O₃ provides 3 O²⁻ which take 6 H⁺; 2 Al³⁺ are released. Ionic equation: Al₂O₃(s) + 6H⁺(aq) → 2Al³⁺(aq) + 3H₂O(l). Charge check: 0 + 6(+1) = +6; 2(+3) + 0 = +6. ✓ Option A is the full molecular equation."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
