<html lang="en">
<head>

<title>1.3 Further Organic and Inorganic Practicals | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">

  <h1>1.3 Further Organic and Inorganic Practicals</h1>

<main>

<script>
const QUESTIONS=[{"stem":"In the synthesis of aspirin, ethanoic anhydride is used rather than ethanoic acid as the acylating agent. What is the main practical advantage of using ethanoic anhydride? A. Ethanoic anhydride is cheaper and more readily available than ethanoic acid B. Ethanoic anhydride produces no water as a by-product, preventing hydrolysis of the aspirin product; ethanoic acid produces water which can hydrolyse the ester bond C. Ethanoic anhydride reacts faster because it is a stronger acid than ethanoic acid D. Ethanoic acid is too volatile to use safely in the fume cupboard","A":"","B":"","C":"","D":"","correct":"","explain":"When ethanoic acid reacts with the –OH group of salicylic acid, water is produced as a by-product. This water can hydrolyse the newly formed ester (aspirin) back to salicylic acid and ethanoic acid, reducing yield. Ethanoic anhydride gives ethanoic acid as the only by-product — no water — so hydrolysis of the product does not occur. This is why ethanoic anhydride is the preferred reagent in any acylation where product stability in the presence of water is a concern."},{"stem":"After synthesis, crude aspirin is purified by recrystallisation. A student dissolves the crude solid in the minimum volume of hot ethanol, then adds hot water until the solution just becomes cloudy, then filters hot. Why is it important to use the minimum volume of hot solvent? A. Using excess solvent speeds up the cooling rate, giving larger crystals B. Using excess solvent dissolves more product along with impurities; when cooled, less product crystallises out because it remains in solution, reducing yield C. Minimum solvent prevents the aspirin from decomposing at high temperature D. It is easier to filter a small volume than a large volume of solution","A":"","B":"","C":"","D":"","correct":"","explain":"In recrystallisation, yield depends on the difference in solubility between hot and cold solvent. If excess hot solvent is used, more aspirin stays dissolved even at room temperature (because solubility at any given temperature is fixed). The crystallised mass is reduced, lowering the yield. Using the minimum hot solvent maximises the amount that crystallises on cooling without leaving significant product in solution."},{"stem":"A student measures the melting point of their purified aspirin and obtains a range of 131–137 °C. The literature value for pure aspirin is 135 °C. What does the depressed and broadened melting point range indicate? A. The aspirin has decomposed during recrystallisation B. The thermometer is not calibrated correctly C. The sample contains impurities — impurities lower the melting point and broaden the melting range; a pure substance melts sharply at a single temperature D. The aspirin was dried too quickly, trapping solvent inside the crystals","A":"","B":"","C":"","D":"","correct":"","explain":"A pure crystalline substance has a sharp, reproducible melting point because it has a regular lattice structure. Impurities disrupt the lattice, requiring less energy to break it down, which lowers the melting point below the literature value. Impurities also melt over a range rather than at a single temperature because the ratio of impurity to solid changes as melting proceeds. A melting range of ≤1 °C at or near the literature value indicates good purity; a range of several degrees indicates residual impurity."},{"stem":"In the preparation of benzoic acid from methylbenzene, the reaction is carried out under reflux with alkaline KMnO₄. Why is alkaline (not acidified) KMnO₄ used? A. Acidic KMnO₄ would oxidise the benzene ring rather than the methyl side-chain B. Alkaline conditions are needed for side-chain oxidation; in alkaline KMnO₄ the permanganate ion is a sufficiently strong oxidant to convert –CH₃ to –COO⁻, which is then acidified to give –COOH C. Acidic KMnO₄ would dissolve the benzoic acid product as soon as it forms D. Alkaline KMnO₄ reacts at a lower temperature, reducing the risk of benzene ring opening","A":"","B":"","C":"","D":"","correct":"","explain":"Under acidic conditions, KMnO₄ is reduced to Mn²⁺ (colourless/pale pink solution), but the reaction does not efficiently oxidise side-chains on arene rings. Under alkaline conditions, MnO₄⁻ is reduced to MnO₂ (brown precipitate) and the oxidation of –CH₃ to –COO⁻ proceeds completely. The manganate(IV) oxide precipitate must be removed by hot filtration before the filtrate is acidified to precipitate benzoic acid, otherwise MnO₂ contaminates the product."},{"stem":"After reflux with alkaline KMnO₄ to oxidise methylbenzene, a brown precipitate of MnO₂ is present in the reaction mixture. What is the correct order of steps to isolate pure benzoic acid? A. Acidify the mixture → filter hot to remove MnO₂ → cool to crystallise benzoic acid → Buchner filter B. Filter hot to remove MnO₂ → acidify the clear filtrate → cool to crystallise benzoic acid → Buchner filter → wash with cold water → dry C. Cool the mixture first → filter to remove MnO₂ → acidify → collect crystals D. Add excess NaOH → acidify → filter hot → cool to crystallise","A":"","B":"","C":"","D":"","correct":"","explain":"MnO₂ must be removed before acidification because it would otherwise contaminate the benzoic acid crystals. Hot filtration removes the MnO₂ while the mixture is still fluid. Adding dilute HCl or H₂SO₄ to the filtrate acidifies the benzoate salt (C₆H₅COO⁻ + H⁺ → C₆H₅COOH), producing benzoic acid which precipitates on cooling. Buchner filtration under suction collects the crystals efficiently; cold water washing removes soluble ionic impurities (NaCl, MnSO₄)."},{"stem":"The purple colour of alkaline KMnO₄ fades during the oxidation of methylbenzene. What colour change indicates the reaction is complete, and what species forms? A. Purple → colourless; Mn²⁺ ions form in solution B. Purple → green; manganate(VI) ions (MnO₄²⁻) form C. Purple → brown; manganese(IV) oxide (MnO₂) precipitates as a brown solid D. Purple → yellow; manganate(VII) disproportionates to give Fe³⁺-like colouring","A":"","B":"","C":"","D":"","correct":"","explain":"In alkaline solution, MnO₄⁻ (purple) is reduced to MnO₂ (brown solid precipitate) as it oxidises the methyl side-chain. The colour change purple → brown, accompanied by the formation of a brown precipitate, is the visual indicator that the permanganate has been consumed. This is distinct from the acidic reduction (MnO₄⁻ purple → Mn²⁺ colourless/pale pink). Recognising the MnO₂ product and its brown colour is essential for exam questions on this preparation."},{"stem":"In the preparation of methyl 3-nitrobenzoate, the nitration mixture (concentrated HNO₃ + concentrated H₂SO₄) is kept below 10 °C throughout. Why is strict temperature control essential? A. Above 10 °C the H₂SO₄ starts to decompose and loses its catalytic activity B. Above 10 °C dinitration becomes significant — a second NO₂⁺ group is introduced, giving a dinitro by-product instead of the desired mononitro compound C. Methyl benzoate is a solid above 10 °C and must be kept liquid for the reaction to proceed D. HNO₃ is unstable above 10 °C and decomposes to NO and water","A":"","B":"","C":"","D":"","correct":"","explain":"Nitration is an electrophilic substitution; the first NO₂ group is introduced rapidly. However, once one nitro group is on the ring, electron withdrawal deactivates the ring, slowing the second substitution. At low temperatures (<10 °C) the rate of dinitration is negligible and monosubstitution is controlled. Above 10 °C, the reaction is fast enough for a second (and potentially third) nitration to occur, producing 1,3-dinitro or trinitro products which are difficult to separate and reduce yield. Ice-bath cooling throughout is mandatory."},{"stem":"The –COOCH₃ group on methyl benzoate is a meta-directing substituent. Where does the incoming NO₂⁺ electrophile attack, and why? A. Ortho/para positions — the ester group donates electrons into the ring by resonance, activating these positions B. Meta position — the –COOCH₃ group withdraws electrons from the ring by inductive and resonance effects, deactivating ortho and para positions more than meta C. Any position at random because the ring is too deactivated to direct substitution D. Ipso position — the electrophile replaces the ester group","A":"","B":"","C":"","D":"","correct":"","explain":"The carbonyl carbon of –COOCH₃ is electron-deficient and withdraws electron density from the benzene ring by resonance (via the C=O bond) and induction. This electron withdrawal is greatest at the ortho and para positions (as shown by resonance structures with positive charge at C-1, C-3, C-5 relative to the substituent). The meta position retains more electron density and is attacked preferentially by the electrophile NO₂⁺. Electron-withdrawing groups are universally meta-directing; this is a key regiochemistry rule for electrophilic aromatic substitution."},{"stem":"In the preparation of methyl 3-nitrobenzoate, what species is the actual electrophile that attacks the benzene ring, and how is it generated? A. NO₃⁻ — the nitrate ion directly attacks the ring as an anion B. HNO₃ — undissociated nitric acid is the electrophile C. NO₂⁺ (nitronium ion) — generated when H₂SO₄ protonates HNO₃: H₂SO₄ + HNO₃ → H₂NO₃⁺ → NO₂⁺ + H₂O D. SO₃ — sulfuric acid acts as the electrophile in place of nitric acid","A":"","B":"","C":"","D":"","correct":"","explain":"Concentrated H₂SO₄ acts as an acid relative to HNO₃: it donates a proton to HNO₃ to form H₂NO₃⁺, which then loses water to form the nitronium ion (NO₂⁺). NO₂⁺ is a powerful electrophile that attacks the electron-rich benzene ring in the rate-determining step. The identification of NO₂⁺ as the electrophile — not HNO₃ or NO₃⁻ — is a standard mark point in OCR mechanism questions on nitration."},{"stem":"A student adds 2,4-dinitrophenylhydrazine (2,4-DNPH) reagent to two unknown organic compounds. Compound A gives an orange precipitate; Compound B gives no precipitate. What functional group must be present in A and absent from B? A. Carboxylic acid (–COOH) B. Alcohol (–OH) C. Carbonyl group (C=O) — aldehyde or ketone D. Ester (–COO–)","A":"","B":"","C":"","D":"","correct":"","explain":"2,4-DNPH reacts with the C=O group of aldehydes and ketones to form an orange or yellow–orange precipitate (a 2,4-dinitrophenylhydrazone). It does not react with alcohols, carboxylic acids, esters or other functional groups. A positive test (precipitate) confirms a carbonyl compound; a negative test rules it out. Note that 2,4-DNPH cannot distinguish between an aldehyde and a ketone — Tollens' reagent is required for that further distinction."},{"stem":"Compound A (from Q10) is then treated with Tollens' reagent (ammoniacal silver nitrate) and warmed gently. A silver mirror forms on the inside of the tube. What does this confirm about Compound A? A. Compound A is a ketone — ketones reduce Ag⁺ to Ag B. Compound A is an aldehyde — aldehydes are oxidised by Tollens' reagent, reducing Ag⁺ to silver metal; ketones do not react C. Compound A contains a C=C double bond, which reduces the silver ions D. Compound A is a carboxylic acid, which reduces Ag⁺ under heating","A":"","B":"","C":"","D":"","correct":"","explain":"Tollens' reagent oxidises aldehydes to carboxylate ions: RCHO + 2[Ag(NH₃)₂]⁺ + 2OH⁻ → RCOO⁻ + 2Ag(s) + 4NH₃ + H₂O. The silver deposits on the glass as a bright mirror. Ketones cannot be oxidised under these mild conditions and give no silver mirror. The combination of 2,4-DNPH positive (C=O present) and Tollens' positive (silver mirror) uniquely identifies an aldehyde; 2,4-DNPH positive with Tollens' negative identifies a ketone."},{"stem":"Three haloalkane solutions (chloroethane, bromoethane, iodoethane) each in ethanol are treated with ethanolic silver nitrate at room temperature. Iodoethane reacts fastest, giving a yellow precipitate; chloroethane reacts slowest, giving a white precipitate. What determines the rate order? A. The polarity of the C–X bond — C–Cl is most polar, so Cl⁻ ionises fastest B. The C–X bond enthalpy — C–I has the lowest bond enthalpy (~240 kJ mol⁻¹) and breaks most easily; C–Cl has the highest (~340 kJ mol⁻¹) and breaks most slowly C. The electronegativity of the halogen — I is least electronegative, so C–I breaks most readily via induction D. The size of the halide ion — I⁻ is largest so it leaves most easily through steric effects","A":"","B":"","C":"","D":"","correct":"","explain":"The rate-determining step for hydrolysis is C–X bond breaking. Bond enthalpy (not polarity) governs how readily this occurs: C–I (~240 kJ mol⁻¹) < C–Br (~290 kJ mol⁻¹) < C–Cl (~340 kJ mol⁻¹). Although C–Cl is the most polar bond (largest Δχ), polarity is not the dominant factor — bond enthalpy is. This is a key OCR examiner-report point: \"electronegativity\" or \"polarity\" as the explanation is penalised; \"bond enthalpy\" is required. The AgX precipitate colour — AgCl white, AgBr cream, AgI yellow — also confirms which halide is released."},{"stem":"In setting up a standard electrochemical cell to measure E°cell, a student uses a low-resistance ammeter instead of a high-resistance voltmeter. What is the consequence? A. The ammeter measures voltage instead of current, giving the same E° reading but in different units B. Current flows through the external circuit, causing the cell reaction to proceed; the EMF drops below E° because conditions deviate from standard equilibrium and internal resistance losses occur C. No current flows and no reading is obtained because the circuit is not complete D. The high resistance of the ammeter stops any current flowing, so E° is measured correctly","A":"","B":"","C":"","D":"","correct":"","explain":"E°cell is defined under equilibrium, zero-current conditions. A high-resistance voltmeter draws negligible current, maintaining the equilibrium concentrations and standard conditions. A low-resistance ammeter allows significant current to flow, depleting reactants, altering concentrations (and thus electrode potentials), and causing a voltage drop across internal resistance — all of which reduce the measured EMF below E°. This is why a high-resistance (digital) voltmeter is specified for all electrochemical measurements."},{"stem":"A standard hydrogen electrode (SHE) has H₂(g) at 100 kPa, H⁺(aq) at 1.00 mol dm⁻³, and T = 298 K, giving E = 0.00 V by definition. A student makes one change. Which change causes the measured potential to deviate from 0.00 V? A. Replacing polished platinum with platinum black as the electrode surface B. Increasing [H⁺] to 2.00 mol dm⁻³ while keeping T and p(H₂) constant C. Using HCl instead of H₂SO₄ as the H⁺ source, maintaining [H⁺] = 1.00 mol dm⁻³ D. Using a KCl salt bridge instead of KNO₃ to connect to the second half-cell","A":"","B":"","C":"","D":"","correct":"","explain":"The SHE potential equals 0.00 V only when all three standard conditions are met: [H⁺] = 1.00 mol dm⁻³, p(H₂) = 100 kPa, T = 298 K. By the Nernst equation, raising [H⁺] to 2.00 mol dm⁻³ shifts the equilibrium 2H⁺ + 2e⁻ ⇌ H₂ further toward H₂, raising the reduction potential above 0.00 V — a real, measurable deviation. Option A: platinum black increases surface area (faster kinetics) but does not change the thermodynamic electrode potential. Option C: the acid source is irrelevant — only [H⁺] matters, and the question specifies it remains 1.00 mol dm⁻³ whether HCl or H₂SO₄ is used. Option D: the salt bridge electrolyte does not affect the SHE half-cell potential. Standard conditions (all three specified correctly) are a core OCR mark point."},{"stem":"A cell is constructed from a Zn²⁺/Zn half-cell (E° = −0.76 V) and a Cu²⁺/Cu half-cell (E° = +0.34 V). What is the standard cell potential, and which electrode is the positive terminal? A. E°cell = −1.10 V; Zn is positive B. E°cell = +0.42 V; Zn is positive C. E°cell = −0.42 V; Cu is positive D. E°cell = +1.10 V; Cu is positive — Cu²⁺/Cu has the more positive electrode potential and acts as the cathode (positive terminal)","A":"","B":"","C":"","D":"","correct":"","explain":"E°cell = E°(more positive half-cell) − E°(more negative half-cell) = +0.34 − (−0.76) = +1.10 V. The copper half-cell has the more positive electrode potential, so reduction occurs there: Cu²⁺ + 2e⁻ → Cu. The zinc half-cell undergoes oxidation: Zn → Zn²⁺ + 2e⁻. Electrons flow from Zn (negative terminal/anode) through the external circuit to Cu (positive terminal/cathode). The salt bridge (typically KNO₃ in agar) completes the circuit internally by allowing ion flow while preventing direct mixing of the electrolytes."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
