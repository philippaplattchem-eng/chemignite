<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>4.2 &mdash; Alkanes</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark &mdash; Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the general formula for the alkane homologous series?","A":"CₙH₂ₙ","B":"CₙH₂ₙ₊₂","C":"CₙH₂ₙ₊₁","D":"CₙH₂ₙO","correct":"B","explain":"Alkanes are saturated hydrocarbons containing only C–C and C–H single bonds. The formula CₙH₂ₙ₊₂ can be derived by counting: a chain of n carbons has (n−1) C–C bonds using 2(n−1) bonding positions, leaving 4n − 2(n−1) = 2n+2 positions for hydrogen. Methane n=1 gives CH₄ ✓; propane n=3 gives C₃H₈ ✓. CₙH₂ₙ is the alkene formula (one C=C reduces H by 2 relative to the alkane). Checking any candidate formula against CₙH₂ₙ₊₂ instantly identifies (non-cyclic) alkanes."},{"stem":"What type of bond is the C–C single bond in an alkane?","A":"π-bond","B":"σ-bond","C":"Ionic bond","D":"Coordinate bond","correct":"B","explain":"A σ-bond (sigma bond) is formed by the direct, head-on overlap of two orbitals along the internuclear axis. It is axially symmetric: viewed end-on, it appears circular, and there is essentially free rotation around it at room temperature. All single covalent bonds are σ-bonds. A π-bond (pi bond) is formed by sideways overlap of p-orbitals above and below the bond axis and is only present in double and triple bonds (alkenes and alkynes). Because σ-bonds have no exposed electron cloud above or below the carbon skeleton, alkanes are not attacked by electrophiles, unlike alkenes."},{"stem":"What bond angle is found around every carbon atom in an alkane, and what is the shape?","A":"120°, trigonal planar","B":"109.5°, tetrahedral","C":"107°, trigonal pyramidal","D":"90°, square planar","correct":"B","explain":"Every carbon in an alkane is bonded to exactly four other atoms and has no lone pairs. By electron-pair repulsion theory (VSEPR), four bonding pairs arrange themselves to minimise repulsion. The geometry that maximises the separation of four equivalent pairs is the regular tetrahedron, giving angles of 109.5° between every pair of bonds. Trigonal planar (120°) applies when there are three bonding pairs and no lone pairs (e.g. the carbons in a C=C alkene). Trigonal pyramidal (107°) applies when there are three bonding pairs and one lone pair (e.g. ammonia NH₃)."},{"stem":"Which type of intermolecular force acts between alkane molecules?","A":"Hydrogen bonding","B":"Permanent dipole–dipole interactions","C":"London (induced dipole–dipole) forces","D":"Ion–dipole interactions","correct":"C","explain":"Alkanes are non-polar: the C–H bond has a very small electronegativity difference (Δχ ≈ 0.4) and the C–C bond is non-polar. There are no permanent dipoles, so no permanent dipole–dipole forces. There are no O–H or N–H bonds, so no hydrogen bonding. The only intermolecular forces are London forces, arising from temporary, instantaneous dipoles that induce opposing dipoles in neighbouring molecules. OCR mark schemes explicitly reject the term \"van der Waals forces\" for this mark: the required term is \"London forces\" or \"induced dipole–dipole interactions.\""},{"stem":"Which are the correct products of the complete combustion of propane in excess oxygen?","A":"CO and H₂O","B":"C and H₂O","C":"CO₂ and H₂O","D":"CO₂ and H₂","correct":"C","explain":"Complete combustion occurs when the oxygen supply is unlimited. Every carbon atom is fully oxidised to CO₂ and every hydrogen atom forms H₂O: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. Carbon monoxide (CO) and soot (C) are products of incomplete combustion — when the oxygen supply is limited and not every carbon can be fully oxidised. H₂ is not formed in combustion (hydrogen is oxidised to water by the oxygen). Checking: 3 C → 3 CO₂, 8 H → 4 H₂O, O₂ balance: 5 × 2 = 10 O needed, 3×2 + 4×1 = 10 O on right ✓."},{"stem":"Why is carbon monoxide produced by incomplete combustion particularly dangerous in the home?","A":"It is an acidic gas that irritates the respiratory system","B":"It causes acid rain when released outdoors","C":"It binds to haemoglobin more strongly than oxygen, preventing oxygen transport in the blood","D":"It reacts with water vapour to form a toxic acid","correct":"C","explain":"CO is colourless, odourless, and tasteless, so victims cannot detect it. It binds to the Fe²⁺ centre of haemoglobin approximately 200 times more strongly than O₂ does, forming carboxyhaemoglobin. Haemoglobin bound to CO cannot carry O₂: the blood can no longer transport oxygen to the tissues. At sufficient CO concentrations, this causes chemical asphyxiation and is rapidly fatal. CO carbon monoxide sensors are mandatory in homes with gas appliances precisely because it is undetectable without instruments."},{"stem":"What conditions are required for the reaction of methane with chlorine?","A":"Heat to 300°C with a platinum catalyst","B":"Dissolved in water at room temperature","C":"Ultraviolet (UV) light","D":"Concentrated sulfuric acid at room temperature","correct":"C","explain":"The reaction CH₄ + Cl₂ → CH₃Cl + HCl is free radical substitution. It requires UV light because the first step (initiation) is the homolytic fission of the Cl–Cl bond. UV photons carry enough energy (~300–600 kJ mol⁻¹) to break the Cl–Cl bond (bond enthalpy ≈ +242 kJ mol⁻¹). In the dark at room temperature, no reaction occurs. High temperature can also provide the energy, but UV light is the OCR-standard condition. Acid catalysts have no role in radical mechanisms: they are used in ionic (heterolytic) reactions, not radical (homolytic) ones."},{"stem":"What is the correct name for the type of mechanism by which methane reacts with chlorine?","A":"Electrophilic substitution","B":"Nucleophilic substitution","C":"Free radical substitution","D":"Electrophilic addition","correct":"C","explain":"This reaction proceeds through radical intermediates (species with unpaired electrons) formed by homolytic fission of the Cl–Cl bond. The mechanism is therefore free radical substitution (also acceptable: radical substitution). Electrophilic substitution is the mechanism for the reactions of benzene (arenes), not alkanes. Nucleophilic substitution is the mechanism for haloalkanes reacting with nucleophiles. Electrophilic addition is the mechanism for alkenes reacting with HBr, Br₂, etc. Calling radical substitution \"electrophilic\" or \"nucleophilic\" is a heavily penalised error — H032/02 June 2024 examiner report specifically noted this as the most common incorrect response."},{"stem":"In the initiation step of the radical chlorination of methane, what is formed from Cl₂?","A":"Cl⁺ and Cl⁻ (ions)","B":"2Cl• (two chlorine radicals)","C":"HCl and Cl• (one product molecule and one radical)","D":"Cl₂ is not broken in initiation; it is broken in the propagation step","correct":"B","explain":"Initiation is the step in which UV light provides energy for the homolytic fission of Cl₂: Cl₂ → 2Cl•. Each chlorine atom receives one electron from the shared pair and becomes a radical (species with one unpaired electron). Option A (Cl⁺ and Cl⁻) would result from heterolytic fission, which gives ions and is the mechanism type for polar reactions — not radical reactions. Option C confuses initiation with propagation (which is where HCl is formed). Initiation produces the first radicals that then enter the chain."},{"stem":"Which termination step accounts for the formation of ethane (C₂H₆) as a minor by-product in the radical chlorination of methane?","A":"2Cl• → Cl₂","B":"Cl• + CH₃• → CH₃Cl","C":"2CH₃• → C₂H₆","D":"CH₄ + Cl₂ → C₂H₆ + 2HCl","correct":"C","explain":"Termination occurs when two radicals collide and combine. If two methyl radicals (CH₃•) meet, they combine to form a C–C bond: 2CH₃• → C₂H₆. This ethane is a by-product that cannot be accounted for by the main stoichiometric equation (CH₄ + Cl₂ → CH₃Cl + HCl) and is present only because of the radical chain mechanism. Option A (2Cl• → Cl₂) is also a valid termination step but simply regenerates chlorine. Option B (Cl• + CH₃• → CH₃Cl) also terminates the chain and produces the same main product. Option D is not a termination step and is not a valid reaction equation."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
