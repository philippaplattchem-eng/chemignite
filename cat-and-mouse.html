<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat and Mouse — ChemIgnite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:#f4f6fb;min-height:100vh}

    .screen-nav{background:#2e1065;color:#fff;padding:.65rem 1.5rem;display:flex;align-items:center;gap:.85rem;margin-bottom:1.5rem}
    .screen-nav a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;font-weight:700;border:1px solid rgba(255,255,255,.3);padding:.22rem .7rem;border-radius:20px;transition:background .15s;white-space:nowrap}
    .screen-nav a:hover{background:rgba(255,255,255,.12)}
    .screen-nav-title{font-size:.88rem;opacity:.65;font-weight:600}

    #game-wrap{max-width:680px;margin:0 auto;padding:0 1rem 3rem}

    h1{text-align:center;font-size:1.55rem;font-weight:800;color:#2e1065;margin-bottom:.2rem}
    .tagline{text-align:center;font-size:.82rem;color:#64748b;margin-bottom:1rem}

    #score-bar{display:flex;justify-content:space-between;align-items:center;background:#2e1065;color:#fff;border-radius:10px;padding:.5rem 1.1rem;margin-bottom:1rem;font-size:.82rem;font-weight:700;gap:.5rem;flex-wrap:wrap}
    #score-bar span{white-space:nowrap}

    /* Board track */
    #track-wrap{background:#fff;border-radius:14px;padding:1rem .8rem .8rem;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:.75rem}

    #track{display:flex;flex-direction:column;gap:5px}

    .track-row{display:flex;gap:3px;align-items:stretch}
    .track-row.reverse{flex-direction:row-reverse}

    .space{
      flex:1;min-width:0;
      aspect-ratio:1;
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(.55rem,1.8vw,.8rem);
      font-weight:700;
      border:2px solid #cbd5e1;
      background:#f8fafc;
      color:#94a3b8;
      transition:background .28s,border-color .28s,transform .25s,font-size .2s;
      user-select:none;
    }

    .space.passed{background:#e2e8f0;border-color:#94a3b8;color:#c0cad8}
    .space.cat-here{
      background:#ede9fe;border-color:#7c3aed;
      font-size:clamp(.9rem,3.8vw,1.45rem);color:#2e1065;
      transform:scale(1.14);z-index:2;
      animation:cat-hop .32s ease;
    }
    .space.mouse-here{
      background:#fef9c3;border-color:#d97706;
      font-size:clamp(.9rem,3.8vw,1.45rem);color:#2e1065;
      transform:scale(1.08);z-index:1;
    }
    .space.both-here{
      background:linear-gradient(135deg,#ede9fe 50%,#fef9c3 50%);
      border-color:#7c3aed;
      font-size:clamp(.9rem,3.8vw,1.45rem);color:#2e1065;
      transform:scale(1.18);z-index:3;
      animation:cat-hop .32s ease;
    }
    .space.exit-space{background:#fee2e2;border-color:#ef4444;color:#ef4444}
    .space.exit-space.mouse-here{background:#fef9c3;border-color:#d97706}

    @keyframes cat-hop{0%{transform:scale(1.14)}45%{transform:scale(1.28)}100%{transform:scale(1.14)}}

    #track-turn{
      text-align:right;
      padding-right:3px;
      font-size:1.5rem;
      color:#7c3aed;
      line-height:1;
      margin:-1px 0;
    }

    #gap-line{
      text-align:center;font-size:.82rem;font-weight:700;color:#475569;
      margin-bottom:.9rem;padding:.32rem .8rem;
      background:#f1f5f9;border-radius:8px;
    }

    /* Question panel */
    #q-panel{background:#fff;border-radius:14px;padding:1.1rem 1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.08)}
    #q-level{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7c3aed;margin-bottom:.35rem}
    #q-text{font-size:.95rem;font-weight:600;color:#2e1065;margin-bottom:.9rem;line-height:1.5}
    #options{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
    .opt-btn{background:#f1f5f9;border:2px solid #e2e8f0;border-radius:10px;padding:.6rem .75rem;font-size:.82rem;font-weight:600;font-family:inherit;color:#1e293b;cursor:pointer;transition:all .15s;text-align:left;line-height:1.4}
    .opt-btn:hover:not(:disabled){background:#ede9fe;border-color:#7c3aed;color:#5b21b6}
    .opt-btn.correct{background:#dcfce7;border-color:#16a34a;color:#15803d}
    .opt-btn.wrong{background:#fecaca;border-color:#dc2626;color:#dc2626}
    .opt-btn:disabled{cursor:default}
    #feedback{margin-top:.7rem;font-size:.85rem;font-weight:700;min-height:1.3rem;text-align:center}
    #feedback.ok{color:#15803d}
    #feedback.bad{color:#dc2626}

    /* Overlay */
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
    #overlay.show{opacity:1;pointer-events:all}
    #ov-box{background:#fff;border-radius:20px;padding:2.2rem 1.8rem;text-align:center;max-width:340px;width:90%;animation:pop-in .4s ease}
    @keyframes pop-in{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    #ov-emoji{font-size:3.5rem;margin-bottom:.4rem}
    #ov-title{font-size:1.45rem;font-weight:800;color:#2e1065;margin-bottom:.35rem}
    #ov-msg{font-size:.88rem;color:#475569;margin-bottom:1.3rem;line-height:1.5}
    #play-again{background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:.7rem 1.8rem;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s}
    #play-again:hover{background:#5b21b6}
  </style>
</head>
<body>

<div class="screen-nav">
  <a href="index.html">&#8592; Home</a>
  <span class="screen-nav-title">Cat and Mouse</span>
</div>

<div id="game-wrap">
  <h1>&#128049; Cat and Mouse &#128045;</h1>
  <p class="tagline">Answer questions correctly to chase down the mouse before it escapes!</p>

  <div id="score-bar">
    <span>&#11088; Score: <span id="score-val">0</span></span>
    <span>&#9989; <span id="correct-val">0</span> correct</span>
    <span>&#10060; <span id="wrong-val">0</span> wrong</span>
  </div>

  <div id="track-wrap">
    <div id="track">
      <div class="track-row" id="row1"></div>
      <div id="track-turn">&#8659;</div>
      <div class="track-row reverse" id="row2"></div>
    </div>
  </div>

  <div id="gap-line"></div>

  <div id="q-panel">
    <div id="q-level"></div>
    <div id="q-text"></div>
    <div id="options">
      <button class="opt-btn" data-i="0"></button>
      <button class="opt-btn" data-i="1"></button>
      <button class="opt-btn" data-i="2"></button>
      <button class="opt-btn" data-i="3"></button>
    </div>
    <div id="feedback"></div>
  </div>
</div>

<div id="overlay">
  <div id="ov-box">
    <div id="ov-emoji"></div>
    <div id="ov-title"></div>
    <div id="ov-msg"></div>
    <button id="play-again">Play Again</button>
  </div>
</div>

<script>
var TRACK_LEN = 20;
var CAT_START  = 0;
var MOUSE_START = 6;

var QUESTIONS = [
  // GCSE
  {lv:'GCSE', q:'What is the atomic number of carbon?',
   o:['4','6','8','12'], a:1},
  {lv:'GCSE', q:'What is the chemical formula for water?',
   o:['HO','H&#8322;O&#8322;','H&#8322;O','H&#8323;O'], a:2},
  {lv:'GCSE', q:'What type of bond forms between sodium and chlorine in NaCl?',
   o:['Covalent','Metallic','Hydrogen','Ionic'], a:3},
  {lv:'GCSE', q:'What gas is produced when an acid reacts with a carbonate?',
   o:['Hydrogen','Oxygen','Nitrogen','Carbon dioxide'], a:3},
  {lv:'GCSE', q:'What is the pH of a neutral solution?',
   o:['0','5','7','14'], a:2},
  {lv:'GCSE', q:'What is the formula for sulfuric acid?',
   o:['HCl','HNO&#8323;','H&#8323;PO&#8324;','H&#8322;SO&#8324;'], a:3},
  {lv:'GCSE', q:'In electrolysis of molten NaCl, what forms at the cathode?',
   o:['Chlorine gas','Oxygen gas','Sodium metal','Hydrogen gas'], a:2},
  {lv:'GCSE', q:'What is the general formula for alkanes?',
   o:['C&#8345;H&#8322;&#8345;','C&#8345;H&#8322;&#8345;&#8330;&#8322;','C&#8345;H&#8322;&#8345;&#8331;&#8322;','C&#8345;H&#8345;'], a:1},
  {lv:'GCSE', q:'What does the Haber process produce?',
   o:['Sulfuric acid','Ethanol','Nitric acid','Ammonia'], a:3},
  {lv:'GCSE', q:'Which group do the halogens belong to?',
   o:['Group 1','Group 2','Group 6','Group 7'], a:3},
  {lv:'GCSE', q:'What is oxidation in terms of electrons?',
   o:['Gain of electrons','Loss of protons','Gain of protons','Loss of electrons'], a:3},
  {lv:'GCSE', q:'Which particle has a relative mass of ~1 and a charge of +1?',
   o:['Electron','Neutron','Photon','Proton'], a:3},
  {lv:'GCSE', q:'What is the mass number of an atom?',
   o:['Number of protons','Number of neutrons','Protons + electrons','Protons + neutrons'], a:3},
  {lv:'GCSE', q:'Which of these is a mixture?',
   o:['Water','Salt','Carbon dioxide','Air'], a:3},
  {lv:'GCSE', q:'What is produced in the complete combustion of ethanol?',
   o:['CO and H&#8322;O','CO&#8322; and H&#8322;','C and H&#8322;O','CO&#8322; and H&#8322;O'], a:3},
  {lv:'GCSE', q:'Which state of matter has a definite volume but no fixed shape?',
   o:['Solid','Liquid','Gas','Plasma'], a:1},
  {lv:'GCSE', q:'What is the chemical symbol for iron?',
   o:['Ir','In','Fr','Fe'], a:3},
  {lv:'GCSE', q:'What is the charge of an electron?',
   o:['+1','0','+2','&#8722;1'], a:3},
  {lv:'GCSE', q:'In a neutralisation reaction, an acid and base produce...',
   o:['Salt and water','Salt and gas','Water and gas','Salt only'], a:0},
  {lv:'GCSE', q:'What is the role of a catalyst in a chemical reaction?',
   o:['Increases activation energy','Is consumed in the reaction','Lowers activation energy','Changes the products'], a:2},
  {lv:'GCSE', q:'What is the symbol for the element with atomic number 11?',
   o:['N','Na','Mg','Ne'], a:1},
  {lv:'GCSE', q:'Which of these is an alkali metal?',
   o:['Calcium','Chlorine','Potassium','Copper'], a:2},
  {lv:'GCSE', q:'What type of structure does diamond have?',
   o:['Simple molecular','Giant ionic','Metallic','Giant covalent'], a:3},
  {lv:'GCSE', q:'Which gas burns with a squeaky pop when tested with a lit splint?',
   o:['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'], a:3},
  {lv:'GCSE', q:'What turns limewater milky?',
   o:['Oxygen','Hydrogen','Sulfur dioxide','Carbon dioxide'], a:3},
  {lv:'GCSE', q:'Which of these reactions is endothermic?',
   o:['Combustion','Neutralisation','Thermal decomposition','Respiration'], a:2},
  {lv:'GCSE', q:'Which is the most reactive metal in the reactivity series?',
   o:['Iron','Copper','Zinc','Potassium'], a:3},
  {lv:'GCSE', q:'What is a polymer?',
   o:['A small reactive molecule','A long chain molecule made from many monomers','A type of ionic compound','A saturated hydrocarbon'], a:1},
  {lv:'GCSE', q:'What process separates crude oil into useful fractions?',
   o:['Simple distillation','Chromatography','Fractional distillation','Cracking'], a:2},
  {lv:'GCSE', q:'What type of bonding is found in metals?',
   o:['Ionic','Covalent','Hydrogen','Metallic'], a:3},
  {lv:'GCSE', q:'What happens to the rate of reaction when temperature increases?',
   o:['It decreases','It stays the same','It stops completely','It increases'], a:3},
  {lv:'GCSE', q:'What are isotopes?',
   o:['Atoms of different elements','Charged atoms','Atoms of the same element with different numbers of neutrons','Atoms with the same mass number'], a:2},
  {lv:'GCSE', q:'What is produced when a metal reacts with an acid?',
   o:['Salt and water','Salt and carbon dioxide','Salt and hydrogen','Oxide and water'], a:2},
  {lv:'GCSE', q:'What colour flame do sodium compounds produce?',
   o:['Lilac','Blue-green','Crimson red','Yellow'], a:3},
  {lv:'GCSE', q:'What is the formula for calcium carbonate?',
   o:['CaCO&#8322;','Ca&#8322;CO&#8323;','CaCO&#8323;','Ca(CO&#8323;)&#8322;'], a:2},
  {lv:'GCSE', q:'In electrolysis of aqueous copper sulfate, what forms at the cathode?',
   o:['Oxygen','Hydrogen','Sulfate ions','Copper'], a:3},
  {lv:'GCSE', q:'What is the test for an alkene?',
   o:['Burns with a clean blue flame','Decolourises bromine water','Turns limewater milky','Burns with a squeaky pop'], a:1},
  {lv:'GCSE', q:'What type of reaction occurs when an alkene reacts with bromine?',
   o:['Substitution','Elimination','Addition','Condensation'], a:2},
  {lv:'GCSE', q:'What is the relative atomic mass of oxygen?',
   o:['8','12','14','16'], a:3},
  {lv:'GCSE', q:'Which is a property of ionic compounds?',
   o:['Conduct electricity when solid','Low melting points','Conduct electricity when dissolved in water','Insoluble in water'], a:2},
  {lv:'GCSE', q:'What is chromatography used for?',
   o:['Separating liquids by boiling point','Separating mixtures of soluble substances','Removing solids from a liquid','Separating gases'], a:1},
  {lv:'GCSE', q:'What type of change is ice melting?',
   o:['Chemical change','Irreversible change','Nuclear change','Physical change'], a:3},
  // A-level
  {lv:'A-level', q:'What does K<sub>c</sub> represent?',
   o:['Rate constant','Boltzmann constant','Partition coefficient','Equilibrium constant (concentrations)'], a:3},
  {lv:'A-level', q:'What is the hybridisation of carbon in methane?',
   o:['sp','sp&#178;','sp&#179;d','sp&#179;'], a:3},
  {lv:'A-level', q:'Which reagent oxidises a primary alcohol to a carboxylic acid?',
   o:["Tollens' reagent",'NaBH&#8324;','LiAlH&#8324;','Acidified K&#8322;Cr&#8322;O&#8327;'], a:3},
  {lv:'A-level', q:'In a first order reaction, what happens to the half-life as the reaction proceeds?',
   o:['It increases','It decreases','It doubles','It stays constant'], a:3},
  {lv:'A-level', q:'What is the IUPAC name for CH&#8323;CH(OH)CH&#8323;?',
   o:['Propan-1-ol','2-methylpropan-1-ol','Propan-2-ol','Propanol'], a:2},
  {lv:'A-level', q:'Which has the highest first ionisation energy?',
   o:['Na','Mg','Al','Ne'], a:3},
  {lv:'A-level', q:'What is the bond angle in a tetrahedral molecule?',
   o:['90&#176;','107&#176;','109.5&#176;','120&#176;'], a:2},
  {lv:'A-level', q:'What is the oxidation state of Cr in K&#8322;Cr&#8322;O&#8327;?',
   o:['+3','+4','+7','+6'], a:3},
  {lv:'A-level', q:"According to Le Chatelier's principle, a system at equilibrium will...",
   o:['Increase the rate of forward reaction','Decrease activation energy','Oppose any imposed change','Release heat when compressed'], a:2},
  {lv:'A-level', q:'What type of reaction is the formation of a polyester?',
   o:['Addition polymerisation','Free radical substitution','Condensation polymerisation','Electrophilic addition'], a:2},
  {lv:'A-level', q:'What is the shape of a molecule with 3 bonding pairs and 1 lone pair?',
   o:['Trigonal planar','Tetrahedral','Pyramidal','Bent'], a:2},
];

var catPos, mousePos, qIdx, scoreVal, correctVal, wrongVal, shuffled, gameOver;

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function buildTrack(){
  var r1=document.getElementById('row1');
  var r2=document.getElementById('row2');
  r1.innerHTML='';r2.innerHTML='';
  for(var i=0;i<10;i++){
    var d=document.createElement('div');
    d.className='space';d.id='sp'+i;
    r1.appendChild(d);
  }
  for(var i=10;i<TRACK_LEN;i++){
    var d=document.createElement('div');
    d.className='space';d.id='sp'+i;
    r2.appendChild(d);
  }
}

function render(){
  for(var i=0;i<TRACK_LEN;i++){
    var el=document.getElementById('sp'+i);
    var isCat=(i===catPos), isMouse=(i===mousePos);
    var passed=(i<catPos), isExit=(i===TRACK_LEN-1);

    el.className='space';
    if(isExit)el.classList.add('exit-space');

    if(isCat&&isMouse){
      el.classList.add('both-here');
      el.innerHTML='&#128049;&#128045;';
    }else if(isCat){
      el.classList.add('cat-here');
      el.innerHTML='&#128049;';
    }else if(isMouse){
      el.classList.add('mouse-here');
      el.innerHTML='&#128045;';
    }else if(passed){
      el.classList.add('passed');
      el.innerHTML=i===0?'&#10003;':(i+1);
    }else if(isExit){
      el.innerHTML='&#127937;';
    }else{
      el.innerHTML=(i+1);
    }
  }

  var gap=mousePos-catPos;
  document.getElementById('gap-line').innerHTML=
    '&#128049; <span style="color:#7c3aed;font-weight:800;">'+gap+' step'+(gap===1?'':'s')+' behind</span> &#128045;';
  document.getElementById('score-val').textContent=scoreVal;
  document.getElementById('correct-val').textContent=correctVal;
  document.getElementById('wrong-val').textContent=wrongVal;
}

function initGame(){
  catPos=CAT_START;mousePos=MOUSE_START;
  qIdx=0;scoreVal=0;correctVal=0;wrongVal=0;gameOver=false;
  shuffled=shuffle(QUESTIONS);
  buildTrack();render();showQ();
  document.getElementById('overlay').classList.remove('show');
}

function showQ(){
  if(gameOver)return;
  var q=shuffled[qIdx%shuffled.length];
  document.getElementById('q-level').textContent=q.lv;
  document.getElementById('q-text').innerHTML=q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='';
  var btns=document.querySelectorAll('.opt-btn');
  var labels=['A','B','C','D'];
  btns.forEach(function(btn,i){
    btn.innerHTML='<b>'+labels[i]+'.</b> '+q.o[i];
    btn.className='opt-btn';btn.disabled=false;
    btn.onclick=(function(idx,ans){return function(){answer(idx,ans);};})(i,q.a);
  });
}

function answer(sel,correct){
  if(gameOver)return;
  var btns=document.querySelectorAll('.opt-btn');
  btns.forEach(function(b){b.disabled=true;});
  var ok=(sel===correct);
  btns[sel].classList.add(ok?'correct':'wrong');
  if(!ok)btns[correct].classList.add('correct');
  var fb=document.getElementById('feedback');
  if(ok){
    fb.textContent='Correct! Cat moves forward!';fb.className='ok';
    catPos=Math.min(catPos+1,TRACK_LEN-1);
    scoreVal+=10;correctVal++;
  }else{
    fb.textContent='Wrong! The mouse dashes ahead!';fb.className='bad';
    catPos=Math.max(catPos-1,0);
    mousePos=Math.min(mousePos+1,TRACK_LEN-1);
    wrongVal++;
  }
  qIdx++;render();
  if(catPos>=mousePos){setTimeout(function(){end(true);},700);return;}
  if(mousePos>=TRACK_LEN-1){setTimeout(function(){end(false);},700);return;}
  setTimeout(showQ,950);
}

function end(won){
  gameOver=true;
  document.getElementById('ov-emoji').innerHTML=won?'&#127881;&#128049;':'&#128045;&#128168;';
  document.getElementById('ov-title').textContent=won?'You caught the mouse!':'The mouse escaped!';
  document.getElementById('ov-msg').innerHTML=won
    ?'Amazing! You answered <strong>'+correctVal+'</strong> correctly and scored <strong>'+scoreVal+'</strong> points!'
    :'So close! You scored <strong>'+scoreVal+'</strong> points. Give it another go!';
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('play-again').addEventListener('click',initGame);
initGame();
</script>
</body>
</html>
