<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Paper 1 Spark | Combined Science Chemistry</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Combined Science — Paper 1 (Topics 1–5)</h1>
  <span class="tier-badge spark">Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Topics 1–5</span>
    <span>Spark: Recall</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"Which statement correctly defines isotopes?","A":"Atoms of different elements with the same mass number","B":"Atoms of the same element with different numbers of neutrons","C":"Atoms with the same number of neutrons but different numbers of protons","D":"Ions of the same element with different charges","correct":"B","explain":"Isotopes are atoms of the same element (same number of protons) with different numbers of neutrons, giving them different mass numbers. For example, carbon-12 and carbon-14 both have 6 protons but 6 and 8 neutrons respectively. Watch out: most students give only one half — both 'same element' AND 'different number of neutrons' are needed for the mark."},
{"stem":"What does the term 'period' mean when referring to the periodic table?","A":"A vertical column of elements with similar chemical properties","B":"A horizontal row of elements in order of increasing atomic number","C":"A group of elements that all react with water","D":"A diagonal sequence of transition metals","correct":"B","explain":"A period is a horizontal row. Elements in the same period have the same number of electron shells. A vertical column is called a group. Common error: confusing period (horizontal) with group (vertical) — one of the most penalised Topic 1 errors in examiner reports."},
{"stem":"What is the relative charge of a neutron?","A":"+1","B":"−1","C":"0","D":"+2","correct":"C","explain":"Neutrons carry no electrical charge — relative charge = 0. Only protons (+1) and electrons (−1) carry charge. Neutrons contribute to the mass number but not the atomic number. Common errors: confusing neutrons with protons (+1) or electrons (−1)."},
{"stem":"What is ionic bonding?","A":"The sharing of a pair of electrons between two non-metal atoms","B":"Weak forces of attraction between neutral molecules","C":"The electrostatic attraction between oppositely charged ions","D":"A sea of delocalised electrons surrounding positive metal ions","correct":"C","explain":"Ionic bonding forms when a metal transfers electrons to a non-metal, forming oppositely charged ions. The electrostatic attraction between these ions throughout the lattice is the ionic bond. Common error: choosing A (covalent bonding). 'Sharing' always signals covalent bonding — ionic bonding involves electron transfer, not sharing."},
{"stem":"Why does sodium chloride conduct electricity when dissolved in water but not when solid?","A":"Solid sodium chloride has no charged particles at all","B":"The ions in the solid lattice are fixed in place and cannot move","C":"Sodium chloride dissolves and breaks into atoms that carry charge","D":"The electrons are released when it dissolves","correct":"B","explain":"Conduction requires charged particles that can move. In solid NaCl, ions are held in a fixed giant ionic lattice and cannot move. When dissolved, the ions are released and free to move, allowing conduction. Write 'ions free to move' — not 'free ions.' Common error: choosing A — solid NaCl does contain charged particles (Na⁺ and Cl⁻); they just cannot move."},
{"stem":"Why does carbon dioxide (CO₂) have a low boiling point despite having strong covalent bonds?","A":"The covalent bonds in CO₂ are actually weak and easily broken","B":"CO₂ molecules are very small so they heat up quickly","C":"Only weak intermolecular forces act between CO₂ molecules — the covalent bonds are not broken on boiling","D":"CO₂ is a gas because its atoms share no electrons","correct":"C","explain":"CO₂ is a simple molecular substance. On boiling, only the weak forces between CO₂ molecules (intermolecular forces) are overcome — the covalent bonds within each molecule are not broken. Common error: saying 'covalent bonds are broken when CO₂ boils.' This is one of the most common bonding misconceptions and is explicitly penalised in mark schemes."},
{"stem":"A student needs to convert 250 cm³ to dm³. What is the correct answer?","A":"25 dm³","B":"2.5 dm³","C":"0.25 dm³","D":"0.025 dm³","correct":"C","explain":"To convert cm³ to dm³, divide by 1000. 250 ÷ 1000 = 0.25 dm³. This is the single most commonly penalised step on Paper 1 quantitative questions. Common errors: multiplying by 1000 instead of dividing, or dividing by 100 to get 2.5 dm³."},
{"stem":"Calculate the relative formula mass (Mr) of calcium carbonate, CaCO₃. (Ca = 40, C = 12, O = 16)","A":"68","B":"84","C":"100","D":"116","correct":"C","explain":"Mr(CaCO₃) = 40 + 12 + (3 × 16) = 40 + 12 + 48 = 100. The subscript 3 in CO₃ multiplies the oxygen mass by 3. Common error: calculating 40 + 12 + 16 = 68 — treating the subscript as irrelevant and counting only one oxygen atom. This is the most flagged Mr error in examiner reports."},
{"stem":"A reaction takes place in an open flask and the total mass decreases during the reaction. What is the most likely explanation?","A":"The reaction destroyed some atoms, so mass was lost","B":"Water evaporated from the flask during heating","C":"A gas was produced by the reaction and escaped from the open flask","D":"The balance gave an incorrect reading","correct":"C","explain":"The law of conservation of mass states atoms are not created or destroyed. If mass decreases in an open flask, a gas produced by the reaction must have escaped. Common error: writing 'evaporation' (option B) — specifically penalised. The substance leaving the flask is produced by the reaction, not evaporated from a liquid. Examiner report (June 2019): 'extremely few candidates understood how the law of conservation of mass applies.'"},
{"stem":"What is the correct formula for ammonia?","A":"NH₂","B":"NH₃","C":"NH₄","D":"N₂H₄","correct":"B","explain":"Ammonia has the formula NH₃ — one nitrogen atom bonded to three hydrogen atoms. This formula appears in Haber Process questions on Paper 1. Common errors: NH₄ (confusing ammonia with the ammonium ion NH₄⁺, which has four hydrogens and a positive charge) or NH₂ (one hydrogen short)."},
{"stem":"A glowing (not burning) splint is held at the mouth of a test tube of gas. The splint relights. Which gas is present?","A":"Hydrogen","B":"Carbon dioxide","C":"Oxygen","D":"Chlorine","correct":"C","explain":"Oxygen relights a glowing splint. For hydrogen: hold a lit (burning) splint at the tube mouth — a squeaky pop confirms hydrogen. Examiner report (November 2020): 'candidates stated that a glowing splint would be used rather than a lit splint. In these cases, no marks were awarded.' All four gas tests: hydrogen → lit splint, squeaky pop; oxygen → glowing splint, relights; CO₂ → limewater, turns milky; chlorine → damp blue litmus, bleached."},
{"stem":"An acid reacts with an alkali to produce a salt and water and the pH changes to 7. What is the name of this type of reaction?","A":"Decomposition","B":"Precipitation","C":"Oxidation","D":"Neutralisation","correct":"D","explain":"When an acid reacts with an alkali, the reaction is called neutralisation. Common error: correctly describing the process (acid + alkali → salt + water, pH = 7) but not naming it 'neutralisation' — a consistently missed one-mark point across multiple past paper sittings."},
{"stem":"What is meant by the term 'activation energy'?","A":"The total energy released when bonds form in the products","B":"The minimum energy that colliding particles must have for a reaction to occur","C":"The difference in energy between products and reactants","D":"The energy stored in the chemical bonds of the reactants","correct":"B","explain":"Activation energy (Eₐ) is the minimum energy that colliding particles must have for a reaction to occur. On a reaction profile it is the gap from the reactant energy level up to the peak (transition state). Common errors: confusing Eₐ with the overall energy change ΔH (option C), or omitting the word 'minimum' from the definition."},
{"stem":"Which statement about bond breaking is correct?","A":"Bond breaking releases energy — it is an exothermic process","B":"Bond breaking requires energy — it is an endothermic process","C":"Bond breaking is neither endothermic nor exothermic","D":"Bond breaking only occurs in exothermic reactions","correct":"B","explain":"Breaking chemical bonds always requires energy — it is endothermic. Making new bonds always releases energy — it is exothermic. If energy released making bonds exceeds energy used breaking bonds, the reaction is exothermic overall. Common error: reversing the pair and choosing A. Students who have bond breaking and making reversed will get every bond energy calculation wrong."},
{"stem":"A catalyst is added to a chemical reaction. What effect does it have on the activation energy?","A":"It increases the activation energy so more particles can react","B":"It has no effect on the activation energy — it only increases particle speed","C":"It lowers the activation energy by providing an alternative reaction pathway","D":"It removes the activation energy entirely","correct":"C","explain":"A catalyst works by providing an alternative reaction pathway with a lower activation energy. A greater proportion of particles already have enough energy to react, increasing the rate. Common error: writing only 'a catalyst speeds up the reaction.' The examiner reports consistently note this is insufficient — activation energy must be mentioned to score explanation marks."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'— Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'% &mdash; '+
    (pct>=80?'Excellent recall!':pct>=60?'Good — review the questions you missed.':'Keep practising — revisit the explanations below.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
