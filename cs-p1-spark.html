<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Paper 1 Spark | Combined Science Chemistry</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Combined Science: Paper 1 (Topics 1&ndash;5)</h1>
  <span class="tier-badge spark">Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Topics 1&ndash;5</span>
    <span>Spark: Recall</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"Which statement correctly defines isotopes?","A":"Atoms of different elements with the same mass number","B":"Atoms of the same element with different numbers of neutrons","C":"Atoms with the same number of neutrons but different numbers of protons","D":"Ions of the same element with different charges","correct":"B","explain":"The definition of an isotope has two parts and you need both to score the mark. Part 1: isotopes are atoms of the same element, meaning they have the same number of protons. It is the number of protons that determines which element an atom is. Part 2: they have different numbers of neutrons, which gives them different mass numbers. For example, carbon-12 and carbon-14 are both carbon because they both have 6 protons. Carbon-12 has 6 neutrons, giving a mass number of 6 + 6 = 12. Carbon-14 has 8 neutrons, giving a mass number of 6 + 8 = 14. A very common answer that scores zero: 'atoms with different numbers of neutrons.' This earns nothing because it leaves out 'same element.' Both parts are required. Option D is a common trap: ions have different numbers of electrons (and therefore different charges), whereas isotopes are neutral atoms that differ only in their number of neutrons."},
{"stem":"What does the term 'period' mean when referring to the periodic table?","A":"A vertical column of elements with similar chemical properties","B":"A horizontal row of elements in order of increasing atomic number","C":"A group of elements that all react with water","D":"A diagonal sequence of transition metals","correct":"B","explain":"A period is a horizontal row. Elements in the same period have the same number of electron shells. For example, sodium (Na) is in Period 3, meaning its electrons are arranged across three shells. A vertical column is called a group. Sodium is in Group 1. Students frequently swap these under exam pressure. A helpful way to keep them straight: a group goes up and down like a column on a building; a period runs left to right like a line of text. If asked 'what period is sodium in?', the answer is Period 3, not Group 3."},
{"stem":"What is the relative charge of a neutron?","A":"+1","B":"&#8722;1","C":"0","D":"+2","correct":"C","explain":"The three subatomic particles and their relative charges are: proton = +1, neutron = 0, electron = -1. Neutrons contribute to the mass of an atom but carry no charge at all. This is why changing the neutron number (as in isotopes) does not affect how an atom reacts chemically. A neutral atom always has equal numbers of protons and electrons; neutrons play no part in that charge balance. A common error is choosing A (+1) by confusing neutrons with protons, or B (-1) by confusing them with electrons."},
{"stem":"What is ionic bonding?","A":"The sharing of a pair of electrons between two non-metal atoms","B":"Weak forces of attraction between neutral molecules","C":"The electrostatic attraction between oppositely charged ions","D":"A sea of delocalised electrons surrounding positive metal ions","correct":"C","explain":"Ionic bonding is the electrostatic attraction between oppositely charged ions arranged throughout a giant lattice. It forms when a metal transfers electrons to a non-metal. For example: sodium loses one electron to become Na+ and chlorine gains that electron to become Cl-. The attraction between all the Na+ and Cl- ions in the lattice is the ionic bond. The key word for ionic bonding is transfer. The key word for covalent bonding (option A) is sharing. If you write 'sharing' in an ionic bonding question you will score zero. Option D describes metallic bonding."},
{"stem":"Why does sodium chloride conduct electricity when dissolved in water but not when solid?","A":"Solid sodium chloride has no charged particles at all","B":"The ions in the solid lattice are fixed in place and cannot move","C":"Sodium chloride dissolves and breaks into atoms that carry charge","D":"The electrons are released when it dissolves","correct":"B","explain":"For electrical conduction to occur, charged particles must be free to move. In solid NaCl, Na+ and Cl- ions exist but are locked into fixed positions in the giant ionic lattice and cannot move. When NaCl dissolves in water, the lattice breaks apart and the ions become free to move through the solution, carrying charge. The mark scheme requires the phrase 'ions are free to move.' Writing 'free ions' alone is not accepted. Option A is wrong: solid NaCl does contain charged particles (Na+ and Cl-). The problem is that they cannot move, not that they do not exist."},
{"stem":"Why does carbon dioxide (CO₂) have a low boiling point despite having strong covalent bonds?","A":"The covalent bonds in CO₂ are actually weak and easily broken","B":"CO₂ molecules are very small so they heat up quickly","C":"Only weak intermolecular forces act between CO₂ molecules. The covalent bonds are not broken on boiling.","D":"CO₂ is a gas because its atoms share no electrons","correct":"C","explain":"CO₂ is a simple molecular substance. Each molecule contains one carbon and two oxygen atoms held together by strong covalent bonds. However, the forces between separate CO₂ molecules are weak intermolecular forces. When CO₂ boils, it is only these weak intermolecular forces that are overcome. The strong C=O covalent bonds inside each molecule are not broken at all. This is why CO₂ has a boiling point of around -78°C despite having strong bonds within the molecule. An answer that loses the mark every time: 'the covalent bonds in CO₂ are broken when it boils.' That is factually wrong and specifically penalised in the mark scheme."},
{"stem":"A student needs to convert 250 cm³ to dm³. What is the correct answer?","A":"25 dm³","B":"2.5 dm³","C":"0.25 dm³","D":"0.025 dm³","correct":"C","explain":"To convert cm³ to dm³, divide by 1000. So 250 ÷ 1000 = 0.25 dm³. The relationship to remember: 1 dm³ = 1000 cm³ = 1 litre. This conversion appears in almost every Paper 1 quantitative question. Using 250 directly in a concentration formula instead of 0.25 gives an answer 1000 times too small and loses all follow-through marks. A useful sense-check: a standard can of drink holds about 330 cm³, which is 0.33 dm³. If your answer after 'converting' is larger than the number you started with, you have multiplied instead of divided."},
{"stem":"Calculate the relative formula mass (Mr) of calcium carbonate, CaCO₃. (Ca = 40, C = 12, O = 16)","A":"68","B":"84","C":"100","D":"116","correct":"C","explain":"Mr(CaCO₃) = Ca + C + (3 × O) = 40 + 12 + (3 × 16) = 40 + 12 + 48 = 100. The subscript 3 after the O means there are three oxygen atoms, so the oxygen mass must be multiplied by 3. The most common wrong answer is 68, which comes from counting only one oxygen: 40 + 12 + 16 = 68. This error appears very frequently in examiner reports. Every subscript in a formula is a multiplier for the atom directly before it. CaCO₃ has the subscript 3 on the O, so oxygen contributes 3 × 16 = 48, not just 16."},
{"stem":"A reaction takes place in an open flask and the total mass decreases during the reaction. What is the most likely explanation?","A":"The reaction destroyed some atoms, so mass was lost","B":"Water evaporated from the flask during heating","C":"A gas was produced by the reaction and escaped from the open flask","D":"The balance gave an incorrect reading","correct":"C","explain":"The law of conservation of mass states that atoms are never created or destroyed in a chemical reaction. If the mass on a balance falls during a reaction in an open flask, a gas produced by the reaction has escaped into the air. For example, when marble chips (CaCO₃) react with hydrochloric acid, CO₂ gas is produced. In an open flask this CO₂ escapes, so the reading falls. In a sealed flask no mass would be lost. Writing 'evaporation' (option B) is specifically penalised because the substance leaving is a gas produced by the reaction, not a liquid turning to vapour. Option A contradicts the law of conservation of mass."},
{"stem":"What is the correct formula for ammonia?","A":"NH₂","B":"NH₃","C":"NH₄","D":"N₂H₄","correct":"B","explain":"Ammonia has the formula NH₃: one nitrogen atom bonded to three hydrogen atoms. This formula appears regularly in Haber Process questions on Paper 1. A reliable way to remember it: nitrogen is in Group 5 and needs 3 more electrons to complete its outer shell, so it forms 3 bonds with hydrogen. NH₄ (option C) is the ammonium ion (NH₄⁺), which has four hydrogens and a positive charge; it appears in fertilisers like ammonium nitrate. NH₃ and NH₄⁺ are completely different species, and confusing them is one of the most consistently flagged errors in examiner reports for the Haber Process topic."},
{"stem":"A glowing (not burning) splint is held at the mouth of a test tube of gas. The splint relights. Which gas is present?","A":"Hydrogen","B":"Carbon dioxide","C":"Oxygen","D":"Chlorine","correct":"C","explain":"Oxygen relights a glowing splint. All four gas tests must be learned as a matched set: hydrogen uses a lit (burning) splint and gives a squeaky pop; oxygen uses a glowing splint and relights it; carbon dioxide is bubbled through limewater and turns it cloudy; chlorine bleaches damp blue litmus paper to white. The November 2020 examiner report (1CH0/1F) stated: 'candidates stated that a glowing splint would be used rather than a lit splint. In these cases, no marks were awarded.' For hydrogen, the splint must be lit (alight with a flame) not just glowing. These are two different physical states of the same splint."},
{"stem":"An acid reacts with an alkali to produce a salt and water and the pH changes to 7. What is the name of this type of reaction?","A":"Decomposition","B":"Precipitation","C":"Oxidation","D":"Neutralisation","correct":"D","explain":"When an acid reacts with an alkali, the reaction is called neutralisation. Students regularly describe this process correctly but then fail to name it. For example, writing 'the acid and alkali react together and the pH goes to 7, producing a salt' perfectly describes neutralisation but scores zero if the question asks 'name this type of reaction.' The required answer is one word: neutralisation. Decomposition (option A) is when one substance breaks down into simpler ones; it involves only a single reactant."},
{"stem":"What is meant by the term 'activation energy'?","A":"The total energy released when bonds form in the products","B":"The minimum energy that colliding particles must have for a reaction to occur","C":"The difference in energy between products and reactants","D":"The energy stored in the chemical bonds of the reactants","correct":"B","explain":"Activation energy (Eₐ) is the minimum energy that colliding particles must have for a reaction to occur. On a reaction profile, Eₐ is the energy gap from the reactant energy level up to the peak of the curve (the transition state). Two words are critical in the definition: minimum and colliding particles. Writing 'the energy needed for the reaction' is incomplete and may not score. Option C describes the overall energy change (ΔH), which is the difference between reactant and product energy levels. Eₐ and ΔH are two different quantities shown on the same diagram."},
{"stem":"Which statement about bond breaking is correct?","A":"Bond breaking releases energy and is an exothermic process","B":"Bond breaking requires energy and is an endothermic process","C":"Bond breaking is neither endothermic nor exothermic","D":"Bond breaking only occurs in exothermic reactions","correct":"B","explain":"Bond breaking always requires energy input: it is endothermic. Bond making always releases energy: it is exothermic. A helpful way to remember this pair: you have to put energy IN to pull atoms apart (breaking bonds); energy comes OUT when atoms join together (making bonds). If the energy released making bonds is greater than the energy needed breaking bonds, the overall reaction is exothermic. Students who reverse this pair will get every bond energy calculation wrong. Option D is also incorrect: bond breaking occurs in all reactions, both exothermic and endothermic."},
{"stem":"A catalyst is added to a chemical reaction. What effect does it have on the activation energy?","A":"It increases the activation energy so more particles can react","B":"It has no effect on the activation energy and only increases particle speed","C":"It lowers the activation energy by providing an alternative reaction pathway","D":"It removes the activation energy entirely","correct":"C","explain":"A catalyst works by providing an alternative reaction pathway with a lower activation energy. Because the energy threshold is lower, a greater proportion of particles already have enough energy to react successfully, increasing the rate of reaction. To score full marks on a catalyst explanation question you need two things: (1) lower activation energy, and (2) alternative reaction pathway. Writing only 'a catalyst speeds up the reaction' earns at most one basic mark. Multiple examiner reports specifically flag this as an insufficient answer. Option B is wrong because particle speed depends on temperature, not on a catalyst."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent recall!':pct>=60?'Good. Review the questions you missed.':'Keep practising. Read the explanations below carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
