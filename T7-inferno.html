<style>:root{--pr:#7c3aed;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(124,58,237,.10);--sh2:0 6px 24px rgba(124,58,237,.18)}

/* ── quiz-page header ── */

.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}

.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}

.submit-btn{background:linear-gradient(135deg,#2e1065,#4c1d95 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

<script>
const QUESTIONS=[{"stem":"The activation energy of reaction X is 45 kJ/mol. A catalyst reduces this to 30 kJ/mol. Explain, using collision theory, why this increases the rate of reaction.","A":"With the catalyst, more particles have kinetic energy ≥ 30 kJ/mol than had ≥ 45 kJ/mol, so a greater proportion of collisions are successful, increasing the rate","B":"The catalyst provides more particles, increasing the frequency of collisions","C":"The catalyst raises the temperature, giving more particles energy above 45 kJ/mol","D":"The catalyst reduces the number of bonds to break, making each collision more likely to succeed","correct":"A","explain":"At any given temperature, particles have a distribution of kinetic energies. More particles have energy ≥ 30 kJ/mol than have energy ≥ 45 kJ/mol. By lowering the energy threshold, the catalyst increases the proportion of collisions that are successful, without changing the speed of the particles (temperature) or their number (concentration). This is the mechanism by which all catalysts work."},{"stem":"Calculate the mean rate of reaction for the following data: a student collects gas during a reaction and reads 0 cm³ at 0s, and 56 cm³ at 120s. The rate should be given in cm³/s.","A":"120 cm³/s","B":"0.47 cm³/s","C":"6720 cm³/s","D":"2.14 cm³/s","correct":"B","explain":"Mean rate = (56 − 0) cm³ ÷ (120 − 0) s = 56 ÷ 120 = 0.467 cm³/s ≈ 0.47 cm³/s (2 significant figures). Always include the unit, the common error is forgetting /s. Writing 56/120 upside down (120/56 = 2.14) is the most likely arithmetic mistake."},{"stem":"Using the bond energies given (H–H = 436, O=O = 498, O–H = 463 kJ/mol), calculate ΔH for the reaction 2H₂ + O₂ → 2H₂O, and state whether the reaction is exo- or endothermic.","A":"+484 kJ/mol, endothermic","B":"−484 kJ/mol, exothermic","C":"+1852 kJ/mol, endothermic","D":"−246 kJ/mol, exothermic","correct":"B","explain":"Bonds broken: 2 × H–H (2 × 436 = 872) + 1 × O=O (498) = 1370 kJ/mol. Bonds made: 2 × H₂O has 4 × O–H (4 × 463 = 1852) kJ/mol. ΔH = 1370 − 1852 = −482 kJ/mol (≈ −484 kJ/mol depending on rounding). Negative = exothermic. Hydrogen burning in oxygen is a very exothermic reaction, used in rocket fuel."},{"stem":"A student compares two experiments: both use 2 g of calcium carbonate in excess HCl. Experiment 1 uses lumps; Experiment 2 uses powder. Describe the shape of both rate graphs and explain the differences.","A":"Experiment 2 reaches a higher plateau faster, because more surface area means more product is formed","B":"Both reach the same plateau; Experiment 2's curve is steeper because powder has greater surface area, increasing collision frequency","C":"Experiment 1 reaches a higher plateau because lumps react more completely","D":"Both curves are identical because the same mass of CaCO₃ is used","correct":"B","explain":"Same mass of CaCO₃ = same moles = same amount of CO₂ that can be produced → same plateau. Powder has greater surface area → more CaCO₃ particles exposed to HCl → more frequent collisions between acid and solid → faster rate → steeper curve. The key principle: surface area changes rate, not yield."},{"stem":"A reaction gives ΔH = +120 kJ/mol. On a reaction profile diagram, what would the relative positions of reactants and products be, and what would the Eₐ arrow represent?","A":"Products lower than reactants; Eₐ arrow from reactants to peak (exothermic)","B":"Products higher than reactants; Eₐ arrow from reactants to peak (endothermic)","C":"Products at the same level as reactants; Eₐ arrow at the peak","D":"Products higher than reactants; Eₐ arrow from peak to products","correct":"B","explain":"Positive ΔH = endothermic = energy taken in from surroundings → products have MORE energy than reactants → products sit HIGHER on the energy axis. The activation energy arrow is always from the reactant level to the peak of the hump (never from peak to products). ΔH is the gap between reactants and products (not involving the peak at all)."},{"stem":"A student measures the rate of the sodium thiosulfate reaction at five temperatures (20, 30, 40, 50, 60°C) and records the times: 100s, 50s, 25s, 13s, 6s. What conclusion can be drawn about the effect of temperature on rate?","A":"The rate decreases by half for every 10°C rise in temperature","B":"The rate roughly doubles for every 10°C rise in temperature","C":"The rate increases by a fixed amount (6 s⁻¹) for every 10°C rise","D":"The rate is inversely proportional to temperature in °C","correct":"B","explain":"Rate ∝ 1/time. As temperature increases by 10°C each time, the time roughly halves (100→50→25→13→6s), meaning the rate roughly doubles. This is a well-known rule of thumb: many chemical reactions approximately double in rate for every 10°C temperature increase. This is due to the increased proportion of particles with energy ≥ Eₐ at higher temperatures."},{"stem":"Consider the combustion of methane: CH₄ + 2O₂ → CO₂ + 2H₂O. Bond energies: C–H = 412, O=O = 498, C=O = 805, O–H = 463 kJ/mol. Calculate ΔH.","A":"−820 kJ/mol","B":"+820 kJ/mol","C":"−2644 kJ/mol","D":"+3464 kJ/mol","correct":"A","explain":"Bonds broken: 4 × C–H (4 × 412 = 1648) + 2 × O=O (2 × 498 = 996) = 2644 kJ/mol. Bonds made: 2 × C=O in CO₂ (2 × 805 = 1610) + 4 × O–H in 2H₂O (4 × 463 = 1852) = 3462 kJ/mol. ΔH = 2644 − 3462 = −818 kJ/mol ≈ −820 kJ/mol. The combustion of methane is strongly exothermic, consistent with its use as a fuel."},{"stem":"A student argues: \"Increasing the concentration of acid is the same as increasing the temperature, both make the reaction faster by increasing the energy of the particles.\" Evaluate this statement.","A":"Correct, both concentration and temperature work by the same mechanism","B":"Incorrect, concentration increases frequency of collisions only; temperature increases both frequency AND energy of collisions","C":"Incorrect, concentration lowers the activation energy, while temperature just speeds particles up","D":"Correct, but only if both the acid and the other reactant are in solution","correct":"B","explain":"This is the most commonly examined misconception in this topic. Increasing concentration means more particles in the same volume, increasing collision frequency, but the speed (kinetic energy) of each particle is unchanged. Temperature, uniquely, raises the average kinetic energy of particles, increasing both the frequency of collisions AND the proportion that have energy ≥ Eₐ. Calling concentration an \"energy\" effect would lose marks in an exam."},{"stem":"In an endothermic reaction, which of the following correctly describes what happens to bond energies during the reaction?","A":"More energy is released making bonds in the products than was absorbed breaking bonds in the reactants","B":"The energy absorbed breaking bonds in the reactants is greater than the energy released making bonds in the products","C":"Bond breaking and bond making release equal amounts of energy","D":"No bonds are broken, the atoms just rearrange positions without breaking apart","correct":"B","explain":"Endothermic means energy is taken in overall. Bond breaking absorbs energy (endothermic step); bond making releases energy (exothermic step). For the overall reaction to be endothermic, the energy absorbed in bond breaking must exceed the energy released in bond making, so ΔH = energy in − energy out is positive."},{"stem":"A student conducts a rate experiment and draws a tangent to the curve at t = 30 s. The tangent passes through (10s, 12 cm³) and (50s, 32 cm³). Calculate the instantaneous rate of reaction at 30 s.","A":"0.5 cm³/s","B":"2.0 cm³/s","C":"1.0 cm³/s","D":"20 cm³/s","correct":"A","explain":"Rate = gradient of tangent = Δy/Δx = (32 − 12) cm³ ÷ (50 − 10) s = 20 ÷ 40 = 0.5 cm³/s. The tangent must be read at points on the tangent line itself (not on the curve). Choosing widely-spaced points (40 s apart here) reduces reading errors. Units = cm³/s from the axes."},{"stem":"Explain, using collision theory, why a reaction slows down over time even if no other conditions change.","A":"The temperature of the reaction decreases as reactants are used up","B":"As reactants are used up, their concentration falls, reducing collision frequency and therefore the rate of successful collisions","C":"The catalyst becomes contaminated with products and stops working","D":"The activation energy increases as the reaction proceeds","correct":"B","explain":"As the reaction proceeds, reactant particles are converted into products. The concentration of reactants falls. With fewer reactant particles per unit volume, collisions between reactant particles happen less frequently. Fewer collisions per second means fewer successful collisions per second, so the rate falls. This is why rate curves start steep and become increasingly gradual, it's not temperature change or catalyst poisoning, it's the self-limiting effect of reactant consumption."},{"stem":"A student notices that a 1 cm cube of marble reacts with acid, and calculates its SA:V ratio. She then cuts it into 8 equal cubes. What is the new SA:V ratio, and what effect does this have on rate?","A":"SA:V doubles to 12 cm⁻¹; rate increases due to more frequent collisions","B":"SA:V halves to 3 cm⁻¹; rate decreases","C":"SA:V stays the same at 6 cm⁻¹; rate is unchanged","D":"SA:V triples to 18 cm⁻¹; rate doubles","correct":"A","explain":"Original 1 cm cube: SA = 6 × 1² = 6 cm², V = 1 cm³, SA:V = 6 cm⁻¹. Each small cube has side = 0.5 cm: SA = 6 × 0.25 = 1.5 cm²; 8 cubes → total SA = 12 cm²; V unchanged at 1 cm³; SA:V = 12 cm⁻¹. Doubling the SA:V ratio means twice as many marble particles are exposed to acid at any moment, so collision frequency doubles and the rate increases."},{"stem":"The ΔH for a reaction is −250 kJ/mol with no catalyst, and −250 kJ/mol with a catalyst. The activation energy without a catalyst is 180 kJ/mol and with a catalyst is 120 kJ/mol. On a reaction profile, what two things are the same for both reactions?","A":"The activation energy and the peak height","B":"The energy of the reactants, the energy of the products, and the overall ΔH","C":"The time taken to complete the reaction and the temperature","D":"The activation energy and the time to complete the reaction","correct":"B","explain":"A catalyst lowers the activation energy (from 180 to 120 kJ/mol, changing the peak height). It does NOT change the energy of the reactants, the energy of the products, or the overall ΔH (−250 kJ/mol in both cases). The difference between product and reactant energy levels is unchanged. On the reaction profile, both curves start and end at exactly the same energy levels, only the hump height differs."},{"stem":"A student increases the temperature from 20°C to 30°C and the rate roughly doubles. She then increases it to 40°C. Predict the rate at 40°C if the original rate at 20°C was 0.5 cm³/s.","A":"1.0 cm³/s","B":"1.5 cm³/s","C":"2.0 cm³/s","D":"4.0 cm³/s","correct":"C","explain":"Rate at 20°C = 0.5 cm³/s. Rate at 30°C = 0.5 × 2 = 1.0 cm³/s (doubles per 10°C). Rate at 40°C = 1.0 × 2 = 2.0 cm³/s. This is the 'doubling per 10°C' rule of thumb for many reactions. Each additional 10°C roughly doubles the rate because a much larger proportion of particles now have energy ≥ Eₐ."},{"stem":"In the reaction N₂ + 3H₂ → 2NH₃, the iron catalyst in the Haber process is described as a 'heterogeneous catalyst'. What does this mean in practice, and how does it lower the activation energy?","A":"The catalyst is homogeneous, dissolved in the same phase as the reactants","B":"The iron is in a different phase (solid) from the reactants (gases); the reactants adsorb onto the iron surface, weakening their bonds and providing a lower-energy pathway","C":"The iron reacts with the nitrogen and hydrogen to form intermediates, then regenerates","D":"The iron lowers the activation energy by increasing the temperature of the reaction","correct":"B","explain":"A heterogeneous catalyst is in a different physical state to the reactants. In the Haber process, iron is a solid catalyst and the reactants (N₂ and H₂) are gases. The gas molecules adsorb onto the iron surface; this weakens their bonds (N≡N and H–H), reducing the energy needed to break them. The surface provides an alternative pathway with lower activation energy. The iron is regenerated continuously and is not consumed."},{"stem":"A student misreads an exam question and claims that for an exothermic reaction, \"the surroundings cool down because energy flows from surroundings into the reaction.\" Identify the error and correct it.","A":"The student is correct, exothermic means energy flows from surroundings into the reaction","B":"The student has confused exothermic with endothermic; in an exothermic reaction, energy flows from the reaction to the surroundings, warming them up","C":"The student is partially correct, energy flows both ways in exothermic reactions","D":"The student is correct that surroundings cool down, but wrong about the direction of energy flow","correct":"B","explain":"Exothermic = energy given OUT from the reaction to the surroundings. The surroundings warm up. Endothermic = energy taken IN by the reaction from the surroundings, the surroundings cool down. This misconception (thinking a temperature rise means energy is going IN) was explicitly highlighted in the 2019 Foundation examiner report as the most commonly seen error in this topic."},{"stem":"A student claims that using a catalyst means a reaction can achieve a higher yield than without one. Evaluate this claim.","A":"Correct, a lower activation energy means more bonds can break, producing more product","B":"Incorrect, a catalyst speeds up the rate only; the yield is determined by the stoichiometry and the position of equilibrium, not by the activation energy","C":"Correct, catalysts shift the equilibrium position to produce more product","D":"Incorrect, catalysts always decrease the yield because they use up some reactant","correct":"B","explain":"A catalyst lowers the activation energy and speeds up the reaction, both the forward and reverse reactions in a reversible reaction are speeded up equally. Yield is determined by stoichiometry (mole ratios) and, for reversible reactions, the position of equilibrium (temperature, pressure, concentration). A catalyst does not change where the equilibrium lies, it only reaches it faster. The claim that \"more product is made\" is incorrect."},{"stem":"Using bond energies, explain why the reaction N₂ + 3H₂ → 2NH₃ requires very high temperatures to proceed without a catalyst, even though it is exothermic overall.","A":"Because the reaction is endothermic overall and needs continuous heat input","B":"Because the N≡N triple bond has a very high bond energy (945 kJ/mol) so a very high activation energy is needed to break it, high temperature is needed to give enough particles sufficient energy","C":"Because NH₃ is unstable at room temperature and decomposes immediately","D":"Because high temperature increases the yield of ammonia","correct":"B","explain":"Despite the overall reaction being exothermic (ΔH negative), the activation energy is very high because the N≡N triple bond (945 kJ/mol) is extremely strong. Most N₂ molecules at room temperature do not have enough kinetic energy to react. High temperature gives more N₂ molecules energy ≥ Eₐ. The iron catalyst in the Haber process provides an alternative pathway with a lower Eₐ, allowing the reaction at the lower (but still elevated) temperature of 450°C."},{"stem":"For the reaction CH₄ + 2O₂ → CO₂ + 2H₂O, a student calculates ΔH = −818 kJ/mol. She then tries to use this to find how much energy is released burning 2 moles of methane. What is the energy released?","A":"−818 kJ","B":"−409 kJ","C":"−1636 kJ","D":"+818 kJ","correct":"C","explain":"ΔH = −818 kJ/mol means 818 kJ is released per mole of CH₄. For 2 moles: energy released = 2 × 818 = 1636 kJ. The answer is still negative (exothermic), so −1636 kJ. This tests the ability to scale bond energy calculations, the mole ratio multiplies the per-mole ΔH directly."},{"stem":"A student draws a reaction profile for an endothermic reaction and labels the activation energy as the gap between the reactants and the products. Why is this incorrect, and what should they label instead?","A":"It is correct, activation energy is always the gap between reactants and products","B":"It is incorrect, the activation energy is the gap from the reactant energy level to the PEAK of the curve, not to the products","C":"It is incorrect, activation energy only appears on exothermic profiles","D":"It is incorrect, activation energy should be labelled as the gap from the peak to the products","correct":"B","explain":"The activation energy is the minimum energy particles must have to react, this is represented on a reaction profile as the energy from the reactant level up to the top of the hump (the transition state). The gap from reactants to products is the overall energy change (ΔH), not Eₐ. For an endothermic reaction, ΔH is positive (products higher than reactants), but Eₐ is even larger, the hump sits above the product level. The two labels (Eₐ and ΔH) represent completely different things and must never be confused."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
