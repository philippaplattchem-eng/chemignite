<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}

.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}

.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

<body>
<header class="site-header">

</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame: Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>

  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Explain why rotation about a C=C double bond is restricted, while rotation about a C–C single bond is essentially free at room temperature.","A":"The C=C bond has a higher bond enthalpy than C–C, making it harder to twist","B":"Rotation about C=C would require breaking the π-bond (~272 kJ mol⁻¹ of energy), because the sideways p-orbital overlap that forms the π-bond is destroyed if the orbitals are twisted out of alignment; C–C σ-bonds are axially symmetric, so rotation does not break the overlap","C":"The two carbons of a C=C bond are held rigid by the strong σ-bond, which prevents rotation","D":"C=C bonds are shorter than C–C bonds, so molecular crowding restricts rotation","correct":"B","explain":"The π-bond is formed by the sideways (lateral) overlap of p-orbitals, one from each carbon, oriented perpendicular to the C–C internuclear axis. Maximum overlap requires the two orbitals to be parallel. Rotating one carbon by 90° relative to the other would make the orbitals perpendicular to each other: their overlap drops to zero, meaning the π-bond would cease to exist. Because breaking the π-bond requires about 272 kJ mol⁻¹, rotation is effectively impossible at room temperature. In an alkane, the σ-bond is axially symmetric (looks circular viewed end-on along the bond axis): rotating about a σ-bond does not change the orbital overlap at all, so there is no barrier."},{"stem":"What is the major product when HBr reacts with propene (CH₃CH=CH₂) at room temperature?","A":"1-bromopropane (CH₃CH₂CH₂Br)","B":"2-bromopropane (CH₃CHBrCH₃)","C":"1,2-dibromopropane (CH₃CHBrCH₂Br)","D":"An equal mixture of 1-bromopropane and 2-bromopropane","correct":"B","explain":"When HBr adds to propene, the H⁺ can add to either C1 or C2 of the C=C. H⁺ adding to C1 (the =CH₂ end, which has 2H) leaves the positive charge on C2: the intermediate is CH₃CH⁺CH₃, a secondary (2°) carbocation. H⁺ adding to C2 (the =CH– end, which has 1H) leaves the positive charge on C1: the intermediate is CH₃CH₂CH₂⁺, a primary (1°) carbocation. The secondary carbocation is more stable (two methyl groups donate electron density, stabilising the positive charge). The reaction therefore predominantly follows the route through the 2° carbocation, giving 2-bromopropane as the major product."},{"stem":"A student writes a curly arrow in an electrophilic addition mechanism starting from an atom rather than from the C=C bond. Which statement best explains this error?","A":"The arrow is pointing in the wrong direction","B":"Curly arrows must start from electrons (a bond or a lone pair), not from an atom symbol. Starting from an atom implies the atom is moving; in electron-pair mechanisms, only electrons move. The π electrons reside across both carbons of the C=C, so the arrow must start on the bond itself","C":"The arrow should be single-headed, not double-headed","D":"Curly arrows cannot start from a C=C bond; they must start from a lone pair","correct":"B","explain":"The OCR H432/02 June 2022 examiner report states: \"1st curly arrow must start from, OR be traced back to any point across width of C=C.\" The π electrons are shared between the two carbons; they are not localised on either one. Starting the arrow on one carbon atom implies only that carbon's electrons move, which misrepresents the chemistry. A correct arrow starts from the middle of the C=C bond line (or anywhere along its width) and points to the electrophile (the δ+ H of HBr). Option D is wrong: in the second step of the mechanism, the curly arrow does start from a lone pair (on Br⁻), so both starting points are used in the same mechanism."},{"stem":"Propene (CH₂=CHCH₃) does not show E/Z isomerism. Which explanation is correct?","A":"Both carbons of the C=C carry two different groups, but the groups are too similar for E/Z to be meaningful","B":"The left carbon of the C=C (C1, which is =CH₂) carries two identical H atoms, so the two spatial arrangements are indistinguishable; E/Z isomerism requires both carbons of the C=C to carry two different groups","C":"Propene is too small a molecule to show stereoisomerism; stereoisomers only arise for molecules with five or more carbons","D":"The methyl group rotates freely, preventing the two arrangements from remaining distinct","correct":"B","explain":"E/Z isomerism requires two different groups on each carbon of the C=C. In propene, C1 (the terminal =CH₂) has two identical substituents: H and H. Even if you imagine flipping the arrangement so these two H atoms swap sides, the result is the same molecule — there are not two distinct compounds. Only C2 has two different groups (H and CH₃), but that is insufficient: both carbons must simultaneously have two different groups. Contrast with but-2-ene (CH₃CH=CHCH₃), where both C2 and C3 each carry H and CH₃."},{"stem":"In CIP priority rules for E/Z naming, what property is used to rank the two groups on each carbon of the C=C?","A":"Molecular mass of each group","B":"Size (number of atoms) in each group","C":"Atomic number of the atoms directly attached to the C of the C=C, proceeding outward along each branch if tied","D":"Alphabetical order of the group names","correct":"C","explain":"The Cahn–Ingold–Prelog (CIP) system ranks substituents by atomic number. At each carbon of the C=C, compare the atoms directly attached: higher atomic number = higher priority. Br (Z=35) > Cl (Z=17) > O (Z=8) > N (Z=7) > C (Z=6) > H (Z=1). If two groups begin with the same atom (both start with C, for example), proceed outward one step at a time and compare the next atoms. For example, –CH₂CH₃ vs –CH₃: both start with C, but one step out –CH₂CH₃ has (C, H, H) and –CH₃ has (H, H, H); C > H so –CH₂CH₃ wins. Once priorities at both carbons are assigned, Z = same side, E = opposite sides (of the higher-priority groups)."},{"stem":"Which statement correctly explains why alkenes are more reactive than alkanes?","A":"Alkenes have more hydrogen atoms, which makes them more reactive","B":"Alkenes have a C=C π-bond that is both weaker (~272 kJ mol⁻¹) than a C–C σ-bond and exposes electron density above and below the plane of the molecule, making it accessible to electrophilic attack","C":"Alkenes are more reactive because they are unsaturated and cannot form hydrogen bonds","D":"Alkenes have more electrons than alkanes of the same chain length, giving stronger intermolecular forces that promote reaction","correct":"B","explain":"Two features of the π-bond make alkenes reactive. (1) Weaker bond: the sideways p-orbital overlap of a π-bond (~272 kJ mol⁻¹) is less effective than head-on σ-bond overlap (~348 kJ mol⁻¹ for C–C). Less energy is needed to break it. (2) Exposed electrons: the π-electron density sits above and below the C=C plane, projecting outward from the molecule. This \"cloud\" of accessible electrons attracts electrophiles (electron-pair acceptors). Alkanes have only C–C and C–H σ-bonds, which are stronger, low in polarity, and do not project accessible electron density — hence they are far less reactive."},{"stem":"Which of the following correctly describes the repeat unit of poly(propene)?","A":"–[CH₂–CH₂]ₙ– (a methylene repeat unit with no substituents)","B":"–[CH₂–CH(CH₃)]ₙ–, with a methyl group on every second backbone carbon","C":"–[CH(CH₃)–CH(CH₃)]ₙ–, with a methyl group on both backbone carbons","D":"–[CH₃–CH=CH]ₙ–, retaining the double bond in the polymer","correct":"B","explain":"Monomer = propene CH₂=CH(CH₃). In polymerisation, the C=C π-bond breaks; each monomer contributes its two C atoms to the backbone. The first carbon (from =CH₂) has no substituents other than two H atoms; the second carbon (from =CH–) retains its methyl group. The substituents do not migrate: the methyl group stays on the same carbon in the polymer as it was in the monomer. Option A describes poly(ethene), not poly(propene). Option C wrongly puts a methyl on both backbone carbons (that would come from 2-methylpropene, not propene). Option D is wrong because the π-bond breaks — the polymer backbone is fully saturated."},{"stem":"What toxic gas is released when PVC (poly(chloroethene)) is combusted, and how is it removed from flue gases industrially?","A":"Cl₂ gas; removed by water scrubbers","B":"HCl gas; neutralised by Ca(OH)₂ (lime) scrubbers: Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O","C":"SO₂ gas; removed by addition of Na₂CO₃ solution","D":"Phosgene (COCl₂); removed by activated charcoal filters","correct":"B","explain":"PVC has the repeat unit –[CH₂–CHCl]ₙ–: every second backbone carbon carries a C–Cl bond. When PVC is burned, the C–Cl bonds are oxidised; the chlorine leaves as HCl gas (hydrogen chloride). HCl is toxic, corrosive, and a precursor to acid rain. To prevent this from entering the atmosphere, flue gases pass through scrubbers containing calcium hydroxide (lime). The reaction Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O neutralises the HCl, producing harmless calcium chloride and water. This treatment is a sustainability benefit of controlled incineration over uncontrolled landfill combustion."},{"stem":"Which of the following best explains why benzene does not decolourise bromine water at room temperature, even though it is classified as unsaturated?","A":"Benzene is saturated — it contains only C–C single bonds","B":"Benzene has a delocalised π-electron system that is more stable than a simple C=C; the energy gain from decolourisation (electrophilic addition) is not enough to disrupt the delocalisation, so benzene undergoes electrophilic substitution instead of addition","C":"Bromine water is too dilute to react with benzene","D":"Benzene is too large a molecule to dissolve in the aqueous bromine solution","correct":"B","explain":"Benzene's six π electrons are delocalised around the entire ring, giving it unusually low energy (extra stability). If benzene underwent addition with Br₂ (like an ordinary alkene), it would disrupt the delocalised system and form a product with localised bonds — a higher-energy, less stable arrangement. The energy \"cost\" of disrupting delocalisation outweighs the energy gained from forming two new C–Br bonds. Benzene therefore prefers electrophilic substitution (which restores the aromatic ring in the product) over addition. This is why bromine water remains orange-brown when shaken with benzene: no addition reaction occurs. Alkenes, which have no such delocalisation, readily undergo addition."},{"stem":"Which of the following statements about the conditions for hydrogenation of an alkene is correct?","A":"The reaction requires UV light and a palladium catalyst at room temperature","B":"The reaction requires a Ni catalyst at approximately 150°C","C":"The reaction requires steam at 300°C and 60 atm with a H₃PO₄ catalyst","D":"The reaction requires concentrated H₂SO₄ at room temperature, no catalyst needed","correct":"B","explain":"Hydrogenation of an alkene (C=C + H₂ → C–C) uses a nickel (Ni) catalyst at approximately 150°C (some sources quote 140–180°C). The Ni acts as a heterogeneous catalyst: H₂ and the alkene both adsorb onto the Ni surface, the H–H bond is weakened, and hydrogen atoms transfer to the C=C. Without the catalyst the H–H bond (436 kJ mol⁻¹) would not break at a useful rate even at 150°C. Option C describes hydration (alkene + steam → alcohol). Option A describes radical substitution conditions. UV light has no role in the hydrogenation mechanism."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
