<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}

.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}

.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>

<main>

<script>
const QUESTIONS=[{"stem":"Three C₆H₁₄ isomers and their boiling points are: n-hexane (69°C), 2-methylpentane (60°C), 2,2-dimethylbutane (50°C). Which explanation correctly accounts for the trend using OCR-accepted terminology and the required rank-order link?","A":"n-Hexane has the most electrons, giving strongest van der Waals forces; 2,2-dimethylbutane has the fewest electrons, giving weakest forces — hence the boiling point order","B":"n-Hexane is unbranched: greatest surface area of contact, strongest London forces, highest bp; 2-methylpentane has one branch: smaller surface area, weaker London forces, intermediate bp; 2,2-dimethylbutane is most branched: smallest surface area, weakest London forces, lowest bp","C":"2,2-dimethylbutane is most compact, so molecules are more densely packed and have stronger forces; n-hexane is loosely packed, giving weaker forces and higher bp","D":"n-Hexane has the highest Mr, giving strongest intermolecular forces; 2,2-dimethylbutane has the lowest Mr, giving weakest forces","correct":"B","explain":"All three isomers have molecular formula C₆H₁₄, Mr = 86 g mol⁻¹, and the same number of electrons (50). OCR mark schemes explicitly forbid comparing electron counts for isomers (same molecular formula → same electron count). Mr is also identical. Option A uses \"van der Waals\" which OCR mark schemes reject (H032/01 June 2018 and June 2023: \"IGNORE van der Waals\"). The only valid variable is surface area of contact, controlled by degree of branching. n-Hexane: no branches, elongated chain, maximum contact area; 2-methylpentane: one branch, intermediate; 2,2-dimethylbutane: two branches on one carbon, most compact, minimum contact. The rank-order link for all three must be stated explicitly for full marks (H032/01 June 2023 examiner report)."},{"stem":"A student compares the boiling points of n-pentane (36°C) and 2,2-dimethylpropane (10°C) with the explanation: \"2,2-dimethylpropane has fewer electrons, so it has weaker induced dipole–dipole forces.\" Evaluate this explanation.","A":"The explanation is correct; fewer electrons means weaker London forces","B":"The explanation is wrong: both compounds have the same molecular formula C₅H₁₂ and therefore the same number of electrons. The correct explanation involves surface area of contact, not electron count","C":"The explanation is partially correct; the student should also mention that 2,2-dimethylpropane has a lower Mr","D":"The explanation is correct because branched molecules always have fewer electrons","correct":"B","explain":"n-Pentane and 2,2-dimethylpropane are both C₅H₁₂, so they have identical Mr (72 g mol⁻¹) and identical electron counts (42 electrons each). The \"fewer electrons\" argument is factually wrong for any pair of isomers, and OCR mark schemes explicitly warn: \"DO NOT ALLOW arguments comparing different numbers of electrons (as all have the same number)\" for isomers (H032/01 June 2018 and June 2023). The correct explanation: 2,2-dimethylpropane is roughly spherical, minimising the surface area available for contact with neighbouring molecules; London forces are therefore weaker than for n-pentane's elongated chain, giving a lower boiling point."},{"stem":"Calculate the volume of oxygen (measured at room temperature and pressure, 24.0 dm³ mol⁻¹) required to completely combust 4.40 g of propane (Mr = 44.0 g mol⁻¹).","A":"6.00 dm³","B":"12.0 dm³","C":"24.0 dm³","D":"60.0 dm³","correct":"B","explain":"Balanced equation: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. n(C₃H₈) = 4.40/44.0 = 0.100 mol. Molar ratio C₃H₈ : O₂ = 1 : 5, so n(O₂) = 0.100 × 5 = 0.500 mol. Volume of O₂ at RTP = 0.500 × 24.0 = 12.0 dm³. Option A (6.00 dm³) corresponds to n(O₂) = 0.250 mol (using ratio 1:2.5 — wrong). Option C (24.0 dm³) would be 1.00 mol O₂ (ratio 1:10 — wrong). The balancing procedure is: C first (3 → 3CO₂), H next (8 → 4H₂O), O last (3×2 + 4×1 = 10 O, needing 5O₂)."},{"stem":"When 2-methylpropane (CH₃)₃CH reacts with Cl₂ under UV light, two monochlorinated products form. Explain why 2-chloro-2-methylpropane is formed in a higher proportion per reactive hydrogen than 1-chloro-2-methylpropane, even though there are more primary hydrogen atoms available.","A":"1-chloro-2-methylpropane is more thermodynamically stable, so it is preferred","B":"The tertiary C–H bond (on the central carbon of 2-methylpropane) is weaker than the primary C–H bonds; the tertiary radical intermediate is more stable because the three methyl groups can donate electron density to stabilise the unpaired electron","C":"Primary radicals are more stable than tertiary radicals, so primary H abstraction is less favourable","D":"UV light preferentially breaks tertiary C–H bonds; primary C–H bonds require visible light","correct":"B","explain":"Radical stability order: tertiary (3°) > secondary (2°) > primary (1°). The tertiary carbon in (CH₃)₃CH has three alkyl groups attached; their electron-donating effect stabilises the unpaired electron on the adjacent carbon. A more stable radical intermediate forms faster (lower activation energy for H abstraction from the tertiary C–H bond). So per reactive H, the tertiary site is more reactive. Although 2-methylpropane has 9 primary H atoms (on the three CH₃ groups) and only 1 tertiary H atom, the much higher per-H reactivity of the tertiary site means both products form in comparable proportions. This illustrates why radical substitution is not selective: even when one site is preferred per-H, mixtures are still unavoidable."},{"stem":"Explain how CFCs (chlorofluorocarbons such as CF₂Cl₂) destroy stratospheric ozone, linking this to the same radical chain principles used in alkane radical substitution.","A":"CFCs absorb UV directly in the stratosphere, blocking it from reaching ozone; ozone then decomposes thermally","B":"CFCs dissolve in stratospheric ice crystals, catalysing ionic decomposition of ozone to O₂","C":"UV homolytically breaks the C–Cl bond in CFCs to give Cl•; the Cl• initiates a chain (Cl• + O₃ → ClO• + O₂; ClO• + O → Cl• + O₂) in which one Cl• can destroy thousands of O₃ molecules before being terminated","D":"CFCs are oxidised in the stratosphere to give ClONO₂, which is the actual ozone-destroying species","correct":"C","explain":"The parallel with alkane radical substitution is direct: UV provides energy for homolytic fission of the C–Cl bond in the CFC (analogous to homolytic fission of Cl₂ in the initiation step). The Cl• produced then enters a propagation chain: Cl• + O₃ → ClO• + O₂ (Cl• is consumed, ClO• is produced — like propagation step 1), and ClO• + O → Cl• + O₂ (ClO• is consumed, Cl• is regenerated — like propagation step 2). The net reaction is O₃ + O → 2O₂. Because Cl• is regenerated each cycle, one Cl• can catalyse the destruction of thousands of O₃ molecules before being terminated — exactly the same high quantum yield as the alkane chlorination chain. This is why the Montreal Protocol banned CFCs."},{"stem":"The incomplete combustion of a hydrocarbon can produce CO. Write a balanced equation for the incomplete combustion of propane (C₃H₈) producing carbon monoxide and water only, and state the OCR-required explanation of CO's toxicity.","A":"C₃H₈ + 2O₂ → 3CO + 4H₂O; CO is an acidic gas that damages lung tissue","B":"C₃H₈ + 7/2 O₂ → 3CO + 4H₂O; CO is toxic because it binds to haemoglobin more strongly than O₂, preventing oxygen transport","C":"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O; CO₂ accumulates in the lungs","D":"C₃H₈ + 3O₂ → 3CO + H₂O; CO is flammable and ignites in the bloodstream","correct":"B","explain":"Balance for incomplete combustion producing CO: C₃H₈ + O₂ → CO + H₂O. Step 1: 3 carbons → 3CO. Step 2: 8 hydrogens → 4H₂O. Step 3: right side has 3 O (from 3CO) + 4 O (from 4H₂O) = 7 O atoms. O₂ on left: 7/2. So: C₃H₈ + 7/2 O₂ → 3CO + 4H₂O. Multiplying by 2 gives: 2C₃H₈ + 7O₂ → 6CO + 8H₂O. Either form is acceptable. The toxicity explanation requires two marks: CO binds to Fe²⁺ in haemoglobin more strongly than O₂ does, forming carboxyhaemoglobin, which cannot carry oxygen to body tissues, causing suffocation."},{"stem":"Three C₅H₁₂ isomers have boiling points: pentane (36°C), 2-methylbutane (28°C), 2,2-dimethylpropane (10°C). An OCR question asks for a 3-mark explanation of the boiling-point trend. Which mark scheme elements are required?","A":"Name the force (London forces); state that n-pentane has the most electrons; state that 2,2-dimethylpropane has the fewest electrons","B":"Name the force (London forces); link the degree of branching of each compound to its surface area; link each surface area to the strength of London forces and the corresponding boiling point rank","C":"Name the force (London forces); state that higher Mr gives higher boiling point; explain that 2,2-dimethylpropane has the lowest Mr","D":"Name the force (London forces); state that longer chain = more electrons; compare chain lengths for all three","correct":"B","explain":"All three C₅H₁₂ isomers have Mr = 72 and 42 electrons each. Mark A and C fail because they compare electron counts or Mr — both identical for isomers. Mark D is wrong for the same reason. The three mark-scheme elements for isomers are: (1) Name the intermolecular force: London (induced dipole–dipole) forces (NOT \"van der Waals\" — explicitly rejected by OCR). (2) Explain surface area: more branching → more compact shape → smaller surface area of contact between molecules. (3) Rank all three explicitly: n-pentane (no branches, largest surface area, strongest London forces, highest bp) → 2-methylbutane (one branch, intermediate) → 2,2-dimethylpropane (two branches on same C, most compact, smallest surface area, weakest London forces, lowest bp). The rank-order link for every named compound is the most commonly missed element (H032/01 June 2023 examiner report)."},{"stem":"State the full mechanism (all three stages with correct equations) for the reaction of ethane (C₂H₆) with bromine under UV light, and identify the by-products produced in the termination stage that would not appear in the overall stoichiometric equation.","A":"Initiation: Br₂ → 2Br• (UV). Propagation 1: Br• + C₂H₆ → C₂H₅• + HBr. Propagation 2: C₂H₅• + Br₂ → C₂H₅Br + Br•. Termination by-products: Br₂ (from 2Br•), C₂H₅Br (from Br• + C₂H₅•), C₄H₁₀ (from 2C₂H₅•)","B":"Initiation: HBr → H• + Br• (UV). Propagation: H• + C₂H₆ → C₂H₅• + H₂; C₂H₅• + Br₂ → C₂H₅Br + Br•. By-products: HBr and Br₂","C":"Initiation: Br₂ → 2Br⁻ (UV). Propagation: Br⁻ attacks C₂H₆ to give C₂H₅Br + Cl⁻. By-products: none","D":"Initiation: Br₂ → 2Br• (UV). Propagation 1: Br• + C₂H₆ → C₂H₆Br• (intermediate). Propagation 2: C₂H₆Br• → C₂H₅Br + H•. By-products: H₂ from 2H•","correct":"A","explain":"Initiation: Br₂ → 2Br• (UV light homolyses the Br–Br bond, bond enthalpy ≈ 193 kJ mol⁻¹). Propagation 1: Br• + C₂H₆ → C₂H₅• + HBr (Br• abstracts H from ethane, forming the ethyl radical and HBr). Propagation 2: C₂H₅• + Br₂ → C₂H₅Br + Br• (ethyl radical attacks Br₂, forming bromoethane and regenerating Br•). Termination by-products: 2Br• → Br₂, Br• + C₂H₅• → C₂H₅Br (same as main product), 2C₂H₅• → C₄H₁₀ (butane, analogous to ethane from methane chlorination). C₄H₁₀ is a by-product not accounted for by the overall equation C₂H₆ + Br₂ → C₂H₅Br + HBr, and its presence proves the radical chain mechanism. Dots must be shown throughout."},{"stem":"The radical chlorination of propane produces a mixture of 1-chloropropane and 2-chloropropane in a roughly 45:55 ratio, rather than the 75:25 ratio expected from the number of primary vs secondary hydrogen atoms. Which explanation best accounts for this discrepancy?","A":"The primary C–H bonds are stronger, so more energy is needed to break them, reducing their reactivity","B":"Secondary radicals (CH₃CH•CH₃) are more stable than primary radicals (CH₃CH₂CH₂•) because the two adjacent alkyl groups stabilise the unpaired electron; the lower activation energy for abstraction at the secondary carbon means that secondary C–H bonds react faster per H than primary ones","C":"The 2-chloropropane product is thermodynamically more stable, shifting equilibrium in its favour","D":"Primary radicals are more stable than secondary radicals, making primary substitution less likely","correct":"B","explain":"A statistical argument (6 primary H : 2 secondary H → 3:1 ratio) predicts 75% 1-chloropropane and 25% 2-chloropropane. The actual ~45:55 ratio shows the secondary position is disproportionately reactive. The explanation is radical stability: secondary radicals (flanked by two alkyl groups) are more stable than primary radicals (flanked by one alkyl group). Greater stability means lower activation energy for radical formation at the secondary site. The per-H reactivity at the secondary C is higher, boosting the proportion of 2-chloropropane beyond the statistical prediction. This is the same principle (1° < 2° < 3° radical stability) that makes the tertiary product the majority in 2-methylpropane chlorination."},{"stem":"A student attempts to use radical chlorination of butane as an industrial route to 1-chlorobutane. Evaluate the viability of this approach, citing both limitations of free radical substitution.","A":"The approach is viable because UV radiation is cheap and the mechanism is well understood","B":"The approach is not viable: limitation 1 — radical attack at both the C1 and C2 positions gives a mixture of 1-chlorobutane and 2-chlorobutane (and 2-methylpropyl products from branching), and these must be separated; limitation 2 — further chlorination of 1-chlorobutane gives 1,2-dichlorobutane, 1,1-dichlorobutane, etc., so the reaction produces a complex mixture of polychlorinated products","C":"The approach is viable if the reaction is run under excess butane; only 1-chlorobutane will form because the radical preferentially attacks the terminal position","D":"The approach is not viable because radical reactions do not occur with butane (only methane reacts)","correct":"B","explain":"Both limitations apply to butane chlorination. (1) Positional selectivity: butane has primary H atoms on both terminal carbons and secondary H atoms on C2 and C3. Radical Cl• attacks both, giving 1-chlorobutane (from primary H abstraction) and 2-chlorobutane (from secondary H abstraction) as a mixture. These structural isomers (b.p. 78°C vs 68°C) must be separated by fractional distillation: time-consuming, energy-intensive, and wasteful of starting material. Even with excess butane, both positional isomers form. (2) Further substitution: 1-chlorobutane (and 2-chlorobutane) each still have C–H bonds. Continued reaction with Cl₂ produces dichlorobutanes, trichlorobutanes, etc. in proportions controlled by the Cl₂/butane ratio. The synthesis yields are low and the mixture is complex — radical substitution is therefore impractical for making a single pure haloalkane."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
