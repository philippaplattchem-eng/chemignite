<!DOCTYPE html>

<title>6.1 Aromatic Chemistry - flame &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.1 &mdash; Aromatic Chemistry</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame &mdash; Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Which statement correctly describes the Wheland intermediate (arenium ion) in electrophilic substitution?","A":"It is a planar, fully aromatic carbocation with the horseshoe arc spanning all six C–C bonds.","B":"It contains four delocalised π-electrons over five carbons; the horseshoe arc has its gap pointing towards the sp³ carbon bearing both H and the new substituent.","C":"It is formed when benzene undergoes electrophilic addition, permanently converting two carbons to sp³.","D":"The orientation of the horseshoe arc in the diagram does not affect marks in OCR examinations.","correct":"B","explain":"The Wheland intermediate forms when the electrophile bonds to one ring carbon, making it <b>sp³</b>. The remaining <b>four π-electrons</b> are delocalised over the other five ring carbons, represented by a <b>horseshoe arc</b>. OCR examiners are strict: the gap in the horseshoe must point <b>towards the sp³ carbon</b> (the one bearing H and the new substituent), and the + sign is placed inside the hexagon. OCR examiner reports from June 2024 and June 2019 explicitly penalised incorrectly oriented horseshoes — directly contradicting option (D). Option (A) is wrong — with only four π-electrons and an sp³ carbon, the ring is no longer fully aromatic. Option (C) confuses the Wheland intermediate with an addition reaction."},{"stem":"A student adds phenol to separate samples of aqueous NaOH and aqueous Na₂CO₃. Which set of observations is correct?","A":"Phenol reacts with both NaOH and Na₂CO₃, releasing CO₂ from the carbonate.","B":"Phenol reacts with NaOH to give sodium phenoxide; phenol does not react with Na₂CO₃.","C":"Phenol does not react with either NaOH or Na₂CO₃ because it is too weakly acidic.","D":"Phenol reacts with NaOH only at elevated temperatures; at room temperature it reacts only with Na₂CO₃.","correct":"B","explain":"Phenol (pKa ≈ 10) is fully deprotonated by the strong base NaOH to give sodium phenoxide + water. However, it <b>cannot</b> displace CO₂ from Na₂CO₃ because carbonic acid (pKa ≈ 6.4) is a <b>stronger acid</b> than phenol — the equilibrium C₆H₅OH + CO₃²⁻ ⇌ C₆H₅O⁻ + HCO₃⁻ lies far to the left, so no CO₂ is observed. This contrast is diagnostically important: a compound that reacts with NaOH but <b>not</b> Na₂CO₃ is likely a phenol; one that reacts with both and produces CO₂ effervescence is likely a carboxylic acid (pKa ~4.8, stronger than H₂CO₃)."},{"stem":"Which statement correctly compares the nitration of phenol with the nitration of benzene?","A":"Both phenol and benzene require concentrated HNO₃ with concentrated H₂SO₄ at 50 °C.","B":"Phenol reacts with dilute HNO₃ at room temperature without an H₂SO₄ catalyst; benzene requires concentrated HNO₃ with concentrated H₂SO₄ at 50 °C.","C":"Phenol requires concentrated HNO₃ at room temperature, but no H₂SO₄ catalyst.","D":"Phenol requires dilute HNO₃ but still needs concentrated H₂SO₄ as a catalyst.","correct":"B","explain":"The –OH group in phenol donates a lone pair into the π-system, greatly increasing the ring's electron density and susceptibility to attack. Phenol therefore needs only <b>dilute HNO₃ at room temperature</b> — no H₂SO₄ is required because the ring is activated enough to react without the highly electrophilic NO₂⁺ needed for benzene. The products are directed to the <b>2 and 4 positions</b> by the –OH group, giving a mixture of 2-nitrophenol and 4-nitrophenol. Benzene needs concentrated H₂SO₄ to generate NO₂⁺ from concentrated HNO₃, plus heating to ~50 °C — fundamentally harsher conditions due to benzene's lower ring electron density."},{"stem":"Cyclohexene has an enthalpy change of hydrogenation of −120 kJ mol⁻¹. The measured enthalpy change of hydrogenation of benzene is −208 kJ mol⁻¹. What is the delocalisation energy of benzene?","A":"88 kJ mol⁻¹","B":"120 kJ mol⁻¹","C":"152 kJ mol⁻¹","D":"328 kJ mol⁻¹","correct":"C","explain":"The Kekulé model predicts benzene (three C=C bonds) should release 3 × 120 = <b>360 kJ mol⁻¹</b> on hydrogenation. The measured release is only <b>208 kJ mol⁻¹</b>, so benzene releases 360 − 208 = <b>152 kJ mol⁻¹ less</b> than predicted — meaning benzene is 152 kJ mol⁻¹ more stable than the Kekulé structure. This extra stability is the delocalisation (resonance) energy. Trap (A): 208 − 120 = 88 (incorrectly subtracts just one cyclohexene unit from the measured value). Trap (D): 208 + 120 = 328 (adds rather than subtracts). Trap (B): 120 is the value for one C=C, not the delocalisation energy."},{"stem":"Nitrobenzene is treated with concentrated HNO₃ and concentrated H₂SO₄. Which organic product is formed in greatest yield?","A":"1,2-dinitrobenzene","B":"1,3-dinitrobenzene","C":"1,4-dinitrobenzene","D":"1,2,4,6-tetranitrobenzene","correct":"B","explain":"The –NO₂ group withdraws electron density from the ring (–M effect), <b>depleting</b> the 2, 4 and 6 positions (ortho and para). The 3-position is therefore relatively more electron-rich, and the second NO₂⁺ electrophile attacks there, giving <b>1,3-dinitrobenzene</b> as the major product. –NO₂ is described as a <b>3-directing (meta-directing)</b> group. The deactivated ring also explains why more forcing conditions (concentrated reagents) are needed for this second nitration compared to the first. The commonest error is selecting the 1,4-isomer, which would form only if –NO₂ were 2,4-directing — it is not."},{"stem":"Which statement correctly explains why phenol undergoes electrophilic substitution more readily than benzene?","A":"The oxygen atom is electronegative, pulling electron density towards the C–O bond and making the ring more reactive.","B":"A lone pair on the oxygen of the –OH group is partially delocalised into the π-system of the ring, increasing the ring's electron density and making it more susceptible to electrophilic attack.","C":"The –OH group raises the ring's reactivity through positive inductive (+I) donation through σ-bonds.","D":"The –OH group directly lowers the activation energy for loss of H⁺ from the Wheland intermediate.","correct":"B","explain":"The oxygen in phenol carries lone pairs in p-orbitals aligned parallel to the ring's p-orbitals. One lone pair overlaps sideways with the π-system (+M effect), increasing the ring's electron density especially at the 2, 4 and 6 positions. OCR examiner reports (June 2022, June 2018) credit: (1) lone pair on O <b>partially delocalised/donated</b> into the ring/π-system, (2) electron density of ring is <b>higher</b>, (3) phenol is <b>more susceptible to electrophilic attack</b> or attracts/polarises the electrophile more. Option (A) misapplies electronegativity (which makes phenol acidic, not reactive). Option (C) describes the +I effect of alkyl groups, not the +M effect of –OH. OCR explicitly states: <b>IGNORE \"charge density\"</b> and <b>IGNORE \"electronegativity\"</b> in mark schemes for this type of question."},{"stem":"Which set of conditions is correct for the Friedel-Crafts alkylation of benzene with chloroethane?","A":"Aqueous AlCl₃, room temperature","B":"Anhydrous AlCl₃, reflux","C":"Anhydrous FeBr₃, room temperature","D":"Dilute H₂SO₄, 50 °C","correct":"B","explain":"Friedel-Crafts alkylation requires <b>anhydrous</b> conditions because water hydrolyses AlCl₃ (AlCl₃ + 3H₂O → Al(OH)₃ + 3HCl), destroying its Lewis-acid catalytic activity. <b>Anhydrous AlCl₃</b> is the standard catalyst; <b>reflux</b> is typically needed to drive the reaction to completion. FeBr₃ is used as a halogen carrier for bromination (with Br₂), not for alkylation with haloalkanes. H₂SO₄ is used in nitration, not Friedel-Crafts chemistry. The anhydrous requirement is a common exam point — any moisture prevents the reaction."},{"stem":"Phenylamine (C₆H₅NH₂) is added to bromine water. Which compound is the major organic product?","A":"3-bromophenylamine","B":"2-bromophenylamine","C":"2,4-dibromophenylamine","D":"2,4,6-tribromophenylamine","correct":"D","explain":"The –NH₂ group donates its lone pair into the π-system even more effectively than –OH, making the ring extremely reactive towards electrophiles. Like phenol with bromine water, phenylamine undergoes <b>tri-substitution at room temperature without a halogen carrier</b>. The –NH₂ group is 2,4-directing (and activates position 6 by symmetry as well), so all three ortho/para positions are brominated simultaneously, giving <b>2,4,6-tribromophenylamine</b>. This was the product explicitly cited in the OCR H432/02 June 2017 mark scheme. A monobromo or dibromo product would only form with a less activated ring (e.g., benzene with a halogen carrier gives monobromobenzene)."},{"stem":"Which equation correctly represents the generation of the electrophile in the nitration of benzene?","A":"HNO₃ + H₂SO₄ → NO₃⁻ + H₃SO₄⁺","B":"HNO₃ + 2H₂SO₄ → NO₂⁺ + 2HSO₄⁻ + H₃O⁺","C":"HNO₃ → NO₂⁺ + OH⁻","D":"HNO₃ + H₂SO₄ → HNO₂ + H₂SO₄","correct":"B","explain":"Concentrated H₂SO₄ (stronger acid) protonates HNO₃, giving H₂NO₃⁺ and HSO₄⁻. H₂NO₃⁺ loses water to give <b>NO₂⁺</b>. The water released is reprotonated by a second H₂SO₄, giving another HSO₄⁻ and H₃O⁺. Overall: <b>HNO₃ + 2H₂SO₄ → NO₂⁺ + 2HSO₄⁻ + H₃O⁺</b>. This equation appears as a stand-alone mark point in OCR exams and must be memorised precisely (note: 2 mol H₂SO₄, 2 mol HSO₄⁻, 1 mol H₃O⁺). Option (A) shows wrong ions — NO₃⁻ is not the electrophile. Option (C) omits H₂SO₄ entirely. Option (D) produces HNO₂ (nitrous acid), which is incorrect."},{"stem":"Two unknown compounds X and Y are each added separately to bromine water. Compound X rapidly decolourises the bromine water, leaving a clear solution. Compound Y rapidly decolourises the bromine water and a white precipitate also forms. Which conclusion is correct?","A":"Both X and Y are alkenes.","B":"X is phenol and Y is an alkene.","C":"X could be an alkene; Y is consistent with being phenol.","D":"Y cannot be phenol because phenols do not form precipitates with bromine water.","correct":"C","explain":"Both alkenes and phenol decolourise bromine water, but by different reactions. Alkenes react by <b>electrophilic addition</b> across the C=C, producing a <b>soluble dibromoalkane</b> — the solution clears with no precipitate. Phenol reacts by <b>electrophilic substitution</b> at the 2, 4, and 6 positions, producing <b>2,4,6-tribromophenol</b>, a low-solubility solid that forms a <b>white precipitate</b>. The white precipitate therefore distinguishes phenol from alkenes. X decolourises without a precipitate → consistent with an alkene. Y decolourises and gives a white precipitate → consistent with phenol. Option (B) reverses the assignment. Option (D) is factually incorrect."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
