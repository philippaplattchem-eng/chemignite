<!DOCTYPE html>
<html lang="en">
<head>

<title>5.3 Acids, Bases and Buffers - spark &mdash; ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.3 &mdash; Acids, Bases and Buffers</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark &mdash; Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Which statement gives the correct Brønsted–Lowry definition of an acid?","A":"A species that produces H⁺ ions when dissolved in water","B":"A proton donor","C":"A hydrogen atom donor","D":"A species that accepts an electron pair","correct":"B","explain":"The Brønsted–Lowry definition defines an acid as a <b>proton (H⁺) donor</b> and a base as a proton acceptor. The word \"proton\" is required — OCR mark schemes specifically penalise \"hydrogen atom donor\" or \"hydrogen ion donor\" without the word \"proton\". Option A is the Arrhenius definition, which is narrower and not the OCR-required definition. Option D describes a Lewis acid, a different (non-OCR A Level) framework. (H432/01 November 2020 Examiner Report: candidates who wrote \"hydrogen donor\" rather than \"proton donor\" lost the definition mark.)"},{"stem":"Which pair of species are conjugate acid–base partners?","A":"HCl and Cl⁻","B":"HCl and H₂O","C":"NH₃ and OH⁻","D":"H₂SO₄ and HSO₄⁻ only if H₂SO₄ loses two protons","correct":"A","explain":"A conjugate acid–base pair consists of two species that differ by exactly <b>one proton (H⁺)</b>. HCl donates one H⁺ to form Cl⁻ — they differ by one proton, so they are a conjugate pair. NH₃ and OH⁻ differ by one H⁺ (NH₄⁺/NH₃ is the correct pair; OH⁻ is the conjugate base of H₂O). In the reaction HCl + NH₃ → Cl⁻ + NH₄⁺ there are two conjugate pairs: HCl/Cl⁻ and NH₄⁺/NH₃. Each pair always sits on opposite sides of the equilibrium — the acid on one side and its conjugate base on the other. (H432/01 November 2020: mark awarded for correctly identifying both pairs even if the acid/base direction was reversed, provided the pair relationship was clear.)"},{"stem":"The pH of 0.10 mol dm⁻³ HCl is:","A":"1","B":"1.00","C":"−1.00","D":"0.10","correct":"B","explain":"HCl is a strong monobasic acid that fully dissociates, so [H⁺] = 0.10 mol dm⁻³. pH = −log(0.10) = −log(10⁻¹) = <b>1.00</b>. OCR requires pH to <b>2 decimal places</b> — writing \"1\" rather than \"1.00\" loses the mark for significant figures (H432/01 June 2023 Examiner Report). Option C would be the answer if [HCl] = 10 mol dm⁻³, which is outside the relevant range. Option D confuses concentration with pH."},{"stem":"Which expression correctly gives Ka for the equilibrium CH₃COOH ⇌ CH₃COO⁻ + H⁺?","A":"Ka = [H⁺][CH₃COO⁻] / [CH₃COOH] (units: mol dm⁻³)","B":"Ka = [H⁺][CH₃COO⁻] / ([CH₃COOH][H₂O])","C":"Ka = [CH₃COOH] / ([H⁺][CH₃COO⁻])","D":"Ka = [H⁺]² / [CH₃COOH]","correct":"A","explain":"Ka is the equilibrium constant for the dissociation of a weak acid: products over reactants with stoichiometric powers. [H₂O] is omitted because water is the solvent — its concentration is effectively constant and is incorporated into Ka. Option B is the full expression before the [H₂O] simplification. Option C is the reciprocal (wrong direction). Option D is the approximate expression used only when [H⁺] = [A⁻] (the weak acid approximation), not the definition of Ka itself. The units of Ka are <b>mol dm⁻³</b> for a monobasic weak acid (one mole of products minus one mole of reactants in the expression gives net +1 mol dm⁻³)."},{"stem":"The value of Kw at 298 K is:","A":"1.00 × 10⁻⁷ mol dm⁻³","B":"1.00 × 10⁻¹⁴ mol² dm⁻⁶","C":"1.00 × 10⁻¹⁴ mol dm⁻³","D":"1.00 × 10⁻⁷ mol² dm⁻⁶","correct":"B","explain":"Kw = [H⁺][OH⁻]. At 298 K, Kw = <b>1.00 × 10⁻¹⁴ mol² dm⁻⁶</b>. The units come from multiplying two concentration terms ([H⁺] × [OH⁻]), each in mol dm⁻³, giving mol² dm⁻⁶. Option A gives the value of [H⁺] = [OH⁻] in neutral water (the square root of Kw), not Kw itself. Option C has the correct numerical value but wrong units. Option D has the correct units but wrong numerical value (it is [H⁺] = [OH⁻], not Kw)."},{"stem":"Which statement correctly distinguishes a strong acid from a weak acid?","A":"A strong acid fully dissociates in aqueous solution; a weak acid only partially dissociates","B":"A strong acid is more concentrated than a weak acid","C":"A strong acid always has a lower pH than a weak acid","D":"A strong acid reacts with metals but a weak acid does not","correct":"A","explain":"The strong/weak distinction is about the <b>extent of dissociation</b>, not concentration. A strong acid uses a one-way arrow (→) to show complete dissociation; a weak acid uses a reversible arrow (⇌) to show partial dissociation with an equilibrium mixture present. A concentrated weak acid can have a lower pH than a dilute strong acid (option C is therefore not always true). Both strong and weak acids react with reactive metals (option D is false — ethanoic acid reacts with Mg to produce H₂). Students frequently confuse \"strong\" with \"concentrated\" — these are completely separate properties and this confusion loses marks consistently in examiner reports."},{"stem":"Water is described as amphiprotic. This means water can:","A":"Fully dissociate into H⁺ and OH⁻","B":"Act as both an acid and a base, depending on the reaction partner","C":"Donate two protons per molecule","D":"Accept protons only from strong acids","correct":"B","explain":"Water is <b>amphiprotic</b> because it can both donate a proton (acting as an acid) and accept a proton (acting as a base). With HCl: H₂O accepts H⁺ → H₃O⁺ (water acts as base). With NH₃: H₂O donates H⁺ → OH⁻ (water acts as acid). Option A describes Kw dissociation but is not the definition of amphiprotic. Option C describes a diprotic acid; water donates only one H⁺ per molecule. Option D is wrong — water can accept protons from both strong and weak acids."},{"stem":"What is the pH of a neutral solution at 50°C?","A":"Less than 7, because Kw increases with temperature","B":"Exactly 7, because neutral always means pH = 7","C":"Greater than 7, because heating produces more OH⁻ than H⁺","D":"Exactly 7, because the H⁺ and OH⁻ concentrations remain equal","correct":"A","explain":"A <b>neutral</b> solution is defined as one where <b>[H⁺] = [OH⁻]</b>, not where pH = 7. Kw is temperature-dependent — it increases with rising temperature because the autoionisation of water (H₂O ⇌ H⁺ + OH⁻) is endothermic. At 50°C, Kw ≈ 5.5 × 10⁻¹⁴ mol² dm⁻⁶, so [H⁺] = [OH⁻] = √(5.5 × 10⁻¹⁴) ≈ 2.3 × 10⁻⁷ mol dm⁻³ → pH ≈ 6.63. The solution is still neutral ([H⁺] = [OH⁻]), but its pH is below 7. Option D is correct that [H⁺] = [OH⁻] at neutrality but wrong to conclude pH = 7. Options B and D are therefore subtly different wrong answers — both leading to the wrong conclusion for the wrong reason."},{"stem":"A weak acid has pKa = 4.76. What is its Ka value?","A":"1.74 × 10⁻⁵ mol dm⁻³","B":"4.76 × 10⁻⁵ mol dm⁻³","C":"10⁴·⁷⁶ mol dm⁻³","D":"1.74 × 10⁻⁵ mol² dm⁻⁶","correct":"A","explain":"pKa = −log Ka, so Ka = 10⁻ᵖᴷᵃ = 10⁻⁴·⁷⁶ = <b>1.74 × 10⁻⁵ mol dm⁻³</b>. Option B confuses the numerical coefficient: 10⁻⁴·⁷⁶ ≠ 4.76 × 10⁻⁵. Option C inverts the sign inside the exponent, giving a very large number (the reciprocal). Option D has the correct value but wrong units — Ka for a monobasic weak acid has units mol dm⁻³, not mol² dm⁻⁶ (which are the units of Kw)."},{"stem":"H₃PO₄ is described as tribasic. This means:","A":"It contains three phosphorus atoms","B":"It can donate three protons (H⁺) per molecule","C":"It forms three separate acid molecules on dissociation","D":"It has a Ka value three times larger than a monobasic acid","correct":"B","explain":"The basicity of an acid refers to the <b>number of H⁺ ions (acidic protons) it can donate per molecule</b>. H₃PO₄ has three ionisable O–H bonds and therefore donates up to three H⁺ ions: H₃PO₄ → H₂PO₄⁻ → HPO₄²⁻ → PO₄³⁻. This is distinct from the number of hydrogen atoms in the molecule (e.g. CH₄ has four H atoms but is not acidic at all — the C–H bond is not ionisable). Other tribasic acids include citric acid (three –COOH groups). H₂SO₄ is dibasic (two acidic H⁺). HCl, HNO₃, and CH₃COOH are monobasic (one acidic H⁺)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
