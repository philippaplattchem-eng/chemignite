<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T3 Spark &mdash; Chemical Changes</title>
<style>:root{--pr:#3f51b5;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(63,81,181,.10);--sh2:0 6px 24px rgba(63,81,181,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}

/* ── landing hero ── */
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#0d1b3e 0%,#1a2f6e 45%,#3f51b5 80%,#5c6bc0 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto .5rem}
.hero-pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
.hero-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:600}

/* ── tier legend ── */
.tier-legend{display:flex;gap:0;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}

/* ── topic grid ── */
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem;padding-left:.2rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

/* ── quiz page ── */
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(63,81,181,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(63,81,181,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(92,107,192,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="back-link">&larr; All Topics</a>
  <h1>T3 &mdash; Chemical Changes</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>20 questions</span>
    <span>Spark &mdash; Recall</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What ions do acids release when dissolved in water?","A":"Hydroxide ions (OH⁻)","B":"Oxide ions (O²⁻)","C":"Hydrogen ions (H⁺)","D":"Sodium ions (Na⁺)","correct":"C","explain":"Acids are defined as substances that release hydrogen ions (H⁺) when dissolved in water. For example, HCl(aq) → H⁺(aq) + Cl⁻(aq). It is the H⁺ ions that give acids their characteristic properties, sour taste, low pH, and reactions with metals, carbonates and bases."},{"stem":"What is the pH of a neutral solution at room temperature?","A":"0","B":"14","C":"7","D":"1","correct":"C","explain":"A neutral solution has equal concentrations of H⁺ and OH⁻ ions. Pure water at room temperature is neutral and has a pH of 7. Solutions with pH below 7 are acidic (more H⁺); solutions with pH above 7 are alkaline (more OH⁻)."},{"stem":"What gas is produced when an acid reacts with a metal carbonate?","A":"Hydrogen","B":"Oxygen","C":"Carbon dioxide","D":"Sulfur dioxide","correct":"C","explain":"Acid + metal carbonate → salt + water + carbon dioxide. For example: 2HCl(aq) + CaCO₃(s) → CaCl₂(aq) + H₂O(l) + CO₂(g). Carbon dioxide is identified by testing with limewater, it turns the limewater milky/cloudy."},{"stem":"What is the name of the negative electrode in electrolysis?","A":"Anode","B":"Electrolyte","C":"Cathode","D":"Cation","correct":"C","explain":"The cathode is the negative electrode, connected to the negative terminal of the DC supply. The anode is the positive electrode. A useful mnemonic: PANIC, Positive Anode, Negative Is Cathode. Cations (positive ions) are attracted to the cathode; anions (negative ions) are attracted to the anode."},{"stem":"Which of these is the word equation for acid + metal hydroxide?","A":"Acid + metal hydroxide → salt + hydrogen","B":"Acid + metal hydroxide → salt + water + carbon dioxide","C":"Acid + metal hydroxide → salt + water","D":"Acid + metal hydroxide → metal + water","correct":"C","explain":"Acid + metal hydroxide → salt + water. This is a neutralisation reaction. The H⁺ ions from the acid combine with the OH⁻ ions from the metal hydroxide to form water. No gas is produced. Example: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)."},{"stem":"What is an electrolyte?","A":"A metal conductor that carries current to the electrodes","B":"An ionic compound in the molten state or dissolved in water, whose ions can move freely","C":"A covalent compound that conducts electricity when heated","D":"The solution that forms around the cathode during electrolysis","correct":"B","explain":"An electrolyte is an ionic compound that can conduct electricity because its ions are free to move. This happens either when the compound is molten (lattice broken down by heat) or dissolved in water (ions pulled apart by water molecules). Solid ionic compounds are not electrolytes because their ions are fixed in the lattice."},{"stem":"What colour does litmus turn in an acidic solution?","A":"Blue","B":"Purple","C":"Green","D":"Red","correct":"D","explain":"Litmus is a natural indicator. It turns red in acidic solutions (pH below 7) and blue in alkaline solutions (pH above 7). It stays purple in neutral solutions. Universal indicator gives a more detailed picture, ranging from red (very acidic) through green (neutral) to dark purple (very alkaline)."},{"stem":"What gas is produced when an acid reacts with a metal?","A":"Oxygen","B":"Carbon dioxide","C":"Hydrogen","D":"Chlorine","correct":"C","explain":"Acid + metal → salt + hydrogen. Reactive metals (e.g. magnesium, zinc, iron) displace hydrogen from the acid. Hydrogen gas is confirmed with the squeaky pop test, a lighted splint produces a loud squeak as hydrogen burns. Example: Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)."},{"stem":"Which electrode do positive ions (cations) move towards during electrolysis?","A":"Anode (positive electrode)","B":"Cathode (negative electrode)","C":"They move towards both electrodes equally","D":"They move towards neither electrode, they stay in the centre","correct":"B","explain":"Opposite charges attract, positive cations are attracted to the negative cathode. Negative anions are attracted to the positive anode. Remember: cats go to the cathode (cat = cation). At the cathode, cations gain electrons and are reduced; at the anode, anions lose electrons and are oxidised."},{"stem":"What is the ionic equation for acid-alkali neutralisation?","A":"Na⁺ + Cl⁻ → NaCl","B":"H⁺ + OH⁻ → H₂O","C":"H₂ + O → H₂O","D":"HCl + NaOH → NaCl + H₂O","correct":"B","explain":"In any acid-alkali neutralisation, the essential reaction is always H⁺(aq) + OH⁻(aq) → H₂O(l). The metal ion and acid anion (e.g. Na⁺ and Cl⁻) are spectator ions that do not change, they are not shown in the ionic equation. This equation applies to all acid-alkali reactions, regardless of which acid or alkali is used."},{"stem":"What salt is produced when hydrochloric acid reacts with sodium hydroxide?","A":"Sodium sulfate","B":"Sodium carbonate","C":"Sodium nitrate","D":"Sodium chloride","correct":"D","explain":"The salt is named from the metal (sodium, from sodium hydroxide) + the acid anion (chloride, from hydrochloric acid). HCl → chloride salts; H₂SO₄ → sulfate salts; HNO₃ → nitrate salts. Hydrochloric acid + sodium hydroxide → sodium chloride + water."},{"stem":"Why does solid sodium chloride not conduct electricity?","A":"It contains covalent bonds that cannot carry charge","B":"Its ions are locked in fixed positions in the lattice and cannot move","C":"It has no ions, only neutral atoms","D":"It contains too few ions to carry a current","correct":"B","explain":"Electrical conduction requires charged particles that can move. In solid NaCl, the Na⁺ and Cl⁻ ions are held in a giant ionic lattice by strong electrostatic forces, they can only vibrate about fixed positions. With no mobile charge carriers, the solid cannot conduct. When melted or dissolved, the ions are free to move and the substance becomes an electrolyte."},{"stem":"Which of these correctly defines a strong acid?","A":"An acid with a high concentration of solution","B":"An acid that is corrosive and dangerous","C":"An acid that completely ionises in water to release the maximum possible number of H⁺ ions","D":"An acid with a large molecular mass","correct":"C","explain":"Acid strength refers to the degree of ionisation, not concentration. A strong acid (e.g. HCl, H₂SO₄, HNO₃) fully ionises in water: every molecule releases its H⁺ ion. A weak acid (e.g. ethanoic acid) only partially ionises, so a solution of weak acid contains fewer H⁺ ions than the same-concentration solution of strong acid, giving a higher pH."},{"stem":"What products are formed at the electrodes when molten lead bromide (PbBr₂) is electrolysed?","A":"Lead at the anode; bromine at the cathode","B":"Bromine at both electrodes","C":"Lead at the cathode; bromine at the anode","D":"Lead bromide is decomposed into lead, bromine and oxygen","correct":"C","explain":"Pb²⁺ cations are attracted to the negative cathode, where they gain electrons (are reduced) to form lead metal. Br⁻ anions are attracted to the positive anode, where they lose electrons (are oxidised) to form bromine gas. Molten ionic compounds always split into their constituent elements during electrolysis."},{"stem":"What type of current must be used in electrolysis, and why?","A":"Alternating current (AC), so the electrodes swap charges regularly","B":"Direct current (DC), so each electrode keeps a fixed charge throughout the experiment","C":"Either AC or DC, it makes no difference to the products","D":"Very high-voltage DC only, low voltages do not cause decomposition","correct":"B","explain":"Direct current (DC) is essential because the electrodes must maintain fixed positive (anode) and negative (cathode) charges throughout. If alternating current were used, the electrode charges would swap every cycle and no net movement of ions or decomposition would occur. The direction of ion migration must remain constant."},{"stem":"What is the word equation for acid + metal oxide?","A":"Acid + metal oxide → salt + hydrogen","B":"Acid + metal oxide → salt + water","C":"Acid + metal oxide → salt + water + carbon dioxide","D":"Acid + metal oxide → metal + water","correct":"B","explain":"Acid + metal oxide → salt + water. Metal oxides are bases, they accept H⁺ ions from the acid to form water, while the metal cation combines with the acid's anion to form a salt. Example: H₂SO₄(aq) + CuO(s) → CuSO₄(aq) + H₂O(l). The black CuO dissolves and the solution turns blue."},{"stem":"The pH scale runs from 0 to 14. A solution of pH 2 is best described as:","A":"Strongly alkaline","B":"Weakly alkaline","C":"Neutral","D":"Strongly acidic","correct":"D","explain":"pH 2 is well below 7, it indicates a high concentration of H⁺ ions and a strongly acidic solution. The lower the pH below 7, the more acidic the solution. pH 13–14 would be strongly alkaline. pH 7 is neutral."},{"stem":"What are the products of electrolysing aqueous copper sulfate solution using inert electrodes?","A":"Copper at the anode; oxygen at the cathode","B":"Sulfur at the cathode; oxygen at the anode","C":"Copper at the cathode; oxygen at the anode","D":"Hydrogen at the cathode; sulfur dioxide at the anode","correct":"C","explain":"In aqueous copper sulfate, Cu²⁺ ions are preferentially discharged at the cathode (copper is less reactive than hydrogen so Cu²⁺ is discharged in preference to H⁺). OH⁻ ions from water are discharged at the anode, releasing oxygen gas. Copper plates onto the cathode; oxygen bubbles appear at the anode."},{"stem":"Indicators change colour depending on pH. Which indicator gives a colour range across the whole pH scale?","A":"Litmus","B":"Phenolphthalein","C":"Methyl orange","D":"Universal indicator","correct":"D","explain":"Universal indicator is a mixture of several indicators that gives a different colour at every pH across the scale: red (pH 1–3), orange/yellow (pH 4–6), green (pH 7), blue (pH 8–10), violet/dark purple (pH 11–14). Litmus only shows acid or alkali. Single indicators like phenolphthalein or methyl orange each show only one colour change at a specific pH."},{"stem":"What name is given to the salt formed when sulfuric acid reacts with potassium hydroxide?","A":"Potassium chloride","B":"Potassium sulfate","C":"Potassium nitrate","D":"Potassium carbonate","correct":"B","explain":"The salt name comes from the metal of the base (potassium, from KOH) and the anion of the acid (sulfate, from H₂SO₄). H₂SO₄ always gives sulfate salts. The full equation: H₂SO₄(aq) + 2KOH(aq) → K₂SO₄(aq) + 2H₂O(l)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
