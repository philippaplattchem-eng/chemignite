<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T2 Spark &mdash; States of Matter & Mixtures</title>
<style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}

/* ── landing hero ── */
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#4a1d96 0%,#6d28d9 45%,#9333ea 80%,#c084fc 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto .5rem}
.hero-pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
.hero-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:600}

/* ── tier legend ── */
.tier-legend{display:flex;gap:0;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}

/* ── topic grid ── */
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem;padding-left:.2rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

/* ── quiz page ── */
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T2 &mdash; States of Matter &amp; Mixtures</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>20 questions</span>
    <span>Spark &mdash; Recall</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Which statement best describes the arrangement of particles in a solid?","A":"Far apart and moving randomly","B":"Close together but moving freely past each other","C":"Regular pattern, all touching, vibrating about fixed positions","D":"Irregular arrangement, far apart, with high energy","correct":"C","explain":"In a solid, particles are arranged in a regular lattice pattern, all touching their neighbours. They vibrate about fixed positions but cannot move from place to place. The forces between them are strongest in the solid state."},{"stem":"What is the name given to the change of state from liquid to gas that happens throughout the liquid at the boiling point?","A":"Condensing","B":"Sublimation","C":"Evaporating","D":"Boiling","correct":"D","explain":"Boiling occurs when a liquid reaches its boiling point, bubbles of vapour form throughout the bulk of the liquid, not just at the surface. Evaporation can happen at any temperature at the surface only. Both are physical changes (liquid → gas)."},{"stem":"What is the name for the change of state from gas to liquid?","A":"Freezing","B":"Condensing","C":"Sublimation","D":"Melting","correct":"B","explain":"Condensing (condensation) is the change of state from gas to liquid, it happens when a gas is cooled below its boiling point. Example: steam turning back to water on a cold surface. It is the reverse of evaporation."},{"stem":"In chemistry, what does \"pure\" mean?","A":"A substance with nothing harmful added","B":"A substance that is completely natural and unprocessed","C":"A single element or single compound, not mixed with any other substance","D":"A substance that has been filtered and chlorinated","correct":"C","explain":"In chemistry, \"pure\" is very specific, it means a sample containing only one type of substance (one element or one compound). This is different from the everyday meaning (nothing added / natural). Pure water contains only H₂O; tap water is not chemically pure even though it is safe to drink."},{"stem":"What does a sharp melting point tell you about a substance?","A":"The substance is a mixture of two elements","B":"The substance has a high molecular mass","C":"The substance contains ionic bonds","D":"The substance is a pure element or compound","correct":"D","explain":"A pure substance melts at one specific, fixed temperature, a sharp melting point. A mixture melts over a range of temperatures because different particles in the mixture need different amounts of energy to break free. A sharp melting point is a key test of purity."},{"stem":"In paper chromatography, what is the mobile phase?","A":"The chromatography paper","B":"The pencil baseline","C":"The solvent that moves up the paper carrying the dissolved substances","D":"The coloured spot on the chromatogram","correct":"C","explain":"The mobile phase is the solvent (e.g. water or ethanol) that moves up the paper. It carries dissolved substances with it. The stationary phase is the paper (or the thin film of water held within it), which stays still. Substances separate because they travel different distances depending on their attraction to each phase."},{"stem":"Why must the baseline on a chromatography paper be drawn in pencil rather than ink?","A":"Ink marks would not show up after the solvent runs","B":"Pencil graphite is insoluble in the solvent so it stays in place; ink would dissolve and travel up the paper, contaminating the chromatogram","C":"Pencil is easier to see under UV light","D":"Ink would react chemically with the solvent","correct":"B","explain":"Pencil is made of graphite, which is insoluble in water and most organic solvents. If the baseline were drawn in ink, the ink dyes would dissolve in the mobile phase, travel up the paper and appear as extra spots, ruining the experiment."},{"stem":"Which separation technique would you use to obtain pure water from a salt solution?","A":"Filtration","B":"Paper chromatography","C":"Crystallisation","D":"Simple distillation","correct":"D","explain":"Simple distillation separates a solvent from a dissolved solute. The salt solution is heated; water evaporates, travels through the condenser and is collected as pure distillate. The salt remains in the flask because it does not evaporate at that temperature. Filtration only removes insoluble solids, salt is dissolved and would pass straight through."},{"stem":"What are the three stages used to treat waste and ground water to make it safe to drink?","A":"Boiling, filtering, chlorinating","B":"Sedimentation, filtration, chlorination","C":"Distillation, evaporation, sterilisation","D":"Screening, chromatography, condensation","correct":"B","explain":"Waste and ground water is treated in three stages: (1) sedimentation, large insoluble particles settle out; (2) filtration, smaller insoluble particles removed by passing through sand/gravel beds; (3) chlorination, chlorine added to kill bacteria and microbes. The result is potable (safe to drink) water."},{"stem":"Which of these is an example of sublimation?","A":"Ice melting into water","B":"Water evaporating from a puddle","C":"Solid carbon dioxide (dry ice) turning directly into carbon dioxide gas without melting","D":"Steam condensing on a cold window","correct":"C","explain":"Sublimation is the change of state directly from solid to gas, without passing through the liquid state. Solid CO₂ (dry ice) sublimes at −78 °C. Iodine also sublimes when gently heated. It is the reverse of deposition."},{"stem":"What is potable water?","A":"Water that contains only H₂O molecules with no dissolved salts","B":"Water that has been distilled to remove all impurities","C":"Water that is safe to drink, with low levels of dissolved salts and microbes","D":"Water that has been purified so it has a sharp boiling point of exactly 100 °C","correct":"C","explain":"Potable water is safe to drink, the key word is safe, not pure. Potable water usually still contains dissolved salts (e.g. calcium, sodium, chloride ions) at low concentrations. It is not the same as chemically pure water, which contains only H₂O and no dissolved substances."},{"stem":"In which state do particles have the highest relative energy?","A":"Solid","B":"Liquid","C":"Gas","D":"All states have the same energy","correct":"C","explain":"Gas particles have the highest relative energy because they have enough kinetic energy to overcome the forces of attraction between particles completely and move freely in random directions. Solid particles have the lowest relative energy (vibrating in fixed positions), liquid particles are in between."},{"stem":"What is the Rf value used to measure in paper chromatography?","A":"The rate of flow of the solvent through the paper","B":"The ratio of the distance moved by a substance to the distance moved by the solvent front","C":"The relative mass of the substance being identified","D":"The time taken for a substance to travel to the top of the paper","correct":"B","explain":"Rf = distance moved by substance ÷ distance moved by solvent front. Both distances are measured from the baseline. Rf values are always between 0 and 1, and have no units. The same substance in the same solvent always gives the same Rf value."},{"stem":"A mixture is different from a pure compound because:","A":"A mixture always contains metals; a compound always contains non-metals","B":"A mixture's components are chemically combined; a compound's are not","C":"A mixture can be separated by physical methods; a compound can only be split by chemical reactions","D":"A mixture has a higher melting point than a pure compound","correct":"C","explain":"In a mixture, the components are not chemically combined, there are no bonds between them. This means physical methods (distillation, filtration, chromatography) can separate them. A compound requires a chemical reaction to break the bonds between its elements."},{"stem":"What happens to the temperature of a pure substance during melting, when plotted on a heating curve?","A":"It continues to rise steadily throughout","B":"It drops momentarily then rises again","C":"It remains constant (a flat plateau) while the substance melts","D":"It rises to the melting point then drops to zero","correct":"C","explain":"During melting, the energy supplied to a pure substance goes into breaking the forces between particles, not into raising the temperature. So the temperature stays constant (a flat horizontal plateau on a heating curve) until all the solid has melted. This flat plateau is a fingerprint of a pure substance."},{"stem":"Why is sea water made potable by distillation rather than by the sedimentation-filtration-chlorination process?","A":"Sea water contains too many microbes for chlorination to work","B":"Sea water contains dissolved salts that cannot be removed by filtration or chlorination, only distillation can remove dissolved substances","C":"Sea water is too warm to use in a settling tank","D":"Chlorination would react with the salt in sea water to form toxic products","correct":"B","explain":"Sedimentation and filtration only remove insoluble particles (they cannot remove dissolved salts). Chlorination kills microbes but does not remove dissolved substances. Sea water's dissolved salts can only be removed by distillation, boiling away the pure water vapour and leaving the salts behind."},{"stem":"What does filtration separate?","A":"Two liquids with different boiling points","B":"A dissolved solid from a solution","C":"An insoluble solid from a liquid","D":"Coloured dyes from an ink","correct":"C","explain":"Filtration separates an insoluble solid (the residue) from a liquid (the filtrate). The solid particles are too large to pass through the filter paper; the liquid passes through freely. It cannot separate dissolved substances, a dissolved salt would pass through the filter along with the water."},{"stem":"Which of these substances is a pure substance in the chemistry sense?","A":"Sea water","B":"Air","C":"Orange juice","D":"Distilled water","correct":"D","explain":"Distilled water is chemically pure, it contains only H₂O molecules. Sea water, air and orange juice are all mixtures containing multiple different chemical substances. The everyday label \"pure\" (e.g. \"pure orange juice\") does not mean chemically pure."},{"stem":"In simple distillation, where must the thermometer bulb be positioned, and why?","A":"Submerged in the boiling liquid, to measure the liquid temperature directly","B":"At the top of the condenser, to measure how hot the distillate is","C":"Halfway up the condenser tube","D":"At the side-arm exit, so it reads the temperature of the vapour leaving the flask","correct":"D","explain":"The thermometer must measure the temperature of the vapour about to enter the condenser, not the boiling liquid below. This tells you which substance is currently distilling over (identified by its boiling point). If the bulb is submerged in the liquid, you measure the wrong temperature and lose the ability to identify what is being collected."},{"stem":"What is crystallisation used to obtain from a solution?","A":"A pure liquid solvent","B":"A pure solid solute","C":"A mixture of gases","D":"An insoluble solid residue","correct":"B","explain":"Crystallisation is used to recover a dissolved solid (solute) from solution. The solution is evaporated slowly until it becomes saturated, then cooled, the solute crystallises out as pure solid crystals. It is the opposite approach to distillation (which recovers the solvent instead)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
