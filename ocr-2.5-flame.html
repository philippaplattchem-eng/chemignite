<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2.5 Shapes of Molecules and Ions | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>2.5 Shapes of Molecules and Ions</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>7 questions</span>
    <span>Flame: Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the shape and bond angle of water (H₂O)?","A":"Tetrahedral, 109.5°","B":"Linear, 180°","C":"Trigonal pyramidal, 107°","D":"Bent (non-linear), 104.5°","correct":"D","explain":"O in H₂O has 2 bonded pairs + 2 lone pairs = 4 electron regions → underlying tetrahedral geometry. Each lone pair compresses the bond angle by ~2.5°: 109.5° − 2(2.5°) = 104.5°. The shape is called \"bent\" or \"non-linear\" (not \"V-shaped\" — OCR accepts both \"bent\" and \"non-linear\"). The lone pairs are not shown in the shape name but cause the bond angle to be smaller than in NH₃ (107°) or CH₄ (109.5°)."},{"stem":"Phosphorus pentachloride (PCl₅) has no lone pairs on the central phosphorus atom. Predict its shape and bond angle(s).","A":"Tetrahedral, 109.5°","B":"Trigonal bipyramidal, 90° and 120°","C":"Octahedral, 90°","D":"Square planar, 90°","correct":"B","explain":"P in PCl₅ has 5 bonded pairs and 0 lone pairs → 5 electron regions → trigonal bipyramidal geometry. Three \"equatorial\" Cl atoms sit in a plane at 120° to each other; two \"axial\" Cl atoms sit perpendicular to this plane at 90° to the equatorial bonds. OCR accepts either bond angle (90° or 120°) in response to \"state the bond angle in PCl₅\". This is one of only two shapes at A Level with two different bond angles."},{"stem":"Both CO₂ and SO₂ contain polar bonds. Which molecule is polar overall, and why?","A":"Both are polar — any molecule with polar bonds must have a net dipole","B":"Neither is polar — the bond dipoles cancel in symmetrical arrangements","C":"CO₂ is polar; SO₂ is non-polar because it has fewer electrons","D":"SO₂ is polar; CO₂ is non-polar because the linear shape causes its bond dipoles to cancel exactly","correct":"D","explain":"CO₂ is linear (C has 2 bonded regions, 0 lone pairs, 180°) — the two C=O bond dipoles point in opposite directions and cancel → net dipole = 0 → non-polar. SO₂ has a bent shape (S has 2 bonded pairs + 1 lone pair = 3 regions, bond angle ~119°) — the two S=O dipoles point at an angle and do not cancel → net dipole ≠ 0 → polar. Polarity requires both polar bonds AND asymmetric molecular geometry."},{"stem":"Fluorine (χ = 4.0) has a higher electronegativity than iodine (χ = 2.5), despite both being in Group 17. Which explanation is correct?","A":"Fluorine has fewer protons, so the nuclear charge pulls the bonding pair more efficiently","B":"Fluorine has a smaller atomic radius and less inner-shell shielding, so the bonding pair sits closer to a nucleus with a high effective nuclear charge","C":"Iodine's additional electrons repel the bonding pair away from the nucleus","D":"Fluorine's bond enthalpies are lower, making it easier for the bonding pair to sit closer","correct":"B","explain":"Electronegativity decreases down Group 17 because: (1) atomic radius increases (more electron shells) so the bonding pair sits further from the nucleus; and (2) inner-shell shielding increases (more filled shells) so the effective nuclear charge felt by the bonding pair decreases. Both effects weaken the pull on the bonding pair. Going from F to I, both factors act in the same direction — a large decrease in electronegativity."},{"stem":"Rank the halogens F₂, Cl₂, Br₂, I₂ in order of increasing boiling point, and identify the intermolecular force responsible.","A":"F₂ < Cl₂ < Br₂ < I₂; induced dipole–dipole (London) forces","B":"F₂ < Cl₂ < Br₂ < I₂; permanent dipole–dipole forces","C":"I₂ < Br₂ < Cl₂ < F₂; induced dipole–dipole forces","D":"F₂ < Cl₂ < Br₂ < I₂; van der Waals forces","correct":"A","explain":"All four halogens are non-polar diatomic molecules — the only IMF between them is London (induced dipole–dipole) forces. As you go down the group, the number of electrons per molecule increases (F₂: 18e; Cl₂: 34e; Br₂: 70e; I₂: 106e), so instantaneous dipoles are larger and induced dipoles are stronger. More energy is required to separate the molecules → higher boiling point. Option D uses the rejected term \"van der Waals\". Option B incorrectly names the force (non-polar molecules have no permanent dipole)."},{"stem":"HF (Mr = 20, bp = +19°C) has a considerably higher boiling point than HCl (Mr = 36.5, bp = −85°C). Explain why the \"heavier molecule has higher boiling point\" trend is reversed here.","A":"HF has stronger permanent dipole-dipole forces because F is much more electronegative than Cl","B":"HF molecules form hydrogen bonds (H bonded to F; lone pair on F of adjacent molecule); HCl molecules cannot form hydrogen bonds because Cl is not sufficiently electronegative","C":"HCl has more electrons per molecule, but these create repulsive interactions that reduce its boiling point","D":"HF molecules are smaller, so they pack more tightly, increasing the London forces beyond those in HCl","correct":"B","explain":"Hydrogen bonding requires H directly bonded to N, O, or F. F (χ = 4.0) qualifies; Cl (χ = 3.0) does not. In liquid HF, molecules are linked by H–F···F hydrogen bonds, which are much stronger than the permanent dipole-dipole + London forces in liquid HCl. Despite HCl having more electrons (and therefore stronger London forces than HF), the hydrogen bonding in HF dominates and raises its boiling point far above HCl's."},{"stem":"n-Pentane (bp = 36°C) has a higher boiling point than 2,2-dimethylpropane / neopentane (bp = 9.5°C), yet both have molecular formula C₅H₁₂. What is the correct explanation?","A":"n-Pentane has a higher molar mass than neopentane","B":"n-Pentane has more lone pairs than neopentane, leading to stronger intermolecular attractions","C":"n-Pentane has a straight-chain shape that allows greater surface contact with neighbouring molecules, strengthening London forces","D":"Neopentane is a polar molecule with weaker permanent dipole-dipole forces than n-pentane","correct":"C","explain":"Both isomers have Mr = 72 and the same number of electrons per molecule (42), so their London force potential is the same. The difference is molecular shape. n-Pentane's straight chain can lie along the full length of a neighbouring molecule, maximising the area of close contact and the overlap of instantaneous dipoles. Neopentane is nearly spherical and contacts neighbours at only a few points. Greater surface contact → stronger London forces → higher boiling point. This is a classic OCR shape vs. surface area question."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
