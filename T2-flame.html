<head>

<title>T2 Flame &mdash; States of Matter & Mixtures</title>
<style>:root{--pr:#3f51b5;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(63,81,181,.10);--sh2:0 6px 24px rgba(63,81,181,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}

.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}

/* ── tier legend ── */

.tl-desc{font-size:.78rem;color:var(--txm)}

.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}

.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}

.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}

.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(63,81,181,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(63,81,181,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(92,107,192,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>

<main>

  </div>

<script>
const QUESTIONS=[{"stem":"A gas can be compressed by applying pressure, but a solid cannot. Explain why, using the particle model.","A":"Gas particles are lighter than solid particles so they can be pushed closer together","B":"Gas particles have large gaps between them that can be reduced; solid particles are already touching with no gaps to compress","C":"Gas particles have no forces of attraction so they just disappear when compressed","D":"Solid particles are bonded together with covalent bonds that prevent compression","correct":"B","explain":"In a gas, particles are far apart with large gaps between them. Applying pressure pushes the particles closer together, the gaps are reduced. In a solid, the particles are already touching, there are no gaps to close, so the solid cannot be compressed. This is why gases are used in pneumatic systems but solids are not."},{"stem":"A student measures the melting point of two samples: Sample X melts sharply at 80 °C. Sample Y melts gradually between 65 °C and 78 °C. What can be concluded?","A":"Sample X is impure; Sample Y is pure","B":"Both samples are impure because neither melts at exactly the same temperature","C":"Sample X is pure (one fixed melting point); Sample Y is impure or a mixture (melts over a range)","D":"Sample X must be water; Sample Y must be a mixture of water and salt","correct":"C","explain":"A sharp, fixed melting point indicates a pure substance. A melting range, especially one starting below the literature value, indicates a mixture or impure sample. Sample X melts at one temperature → pure. Sample Y melts gradually → impure/mixture. Note: a sharp melting point only confirms purity, not identity."},{"stem":"A sample of rock salt contains sand (insoluble) and sodium chloride (soluble in water). Which combination of techniques would separate and recover pure dry sodium chloride crystals?","A":"Filtration only","B":"Distillation then filtration","C":"Filtration to remove sand, then crystallisation to recover NaCl","D":"Chromatography then evaporation","correct":"C","explain":"Step 1, dissolve in water and filter: sand (insoluble) is caught by the filter; NaCl solution (filtrate) passes through. Step 2, evaporate/crystallise the filtrate: NaCl crystallises as the water evaporates. Distillation would work to recover the water, but crystallisation recovers the solid NaCl, which is what you want."},{"stem":"A chromatogram shows that an ink sample produces three spots. The solvent front travelled 9.0 cm. One spot travelled 3.0 cm. What is the Rf value of that spot?","A":"3.0","B":"0.33","C":"27","D":"0.67","correct":"B","explain":"Rf = distance moved by substance ÷ distance moved by solvent front = 3.0 ÷ 9.0 = 0.33. Rf values are always between 0 and 1 with no units. A value of 3.0 is impossible, it would mean the substance travelled further than the solvent, which cannot happen."},{"stem":"A student runs a chromatogram with three reference dyes (Red, Blue, Green) and an unknown ink sample. The ink produces two spots, one at the same height as the Blue reference and one at the same height as the Green reference. What can be concluded?","A":"The ink contains Red and Blue dye","B":"The ink contains Blue and Green dye","C":"The ink is a pure substance because it only produces two spots","D":"The ink contains all three dyes but Red was too light to see","correct":"B","explain":"In chromatography, a component of the unknown is identified when its spot matches the Rf value (and colour) of a known reference. The unknown's spots align with Blue and Green → the ink contains Blue and Green dye. Red is not present, no spot appeared at that height. Two spots mean the ink is a mixture (not a pure substance)."},{"stem":"Tap water is potable but not chemically pure. A student says \"they mean the same thing.\" Explain why the student is wrong.","A":"Tap water is sometimes pure, sometimes not, depending on the source","B":"Potable means safe to drink (low levels of dissolved salts and microbes); pure means only H₂O, tap water contains dissolved ions so it is not chemically pure, even though it is safe to drink","C":"Potable water must be distilled; pure water can be taken directly from a spring","D":"Chemically pure water would be harmful to drink because it contains nothing the body needs","correct":"B","explain":"Potable (safe to drink) and chemically pure (only H₂O) are two different standards. Tap water contains dissolved calcium, sodium, chloride and other ions, it is not a single chemical species so it is not chemically pure. But those ions are at safe concentrations, so tap water is potable. The student is confusing safety with chemical purity."},{"stem":"During simple distillation of sea water, the thermometer reads 100 °C and remains steady for several minutes. What does this tell you?","A":"The sea water is boiling and the salt is also vaporising at this temperature","B":"The apparatus is faulty, the temperature should keep rising","C":"Pure water is distilling over; 100 °C is the boiling point of water and it stays constant while only water vapour is passing the thermometer","D":"The sea water has become chemically pure and no further separation is possible","correct":"C","explain":"The thermometer at the side-arm reads the boiling point of the substance currently distilling. Water boils at 100 °C, and while only water vapour is passing, the temperature stays constant. The dissolved salts do not evaporate and remain in the flask. A steady reading at 100 °C confirms pure water is being collected."},{"stem":"A mixture of two miscible liquids (ethanol boiling point 78 °C; water boiling point 100 °C) needs to be separated. Which technique is most appropriate and why?","A":"Filtration, because one liquid is denser than the other","B":"Paper chromatography, because the liquids have different colours","C":"Fractional distillation, because the two liquids have different but relatively close boiling points and both are volatile","D":"Crystallisation, because one liquid will crystallise on cooling","correct":"C","explain":"Two miscible liquids with different boiling points are separated by fractional distillation. The column of glass beads provides a temperature gradient, the lower-boiling ethanol (78 °C) reaches the top and distils over first; water (100 °C) condenses back down the column and distils later. Simple distillation would not give a pure separation because the boiling points are close."},{"stem":"Explain why a mixture of sand and water melts over a range of temperatures rather than at one fixed point.","A":"Sand and water react together, forming a compound with no fixed melting point","B":"Sand is a conductor so it changes the electrical properties of the mixture","C":"Sand and water are different substances held together by different forces; different particles break free at different temperatures, so melting is gradual rather than at one fixed temperature","D":"The melting point of water is 0 °C but sand melts at 1710 °C so the mixture cannot have a single melting point","correct":"C","explain":"In a mixture, different particles interact by different forces and therefore need different amounts of energy to break free. Some sand-water interactions are disrupted at lower temperatures, others at higher temperatures, so the mixture gradually softens over a range rather than melting sharply. This is the particle-level reason why all mixtures melt over a range."},{"stem":"Why must the sample spots in chromatography be placed above the level of the solvent in the tank?","A":"Spots placed below the solvent would not be visible after the experiment","B":"If the spots were in the solvent, the sample would dissolve directly into the tank solvent rather than being carried up the paper, no separation would occur","C":"The solvent cannot flow upwards if the baseline is submerged","D":"Organic solvents would react with the paper if the baseline touched them","correct":"B","explain":"The whole principle of paper chromatography relies on the solvent rising up through the paper and carrying the substances with it. If the baseline dips into the solvent, the sample spots dissolve straight into the bulk solvent, they spread everywhere and cannot be separated. The baseline must be above the solvent level."},{"stem":"Water used in chemical analysis must not contain dissolved salts. Why is tap water unsuitable for analysis, even though it is potable?","A":"Tap water is too acidic for use in analysis","B":"Tap water contains dissolved ions that would interfere with chemical tests and give incorrect results","C":"Tap water has been chlorinated, which would harm the chemicals being tested","D":"Tap water is too warm for use in analytical experiments","correct":"B","explain":"Chemical analysis depends on knowing exactly what is in a solution. Tap water contains dissolved calcium, sodium, chloride and other ions. These ions would interfere with tests, for example, adding a reagent to detect chloride ions would give a false positive if chloride is already present in the water. Distilled or deionised water (containing only H₂O) must be used so that no extra ions are introduced."},{"stem":"A student leaves the chromatography tank unsealed during an experiment. Suggest one problem this would cause.","A":"The solvent would travel down the paper instead of up","B":"The spots would react with oxygen in the air","C":"Solvent would evaporate from the paper as it rises, making the solvent front uneven and producing distorted spots","D":"The paper would dry out completely before the solvent reached the baseline","correct":"C","explain":"The tank is sealed to keep the air inside saturated with solvent vapour. If unsealed, solvent evaporates from the paper as quickly as it rises, this makes the solvent front uneven and the separation unreliable. The spots appear distorted and Rf values cannot be calculated accurately."},{"stem":"A student heats a sample and records temperature against time. At 55 °C the graph shows a flat plateau lasting 4 minutes, then the temperature continues to rise. What is happening during the plateau?","A":"The substance is cooling down before it continues to heat up","B":"The thermometer has stopped working temporarily","C":"The substance is melting, all the energy supplied is breaking the forces between particles and the temperature cannot rise until all the solid has melted","D":"The substance is reacting chemically and releasing energy","correct":"C","explain":"A flat plateau on a heating curve at the melting point means the substance is a pure substance melting at 55 °C. All the energy from the heat source goes into breaking the forces between particles (changing state) rather than raising the kinetic energy of the particles (raising temperature). Once all the solid has melted, the temperature begins to rise again."},{"stem":"Chlorination is added as a final step in water treatment. What does it do, and what does it NOT do?","A":"It removes dissolved salts and kills bacteria","B":"It kills bacteria and other microbes, it does NOT remove dissolved salts or insoluble particles","C":"It removes large insoluble particles and also kills bacteria","D":"It makes the water chemically pure by removing all dissolved substances","correct":"B","explain":"Chlorine is a disinfectant, its role is to kill bacteria, viruses and other microbes that would cause disease. It has no effect on dissolved salts (which require distillation to remove) and no effect on insoluble particles (which have already been removed by sedimentation and filtration before chlorination). Chlorination is the sterilisation step, not a purification step."},{"stem":"In paper chromatography, substance A has an Rf value of 0.8 and substance B has an Rf value of 0.3 in the same solvent. Which substance has a stronger attraction to the mobile phase (solvent)?","A":"Substance B, because it travelled a shorter distance","B":"Substance A, because it travelled further up the paper and is therefore more soluble in the solvent","C":"Both substances have the same attraction to the solvent","D":"Neither substance is attracted to the mobile phase; they are attracted only to the paper","correct":"B","explain":"A higher Rf value means the substance travelled further, i.e. it spent more time dissolved in the mobile phase (solvent) rather than adsorbed on the stationary phase (paper). Substance A (Rf = 0.8) is more soluble in the solvent and less attracted to the paper. Substance B (Rf = 0.3) is less soluble in the solvent and more attracted to the paper."},{"stem":"A student wants to collect pure dry salt (NaCl) from rock salt. They only use filtration. What is wrong with this approach?","A":"Filtration produces too small a yield of salt","B":"Filtration works but produces very impure salt","C":"Filtration would remove the sand, but the dissolved NaCl would pass through in the water, the student would need to then evaporate/crystallise the filtrate to recover the salt","D":"Filtration cannot be used on salt because NaCl is insoluble in water","correct":"C","explain":"Filtration separates insoluble from soluble substances, it removes the sand (insoluble residue) but the NaCl dissolves in water and passes through the filter with the water. To recover the NaCl as a solid, the student must then evaporate the water from the filtrate until NaCl crystallises out. Filtration alone is not enough."},{"stem":"Particles in a liquid can flow past each other but cannot easily escape into the gas phase. Explain why, using forces of attraction.","A":"Liquid particles have no kinetic energy so they cannot move fast enough to escape","B":"Liquid particles are chemically bonded to each other so they cannot separate","C":"Liquid particles have enough energy to slide past each other (forces weaker than in a solid) but not enough to overcome the remaining forces of attraction completely and escape into the gas phase","D":"Liquid particles are too heavy to become gas particles without first decomposing","correct":"C","explain":"In a liquid, the forces of attraction between particles are weaker than in a solid (allowing flow) but still significant (preventing escape into the gas phase). To become a gas, a particle must gain enough energy to break free from all the surrounding particles, this requires more energy than just sliding past neighbours. This is why liquids have fixed volume but take the shape of their container."},{"stem":"A student says: \"A substance with Rf = 0.5 has travelled halfway up the paper.\" Is this correct?","A":"No, Rf = 0.5 means the substance has not moved at all","B":"No, Rf = 0.5 means the substance has reached the solvent front","C":"Yes, Rf = 0.5 means the substance has moved exactly half the distance the solvent front moved","D":"No, Rf = 0.5 is impossible because Rf values must be whole numbers","correct":"C","explain":"Rf = distance moved by substance ÷ distance moved by solvent front = 0.5 means the substance moved half as far as the solvent front. For example, if the solvent front is at 10 cm, the substance spot would be at 5 cm. The student is correct. Rf values range from 0 (did not move) to 1 (travelled as far as the solvent front)."},{"stem":"Why is the counter-current direction of cooling water important in a condenser during simple distillation?","A":"Counter-current flow prevents the water from freezing inside the condenser jacket","B":"Counter-current flow means the vapour meets the coldest water last, which would slow down condensation","C":"Counter-current flow means cold water enters at the bottom (near the collection end) and exits at the top (near the flask), this ensures the vapour meets progressively colder water as it travels through the condenser, giving the most efficient cooling","D":"Counter-current direction is simply a convention; the direction does not affect efficiency","correct":"C","explain":"If water flowed in the same direction as the vapour (co-current), the water at the collection end would already be warm, making condensation less efficient there. Counter-current flow keeps the coldest water at the exit end of the vapour, where the vapour has already given up most of its heat and needs the coldest conditions to condense fully. This maximises efficiency."},{"stem":"A student notices that a reference dye and a spot in the unknown sample are at the same height on the chromatogram. Can the student definitely conclude that they are the same substance?","A":"Yes, same height always means same substance in paper chromatography","B":"No, they must also compare the colour of the spots, and ideally confirm with a different solvent, since different substances can have similar Rf values","C":"No, spots must be identical in size as well as height to confirm identity","D":"Yes, same Rf value is a definitive chemical test and no further confirmation is needed","correct":"B","explain":"Two substances with the same Rf in one solvent may be different substances that happen to travel the same distance in that solvent. Proper identification requires (1) matching Rf values AND colours in the same solvent, and ideally (2) repeating in a different solvent. If they still match in both solvents, the identification is much more reliable."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
