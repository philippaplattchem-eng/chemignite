<style>:root{--pr:#7c3aed;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(124,58,237,.10);--sh2:0 6px 24px rgba(124,58,237,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */

.site-header h1{font-size:1rem;font-weight:600;flex:1}

/* ── tier legend ── */

.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#2e1065,#4c1d95 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}

.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#2e1065,#4c1d95 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>

<script>
const QUESTIONS=[{"stem":"Zinc reacts with copper(II) sulfate solution in a displacement reaction. Write the full ionic equation, the two half-equations, and identify which species is the oxidising agent and which is the reducing agent.","A":"Full: Zn + Cu²⁺ → Zn²⁺ + Cu; Half: Zn → Zn²⁺ + 2e⁻ (oxidation); Cu²⁺ + 2e⁻ → Cu (reduction); Zn is reducing agent, Cu²⁺ is oxidising agent","B":"Full: Zn²⁺ + Cu → Zn + Cu²⁺; Half: Cu → Cu²⁺ + 2e⁻ (oxidation); Zn²⁺ + 2e⁻ → Zn (reduction); Cu is reducing agent, Zn²⁺ is oxidising agent","C":"Full: Zn + CuSO₄ → ZnSO₄ + Cu; Half: SO₄²⁻ → SO₄²⁻ (no change); Zn²⁺ is reduced and Cu is oxidised","D":"Full: Zn + Cu²⁺ → ZnCu + 2⁺; Half equations cannot be written for displacement reactions","correct":"A","explain":"Full ionic equation: Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s). Oxidation half: Zn → Zn²⁺ + 2e⁻ (zinc loses electrons → oxidised → zinc is the reducing agent). Reduction half: Cu²⁺ + 2e⁻ → Cu (Cu²⁺ gains electrons → reduced → Cu²⁺ is the oxidising agent). Sulfate ions are spectators and are removed from the ionic equation."},{"stem":"For the equilibrium: 2SO₂(g) + O₂(g) ⇌ 2SO₃(g) (forward reaction is exothermic). Predict the effect on the equilibrium position of: (a) increasing pressure, (b) increasing temperature, (c) removing SO₃.","A":"(a) shifts right; (b) shifts right; (c) shifts right","B":"(a) shifts right; (b) shifts left; (c) shifts right","C":"(a) shifts left; (b) shifts right; (c) shifts left","D":"(a) no change; (b) shifts left; (c) shifts left","correct":"B","explain":"(a) Pressure: left = 2+1 = 3 mol gas; right = 2 mol gas. Increasing pressure → shifts toward fewer moles of gas → right → more SO₃. (b) Temperature: forward reaction is exothermic. Increasing T → system opposes by shifting in endothermic direction → left → less SO₃, lower yield. (c) Removing SO₃: removing a product → system opposes by making more product → shifts right → more SO₃ produced. This is the basis of the Contact Process for making sulfuric acid."},{"stem":"Evaluate the advantages and disadvantages of phytomining compared to traditional smelting for a copper-rich site. Consider environmental, economic and social factors.","A":"Phytomining is better in all respects, no disadvantages","B":"Phytomining advantages: lower energy use, works on low-grade soil unsuitable for smelting, less landscape destruction, less CO₂ emission; disadvantages: very slow (seasons/years), requires large land area, not suitable for all metal types, produces much smaller quantities of metal per year than smelting","C":"Phytomining disadvantages outweigh advantages, it is always less efficient and more expensive than smelting","D":"Phytomining and smelting have identical environmental impacts","correct":"B","explain":"Advantages: uses no fossil fuels for heat (energy-efficient); suitable for low-grade contaminated soils (bioremediation); less CO₂; small visual/landscape impact. Disadvantages: very slow (months to years per harvest cycle); requires large area of land per tonne of metal; restricted to certain climates; production quantities are much lower than smelting. Social factor: provides minimal employment in comparison to a smelter. Best suited as a supplementary method for low-grade/contaminated sites, not as a primary extraction method for bulk production."},{"stem":"A student claims that doubling the pressure in the Haber process doubles the yield of ammonia. Critically evaluate this claim.","A":"Correct, doubling pressure always doubles yield in the Haber process","B":"Incorrect, doubling pressure shifts the equilibrium toward more ammonia (because it favours the fewer-moles side), but the yield does not double; the relationship between pressure and yield is non-linear and depends on the equilibrium constant at that temperature","C":"Incorrect, doubling pressure would shift equilibrium to the left, reducing yield","D":"Correct, the yield doubles because the concentration of all gases doubles when pressure doubles","correct":"B","explain":"Increasing pressure does shift the equilibrium toward ammonia (fewer moles side), increasing yield. However, the relationship is not linear, it follows from the equilibrium constant expression, and yield approaches a limit. Additionally, higher pressures require much stronger (and more expensive) reaction vessels and increase energy costs. Doubling pressure roughly increases yield but certainly not by a factor of two. The industrial 200 atm is already a carefully optimised compromise."},{"stem":"Iron is extracted using carbon, but the actual reducing agent in the blast furnace is carbon monoxide (CO) formed when carbon reacts with oxygen. Write the equation for the reduction of iron(III) oxide (Fe₂O₃) by CO, and identify which species is oxidised and which is reduced.","A":"Fe₂O₃ + 3CO → 2Fe + 3CO₂; CO is reduced (gains oxygen → forms CO₂); Fe₂O₃ is oxidised (loses oxygen → forms Fe)","B":"Fe₂O₃ + 3CO → 2Fe + 3CO₂; Fe₂O₃ is reduced (loses oxygen → Fe); CO is oxidised (gains oxygen → CO₂)","C":"Fe₂O₃ + 3C → 2Fe + 3CO₂; carbon is oxidised; iron oxide is reduced","D":"Fe₂O₃ + CO → FeO + CO₂; this is a partial reduction only; full reduction is impossible with CO","correct":"B","explain":"Fe₂O₃ + 3CO → 2Fe + 3CO₂. Fe₂O₃ loses oxygen → iron oxide is REDUCED (oxygen definition of reduction). CO gains oxygen → CO is OXIDISED (oxygen definition of oxidation). CO is the reducing agent (it causes Fe₂O₃ to be reduced). This reaction also works in electron terms: Fe³⁺ + 3e⁻ → Fe (reduction at the atomic level). Both definitions give the same conclusion."},{"stem":"The equilibrium constant for the Haber process decreases as temperature increases. What does this tell us about the forward reaction (exothermic or endothermic), and how does it relate to the industrial conditions?","A":"A decreasing Kc with temperature means the forward reaction is endothermic, this is why high temperature is used industrially","B":"A decreasing Kc with temperature means the forward reaction is exothermic (higher T favours the reverse endothermic reaction, reducing product yield); industrially, 450 °C is a compromise, low enough for reasonable yield but high enough for acceptable rate","C":"A decreasing Kc with temperature means the catalyst becomes less effective at higher temperatures","D":"A decreasing Kc with temperature means both reactions speed up equally so no net change in yield","correct":"B","explain":"The equilibrium constant Kc = [products] / [reactants] at equilibrium. If Kc decreases as T rises, then equilibrium lies further toward reactants at higher temperatures → less product → forward reaction is exothermic (consistent with Le Chatelier: adding heat to an exothermic reaction pushes equilibrium backward). Industrially, 450 °C represents the compromise: Kc is lower than at room temperature, but rate is fast enough for commercial production."},{"stem":"Design an experiment to determine the order of reactivity of three unknown metals X, Y and Z using displacement reactions. Explain your method and how you would interpret the results.","A":"React each metal with hydrochloric acid, measure gas produced, rank by volume of gas (partially correct but incomplete)","B":"Add each metal to the salt solutions of the other two, and observe which displacements occur; the most reactive metal displaces both others from solution; the least reactive is displaced by both, the results form a consistent ranking","C":"Measure melting points, the lowest melting point is the most reactive","D":"Dissolve each metal in acid and compare rate of fizzing, fastest = most reactive","correct":"B","explain":"Systematic approach: make solutions of salts of X, Y and Z (e.g. X sulfate, Y sulfate, Z sulfate). Add metal X to Y sulfate and Z sulfate; add metal Y to X sulfate and Z sulfate; add metal Z to X sulfate and Y sulfate. If X displaces Y from solution (metal deposits, colour change) then X is more reactive than Y. Record all results in a grid. A consistent ranking emerges: the metal that displaces all others is most reactive; the one displaced by all others is least reactive. You can also react each with dilute acid and rank by rate of hydrogen production."},{"stem":"A mixture of N₂, H₂ and NH₃ gases is maintained in a closed vessel at 450 °C and 200 atm. The mixture is at equilibrium. Explain using particle theory why the concentrations remain constant even though molecules are still reacting.","A":"At equilibrium, molecules stop colliding so no further reactions occur","B":"At equilibrium, the rate of the forward reaction (N₂ + 3H₂ → 2NH₃) exactly equals the rate of the reverse reaction (2NH₃ → N₂ + 3H₂), so every NH₃ molecule formed is matched by one NH₃ molecule decomposing, net concentrations remain constant","C":"At equilibrium, all reactant molecules have been converted to products, so concentrations are stable","D":"Concentrations remain constant because the vessel is closed and no molecules can escape","correct":"B","explain":"Dynamic equilibrium is a kinetic balance, not a static state. N₂ and H₂ continue to collide and form NH₃ (forward reaction). NH₃ molecules continue to collide and decompose into N₂ and H₂ (reverse reaction). When these two rates are equal, the number of NH₃ molecules formed per second equals the number decomposed per second → no net change in concentration. Closing the vessel prevents loss of material but does not cause equilibrium, the equal rates cause it."},{"stem":"A student electrolyses molten aluminium oxide to extract aluminium. Write the half-equation for the cathode reaction, calculate the number of moles of electrons needed to produce 1 mole of aluminium, and link this to why aluminium extraction is expensive.","A":"Cathode: Al³⁺ + 3e⁻ → Al; 3 mol electrons per mol Al; large electron flow = large electrical energy needed","B":"Cathode: Al + 3e⁻ → Al³⁺; 3 mol electrons per mol Al; this is a reduction","C":"Cathode: 2Al³⁺ + 6e⁻ → 2Al; 6 mol electrons per mol Al","D":"Cathode: Al³⁺ → Al + 3e⁻; 3 mol electrons released, not consumed","correct":"A","explain":"Cathode: Al³⁺ + 3e⁻ → Al. Each Al³⁺ ion needs 3 electrons to be reduced to neutral Al. For 1 mol of Al: 3 mol of electrons are needed. 1 mole of electrons = 96 485 coulombs (1 Faraday). So 3 mol electrons = 289 455 C of charge. Energy (J) = charge × voltage, the enormous charge requirement, plus the need to maintain very high temperatures to keep Al₂O₃ molten (~2000 °C), makes electrolytic extraction extremely energy-intensive and expensive."},{"stem":"Evaluate the claim: \"Recycling metals is always better for the environment than extracting new metal from ore.\"","A":"Correct, recycling is always environmentally superior with no exceptions","B":"Largely correct but not always: recycling usually requires significantly less energy and produces less CO₂ than primary extraction; however, collection, transport, sorting and reprocessing all have environmental costs; for some metals the recycling infrastructure does not yet exist at scale; and contamination can reduce the quality of recycled metal","C":"Incorrect, recycling produces more CO₂ than primary extraction because of the transport involved","D":"Correct, but only for iron and aluminium; other metals cannot be recycled without losing their properties","correct":"B","explain":"Benefits of recycling: far less energy (aluminium recycling uses ~5% of the energy of electrolysis; steel recycling uses ~25% of the energy of blast furnace production); less CO₂; less land disturbance from mining; conserves finite ore reserves. Limitations: collection and sorting has carbon footprint; not all alloys can be easily separated and reused at full specification; some metals (e.g. rare earth elements in electronics) are present in small quantities that are difficult and uneconomical to recycle currently. Overall, recycling is better for most metals in most situations, but it is not unconditionally \"always better.\""},{"stem":"In the Contact Process for making sulfuric acid, the reaction 2SO₂ + O₂ ⇌ 2SO₃ is used. The forward reaction is exothermic. The industrial conditions are ~450 °C and ~2 atm with a vanadium pentoxide catalyst. Using Le Chatelier's principle, predict and explain the effect on yield of: (a) increasing pressure further, and (b) using a lower temperature.","A":"(a) Higher pressure increases yield by shifting toward fewer mol of gas (right); (b) lower temperature increases yield because forward reaction is exothermic","B":"(a) Higher pressure decreases yield; (b) lower temperature decreases yield","C":"(a) Higher pressure has no effect (same mol each side); (b) lower temperature increases rate and yield equally","D":"(a) Higher pressure decreases yield by favouring SO₂ decomposition; (b) lower temperature shifts left","correct":"A","explain":"(a) Left side: 2 + 1 = 3 mol gas. Right: 2 mol gas. Higher pressure → shifts toward fewer moles (right) → more SO₃ → higher yield. Industrially only ~2 atm is used because the yield is already high (~98%) at this pressure and higher pressures increase equipment cost. (b) Forward reaction is exothermic → lower temperature shifts equilibrium right (toward product) → higher yield. But lower temperature also slows the rate → the catalyst is essential at 450 °C to maintain acceptable reaction rate. Both responses are examples of Le Chatelier's principle in industrial optimisation."},{"stem":"A student sets up three displacement experiment pairs: (1) silver + magnesium sulfate, (2) copper + zinc sulfate, (3) iron + copper sulfate. Predict which reactions occur, explain why, and rank all four metals from most to least reactive.","A":"(1) no reaction; (2) no reaction; (3) reaction; order: Mg > Zn > Fe > Cu > Ag (incomplete, Ag position unclear from these experiments alone)","B":"(1) no reaction (Ag less reactive than Mg); (2) no reaction (Cu less reactive than Zn); (3) reaction (Fe more reactive than Cu); order: Mg > Zn > Fe > Cu, with Ag below Cu","C":"(1) reaction; (2) reaction; (3) no reaction, the more reactive metal is always displaced","D":"(1) no reaction; (2) reaction; (3) no reaction; order cannot be determined from these experiments","correct":"B","explain":"(1) Silver + MgSO₄: Mg is more reactive than Ag → Ag cannot displace Mg → no reaction. (2) Copper + ZnSO₄: Zn is more reactive than Cu → Cu cannot displace Zn → no reaction. (3) Iron + CuSO₄: Fe is more reactive than Cu → Fe displaces Cu → reaction occurs. From these three results: Mg > Zn and Fe > Cu. We know Zn > Fe (from reactivity series), giving: Mg > Zn > Fe > Cu, with Ag below Cu (established by separate experiment). Ranking: Mg > Zn > Fe > Cu > Ag."},{"stem":"Explain why the iron catalyst used in the Haber process is described as a \"heterogeneous catalyst\" and evaluate its role in making the process economically viable.","A":"Heterogeneous means the catalyst is the same phase as the reactants (all gases); it reduces the activation energy so equilibrium is reached faster without changing yield","B":"Heterogeneous means the catalyst is a different phase from the reactants (solid catalyst, gaseous reactants); it reduces the activation energy for both forward and reverse reactions, so equilibrium is reached faster without changing the equilibrium position or yield; this makes the 450 °C temperature commercially viable","C":"Heterogeneous means the catalyst dissolves in the reaction mixture; it increases the equilibrium yield of ammonia","D":"Heterogeneous means the catalyst is made of multiple metals; it works by increasing the temperature of the gas mixture locally","correct":"B","explain":"Heterogeneous catalyst = different phase from reactants (solid iron, gaseous N₂ and H₂). Reactant molecules adsorb onto the iron surface, where bonds are weakened, reducing the activation energy. Both forward and reverse reactions are equally accelerated → equilibrium is reached faster but position is unchanged. Economic importance: without the catalyst, 450 °C would be too slow for commercial production; with the catalyst, equilibrium is reached quickly enough to make the plant economically viable. The catalyst is not consumed and lasts many years."},{"stem":"The leachate from a bioleaching operation contains 0.5 mol/dm³ copper(II) sulfate solution. Calculate the mass of copper that could theoretically be recovered from 10 dm³ of this leachate by displacement with iron. (Cu = 64; equation: Fe + CuSO₄ → FeSO₄ + Cu)","A":"32 g","B":"320 g","C":"64 g","D":"640 g","correct":"B","explain":"Moles of CuSO₄ = concentration × volume = 0.5 × 10 = 5 mol. Equation is 1:1 (Fe : CuSO₄ : Cu), so moles of Cu = 5 mol. Mass of Cu = moles × Ar = 5 × 64 = 320 g. This calculation shows why bioleaching, though slow, can produce significant quantities of copper from a large volume of dilute leachate."},{"stem":"Evaluate whether the Haber process is a \"sustainable\" industrial process, considering raw materials, energy, waste and product use.","A":"Fully sustainable, it uses air and natural gas which are inexhaustible","B":"Partially sustainable: nitrogen from air is indefinitely renewable; hydrogen from methane is not, methane is a fossil fuel producing CO₂ during steam reforming; the process uses large amounts of energy (high T and P); however, the ammonia produced is essential for fertilisers that feed ~50% of the world, making it essential but not truly green; future versions using electrolysis to produce H₂ from water would improve sustainability","C":"Not sustainable because ammonia is used to make explosives","D":"Fully sustainable because the iron catalyst is not consumed and can be used indefinitely","correct":"B","explain":"Nitrogen: from air, sustainable. Hydrogen: from methane (CH₄) via steam reforming: CH₄ + H₂O → CO + 3H₂; CO is converted to CO₂ → a greenhouse gas → not sustainable. Energy: high temperature and pressure are energy-intensive. Waste: unreacted gases are recycled (minimal waste). Product: fertilisers feed ~50% of the world's population, an enormous societal benefit. Sustainability improvements: using \"green hydrogen\" (H₂ from electrolysis powered by renewables) would make the Haber process carbon-neutral. Currently it is essential but has a significant carbon footprint."},{"stem":"A student proposes using gold instead of iron as the catalyst in the Haber process, arguing that gold would not corrode and would last longer. Evaluate this proposal.","A":"Good idea, gold would be a better catalyst because it is more durable","B":"Poor idea, gold is not a suitable catalyst for this reaction (incorrect surface chemistry for N₂ and H₂ adsorption) and is enormously expensive; iron works well as a catalyst, is inexpensive, and lasts many years, the economic and catalytic arguments both favour iron over gold","C":"Poor idea, gold would shift the equilibrium position and reduce the yield of ammonia","D":"Good idea, gold is a better catalyst because it is higher in the reactivity series","correct":"B","explain":"A catalyst must adsorb reactant molecules at the right energy, iron's surface chemistry is well suited to weakening the N≡N triple bond sufficiently for reaction. Gold's surface does not adsorb N₂ and H₂ effectively under Haber conditions → poor catalytic activity. Additionally, gold costs ~50,000 times more per kg than iron, the economic cost would make the process commercially unviable. Iron, promoted with K₂O and Al₂O₃, is the optimal and economically viable catalyst for this reaction."},{"stem":"In a reversible reaction A ⇌ B, the forward reaction is endothermic. Complete a prediction table: what happens to the equilibrium position when (a) temperature is decreased, (b) concentration of A is increased, (c) a catalyst is added?","A":"(a) shifts right; (b) shifts right; (c) shifts right","B":"(a) shifts left; (b) shifts right; (c) no change to position","C":"(a) shifts right; (b) shifts left; (c) shifts right","D":"(a) no change; (b) shifts right; (c) shifts right","correct":"B","explain":"Forward is endothermic → reverse is exothermic. (a) Decreasing T: system opposes by releasing heat → shifts exothermic direction → reverse → shifts LEFT (more A, less B). (b) Increasing [A]: system opposes by consuming A → forward reaction → shifts RIGHT (more B). (c) Adding catalyst: speeds up BOTH forward and reverse equally → equilibrium reached faster → NO CHANGE to position or concentrations at equilibrium. Three different scenarios, three different applications of Le Chatelier's principle."},{"stem":"Aluminium is extracted by electrolysis of molten cryolite (Na₃AlF₆) mixed with aluminium oxide rather than pure molten Al₂O₃. Suggest why.","A":"Cryolite is a better conductor of electricity than aluminium oxide","B":"Al₂O₃ melts at ~2050 °C, a hugely energy-intensive temperature to maintain; dissolving Al₂O₃ in molten cryolite lowers the melting point to around 950 °C, dramatically reducing energy costs while still allowing ionic conduction","C":"Cryolite provides fluoride ions that are essential for depositing aluminium at the cathode","D":"Pure Al₂O₃ would react with the graphite electrodes; cryolite protects the electrodes","correct":"B","explain":"The melting point of pure Al₂O₃ is ~2050 °C. Maintaining this temperature in an industrial cell would require enormous amounts of energy, making the process even more expensive than it already is. Cryolite (Na₃AlF₆) acts as a solvent for Al₂O₃, dissolving it and forming a conductive ionic melt at around 950 °C. This dramatically reduces the energy cost of keeping the electrolyte molten. The Al³⁺ ions from Al₂O₃ are still present in the melt and are still reduced at the cathode."},{"stem":"A student investigates the effect of concentration on the position of equilibrium of the reaction: Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq). The mixture is orange-red in colour. They add more SCN⁻ solution. Predict and explain the colour change.","A":"The solution becomes paler, adding SCN⁻ shifts the equilibrium left, reducing FeSCN²⁺","B":"The solution becomes darker red, adding SCN⁻ increases [SCN⁻], shifting equilibrium right; more FeSCN²⁺ is produced, intensifying the red colour","C":"The solution becomes yellow, Fe³⁺ concentration is unchanged so no colour change occurs","D":"The solution turns colourless, excess SCN⁻ reacts with FeSCN²⁺ to form a colourless product","correct":"B","explain":"Adding SCN⁻ increases its concentration. Le Chatelier: the system opposes by consuming the added SCN⁻ → shifts equilibrium to the right → more FeSCN²⁺ produced. FeSCN²⁺ is the deeply red-coloured species → the solution becomes darker/more intensely red. This is a classic experiment for demonstrating Le Chatelier's principle, changing concentration causes a visible colour change."},{"stem":"Compare the environmental impacts of extracting copper by traditional smelting versus bioleaching, covering energy use, land use, pollution and CO₂ emissions.","A":"Smelting is always better, it is faster and more efficient with fewer by-products","B":"Smelting: high energy use, large CO₂ emissions from burning coke/coal, SO₂ pollution from roasting sulfide ores, large land disturbance from open-cast mining; Bioleaching: lower energy (no high-temperature furnace), less CO₂, but produces acidic leachate that can pollute waterways; slower and covers large land area; better suited to low-grade ores that smelting cannot economically treat","C":"Both methods have identical environmental impacts, they just use different raw materials","D":"Bioleaching always has greater environmental impact because bacteria produce toxins","correct":"B","explain":"Smelting: burns large quantities of fossil fuel → high CO₂; roasting sulfide ores → SO₂ (acid rain precursor); open-cast mining destroys habitats. Bioleaching: no high-temperature furnace → much lower energy and CO₂; however, bacteria produce sulfuric acid in the leachate → acid mine drainage → can kill aquatic organisms if not managed; requires large areas of land and is very slow. Neither method is without environmental cost, bioleaching is generally lower impact for CO₂ and energy, but acid drainage must be carefully managed."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
