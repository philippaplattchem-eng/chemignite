<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>4.3 Alkenes | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>4.3 Alkenes</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What is the shape and bond angle around each carbon of a C=C double bond in an alkene?","A":"Tetrahedral, 109.5°","B":"Trigonal planar, 120°","C":"Linear, 180°","D":"Trigonal pyramidal, 107°","correct":"B","explain":"Each carbon of a C=C has three regions of electron density: the double bond itself (counted as one region, because both the σ and π components join the same pair of atoms), and two single bonds to substituents. Electron-pair repulsion arranges three regions as far apart as possible in a plane, giving trigonal planar geometry with bond angles of 120°. Compare with an alkane carbon (4 regions → tetrahedral, 109.5°). The difference in angle — 120° vs 109.5° — follows directly from having three regions rather than four. All six atoms directly attached to or forming the C=C (the two C atoms and the four substituents) lie in the same plane."},{"stem":"In an addition reaction of an alkene, which bond in the C=C breaks while the other is retained?","A":"The σ-bond breaks; the π-bond is retained","B":"Both the σ-bond and π-bond break","C":"The π-bond breaks; the σ-bond is retained","D":"The C–H bonds break; the C=C is unchanged","correct":"C","explain":"The C=C consists of one σ-bond (head-on orbital overlap, strong, ~348 kJ mol⁻¹ for the C–C component) and one π-bond (sideways p-orbital overlap, weaker, ~272 kJ mol⁻¹). In every addition reaction (hydrogenation, halogenation, HX addition, hydration), only the π-bond breaks. The σ-bond between the two carbons is retained, which is why the two carbons remain connected in the product. Two new σ-bonds form — one to each of the formerly doubly-bonded carbons — and the product is saturated at those carbons."},{"stem":"What is observed when propene gas is shaken with bromine water?","A":"No change; the orange-brown colour is retained","B":"The solution turns dark brown","C":"The orange-brown colour disappears (decolourisation to colourless)","D":"A white precipitate forms","correct":"C","explain":"Bromine adds across the C=C in an electrophilic addition: CH₃CH=CH₂ + Br₂ → CH₃CHBrCH₂Br (1,2-dibromopropane, a colourless liquid). The bromine is consumed; the orange-brown colour of the Br₂ in solution disappears. This is the standard test for unsaturation (C=C or C≡C). An alkane shaken with bromine water under the same conditions (room temperature, dark) shows no colour change because alkanes cannot undergo electrophilic addition — they have no π-bond. Benzene also does not decolourise bromine water at room temperature (unusual stability of its delocalised π-system)."},{"stem":"What conditions are required to convert an alkene into an alcohol by hydration?","A":"Concentrated H₂SO₄, cold, room temperature","B":"Dilute HCl, reflux, with a copper catalyst","C":"Steam (H₂O(g)), H₃PO₄ catalyst, approximately 300°C and 60 atm","D":"Liquid water, NaOH, 200°C","correct":"C","explain":"Hydration of an alkene (addition of steam across C=C) is an industrial route to alcohols. Conditions: steam (not liquid water), a solid H₃PO₄ catalyst (phosphoric acid absorbed on silica), high temperature ~300°C, and high pressure ~60 atm. These conditions are needed because water is a weak electrophile; the acid catalyst supplies H⁺ to make the reaction feasible. This is how most industrial ethanol (CH₃CH₂OH from CH₂=CH₂) is manufactured. The alternative, fermentation, uses yeast enzymes at room temperature on sugar solutions."},{"stem":"What is the correct definition of stereoisomers?","A":"Compounds with the same molecular formula but different structural formulae","B":"Compounds with the same structural formula but different arrangements of atoms in space","C":"Compounds with the same empirical formula and different numbers of carbon atoms","D":"Compounds that have the same functional group but different carbon chain lengths","correct":"B","explain":"Stereoisomers have the same structural formula (the same connectivity — the same bonds between the same atoms) but differ in how those atoms are arranged in three-dimensional space. This contrasts with structural isomers (same molecular formula, different structural formulae — different connectivity). E/Z isomers of alkenes are a type of stereoisomers: but-2-ene's E and Z forms have identical structural formulae (CH₃CH=CHCH₃) but the spatial arrangement of the four substituents around the C=C is different. The term \"arrangement in space\" is the essential distinguishing phrase in the definition."},{"stem":"What is the monomer of the addition polymer –[CH₂–CHCl]ₙ–?","A":"CH₃CHCl₂ (1,1-dichloroethane)","B":"CH₂=CCl₂ (1,1-dichloroethene)","C":"CH₂=CHCl (chloroethene)","D":"CH₂ClCH₂Cl (1,2-dichloroethane)","correct":"C","explain":"To find the monomer from a polymer section: locate the repeat unit (two backbone carbons in brackets), replace the single C–C bond between those two carbons with a C=C double bond, and isolate that unit. The repeat unit –[CH₂–CHCl]– has two backbone carbons: one CH₂ and one CHCl. Replacing the C–C with C=C gives CH₂=CHCl (chloroethene, also called vinyl chloride). The polymer is PVC (poly(vinyl chloride) / poly(chloroethene)). Option B (CH₂=CCl₂) would give –[CH₂–CCl₂]ₙ– with two Cl atoms on one carbon, not one."},{"stem":"Which of the following alkenes shows E/Z isomerism?","A":"Ethene (CH₂=CH₂)","B":"Propene (CH₂=CHCH₃)","C":"But-1-ene (CH₂=CHCH₂CH₃)","D":"But-2-ene (CH₃CH=CHCH₃)","correct":"D","explain":"For E/Z isomerism to exist, both carbons of the C=C must each carry two different groups. Ethene: both carbons have H and H (identical) — no E/Z. Propene: the left C of C=C has H and H (identical) — no E/Z. But-1-ene: the left C of C=C (C1) has H and H (identical) — no E/Z. But-2-ene: C2 has H and CH₃; C3 has H and CH₃ — both carbons have two different groups (H ≠ CH₃). E/Z isomers exist: Z-but-2-ene (both CH₃ same side) and E-but-2-ene (CH₃ groups opposite sides)."},{"stem":"Which statement correctly defines an electrophile?","A":"A species that donates a lone pair of electrons","B":"A species that accepts a lone pair of electrons","C":"A species with an unpaired electron","D":"A species with a permanent dipole moment","correct":"B","explain":"An electrophile is an electron pair acceptor: it is attracted to electron-rich sites (like the π-cloud of an alkene) and forms a new bond by accepting a pair of electrons from that site. Common electrophiles are positively charged ions (H⁺, NO₂⁺) or polar molecules with a δ+ region (the H of HBr; the induced δ+ end of Br₂ approaching a π-bond). A nucleophile (option A) is the electron pair donor. A radical (option C) has one unpaired electron, not a pair. A permanent dipole alone (option D) does not define an electrophile — it must specifically be electron-deficient enough to accept a pair."},{"stem":"What is the product when ethene reacts with hydrogen in the presence of a nickel catalyst at approximately 150°C?","A":"Ethanol (CH₃CH₂OH)","B":"Ethane (CH₃CH₃)","C":"1,2-dibromoethane","D":"Ethene is unchanged; Ni is too mild a catalyst for this reaction","correct":"B","explain":"Hydrogenation: CH₂=CH₂ + H₂ → CH₃CH₃. The π-bond of the C=C breaks and two new C–H σ-bonds form. The product is ethane, a saturated alkane. The Ni catalyst works by adsorbing both H₂ (weakening and breaking the H–H bond) and the alkene (via its π-face) onto the metal surface, then allowing the two adsorbed H atoms to transfer to the alkene carbons. This is heterogeneous catalysis. Industrially, this reaction is used to partially hydrogenate vegetable oils (which contain C=C bonds) to produce margarine: some (not all) C=C bonds are hydrogenated to raise the melting point of the oil."},{"stem":"In addition polymerisation of an alkene, what type of bond in the monomer breaks to initiate chain formation?","A":"A C–H single bond","B":"The C–C σ-bond of the double bond","C":"The π-bond of the C=C double bond","D":"A C–O bond in an ester group","correct":"C","explain":"Addition polymerisation works by opening the C=C double bond: the π-bond breaks in each monomer, and the two electrons previously in the π-bond are used to form new C–C σ-bonds between adjacent monomers. The σ-bond between the two carbons (option B) is retained — it becomes part of the polymer backbone. All atoms from the monomer end up in the polymer; no atoms are lost (unlike condensation polymerisation, which also releases H₂O or HCl). The resulting polymer backbone is a long chain of C–C σ-bonds, making addition polymers chemically inert and resistant to biodegradation."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
