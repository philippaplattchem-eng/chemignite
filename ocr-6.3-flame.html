<title>6.3 Carboxylic Acids and Derivatives | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.3 Carboxylic Acids and Derivatives</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame: Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Why does the –COOH group allow carboxylic acids to form more hydrogen bonds with water than the –OH group of an alcohol?","A":"–COOH is larger and occupies more surface area in contact with water.","B":"–COOH can act as both a hydrogen-bond donor (through the O–H bond) and a hydrogen-bond acceptor (through lone pairs on the C=O oxygen and the C–O–H oxygen), whereas –OH provides only one donor and one acceptor site.","C":"The carbonyl carbon in –COOH is electropositive and attracts water molecules directly.","D":"Carboxylic acids are more soluble because they have higher boiling points.","correct":"B","explain":"The –COOH group contains <b>two electronegative oxygen atoms</b>: (1) the O–H bond provides a δ⁺ H as a <b>hydrogen-bond donor</b> to water; (2) the lone pairs on the C=O oxygen act as a <b>hydrogen-bond acceptor</b> from water; (3) the lone pairs on the C–O–H oxygen also act as an acceptor. A single –COOH can therefore participate in multiple H-bonds simultaneously, making short-chain carboxylic acids (up to ~4 carbons) fully miscible with water. An alcohol –OH offers one donor and one acceptor; –COOH effectively provides \"alcohol + aldehyde\" in one group."},{"stem":"Ethanoic acid reacts with aqueous Na₂CO₃ to give effervescence, but phenol does not react with Na₂CO₃. What is the correct explanation?","A":"Phenol is insoluble in Na₂CO₃ solution.","B":"Ethanoic acid (pKa ≈ 4.8) is a stronger acid than carbonic acid (pKa ≈ 6.4), so it can displace CO₂ from carbonate; phenol (pKa ≈ 10) is weaker than carbonic acid and cannot.","C":"Phenol reacts with Na₂CO₃ but the CO₂ is reabsorbed immediately.","D":"Carboxylic acids react by addition to the C=O of CO₃²⁻; phenols cannot add in this way.","correct":"B","explain":"A stronger acid HA₁ can displace a weaker acid HA₂ from its salt. Ethanoic acid (pKa ≈ 4.8) is stronger than carbonic acid (pKa ≈ 6.4), so: 2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂ is favourable. Phenol (pKa ≈ 10) is weaker than carbonic acid — the equilibrium C₆H₅OH + CO₃²⁻ ⇌ C₆H₅O⁻ + HCO₃⁻ lies far to the left; no CO₂ escapes. This pKa comparison is the key distinction between carboxylic acids and phenols in qualitative analysis."},{"stem":"Methyl propanoate (CH₃CH₂COOCH₃) is heated under reflux with aqueous NaOH. What are the organic products?","A":"Propanoic acid and methanol","B":"Propanol and methanoic acid","C":"Sodium propanoate and methanol","D":"Sodium methanoate and propanol","correct":"C","explain":"Alkaline hydrolysis: CH₃CH₂COOCH₃ + NaOH → <b>CH₃CH₂COO⁻Na⁺ + CH₃OH</b>. The ester linkage is broken; the acyl part (–CH₃CH₂CO–) gives the <b>carboxylate salt</b> (sodium propanoate, CH₃CH₂COONa) and the alkoxy part (–OCH₃) gives the <b>alcohol</b> (methanol, CH₃OH). Under alkaline conditions the carboxylic acid product is immediately deprotonated, giving the carboxylate salt — NOT the free acid (which is the product of acid hydrolysis). Option (A) correctly identifies both organic products but gives the free acid rather than the sodium salt under alkaline conditions."},{"stem":"What is the key practical advantage of using an acid anhydride (e.g. ethanoic anhydride) rather than a carboxylic acid (Fischer method) for esterification?","A":"Acid anhydrides require a concentrated H₂SO₄ catalyst, making the reaction cleaner.","B":"Acid anhydride esterification is faster, irreversible and gives higher yields; the carboxylic acid co-product is stable and non-corrosive compared with the HCl from acyl chloride routes.","C":"Fischer esterification cannot form any esters — only acid anhydrides can.","D":"Acid anhydrides work at room temperature; Fischer esterification requires temperatures above 200 °C.","correct":"B","explain":"Fischer esterification (RCOOH + R'OH ⇌ RCOOR' + H₂O) is reversible with K ≈ 1 — typically only ~50–67% conversion at equilibrium. Acid anhydride esterification ((RCO)₂O + R'OH → RCOOR' + RCOOH) is <b>irreversible</b> because: (i) the anhydride's carbonyl carbons are more electrophilic; (ii) the leaving group is a carboxylate (RCOO⁻) — much better than water (OH⁻). The RCOOH co-product is thermodynamically stable and won't drive the reverse reaction. Option (A) is wrong: acid anhydrides need <b>no catalyst</b>. Option (D) is incorrect about temperatures — Fischer esterification runs under gentle reflux."},{"stem":"Ethanoyl chloride (CH₃COCl) is added to phenol (C₆H₅OH) at room temperature. What is the organic product?","A":"Phenyl methanoate (C₆H₅OOCH)","B":"Phenyl ethanoate (C₆H₅OOCCH₃)","C":"Ethyl phenylate","D":"Chlorophenol (C₆H₄(Cl)(OH))","correct":"B","explain":"CH₃COCl + C₆H₅OH → CH₃COOC₆H₅ + HCl. The acyl group (CH₃CO–, from ethanoyl chloride) is transferred to the phenol oxygen, giving <b>phenyl ethanoate</b> — an aryl ester. The name is: alkyl (or aryl) portion from the alcohol side = phenyl; alkanoate portion from the acid side = ethanoate. Option (A) phenyl methanoate would require methanoyl chloride (HCOCl). Option (D) would require a halogenation of the ring — electrophilic substitution at a ring carbon, not reaction at the –OH group. This reaction is important because Fischer esterification does not work with phenols — the acyl chloride route is the only practical method."},{"stem":"Ethanoic acid is added to black copper(II) oxide (CuO) and the mixture is warmed. Which pair of observations is correct?","A":"Effervescence; solution turns green.","B":"The black solid dissolves; the solution turns blue.","C":"A white precipitate forms immediately.","D":"The solution turns orange and a brown precipitate forms.","correct":"B","explain":"The reaction is: 2CH₃COOH + CuO → (CH₃COO)₂Cu + H₂O. Copper(II) oxide (a black solid) is a basic metal oxide that reacts with the carboxylic acid in an acid–base reaction. Observations: (1) the <b>black solid dissolves</b> as CuO is consumed; (2) the solution turns <b>blue</b> because the copper(II) ethanoate product contains hydrated Cu²⁺ ions, which are blue in solution. No gas is evolved (unlike the carbonate reaction), and no precipitate forms. Option (A) describes K₂Cr₂O₇ reduction or the carbonate reaction. Option (D) describes Tollens' test chemistry."},{"stem":"Why cannot phenol be esterified by the standard Fischer esterification method (carboxylic acid + concentrated H₂SO₄)?","A":"Phenol is too acidic to react with carboxylic acids under acidic conditions.","B":"The lone pair on the phenol oxygen is partially delocalised into the benzene ring, making the oxygen too weakly nucleophilic to attack the carbonyl carbon of a carboxylic acid at a useful rate.","C":"Concentrated H₂SO₄ sulfonates phenol rather than catalysing esterification.","D":"Fischer esterification only proceeds between two carboxylic acids, not between an acid and a phenol.","correct":"B","explain":"In aliphatic alcohols (R–OH), the oxygen lone pair is available for nucleophilic attack on the carbonyl carbon. In phenol (C₆H₅–OH), the oxygen lone pair is <b>partially delocalised into the aromatic π-system</b> (+M effect) — this is the same donation that makes phenol more reactive towards electrophilic substitution, but it also reduces the lone pair's availability for nucleophilic attack on a carbonyl. The combined result: the phenolic oxygen is a poor enough nucleophile that the weakly electrophilic carboxylic acid carbonyl is not attacked at a useful rate. <b>Acyl chlorides</b> (with their more electrophilic carbonyl carbon) can react with phenol readily at room temperature."},{"stem":"Propanoyl chloride (CH₃CH₂COCl) is added to methylamine (CH₃NH₂) at room temperature. What are the products?","A":"Propanamide (CH₃CH₂CONH₂) and HCl","B":"N-methylpropanamide (CH₃CH₂CONHCH₃) and HCl","C":"N-methyl-N-propylamine and CO₂","D":"Propanoic acid and methylamine hydrochloride","correct":"B","explain":"CH₃CH₂COCl + CH₃NH₂ → CH₃CH₂CONHCH₃ + HCl. The nitrogen lone pair of methylamine (a primary amine) attacks the electrophilic carbonyl carbon by nucleophilic addition–elimination; Cl⁻ leaves; HCl forms. The product is <b>N-methylpropanamide</b> — an N-substituted (secondary) amide, where N– prefix indicates the methyl group is on the nitrogen. It is NOT option (A) (propanamide, the primary amide) — that would require excess NH₃, not a methylamine. In practice, a second equivalent of CH₃NH₂ is used to neutralise the HCl by-product as CH₃NH₃⁺Cl⁻."},{"stem":"What is observed when ethanoyl chloride (CH₃COCl) is added dropwise to water?","A":"A silver mirror forms on the inside of the test tube.","B":"A vigorous exothermic reaction occurs; acidic, choking fumes of HCl are released.","C":"An orange/red precipitate forms immediately.","D":"The mixture slowly turns from orange to green over 30 minutes.","correct":"B","explain":"CH₃COCl + H₂O → CH₃COOH + HCl. Acyl chlorides react <b>vigorously</b> with water — even atmospheric moisture — at room temperature. The reaction is fast and exothermic. The HCl produced is a gas at room temperature, so it escapes as <b>acidic, choking fumes</b>. This is why acyl chlorides must be stored in sealed dry containers and handled in a fume cupboard. Options (A) and (C) describe Tollens' and 2,4-DNPH tests respectively. Option (D) describes the dichromate colour change for oxidation of an aldehyde — none of which apply here."},{"stem":"Ethyl ethanoate (CH₃COOC₂H₅) is heated under reflux with hot dilute sulfuric acid (H₂SO₄(aq)). Which two organic products are formed?","A":"Sodium ethanoate and ethanol","B":"Ethanoic acid and ethanol","C":"Ethanoyl chloride and water","D":"Ethanal and ethanoic acid","correct":"B","explain":"Acid hydrolysis reverses esterification: CH₃COOC₂H₅ + H₂O ⇌ <b>CH₃COOH + C₂H₅OH</b> (hot dilute acid, heat under reflux). The ester is split at the –COO– linkage: the acyl part (CH₃CO–) gains an –OH from water to give <b>ethanoic acid</b> (CH₃COOH), and the alkoxy part (–OC₂H₅) gains a H to give <b>ethanol</b> (C₂H₅OH). Under acidic conditions, the free carboxylic acid is formed (not the sodium salt — that is the alkaline hydrolysis product). The reaction is reversible, which is why excess water and/or prolonged reflux is needed for a good conversion."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
