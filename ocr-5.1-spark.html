<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.1 Rates of Reaction | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.1 Rates of Reaction</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"What are the standard units of rate of reaction?","A":"mol s⁻¹","B":"mol dm⁻³ s⁻¹","C":"mol⁻¹ dm³ s⁻¹","D":"dm³ s⁻¹","correct":"B","explain":"Rate of reaction is defined as the change in concentration of a reactant or product per unit time. Concentration has units mol dm⁻³ and time has units s, so rate has units mol dm⁻³ s⁻¹. Option A (mol s⁻¹) gives the *amount* of substance reacted per second — useful in industrial calculations but not the standard definition of rate. Option C (mol⁻¹ dm³ s⁻¹) is the unit of the rate constant k for a second-order reaction, not the unit of rate itself. Option D (dm³ s⁻¹) has no chemical meaning for rate."},{"stem":"How are the orders of reaction with respect to each reactant determined?","A":"From the stoichiometric coefficients in the balanced equation","B":"From the bond enthalpies of the reactants involved","C":"From the relative molecular masses of the reactants","D":"From experimental data by measuring how rate changes with concentration","correct":"D","explain":"Orders of reaction are *never* deduced from the balanced equation — the stoichiometric coefficients tell you nothing about which step is rate-determining or about the molecularity of the slow step. Orders must be found experimentally, either via the initial rates method (comparing rate ratios across runs in which only one concentration changes at a time) or from the shape of concentration–time graphs. This distinction is one of the most frequently tested conceptual points at OCR A Level and is flagged explicitly in the H432/01 June 2018 examiner report."},{"stem":"What are the units of the rate constant k for a first-order reaction?","A":"mol dm⁻³ s⁻¹","B":"mol⁻¹ dm³ s⁻¹","C":"s⁻¹","D":"mol⁻² dm⁶ s⁻¹","correct":"C","explain":"For a first-order reaction, rate = k[A]. Rearranging: k = rate / [A] = (mol dm⁻³ s⁻¹) / (mol dm⁻³) = s⁻¹. The mol dm⁻³ units cancel, leaving s⁻¹. Never memorise units for k — always derive them from the rate equation for the specific overall order. Option A (mol dm⁻³ s⁻¹) is the unit of rate itself, not k. Option B (mol⁻¹ dm³ s⁻¹) is the unit of k for a second-order reaction. Option D (mol⁻² dm⁶ s⁻¹) is the unit of k for a third-order reaction."},{"stem":"What is the defining kinetic feature of the half-life of a first-order reaction?","A":"The half-life increases as the reaction proceeds","B":"The half-life decreases as concentration falls","C":"The half-life is constant, independent of concentration","D":"The half-life equals 1/k","correct":"C","explain":"For a first-order reaction only, successive half-lives are equal — the time for [A] to halve is always t₁/₂ = ln 2 / k = 0.693 / k, regardless of the starting concentration. This constancy is the diagnostic test for first-order kinetics on a concentration–time graph; OCR examiners require candidates to annotate *two* successive equal half-lives on the graph — a bare statement without annotation does not score (H432/01 June 2024). Second-order reactions show *increasing* half-lives; zero-order reactions show *decreasing* half-lives. The half-life for first order equals ln 2 / k, not 1/k."},{"stem":"What is the shape of a rate-concentration graph for a zero-order reaction?","A":"A straight line through the origin with a positive gradient","B":"An upward-curving (parabolic) curve through the origin","C":"A smooth decaying exponential curve","D":"A horizontal line parallel to the x-axis","correct":"D","explain":"For a zero-order reaction, rate = k[A]⁰ = k. The rate is constant and independent of concentration. On a rate vs [A] graph, a constant rate appears as a horizontal line; the y-value of this line equals k. A straight line through the origin indicates first-order kinetics (rate ∝ [A]). An upward-curving parabola indicates second order (rate ∝ [A]²). A smooth decaying exponential curve is the shape of a *concentration–time* graph for a first-order reaction — confusing the two graph types is a very common source of lost marks, so always check the axis labels first."},{"stem":"Which formula correctly relates the first-order rate constant k to the half-life t₁/₂?","A":"k = t₁/₂ / ln 2","B":"k = ln 2 × t₁/₂","C":"k = ln 2 / t₁/₂","D":"k = log₁₀ 2 / t₁/₂","correct":"C","explain":"For a first-order reaction, the integrated rate law gives t₁/₂ = ln 2 / k, which rearranges to k = ln 2 / t₁/₂ = 0.693 / t₁/₂. The formula uses <b>ln</b> (natural logarithm, base e ≈ 2.718), not log₁₀ (base 10). OCR examiners specifically require the ln form — using log₁₀ gives the wrong numerical answer. The units of k are s⁻¹ when t₁/₂ is in seconds. Option A is the reciprocal of the correct formula. Option B multiplies rather than divides."},{"stem":"In a clock reaction (e.g. the thiosulfate–acid \"disappearing cross\" experiment), what quantity is used as a proxy for initial rate?","A":"The absorbance of the solution at t = 0","B":"The volume of gas collected in the first 30 seconds","C":"1/t, where t is the time for the observable change to appear","D":"The gradient of the concentration–time curve at t = 0","correct":"C","explain":"In a clock reaction, the same small, fixed extent of reaction occurs before the visible endpoint appears (the cross is obscured; the iodine–starch colour appears). Because the same amount of reaction takes place each time, average rate ∝ extent / t = fixed amount / t, so rate ∝ 1/t. Plotting 1/t against the starting concentration of the varied reactant therefore approximates a rate–concentration graph from which the order can be deduced. Each experiment provides one (1/t, [reactant]₀) data point. The gradient of the tangent at t = 0 on a concentration–time curve would give the true initial rate, but clock reactions provide 1/t as a shortcut that avoids needing a full continuous-monitoring curve."},{"stem":"What is the rate-determining step (RDS) of a multi-step reaction mechanism?","A":"The first step in the mechanism","B":"The step involving the greatest number of bonds breaking","C":"The last step before products are formed","D":"The slowest step in the mechanism","correct":"D","explain":"The rate-determining step is the slowest step — the kinetic bottleneck. No matter how fast all other steps proceed, the overall rate cannot exceed the rate of this slowest step (the motorway toll-booth analogy: traffic throughput is set by the capacity of the booth, not the open road). Only species that participate in the RDS — or in steps *before* the RDS — appear in the rate equation. Species that react only in fast steps *after* the RDS are zero order and absent from the rate equation. The RDS need not be the first step, nor the step with the most bond-breaking."},{"stem":"On an Arrhenius plot of ln k (y-axis) against 1/T (x-axis), what does the gradient of the line equal?","A":"Eₐ / R","B":"−Eₐ / R","C":"−R / Eₐ","D":"ln A","correct":"B","explain":"Taking the natural logarithm of k = Ae^(−Eₐ/RT) gives ln k = −(Eₐ/R)(1/T) + ln A. Comparing with y = mx + c: the gradient m = −Eₐ/R, and the y-intercept c = ln A. The gradient is *negative* because Eₐ is always positive (energy must be put in to reach the transition state). To find Eₐ: multiply the negative gradient by −R = −8.314 J K⁻¹ mol⁻¹, giving a positive value in J mol⁻¹. The y-intercept at 1/T = 0 gives ln A; A is found by exponentiating the intercept."},{"stem":"In the rate equation rate = k[A]ᵐ[B]ⁿ, which quantity changes when the temperature is increased?","A":"The orders m and n","B":"The concentrations [A] and [B]","C":"The rate constant k","D":"Both the rate constant k and the orders m and n","correct":"C","explain":"In the rate equation, the orders m and n are fixed by the mechanism (the molecularity of the rate-determining step) — they do not change with temperature. The concentrations [A] and [B] are determined by how much reagent was added and the volume — heating the system does not change them (thermal expansion is negligible at A Level). Only k depends on temperature: k increases when T rises because a greater fraction of molecules have kinetic energy ≥ Eₐ (the Boltzmann tail grows). The key sentence in exam answers is: \"increasing the temperature increases the rate constant k, and therefore increases the rate of reaction.\""}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
