<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>6.2 Carbonyl Chemistry</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Inferno: Multi-step &amp; analyse</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"A student claims that propanone can be oxidised to propanoic acid using acidified K₂Cr₂O₇ under reflux. Which explanation correctly explains why this is not possible?","A":"K₂Cr₂O₇/H₂SO₄ is not acidic enough to oxidise any ketone under these conditions.","B":"Propanone must be reduced first to propan-2-ol before it can be oxidised.","C":"Converting propanone (CH₃COCH₃) to propanoic acid (CH₃CH₂COOH) would require breaking a C–C bond; acidified K₂Cr₂O₇ under reflux cannot achieve this.","D":"Propanone is already at the maximum oxidation state for any three-carbon compound.","correct":"C","explain":"Consider what must happen structurally: propanone (CH₃COCH₃) would need to become propanoic acid (CH₃CH₂COOH). The carbonyl carbon in propanone is bonded to two methyl groups — there is no C–H bond to break. To give propanoic acid, one of the C–C bonds on the carbonyl carbon would have to be broken and reformed, which requires conditions far harsher than acidified K₂Cr₂O₇/H₂SO₄ at reflux. Option (D) is wrong — propanone (oxidation state of carbonyl C = +2 roughly) is not at a maximum; further oxidation is theoretically possible but requires C–C cleavage. This reasoning distinguishes the specific structural requirement (C–H bond on carbonyl C) from a blanket claim about acid strength."},{"stem":"In the mechanism for nucleophilic addition of CN⁻ to a carbonyl compound, the second curly arrow in step 1 must originate from which position?","A":"From the lone pair on the N of CN⁻","B":"From the Cδ⁺ atom of the C=O bond","C":"From any part of the C=O π-bond, pointing towards the O atom","D":"From H⁺ in the protonation step","correct":"C","explain":"In step 1, two curly arrows operate simultaneously: (i) <b>arrow 1</b> from the lone pair/negative charge on the C of CN⁻ → to the Cδ⁺ of C=O (forming the new C–C bond); (ii) <b>arrow 2</b> from the C=O π-bond → to the O atom (breaking the π-bond and placing the electrons on O to give the alkoxide O⁻). OCR October 2020 examiner report explicitly states: \"curly arrow from C=O bond must start from, OR be traced back to, <b>any part of C=O bond</b> and go to O.\" Starting from the C atom alone (option B) is penalised — the arrow must originate from the bond itself, not just the carbon end of it. Option (D) describes the protonation step (step 2)."},{"stem":"Nucleophilic addition of HCN to pentan-3-one produces a new stereocentre. Why is the product a racemic mixture?","A":"HCN is a weak acid and therefore adds slowly to both faces of the carbonyl with equal probability.","B":"The carbonyl carbon in pentan-3-one is sp² hybridised and planar; CN⁻ can attack equally from either face, generating equal proportions of both enantiomers.","C":"Pentan-3-one is itself chiral and produces equal proportions of each enantiomer of the product.","D":"CN⁻ is prochiral and therefore generates a racemic mixture regardless of the carbonyl's geometry.","correct":"B","explain":"The carbonyl carbon in pentan-3-one is <b>sp² hybridised</b> with bond angles of ~120° — all three substituents (the two ethyl groups and the =O) lie in one plane. CN⁻ has equal access from <b>both faces</b> (above and below the plane) of this flat, trigonal centre. Attack from one face gives one enantiomer; attack from the other face gives the mirror-image enantiomer. Since no chiral influence is present to favour one face over the other, attack from both faces is equally probable, giving a <b>50:50 (racemic) mixture</b> of enantiomers. A racemic mixture is optically inactive. Option (A) confuses reaction rate with stereochemical outcome. Option (C) is wrong — pentan-3-one itself is achiral (symmetric, C₂ᵥ)."},{"stem":"A student prepares Tollens' reagent. Step 1: aqueous AgNO₃ + dilute NaOH → brown precipitate. What is step 2 to produce usable Tollens' reagent?","A":"Add dilute HCl drop by drop until the brown precipitate just dissolves.","B":"Add aqueous sodium carbonate dropwise until the precipitate dissolves.","C":"Add dilute aqueous ammonia (NH₃) dropwise until the brown precipitate just dissolves, giving a colourless solution.","D":"Heat the mixture until the brown precipitate dissolves.","correct":"C","explain":"In step 1, NaOH precipitates silver(I) oxide: 2AgNO₃ + 2NaOH → Ag₂O(s) ↓ (brown) + 2NaNO₃ + H₂O. In step 2, <b>dilute aqueous ammonia</b> is added dropwise until the brown Ag₂O just dissolves, forming the diamminesilver(I) complex: Ag₂O + 4NH₃ + H₂O → 2[Ag(NH₃)₂]⁺ + 2OH⁻. This colourless [Ag(NH₃)₂]⁺ solution is Tollens' reagent. Adding HCl (option A) would precipitate AgCl, not dissolve Ag₂O usefully. Heating (option D) does not dissolve Ag₂O and could generate explosive decomposition products. Tollens' reagent is unstable and must be used freshly prepared — all unused reagent should be washed away promptly."},{"stem":"An OCR June 2022 examiner report notes: \"IF other reagents are seen, e.g. Fehling's or Benedict's, contact your Team Leader.\" What does this tell you about using Fehling's solution in an OCR H432 exam?","A":"Fehling's solution is acceptable but lower-quality evidence than Tollens' and earns only half marks.","B":"Fehling's solution is not on the OCR H432 specification; naming it instead of Tollens' does not earn the mark for the aldehyde test.","C":"Fehling's solution gives an identical silver mirror to Tollens' and can be used interchangeably.","D":"Fehling's solution is acceptable only in Component 03 (Practical Chemistry), not in Components 01/02.","correct":"B","explain":"The OCR H432 specification specifically names <b>Tollens' reagent (ammoniacal silver nitrate)</b> as the test to distinguish aldehydes from ketones. <b>Fehling's solution</b> (alkaline copper(II) tartrate → brick-red Cu₂O precipitate with an aldehyde) is on other examination boards' specifications (e.g., AQA) but <b>is not on OCR H432</b>. Writing \"Fehling's solution\" in an OCR exam does not earn the mark and is flagged to the Team Leader — a warning to candidates who have studied from cross-board resources. Benedict's solution has the same problem. Always use <b>Tollens'</b> (or its synonyms: ammoniacal silver nitrate; Ag⁺/NH₃) in OCR papers."},{"stem":"A molecule contains a ketone group (–CO–) and a secondary –OH group. When heated under reflux with K₂Cr₂O₇/H₂SO₄, the orange solution turns green. Which functional group is being oxidised, and what is the product?","A":"The ketone is oxidised to a carboxylic acid; the secondary –OH group is unchanged.","B":"The secondary –OH group is oxidised to a ketone (a second C=O group is formed); the existing ketone is unchanged.","C":"Both functional groups are oxidised simultaneously; the product contains two carboxylic acid groups.","D":"Neither group can be oxidised; the colour change must be due to a side reaction.","correct":"B","explain":"K₂Cr₂O₇/H₂SO₄ under reflux oxidises <b>aldehydes and primary/secondary alcohols</b> but <b>not ketones</b>. In this molecule, the ketone group cannot be further oxidised under these conditions (the carbonyl carbon has no C–H bond). The <b>secondary –OH group</b> (R–CH(OH)–R′) can be oxidised because it has a C–H bond on the carbon bearing the –OH; the product is a <b>ketone</b> (R–CO–R′). The orange → green colour change confirms oxidation has occurred (Cr₂O₇²⁻ → Cr³⁺). The product contains two ketone groups. This is the kind of multi-functional-group analysis highlighted in the OCR June 2023 examiner report — always identify which specific group reacts under the given conditions."},{"stem":"A student writes the following equation for the NaBH₄ reduction of butanone: CH₃COC₂H₅ + [O] → CH₃CH(OH)C₂H₅. What error has been made?","A":"The product should be butan-1-ol, not butan-2-ol.","B":"The [O] notation is correct because an oxygen atom is inserted into the C=O bond.","C":"The equation should use [H] (not [O]) because NaBH₄ supplies hydride and the overall reaction is a reduction.","D":"Butanone cannot be reduced by NaBH₄; a different reagent is needed.","correct":"C","explain":"In OCR's notation system, <b>[O]</b> represents an oxygen atom supplied by an oxidising agent (used for oxidation reactions), while <b>[H]</b> represents hydrogen supplied by a reducing agent (used for reduction reactions). NaBH₄ is a <b>reducing agent</b> supplying H⁻; the overall reaction is a <b>reduction</b>. The correct equation is: CH₃COC₂H₅ + 2[H] → CH₃CH(OH)C₂H₅. The product shown (butan-2-ol) is actually correct — butanone (a ketone) gives a secondary alcohol — but the reagent symbol [O] is the error; it implies oxidation when the opposite is happening. This is a common notation trap."},{"stem":"After obtaining an orange precipitate from the reaction of an unknown compound with 2,4-DNPH, a student recrystallises the derivative and measures its melting point as 126 °C. What else is required to identify the original carbonyl compound?","A":"The refractive index of the original liquid compound.","B":"The boiling point of the original compound.","C":"The result of a Tollens' test on the original compound.","D":"A database of known melting points for 2,4-dinitrophenylhydrazone derivatives.","correct":"D","explain":"The melting point of the recrystallised derivative is used for identification by <b>comparison</b>: each different carbonyl compound produces a derivative with a unique melting point. Without a <b>database (reference table) of known 2,4-dinitrophenylhydrazone melting points</b>, the measured value of 126 °C is meaningless — you cannot assign it to a specific compound. Option (C) (Tollens' test) tells you whether the original compound is an aldehyde or a ketone, but even that won't tell you which specific compound it is. Options (A) and (B) are properties of the original compound, not needed for the derivative comparison method."},{"stem":"An unknown compound Z reacts with 2,4-DNPH to give an orange precipitate, and with Tollens' reagent (warmed gently) to give no visible change. Which type of compound is Z?","A":"A primary alcohol","B":"An aldehyde","C":"A ketone","D":"A carboxylic acid","correct":"C","explain":"Two tests, two results: (1) 2,4-DNPH gives an orange precipitate → a <b>carbonyl group (C=O)</b> is present, so Z is either an aldehyde or a ketone. (2) Tollens' gives no reaction → Z is <b>not</b> an aldehyde (aldehydes give a silver mirror). Therefore Z must be a <b>ketone</b>: it has a C=O group but cannot be oxidised by Ag⁺ because it has no C–H bond on the carbonyl carbon. A primary alcohol would be negative for both tests. A carboxylic acid would be negative for 2,4-DNPH (the C=O of –COOH does not react with 2,4-DNPH) and negative for Tollens'."},{"stem":"A student investigates compound W. Results: W reacts with 2,4-DNPH, giving an orange precipitate; W gives no reaction with Tollens' reagent; W reacts with NaBH₄, and the product is a <b>primary</b> alcohol. Which conclusion is correct?","A":"W is a ketone: the 2,4-DNPH and Tollens' results confirm this, and the NaBH₄ product is irrelevant.","B":"W is an aldehyde: NaBH₄ reduction of an aldehyde gives a primary alcohol, and the Tollens' result must be anomalous (e.g. reagent not fresh or insufficiently warmed).","C":"W is a carboxylic acid: it has a C=O group (positive 2,4-DNPH) but resists oxidation.","D":"W is an ester: esters have C=O groups and do not react with Tollens'.","correct":"B","explain":"This question requires reconciling three pieces of evidence. 2,4-DNPH positive → C=O present (aldehyde or ketone). Tollens' negative → not an aldehyde? But — NaBH₄ gives a <b>primary</b> alcohol. The key: NaBH₄ reduces <b>aldehydes → primary alcohols</b> and <b>ketones → secondary alcohols</b>. If W were a ketone, NaBH₄ would give a <b>secondary</b> alcohol, not a primary one. The NaBH₄ result is definitive: W must be an <b>aldehyde</b>. The Tollens' result is anomalous — perhaps the reagent was stale, not warmed sufficiently, or another error occurred. Option (A) ignores the critical NaBH₄ evidence. Option (C) is wrong — carboxylic acids give no 2,4-DNPH precipitate. Option (D) is wrong — esters give no 2,4-DNPH precipitate either."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
