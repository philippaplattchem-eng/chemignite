<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>

<script>
const QUESTIONS=[{"stem":"A student says \"amines are bases because they contain nitrogen.\" A better explanation is:","A":"Amines are bases because nitrogen is more electronegative than carbon, so it pulls electrons from the adjacent carbon.","B":"Amines are bases because the nitrogen atom has a lone pair of electrons that can accept a proton (H⁺) from an acid, acting as a Brønsted–Lowry base.","C":"Amines are bases because they react with water to produce hydroxide ions directly, without any electron-pair donation.","D":"Amines are bases because their nitrogen atoms carry a partial negative charge (δ⁻) that attracts protons electrostatically.","correct":"B","explain":"An amine is a <b>Brønsted–Lowry base</b> because the nitrogen atom has a <b>lone pair of electrons</b> in a non-bonding orbital that is available to form a dative covalent bond to an incoming H⁺. The equation RNH₂ + H⁺ → RNH₃⁺ shows the lone pair becoming the bonding pair of a new N–H bond; the nitrogen now has four bonds and the ion carries a +1 charge. Option (A) describes electronegativity, which concerns bond polarisation, not basicity. Option (C) is wrong — water is produced only when an amine reacts with an acid (giving water from the conjugate base of the acid, not from the amine itself). Option (D) confuses overall charge with Lewis basicity."},{"stem":"In the preparation of phenylamine from nitrobenzene, why is sodium hydroxide solution added after the Sn + concentrated HCl step?","A":"To catalyse the final reduction of the nitroso intermediate to the amine.","B":"To precipitate tin as tin(IV) hydroxide and remove it from the product.","C":"To deprotonate the phenylammonium chloride salt and liberate the free phenylamine.","D":"To oxidise the tin and allow it to act as a reducing agent again.","correct":"C","explain":"During the Sn/HCl reduction step, the reaction mixture is strongly acidic. The phenylamine formed is immediately <b>protonated by the excess HCl</b> to give phenylammonium chloride (C₆H₅NH₃⁺Cl⁻) — the free amine is not present while the mixture is acidic. Adding <b>NaOH(aq)</b> neutralises the excess HCl and, crucially, <b>deprotonates the phenylammonium salt</b>: C₆H₅NH₃⁺Cl⁻ + NaOH → C₆H₅NH₂ + NaCl + H₂O. This releases the free phenylamine, which being less soluble in water than its salt, separates and can be collected (in practice by steam distillation). This NaOH step is the work-up, not part of the reduction itself — OCR mark schemes award marks for it as a separate step."},{"stem":"Glycine (H₂N–CH₂–COOH) is reacted with aqueous sodium hydroxide. Which structure correctly shows the organic product?","A":"H₂N–CH₂–COO⁻Na⁺","B":"Na⁺H₂N–CH₂–COO⁻Na⁺","C":"H₃N⁺–CH₂–COO⁻Na⁺","D":"H₂N–CH₂–CHO + Na₂O","correct":"A","explain":"NaOH reacts with the <b>–COOH group</b> (the acidic group) in a neutralisation reaction: H₂N–CH₂–COOH + NaOH → <b>H₂N–CH₂–COO⁻Na⁺</b> + H₂O. The product is <b>sodium aminoethanoate</b> (sodium glycinate). Key point: the <b>–NH₂ group is unchanged</b> — alkaline conditions do not protonate a free amine (option C shows the zwitterion form, which would exist without added NaOH). Option (B) incorrectly implies the amine end also reacts with Na⁺. Option (D) is completely wrong — NaOH does not cleave C–C bonds or convert a carboxylic acid into an aldehyde. Always retain the unreacted functional group in the product of an amino acid reaction."},{"stem":"Why must a large excess of ammonia be used in the preparation of ethylamine from bromoethane?","A":"Excess ammonia raises the pressure in the sealed tube, increasing the reaction rate.","B":"Excess ammonia is needed because NH₃ is the solvent as well as the reagent.","C":"The ethylamine product (CH₃CH₂NH₂) is itself a nucleophile; without excess NH₃, it competes with NH₃ for further reaction with bromoethane to give secondary, tertiary and quaternary products.","D":"Ammonia decomposes rapidly at the reflux temperature and must be used in excess to compensate for losses.","correct":"C","explain":"The primary amine RNH₂ produced by NH₃ + haloalkane still has a lone pair on nitrogen — it too can act as a nucleophile. If bromoethane is present in any excess, RNH₂ attacks it to give a secondary amine (R₂NH), which can go on to form R₃N (tertiary), and finally R₄N⁺X⁻ (quaternary ammonium salt). By using a <b>large excess of NH₃</b>, any bromoethane molecule is statistically far more likely to collide with NH₃ (present in vast excess) than with the small amount of RNH₂ formed — this drives selectivity towards the primary amine. Even with excess NH₃, some 2°/3° products form, and the mixture is separated by fractional distillation."},{"stem":"Alanine (H₂N–CH(CH₃)–COOH) is reacted with dilute hydrochloric acid. Which structure shows the organic product?","A":"H₂N–CH(CH₃)–COO⁻ Cl⁻","B":"H₂N–CH(CH₃)–COOCl + H₂O","C":"⁺H₃N–CH(CH₃)–COO⁻ + HCl","D":"⁺H₃N–CH(CH₃)–COOH Cl⁻","correct":"D","explain":"HCl reacts with the <b>–NH₂ group</b> (the basic group) in a proton-transfer reaction: H₂N–CH(CH₃)–COOH + HCl → <b>⁺H₃N–CH(CH₃)–COOH Cl⁻</b>. The amine end is protonated to –NH₃⁺ and a chloride counter-ion balances the charge. The <b>–COOH group is unchanged</b> — in acidic conditions, the carboxylic acid cannot be deprotonated (option A incorrectly shows –COO⁻). Option (C) is the zwitterion plus HCl as separate species, not the product. Option (B) shows formation of an acyl chloride, which requires SOCl₂, not dilute HCl. Always show the unreacted –COOH group in the product when HCl reacts with the amine end."},{"stem":"At what pH does an amino acid predominately exist as a zwitterion?","A":"Low pH (e.g. pH 1) — strongly acidic solution","B":"High pH (e.g. pH 13) — strongly alkaline solution","C":"Neutral to slightly acidic pH (around the isoelectric point)","D":"Zwitterions are only formed in the solid state, never in solution","correct":"C","explain":"The zwitterion (RCH(NH₃⁺)COO⁻) is the <b>electrically neutral, dipolar form</b> that predominates at the <b>isoelectric point</b> — typically close to neutral pH for simple amino acids. At <b>low pH</b> (strongly acidic): the –COO⁻ group is protonated back to –COOH, giving the cationic form RCH(NH₃⁺)COOH. At <b>high pH</b> (strongly alkaline): the –NH₃⁺ group is deprotonated back to –NH₂, giving the anionic form RCH(NH₂)COO⁻. The equilibrium: RCH(NH₃⁺)COOH ⇌ RCH(NH₃⁺)COO⁻ ⇌ RCH(NH₂)COO⁻. Option (D) is wrong — zwitterions definitely exist in solution and are the predominant form at physiological pH; in solid state they form ionic lattices because of the +/− charge centres."},{"stem":"Which correctly gives the overall equation for the reduction of nitrobenzene by Sn/HCl?","A":"C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + H₂O","B":"C₆H₅NO₂ + 3H₂ → C₆H₅NH₂ + 2H₂O","C":"C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O","D":"C₆H₅NO₂ + 2[H] → C₆H₅NH₂ + O₂","correct":"C","explain":"The reduction of –NO₂ to –NH₂ is a <b>6-electron/6-hydrogen reduction</b> with the overall equation: <b>C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O</b>. The nitrogen in –NO₂ is at oxidation state +3; in –NH₂ it is at −3, so it gains 6 electrons. The two oxygen atoms leave as two water molecules (2H₂O), requiring the six [H] atoms: 6H available, 4H go into 2H₂O, 2H bond to N to give –NH₂ — check: 6[H] in, 4[H] into 2H₂O, 2[H] into –NH₂ → total balance. Option (A) gives only 1 H₂O, which doesn't balance. Option (B) uses H₂ (not OCR-accepted notation), and note: OCR uses [H] for the active reducing species from Sn/HCl. Option (D) is impossible — oxygen atoms cannot appear as O₂ in a reduction."},{"stem":"Why are amides significantly less basic than amines?","A":"Amides contain oxygen, which is electronegative and withdraws electron density from the nitrogen lone pair by induction.","B":"The nitrogen lone pair in an amide is delocalised into the adjacent C=O π-system, making it less available to accept a proton.","C":"Amides do not have a nitrogen lone pair because the N atom forms four bonds within the amide group.","D":"Amides are neutral because the C=O group is itself acidic and cancels out the basicity of the N.","correct":"B","explain":"In an amine (RNH₂), the N lone pair is freely available in a non-bonding orbital → strong Brønsted–Lowry base. In an amide (RCONH₂), the N lone pair is in a p-orbital that overlaps sideways with the π-system of the C=O bond → <b>delocalisation</b> across the O–C–N unit. The lone pair is partially donated into the C=O and is no longer freely available for proton acceptance. Accepting a proton on the amide nitrogen would disrupt this resonance stabilisation, which is energetically unfavourable. The result: amides are essentially <b>neutral in water</b> (ethanamide has pKb ≈ 14 — virtually no basicity). Option (C) is wrong — amide N has three bonds, leaving one lone pair; this lone pair just happens to be partially delocalised."},{"stem":"A student reacts glycine (H₂N–CH₂–COOH) with methanol in the presence of concentrated sulfuric acid under reflux. Which structure correctly shows the organic product?","A":"H₂N–CH₂–CH₂OH (glycine reduced to an amino alcohol)","B":"H₂N–CH₂–COOCH₃","C":"CH₃–CH₂–COOH (deamination product)","D":"H₂N–CH₂–COOH (no reaction — glycine cannot be esterified)","correct":"B","explain":"The <b>–COOH group</b> of glycine undergoes Fischer esterification with methanol in the presence of conc. H₂SO₄: H₂N–CH₂–COOH + CH₃OH ⇌ <b>H₂N–CH₂–COOCH₃</b> + H₂O. The product is <b>methyl 2-aminoethanoate</b> (the methyl ester of glycine). The –NH₂ group is NOT the site of reaction under these conditions. Note: OCR mark schemes (June 2019) also accept the protonated amine form H₂N–CH₂–COOCH₃ drawn as H₃N⁺–CH₂–COOCH₃, because the strongly acidic conditions of conc. H₂SO₄ can protonate the amine. Both forms are credited. The side chain –OH in serine would not be expected to esterify under these standard conditions either."},{"stem":"Why cannot a primary amide be made simply by mixing a carboxylic acid with ammonia at room temperature?","A":"Carboxylic acids and ammonia have repelling lone pairs and cannot react.","B":"The carboxylic acid reacts with NH₃ in a proton-transfer reaction to give an ammonium carboxylate salt (RCOO⁻NH₄⁺), not the amide.","C":"Water is not eliminated at room temperature because the boiling point of water is too high.","D":"Ammonia is too nucleophilic and attacks the C=C double bond of carboxylic acids instead.","correct":"B","explain":"When a carboxylic acid meets ammonia, a simple <b>acid–base neutralisation</b> occurs first — the much more acidic –COOH donates a proton to the basic NH₃: RCOOH + NH₃ → RCOO⁻NH₄⁺ (ammonium carboxylate). The amide product (RCONH₂) is obtained only if water is eliminated — which requires either <b>prolonged heating above 150 °C</b> (to drive off water) or use of a more reactive acid derivative. In practice, <b>acyl chlorides</b> (RCOCl + 2NH₃ → RCONH₂ + NH₄Cl) are used because the –Cl leaving group is excellent and the reaction proceeds quickly at room temperature without the need to overcome the initial acid–base equilibrium. Carboxylic acids do not contain C=C double bonds (option D)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
