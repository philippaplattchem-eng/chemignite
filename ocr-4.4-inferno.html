<script>
const QUESTIONS=[{"stem":"A polyfunctional molecule has the structure HO–CH₂–CH₂–C(CH₃)₂–OH. Classify each –OH group. Then write the balanced equation, using [O] notation, for the complete oxidation of only the oxidisable group under reflux. Verify atom counts and identify the error warned against by the H432/02 June 2023 examiner report.","A":"Both groups are secondary; both are oxidised to ketones; product is O=CH–CH₂–C(CH₃)₂=O","B":"Left –OH: primary (C* bonded to 1 other C); Right –OH: tertiary (C* bonded to 3 other C groups). Only the primary group is oxidised. Equation: HO–CH₂–CH₂–C(CH₃)₂–OH + 2[O] → HOOC–CH₂–C(CH₃)₂–OH + H₂O. The tertiary group is unchanged. Common error: attempting to oxidise the tertiary –OH or inserting a stray –CH₂– between the chain and the –COOH group","C":"Left –OH: secondary; Right –OH: tertiary. Neither reacts with dichromate","D":"Both groups are primary; both are oxidised; product is HOOC–CH₂–C(CH₃)₂–COOH + 2H₂O, using 4[O]","correct":"B","explain":"Classify each C*: the left C* (bearing –CH₂OH) is bonded to one other C (the adjacent –CH₂–) → primary. The right C* (bearing –C(CH₃)₂OH) is bonded to three other C groups (two methyls + the –CH₂– chain) → tertiary. Primary → carboxylic acid (full oxidation, reflux, 2[O]): HO–CH₂–CH₂–C(CH₃)₂–OH + 2[O] → HOOC–CH₂–C(CH₃)₂–OH + H₂O. Atom check: left C₅H₁₂O₂ + 2O = C₅H₁₂O₄; right C₅H₁₀O₃ + H₂O = C₅H₁₂O₄ ✓. The tertiary –OH has no C–H on its C* → no reaction, no colour change for that group. The H432/02 June 2023 examiner report (Q17b) penalised candidates who \"attempted to oxidise the tertiary alcohol or removed it entirely\" and those who \"added a stray –CH₂– before the –COOH group.\""},{"stem":"Describe in detail all the features required by OCR mark schemes in a diagram of a hydrogen bond between an ethanol molecule and a water molecule. State each specific OCR rule and the penalty for breaking it.","A":"Draw a solid line between the O of ethanol and the O of water; label both atoms","B":"Draw the O–H covalent bond of the donor molecule as a solid line; place δ⁻ on the O and δ⁺ on the H of that O–H; draw exactly two lone pairs on the acceptor O; draw a dashed line from one of those lone pairs to the δ⁺ H; keep the O···H–O alignment approximately linear","C":"Draw a solid line from the O of water to the H of ethanol's methyl group; no need to show lone pairs","D":"Show δ⁺ on any H atom of the donor molecule; draw a dashed line to the O of the acceptor; lone pairs are optional","correct":"B","explain":"Every feature below is awarded its own mark in OCR schemes (H432/02 June 2024 and June 2017 examiner reports): (1) δ⁻ on the acceptor O AND δ⁺ on the H of the O–H bond. The June 2017 report states omitting dipoles is the most common error. (2) Exactly two lone pairs on the acceptor O — more than two loses the mark. (3) The dashed line must terminate at a lone pair, not simply at the O atom. \"All hydrogen bonds must hit a lone pair\" (H432/02 June 2024). (4) The dashed line (not solid) represents the intermolecular attraction — a solid line implies a covalent bond. (5) Approximately linear O···H–O geometry (M4.2 — visualise 2D/3D forms). Breaking any of these specific rules costs a mark. Option D is the classic error: δ⁺ on a C–H hydrogen, and no lone pairs required — both are explicitly disallowed."},{"stem":"Identify all the possible organic products when butan-2-ol is dehydrated, including any stereoisomers. State which is the major product and explain why.","A":"Only but-2-ene is formed; no stereoisomers exist because all four substituents on the C=C are different","B":"But-1-ene (minor) and but-2-ene (major); but-2-ene itself exists as E and Z stereoisomers (Z: both CH₃ groups on the same side of the C=C; E: CH₃ groups on opposite sides). Three distinguishable products overall. But-2-ene is the major product because it is more substituted (two alkyl groups on C=C vs one in but-1-ene) and therefore more thermodynamically stable","C":"Only but-1-ene forms; but-2-ene cannot form because the –OH is on C2, too far from C3","D":"But-1-ene and but-2-ene form in equal amounts; but-2-ene has no stereoisomers because methyl groups rotate freely","correct":"B","explain":"Butan-2-ol (C* = C2): β-carbons are C1 and C3. H from C1 + –OH from C2 → but-1-ene (CH₂=CHCH₂CH₃): monosubstituted, minor. H from C3 + –OH from C2 → but-2-ene (CH₃CH=CHCH₃): disubstituted, major. But-2-ene has restricted rotation about the C=C. Each C of the C=C carries H (Z=1) and CH₃ (Z=6) — two different groups on each carbon. E/Z isomerism exists: Z-but-2-ene (both CH₃ same side, higher dipole moment, slightly higher bp) and E-but-2-ene (CH₃ groups opposite sides). So dehydration of butan-2-ol can give up to three distinct organic products: but-1-ene, Z-but-2-ene, and E-but-2-ene."},{"stem":"The geometry of a hydrogen bond is described as \"approximately linear.\" Explain what this means, why linearity is preferred, and why OCR mark schemes require the dashed line to terminate at a lone pair rather than simply at the oxygen atom.","A":"Linear means the O–H–O atoms are in a straight line; any other geometry weakens the attraction because the electrostatic overlap between the δ⁺ H and the lone pair is maximised when approach is head-on. The dashed line must reach the lone pair because the lone pair itself (not the O nucleus) is the electron-rich region attracting the δ⁺ H","B":"Linear refers to the overall shape of the hydrogen-bonded cluster, not the individual bond","C":"Linearity is a convenience of drawing; bent hydrogen bonds are equally strong","D":"The dashed line can end at the O atom because the lone pairs are part of the oxygen","correct":"A","explain":"A lone pair is a region of electron density concentrated in space, not spread uniformly over the entire oxygen atom. In an sp³ oxygen (as in an alcohol or water), the two lone pairs point in specific tetrahedral directions. The hydrogen bond is strongest when the δ⁺ H approaches along the axis of a lone pair (head-on), maximising the electrostatic attraction between the δ⁺ H and the localised negative charge of that lone pair. Bent or off-axis approaches are weaker. Drawing the dashed line to the O nucleus rather than to a lone pair obscures this directionality and implies that any part of the O atom can attract the H equally — which misrepresents the geometry. OCR mark schemes (H432/02 June 2024) therefore specifically require the dashed line to terminate at a lone pair, not at the O symbol alone. This links to Mathematical Skills M4.2 (visualise and represent 2D and 3D forms)."},{"stem":"A student argues: \"If you heat 2-methylpropan-2-ol to a high enough temperature with K₂Cr₂O₇/H₂SO₄, it will eventually be oxidised because all bonds can be broken with sufficient energy.\" Evaluate this claim using structural reasoning.","A":"The student is correct; tertiary alcohols are eventually oxidised at very high temperature","B":"The student is incorrect in the context of dichromate oxidation. Acidified dichromate oxidises alcohols by abstracting the H on C* together with the H on the –OH group. In 2-methylpropan-2-ol there is simply no H on C* — this is not a kinetic limitation (too slow) but a structural impossibility. No amount of extra heat creates a C–H bond that is not there. To oxidise a tertiary carbon would require breaking a C–C bond, which needs reagents far more powerful than Cr₂O₇²⁻ (e.g. acidified KMnO₄ under very harsh conditions)","C":"The student is correct; higher temperatures increase the activation energy available, eventually overcoming the structural limitation","D":"The student is partially correct; tertiary alcohols are oxidised at ~200°C but not at lower temperatures","correct":"B","explain":"The distinction is between kinetic and structural constraints. A kinetic constraint is a reaction that is possible in principle but too slow at low temperature — additional heat helps by increasing molecular energy above the activation barrier. A structural constraint is different: the reaction mechanism literally requires a H atom on C* that does not exist in a tertiary alcohol. The OCR mechanism of dichromate oxidation cannot proceed at any temperature if the required C–H is absent: you would first have to use a different reagent to break a C–C bond (e.g. vigorous KMnO₄) and then separately deal with the fragmented products. At AS level, tertiary alcohols do not react with acidified dichromate. Period."},{"stem":"For the oxidation of propan-1-ol to propanoic acid under reflux, write the balanced equation using [O] and verify every atom on both sides. Then identify the specific arithmetic error a student makes when they write the product as CH₃CH₂CH₂COOH.","A":"CH₃CH₂CH₂OH + 2[O] → CH₃CH₂COOH + H₂O; atom check confirms balance; the error in writing CH₃CH₂CH₂COOH is including four C atoms in the product when propan-1-ol has only three","B":"CH₃CH₂CH₂OH + [O] → CH₃CH₂COOH + H₂O; the student's product is correct and has three carbons","C":"CH₃CH₂CH₂OH + 3[O] → CH₃CH₂COOH + 2H₂O; the 3[O] corrects for the three-carbon chain","D":"CH₃CH₂CH₂OH + 2[O] → CH₃CH₂CH₂COOH + H₂O; this is the only balanced option so it must be correct","correct":"A","explain":"Propan-1-ol (CH₃CH₂CH₂OH) has 3 C. The carbon bearing the –OH (C1) becomes the –COOH carbon. No new carbon is added; the chain does not grow. Product: propanoic acid = CH₃CH₂COOH (still 3 C). Equation: CH₃CH₂CH₂OH + 2[O] → CH₃CH₂COOH + H₂O. Atom check: left = 3C, 8H, 1O + 2O = 3O; right = CH₃CH₂COOH (3C, 6H, 2O) + H₂O (2H, 1O) = 3C, 8H, 3O ✓. The student who writes CH₃CH₂CH₂COOH has produced butanoic acid (4 C) — the error is inserting an extra –CH₂– unit between the chain and the carboxyl group. This is the carbon-count error explicitly identified in the H432/02 June 2023 examiner report: \"Some made a mistake by adding an extra CH₂ on to the product before the COOH group.\""},{"stem":"Explain the trend in boiling points of the primary alcohol homologous series (methanol, ethanol, propan-1-ol, butan-1-ol) and compare it with the corresponding alkane series (methane, ethane, propane, butane). Account for both the overall trend and the persistent gap between the two series.","A":"Both series increase in boiling point with chain length; the gap between the series is constant and due to the presence of the –OH group","B":"Both series increase in boiling point as chain length (and Mr) grows because London forces increase with the size and number of electrons in the molecule; alcohols are consistently higher than the corresponding alkane of similar Mr because alcohols additionally form hydrogen bonds, which are stronger than London forces. The gap between the series reflects the extra energy needed to break those H-bonds during vaporisation","C":"The alkane series increases in boiling point, but the alcohol series stays constant because all alcohols form the same number of hydrogen bonds regardless of chain length","D":"The two series converge at high chain length because the hydrophobic tail dominates and the –OH contribution becomes negligible","correct":"B","explain":"In both series, boiling point rises with chain length because longer, heavier molecules have more electrons and greater surface area, leading to stronger London forces between molecules. The alkane series: CH₄ (−161°C) → C₂H₆ (−89°C) → C₃H₈ (−42°C) → C₄H₁₀ (−1°C). The alcohol series: CH₃OH (+65°C) → C₂H₅OH (+78.5°C) → C₃H₇OH (+97°C) → C₄H₉OH (+118°C). The persistent gap (~100–120°C) is due to hydrogen bonding in the alcohol series. Alcohols have London forces AND hydrogen bonds; alkanes have London forces only. As chain length increases, both series gain London-force contributions at similar rates, so the gap stays roughly constant rather than closing. Option D is wrong: even in long-chain alcohols, the –OH still hydrogen-bonds and the boiling-point gap with the equivalent alkane persists (though eventually London forces dominate solubility trends)."},{"stem":"Methanol (CH₃OH) is classified as a primary alcohol by OCR even though the carbon bearing the –OH group has zero other carbon neighbours. Explain the structural convention that justifies this classification and write the fully balanced equation for the complete combustion of methanol.","A":"Methanol is technically secondary; OCR makes an error by calling it primary","B":"The primary classification covers alcohols where C* has 0 or 1 other carbon neighbours; methanol (0 C neighbours) fits this bracket by convention because the key distinction in reactivity is tertiary (no C–H on C*) vs non-tertiary (has a C–H on C*). Methanol behaves like other primary alcohols in oxidation: CH₃OH + [O] → HCHO (methanal) + H₂O. Combustion: 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O","C":"Methanol is primary because it has the fewest carbons, and the \"primary\" label refers to chain length, not substitution","D":"Methanol cannot be classified as primary, secondary, or tertiary because it has only one carbon","correct":"B","explain":"The three-class system (primary/secondary/tertiary) is based on how many other C atoms are bonded to C*. Primary: 0 or 1; secondary: 2; tertiary: 3. Methanol (0 C neighbours on C*) sits in the primary bracket. The real chemical significance of the classification is the oxidation pattern: tertiary alcohols have no C–H on C* and cannot be oxidised; all others (including methanol) can be. Methanol is oxidised first to methanal (formaldehyde, HCHO) and then to methanoic acid (HCOOH). Combustion of methanol: balance C first (1C → 1CO₂), then H (4H total → 2H₂O), then O: right side = 2+2=4 O, left side has 1 O in CH₃OH, so need 3/2 O₂ → multiply by 2: 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O. Check: left 2C, 8H, 2O + 6O = 8O; right 2C, 8H, 4O + 4O = 8O ✓."},{"stem":"Propan-2-ol and butan-1-ol are both tested with K₂Cr₂O₇/H₂SO₄. Both turn the solution orange → green. Explain how you would use a further chemical test — without additional reagents beyond those on an OCR chemistry specification — to distinguish between the aldehyde or ketone produced from each alcohol.","A":"Add more dichromate: the ketone will produce a second colour change while the aldehyde will not","B":"Use Tollens' reagent (ammoniacal silver nitrate): propan-2-ol (secondary) is oxidised to propanone (a ketone), while butan-1-ol (primary) is oxidised to butanal (an aldehyde) under distillation conditions. Tollens' gives a silver mirror with butanal but not with propanone — this distinguishes the two alcohols by the nature of their oxidation products","C":"Add bromine water: ketones decolourise bromine water but aldehydes do not","D":"Add NaOH: the ketone dissolves but the aldehyde does not","correct":"B","explain":"After oxidation with K₂Cr₂O₇/H₂SO₄, both solutions turn green, confirming oxidation occurred — but this alone cannot distinguish the secondary from the primary pathway. Propan-2-ol (secondary) → propanone (ketone); butan-1-ol (primary) → butanal (aldehyde) under distillation. Tollens' reagent (ammoniacal AgNO₃) distinguishes them: aldehydes reduce Ag⁺ to Ag (silver mirror), ketones do not. So: add Tollens' reagent; silver mirror = aldehyde = primary alcohol (butan-1-ol) was the starting material; no silver mirror = ketone = secondary alcohol (propan-2-ol). Note: option A is wrong because both products from propan-2-ol (ketone) and butan-1-ol (aldehyde) are already fully oxidised by the dichromate step; there is nothing further for a second dichromate addition to oxidise in the ketone. Option C is wrong because ketones do NOT decolourise bromine water; only aldehydes and alkenes do."},{"stem":"The structural isomers of C₄H₉OH that can be oxidised to a carboxylic acid under reflux with K₂Cr₂O₇/H₂SO₄ number fewer than the total C₄H₉OH isomers. Explain why, and identify all the C₄H₉OH isomers and their classes.","A":"Two isomers give carboxylic acids; the other two do not react","B":"Four structural isomers of C₄H₉OH exist: butan-1-ol (primary → butanoic acid), butan-2-ol (secondary → ketone, not carboxylic acid), 2-methylpropan-1-ol (primary → 2-methylpropanoic acid), 2-methylpropan-2-ol (tertiary → no reaction). Only the two primary isomers give a carboxylic acid under reflux; secondary gives a ketone; tertiary gives no reaction","C":"Three isomers give carboxylic acids because both primary and secondary alcohols can be oxidised to carboxylic acid","D":"Only one isomer (butan-1-ol) gives a carboxylic acid; all other C₄H₉OH isomers are tertiary","correct":"B","explain":"The four structural isomers of C₄H₉OH are: (1) Butan-1-ol (CH₃CH₂CH₂CH₂OH): primary (C* bonded to 1 other C) → oxidised with 2[O] under reflux to butanoic acid (CH₃CH₂CH₂COOH). (2) Butan-2-ol (CH₃CH(OH)CH₂CH₃): secondary (C* bonded to 2 C) → oxidised with 1[O] to butanone (CH₃COCH₂CH₃), a ketone — not a carboxylic acid. (3) 2-Methylpropan-1-ol ((CH₃)₂CHCH₂OH): primary (C* = the –CH₂OH end, bonded to 1 other C: the isopropyl group) → oxidised with 2[O] to 2-methylpropanoic acid ((CH₃)₂CHCOOH). (4) 2-Methylpropan-2-ol ((CH₃)₃COH): tertiary (C* bonded to 3 C) → no reaction. Therefore: 2 of the 4 isomers give carboxylic acids; 1 gives a ketone; 1 gives no reaction. Option C is wrong: secondary alcohols give ketones, not carboxylic acids (the ketone C=O carbon has no H for further oxidation)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
