<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

<script>
const QUESTIONS=[{"stem":"The OCR June 2024 examiner report for a question about reflux states: *\"IGNORE responses related to rate of reaction. IGNORE responses related to ensuring complete reaction.\"* Why are these two phrasings explicitly ignored rather than simply marked as wrong?","A":"They are factually incorrect — reflux does not increase the rate or drive a reaction to completion.","B":"They are true statements but are not the <b>specific</b> reason for using reflux rather than any other heated vessel. They apply to heating in general, not uniquely to the reflux condenser. OCR ignores them because they do not demonstrate understanding of what the condenser itself does.","C":"The mark scheme was wrong in previous years — these are now the accepted answers.","D":"They are correct answers, but they are too simple for A Level and so are not awarded.","correct":"B","explain":"Reflux does heat the mixture, so it does (correctly) increase the rate and may help drive a reaction toward completion. But these are consequences of <b>heating</b> — they apply equally to a beaker on a hot plate. The <b>unique feature</b> of reflux is the <b>vertical condenser</b> that condenses volatile vapour and returns it to the flask. Without the condenser, the vapour would escape — so the specific role of the reflux setup is to <b>prevent loss of volatile reactants or products by evaporation</b> while still allowing heating. OCR's mark scheme instruction \"IGNORE\" means: these answers are not wrong, but they do not credit the specific understanding being tested. Candidates who write \"to prevent loss of volatiles\" are demonstrating understanding of what the condenser does; those who write \"to increase the rate\" are demonstrating only that heating is occurring."},{"stem":"A student carries out the following preparation: 9.20 g of ethanol (M = 46.0 g mol⁻¹) is refluxed with excess propanoic acid (CH₃CH₂COOH) and conc. H₂SO₄. After purification, 11.22 g of ethyl propanoate (CH₃CH₂COOCH₂CH₃, M = 102 g mol⁻¹) is collected. Calculate the percentage yield to 3 significant figures.","A":"11.22 / 9.20 × 100 = 122% (error — dividing actual mass by starting reagent mass)","B":"55.0%","C":"27.5%","D":"11.22 / 102 × 100 = 11.0% (error — dividing actual mass by M_r only)","correct":"B","explain":"Step 1 — moles of ethanol (limiting reagent): n = 9.20 / 46.0 = <b>0.200 mol</b>. Step 2 — theoretical moles of ethyl propanoate: 1:1 stoichiometry (one ethanol gives one ester) → 0.200 mol maximum. Step 3 — theoretical mass: 0.200 × 102 = <b>20.4 g</b>. Step 4 — percentage yield: (11.22 / 20.4) × 100 = <b>55.0%</b> (3 s.f.). The two most common student errors: (A) dividing actual mass by the mass of starting material (9.20 g) rather than the theoretical mass of product — this gives a nonsensical result >100% if the product is heavier per mole; (D) dividing actual mass by M_r alone, which gives units of mol % not yield %. The correct method always uses: (actual mass obtained) / (theoretical mass = moles of limiting reagent × M_r of product) × 100."},{"stem":"Suggest one reason why the percentage yield in the preparation of ethyl ethanoate by Fischer esterification (ethanol + ethanoic acid, conc. H₂SO₄ catalyst, reflux) is typically below 100%, even when the procedure is carried out carefully.","A":"The heating mantle is not hot enough to drive the reaction to completion.","B":"Fischer esterification is a reversible reaction (equilibrium); even under optimised conditions the equilibrium position gives significantly less than 100% conversion, and product is also lost during the purification steps.","C":"Ethanol and ethanoic acid are both gases at the reflux temperature, so they escape before reacting.","D":"The H₂SO₄ catalyst destroys some of the ester by hydrolysis.","correct":"B","explain":"Two independent reasons for low yield in Fischer esterification: (1) <b>Reversibility</b>: RCOOH + R'OH ⇌ RCOOR' + H₂O has Kc ≈ 4 (not >100), so at equilibrium only ~66–70% conversion is possible from equimolar reactants. The yield can be increased by using excess alcohol or removing water, but it can never reach 100% without driving the equilibrium. (2) <b>Purification losses</b>: during washing (with Na₂CO₃), drying (with MgSO₄), and redistillation, some product is lost to the aqueous wash, to the solvent, and during transfer between flasks. OCR mark schemes accept: incomplete reaction (reversibility), loss during purification, transfer losses, side reactions. Option (D) is wrong in principle — the H₂SO₄ does catalyse the reverse hydrolysis, but at equilibrium this is already built into the Kc; it doesn't destroy ester net. \"The reaction is reversible/equilibrium\" is the primary answer OCR expects."},{"stem":"A student wants to synthesise 2-aminobutane (CH₃CH(NH₂)CH₂CH₃) from but-2-ene (CH₃CH=CHCH₃). Which multi-step route is consistent with OCR H432 specification reactions only?","A":"But-2-ene + NH₃ (excess ethanolic, reflux) → 2-aminobutane (direct addition of NH₃ across C=C)","B":"But-2-ene + HBr → 2-bromobutane; 2-bromobutane + excess ethanolic NH₃, sealed tube, reflux → 2-aminobutane (+ 2°, 3°, quaternary by-products)","C":"But-2-ene + Br₂ → 2,3-dibromobutane; 2,3-dibromobutane + KCN → 2,3-dicyanobutane","D":"But-2-ene + H₂O (steam, H₃PO₄) → butan-2-ol; butan-2-ol + K₂Cr₂O₇/H₂SO₄ → butanone; butanone + NH₃ → 2-aminobutane","correct":"B","explain":"The direct addition of NH₃ across a C=C (option A) is <b>not on the OCR spec</b>. The spec-allowed route: (1) <b>but-2-ene + HBr</b> (electrophilic addition, Markovnikov) → <b>2-bromobutane</b> (Br adds to the more substituted carbon — both carbons of the symmetrical but-2-ene are equivalent, so only one product). (2) <b>2-bromobutane + excess ethanolic NH₃</b>, sealed tube, reflux → <b>2-aminobutane</b> as the primary product (excess NH₃ suppresses over-substitution). Note: since 2-bromobutane is a <b>secondary</b> haloalkane, the product is a secondary amine (2-aminobutane already has one alkyl group on N; the route gives it directly by SN2). Option (C) installs CN on a secondary C — not well suited. Option (D) requires reduction of an imine (butanone → amine), which is not an OCR-spec transformation."},{"stem":"A student writes the following synthesis plan: *\"Phenylamine (C₆H₅NH₂) + conc. HNO₃/conc. H₂SO₄ at 50 °C → nitro-phenylamine → Sn/conc. HCl → diaminobenzene.\"* Identify the error in this plan and explain why.","A":"There is no error — phenylamine can be nitrated under these conditions without issue.","B":"The major error is that the –NH₂ group in phenylamine is a strongly activating, ring-directed group that would cause vigorous polynitration under these conditions; furthermore, under acidic conditions (H₂SO₄), the –NH₂ is protonated to –NH₃⁺, which is ring-deactivating and directs to the 3-position. The student should protect the –NH₂ (e.g. as an amide) before nitrating.","C":"The error is that phenylamine cannot be nitrated — the –NH₂ group prevents electrophilic substitution.","D":"The error is using Sn/HCl for the second step — NaBH₄ is required for nitro-group reduction.","correct":"B","explain":"Phenylamine presents a synthesis hazard: its –NH₂ group is a <b>powerful ring activator</b> (lone pair donation into the ring) that makes the ring far more reactive toward electrophilic substitution than benzene. Under HNO₃/H₂SO₄, the ring would undergo <b>polynitration</b> rather than mono-nitration, potentially producing explosive trinitroaniline. Additionally, H₂SO₄ <b>protonates</b> the –NH₂ group to –NH₃⁺ (deactivating, 3-directing), so the nitro group would be installed at the 3-position rather than the 4-position. In synthesis planning, this is why the <b>amine is installed last</b> (or the amine is protected as an acetamide before further aromatic electrophilic substitution). The Sn/HCl step is correct for nitro reduction; the error is in the nitration step sequence and conditions."},{"stem":"Which of the following statements correctly explains why a synthesis route with <b>four steps</b> at 80% yield each gives a lower overall yield than a <b>three-step</b> route at 75% yield each, even though the individual four-step yields are higher?","A":"Four steps give more opportunities for side reactions, so the overall atom economy is lower.","B":"The overall yield is 0.80⁴ = 41.0% (four steps) vs 0.75³ = 42.2% (three steps) — the fewer steps win despite lower individual yield, demonstrating that minimising the number of steps is a key principle of synthetic route design.","C":"The four-step route requires more reagents, so more starting material is needed and the yield is lower.","D":"The three-step route uses cheaper reagents, making it intrinsically more efficient.","correct":"B","explain":"Calculating: (1) <b>Four steps at 80%</b>: 0.80⁴ = 0.4096 → <b>41.0%</b> overall yield; (2) <b>Three steps at 75%</b>: 0.75³ = 0.4219 → <b>42.2%</b> overall yield. The three-step route wins by ~1.2 percentage points. This illustrates a fundamental principle of synthesis design: <b>every additional step multiplies losses</b>, so the route that achieves the target in fewer steps will usually give a higher overall yield, even if each individual step is slightly less efficient. In industrial synthesis (M0.2), this principle is economically significant — a 1% improvement in overall yield across a 100 tonne production run can save enormous material cost. The question tests mathematical understanding of multiplicative (not additive) yield."},{"stem":"A student is designing a route to make the aryl ketone 4-methoxyacetophenone (CH₃CO–C₆H₄–OCH₃, para isomer) from anisole (methoxybenzene, CH₃O–C₆H₅). They plan to use Friedel–Crafts acylation. Which OCR principle about aromatic directing effects determines where the acyl group enters, and is this consistent with the desired para product?","A":"The –OCH₃ group is deactivating and 3-directing; Friedel–Crafts would give the 3-substituted isomer, not the para product, so this route would not give the desired compound.","B":"The –OCH₃ group is activating and 2,4-directing (ortho/para director); Friedel–Crafts acylation of anisole gives mainly the 4-substituted product (para, because para is less sterically hindered than ortho), which is the desired 4-methoxyacetophenone.","C":"Methoxybenzene cannot undergo Friedel–Crafts reactions because the –OCH₃ group reacts with AlCl₃ to destroy the catalyst.","D":"Methoxybenzene undergoes nitration but not acylation — a different electrophile is required.","correct":"B","explain":"The <b>–OCH₃</b> group (methoxy) is an electron-<b>donating</b> group by resonance and induction — it donates lone-pair electron density into the ring via the oxygen, activating the ring toward electrophilic substitution. Its directing effect is <b>ortho/para</b> (2,4-directing). When anisole undergoes Friedel–Crafts acylation with CH₃COCl/AlCl₃, the acylium ion (CH₃CO⁺) preferentially attacks the 2- and 4-positions; the <b>para</b> (4-) isomer predominates over the ortho (2-) isomer due to steric factors (less steric hindrance at the para position than the ortho position). The product is therefore predominantly <b>4-methoxyacetophenone</b>, which is indeed the desired compound. Note: the –OCH₃ can react with AlCl₃ to form a complex, so Friedel–Crafts on phenols and methoxybenzenes can have complications in practice, but this is beyond OCR H432 specification."},{"stem":"A compound X contains three functional groups: a benzene ring, an ester (–COO–), and a carboxylic acid (–COOH). The student adds excess NaOH(aq). Predict the products, explaining what happens at each functional group site.","A":"The benzene ring undergoes hydroxylation; the ester undergoes transesterification; the carboxylic acid is reduced.","B":"The –COOH is neutralised to –COO⁻Na⁺ + H₂O; the ester (–COO–) undergoes alkaline hydrolysis (saponification) giving a carboxylate ion and an alcohol. The benzene ring is inert to NaOH. The overall products depend on the structure but include at least two carboxylate salts and an alcohol (or phenol).","C":"Only the –COOH reacts with NaOH; esters require acid hydrolysis.","D":"All three groups react with NaOH simultaneously, and the ring is hydroxylated at the activated positions.","correct":"B","explain":"Reasoning group by group: (1) <b>–COOH + NaOH</b> → –COO⁻Na⁺ + H₂O (acid–base neutralisation; fast at room temperature); (2) <b>Ester (–COO–) + NaOH(aq), heat</b> → carboxylate salt + alcohol (alkaline hydrolysis; IRREVERSIBLE because the carboxylate ion is resonance-stabilised and cannot re-esterify); (3) <b>Benzene ring</b>: inert to NaOH — benzene only undergoes electrophilic substitution, not nucleophilic attack by OH⁻ under these conditions. Products: if the ester is RCOO-R', you get RCOO⁻Na⁺ + R'OH; if the –COOH is R\"COOH, you get R\"COO⁻Na⁺. Option (C) is wrong — esters DO react with NaOH under reflux (alkaline hydrolysis). The key distinction from acid hydrolysis: alkaline is irreversible; acid is reversible."},{"stem":"A student needs to make propanoic acid (3 C) starting from ethanol (2 C). Which three-step sequence is consistent with the OCR H432 specification?","A":"Ethanol → (K₂Cr₂O₇/H₂SO₄, reflux) → ethanoic acid → (KCN/ethanol, reflux) → propanenitrile → (dilute HCl(aq), reflux) → propanoic acid — wrong: KCN reacts with haloalkanes (SN2), not with carboxylic acids; ethanoic acid is not a suitable substrate for KCN substitution","B":"Ethanol → (HBr, heat) → bromoethane → (KCN/ethanol, heat under reflux) → propanenitrile → (dilute HCl(aq), heat under reflux) → propanoic acid. Carbon count: 2C → 2C → 3C → 3C ✓","C":"Ethanol → (HBr) → bromoethane → (KCN/ethanol, reflux) → propanenitrile → (H₂/Ni, heat) → propan-1-amine (3 C amine, not propanoic acid — reduction of a nitrile gives an amine, not a carboxylic acid)","D":"Ethanol → (HBr) → bromoethane → (KCN/ethanol, reflux) → propanenitrile → (LiAlH₄ in dry ether, then H₂O work-up) → propan-1-amine (3 C amine — LiAlH₄ also reduces the nitrile to an amine, not a carboxylic acid)","correct":"B","explain":"The only OCR-spec reaction that extends the carbon chain is <b>KCN nucleophilic substitution</b> on a haloalkane (+1 C). Route B: <b>Step 1</b> — ethanol + HBr → bromoethane (2 C). <b>Step 2</b> — bromoethane + KCN in ethanol, heat under reflux → propanenitrile (3 C) + KBr. <b>Step 3</b> — propanenitrile + dilute HCl(aq) (or H₂SO₄(aq)), heat under reflux → propanoic acid (3 C) + NH₄⁺ (acid hydrolysis). Options C and D both correctly chain-extend to propanenitrile but exit incorrectly: H₂/Ni or LiAlH₄ <b>reduce</b> C≡N → CH₂NH₂ (a primary amine); to get the carboxylic acid, acid hydrolysis is required (C≡N + H₂O/H⁺ → COOH). Option A is wrong because KCN requires a haloalkane electrophile — it cannot substitute on a carboxylic acid."},{"stem":"A student is given a 6-mark Level of Response question: *\"Starting from ethanol, plan a three-stage synthesis to prepare N-ethylpropanamide (CH₃CH₂CO–NHCH₂CH₃).\"* Analyse the correct route and identify what a top-band answer must include.","A":"The route is: ethanol → ethanoyl chloride (SOCl₂) → N-ethylethanamide (+ ethylamine). This is two stages and gives the wrong amide.","B":"The route is: Step 1 — ethanol + HBr → bromoethane; Step 2 — bromoethane + KCN/ethanol, reflux → propanenitrile; Step 3 — propanenitrile + dilute HCl(aq), reflux → propanoic acid. A top-band answer must also identify that propanoic acid can be converted to propanoyl chloride (SOCl₂) and propanoyl chloride + ethylamine → N-ethylpropanamide — but this is a FOURTH step, not three. A fully correct 3-stage route to the amide requires recognising that the nitrile can instead be directly used.","C":"The route is: ethanol → ethylamine (using excess ethanolic NH₃) → N-ethylpropanamide (adding propanoic acid and conc. H₂SO₄). This is wrong because amines + carboxylic acids form ammonium salts, not amides, without activation.","D":"The route is: benzene + propanoyl chloride/AlCl₃ → aryl ketone; ketone + ethylamine → N-ethylpropanamide. This incorrectly involves benzene and Friedel–Crafts.","correct":"B","explain":"N-ethylpropanamide (CH₃CH₂CONHCH₂CH₃) contains a <b>3-carbon propanoyl group</b> and an <b>N-ethyl group</b>. Starting from ethanol (2 C): the propanoyl group requires 3 C, which means chain extension. A 3-stage route: (1) <b>Ethanol + HBr → bromoethane</b> (SN2/substitution, 2 C); (2) <b>Bromoethane + KCN/ethanol, reflux → propanenitrile</b> (chain extension to 3 C); (3) <b>Propanenitrile + dilute HCl(aq), reflux → propanoic acid</b> (3 C). This gives propanoic acid — then a <b>fourth</b> step with SOCl₂ and ethylamine is needed for the amide. Alternatively, skip to: propanenitrile → propanoyl chloride is not a direct spec step. A top-band answer would: correctly identify all three/four reagents and conditions; write balanced equations for each step; note that RCOOH + RNH₂ gives a salt not an amide (activation needed); and recognise that the most efficient route uses propanoyl chloride + ethylamine at the final step. OCR LoR questions reward <b>correct order</b>, <b>correct equations</b>, and <b>correct reagents</b> — all three together earn the top band."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
