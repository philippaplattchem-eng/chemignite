<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">

  <h1>1.4 Further Physical Chemistry Practicals</h1>
  <span class="tier-badge mcq">MCQ Practice</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions</span>
    <span>Practical skills MCQ practice</span>
  </div>
  <div id="score-banner" class="score-banner"></div>

<script>
const QUESTIONS=[{"stem":"The decomposition of H₂O₂ is catalysed by MnO₂. A student collects the O₂ produced and finds the half-life is constant at 340 s regardless of the initial concentration. What order is the reaction with respect to H₂O₂? A. Zero order — constant half-life means rate is independent of concentration B. First order — a constant half-life is the hallmark of a first-order reaction C. Second order — constant half-life arises when the rate constant doubles each cycle D. The order cannot be determined from half-life data alone","A":"","B":"","C":"","D":"","correct":"","explain":"A constant half-life is the defining characteristic of a first-order reaction. For a first-order process, t½ = ln2 / k; since k is constant, t½ is constant and independent of the initial concentration. For zero order, t½ ∝ 1/[A]₀ (decreases as reaction proceeds); for second order, t½ ∝ 1/[A] (increases as concentration falls). Verifying constant half-life across multiple successive intervals is the standard method for confirming first-order kinetics from concentration–time data."},{"stem":"A student measures the rate of H₂O₂ decomposition by collecting gas over water in an inverted measuring cylinder rather than using a gas syringe. The results show a lower measured volume of O₂ than expected. What is the most likely reason? A. The catalyst MnO₂ absorbs some of the O₂ produced B. O₂ is slightly soluble in water; some dissolves into the solution rather than being collected as gas, underestimating the true volume C. The measuring cylinder cools the gas, causing thermal contraction and apparent volume loss D. Atmospheric pressure inside the cylinder is lower than expected, expanding the gas","A":"","B":"","C":"","D":"","correct":"","explain":"O₂ has a small but non-negligible solubility in water (about 8 mg dm⁻³ at 25 °C). When collected over water, a fraction of the O₂ dissolves rather than forming gas bubbles, giving a measured gas volume lower than theoretically expected. A gas syringe avoids this problem because no liquid is present to dissolve the gas. This is why gas syringes are the preferred collection method for kinetics experiments involving slightly water-soluble gases. CO₂ has much higher solubility and would give an even larger underestimate."},{"stem":"Calcium carbonate chips react with 1.00 mol dm⁻³ HCl. The rate is measured by mass loss using a cotton wool plug in the flask opening. What is the purpose of the cotton wool? A. Cotton wool prevents O₂ from entering the flask and oxidising the calcium carbonate B. To filter the CO₂ gas, trapping impurities before the gas escapes C. Cotton wool traps any acid spray or mist that would otherwise escape the flask and be recorded as mass loss, which would be falsely attributed to CO₂ production D. To slow the rate of CO₂ escape so the balance reading is more stable","A":"","B":"","C":"","D":"","correct":"","explain":"When CO₂ bubbles burst at the liquid surface, they eject tiny droplets of acid solution as an aerosol. If these escape the flask, the balance records a mass loss that is not solely from CO₂ but also from lost acid — inflating the apparent rate. Cotton wool (or a loose foam plug) allows CO₂ to escape freely while trapping acid mist inside the flask. Critically, cotton wool must not be so tightly packed that it impedes CO₂ escape, which would invalidate the mass-loss measurement."},{"stem":"A student replaces calcium carbonate chips with powder to increase the surface area. The rate increases. The student claims \"there are more collisions between HCl molecules and CaCO₃.\" What improvement should the student make to this explanation? A. The student should specify that collisions with sufficient energy also increase B. The student must say \"more collisions per unit time\" — simply \"more collisions\" is insufficient; it is the collision frequency (collisions per second) that increases with surface area, not just a vague total number C. The student should mention that activation energy is lowered by the increased surface area D. No improvement needed — \"more collisions\" is accepted by OCR mark schemes","A":"","B":"","C":"","D":"","correct":"","explain":"OCR mark schemes consistently require \"more frequent collisions\" or \"more collisions per unit time\" — not merely \"more collisions.\" Saying \"more collisions\" without the time qualifier is ambiguous (over the entire reaction lifetime, there are ultimately the same number of moles reacting). The key mechanistic point is that a larger surface area exposes more CaCO₃ to HCl at any given instant, increasing collision frequency between acid molecules and solid surface, and therefore increasing rate. This distinction was flagged specifically in OCR examiner reports as a discriminator between strong and weaker answers."},{"stem":"Magnesium ribbon reacts with 1.00 mol dm⁻³ HCl. A student notices an induction period — a brief delay before rapid gas evolution begins. What causes this induction period? A. The HCl takes time to diffuse through the solvent to reach the Mg surface B. Magnesium ribbon is covered by a thin layer of MgO on its surface; this must first dissolve in the HCl before the reactive Mg metal is exposed C. The activation energy for Mg + HCl is high and takes time to be reached at room temperature D. CO₂ from dissolved atmospheric CO₂ inhibits the reaction initially","A":"","B":"","C":"","D":"","correct":"","explain":"Magnesium metal in air is rapidly oxidised to form a thin coating of MgO on its surface. MgO reacts more slowly with HCl than Mg metal does. The induction period represents the time for HCl to dissolve the MgO layer: MgO + 2HCl → MgCl₂ + H₂O. Once the oxide layer is removed, clean Mg metal is exposed and H₂ evolution begins rapidly. Polishing the ribbon with sandpaper before use removes the oxide layer and eliminates the induction period. This is also why Mg powder (no stable thick oxide layer) reacts immediately with no induction period."},{"stem":"To investigate the effect of HCl concentration on the rate of Mg + HCl, a student plans to use Mg powder for one set of experiments and Mg ribbon for another. Why is this a flawed experimental design? A. The molar mass of Mg changes depending on its physical form B. Mg powder and ribbon react by different mechanisms with HCl C. Mg powder has far greater surface area than ribbon; changing between forms introduces a second variable (surface area) alongside concentration, violating the control of variables D. Mg powder is too fine to measure accurately by mass","A":"","B":"","C":"","D":"","correct":"","explain":"A valid rate investigation must change only one variable at a time. Mg powder and ribbon have different surface areas, so if both are used across experiments, any change in rate could be due to either the concentration change or the surface area change. The student cannot attribute the rate change solely to concentration. To control for surface area, the same physical form (consistently ribbon of fixed length, or powder of fixed particle size) should be used throughout the concentration series. This is a standard required practical design error flagged in OCR examiners' reports."},{"stem":"In the iodine clock reaction, sodium thiosulfate is added to the reaction mixture alongside starch indicator. Iodine is produced in the main reaction, then immediately reduced by thiosulfate: I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻. The blue–black colour appears when all the thiosulfate is consumed. A student calculates rate using rate = [S₂O₃²⁻]₀ / t. What factor of 2 error has the student made? A. The student should use [I₂] rather than [S₂O₃²⁻] in the numerator B. From stoichiometry, 2 mol S₂O₃²⁻ react per mol I₂; the moles of I₂ produced equal [S₂O₃²⁻]₀ / 2 — dividing by 2 gives the correct rate: rate = [S₂O₃²⁻]₀ / (2t) C. The student should multiply by 2 because two products are formed in the reaction D. No error — using [S₂O₃²⁻]₀ / t is the correct iodine clock formula","A":"","B":"","C":"","D":"","correct":"","explain":"The stoichiometric ratio is 1 mol I₂ : 2 mol S₂O₃²⁻. When all thiosulfate is consumed, the moles of I₂ produced equals [S₂O₃²⁻]₀ / 2. The rate of I₂ production (and therefore the rate of the overall reaction) is therefore [S₂O₃²⁻]₀ / (2t). Using [S₂O₃²⁻]₀ / t overestimates the rate of I₂ formation by a factor of 2. The factor of 2 from the stoichiometry of the thiosulfate–iodine redox reaction is a frequent source of error in iodine clock calculations and is specifically tested on OCR H432 papers."},{"stem":"In an iodine clock experiment, a student doubles the concentration of one reactant while keeping all others constant and finds the time for the blue colour to appear halves. What is the order of reaction with respect to that reactant? A. Zero order — doubling concentration has no effect if the order is zero, but the time changed B. First order — doubling concentration doubles the rate, so the time taken (∝ 1/rate) halves C. Second order — doubling concentration quadruples the rate, reducing time to one quarter D. The order cannot be determined because time and rate are not simply related","A":"","B":"","C":"","D":"","correct":"","explain":"In the iodine clock, the time t to the colour change is inversely proportional to the initial rate (rate ∝ 1/t). If doubling [A] causes t to halve, then rate doubles — consistent with rate ∝ [A]¹. For second order, doubling [A] would quadruple the rate (t would reduce to t/4). For zero order, doubling [A] would have no effect on rate (t unchanged). Comparing the factor by which t changes versus the factor by which concentration changes is the standard iodine clock method for determining orders."},{"stem":"In the thiosulfate–acid clock reaction (Na₂S₂O₃ + HCl), a student plots 1/t against [Na₂S₂O₃] and obtains a straight line through the origin. What does this graph indicate about the reaction order with respect to thiosulfate? A. Zero order — a straight line shows no dependence on concentration B. Second order — 1/t vs concentration gives a straight line for second-order reactions C. First order — 1/t is proportional to rate; if 1/t ∝ [Na₂S₂O₃], then rate ∝ [Na₂S₂O₃]¹, indicating first order D. The order cannot be determined — a graph of 1/t vs concentration is not a valid kinetic method","A":"","B":"","C":"","D":"","correct":"","explain":"Since rate ∝ 1/t (for a fixed extent of reaction), a plot of 1/t against [Na₂S₂O₃] is equivalent to a rate–concentration graph. A straight line through the origin shows that rate ∝ [Na₂S₂O₃], confirming first-order dependence. If the relationship were second order, 1/t would be proportional to [Na₂S₂O₃]², giving a curve on a 1/t vs [concentration] graph but a straight line on a 1/t vs [concentration]² graph. This graphical method using 1/t as a proxy for rate is a core required practical skill for OCR H432."},{"stem":"An Arrhenius plot for the thiosulfate–acid reaction uses ln(1/t) on the y-axis and 1/T on the x-axis. The gradient of the best-fit line is −6250 K. What is the activation energy in kJ mol⁻¹? (R = 8.314 J K⁻¹ mol⁻¹) A. 6250 kJ mol⁻¹ B. 6250 / 8.314 = 751 kJ mol⁻¹ C. −(−6250) × 8.314 = 51 960 J mol⁻¹ = 52.0 kJ mol⁻¹ D. 6250 × 8.314 / 1000 = 51.9 kJ mol⁻¹ — same numerical answer but sign error expected","A":"","B":"","C":"","D":"","correct":"","explain":"The Arrhenius equation linearised: ln k = ln A − Ea/RT, so a plot of ln k (or ln(1/t)) vs 1/T gives gradient = −Ea/R. Therefore Ea = −gradient × R = −(−6250) × 8.314 = 51 960 J mol⁻¹ = 52.0 kJ mol⁻¹. The negative gradient confirms that rate decreases as 1/T increases (i.e. rate increases with temperature). Always divide by 1000 to convert J mol⁻¹ to kJ mol⁻¹ and quote to 3 s.f. A common error is to omit the sign flip (using gradient directly rather than −gradient), giving a negative activation energy which is physically meaningless."},{"stem":"Calculate the pH of 0.0500 mol dm⁻³ ethanoic acid (Ka = 1.74 × 10⁻⁵ mol dm⁻³). Give your answer to 2 decimal places. A. pH = 4.76 (= pKa; correct only at the half-equivalence point, not for the pure acid) B. pH = 6.06 (square root step omitted: [H⁺] = Ka × [HA] = 8.70 × 10⁻⁷) C. pH = 3.03 D. pH = 1.30 (treated as strong acid: [H⁺] = 0.0500)","A":"","B":"","C":"","D":"","correct":"","explain":"For a weak acid: [H⁺] = √(Ka × [HA]) = √(1.74 × 10⁻⁵ × 0.0500) = √(8.70 × 10⁻⁷) = 9.33 × 10⁻⁴ mol dm⁻³. pH = −log(9.33 × 10⁻⁴) = 3.03 (2 d.p.). Three classic errors: (B) forgetting the square root — giving [H⁺] = 8.70 × 10⁻⁷ → pH 6.06; (D) treating the weak acid as fully dissociated like a strong acid; (A) using pKa directly (only valid at the half-equivalence point where [HA] = [A⁻]). OCR H432/01 June 2019 Examiner Report identified omitting the square root, using the wrong Ka value, and quoting pH to fewer than 2 decimal places as the three most penalised weak-acid pH errors."},{"stem":"A student calculates the pH of 0.100 mol dm⁻³ CH₃COOH (Ka = 1.74 × 10⁻⁵ mol dm⁻³) and obtains pH = 5.76. What error did the student make? A. The student used Ka instead of pKa B. The student forgot to take the square root: they calculated [H⁺] = Ka × [HA] = 1.74 × 10⁻⁶ and then pH = −log(1.74 × 10⁻⁶) = 5.76, instead of [H⁺] = √(Ka × [HA]) = 1.32 × 10⁻³ giving pH = 2.88 C. The student divided Ka by [HA] instead of multiplying D. The student used the wrong value of [HA] — should be 0.0100 mol dm⁻³","A":"","B":"","C":"","D":"","correct":"","explain":"The correct weak acid formula is [H⁺] = √(Ka × [HA]). Omitting the square root gives [H⁺] = Ka × [HA] = 1.74 × 10⁻⁵ × 0.100 = 1.74 × 10⁻⁶ → pH = 5.76. The correct calculation: [H⁺] = √(1.74 × 10⁻⁵ × 0.100) = √(1.74 × 10⁻⁶) = 1.32 × 10⁻³ → pH = 2.88. The answer 5.76 for 0.100 mol dm⁻³ ethanoic acid is a well-known incorrect answer that has appeared in student work so frequently that OCR examiners specifically name it as the most common weak-acid pH error."},{"stem":"A weak acid (HA) is titrated with a strong base (NaOH). Which of the following correctly describes the equivalence point and the appropriate indicator? A. Equivalence point at pH 7; methyl orange (pH 3.1–4.4) B. Equivalence point at pH 7; phenolphthalein (pH 8.3–10.0) C. Equivalence point at pH > 7 (alkaline); phenolphthalein — its range (8.3–10.0) lies within the steep vertical section of the curve near the equivalence point D. Equivalence point at pH < 7; methyl orange — weak acids reach equivalence below neutrality","A":"","B":"","C":"","D":"","correct":"","explain":"At the equivalence point of a weak acid–strong base titration, only the conjugate base (A⁻) is present in solution. A⁻ undergoes hydrolysis: A⁻ + H₂O ⇌ HA + OH⁻, producing OH⁻ and making the solution alkaline (pH typically 8–10 depending on Ka). Phenolphthalein (range 8.3–10.0) changes colour within the steep vertical section of the curve. Methyl orange (3.1–4.4) changes colour in the early buffering region, far before the equivalence point, giving a grossly incorrect titre. This is the reverse of a strong acid–weak base titration, where methyl orange is used."},{"stem":"At the half-equivalence point of a weak acid–strong base titration, exactly half the acid has been neutralised. A student measures the pH at this point and finds it equals 4.76. What is the Ka of the acid? A. Ka = 4.76 mol dm⁻³ B. Ka = 10⁻⁴·⁷⁶ / 2 = 8.7 × 10⁻⁶ mol dm⁻³ C. Ka = 4.76 × 10⁻⁵ mol dm⁻³ D. Ka = 10⁻⁴·⁷⁶ = 1.74 × 10⁻⁵ mol dm⁻³","A":"","B":"","C":"","D":"","correct":"","explain":"At the half-equivalence point, [HA] = [A⁻] (half the acid neutralised, half remaining). The Henderson–Hasselbalch equation gives pH = pKa + log([A⁻]/[HA]) = pKa + log(1) = pKa. Therefore pKa = 4.76 and Ka = 10⁻⁴·⁷⁶ = 1.74 × 10⁻⁵ mol dm⁻³. This is a powerful graphical method: identify the half-equivalence point volume on the titration curve, read off the pH, and that pH equals pKa directly. OCR frequently tests this relationship in both theory and data-analysis questions."},{"stem":"A buffer solution is made by mixing ethanoic acid and sodium ethanoate. A small amount of NaOH is added. Which equation shows how the buffer resists the pH change, and what happens to the ratio [A⁻]/[HA]? A. CH₃COOH + NaOH → CH₃COONa + H₂O; [A⁻]/[HA] decreases, lowering pH B. CH₃COO⁻ + NaOH → CH₃COOH + OH⁻; the ratio decreases, raising pH C. CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O; [A⁻]/[HA] increases slightly, raising pH only very slightly compared with an unbuffered solution D. CH₃COO⁻ + H⁺ → CH₃COOH; [A⁻]/[HA] increases because Na⁺ is produced","A":"","B":"","C":"","D":"","correct":"","explain":"When OH⁻ is added to the buffer, the weak acid component reacts: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O. This consumes most of the OH⁻ before it can raise [OH⁻] significantly, and converts some HA to A⁻ — increasing [A⁻]/[HA] slightly. By Henderson–Hasselbalch, pH = pKa + log([A⁻]/[HA]), so pH increases very slightly. Because both [HA] and [A⁻] are large (buffer capacity), the ratio change is tiny and pH barely shifts. Without the buffer, the same quantity of NaOH would cause a large pH jump. When acid is added, the reverse applies: A⁻ + H⁺ → HA, increasing [HA] and lowering pH only slightly."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
