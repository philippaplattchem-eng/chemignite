<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

<body>
<header class="site-header">

  <h1>6.5 Stereoisomerism</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>

<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Inferno: Multi-step &amp; analyse</span>
  </div>

<script>
const QUESTIONS=[{"stem":"A student answers a question asking for the definition of stereoisomerism by writing: *\"Optical isomers are stereoisomers — they are non-superimposable mirror images that rotate plane-polarised light in equal but opposite directions.\"* What is wrong with this answer, and what would it score on the OCR mark scheme?","A":"The answer is entirely correct and would score full marks.","B":"The answer describes a specific type of stereoisomers (optical isomers) rather than giving the general definition. OCR explicitly states \"reference to optical isomerism is not sufficient\" — the answer would score zero for the definition mark.","C":"The answer loses marks because it uses the phrase \"non-superimposable\" which is not in the OCR specification.","D":"The answer scores the definition mark but loses a second mark for not mentioning E/Z isomers.","correct":"B","explain":"The OCR June 2019 mark scheme instruction reads: *\"DO NOT ALLOW… Reference to E/Z isomerism or optical isomerism is not sufficient.\"* For a \"define stereoisomerism\" question (typically 1 mark), the required answer is: <b>same structural formula AND different arrangement of atoms in space</b>. Describing optical isomers specifically — even correctly — does not earn the definition mark because the question asks for stereoisomerism in general. The student's answer is factually accurate about optical isomers but is <b>not the required definition</b>. A similar error occurs when students write \"stereoisomers are E/Z isomers\" — both specific types fail the test. The two-part phrasing must be memorised precisely."},{"stem":"Thalidomide was administered as a racemate in the 1950s as a sedative for morning sickness. One enantiomer was sedative; the other caused severe birth defects (teratogenicity). Why could separating and administering only the sedative enantiomer NOT fully prevent the teratogenic effects in vivo?","A":"The sedative enantiomer could be converted to the teratogenic enantiomer by enzymes in the liver under physiological conditions (racemisation in vivo).","B":"The two enantiomers could not be separated because they are indistinguishable by all analytical methods.","C":"The teratogenic enantiomer is produced when the body metabolises the sedative enantiomer into a completely different compound.","D":"The racemate is more soluble in blood plasma, so separating the enantiomers makes the drug ineffective.","correct":"A","explain":"Even if the pure (+) sedative enantiomer were administered, <b>thalidomide can undergo racemisation under the mildly basic conditions in the body</b> (pH ≈ 7.4). The α-carbon of thalidomide is adjacent to an acidic N-H and can be deprotonated and reprotonated, allowing the configuration to invert. This interconversion of the two enantiomers in vivo means that giving the \"safe\" enantiomer will gradually generate the \"unsafe\" one inside the body. This is an important lesson: for any drug where racemisation is possible in vivo, a single-enantiomer formulation does not guarantee safety unless the molecule is resistant to in vivo epimerisation."},{"stem":"Compound P has the condensed structural formula CH₃CH(NH₂)CH₂COOH. It is a β-amino acid (the –NH₂ is on the β-carbon, C3, not the α-carbon, C2 relative to –COOH). How many chiral centres does compound P have and which carbon(s) carry them?","A":"0 — no carbon has four different groups.","B":"1 — at C3 (the –CH(NH₂)– carbon).","C":"2 — at C2 (–CH₂–) and C3 (–CH(NH₂)–).","D":"1 — at C2 (the –CH₂– adjacent to –COOH).","correct":"B","explain":"Numbering from the –COOH end: C1 = –COOH (sp², carbonyl, <b>not chiral</b>). C2 = –CH₂– (two H atoms, <b>not chiral</b>). C3 = –CH(NH₂)– with four groups: –H, –NH₂, –CH₃ (to C4), and –CH₂COOH (to C2–C1). All four are different → <b>C3 is the chiral centre</b>. C4 = –CH₃ (terminal methyl, three H atoms, <b>not chiral</b>). Option (C) incorrectly classifies C2 as chiral — a –CH₂– group always has two H atoms and can never be a chiral centre. Option (D) incorrectly picks C2 for the same reason. This type of question — locating a chiral centre in an unfamiliar amino acid structure — is a standard Inferno-level task in OCR Section B."},{"stem":"A student draws the two optical isomers of 2-bromobutane by writing two identical displayed structural formulae side by side on the page, separated by a vertical mirror line. The examiner scores 0 marks. What is the specific error?","A":"The student used 2-bromobutane instead of butan-2-ol, which is the only correct example for this spec point.","B":"The student placed the mirror line between the two structures, which is not required by OCR.","C":"The two flat 2D structures cannot convey the 3D arrangement at the chiral centre — without bold and dashed wedge bonds, the structures appear identical and are trivially superimposable.","D":"The student drew too many bonds around the chiral carbon.","correct":"C","explain":"OCR June 2023 examiner report: *\"Optical isomers do require the use of bold and dashed wedges.\"* A flat 2D structural formula of 2-bromobutane drawn with plain lines looks the same regardless of the spatial arrangement at C2 — you cannot distinguish the two enantiomers from a 2D drawing. The marker cannot award the diagram mark because the structures could be rotated onto each other (they appear identical on the page). The correct approach is: draw C2 at the centre with two bonds in the plane of the page (plain lines), one substituent on a bold wedge (coming out), and one on a dashed wedge (going behind). The mirror image then reverses the bold and dashed positions."},{"stem":"D-glucose (open-chain form) has 4 chiral centres at C2, C3, C4, and C5. Applying the 2ⁿ formula, there are 16 possible stereoisomers. If a chemist synthesises glucose from achiral starting materials without any chiral catalyst, which mixture of isomers is expected?","A":"Only D-glucose, because it is the thermodynamically most stable isomer.","B":"A 1:1 mixture of D-glucose and L-glucose only (one racemate), ignoring the other 14 stereoisomers.","C":"A statistical mixture of all 16 possible stereoisomers in roughly equal proportions, because each chiral centre is created independently without a chiral influence.","D":"Only L-glucose, because synthetic reactions favour the laevorotatory isomer.","correct":"C","explain":"When a new chiral centre is created by a reaction with achiral reagents in an achiral environment, the two possible configurations at that centre are formed with equal probability (50:50). If 4 chiral centres are created sequentially or independently, each with equal probability of R or S configuration, the statistical outcome is all 2⁴ = 16 possible diastereomers and enantiomers in roughly equal proportions. No particular stereoisomer is preferred. This is why biological systems (which use chiral enzymes as catalysts) are essential for making D-glucose specifically — the enzyme provides a chiral template that selects one configuration at each centre. Option (B) ignores the diastereomers formed when only some of the 4 centres invert."},{"stem":"An enzyme active site catalyses the hydrolysis of a specific peptide bond in the L-alanine form of alanyl-glycine but does not catalyse the same reaction in the D-alanine form. What is the correct explanation?","A":"L-alanine and D-alanine have different molecular masses, so the enzyme cannot bind the wrong isomer.","B":"The enzyme active site is itself chiral (being composed of L-amino acids), so it forms complementary interactions with only one enantiomer. The D-form cannot be accommodated in the correct orientation for catalysis.","C":"D-alanine is resistant to all enzymes because all enzymes are deactivated by molecules that rotate plane-polarised light anticlockwise.","D":"L-alanine and D-alanine have different solubility in the cytoplasm, so D-alanine never reaches the enzyme.","correct":"B","explain":"Enzymes are proteins made entirely from <b>L-amino acids</b> linked by peptide bonds. The active site therefore has a specific three-dimensional chiral shape. The enzyme–substrate interaction depends on the precise fit between the three-dimensional shape of the substrate and the complementary shape of the active site. The <b>L-alanyl-glycine</b> substrate fits perfectly — its substituents align with the correct binding groups in the active site. The <b>D-alanyl-glycine</b> enantiomer, while identical in most chemical properties, has the mirror-image arrangement at the alanine α-carbon. This mirror-image shape cannot simultaneously position the correct groups for catalysis. This is the molecular basis of enzyme stereospecificity: a chiral environment (the enzyme) distinguishes the two enantiomers."},{"stem":"A synthesis of a drug molecule requires three steps. Step 1 converts a planar starting material to an sp³ product. Step 2 is an oxidation that converts the primary alcohol into a carboxylic acid without touching the chiral centre. Step 3 is an elimination to form a C=C double bond not at the chiral carbon. At which step is the chiral centre introduced, and in what ratio of enantiomers?","A":"Step 1; one enantiomer is produced preferentially because the reagents are asymmetric.","B":"Step 1; a racemic mixture (1:1 ratio) is produced unless a chiral catalyst or chiral starting material is used.","C":"Step 2; the carboxylic acid group introduces the chiral centre.","D":"Step 3; the elimination introduces the chiral centre at the new sp³ carbon.","correct":"B","explain":"A chiral centre is created when an <b>sp² carbon</b> (planar, 3-substituent) is converted to an <b>sp³ carbon</b> (tetrahedral, 4-substituent) during Step 1. Without a chiral influence, the nucleophile/reagent attacks both faces of the planar carbon with equal probability → <b>racemate (1:1 ratio)</b>. Step 2 (oxidation of –CH₂OH → –COOH) converts one functional group into another on a carbon that already has its connectivity set — it does not create a new tetrahedral centre. Step 3 (elimination) creates a new <b>sp² carbon</b> (C=C) — which removes a chiral centre rather than creating one. The key rule: <b>new chiral centres are created when sp² → sp³ conversion occurs</b>; they are destroyed when sp³ → sp² conversion occurs."},{"stem":"3-methylpentane has the condensed formula CH₃CH₂CH(CH₃)CH₂CH₃. Does it have a chiral centre?","A":"Yes — the central C3 carbon has four different substituents.","B":"No — the C3 carbon carries two –CH₂CH₃ groups, which are identical.","C":"Yes — the C3 carbon carries a methyl group, making all four groups different.","D":"No — 3-methylpentane has no carbon bonded to any heteroatom, so it cannot be chiral.","correct":"B","explain":"C3 in 3-methylpentane carries: –H, –CH₃, –CH₂CH₃ (going to C2–C1), and –CH₂CH₃ (going to C4–C5). The two ethyl groups (–CH₂CH₃) extending in either direction along the main chain are <b>identical</b> — walking both chains from C3, they are CH₂CH₃ in both directions. Because two substituents are the same, C3 is <b>not</b> a chiral centre. This is one of the subtler cases: you must follow each chain from the central carbon until you find a difference (or confirm they are identical). Contrast with 2-methylbutane (CH₃CH(CH₃)CH₂CH₃) — C2 there carries –H, –CH₃, –CH₃, –CH₂CH₃; the two methyl groups duplicate, again not chiral. Contrast further with 3-methylhexane (CH₃CH₂CH(CH₃)CH₂CH₂CH₃) — C3 would carry –CH₂CH₃ and –CH₂CH₂CH₃, which are different."},{"stem":"A complex natural product has the following sp³ carbon centres identified: C4 (–OH, –H, –CHR₁, –CHR₂ where R₁ ≠ R₂ and neither ≡ the other groups), C6 (ring junction bonded to four different ring fragments), C9 (–CH₂– bridging two identical ring portions). Which of these are chiral centres?","A":"C4 and C9 only","B":"C4, C6, and C9","C":"C6 only","D":"C4 and C6 only","correct":"D","explain":"C4 carries –OH, –H, and two different ring-chain fragments (R₁ ≠ R₂ by definition given) — <b>four different groups → chiral centre</b>. C6 is a ring junction bonded to four different ring fragments — <b>four different groups → chiral centre</b>. C9 is –CH₂– bridging two identical ring portions: it carries two H atoms → only three different groups → <b>not a chiral centre</b>. Ring junction carbons in steroids and natural products are very commonly chiral because the chains extending in opposite directions around the ring system are asymmetric — this is the basis for the 6–8 chiral centres typical of steroid molecules. CH₂ groups are always eliminated in the first step of the algorithm because two H atoms are always identical."},{"stem":"A student is given four compounds and must rank them by number of chiral centres (ascending). The four compounds are: (i) glycine H₂NCH₂COOH; (ii) alanine CH₃CH(NH₂)COOH; (iii) serine HOCH₂CH(NH₂)COOH; (iv) open-chain glucose HOCH₂(CHOH)₄CHO. Which ranking is correct?","A":"(i) < (ii) = (iii) < (iv); counts: 0, 1, 1, 4","B":"(i) < (ii) < (iii) < (iv); counts: 0, 1, 2, 4","C":"(i) = (ii) < (iii) < (iv); counts: 0, 0, 1, 4","D":"(i) < (ii) = (iii) = (iv); counts: 0, 1, 1, 1","correct":"A","explain":"(i) Glycine: α-C has –H, –H, –NH₂, –COOH → two identical H → <b>0 chiral centres</b>. (ii) Alanine: α-C has –H, –NH₂, –CH₃, –COOH → all different → <b>1 chiral centre</b>. (iii) Serine: α-C has –H, –NH₂, –CH₂OH, –COOH → all different → <b>1 chiral centre</b> (the –CH₂OH carbon itself has two H atoms → not chiral). (iv) Open-chain glucose: C1 (sp²) and C6 (–CH₂OH) not chiral; C2, C3, C4, C5 each have –H, –OH, and two different chain fragments → <b>4 chiral centres</b>. Final ranking: 0 < 1 = 1 < 4 → <b>(i) < (ii) = (iii) < (iv)</b>. Option (B) incorrectly assigns 2 chiral centres to serine, perhaps mistakenly including the –CH₂OH side chain carbon (which has two H atoms and is not chiral)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
