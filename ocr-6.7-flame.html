<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}

.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

<script>
const QUESTIONS=[{"stem":"Why must ethanol (rather than water) be used as the solvent when KCN reacts with a haloalkane to form a nitrile?","A":"KCN is insoluble in water, so a different solvent is needed to dissolve it.","B":"Water as a solvent introduces hydroxide ions that compete with CN⁻ as nucleophiles (giving an alcohol) and can also cause elimination (giving an alkene), reducing the yield of the nitrile.","C":"Water reacts directly with the nitrile product and hydrolyses it back to the haloalkane.","D":"AlCl₃ catalyst requires anhydrous conditions, and ethanol provides this.","correct":"B","explain":"In aqueous solution, the equilibrium H₂O ⇌ H⁺ + OH⁻ generates OH⁻, which is also a nucleophile and can substitute the halide to give an alcohol (R–OH): a competing reaction. Additionally, the alkaline conditions can promote <b>elimination</b> (E2) to give an alkene — a third competing pathway. With <b>ethanol</b> as solvent: (i) both KCN and the haloalkane dissolve; (ii) ethanol does not produce OH⁻ or strong bases; (iii) CN⁻ is the dominant nucleophile. The nitrile product is obtained in good yield. Note: AlCl₃ is not involved in nitrile chemistry — that is Friedel–Crafts (option D is a distractor from 6.7.2)."},{"stem":"Propanal (CH₃CH₂CHO) reacts with HCN. What is the product, and why is it formed as a racemate?","A":"2-hydroxypropanenitrile (CH₃CH(OH)CN); racemate because the aldehyde is achiral.","B":"2-hydroxybutanenitrile (CH₃CH₂CH(OH)CN); racemate because the carbonyl carbon is sp² and planar, so CN⁻ attacks both faces with equal probability.","C":"2-hydroxypropanoic acid (CH₃CH(OH)COOH); racemate because two H atoms are lost during the reaction.","D":"Propanoic acid (CH₃CH₂COOH); no chiral centre, so it is not a racemate.","correct":"B","explain":"Product: CH₃CH₂CHO (3 C) + HCN → <b>CH₃CH₂CH(OH)CN (4 C) = 2-hydroxybutanenitrile</b>. The new chiral centre is at C2 (the former carbonyl carbon), which now carries –H, –OH, –CH₂CH₃, and –CN — four different groups. The carbonyl carbon was <b>sp²</b> (planar, 120° bond angles) before reaction. CN⁻ can attack either the top face or the bottom face of this planar C=O with exactly equal probability (there is no chiral influence from the achiral reagents). Therefore both enantiomers of 2-hydroxybutanenitrile are formed in a 1:1 ratio → <b>racemate</b> (optically inactive). Option (A) incorrectly gives a 3-carbon product (only 3 C total) — the CN carbon must be counted."},{"stem":"Why is Friedel–Crafts acylation generally preferred over alkylation for introducing a carbon chain onto a benzene ring in synthesis?","A":"Acylation is irreversible; alkylation is reversible and the ring can re-eliminate the alkyl group.","B":"Acylation produces a single, clean monosubstituted product: the acyl group deactivates the ring (preventing further substitution) and the acylium ion does not rearrange; direct alkylation causes polysubstitution and carbocation rearrangement.","C":"Acylation is cheaper because acyl chlorides are less expensive than haloalkanes.","D":"Alkylation requires HF rather than AlCl₃, which is more dangerous and makes alkylation impractical.","correct":"B","explain":"Two practical problems with Friedel–Crafts alkylation: (1) <b>Polysubstitution</b> — the alkyl group is electron-donating (+I effect); it activates the ring toward further electrophilic attack. With excess haloalkane, di-, tri-, and even tetra-substituted products form. (2) <b>Carbocation rearrangement</b> — primary carbocations (from primary haloalkanes) rearrange to the more stable secondary before attacking the ring. Acylation avoids both: the acylium ion (RCO⁺) is resonance-stabilised (no rearrangement possible) and the acyl group introduced is electron-withdrawing (C=O deactivates the ring → mono-substitution only). The aryl ketone product can then be reduced separately in a controlled way."},{"stem":"What is the acylium ion, and why is it particularly stable compared with a simple alkyl carbocation?","A":"The acylium ion is R–C≡O⁺, stabilised because the lone pair on oxygen delocalises into the empty p-orbital on carbon, spreading the positive charge between C and O.","B":"The acylium ion is R–O–C⁺, stabilised by lone pairs on the adjacent oxygen atom.","C":"The acylium ion is the same as an alkyl carbocation but named differently when attached to an arene.","D":"The acylium ion is not actually stable — it reacts so quickly that it cannot be isolated.","correct":"A","explain":"When an acyl chloride (RCOCl) reacts with AlCl₃, AlCl₄⁻ is formed and the <b>acylium ion RCO⁺</b> is released. In this cation, the formal positive charge sits on the carbonyl carbon (R–C⁺=O). However, there is a resonance contributor where the lone pair on oxygen donates into the empty p-orbital: R–C≡O⁺. This resonance <b>distributes the positive charge between C and O</b>, significantly stabilising the cation compared with a simple primary alkyl carbocation (which has the positive charge on only one carbon and no resonance stabilisation). This stability is exactly why the acylium ion does <b>not rearrange</b> (unlike primary carbocations R⁺), making acylation a clean, controllable reaction."},{"stem":"A student wants to convert ethanol (CH₃CH₂OH, 2 C) into propanoic acid (CH₃CH₂COOH, 3 C) using a three-step route. Which sequence of steps correctly achieves this?","A":"Ethanol → (K₂Cr₂O₇/H₂SO₄, reflux) → ethanoic acid → (SOCl₂) → ethanoyl chloride → (AlCl₃/benzene) → acetophenone — wrong: Friedel–Crafts acylation requires an arene and gives an aryl ketone, not propanoic acid; and ethanoyl chloride (2 C) cannot gain carbon by this route","B":"Ethanol → (HBr, heat) → bromoethane → (KCN/ethanol, heat under reflux) → propanenitrile → (dilute HCl(aq), heat under reflux) → propanoic acid. Carbon count: 2C → 2C → 3C → 3C ✓","C":"Ethanol → (oxidation with K₂Cr₂O₇/H₂SO₄, distil) → ethanal → (KCN/ethanol, reflux) → 2-hydroxypropanenitrile → (dilute H₂SO₄(aq), reflux) → 2-hydroxypropanoic acid (lactic acid, not propanoic acid — the α-OH group is retained on hydrolysis)","D":"Ethanol → (HBr, heat) → bromoethane → (KCN/ethanol, heat under reflux) → propanenitrile → (H₂/Ni, heat) → propan-1-amine (3 C amine, not propanoic acid — reduction gives the amine, not the carboxylic acid)","correct":"B","explain":"The single OCR-spec reaction that extends the carbon chain is <b>KCN nucleophilic substitution</b> on a haloalkane — CN⁻ attacks the δ⁺ carbon, displacing Br⁻ and forming a new C–C bond (+1 C). Route B: <b>Step 1</b> — ethanol + HBr → bromoethane (2 C, nucleophilic substitution or electrophilic addition of HBr). <b>Step 2</b> — bromoethane + KCN in ethanol, heat under reflux → propanenitrile (3 C) + KBr. <b>Step 3</b> — propanenitrile + dilute HCl(aq) (or H₂SO₄(aq)), heat under reflux → propanoic acid (3 C) + NH₄⁺ (acid hydrolysis of the nitrile). Carbon count: 2C → 2C → 3C → 3C ✓. Option C is a common trap: HCN (not KCN) adds across the C=O of an aldehyde to give an α-hydroxy nitrile; on hydrolysis this gives a 2-hydroxy acid, not the straight-chain acid. Option D shows the correct chain-extension path but uses H₂/Ni (reduction) instead of acid hydrolysis — reduction of a nitrile gives a primary amine, not a carboxylic acid."},{"stem":"Propanenitrile (CH₃CH₂CN) is treated with H₂ in the presence of a Ni catalyst at elevated temperature. What are the correct product and its IUPAC name?","A":"Propanamide (CH₃CH₂CONH₂)","B":"Propylamine / propan-1-amine (CH₃CH₂CH₂NH₂)","C":"Ethylamine / ethan-1-amine (CH₃CH₂NH₂)","D":"Propanenitrile is unreactive with H₂/Ni — LiAlH₄ is required.","correct":"B","explain":"CH₃CH₂CN + 2H₂ → <b>CH₃CH₂CH₂NH₂</b>. The CN group is reduced to CH₂NH₂: the carbon of the original C≡N becomes –CH₂– in the product, bearing the –NH₂ group. Since propanenitrile has 3 carbons (C1–CH₃, C2–CH₂, C3–CN), the product amine also has 3 carbons: CH₃CH₂CH₂NH₂ = <b>propylamine (propan-1-amine)</b>. Option (C) ethylamine has only 2 carbons — this is the most common student error (forgetting that the nitrile carbon is in the chain). Option (D) is wrong — H₂/Ni at high temperature DOES reduce nitriles; both H₂/Ni and LiAlH₄ are accepted by OCR for nitrile → amine."},{"stem":"For full marks on a Friedel–Crafts acylation mechanism question (e.g. benzene + CH₃COCl/AlCl₃ → phenylethanone), which set of steps must be shown?","A":"Only the curly arrow from benzene to the acylium ion.","B":"Only the Wheland intermediate structure with the positive charge.","C":"The electrophile-generation equation (CH₃COCl + AlCl₃ → CH₃CO⁺ + AlCl₄⁻); curly arrow from benzene's π-system to C of CH₃CO⁺; the Wheland intermediate; loss of H⁺; and the catalyst-regeneration equation (H⁺ + AlCl₄⁻ → AlCl₃ + HCl).","D":"The mechanism for NaBH₄ reduction of the ketone to identify its source.","correct":"C","explain":"The OCR June 2019 mark scheme for a Friedel–Crafts acylation mechanism required all of the following, each independently creditable: (1) <b>Electrophile generation</b>: CH₃COCl + AlCl₃ → CH₃CO⁺ + AlCl₄⁻; (2) <b>Curly arrow</b> from the delocalised π-electrons of benzene to the C of the acylium ion; (3) The <b>Wheland (arenium ion) intermediate</b> with the delocalised positive charge shown (horseshoe structure, sp³ at the substituted carbon); (4) <b>Loss of H⁺</b> from the sp³ carbon, restoring aromaticity; (5) <b>Catalyst regeneration</b>: H⁺ + AlCl₄⁻ → AlCl₃ + HCl. Omitting the regeneration step or drawing the curly arrow from a single C=C bond rather than the full π-system were the most common mark-losing errors."},{"stem":"A student reacts benzene with 1-chloropropane (n-propyl chloride) and anhydrous AlCl₃ hoping to make propylbenzene (n-propylbenzene). The actual product is a mixture of n-propylbenzene and isopropylbenzene (cumene), as well as some di-substituted products. Why?","A":"The reaction is reversible, so multiple products form as the equilibrium is reached.","B":"The primary carbocation (n-propyl, CH₃CH₂CH₂⁺) rearranges to the more stable secondary carbocation (isopropyl, (CH₃)₂CH⁺) before attacking benzene; additionally, the alkyl group added activates the ring toward further alkylation.","C":"AlCl₃ is unstable and causes random alkylation at multiple positions.","D":"The chloride ion from 1-chloropropane also attacks the ring, causing both alkylation and chlorination.","correct":"B","explain":"Two problems arise with Friedel–Crafts alkylation of this type: (1) <b>Carbocation rearrangement</b>: 1-chloropropane generates the primary carbocation CH₃CH₂CH₂⁺, which is unstable and rearranges by a 1,2-hydride shift to the more stable secondary carbocation (CH₃)₂CH⁺. This secondary carbocation attacks the ring, giving isopropylbenzene (cumene) instead of the intended n-propylbenzene. (2) <b>Polysubstitution</b>: the alkyl group is electron-donating (+I effect), which activates the ring towards further electrophilic attack. So monoalkylated product itself reacts with more haloalkane → di- and trisubstituted products. This is why Friedel–Crafts acylation (which gives a clean, non-rearranging electrophile and a deactivating product) is preferred."},{"stem":"What are the exact reagents AND conditions required for the acid hydrolysis of butanenitrile (CH₃CH₂CH₂CN) to give butanoic acid?","A":"Concentrated HCl, room temperature","B":"Dilute aqueous HCl (or dilute H₂SO₄), heat under reflux","C":"KOH(aq), heat under reflux","D":"H⁺ alone (no water needed), room temperature","correct":"B","explain":"The overall equation: CH₃CH₂CH₂CN + 2H₂O + H⁺ → CH₃CH₂CH₂COOH + NH₄⁺. Two conditions are essential: (1) <b>Dilute acid (HCl or H₂SO₄) as (aq)</b> — the H⁺ catalyst is required AND water must be present because the hydrolysis adds two H₂O molecules across the C≡N. The OCR June 2024 examiner report flagged that many candidates wrote \"acid\" without specifying \"(aq)\" or water — this loses the mark. (2) <b>Heat under reflux</b> — the C≡N bond is resistant to hydrolysis at room temperature. Option (A) is wrong — concentrated HCl without reflux is too harsh/wrong conditions. Option (C) is alkaline hydrolysis, which gives the carboxylate salt not the free acid. Option (D) is wrong — water is essential."},{"stem":"When benzene reacts with a haloalkane R–Cl in the presence of AlCl₃, what is the electrophile that attacks the benzene ring?","A":"The AlCl₃ molecule itself","B":"The carbocation R⁺ (generated when AlCl₃ abstracts Cl⁻ from R–Cl)","C":"The Cl⁻ ion (which does electrophilic substitution on the ring)","D":"The combined species [R–Cl–AlCl₃]⁺ as a whole attacks the ring","correct":"B","explain":"AlCl₃ acts as a Lewis acid and accepts the lone pair from Cl of the haloalkane: R–Cl + AlCl₃ → <b>R⁺</b> + AlCl₄⁻. The <b>carbocation R⁺</b> is the electrophile. For primary haloalkanes, this carbocation is unstable and may rearrange; for tertiary haloalkanes it is more stable. The R⁺ then attacks the π-electron cloud of benzene. In a sense the true electrophile may be the partially-positive R in the polarised complex [R···Cl···AlCl₃]⁺, but OCR expects the answer to show R⁺ as the electrophile. Option (C) is wrong — Cl⁻ is a nucleophile, not an electrophile. Option (D) is an oversimplification that would not score the mechanism marks."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect â€” correct answer: <strong>'+q.correct+'</strong>':'Not answered â€” correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks â€” excellent work!':score>=Math.round(total*0.7)?'Good work â€” check the explanations for any you missed.':'Keep practising â€” work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% â€” '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
