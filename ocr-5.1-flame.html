<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.1 Rates of Reaction | ChemIgnite</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.1 Rates of Reaction</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame: Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Initial rate data for A + B → products: | Run | \\[A\\] / mol dm⁻³ | \\[B\\] / mol dm⁻³ | Rate / mol dm⁻³ s⁻¹ | |-----|-----------------|-----------------|---------------------| | 1 | 0.10 | 0.10 | 2.0 × 10⁻⁴ | | 2 | 0.20 | 0.10 | 8.0 × 10⁻⁴ | | 3 | 0.10 | 0.20 | 2.0 × 10⁻⁴ | What is the overall order of this reaction?","A":"First order overall","B":"Second order overall","C":"Third order overall","D":"Zero order overall","correct":"B","explain":"Compare Runs 1 and 2: [A] doubles (0.10 → 0.20 mol dm⁻³) while [B] is unchanged. Rate increases by 8.0 × 10⁻⁴ / 2.0 × 10⁻⁴ = 4 = 2². Doubling [A] quadruples the rate, so the order with respect to A is <b>2</b>. Compare Runs 1 and 3: [B] doubles (0.10 → 0.20) while [A] is unchanged. Rate is unchanged (both 2.0 × 10⁻⁴). The order with respect to B is <b>0</b>. Overall order = 2 + 0 = <b>2</b>. The rate equation is rate = k[A]². Despite B appearing in the balanced equation, it is zero order — this illustrates why orders can never be read off stoichiometric coefficients."},{"stem":"Using the data from Q11, what is the rate constant k, with correct units?","A":"k = 2.0 × 10⁻² mol dm⁻³ s⁻¹","B":"k = 2.0 × 10⁻² s⁻¹","C":"k = 2.0 × 10⁻² mol⁻¹ dm³ s⁻¹","D":"k = 2.0 × 10⁻² mol⁻² dm⁶ s⁻¹","correct":"C","explain":"Rate = k[A]². Substituting Run 1: 2.0 × 10⁻⁴ = k × (0.10)² = k × 0.010. So k = 2.0 × 10⁻⁴ / 0.010 = <b>2.0 × 10⁻² mol⁻¹ dm³ s⁻¹</b>. Units are derived: k = rate / [A]² = (mol dm⁻³ s⁻¹) / (mol dm⁻³)² = (mol dm⁻³ s⁻¹) / (mol² dm⁻⁶) = mol⁻¹ dm³ s⁻¹. Option A (mol dm⁻³ s⁻¹) gives the units of *rate*, not k. Option B (s⁻¹) is the unit of k for first order. Option D (mol⁻² dm⁶ s⁻¹) is the unit of k for third order."},{"stem":"A concentration–time graph for a reaction shows [A] falling from 0.80 to 0.40 mol dm⁻³ in 35 s, then from 0.40 to 0.20 mol dm⁻³ in a further 35 s. What is the rate constant k?","A":"k = 0.010 s⁻¹","B":"k = 0.029 s⁻¹","C":"k = 0.0086 s⁻¹","D":"k = 0.020 s⁻¹","correct":"D","explain":"Two successive equal half-lives (both 35 s) confirm first-order kinetics — this is the mandatory diagnostic test. For first order: k = ln 2 / t₁/₂ = 0.693 / 35 = <b>0.020 s⁻¹</b> (to 2 SF). To score the proof-of-first-order mark on a graph question, you must annotate *both* half-lives on the graph and state they are equal; a bare statement scores nothing (H432/01 June 2024). Option A (0.010) results from wrongly adding the two half-lives to give t₁/₂ = 70 s. Option B (0.029) comes from using k = 1/t₁/₂ rather than ln 2/t₁/₂. Option C (0.0086) arises from incorrectly using log₁₀ 2 / 35 = 0.301/35 instead of ln 2/35."},{"stem":"The experimentally determined rate equation for a reaction is rate = k[P]²[Q]. Which rate-determining step is consistent with this rate equation?","A":"One molecule of P and one molecule of Q collide (bimolecular)","B":"One molecule of P undergoes unimolecular decomposition","C":"Two molecules of P collide with one molecule of Q in the slow step","D":"Two molecules of Q and one molecule of P collide in the slow step","correct":"C","explain":"The total order = 2 + 1 = 3, so the RDS is termolecular, involving 3 particles. The order with respect to each species in the rate equation reflects the number of particles of that species in the slow step: 2 molecules of P and 1 molecule of Q. Option A (one P + one Q) would give rate = k[P][Q] — total order 2. Option B (one P alone) would give rate = k[P] — total order 1. Option D (two Q + one P) would give rate = k[P][Q]², which does not match the given rate equation."},{"stem":"A rate-concentration graph for a reaction is a straight line through the origin with a gradient of 0.045 s⁻¹. What is the rate constant k?","A":"k = 0.045 mol dm⁻³ s⁻¹","B":"k = 1/0.045 s⁻¹","C":"k = 0.045 mol⁻¹ dm³ s⁻¹","D":"k = 0.045 s⁻¹","correct":"D","explain":"A straight line *through the origin* on a rate vs [A] graph confirms first-order kinetics (rate = k[A]). Comparing with y = mx: the gradient m = k. For first order, the <b>gradient of the rate–[A] graph is the rate constant k</b> — no further arithmetic is needed. Units: k = rate/[A] = (mol dm⁻³ s⁻¹)/(mol dm⁻³) = s⁻¹. This gradient-equals-k shortcut applies only to first order. Option A gives units of rate, not k. Option C gives the units of k for a second-order reaction. Option B inverts the gradient, which has no physical meaning here."},{"stem":"Colorimetry is used to monitor the iodine–propanone reaction in acid solution. Which statement correctly describes the expected wavelength setting and the shape of the absorbance–time graph?","A":"UV wavelength (~200 nm); absorbance decreases linearly","B":"~425 nm (visible); absorbance decreases as an exponential decay","C":"~425 nm (visible); absorbance increases linearly","D":"~425 nm (visible); absorbance decreases linearly","correct":"D","explain":"Iodine (I₂) is the only strongly coloured species in this reaction; it absorbs visible light at approximately 425 nm (its λ_max). The Beer–Lambert law (A = εcl) means absorbance is directly proportional to [I₂]. The iodine–propanone reaction is zero order with respect to I₂ — [I₂] falls at a constant rate (rate = k[CH₃COCH₃][H⁺] regardless of [I₂]). Since [I₂] decreases linearly with time, absorbance also decreases linearly — a straight downward line on the A vs t graph. An exponential decay would indicate first-order kinetics in I₂; an increase would mean I₂ is a product. UV wavelength (~200 nm) is used for species that absorb only in the ultraviolet."},{"stem":"An Arrhenius plot of ln k vs 1/T yields a straight line with gradient −7500 K. What is the activation energy in kJ mol⁻¹?","A":"Eₐ = −62.4 kJ mol⁻¹","B":"Eₐ = 7.5 kJ mol⁻¹","C":"Eₐ = 62.4 kJ mol⁻¹","D":"Eₐ = 62 400 kJ mol⁻¹","correct":"C","explain":"gradient = −Eₐ / R, so Eₐ = −gradient × R = −(−7500 K) × 8.314 J K⁻¹ mol⁻¹ = 62 355 J mol⁻¹ = <b>62.4 kJ mol⁻¹</b> (3 SF). Eₐ must always be *positive* — the gradient of the Arrhenius plot is negative (because Eₐ is positive and the gradient = −Eₐ/R is therefore negative). Option A reports a negative Eₐ, which is non-physical; OCR examiners explicitly do not allow a negative Eₐ (H432/01 November 2020). Option B forgets to multiply by R. Option D forgets to convert J mol⁻¹ to kJ mol⁻¹."},{"stem":"When temperature is raised from T₁ to T₂ (T₂ > T₁), how does the Boltzmann distribution change?","A":"The peak shifts right and rises higher; total area unchanged","B":"The peak shifts right and falls lower; the tail beyond Eₐ is larger","C":"The peak shifts left and falls lower; the tail beyond Eₐ is smaller","D":"The curve shifts uniformly upward without changing shape","correct":"B","explain":"At higher temperature: (1) mean kinetic energy increases, so the peak shifts to *higher* energy (rightward); (2) the total number of molecules is unchanged, so the total area under the curve is unchanged — the curve must therefore *broaden and flatten* (the peak falls); (3) the right-hand tail extends further, so the area to the right of the activation energy line (the fraction of molecules with KE ≥ Eₐ) is *much larger*. This larger fraction is the dominant reason rate increases with temperature. Option A is wrong — the peak falls, not rises (total area is conserved). Options C and D both misdescribe the direction of peak shift and the tail change."},{"stem":"The rate equation for the hydrolysis of (CH₃)₃CBr by aqueous NaOH is determined experimentally. Which rate equation is expected, and why?","A":"rate = k[(CH₃)₃CBr][OH⁻] — because both species must collide to react","B":"rate = k[OH⁻] — because OH⁻ is the nucleophile and determines the rate","C":"rate = k[(CH₃)₃CBr] — because the slow step is unimolecular ionisation of the C–Br bond","D":"rate = k[(CH₃)₃CBr]²[OH⁻] — because two haloalkane molecules are needed for the reaction","correct":"C","explain":"(CH₃)₃CBr is a tertiary haloalkane and undergoes SN1 hydrolysis. The slow step (RDS) is the unimolecular ionisation of the C–Br bond: (CH₃)₃CBr → (CH₃)₃C⁺ + Br⁻. This involves only the haloalkane, so the rate equation is rate = k[(CH₃)₃CBr]. OH⁻ reacts in a fast step *after* the RDS ((CH₃)₃C⁺ + OH⁻ → (CH₃)₃COH) — because it arrives only after the slow step, its concentration has no effect on the overall rate. A primary haloalkane would give rate = k[R–X][OH⁻] via the SN2 mechanism, where both species are involved in the single concerted slow step."},{"stem":"Which technique makes use of the Beer–Lambert law (A = εcl) to monitor reaction rate?","A":"Gas syringe collection of evolved gas","B":"Mass loss on a balance","C":"Conductivity probe measurement","D":"Colorimetry","correct":"D","explain":"The Beer–Lambert law states that absorbance A = εcl, where ε is the molar absorptivity (constant at a fixed wavelength for a given species), c is concentration, and l is path length (fixed in a standard 1 cm cuvette). Since ε and l are constant, A ∝ c — absorbance readings are directly proportional to the concentration of the coloured species, so absorbance–time data is equivalent to concentration–time data. A gas syringe measures volume of gas using pV = nRT for moles. A balance measures mass loss of escaped gas. A conductivity probe measures total ionic conductance. Only colorimetry uses Beer–Lambert to link absorbance to concentration directly."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
