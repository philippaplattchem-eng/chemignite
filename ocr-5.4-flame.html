<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.4 Thermodynamics | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.4 Thermodynamics</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Flame: Apply in context</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Calculate ΔLEH for NaCl using the following data: ΔfH°(NaCl) = −411; ΔatH°(Na) = +107; IE₁(Na) = +496; ΔatH°(Cl) = +122; EA₁(Cl) = −349 kJ mol⁻¹.","A":"−787 kJ mol⁻¹","B":"−1485 kJ mol⁻¹","C":"−680 kJ mol⁻¹","D":"+787 kJ mol⁻¹","correct":"A","explain":"Apply Hess's law to the Born–Haber cycle: ΔfH° = ΔatH°(Na) + IE₁(Na) + ΔatH°(Cl) + EA₁(Cl) + ΔLEH. Rearranging: ΔLEH = ΔfH° − ΔatH°(Na) − IE₁(Na) − ΔatH°(Cl) − EA₁(Cl). Substituting (carrying signs): ΔLEH = (−411) − (+107) − (+496) − (+122) − (−349) = −411 − 107 − 496 − 122 + 349 = <b>−787 kJ mol⁻¹</b>. The critical step is subtracting EA₁ which is itself negative, giving −(−349) = +349. Option B (−1485) results from treating EA₁ as positive (+349) and then subtracting it: −411 − 107 − 496 − 122 − 349 = −1485. Option C (−680) results from omitting ΔatH°(Na) (+107). Option D has the correct magnitude but wrong sign — lattice formation is always exothermic, so a positive answer is a red flag indicating a sign error."},{"stem":"In a Born–Haber cycle for NaBr, what is the correct standard state symbol for bromine?","A":"Br₂(g)","B":"Br₂(l)","C":"Br(g)","D":"Br₂(s)","correct":"B","explain":"The standard state of bromine at 298 K is <b>liquid</b> — Br₂(l). In the formation equation for NaBr, the correct starting materials are Na(s) + ½Br₂(l) → NaBr(s). Writing Br₂(g) is a state symbol error that loses the mark, regardless of whether the rest of the equation is correct. This was specifically flagged in the H432/01 November 2020 mark scheme: \"CARE: Liquid state symbol for Br₂.\" The subsequent atomisation step ΔatH°(Br) then converts ½Br₂(l) into Br(g) — one mole of gaseous bromine atoms. Iodine's standard state is I₂(s), and chlorine is Cl₂(g). Only bromine is liquid among the halogens under standard conditions, making it the most frequently tested state symbol trap in Born–Haber questions."},{"stem":"Calculate ΔS° for CaCO₃(s) → CaO(s) + CO₂(g). S°: CaCO₃(s) = 92; CaO(s) = 40; CO₂(g) = 214 J K⁻¹ mol⁻¹.","A":"+162 J K⁻¹ mol⁻¹","B":"−162 J K⁻¹ mol⁻¹","C":"+254 J K⁻¹ mol⁻¹","D":"+122 J K⁻¹ mol⁻¹","correct":"A","explain":"ΔS = ΣS°(products) − ΣS°(reactants) = [S°(CaO) + S°(CO₂)] − [S°(CaCO₃)] = (40 + 214) − 92 = 254 − 92 = <b>+162 J K⁻¹ mol⁻¹</b>. The positive sign is expected: a gas (CO₂) is produced from a solid, greatly increasing the number of accessible arrangements. Option B (−162) reverses the subtraction order. Option C (+254) sums the products but forgets to subtract the reactant S° value. Option D (+122) subtracts only CaO from CO₂ (214 − 92 = 122), omitting the CaO product from the sum. Always multiply each S° by its stoichiometric coefficient first; here all coefficients are 1 so no multiplication is needed, but a second step producing 2 moles of CO₂, for example, would require 2 × 214 = 428."},{"stem":"What is the sign of ΔS for the reaction N₂(g) + 3H₂(g) → 2NH₃(g)?","A":"Positive, because the product NH₃ has a more complex structure than the reactants","B":"Zero, because no atoms are created or destroyed","C":"Negative, because the number of moles of gas decreases from 4 to 2","D":"Positive, because the reaction releases heat (it is exothermic)","correct":"C","explain":"The sign of ΔS is dominated by the <b>change in moles of gas</b>. On the reactant side: 1 mol N₂ + 3 mol H₂ = 4 mol gas. On the product side: 2 mol NH₃ = 2 mol gas. The number of moles of gas decreases by 2, meaning fewer particles with translational freedom — entropy <b>decreases</b> and ΔS is <b>negative</b>. Option A is wrong — molecular complexity is not the controlling factor; gas moles dominate. Option B confuses conservation of atoms (true) with conservation of entropy (not a chemical law). Option D is wrong — enthalpy and entropy are independent quantities. This is why the Haber process operates at a compromise temperature: the negative ΔS means Kp decreases as T rises (Le Chatelier), but higher T is needed for an acceptable rate."},{"stem":"CaCO₃(s) → CaO(s) + CO₂(g): ΔH° = +178 kJ mol⁻¹ and ΔS° = +162 J K⁻¹ mol⁻¹. Calculate ΔG at 298 K.","A":"+130 kJ mol⁻¹","B":"−130 kJ mol⁻¹","C":"+226 kJ mol⁻¹","D":"+178 kJ mol⁻¹","correct":"A","explain":"First convert ΔS to kJ K⁻¹ mol⁻¹: 162 ÷ 1000 = 0.162 kJ K⁻¹ mol⁻¹. Then: ΔG = ΔH − TΔS = +178 − (298 × 0.162) = +178 − 48.3 = <b>+130 kJ mol⁻¹</b> (to 3 s.f.). ΔG is positive, confirming that limestone does not spontaneously decompose at room temperature. Option B has the correct magnitude but wrong sign — this would imply spontaneous decomposition at 298 K. Option C (+226) results from <b>adding</b> TΔS instead of subtracting: 178 + 48 = 226. Option D (+178) results from omitting the TΔS term entirely. The unit conversion (J → kJ for ΔS) is the critical step that is most commonly missed — if ΔS is left in J K⁻¹ mol⁻¹, TΔS = 298 × 162 = 48 276 kJ mol⁻¹, giving a wildly incorrect ΔG ≈ −48 098 kJ mol⁻¹."},{"stem":"Using ΔH° = +178 kJ mol⁻¹ and ΔS° = +162 J K⁻¹ mol⁻¹, calculate the minimum temperature at which CaCO₃ decomposition becomes feasible.","A":"1099 K","B":"1.1 K","C":"826 K","D":"2028 K","correct":"A","explain":"Set ΔG = 0 at the threshold temperature: ΔH − TΔS = 0 → T = ΔH/ΔS. Convert ΔS: 162 J K⁻¹ mol⁻¹ = 0.162 kJ K⁻¹ mol⁻¹. T = 178 / 0.162 = <b>1099 K</b> (approximately 826°C). Above 1099 K, TΔS > ΔH and ΔG becomes negative — the reaction is feasible. This matches the industrial lime-kiln temperature. Option B (1.1 K) is the most common error: using ΔS in J rather than kJ gives T = 178/162 = 1.099 — the answer is numerically correct but the unit error makes it 1000× too small and physically impossible. Option C (826 K) gives the correct answer in Celsius (1099 − 273 = 826) but mistakes it for the Kelvin value. Option D (2028 K) results from adding 273 to the Kelvin answer unnecessarily."},{"stem":"Calculate ΔsolH°(NaCl) from the cycle below. ΔLEH°(NaCl, formation) = −787 kJ mol⁻¹; ΔhydH°(Na⁺) = −405 kJ mol⁻¹; ΔhydH°(Cl⁻) = −364 kJ mol⁻¹.","A":"+18 kJ mol⁻¹","B":"+382 kJ mol⁻¹","C":"−1556 kJ mol⁻¹","D":"+1556 kJ mol⁻¹","correct":"A","explain":"By Hess's law: ΔsolH = −ΔLEH(formation) + ΔhydH(Na⁺) + ΔhydH(Cl⁻). The key step is <b>reversing the sign</b> of ΔLEH because the dissolution cycle requires lattice <b>dissociation</b> (solid → gaseous ions), which is the reverse of lattice formation. ΔsolH = −(−787) + (−405) + (−364) = +787 − 405 − 364 = <b>+18 kJ mol⁻¹</b>. The slight endothermicity explains the small temperature drop observed when NaCl dissolves in water. Option B (+382) includes only ΔhydH(Na⁺) and forgets ΔhydH(Cl⁻). Option C (−1556) fails to reverse the sign of ΔLEH, using −787 directly: −787 − 405 − 364 = −1556. Option D (+1556) treats all three values as positive, reversing the signs of the hydration enthalpies too. Correctly multiplying by stoichiometric coefficients is essential — for MgCl₂, the ΔhydH(Cl⁻) term would be multiplied by 2."},{"stem":"Which ion has the most exothermic enthalpy change of hydration?","A":"Na⁺ (ionic radius 102 pm, charge +1)","B":"K⁺ (ionic radius 138 pm, charge +1)","C":"Mg²⁺ (ionic radius 72 pm, charge +2)","D":"Cl⁻ (ionic radius 181 pm, charge −1)","correct":"C","explain":"ΔhydH becomes more exothermic with <b>higher ionic charge</b> and <b>smaller ionic radius</b> (greater charge density). Mg²⁺ has both the highest charge (+2) and the smallest radius (72 pm) of the four ions listed — both factors reinforce each other, giving the strongest attraction to the δ⁻ oxygen of water molecules and the most exothermic ΔhydH (approximately −1926 kJ mol⁻¹, compared with Na⁺ at −405 kJ mol⁻¹). Na⁺ and K⁺ both have +1 charge but K⁺ is larger, so Na⁺ has the more exothermic ΔhydH among the Group 1 pair. Cl⁻ is both singly charged and large (181 pm), giving the least exothermic ΔhydH (approximately −364 kJ mol⁻¹). The answer is always the ion with the highest charge density — link ionic charge AND ionic radius to strength of electrostatic attraction."},{"stem":"A student dissolves a solid in water to measure ΔsolH. Which mass should be used in the calculation q = mcΔT?","A":"The mass of water only","B":"The mass of solid solute only","C":"The mass of water divided by the molar mass of the solute","D":"The mass of the solution (mass of water + mass of solute)","correct":"D","explain":"In q = mcΔT, m is the <b>mass of the solution</b> — the total mass of everything that changes temperature, i.e. water plus dissolved solute. Once the solute dissolves, the dissolved ions are part of the same liquid phase and absorb (or release) heat alongside the water. Using only the mass of water underestimates q and gives a smaller (less accurate) ΔsolH. The error is small for very dilute solutions but becomes significant when a substantial mass of solute is used — which is the typical case in OCR questions. The H432/03 June 2023 examiner report explicitly flagged this as the most common error in that sitting: \"Calculating the energy change using the mass of water rather than the mass of the solution.\" Options B and C have no physical basis — the solute itself is what you are measuring the dissolution of, so its mass enters only in the denominator (to get moles)."},{"stem":"Calculate K for a reaction with ΔG° = −10.0 kJ mol⁻¹ at 298 K. (R = 8.314 J K⁻¹ mol⁻¹)","A":"56.6","B":"4.04","C":"1.00","D":"0.018","correct":"A","explain":"Convert ΔG° to J mol⁻¹: −10.0 × 1000 = −10 000 J mol⁻¹. Use ΔG° = −RT ln K → ln K = −ΔG°/RT = −(−10 000)/(8.314 × 298) = 10 000/2477.6 = 4.036. Therefore K = e^4.036 = <b>56.6</b>. K > 1 confirms that products are favoured at equilibrium, consistent with the negative ΔG°. Option B (4.04) gives ln K rather than K — the student stopped before applying the exponential. Option C (≈ 1.00) results from forgetting to convert ΔG° from kJ to J: ln K = 10/2477.6 = 0.00404 → K ≈ 1.00 (barely any preference for products). Option D (0.018) results from a sign error on ΔG°: using +10 000 J gives ln K = −4.035 → K = e^(−4.035) = 0.018 (reactants favoured — wrong conclusion from wrong sign). Always use natural log (ln), not log₁₀."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
