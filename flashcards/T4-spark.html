<title>T4 Spark Flashcards</title><style>:root{--pr:#3f51b5;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--r:14px;--sh:0 2px 10px rgba(63,81,181,.10);--sh2:0 8px 30px rgba(63,81,181,.20)}

.card-back{background:#eef1ff;border:2px solid var(--pr);transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}

.card-ans{font-size:.97rem;font-weight:700;color:var(--pr);margin-bottom:.6rem}

.nav-row{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem}
.nav-btn{background:var(--card);border:2px solid var(--bdr);color:var(--tx);padding:.55rem 1.3rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.nav-btn:hover:not(:disabled){border-color:var(--pr);background:#eef1ff}
.nav-btn:disabled{opacity:.35;cursor:default}
.btn-shuffle{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn-shuffle:hover{background:var(--pr-dk);border-color:var(--pr-dk)}
.flip-hint{text-align:center;font-size:.8rem;color:var(--txm);margin-top:.5rem}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}.card-scene{height:260px}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.card-face{padding:1.2rem 1.3rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(92,107,192,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T4 &mdash; Extracting Metals &amp; Equilibria</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
<div class="deck-meta"><span>20 cards &mdash; Spark (Recall)</span><span class="counter" id="counter">1 / 20</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question &mdash; tap to reveal answer</div><div class="card-q" id="card-q"></div></div>
  <div class="card-face card-back"><div class="card-hint">Answer</div><div class="card-ans" id="card-ans"></div><div class="card-ex" id="card-ex"></div></div>
</div></div>
<div class="nav-row">
  <button class="nav-btn" id="btn-prev">&larr; Prev</button>
  <button class="nav-btn btn-shuffle" id="btn-shuffle">&#x1F500; Shuffle</button>
  <button class="nav-btn" id="btn-next">Next &rarr;</button>
</div>
<div class="flip-hint">Tap card or press Space to flip &nbsp;&bull;&nbsp; &larr; &rarr; arrow keys to navigate</div>
</main>
<script>const QUESTIONS=[{"stem":"Which metal is the most reactive in the reactivity series?","A":"Sodium","B":"Calcium","C":"Potassium","D":"Magnesium","correct":"C","explain":"The reactivity series, from most to least reactive: Potassium, Sodium, Calcium, Magnesium, Aluminium, (Carbon), Zinc, Iron, (Hydrogen), Copper, Silver, Gold. Potassium is the most reactive, it reacts vigorously with cold water, fizzing and igniting. A useful mnemonic: Please Stop Calling Me A Careless Zebra Instead He Could Say Gold."},{"stem":"Which of these metals can be found uncombined (native) in the Earth's crust?","A":"Sodium","B":"Calcium","C":"Iron","D":"Gold","correct":"D","explain":"Gold is unreactive, it does not readily form ions or combine with other elements. It is found as the native (uncombined) metal in the Earth. Very reactive metals (Na, Ca, K) are always found as compounds because they readily lose electrons to form ions. The more reactive a metal, the more likely it is to exist as a compound."},{"stem":"What are the conditions used in the Haber process?","A":"250 °C, 100 atmospheres, nickel catalyst","B":"450 °C, 200 atmospheres, iron catalyst","C":"800 °C, 50 atmospheres, platinum catalyst","D":"450 °C, 100 atmospheres, iron catalyst","correct":"B","explain":"The Haber process conditions are: temperature 450 °C, pressure 200 atmospheres, iron catalyst. These are compromise conditions, higher temperature gives faster rate but lower yield; lower temperature gives higher yield but too slowly. 200 atm gives good yield without needing impractically expensive equipment."},{"stem":"What is the balanced equation for the Haber process?","A":"N₂ + 2H₂ ⇌ 2NH₃","B":"N₂ + 3H₂ ⇌ 2NH₃","C":"N₂ + H₂ → NH₃","D":"2N₂ + 3H₂ ⇌ 2NH₃","correct":"B","explain":"N₂(g) + 3H₂(g) ⇌ 2NH₃(g). Key features: the ⇌ symbol (reversible reaction); 3 molecules of H₂; 2 molecules of NH₃ produced; all species are gases. The 4 mol of gas on the left becomes 2 mol on the right, important for pressure equilibrium reasoning."},{"stem":"How is hydrogen obtained for use in the Haber process?","A":"From the electrolysis of water","B":"From fractional distillation of liquid air","C":"From natural gas (methane) by steam reforming","D":"From the reaction of zinc with sulfuric acid","correct":"C","explain":"Hydrogen for the Haber process is obtained from natural gas (mainly methane, CH₄) via steam reforming: CH₄ + H₂O → CO + 3H₂. Nitrogen is obtained from the air (which is ~78% N₂) by fractional distillation of liquid air. Methane is cheap and abundant, making this an economically viable source."},{"stem":"In terms of oxygen, what is the definition of reduction?","A":"The gain of oxygen by a substance","B":"The loss of oxygen from a substance","C":"The loss of electrons from a substance","D":"The gain of electrons by a substance","correct":"B","explain":"At GCSE, reduction is defined as the loss of oxygen from a substance. Oxidation is the gain of oxygen. In metal extraction, the metal compound (oxide) is reduced, it loses oxygen, to give the pure metal. For example: Fe₂O₃ + 3CO → 2Fe + 3CO₂ (iron oxide is reduced; CO is oxidised)."},{"stem":"Which method is used to extract aluminium from its ore, and why?","A":"Heating with carbon, aluminium is less reactive than carbon","B":"Electrolysis, aluminium is more reactive than carbon, so carbon cannot reduce it","C":"Displacement with iron, iron is more reactive than aluminium","D":"Simple heating, aluminium decomposes easily when heated","correct":"B","explain":"Aluminium is above carbon in the reactivity series. Carbon can only reduce metal compounds of metals below it in the reactivity series (e.g. iron, copper). To extract aluminium, electrolysis of molten aluminium oxide (Al₂O₃ / bauxite) is used. Al³⁺ ions gain electrons at the cathode: Al³⁺ + 3e⁻ → Al. Electrolysis is expensive due to the large amount of electrical energy required."},{"stem":"What is a displacement reaction?","A":"A reaction in which one element is removed from a compound by heating","B":"A reaction in which a more reactive metal takes the place of a less reactive metal in a compound","C":"A reaction in which two elements exchange places simultaneously","D":"A reaction in which a metal reacts with water to release hydrogen","correct":"B","explain":"A displacement reaction occurs when a more reactive metal is added to a solution of a salt of a less reactive metal, the more reactive metal \"displaces\" the less reactive one. Example: zinc + copper sulfate → zinc sulfate + copper. This happens because zinc is more reactive than copper and loses electrons more readily."},{"stem":"What is dynamic equilibrium?","A":"A reaction that only goes in one direction","B":"A state in which a reaction has stopped completely","C":"A state in a reversible reaction in a closed system where the forward and reverse reactions proceed at the same rate, keeping concentrations constant","D":"A reaction in which the products and reactants are present in equal amounts by mass","correct":"C","explain":"At dynamic equilibrium, the forward and reverse reactions are both occurring, but at equal rates. The concentrations of reactants and products are constant (not necessarily equal). \"Dynamic\" means both reactions are still happening; \"equilibrium\" means no net change in concentration. Equilibrium can only be reached in a closed system."},{"stem":"Which metal can be extracted from its oxide by heating with carbon?","A":"Aluminium","B":"Potassium","C":"Iron","D":"Sodium","correct":"C","explain":"Iron is below carbon in the reactivity series, so carbon can reduce iron oxide. In industry, iron is extracted using carbon (as coke) in a blast furnace. Metals above carbon (Al, Mg, Ca, Na, K) cannot be extracted by carbon, they require electrolysis."},{"stem":"In bioleaching, how is copper recovered from the leachate solution?","A":"By distillation, heating the leachate to collect copper vapour","B":"By displacement with scrap iron or by electrolysis","C":"By filtration, copper particles settle to the bottom","D":"By reacting with oxygen, copper oxide is heated to give pure copper","correct":"B","explain":"Bacteria break down copper sulfide ores and produce a leachate containing dissolved copper ions (Cu²⁺). Copper is then recovered by: (1) displacement with scrap iron, Fe + CuSO₄ → FeSO₄ + Cu (iron is more reactive than copper); or (2) electrolysis, Cu²⁺ ions are reduced at the cathode. Both methods are cheap and use low-grade ores."},{"stem":"What is the reactivity series position of copper?","A":"Above zinc and below iron","B":"Between iron and hydrogen","C":"Below hydrogen but above silver","D":"The least reactive metal of all","correct":"C","explain":"The reactivity series near the bottom: … Iron, (Hydrogen), Copper, Silver, Gold. Copper sits below hydrogen, this is why it does not react with dilute acids. It also sits above silver and gold, meaning copper can displace silver from silver nitrate solution. Gold is the least reactive of the common metals."},{"stem":"What is the reversible reaction symbol, and what does it mean?","A":"→ means the reaction goes only in the forward direction","B":"← means the reaction only goes in the reverse direction","C":"⇌ means the reaction can go in both directions, the products can react to re-form the reactants","D":"⇌ means the forward and reverse reaction rates are always equal","correct":"C","explain":"The ⇌ symbol indicates a reversible reaction, the products can react to re-form the reactants. All reversible reactions can reach dynamic equilibrium if carried out in a closed system. The Haber process uses ⇌ because ammonia can decompose back into nitrogen and hydrogen under the same conditions."},{"stem":"Which metal does NOT react with cold water but does react with dilute acid?","A":"Sodium","B":"Potassium","C":"Magnesium","D":"Copper","correct":"C","explain":"Magnesium is in the reactivity series above hydrogen, so it reacts with dilute acids to produce hydrogen gas. However, it only reacts very slowly with cold water (producing a thin layer of magnesium hydroxide). Sodium and potassium react vigorously with cold water. Copper does not react with water or dilute acids."},{"stem":"What does phytomining (phytoextraction) use to extract metals?","A":"Bacteria that oxidise sulfide minerals in the ore","B":"Hyperaccumulator plants that absorb metal compounds through their roots and concentrate them in their tissues","C":"High-voltage electricity applied to the metal ore dissolved in water","D":"Heating with carbon at very high temperatures","correct":"B","explain":"Phytomining uses plants that can absorb and concentrate metal compounds (hyperaccumulators). The plants are grown on metal-contaminated soil, absorb metal ions through their roots, and concentrate them in their shoots and leaves. The plants are then harvested and burned, the ash contains the concentrated metal compounds, which can be processed to extract the metal."},{"stem":"What is oxidation in terms of oxygen?","A":"Loss of oxygen","B":"Loss of electrons","C":"Gain of electrons","D":"Gain of oxygen","correct":"D","explain":"Oxidation is defined as the gain of oxygen (in the context of metal extraction and simple reactions). Example: 2Cu + O₂ → 2CuO, copper is oxidised because it gains oxygen. The full electron-transfer definition (loss of electrons) is the Higher tier version: both are correct but the oxygen definition is the Foundation starting point."},{"stem":"Why are very reactive metals such as sodium and potassium never found as uncombined elements in the Earth's crust?","A":"They are too light and float to the surface as gases","B":"They are so reactive they rapidly form compounds with other elements and remain as ions in minerals","C":"They are always found dissolved in sea water rather than in the crust","D":"They were all used up billions of years ago in nuclear reactions","correct":"B","explain":"Reactive metals have a strong tendency to lose electrons and form positive ions. They react readily with oxygen, water and other non-metals to form stable compounds (oxides, hydroxides, carbonates). This means they are never found in nature as the free metal element, they are always combined. Only unreactive metals (gold, sometimes silver and copper) are found native."},{"stem":"Zinc is added to a solution of copper(II) sulfate. Which observation would you expect?","A":"No reaction, zinc is less reactive than copper","B":"The blue solution slowly decolorises and a reddish-brown solid (copper) deposits on the zinc","C":"The zinc dissolves and a blue precipitate forms","D":"Zinc displaces sulfate ions from the solution, releasing sulfur dioxide gas","correct":"B","explain":"Zinc is more reactive than copper. It displaces copper from copper sulfate solution: Zn + CuSO₄ → ZnSO₄ + Cu. Observations: the blue colour of Cu²⁺ ions fades (zinc sulfate is colourless); reddish-brown copper metal deposits. This is a classic displacement reaction that confirms zinc's higher position in the reactivity series."},{"stem":"What does Le Chatelier's principle predict when the temperature of a reversible reaction is increased?","A":"The equilibrium shifts toward the side that releases heat (exothermic direction)","B":"The equilibrium shifts toward the side that absorbs heat (endothermic direction)","C":"The equilibrium does not shift, temperature only affects the rate, not the position","D":"The equilibrium always shifts to the right when temperature increases","correct":"B","explain":"Le Chatelier's principle: the system opposes the change. Increasing temperature means adding heat, the equilibrium shifts to \"remove\" the heat by shifting in the endothermic direction (the direction that absorbs heat). If the forward reaction is exothermic, increasing temperature shifts the equilibrium toward reactants (left). This is why high temperature reduces yield in the Haber process."},{"stem":"What is the main use of ammonia produced by the Haber process?","A":"As a fuel in power stations","B":"As a refrigerant in industrial cooling systems","C":"As the starting material for making fertilisers","D":"As a raw material for making plastics","correct":"C","explain":"More than 80% of ammonia produced by the Haber process is used to make fertilisers, mainly ammonium nitrate (NH₄NO₃) and ammonium sulfate. Fertilisers provide nitrogen to crops, increasing agricultural yields and feeding roughly half the world's population. Ammonia is also used to make nitric acid, explosives, dyes and household cleaners."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
