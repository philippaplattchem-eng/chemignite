<script>const QUESTIONS=[{"stem":"Explain, in terms of electronic configurations, why lithium is less reactive than potassium. Which answer gives the best reasoning for a 3-mark question?","A":"Potassium has more electrons in total so it reacts faster","B":"Lithium has a smaller atom so its outer electron is closer to the nucleus; potassium has more inner shells shielding the outer electron; so potassium's outer electron is held less tightly and lost more easily","C":"Potassium has more outer shells, giving it more electrons to lose","D":"Lithium is less reactive because it is at the top of the group","correct":"B","explain":"The model 3-mark answer identifies: (1) K has more shells (2,8,8,1 = 4 shells vs Li's 2,1 = 2 shells), (2) K's outer electron is further from the nucleus AND more shielded by inner-shell electrons, (3) the electrostatic attraction is weaker in K so the outer electron is lost more easily = more reactive. Saying \"more outer shells\" is wrong, both have just 1 outer shell. Saying \"more electrons\" is too vague."},{"stem":"Chlorine water is added to potassium bromide solution. A student then adds this mixture to potassium iodide solution. What is the colour of the final solution and why?","A":"Orange only, because only bromine has been displaced","B":"Brown, because iodine is also displaced by the chlorine still present","C":"Purple, because both bromine and iodine are formed","D":"Colourless, because the halogens react with each other and cancel out","correct":"B","explain":"Chlorine displaces both bromide and iodide from their solutions (Cl₂ + 2KBr → 2KCl + Br₂; Cl₂ + 2KI → 2KCl + I₂). The mixture would contain both Br₂ (orange) and I₂ (brown). In practice the brown iodine colour dominates, making the solution appear dark brown. Bromine may also displace iodide (Br₂ + 2KI → 2KBr + I₂) if excess bromine remains."},{"stem":"A student carries out three displacement experiments: (1) Cl₂ added to KI, solution turns brown. (2) Br₂ added to KCl, no colour change. (3) I₂ added to KBr, no colour change. What reactivity order do these results give, from most to least reactive?","A":"I > Br > Cl","B":"Cl > Br > I","C":"Br > Cl > I","D":"I > Cl > Br","correct":"B","explain":"Experiment 1: Cl₂ displaces I⁻, so Cl > I. Experiment 2: Br₂ cannot displace Cl⁻, so Cl > Br. Experiment 3: I₂ cannot displace Br⁻, so Br > I. Combining: Cl > Br > I. The brown colour in Exp 1 is iodine produced, it is the product (displaced species), confirming iodine is less reactive."},{"stem":"In the displacement reaction Cl₂(aq) + 2Br⁻(aq) → 2Cl⁻(aq) + Br₂(aq), which species is oxidised and which is reduced? Select the correct answer.","A":"Cl₂ is oxidised (gains electrons); Br⁻ is reduced (loses electrons)","B":"Cl₂ is reduced (gains electrons) and acts as the oxidising agent; Br⁻ is oxidised (loses electrons) and acts as the reducing agent","C":"Br₂ is the reducing agent because it contains bromine","D":"K⁺ is oxidised because potassium is in Group 1","correct":"B","explain":"OIL RIG: Cl₂ + 2e⁻ → 2Cl⁻ (Cl₂ gains electrons = reduction; Cl₂ is the oxidising agent). 2Br⁻ → Br₂ + 2e⁻ (Br⁻ loses electrons = oxidation; Br⁻ is the reducing agent). K⁺ is a spectator ion, it does not change and is not involved in the electron transfer. The species that is oxidised is the reducing agent."},{"stem":"Using electronic configuration reasoning, explain why fluorine (2,7) is more reactive than iodine (2,8,18,18,7).","A":"Fluorine has fewer electrons in total so it reacts less; iodine is more reactive","B":"Fluorine's outer shell is closer to the nucleus with less shielding, so it attracts an incoming electron much more strongly than iodine","C":"Fluorine has 7 outer electrons so it needs to gain 7 more to react","D":"Iodine is more reactive because it has more electrons to share","correct":"B","explain":"Both F and I have 7 outer electrons and react by gaining 1 electron. In fluorine (2 shells), the outer shell is very close to the nucleus with minimal shielding, the nucleus strongly attracts an incoming electron. In iodine (5 shells), the outer shell is much further away and shielded by 46 inner electrons, nuclear attraction on an incoming electron is far weaker. So fluorine gains an electron far more readily = more reactive."},{"stem":"A student predicts: \"Astatine is below iodine in Group 7, so astatine would displace iodide ions from potassium iodide solution.\" Is this prediction correct?","A":"Correct, all halogens can displace halides from solution","B":"Incorrect, astatine is less reactive than iodine, so it cannot displace iodide","C":"Correct, astatine is denser than iodine so it reacts more readily","D":"Incorrect, astatine does not react because it is radioactive","correct":"B","explain":"Reactivity decreases down Group 7. Astatine is below iodine so it is less reactive than iodine. A displacement reaction requires the displacing halogen to be more reactive than the halide being displaced. Since astatine is less reactive than iodine, it cannot displace iodide. In fact, iodine would displace astatide if astatine were in solution."},{"stem":"The half-equation for the reduction of bromine in the displacement reaction with iodide is:","A":"2Br⁻ → Br₂ + 2e⁻","B":"Br₂ + 2e⁻ → 2Br⁻","C":"2I⁻ → I₂ + 2e⁻","D":"I₂ + 2e⁻ → 2I⁻","correct":"B","explain":"In Br₂ + 2KI → 2KBr + I₂, bromine is the species that gains electrons (is reduced). Reduction half-equation: Br₂ + 2e⁻ → 2Br⁻. Option A is the oxidation half-equation for bromine (loss of electrons), which is what happens when bromine is produced, not consumed. Options C and D are the half-equations for iodide/iodine, the species being oxidised."},{"stem":"A student tests an unknown gas using damp blue litmus paper. The paper turns red but is NOT bleached white. What can the student conclude?","A":"The gas is definitely chlorine but the test was done incorrectly","B":"The gas is an acidic gas but is not chlorine","C":"The gas is carbon dioxide and nothing else","D":"The test proves the gas is hydrogen chloride specifically","correct":"B","explain":"Several acidic gases (HCl, SO₂, CO₂, NO₂) turn damp blue litmus paper red. Only chlorine also bleaches it white. No bleaching means the acidic gas is not chlorine, but the test alone cannot identify which specific acid gas it is. Further tests would be needed (e.g. limewater for CO₂; smell and density for HCl)."},{"stem":"Which of the following correctly compares the reactivity trends in Group 1 and Group 7 and explains the reason?","A":"Both groups become more reactive going down, because atoms get bigger and hold electrons less tightly","B":"Group 1 becomes more reactive going down (outer electron lost more easily); Group 7 becomes less reactive going down (incoming electron attracted less strongly), both because atoms get larger with more shielding","C":"Group 1 becomes less reactive going down; Group 7 becomes more reactive going down","D":"Group 7 becomes more reactive going down because larger atoms can hold more electrons in their outer shell","correct":"B","explain":"In Group 1, atoms react by losing the outer electron. More shells and more shielding mean the outer electron is further away and held less tightly, lost more easily, so reactivity increases. In Group 7, atoms react by gaining an electron. More shells and more shielding mean the incoming electron joins a shell further from the nucleus and the nuclear attraction is weaker, gained less easily, so reactivity decreases. Same atomic-size reasoning, opposite conclusions."},{"stem":"Neon is used in advertising signs. A student says \"neon reacts with the electricity to produce light.\" Evaluate this statement.","A":"Correct, neon undergoes a chemical reaction with electrons to produce light","B":"Incorrect, neon is inert and does not react; instead, electrons from the discharge excite neon atoms, and light is emitted when electrons fall back to lower energy levels","C":"Incorrect, neon does not produce light; only the glass tube glows","D":"Correct, the reaction between neon and nitrogen in the tube produces the colour","correct":"B","explain":"Neon does not react chemically. It is inert (full outer shell, no tendency to gain/lose/share electrons). What happens in a neon sign is a physical process: high-voltage electrons collide with neon atoms, exciting the electrons in those atoms; when these excited electrons fall back to lower energy levels, they emit photons of specific wavelengths, the characteristic red-orange light. The gas itself is unchanged, which is why neon signs last a long time."},{"stem":"Caesium is below potassium in Group 1. Write a balanced symbol equation for caesium reacting with water, and predict two observations.","A":"Cs + H₂O → CsOH + H₂ (no observations possible)","B":"2Cs(s) + 2H₂O(l) → 2CsOH(aq) + H₂(g); more violent than potassium, possibly explosive with a lilac flame","C":"Cs + H₂O → CsO + H₂; caesium sinks and fizzes","D":"2Cs + H₂O → Cs₂O + H₂; caesium dissolves slowly","correct":"B","explain":"All Group 1 metals follow the pattern 2M + 2H₂O → 2MOH + H₂. Caesium (Cs) gives 2Cs(s) + 2H₂O(l) → 2CsOH(aq) + H₂(g). Being below potassium in the group, caesium is more reactive, the reaction would be extremely violent, likely explosive, with instantaneous ignition of hydrogen (lilac flame from Cs⁺ ions). Caesium floats (low density), it does not sink."},{"stem":"A student argues: \"Noble gases can't form any compounds because their outer shell is full.\" A chemist challenges this, noting that xenon can form compounds under special conditions. Which response correctly assesses the student's statement?","A":"The student is correct, full outer shell absolutely prevents all reactions","B":"The student's statement is broadly correct at GCSE, under normal conditions noble gases do not react; under extreme laboratory conditions some noble gases can react, but this is beyond GCSE","C":"The student is wrong, all noble gases can react easily","D":"The student is wrong, helium forms helium fluoride under common conditions","correct":"B","explain":"At GCSE level, the statement that noble gases are inert (do not react) is correct. In practice, heavier noble gases like xenon can be made to form compounds (e.g. XeF₂) under extreme conditions in specialist research. For GCSE purposes, the full-outer-shell explanation is appropriate and sufficient. Helium is too small to form compounds even in research. The student is not wrong within the scope of the GCSE specification."},{"stem":"The table shows data for some Group 7 halogens: F (boiling point −188°C), Cl (boiling point −35°C), Br (boiling point 59°C), I (boiling point 184°C). Predict the boiling point of astatine and explain your reasoning.","A":"−250°C, astatine is at the top of the group so has the lowest boiling point","B":"Around 300°C, boiling points increase going down Group 7 and the jumps are roughly 100–130°C each time","C":"184°C, the same as iodine because they are both solids","D":"0°C, astatine is radioactive so its properties cannot be predicted","correct":"B","explain":"Boiling points increase going down Group 7 due to stronger intermolecular forces in larger molecules. The jumps are: F→Cl = +153°C, Cl→Br = +94°C, Br→I = +125°C, averaging roughly +120°C. Adding ~120°C to iodine's 184°C gives approximately 300°C for astatine. The actual value is around 337°C. Radioactivity does not prevent prediction from periodic trends."},{"stem":"In Group 1 reactions with water, which observation is common to all three metals (Li, Na, K) and which observation is unique to potassium?","A":"Common: lilac flame. Unique to K: the metal melts into a ball","B":"Common: the metal sinks. Unique to K: vigorous fizzing","C":"Common: the metal floats and produces an alkaline solution. Unique to K: the hydrogen ignites with a lilac flame","D":"Common: an explosive reaction. Unique to K: the metal melts","correct":"C","explain":"All three metals float (lower density than water) and produce alkaline solutions (metal hydroxide formed). Only potassium always ignites the hydrogen produced, giving a lilac flame. Sodium sometimes gives a pale lilac/yellow flame but not consistently. Lithium does not produce any flame. Melting into a ball is seen for both Na and K (their low melting points + exothermic reaction), not unique to K."},{"stem":"A student incorrectly states: \"In the displacement reaction Cl₂ + 2KBr → 2KCl + Br₂, the potassium displaces the bromine.\" Explain the correct chemical reasoning.","A":"The student is correct; potassium reacts with chlorine to form potassium chloride","B":"The student is wrong; it is the chlorine molecule that displaces bromide ions, because chlorine is more reactive than bromine; potassium ions are spectator ions","C":"The student is wrong; bromine displaces potassium from the solution","D":"The student is wrong; the chloride ion displaces the bromide ion","correct":"B","explain":"Displacement reactions in Group 7 involve halogen molecules competing for electrons, not metal cations. Cl₂ gains electrons from Br⁻: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂. The K⁺ ions are spectator ions, they are unchanged throughout and do not take part in the displacement. This confusion was explicitly noted in the 2019 Higher tier examiner report."},{"stem":"Explain, using electronic configuration ideas, why Group 7 reactivity decreases and Group 1 reactivity increases as you go down each group.","A":"Both trends occur because atomic size increases, which always makes reactions faster","B":"Both trends occur because nuclear charge increases, making atoms hold all electrons more tightly","C":"Group 1 atoms lose an outer electron more easily as they get larger (weaker attraction); Group 7 atoms gain an electron less easily as they get larger (weaker attraction on incoming electron), same atomic-size reasoning, opposite conclusions because of loss vs gain","D":"Group 1 is less reactive down the group because larger atoms lose electrons less easily","correct":"C","explain":"The key is whether the element loses or gains an electron. For Group 1 (losing an electron): more shells → outer electron further away and more shielded → weaker attraction → lost more easily → more reactive going down. For Group 7 (gaining an electron): more shells → incoming electron joins a more distant shell with more shielding → weaker nuclear attraction on incoming electron → gained less easily → less reactive going down."},{"stem":"A student predicts that HI dissolved in water will produce an alkaline solution because \"iodine is below chlorine and more like a metal.\" Evaluate this prediction.","A":"Correct, iodine does become more metallic down the group","B":"Incorrect, all hydrogen halides dissolve in water to form acidic solutions; HI gives hydroiodic acid (pH < 7)","C":"Correct, HI dissociates to give OH⁻ ions","D":"Incorrect, HI is insoluble in water so no pH change occurs","correct":"B","explain":"All hydrogen halides (HF, HCl, HBr, HI) are acidic when dissolved in water. They release H⁺(aq) ions: HI(g) + water → H⁺(aq) + I⁻(aq). This gives hydroiodic acid with a pH below 7. Iodine does not become metallic in Group 7, all halogens are non-metals and all hydrogen halide solutions are acidic. \"More like a metal\" is incorrect reasoning."},{"stem":"A student designs an experiment to determine whether astatine would displace iodide from potassium iodide solution. Why would this experiment be very difficult to carry out in practice?","A":"Astatine is a gas and would escape from the solution","B":"Astatine is highly radioactive and only exists in very small quantities, making safe experimental use extremely difficult","C":"Astatine dissolves instantly in water, so it cannot be added to KI solution","D":"Astatine reacts with air to form a precipitate before it reaches the solution","correct":"B","explain":"Astatine is the rarest naturally occurring element on Earth, only a few hundred grams exist at any time. It is also highly radioactive (all isotopes are unstable). These properties make practical experiments virtually impossible. In practice, predictions about astatine's behaviour are made by extrapolating from the established Group 7 trend, rather than from experiment."},{"stem":"Which of the following correctly identifies the oxidising agent in the reaction: Br₂(aq) + 2I⁻(aq) → 2Br⁻(aq) + I₂(aq)?","A":"I⁻ is the oxidising agent because it is oxidised to I₂","B":"I₂ is the oxidising agent because it is the product","C":"Br₂ is the oxidising agent because it gains electrons (is reduced)","D":"Br⁻ is the oxidising agent because it is the reduced product","correct":"C","explain":"The oxidising agent is the species that causes oxidation in another species, and to do so, the oxidising agent itself must gain electrons (be reduced). In this reaction: Br₂ + 2e⁻ → 2Br⁻ (Br₂ gains electrons = reduced = oxidising agent). I⁻ loses electrons (is oxidised) so I⁻ is the reducing agent. The common mix-up is naming the oxidised species as the oxidising agent, OIL RIG: the oxidising agent IS reduced."},{"stem":"A teacher asks: \"If all noble gases have a full outer shell, why does helium behave differently from neon in terms of outer electron count?\" Which answer correctly addresses this question?","A":"Helium is different because it is not a noble gas","B":"Helium has only one electron shell, which holds a maximum of 2 electrons, its first shell is full at 2 electrons; neon and the others have a second or higher shell, which holds a maximum of 8, giving 8 outer electrons, but \"full outer shell\" is the common feature","C":"Neon is not a noble gas because it has 8 outer electrons","D":"Helium has 8 outer electrons but they are in a special shell that is counted differently","correct":"B","explain":"The maximum capacity of the first electron shell is 2 electrons (not 8). Helium has atomic number 2, so both electrons fill the first (and only) shell, making it full at 2. Neon (atomic number 10) has a first shell of 2 and a second shell of 8, the second shell maximum is 8, so neon's outer shell is full at 8. All noble gases share the \"full outer shell\" feature; it's just that the maximum for the first shell happens to be 2, not 8. This is why \"noble gases all have 8 outer electrons\" is incorrect for helium."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
