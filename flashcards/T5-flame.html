<header class="site-header">

  <h1>T5 &mdash; Separate Chemistry 1</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
<div class="deck-meta"><span>15 cards &mdash; Flame (Apply)</span><span class="counter" id="counter">1 / 15</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question &mdash; tap to reveal answer</div><div class="card-q" id="card-q"></div></div>
  <div class="card-face card-back"><div class="card-hint">Answer</div><div class="card-ans" id="card-ans"></div><div class="card-ex" id="card-ex"></div></div>
</div></div>

  <button class="nav-btn" id="btn-prev">&larr; Prev</button>

</div>

</main>
<script>const QUESTIONS=[{"stem":"Iron nails are placed in three separate test tubes: (A) water and air; (B) dry air (silica gel); (C) boiled water (no oxygen) sealed with oil. After one week, which nail will have rusted most?","A":"Nail B, dry air provides plenty of oxygen","B":"Nail C, water is still present even without dissolved oxygen","C":"Nail A, both water and oxygen are present","D":"All three nails will rust equally, oxygen and water always reach iron eventually","correct":"C","explain":"Rusting requires both oxygen AND water. Nail A has both → rusts. Nail B has oxygen but no water → does not rust. Nail C has water but oxygen has been boiled out and is excluded by the oil → does not rust. This classic experiment demonstrates that both conditions are necessary simultaneously."},{"stem":"Calculate the atom economy for the production of ammonia by the Haber process. N₂ + 3H₂ → 2NH₃ (N = 14, H = 1)","A":"50%","B":"75%","C":"85%","D":"100%","correct":"D","explain":"% atom economy = (Mr of desired product ÷ sum of Mr of all products) × 100. The only product is NH₃, so all atoms in the reactants become the desired product. % atom economy = 100%. Addition reactions and reactions with only one product always have 100% atom economy. This is one reason the Haber process is considered relatively atom-efficient."},{"stem":"A student produces calcium carbonate by mixing solutions of calcium chloride and sodium carbonate. The equation is: CaCl₂ + Na₂CO₃ → CaCO₃ + 2NaCl. If Mr(CaCO₃) = 100 and Mr(NaCl) = 58.5, calculate the atom economy for CaCO₃ production.","A":"100%","B":"46%","C":"63%","D":"37%","correct":"B","explain":"Sum of Mr of all products = Mr(CaCO₃) + 2 × Mr(NaCl) = 100 + (2 × 58.5) = 100 + 117 = 217. % atom economy = (100 ÷ 217) × 100 = 46.1% ≈ 46%. The other 54% of atom mass ends up in sodium chloride (NaCl), which is a byproduct (waste unless it can be sold). This is why chemists prefer reactions with fewer byproducts."},{"stem":"Explain why zinc is used for sacrificial protection of iron rather than copper, even though copper is a more familiar metal coating.","A":"Zinc is cheaper than copper and produces a brighter finish","B":"Zinc is more reactive than iron, so it corrodes preferentially; copper is less reactive than iron, so it would not protect iron and could actually accelerate rusting if the coating is scratched","C":"Zinc forms a coloured oxide that acts as a visual indicator when corrosion begins","D":"Copper reacts with zinc to form an alloy that protects the iron below","correct":"B","explain":"Sacrificial protection requires a metal MORE reactive than iron. Zinc (above iron in the reactivity series) corrodes in preference to iron, even if the zinc coating is damaged, the zinc nearby continues to oxidise, protecting the iron. Copper is LESS reactive than iron, it would not corrode preferentially. If a copper coating on iron is scratched, the exposed iron would rust while the copper remains intact; in fact, copper-iron contact can accelerate corrosion by setting up a galvanic cell."},{"stem":"A student electroplates an iron spoon with silver. The spoon loses mass during a failed attempt. Suggest what went wrong, and describe the correct electrode setup.","A":"The spoon should have been the anode; the silver should have been the cathode","B":"If the spoon was the anode (positive electrode), it would have dissolved, it should be the cathode (negative electrode); the silver anode dissolves and deposits onto the spoon cathode in silver nitrate electrolyte","C":"The electrolyte should have been iron(II) sulfate, not silver nitrate","D":"DC current causes mass loss; AC current should be used for electroplating","correct":"B","explain":"Correct setup: spoon = cathode (negative electrode, where Ag⁺ ions are reduced and silver deposits: Ag⁺ + e⁻ → Ag). Silver electrode = anode (positive electrode, where silver dissolves: Ag → Ag⁺ + e⁻). Electrolyte = silver nitrate solution. If the connections are reversed, the iron spoon becomes the anode and iron dissolves, explaining why the spoon lost mass."},{"stem":"A titration gives these results: Rough: 24.5 cm³. Run 1: 23.8 cm³. Run 2: 23.7 cm³. Run 3: 24.6 cm³. Which readings should be averaged and why?","A":"All four readings should be averaged to give the best estimate","B":"Runs 1 and 2 (23.8 and 23.7 cm³), they are concordant (within 0.10 cm³ of each other); the rough titre and Run 3 are excluded","C":"Runs 1, 2 and 3, the rough titre is always excluded","D":"Run 2 only, it is the most accurate single reading","correct":"B","explain":"The rough titre is always excluded, it is done quickly to find the approximate end point. Concordant titres are those within 0.10 cm³ of each other. Run 1 (23.8) and Run 2 (23.7) differ by only 0.1 cm³ → concordant → use these. Run 3 (24.6) differs by 0.9 cm³ from Run 2 → not concordant → excluded. Mean = (23.8 + 23.7) ÷ 2 = 23.75 cm³."},{"stem":"Calculate the volume of hydrogen gas produced at RTP when 0.6 g of magnesium reacts with excess hydrochloric acid. Mg + 2HCl → MgCl₂ + H₂ (Mg = 24; molar volume = 24 dm³/mol)","A":"0.6 dm³","B":"0.6 cm³","C":"0.6 L  (= 600 cm³)","D":"14.4 dm³","correct":"C","explain":"Moles of Mg = 0.6 ÷ 24 = 0.025 mol. From equation: 1 mol Mg → 1 mol H₂, so moles of H₂ = 0.025 mol. Volume = 0.025 × 24 = 0.6 dm³ (= 600 cm³). Always: (1) find moles of the known substance; (2) use mole ratio; (3) multiply by 24 to get volume."},{"stem":"A student produces aspirin in the lab. The theoretical yield is 2.70 g but they only collect 1.89 g. Calculate the percentage yield and suggest one reason why it is less than 100%.","A":"70%; reason: some aspirin dissolved in the wash water during purification","B":"70%; reason: the balanced equation was incorrect","C":"143%; reason: the student used too much starting material","D":"30%; reason: some aspirin was converted into a different compound","correct":"A","explain":"% yield = (1.89 ÷ 2.70) × 100 = 70%. Reasons for < 100%: (1) practical losses, aspirin dissolves slightly in the water used to wash and purify it; (2) side reactions, aspirin can be hydrolysed back to its starting materials; (3) incomplete reaction, if insufficient acid catalyst is used, not all starting material converts. The student lost 30% of the theoretical maximum."},{"stem":"Brass is an alloy of copper and zinc. Explain why brass is harder than pure copper, using the particle model.","A":"Zinc atoms are more reactive than copper atoms, increasing the chemical bond strength","B":"Zinc atoms are a different size from copper atoms; they disrupt the regular layers of copper atoms, preventing the layers from sliding over each other, this makes brass harder and stronger than pure copper","C":"Zinc atoms form covalent bonds with copper atoms, creating a rigid network","D":"Adding zinc increases the number of delocalised electrons, strengthening the metallic bonding","correct":"B","explain":"In pure copper, identical-size copper atoms are arranged in regular layers that slide easily (making copper soft and malleable). Adding zinc (different-size atoms) disrupts these regular layers, the zinc atoms jam between the copper layers, preventing them from sliding. This resistance to sliding is what we detect as hardness and strength. The particle model diagram shows irregularly-sized circles disrupting the regular grid."},{"stem":"The formula for atom economy is: Mr desired product ÷ sum of Mr of all products × 100. Two routes to the same product are compared: Route A has atom economy 85%; Route B has atom economy 40%. A student claims Route A is always the better industrial choice. Evaluate this claim.","A":"Correct, higher atom economy is always preferable in industry","B":"Partially correct, higher atom economy (Route A) means less waste, lower raw material cost, and lower disposal costs; but other factors also matter: yield, rate, cost of starting materials, safety, availability of reagents, and whether byproducts can be sold","C":"Incorrect, Route B is better because higher byproduct production means more products to sell","D":"Correct, atom economy is the only measure of industrial efficiency","correct":"B","explain":"Route A's 85% atom economy means less waste per tonne of product, lower disposal costs, lower raw material waste, and a more sustainable process. However, atom economy is not the only factor: Route B might have a higher reaction rate, lower cost reagents, or a simpler procedure. A low-atom-economy route might still be preferred if the byproducts have value (e.g. can be sold). Choosing a reaction pathway requires balancing atom economy, yield, rate, cost and safety."},{"stem":"25.0 cm³ of H₂SO₄ is exactly neutralised by 30.0 cm³ of 0.40 mol/dm³ NaOH. Calculate the concentration of the H₂SO₄. (Equation: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O)","A":"0.48 mol/dm³","B":"0.24 mol/dm³","C":"0.40 mol/dm³","D":"0.20 mol/dm³","correct":"B","explain":"Moles NaOH = 0.40 × (30.0/1000) = 0.012 mol. From equation: ratio H₂SO₄ : NaOH = 1 : 2. Moles H₂SO₄ = 0.012 ÷ 2 = 0.006 mol. Concentration H₂SO₄ = 0.006 ÷ (25.0/1000) = 0.006 ÷ 0.025 = 0.24 mol/dm³. Note: the 1:2 mole ratio is critical here, H₂SO₄ is a diprotic acid."},{"stem":"A student adds copper turnings to iron(II) sulfate solution. Predict whether a reaction occurs and explain your answer using the reactivity series.","A":"Reaction occurs, copper displaces iron from solution","B":"No reaction, copper is less reactive than iron, so it cannot displace iron from iron(II) sulfate solution","C":"Reaction occurs, iron(II) sulfate is acidic and acids react with copper","D":"No reaction, copper and iron react only when heated to high temperatures","correct":"B","explain":"Displacement requires the added metal to be MORE reactive than the metal in solution. Copper is BELOW iron in the reactivity series (copper is less reactive). Therefore copper cannot displace iron from iron sulfate, no reaction occurs. If you reversed the experiment (iron into copper sulfate) → reaction would occur, as iron is more reactive than copper."},{"stem":"Calculate the theoretical yield of iron(III) oxide when 11.2 g of iron is completely oxidised. 4Fe + 3O₂ → 2Fe₂O₃ (Fe = 56, O = 16, Mr Fe₂O₃ = 160)","A":"11.2 g","B":"16 g","C":"32 g","D":"8 g","correct":"B","explain":"Moles Fe = 11.2 ÷ 56 = 0.2 mol. Mole ratio: 4 Fe → 2 Fe₂O₃, so Fe : Fe₂O₃ = 2 : 1. Moles Fe₂O₃ = 0.2 ÷ 2 = 0.1 mol. Mass Fe₂O₃ = 0.1 × 160 = 16 g. Always extract the mole ratio directly from the balanced equation balancing numbers."},{"stem":"Describe the role of transition metals as catalysts, giving one specific example.","A":"Transition metals act as catalysts by forming alloys with the reactants, lowering their melting points and allowing reactions at room temperature","B":"Transition metals are catalysts because their partially filled d-orbitals allow them to change oxidation state and form temporary bonds with reactants, lowering activation energy, e.g. iron in the Haber process, vanadium pentoxide in the Contact Process, manganese(IV) oxide in decomposition of hydrogen peroxide","C":"Transition metals catalyse reactions by increasing temperature at the reaction surface","D":"Transition metals are catalysts because they dissolve in the reaction mixture and increase the concentration of reactants","correct":"B","explain":"Transition metals (and their compounds) can change oxidation state easily and form temporary bonds with reactant molecules, providing an alternative reaction pathway with lower activation energy. Examples: iron (Haber process, NH₃ production); vanadium pentoxide (Contact Process, SO₃/H₂SO₄ production); manganese(IV) oxide (MnO₂) catalyses H₂O₂ → H₂O + O₂; nickel (hydrogenation of oils). The catalyst is not consumed and can be used repeatedly."},{"stem":"A student claims that a reaction with 100% yield must also have 100% atom economy. Evaluate this claim.","A":"Correct, 100% yield always means 100% atom economy","B":"Incorrect, yield and atom economy measure different things; a reaction can have 100% yield (all reactants convert to products) but low atom economy if the desired product is only one of several products formed","C":"Correct, atom economy and yield are calculated using the same formula","D":"Incorrect, atom economy is always lower than yield for any reaction","correct":"B","explain":"Yield measures how much of the theoretical maximum product you actually collect, it depends on how the reaction proceeds in practice. Atom economy measures what fraction of atoms end up as the desired product, it depends on the balanced equation (what products are formed). A reaction producing equal amounts of desired product and waste byproduct could have 100% yield (all reactants react) but only 50% atom economy (half the atoms become waste). They are independent measures of efficiency."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
