<script>const QUESTIONS=[{"stem":"A student writes: \"The more volatile a fraction, the higher its boiling point and the longer its carbon chains.\" Identify two errors and give the correct statements.","A":"No errors, the statement is correct","B":"Error 1: higher BP → shorter chains; Error 2: shorter chains → more volatile","C":"Error 1: more volatile → lower BP is wrong; Error 2: longer chains → more volatile","D":"Error 1: volatility and BP are unrelated; Error 2: chain length and BP are unrelated","correct":"B","explain":"Both claims are reversed. More volatile means it evaporates more easily, which means a <strong>lower</strong> boiling point. Lower boiling points come from <strong>shorter</strong> carbon chains (weaker intermolecular forces). Longer chains → stronger forces → higher BP → less volatile. The student has inverted both relationships."},{"stem":"Deduce the balanced equation for complete combustion of heptane (C₇H₁₆).","A":"C₇H₁₆ + 8O₂ → 7CO₂ + 8H₂O","B":"C₇H₁₆ + 7O₂ → 7CO₂ + 8H₂O","C":"2C₇H₁₆ + 15O₂ → 14CO + 16H₂O","D":"C₇H₁₆ + 11O₂ → 7CO₂ + 8H₂O","correct":"D","explain":"Balance step by step: 7 C → 7 CO₂; 16 H → 8 H₂O. Oxygen on right: 7×2 (from CO₂) + 8×1 (from H₂O) = 14 + 8 = 22 O atoms → 11 O₂ molecules needed. Equation: C₇H₁₆ + 11O₂ → 7CO₂ + 8H₂O ✓. Option C shows the CO (incomplete combustion) pathway, it is balanced but describes a different reaction (limited oxygen)."},{"stem":"Explain in terms of haemoglobin why carbon monoxide poisoning can be fatal.","A":"CO reacts with oxygen in the lungs, using it up before cells can absorb it","B":"CO permanently destroys haemoglobin molecules in all red blood cells","C":"CO binds strongly to haemoglobin, preventing it from carrying oxygen to cells","D":"CO lowers blood pH so that oxygen becomes insoluble in plasma","correct":"C","explain":"Oxygen normally binds reversibly to the iron centre in haemoglobin in the lungs. CO binds to the same site but far more strongly than O₂, once CO is attached, haemoglobin cannot pick up oxygen. As CO levels rise in the blood, more haemoglobin is blocked. The body's cells are starved of oxygen even though the person is still breathing, potentially causing death."},{"stem":"Decane (C₁₀H₂₂) is cracked to give octane (C₈H₁₈) and one other product. Identify the other product and explain why cracking is necessary for the petrochemical industry.","A":"Ethanol (C₂H₅OH); cracking is needed because ethanol is more useful than decane","B":"Ethene (C₂H₄); cracking converts unwanted heavy fractions into useful fuels and polymer monomers","C":"Ethane (C₂H₆); cracking breaks bonds in the alkane chain at high temperature","D":"Propene (C₃H₆); cracking is needed because octane is too short to use as fuel","correct":"B","explain":"C₁₀H₂₂ → C₈H₁₈ + C₂H₄. Count atoms: 10 C = 8 C + 2 C ✓; 22 H = 18 H + 4 H ✓. The other product is ethene (C₂H₄), an alkene. Cracking is necessary because crude oil produces proportionally too many long-chain heavy fractions (low demand) and not enough short-chain fuels and alkenes (high demand for plastics and fuel)."},{"stem":"A student claims that using hydrogen in cars produces zero carbon emissions. Evaluate this claim.","A":"The claim is completely correct, hydrogen combustion produces only water","B":"The claim is correct only if the hydrogen was made by electrolysis using renewable electricity","C":"The claim is wrong because hydrogen always produces CO₂ when burned in air","D":"The claim is correct for all methods of hydrogen production, including steam reforming","correct":"B","explain":"At the point of combustion, hydrogen produces only water, zero CO₂ from the engine. However, hydrogen must be manufactured. If made by steam reforming of methane (CH₄ + 2H₂O → CO₂ + 4H₂), CO₂ is released during production. Zero overall emissions only occur if the electricity for electrolysis of water comes from renewables. The claim is partially true but depends critically on the production method."},{"stem":"Explain why global warming is described as an \"enhanced\" greenhouse effect rather than simply \"the greenhouse effect\".","A":"The enhanced greenhouse effect involves more types of gas than the natural one","B":"The natural greenhouse effect is beneficial; \"enhanced\" means human activity has increased greenhouse gas concentrations, trapping more heat","C":"Enhanced means that the greenhouse effect is stronger at the equator than the poles","D":"Enhanced refers to the use of more sensitive measurement instruments since 1950","correct":"B","explain":"The greenhouse effect is a natural, necessary process that keeps Earth habitable. The *enhanced* greenhouse effect describes the additional warming caused by human activity raising greenhouse gas concentrations (especially CO₂ from fossil fuels and CH₄ from livestock and landfill) above pre-industrial levels. More greenhouse gas molecules → more IR absorbed → more energy re-radiated back to Earth → additional warming on top of the natural baseline."},{"stem":"The concentration of CO₂ in the atmosphere has risen from about 280 ppm in 1750 to over 420 ppm today. What does this tell us, and what uncertainty exists in interpreting this data?","A":"It proves CO₂ alone is causing all climate change; the data is completely reliable","B":"It shows a strong correlation with fossil-fuel use and temperature rise, but correlation alone is not proof of causation, and older data relies on indirect proxy evidence such as ice cores","C":"It shows CO₂ levels have been constant before industrialisation so human activity is clearly responsible","D":"The data is too uncertain to be used as evidence at all","correct":"B","explain":"The 50% rise in CO₂ over 270 years strongly correlates with fossil-fuel consumption and rising temperature. However, a correlation is not automatically proof of causation. Additionally, pre-1958 CO₂ data comes from ice cores, air bubbles trapped in glacial ice. Ice core data is reliable but subject to uncertainty from bubble migration, depth estimation errors, and the averaging over time that occurs as layers compact. These limitations must be acknowledged when evaluating the evidence."},{"stem":"In what two main ways did atmospheric CO₂ decrease from the very high levels of the early Earth?","A":"Respiration by animals and burning of fossil fuels","B":"Dissolution in oceans and being locked up in sedimentary rocks and fossil fuels via photosynthesis","C":"Reaction with nitrogen to form nitrates and volcanic absorption","D":"UV decomposition of CO₂ into carbon and oxygen","correct":"B","explain":"Two main routes: (1) CO₂ dissolved in the newly-formed oceans, reducing atmospheric levels and eventually forming carbonate rocks (limestone) as calcium and magnesium ions reacted with dissolved CO₂. (2) Photosynthesis by algae and plants removed CO₂ and converted it into organic matter, buried organic matter became the coal, oil and gas now used as fossil fuels."},{"stem":"Propane (C₃H₈) burns in insufficient oxygen to produce only soot (C) and water. Write the balanced equation.","A":"C₃H₈ + O₂ → 3C + 4H₂","B":"C₃H₈ + 2O₂ → 3C + 4H₂O","C":"2C₃H₈ + 7O₂ → 6CO + 8H₂O","D":"C₃H₈ + 3O₂ → 3C + 4H₂O","correct":"B","explain":"For the soot pathway: C₃H₈ → 3C (soot) + 4H₂O. Balance oxygen: 4 H₂O requires 4 O atoms = 2 O₂. Equation: C₃H₈ + 2O₂ → 3C + 4H₂O ✓. Notice that far less O₂ is needed than for complete combustion (which would be C₃H₈ + 5O₂ → 3CO₂ + 4H₂O), confirming this is a severely oxygen-limited reaction."},{"stem":"Evaluate whether the discovery of banded iron formations in rocks from 2.4 billion years ago supports the view that the early atmosphere had little or no oxygen.","A":"No, banded iron formations show that oxygen was always present at 21%","B":"Yes, banded iron formations contain oxidised iron (Fe₂O₃), showing oxygen levels were rising then, implying they were lower before","C":"Yes, banded iron formations are layers of pure iron, proving that iron rusted in the absence of oxygen","D":"No, banded iron formations are only found in Antarctica, so they cannot represent global conditions","correct":"B","explain":"Banded iron formations (BIFs) are ancient rock sequences containing alternating iron-rich and iron-poor layers. Their formation around 2.4 billion years ago indicates that free oxygen was beginning to appear in seawater and react with dissolved iron(II) to form iron(III) oxide, which precipitated. The fact that BIFs stopped forming later (when oxygen became abundant) implies that before 2.4 billion years ago, oxygen levels were very low, consistent with the \"little or no oxygen\" in the early atmosphere."},{"stem":"A student tests two fuels: hydrogen and petrol. Petrol produces CO₂, CO, NOₓ and soot. Hydrogen produces only water. Give two reasons why hydrogen has not yet replaced petrol in most cars.","A":"Hydrogen is toxic and petrol is safer; hydrogen has a lower energy density so cars have less range","B":"Hydrogen is difficult and dangerous to store, and there are very few hydrogen refuelling stations","C":"Hydrogen cannot be burned in an internal combustion engine; hydrogen produces acid rain","D":"Hydrogen is too expensive to produce from natural gas; petrol gives a more complete combustion","correct":"B","explain":"Despite its cleaner combustion, hydrogen faces major practical barriers: (1) Storage, hydrogen must be kept under very high pressure or at cryogenic temperatures, which is technically complex and potentially dangerous. (2) Infrastructure, very few hydrogen filling stations exist compared with the extensive petrol/diesel network, making it impractical for everyday drivers. Both barriers are currently being researched and developed."},{"stem":"A scientist measures atmospheric CO₂ at a station in the middle of the Pacific Ocean rather than near a city. Explain why location matters for these measurements.","A":"The Pacific has no greenhouse gases because there is no industry nearby","B":"Measurements near cities include local emissions that would not represent global background CO₂ levels","C":"The Pacific is warmer, so CO₂ dissolves more readily and gives artificially low readings","D":"International law requires all measurements to be taken at sea","correct":"B","explain":"Near industrial areas, local CO₂ emissions from factories, traffic and heating can make readings much higher than the global background level. A remote mid-ocean station (like Mauna Loa in Hawaii) measures air that has mixed globally and is not affected by local sources. This gives a more reliable measure of the true global average CO₂ concentration, essential for detecting the long-term trend."},{"stem":"Explain, using ideas about N≡N bond strength and activation energy, why N₂ and O₂ in the air do not react at room temperature but do react inside a car engine.","A":"N₂ and O₂ molecules move too slowly at room temperature to collide; in engines they collide faster","B":"The N≡N triple bond has a very high activation energy; only the extreme temperatures inside an engine provide enough energy to break it","C":"N₂ is unreactive because it is a noble gas; engines provide a catalyst that lowers the activation energy","D":"At room temperature N₂ and O₂ are too far apart in the atmosphere; engines compress them together","correct":"B","explain":"The N≡N triple bond is one of the strongest covalent bonds known. To react, this bond must first be broken, a process requiring enormous energy input. At room temperature (∼20 °C), virtually no N₂–O₂ collisions have enough energy to exceed this activation energy, so the reaction is effectively switched off. Inside an engine, combustion temperatures exceed 1000 °C: the kinetic energies of molecules are much higher, a much greater fraction of collisions exceed the activation energy, and N₂ + O₂ → 2NO can proceed at a significant rate."},{"stem":"Suggest why deforestation contributes to climate change through two separate mechanisms.","A":"Trees release CO₂ when they breathe; cutting them down reduces this CO₂ source","B":"Burning or decomposing felled trees releases CO₂, and removing trees eliminates a CO₂ sink","C":"Trees produce water vapour; removing them reduces the greenhouse effect","D":"Tree roots absorb methane from the soil; removing trees allows methane to escape","correct":"B","explain":"Deforestation has two distinct effects on atmospheric CO₂: (1) When trees are burned or left to decay, the carbon stored in their wood is released as CO₂, a direct emission. (2) Living trees absorb CO₂ during photosynthesis, acting as carbon sinks. Removing trees eliminates this sink, so CO₂ that would otherwise have been absorbed stays in the atmosphere. Both mechanisms raise atmospheric CO₂ and enhance the greenhouse effect."},{"stem":"A long-chain alkane fraction (C₁₅H₃₂) is cracked in the presence of a hot aluminium oxide catalyst. Give two products and explain why cracking is carried out commercially.","A":"C₁₅H₃₂ → C₈H₁₈ (octane) + C₇H₁₄ (heptene); cracking converts petrol into diesel","B":"C₁₅H₃₂ → C₁₀H₂₂ (decane) + C₅H₁₀ (pentene); cracking converts heavy low-demand fractions into high-demand fuels and alkene monomers","C":"C₁₅H₃₂ → C₁₄H₂₈ + CH₄; cracking converts long chains into methane for domestic use","D":"C₁₅H₃₂ → C₁₅H₃₀ + H₂; cracking removes hydrogen to produce alkenes from alkanes","correct":"B","explain":"One valid cracking equation for C₁₅H₃₂: C₁₅H₃₂ → C₁₀H₂₂ + C₅H₁₀. Check: 15 C = 10 + 5 ✓; 32 H = 22 + 10 ✓. The C₅H₁₀ is an alkene (pent-1-ene). Commercially, cracking is essential because crude oil produces too many unwanted long-chain fractions (heavy oils, bitumen) and not enough petrol-grade alkanes and alkene monomers such as ethene and propene for the plastics industry."},{"stem":"Explain why the early atmosphere had high levels of water vapour but modern air has much less.","A":"Water vapour reacted with CO₂ to form carbonic acid, removing it from the atmosphere","B":"As Earth cooled below 100 °C, water vapour condensed to form liquid water in the oceans","C":"Plants began to absorb water vapour during photosynthesis, removing it from the atmosphere","D":"UV radiation from the Sun broke water vapour into hydrogen and oxygen, which escaped into space","correct":"B","explain":"The early atmosphere contained large amounts of water vapour released by volcanoes. While Earth's surface was above 100 °C, water could only exist as a gas. As Earth cooled, surface temperatures dropped below 100 °C and the water vapour could condense, changing from H₂O(g) to H₂O(l). This liquid water fell as rain and collected in low-lying basins to form the first oceans, removing enormous quantities of water vapour from the atmosphere."},{"stem":"A student says fossil fuels are \"ancient sunlight\". Evaluate this description using ideas about photosynthesis, carbon storage and combustion.","A":"The description is incorrect, fossil fuels come from chemical reactions underground, not from sunlight","B":"The description is apt: plants used sunlight for photosynthesis, storing energy as carbon compounds; buried organisms became fossil fuels; combustion releases that stored solar energy","C":"The description is partially correct: only coal is \"ancient sunlight\"; oil and gas come from volcanic activity","D":"The description is misleading because fossil fuels produce more energy than the original sunlight that made them","correct":"B","explain":"Photosynthesis converts solar energy into chemical energy stored in organic molecules. Dead organisms were buried without oxygen, and over millions of years geological pressure and heat converted them into crude oil, natural gas and coal, all containing carbon compounds that store that original solar energy. When we burn fossil fuels, combustion converts those C–H bonds to CO₂ and H₂O, releasing the energy captured from ancient sunlight millions of years ago. The description is scientifically apt."},{"stem":"Explain why both SO₂ and NOₓ contribute to acid rain, distinguishing their sources and the acids they form.","A":"Both come from impurities in the fuel; both form sulfuric acid in rain","B":"SO₂ comes from sulfur impurities burning in the fuel (S + O₂ → SO₂); NOₓ forms from atmospheric N₂ reacting with O₂ at high engine temperatures (N₂ + O₂ → 2NO). SO₂ dissolves to form sulfurous/sulfuric acid; NOₓ dissolves to form nitric acid","C":"SO₂ comes from nitrogen in the fuel; NOₓ comes from soot particles reacting with oxygen","D":"Both gases come from the air drawn into the engine; both form carbonic acid in rain","correct":"B","explain":"The two pollutants have different origins but both produce acid rain. SO₂ comes from sulfur impurities in the fuel (S + O₂ → SO₂), not from the air. NOₓ comes from atmospheric N₂ reacting with O₂ at the high temperatures of combustion (N₂ + O₂ → 2NO), not from the fuel. In the atmosphere: SO₂ + H₂O → H₂SO₃ (sulfurous acid); NO₂ + water + O₂ → HNO₃ (nitric acid). Both lower rain pH, damaging ecosystems and buildings."},{"stem":"A student plots three graphs on the same axes: atmospheric CO₂ concentration (1750–present), fossil-fuel consumption (1750–present) and global mean temperature (1850–present). All three rise together. Identify one strength and one limitation of this evidence for human-caused climate change.","A":"Strength: correlation proves causation. Limitation: the data does not go back far enough","B":"Strength: three correlated datasets make a coincidence less likely; there is also a mechanism (enhanced greenhouse effect). Limitation: pre-1958 CO₂ data is from ice cores, which carry uncertainties about historical accuracy and may represent averaged values","C":"Strength: scientists took the measurements, so they are reliable. Limitation: temperatures have not risen uniformly everywhere","D":"Strength: all three variables are measured directly. Limitation: the graphs only show correlation, not any mechanism","correct":"B","explain":"Strength: three datasets all showing the same trend simultaneously reduces the probability of coincidence; crucially, there is also a physical mechanism (CO₂ absorbs IR → enhanced greenhouse effect → warming). Limitation: direct CO₂ measurement only started in 1958 at Mauna Loa; older values come from ice cores, which may not perfectly represent global averages and have measurement uncertainties in dating and gas concentrations."},{"stem":"A power company evaluates three options to reduce CO₂ emissions: (1) switch from coal to natural gas, (2) plant forests adjacent to the plant, (3) fit carbon capture and storage (CCS). For each, state whether it reduces atmospheric CO₂ and explain one drawback.","A":"All three completely eliminate CO₂ emissions; no significant drawbacks","B":"Option 1 reduces but does not eliminate CO₂; Option 2 is a slow, land-hungry carbon sink; Option 3 is effective but requires expensive technology and permanent underground storage","C":"Only Option 3 is effective; Options 1 and 2 increase CO₂ emissions","D":"Option 2 is the most effective because trees absorb all CO₂ produced by a power station","correct":"B","explain":"(1) Gas (CH₄) produces less CO₂ per kJ than coal because it has a higher H:C ratio, but it still produces CO₂. It also requires a continued supply of non-renewable fossil fuel. (2) Afforestation is a genuine CO₂ sink, but trees grow slowly (decades to sequester significant carbon), require large land areas, and face risks from fire or disease. (3) CCS can capture most CO₂ before it reaches the atmosphere, but it is energy-intensive (reducing plant efficiency), very expensive to install and run, and the geological storage must remain stable for thousands of years, a long-term risk."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
