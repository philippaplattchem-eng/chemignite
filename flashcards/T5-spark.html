<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T5 Spark Flashcards</title><style>:root{--pr:#9333ea;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 8px 30px rgba(147,51,234,.20)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}

.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#4a1d96 0%,#6d28d9 45%,#9333ea 80%,#c084fc 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto}
.tier-legend{display:flex;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}

.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}

.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}

.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}
main{max-width:720px;margin:0 auto;padding:2rem 1rem 4rem}
.deck-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:.88rem;color:var(--txm)}
.counter{font-weight:700;font-size:1rem;color:var(--pr)}
.card-scene{perspective:1000px;width:100%;height:300px;cursor:pointer;margin-bottom:1.5rem}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s ease}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;border-radius:var(--r);padding:1.8rem 2rem;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card-front{background:var(--card);border:2px solid var(--bdr);box-shadow:var(--sh2)}
.card-back{background:#eef1ff;border:2px solid var(--pr);transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}
.card-hint{font-size:.73rem;color:var(--txm);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.06em}
.card-q{font-size:1.05rem;line-height:1.6;color:var(--tx)}
.card-ans{font-size:.97rem;font-weight:700;color:var(--pr);margin-bottom:.6rem}
.card-ex{font-size:.86rem;line-height:1.6;color:#374151}
.nav-row{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem}
.nav-btn{background:var(--card);border:2px solid var(--bdr);color:var(--tx);padding:.55rem 1.3rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.nav-btn:hover:not(:disabled){border-color:var(--pr);background:#eef1ff}
.nav-btn:disabled{opacity:.35;cursor:default}
.btn-shuffle{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn-shuffle:hover{background:var(--pr-dk);border-color:var(--pr-dk)}
.flip-hint{text-align:center;font-size:.8rem;color:var(--txm);margin-top:.5rem}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}.card-scene{height:260px}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.card-face{padding:1.2rem 1.3rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T5 Separate Chemistry 1</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
<div class="deck-meta"><span>20 cards | Spark (Recall)</span><span class="counter" id="counter">1 / 20</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question: tap to reveal answer</div><div class="card-q" id="card-q"></div></div>
  <div class="card-face card-back"><div class="card-hint">Answer</div><div class="card-ans" id="card-ans"></div><div class="card-ex" id="card-ex"></div></div>
</div></div>
<div class="nav-row">
  <button class="nav-btn" id="btn-prev">&larr; Prev</button>
  <button class="nav-btn btn-shuffle" id="btn-shuffle">&#x1F500; Shuffle</button>
  <button class="nav-btn" id="btn-next">Next &rarr;</button>
</div>
<div class="flip-hint">Tap card or press Space to flip &nbsp;&bull;&nbsp; &larr; &rarr; arrow keys to navigate</div>
</main>
<script>const QUESTIONS=[{"stem":"Which of the following is a typical property of transition metals?","A":"Low melting point and low density","B":"Form white compounds that give colourless solutions","C":"High melting point, high density, and form coloured compounds","D":"React vigorously with cold water to form hydrogen gas","correct":"C","explain":"Transition metals have four characteristic properties: (1) high melting points (e.g. iron melts at 1538 °C); (2) high density; (3) form coloured compounds (e.g. copper sulfate is blue, iron(III) compounds are orange-brown); (4) catalytic activity. These contrast sharply with Group 1 alkali metals, which have low melting points, low density, and form white compounds."},{"stem":"What two substances must be present for iron to rust?","A":"Oxygen and carbon dioxide","B":"Water and carbon dioxide","C":"Oxygen and water","D":"Acid and oxygen","correct":"C","explain":"Rusting (corrosion of iron) requires both oxygen AND water to be present simultaneously. If either is absent, iron will not rust. This is why iron does not rust in very dry air (no water) and does not rust in water that has been boiled to remove dissolved oxygen (no O₂). Salt water speeds up rusting by acting as an electrolyte but is not required."},{"stem":"What is the colour of a solution containing Fe³⁺ ions?","A":"Blue","B":"Pale green","C":"Colourless","D":"Orange-brown","correct":"D","explain":"Transition metal ions form coloured solutions. Fe³⁺ (iron(III)) ions give an orange-brown solution. Fe²⁺ (iron(II)) ions give a pale green solution. Cu²⁺ (copper(II)) ions give a blue solution. These colours are useful for identifying metal ions in solution. Group 1 and Group 2 ions give colourless solutions."},{"stem":"What is percentage yield?","A":"The mass of the desired product divided by the mass of the waste products × 100","B":"The actual yield divided by the theoretical yield × 100","C":"The theoretical yield divided by the actual yield × 100","D":"The mass of reactants divided by the mass of products × 100","correct":"B","explain":"% yield = (actual yield ÷ theoretical yield) × 100. The theoretical yield is the maximum mass of product that could be formed from the reactants, calculated from the balanced equation. The actual yield is what you actually collect. Percentage yield is always between 0 and 100%."},{"stem":"What is atom economy?","A":"The amount of energy released per mole of product formed","B":"The percentage of the total mass of reactants that ends up as the desired product","C":"The percentage of atoms recycled after a reaction","D":"The cost per atom of the reactants used in a reaction","correct":"B","explain":"% atom economy = (Mr of desired product ÷ sum of Mr of all products) × 100. It measures what fraction of the reactant atoms end up in the useful product, the rest become waste (byproducts). A high atom economy means less waste and a more sustainable, economical process."},{"stem":"What volume does one mole of any gas occupy at room temperature and pressure (RTP)?","A":"22.4 dm³","B":"24 dm³","C":"24 cm³","D":"1 dm³","correct":"B","explain":"At room temperature and pressure (approximately 20 °C and 1 atmosphere), one mole of any gas occupies 24 dm³ (= 24,000 cm³). This is the molar volume. It is the same for all gases regardless of their identity or Mr, because gas volume is determined by the number of particles, not their size or mass."},{"stem":"Why are alloys often stronger than pure metals?","A":"Alloys contain more electrons, making metallic bonds stronger","B":"Different-sized atoms in the alloy disrupt the regular layers, making it harder for layers to slide over each other","C":"Alloys have ionic bonds instead of metallic bonds, making them harder to break","D":"Alloys are denser than pure metals so they resist deformation more effectively","correct":"B","explain":"In a pure metal, all atoms are the same size and are arranged in regular layers that can slide easily over each other. Adding atoms of a different size (the alloying element) distorts the regular layers, making it much harder for them to slide, the metal becomes harder and stronger. This is why alloys like steel (iron + carbon) are stronger than pure iron."},{"stem":"Which metal is used for sacrificial protection of iron (galvanising)?","A":"Copper","B":"Silver","C":"Tin","D":"Zinc","correct":"D","explain":"Sacrificial protection uses a more reactive metal that corrodes in preference to iron. Zinc is more reactive than iron (higher in the reactivity series) so it corrodes first, protecting the iron beneath. Galvanising is the process of coating iron/steel with zinc. Even if the zinc coating is scratched, the zinc still sacrifices itself to protect the exposed iron."},{"stem":"A reaction produces 4.5 g of product but the theoretical yield was 9.0 g. What is the percentage yield?","A":"4.5%","B":"9.0%","C":"50%","D":"200%","correct":"C","explain":"% yield = (actual ÷ theoretical) × 100 = (4.5 ÷ 9.0) × 100 = 50%. A 50% yield means half the theoretically possible product was obtained. Yields of 100% are very rare in practice, some product is always lost to side reactions, practical losses or incomplete reaction."},{"stem":"Which transition metal acts as a catalyst in the Haber process?","A":"Copper","B":"Platinum","C":"Iron","D":"Nickel","correct":"C","explain":"Iron is the catalyst used in the Haber process (N₂ + 3H₂ ⇌ 2NH₃). It provides a surface for the reaction and lowers the activation energy without being consumed. Transition metals (and their compounds) are widely used as catalysts because their partially filled d-orbitals allow them to interact with reactant molecules and change oxidation state easily. Platinum, nickel and vanadium pentoxide are other important transition-metal catalysts."},{"stem":"Give one method of preventing iron from rusting by excluding water.","A":"Attaching a block of zinc to the iron","B":"Painting, oiling or coating with plastic","C":"Adding salt to the environment","D":"Electroplating with a less reactive metal","correct":"B","explain":"Excluding water from the iron surface prevents rusting. Methods include: painting, applying oil or grease, coating with plastic, or plating with tin (tinplate). Any physical barrier that keeps water away from the iron surface works. Painting is the most common method for structures like bridges and cars."},{"stem":"What is electroplating used for?","A":"Extracting metals from their ores by passing electricity through the molten ore","B":"Coating an object with a thin layer of a different metal by using electrolysis","C":"Strengthening a metal by adding a different element to form an alloy","D":"Testing the purity of a metal sample using electrical conductivity","correct":"B","explain":"Electroplating uses electrolysis to deposit a thin layer of one metal onto the surface of another object. The object to be plated is the cathode; the plating metal is the anode; and the electrolyte is a solution of the plating metal's salt. Uses include: decorative silver or gold plating, chromium plating for corrosion resistance, tin plating for food cans."},{"stem":"What is the colour of a copper(II) sulfate solution?","A":"Orange-brown","B":"Pale green","C":"Blue","D":"Purple","correct":"C","explain":"Cu²⁺ ions give a characteristic blue colour to solutions. Copper(II) sulfate solution is blue; copper(II) chloride solution is also blue-green. The blue colour is a key observation in experiments involving copper displacement reactions, when blue CuSO₄ solution reacts with zinc, the blue fades as Cu²⁺ ions are reduced to copper metal and colourless Zn²⁺ ions form."},{"stem":"A reaction has 100% atom economy. What does this tell you about the reaction?","A":"All of the reactants react completely, giving 100% yield","B":"Only one product is formed, all atoms in the reactants end up in the desired product","C":"The reaction requires no energy input","D":"The reactants are all recycled after the reaction","correct":"B","explain":"A reaction with 100% atom economy produces only one product, the desired product. All atoms from the reactants end up in the useful product, so there are no waste byproducts. Addition reactions (e.g. making polymers) often have 100% atom economy. Reactions that produce multiple products always have less than 100% atom economy."},{"stem":"What is the molar volume of a gas, and what value is used at RTP?","A":"The volume of one molecule of a gas, it varies depending on the size of the molecule","B":"The volume occupied by one mole of any gas at room temperature and pressure, 24 dm³ (24,000 cm³)","C":"The volume of one mole of gas compressed to maximum density","D":"The volume of one mole of gas at 0 °C and 1 atmosphere, 22.4 dm³","correct":"B","explain":"The molar volume is 24 dm³ (24,000 cm³) at room temperature and pressure. It is the same for all gases because at a given temperature and pressure, all gas particles have the same average kinetic energy and spread out to fill the same volume per mole, regardless of their mass or size. The value 24 dm³ is provided in Edexcel exams."},{"stem":"Give three reasons why the actual yield of a reaction is usually less than the theoretical yield.","A":"Incorrect balancing of the equation; impure reactants; using too much solvent","B":"Incomplete reactions; practical losses during transfer/filtration; competing side reactions producing unwanted products","C":"Incorrect molecular formula; too high a temperature; poor quality equipment","D":"Insufficient reactant; wrong catalyst; incorrect pH","correct":"B","explain":"Three causes of yield less than 100%: (1) Incomplete reactions, the reaction does not go all the way to completion, especially for reversible reactions; (2) Practical losses, product lost when transferring between containers, during filtration, or when crystallising; (3) Side reactions, some reactants form unwanted products instead of the desired one. All three reduce the amount of desired product collected."},{"stem":"What is stainless steel, and what makes it resistant to corrosion?","A":"Steel coated with a layer of zinc; the zinc prevents oxygen reaching the iron","B":"An alloy of iron with chromium (and sometimes nickel); chromium forms a tough, invisible oxide layer on the surface that prevents further corrosion","C":"Pure iron treated with an electric current to harden its surface","D":"Steel coated with tin; tin is less reactive than iron so it prevents rusting","correct":"B","explain":"Stainless steel contains iron alloyed with ~18% chromium (and sometimes ~8% nickel). Chromium reacts with oxygen in the air to form a very thin, hard, invisible layer of chromium(III) oxide (Cr₂O₃) on the surface. This layer is self-repairing, if scratched, it reforms. This prevents oxygen and water reaching the iron below, giving excellent corrosion resistance. Used in cutlery, medical instruments, and kitchen equipment."},{"stem":"Calculate the volume of gas produced at RTP when 1.5 mol of CO₂ is released. (Molar volume = 24 dm³/mol)","A":"16 dm³","B":"36 dm³","C":"24 dm³","D":"12 dm³","correct":"B","explain":"Volume = moles × molar volume = 1.5 × 24 = 36 dm³. The molar volume (24 dm³/mol at RTP) applies to all gases. This calculation can be applied to any gas produced in a reaction, just find the moles from the balanced equation first, then multiply by 24."},{"stem":"In a titration, 25.0 cm³ of NaOH is exactly neutralised by 20.0 cm³ of 0.1 mol/dm³ HCl. Calculate the concentration of the NaOH solution.","A":"0.125 mol/dm³","B":"0.08 mol/dm³","C":"0.1 mol/dm³","D":"0.5 mol/dm³","correct":"B","explain":"Moles of HCl = 0.1 × (20.0/1000) = 0.002 mol. HCl + NaOH → NaCl + H₂O (1:1 ratio). Moles of NaOH = 0.002 mol. Concentration of NaOH = 0.002 ÷ (25.0/1000) = 0.002 ÷ 0.025 = 0.08 mol/dm³."},{"stem":"What are the products of a hydrogen fuel cell?","A":"Carbon dioxide and water","B":"Water only","C":"Hydrogen and oxygen","D":"Carbon monoxide and water vapour","correct":"B","explain":"In a hydrogen fuel cell, hydrogen and oxygen react electrochemically to produce electricity, with water as the only product: H₂ + ½O₂ → H₂O. No carbon dioxide is emitted during operation (unlike combustion engines). Fuel cells are more efficient than combustion and produce no local pollutants, making them attractive for vehicles and power generation."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
