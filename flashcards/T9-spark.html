<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T9 Spark Flashcards</title><style>:root{--pr:#3f51b5;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--r:14px;--sh:0 2px 10px rgba(63,81,181,.10);--sh2:0 8px 30px rgba(63,81,181,.20)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#0d1b3e 0%,#1a2f6e 45%,#3f51b5 80%,#5c6bc0 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto}
.tier-legend{display:flex;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}
main{max-width:720px;margin:0 auto;padding:2rem 1rem 4rem}
.deck-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:.88rem;color:var(--txm)}
.counter{font-weight:700;font-size:1rem;color:var(--pr)}
.card-scene{perspective:1000px;width:100%;height:300px;cursor:pointer;margin-bottom:1.5rem}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s ease}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;border-radius:var(--r);padding:1.8rem 2rem;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card-front{background:var(--card);border:2px solid var(--bdr);box-shadow:var(--sh2)}
.card-back{background:#eef1ff;border:2px solid var(--pr);transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}
.card-hint{font-size:.73rem;color:var(--txm);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.06em}
.card-q{font-size:1.05rem;line-height:1.6;color:var(--tx)}
.card-ans{font-size:.97rem;font-weight:700;color:var(--pr);margin-bottom:.6rem}
.card-ex{font-size:.86rem;line-height:1.6;color:#374151}
.nav-row{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem}
.nav-btn{background:var(--card);border:2px solid var(--bdr);color:var(--tx);padding:.55rem 1.3rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.nav-btn:hover:not(:disabled){border-color:var(--pr);background:#eef1ff}
.nav-btn:disabled{opacity:.35;cursor:default}
.btn-shuffle{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn-shuffle:hover{background:var(--pr-dk);border-color:var(--pr-dk)}
.flip-hint{text-align:center;font-size:.8rem;color:var(--txm);margin-top:.5rem}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}.card-scene{height:260px}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.card-face{padding:1.2rem 1.3rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(92,107,192,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T9 &mdash; Separate Chemistry 2</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
<div class="deck-meta"><span>20 cards &mdash; Spark (Recall)</span><span class="counter" id="counter">1 / 20</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question &mdash; tap to reveal answer</div><div class="card-q" id="card-q"></div></div>
  <div class="card-face card-back"><div class="card-hint">Answer</div><div class="card-ans" id="card-ans"></div><div class="card-ex" id="card-ex"></div></div>
</div></div>
<div class="nav-row">
  <button class="nav-btn" id="btn-prev">&larr; Prev</button>
  <button class="nav-btn btn-shuffle" id="btn-shuffle">&#x1F500; Shuffle</button>
  <button class="nav-btn" id="btn-next">Next &rarr;</button>
</div>
<div class="flip-hint">Tap card or press Space to flip &nbsp;&bull;&nbsp; &larr; &rarr; arrow keys to navigate</div>
</main>
<script>const QUESTIONS=[{"stem":"Which flame colour is produced by sodium ions (Na⁺)?","A":"Red","B":"Lilac","C":"Yellow","D":"Blue-green","correct":"C","explain":"Sodium ions produce an intense yellow (sometimes described as orange-yellow) flame. This is one of five flame colours on the Edexcel spec: Li⁺ = red, Na⁺ = yellow, K⁺ = lilac, Ca²⁺ = orange-red, Cu²⁺ = blue-green."},{"stem":"What flame colour does potassium (K⁺) produce?","A":"Orange-red","B":"Red","C":"Yellow","D":"Lilac","correct":"D","explain":"Potassium ions give a lilac (or pale purple) flame. A common error is writing \"purple\", the spec word is \"lilac\". Note also that sodium contamination can mask the lilac colour, which is why a cobalt blue glass filter is sometimes used in the lab."},{"stem":"What colour precipitate forms when copper(II) ions are added to sodium hydroxide solution?","A":"White","B":"Green","C":"Orange-brown","D":"Blue","correct":"D","explain":"Cu²⁺ ions react with OH⁻ from sodium hydroxide to form copper(II) hydroxide, Cu(OH)₂, which is an insoluble blue precipitate. This is a distinctive colour that helps identify Cu²⁺ among the six cations tested with NaOH."},{"stem":"What colour precipitate forms when iron(III) ions (Fe³⁺) react with sodium hydroxide solution?","A":"Blue","B":"Green","C":"Orange-brown","D":"White","correct":"C","explain":"Iron(III) ions form iron(III) hydroxide, Fe(OH)₃, which is an orange-brown (rust-coloured or red-brown) precipitate. This is distinct from iron(II) ions (Fe²⁺), which give a green precipitate (iron(II) hydroxide)."},{"stem":"What is the result of the test for carbonate ions (CO₃²⁻)?","A":"A white precipitate forms immediately","B":"A yellow flame is produced","C":"Effervescence; the gas turns limewater milky","D":"Damp red litmus paper turns blue","correct":"C","explain":"Adding dilute hydrochloric acid to a carbonate produces CO₂ gas with effervescence. Bubbling this gas through limewater (calcium hydroxide solution) turns it milky/cloudy due to the formation of calcium carbonate: CO₂ + Ca(OH)₂ → CaCO₃ + H₂O."},{"stem":"Which reagents are used to test for sulfate ions (SO₄²⁻)?","A":"Dilute nitric acid, then silver nitrate solution","B":"Dilute hydrochloric acid, then barium chloride solution","C":"Dilute sulfuric acid, then sodium hydroxide solution","D":"Universal indicator solution","correct":"B","explain":"To test for sulfate: acidify with dilute hydrochloric acid first (to remove interfering ions such as carbonate), then add barium chloride solution. A white precipitate of barium sulfate (BaSO₄) confirms sulfate ions are present: Ba²⁺ + SO₄²⁻ → BaSO₄."},{"stem":"What is the general formula of the alkenes?","A":"CₙH₂ₙ₊₂","B":"CₙH₂ₙ₋₂","C":"CₙH₂ₙ","D":"CₙH₂ₙ₊₁OH","correct":"C","explain":"Alkenes have the general formula CₙH₂ₙ. They contain one C=C double bond, which means they have two fewer hydrogen atoms than the equivalent alkane (CₙH₂ₙ₊₂). Ethene is C₂H₄ (n=2: 2×2=4 ✓); propene is C₃H₆ (2×3=6 ✓)."},{"stem":"What happens to bromine water when it is shaken with an alkene?","A":"It stays orange/brown","B":"It turns colourless","C":"It turns blue","D":"It produces a white precipitate","correct":"B","explain":"Alkenes react with bromine water in an addition reaction. The C=C double bond opens up and Br₂ adds across it, forming a dibromoalkane. The orange/brown colour of the bromine water is removed, it becomes colourless. Alkanes do not react with bromine water (no C=C), so they leave it unchanged."},{"stem":"What is the functional group in alcohols?","A":"–COOH","B":"–C=C–","C":"–NH₂","D":"–OH","correct":"D","explain":"The functional group in alcohols is the hydroxyl group, –OH. It is this group that gives alcohols their characteristic properties, including their ability to dissolve in water and to undergo oxidation to form carboxylic acids. The general formula of an alcohol is CₙH₂ₙ₊₁OH."},{"stem":"What is the functional group in carboxylic acids?","A":"–OH","B":"–COO–","C":"–COOH","D":"–C=O","correct":"C","explain":"The carboxyl group, –COOH, is the functional group in carboxylic acids. It consists of a C=O (carbonyl) and a C–OH (hydroxyl) bonded to the same carbon. This group makes carboxylic acids weakly acidic in solution. Ethanoic acid (CH₃COOH) is the most familiar example, it gives vinegar its taste."},{"stem":"What is the molecular formula of ethanol?","A":"CH₄O","B":"C₂H₆O","C":"C₂H₄O","D":"C₃H₈O","correct":"B","explain":"Ethanol has the formula C₂H₅OH = C₂H₆O. It is the second member of the alcohol homologous series. Its structural formula CH₃CH₂OH shows the –CH₂– group separating the methyl group from the –OH functional group."},{"stem":"What are the products of fermentation of glucose?","A":"Glucose + water","B":"Ethanol + carbon dioxide","C":"Ethanol + oxygen","D":"Carbon dioxide + water","correct":"B","explain":"Fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. Yeast provides the enzymes that catalyse this anaerobic process. The CO₂ produced makes bread dough rise and beer/wine fizzy. The ethanol is the alcohol product."},{"stem":"What is the size range of nanoparticles?","A":"1 mm to 100 mm","B":"1 µm to 100 µm","C":"1 nm to 100 nm","D":"1 pm to 100 pm","correct":"C","explain":"Nanoparticles are defined as having at least one dimension between 1 and 100 nanometres (1 nm = 1 × 10⁻⁹ m to 100 nm = 1 × 10⁻⁷ m). This places them between the size of small molecules (around 0.3–1 nm) and fine particles visible under optical microscopes (above 100 nm)."},{"stem":"Why do nanoparticles have different properties from the same substance in bulk?","A":"They have a different chemical formula at the nanoscale","B":"They have a much larger surface area to volume ratio","C":"They contain different isotopes of the elements","D":"They are made from purer starting materials","correct":"B","explain":"The key difference is the surface area to volume ratio (SA:V). As a particle gets smaller, the proportion of atoms on the surface increases enormously. Surface atoms are the ones that participate in reactions and interactions, so a higher SA:V means the substance is more reactive, a better catalyst, and may interact with biological systems differently."},{"stem":"What is ethanoic acid used for in everyday life?","A":"Fuel for cars","B":"As vinegar","C":"As a building polymer","D":"As a food colouring","correct":"B","explain":"Ethanoic acid (CH₃COOH) is the main acid in vinegar. It is a weak acid and gives vinegar its sour taste. It is the second member of the carboxylic acid homologous series. It can be made by oxidation of ethanol (as in wine turning to vinegar) or by fermentation followed by further oxidation."},{"stem":"What is addition polymerisation?","A":"Breaking a polymer into smaller monomers","B":"Joining monomers through ester links, releasing water","C":"Joining many alkene monomers together to form a polymer with no other products","D":"Adding hydrogen to an alkene to form an alkane","correct":"C","explain":"In addition polymerisation, many alkene monomers (each containing a C=C double bond) join together. The C=C bonds open up and the monomers link end-to-end to form a long polymer chain. No other product is formed, all atoms from the monomers end up in the polymer. Poly(ethene) from ethene monomers is the key example."},{"stem":"Which flame colour corresponds to calcium ions (Ca²⁺)?","A":"Red","B":"Yellow","C":"Orange-red","D":"Blue-green","correct":"C","explain":"Calcium ions give an orange-red flame. This can be confused with lithium (red) in the lab, the key difference is the word \"orange\" added to red for calcium. If in doubt, a follow-up NaOH test can confirm: Ca²⁺ gives a white precipitate that stays white in excess; Li⁺ does not give a precipitate."},{"stem":"What does a flame photometer measure that a simple flame test cannot?","A":"The colour of the flame","B":"The concentration of ions in solution","C":"The charge on the metal ion","D":"The melting point of the metal compound","correct":"B","explain":"A simple flame test is qualitative, it tells you which ion is present by colour, but not how much. A flame photometer measures the intensity of light emitted at specific wavelengths. This intensity is proportional to the ion concentration, so reading off a calibration curve gives the concentration quantitatively. It can also distinguish ions in mixtures that would mask each other in a simple flame test."},{"stem":"What is a monomer?","A":"A very large molecule made from repeating units","B":"A small molecule that can join with many others to form a polymer","C":"A molecule that has been cracked from crude oil","D":"The smallest possible unit of an element","correct":"B","explain":"A monomer is a small molecule (often containing a functional group such as C=C or –COOH) that can react with many other monomer molecules to form a polymer. Ethene (C₂H₄) is the monomer for poly(ethene); propene (C₃H₆) is the monomer for poly(propene)."},{"stem":"What colour precipitate forms when aluminium ions (Al³⁺) react with sodium hydroxide solution?","A":"Blue","B":"Green","C":"White","D":"Orange-brown","correct":"C","explain":"Aluminium ions form aluminium hydroxide, Al(OH)₃, which is a white precipitate. The same white precipitate forms with calcium ions. To distinguish them, add excess NaOH: the Al³⁺ precipitate dissolves (aluminium hydroxide is amphoteric, it reacts with alkali); the Ca²⁺ precipitate remains insoluble."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
