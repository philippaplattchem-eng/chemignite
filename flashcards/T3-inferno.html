<script>const QUESTIONS=[{"stem":"A solution of hydrochloric acid has pH 1. A student dilutes it by adding 9 times its own volume of water (making it 10 times more dilute). Predict the new pH and explain your reasoning using the factor-of-10 rule.","A":"pH 0, diluting makes it more acidic","B":"pH 2, diluting by a factor of 10 reduces [H⁺] by a factor of 10, raising pH by 1","C":"pH 10, diluting reverses the pH","D":"pH 1, dilution does not change the pH of a strong acid","correct":"B","explain":"pH is logarithmic: a tenfold decrease in [H⁺] raises pH by 1 unit. Starting at pH 1, diluting 10-fold halves the concentration of HCl (and H⁺, since HCl is a strong acid) by a factor of 10 → pH increases by 1 → new pH = 2. Note: further dilution continues to raise pH, but it can never exceed 7 simply by diluting an acid with water."},{"stem":"Explain fully why H⁺(aq) and OH⁻(aq) react to form water, and why this reaction is the heart of every neutralisation, regardless of which acid and alkali are used.","A":"H⁺ and OH⁻ are opposite charges so they always attract and combine into a new molecule, H₂O, any spectator ions present (Na⁺, Cl⁻, K⁺, SO₄²⁻ etc.) are uninvolved, so the ionic equation H⁺ + OH⁻ → H₂O is universal","B":"H⁺ and OH⁻ combine to form H₂O only when heated, at room temperature they stay as ions","C":"H⁺ and OH⁻ form H₂O only in the presence of a catalyst; the metal ion acts as the catalyst","D":"Neutralisation involves the metal ion replacing H⁺ to form the salt; OH⁻ does not react directly","correct":"A","explain":"When any acid dissolves, it releases H⁺(aq). When any alkali dissolves, it releases OH⁻(aq). These two ions combine: H⁺ + OH⁻ → H₂O. The metal ion (e.g. Na⁺, K⁺, Ca²⁺) and the acid anion (e.g. Cl⁻, SO₄²⁻, NO₃⁻) are spectators, they stay in solution unchanged, forming the dissolved salt. Because only H⁺ and OH⁻ participate, the ionic equation is identical for every acid-alkali neutralisation."},{"stem":"Brine (sodium chloride solution) is electrolysed industrially in the chlor-alkali process. Three products are obtained. Name them, state where each is formed, and give one industrial use for each.","A":"Hydrogen (cathode), chlorine (anode), sodium hydroxide (remains in solution), uses: hydrogen for fuel cells, chlorine for bleach/PVC, NaOH for soap/paper making","B":"Sodium (cathode), chlorine (anode), water (remains), uses: sodium for batteries, chlorine for bleach, water for drinking","C":"Hydrogen (anode), oxygen (cathode), salt (remains), uses: hydrogen for fuel, oxygen for hospitals, salt as a preservative","D":"Hydrogen (cathode), oxygen (anode), hydrochloric acid (remains), uses: hydrogen for Haber process, oxygen for steel making, HCl for cleaning","correct":"A","explain":"Cathode: 2H⁺ + 2e⁻ → H₂(g), hydrogen used in the Haber process and fuel cells. Anode: 2Cl⁻ → Cl₂(g) + 2e⁻, chlorine used to make bleach (NaClO), PVC and disinfectants. Remaining solution: NaOH, used in soap manufacture, paper making and cleaning products. The chlor-alkali process is one of the most important industrial electrolysis processes."},{"stem":"A student prepares copper sulfate crystals from copper carbonate and dilute sulfuric acid. Describe the full procedure, explaining each step, then explain why this method cannot be used to prepare sodium sulfate from sodium carbonate.","A":"Add excess CuCO₃ to H₂SO₄; filter; evaporate; cool to crystallise, cannot use for Na₂SO₄ because sodium carbonate takes longer to dissolve in acid than copper carbonate","B":"Add excess CuCO₃ to H₂SO₄; filter; evaporate; cool to crystallise, cannot use for Na₂SO₄ because sodium carbonate is soluble in water; the excess cannot be filtered off; a titration is needed instead","C":"Both methods are identical, sodium sulfate can be prepared the same way","D":"CuCO₃ method requires heating; Na₂CO₃ method does not, so they use different equipment only","correct":"B","explain":"Procedure: add excess CuCO₃ (insoluble base) to H₂SO₄, fizzing stops when acid is used up; filter off excess CuCO₃; evaporate solution to concentrate; cool to crystallise blue CuSO₄·5H₂O. For sodium sulfate: Na₂CO₃ is soluble in water, you cannot filter off the excess, so you cannot use excess base method. Instead, a titration is needed (exact volumes of Na₂CO₃ and H₂SO₄ measured to achieve the equivalence point), then the solution is evaporated to crystallise Na₂SO₄."},{"stem":"During electrolysis of aqueous copper sulfate with inert electrodes, both H⁺ and Cu²⁺ ions are present at the cathode. Explain why Cu²⁺ is preferentially discharged rather than H⁺.","A":"Cu²⁺ has a higher charge than H⁺, so it is attracted more strongly to the cathode","B":"Cu²⁺ is lower in the reactivity series than H, meaning it is more easily reduced (requires less energy to gain electrons), it is therefore preferentially discharged over H⁺","C":"Cu²⁺ ions are larger than H⁺ ions, so they arrive at the cathode first","D":"H⁺ ions are discharged at the anode, so they cannot compete with Cu²⁺ at the cathode","correct":"B","explain":"The ion preferentially discharged at the cathode is the one that is most easily reduced, i.e. the one with the lower reduction energy requirement. Cu²⁺ is below hydrogen in the electrochemical series (lower reactivity, easier to reduce). H⁺ requires more energy to discharge than Cu²⁺, so copper is preferentially deposited. This principle applies to all aqueous electrolysis: metals less reactive than hydrogen are deposited; metals more reactive than hydrogen leave H₂ forming at the cathode."},{"stem":"A solution has [H⁺] = 0.001 mol/dm³. What is the pH of this solution, and is it acidic, neutral or alkaline?","A":"pH 3; acidic","B":"pH 1; acidic","C":"pH 11; alkaline","D":"pH 0.001; acidic","correct":"A","explain":"[H⁺] = 0.001 mol/dm³ = 10⁻³ mol/dm³. Since pH = −log[H⁺], pH = −log(10⁻³) = 3. At GCSE you can reason: 1 mol/dm³ HCl = pH 0 (fully ionised strong acid); 0.1 mol/dm³ = pH 1; 0.01 mol/dm³ = pH 2; 0.001 mol/dm³ = pH 3. pH 3 is below 7 → acidic. This factor-of-10 reasoning is the GCSE method for linking [H⁺] to pH."},{"stem":"Explain how the chlor-alkali electrolysis of brine produces sodium hydroxide, even though no sodium metal is formed at the cathode and NaOH is not one of the starting materials.","A":"NaOH forms when sodium ions react with oxide ions at the anode","B":"At the cathode, H⁺ ions from water are discharged, leaving OH⁻ ions in solution; these combine with Na⁺ ions (spectators from the original NaCl) to form NaOH in solution","C":"Chlorine reacts with water in the cell to produce HCl and NaOH simultaneously","D":"NaOH forms when excess sodium chloride reacts with the water in the electrolyte","correct":"B","explain":"The cathode reaction: 2H⁺ + 2e⁻ → H₂(g). Each H⁺ ion removed from solution leaves behind an OH⁻ ion (from the water equilibrium: H₂O ⇌ H⁺ + OH⁻). The Na⁺ ions from the original NaCl are spectators, they stay in solution. As [OH⁻] builds up alongside [Na⁺], the solution around the cathode becomes sodium hydroxide. If the cell compartments are separated, pure NaOH solution is collected from the cathode side."},{"stem":"A student wants to find the exact volume of HCl needed to neutralise 25.0 cm³ of NaOH. Describe the titration procedure, including: indicator choice, end point observation, and why a rough titration is done first.","A":"Use litmus; end point is when the solution turns red; rough titration is done to conserve chemicals","B":"Use phenolphthalein; end point is when colour changes from pink to colourless; rough titration identifies the approximate end point volume so the final titration can be done more slowly near the end point to get a precise reading","C":"Use universal indicator; end point is when the solution turns green; rough titration checks the acid is not expired","D":"Use methyl orange; end point is when the solution turns blue; rough titration removes air bubbles from the burette","correct":"B","explain":"Procedure: fill burette with HCl; pipette 25.0 cm³ NaOH into conical flask; add a few drops of phenolphthalein (pink in alkali); run in HCl until the solution just turns colourless (end point). Do a rough titration first to find the approximate volume; then repeat with slow dropwise addition near the end point to find the precise titre. Take at least two concordant results (within 0.10 cm³) and average them. Universal indicator is unsuitable for titrations because it cannot give a sharp colour change."},{"stem":"Evaluate the following student claim: \"You can identify a strong acid by its pH alone, if the pH is below 3, the acid must be strong.\"","A":"Correct, all strong acids have pH below 3","B":"Incorrect, pH depends on both concentration and strength; a dilute strong acid can have pH above 3, and a concentrated weak acid could have pH below 3","C":"Correct, weak acids cannot reach pH below 3 at any concentration","D":"Incorrect, all acids have pH below 7, but pH below 3 means the acid is very concentrated, not strong","correct":"B","explain":"Strength (degree of ionisation) and concentration are independent. A concentrated weak acid (e.g. 10 mol/dm³ ethanoic acid) could have a pH below 3. A very dilute strong acid (e.g. 10⁻⁵ mol/dm³ HCl) would have pH 5, above 3. pH alone tells you the [H⁺] in that particular solution; it does not directly tell you the degree of ionisation. To determine strength, you need to compare pH values of equal-concentration solutions."},{"stem":"Write the ionic half-equations for the electrolysis of dilute sulfuric acid. State which process is oxidation and which is reduction, and explain which electrode each occurs at.","A":"Cathode: 2H⁺ + 2e⁻ → H₂ (reduction); Anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻ (oxidation)","B":"Cathode: 4OH⁻ → 2H₂O + O₂ + 4e⁻ (oxidation); Anode: 2H⁺ + 2e⁻ → H₂ (reduction)","C":"Cathode: 2H⁺ − 2e⁻ → H₂ (oxidation); Anode: O²⁻ → O + 2e⁻ (reduction)","D":"Cathode: SO₄²⁻ + 2e⁻ → SO₃²⁻ (reduction); Anode: 2H⁺ → H₂ + 2e⁻ (oxidation)","correct":"A","explain":"Cathode (negative): H⁺ ions gain electrons, 2H⁺(aq) + 2e⁻ → H₂(g). Gaining electrons = reduction. Anode (positive): OH⁻ ions from water lose electrons, 4OH⁻(aq) → 2H₂O(l) + O₂(g) + 4e⁻. Losing electrons = oxidation. OIL RIG: Oxidation Is Loss, Reduction Is Gain. Sulfate ions (SO₄²⁻) are not discharged. The ratio of H₂ : O₂ is 2 : 1 by volume, matching the formula of water."},{"stem":"A student dissolves calcium carbonate in excess hydrochloric acid, then realises they need to remove all the hydrochloric acid from the product calcium chloride solution before evaporating to crystallise. Suggest a method and explain why it works.","A":"Add more calcium carbonate until fizzing stops, the carbonate neutralises the remaining acid without introducing a new ion (the CO₂ escapes as a gas and excess solid can be filtered off)","B":"Add sodium hydroxide to neutralise the acid, it introduces Na⁺ ions which are easy to remove by evaporation","C":"Boil the solution, HCl will evaporate before CaCl₂","D":"Filter the solution, the acid particles are too large to pass through the filter paper","correct":"A","explain":"Adding excess calcium carbonate until fizzing (CO₂) stops ensures all HCl is neutralised: CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂. The excess CaCO₃ is insoluble and is removed by filtration. No new ions are introduced (Ca²⁺ is already in the product salt). The remaining CaCl₂ solution can be evaporated and crystallised to give pure solid product."},{"stem":"Compare the pH changes that occur when: (a) a strong acid is neutralised by a strong base, and (b) a weak acid is neutralised by a strong base. How do the pH curves differ, and what does this tell us about the strength of the acids?","A":"Both curves are identical, strength of the acid makes no difference to the neutralisation curve","B":"Strong acid + strong base: pH starts very low (pH 1–2) and rises steeply to pH 7 at the equivalence point; Weak acid + strong base: pH starts higher (pH 3–5) and reaches equivalence point above pH 7 due to hydrolysis of the salt formed","C":"Weak acid + strong base gives a lower starting pH because weak acids release more H⁺","D":"Strong acid + strong base equivalence point is always at pH 14; weak acid + strong base is at pH 7","correct":"B","explain":"Strong acid (e.g. HCl): low starting pH (fully ionised → high [H⁺]); steep curve to pH 7 at the equivalence point. Weak acid (e.g. ethanoic acid): higher starting pH (partially ionised → lower [H⁺]); the equivalence point is above pH 7 because the salt formed (sodium ethanoate) undergoes hydrolysis, the ethanoate ion accepts H⁺ from water, producing a slightly alkaline solution. This difference in starting pH and equivalence point pH reveals the difference in strength between the two acids."},{"stem":"During electrolysis, the anode in a cell using copper electrodes loses mass while the anode in a cell using platinum electrodes does not. Explain this difference in terms of electrode reactivity.","A":"Copper is less reactive than platinum so it is more easily oxidised at the anode; platinum is unreactive and does not participate in the electrode reactions","B":"Platinum is more reactive than copper so it dissolves faster; copper stays intact","C":"Both electrodes lose mass, platinum loses mass too slowly to measure with simple equipment","D":"The difference is caused by the type of electrolyte, not by the electrode material","correct":"A","explain":"Copper is an active electrode, it is reactive enough to be oxidised at the anode: Cu(s) → Cu²⁺(aq) + 2e⁻. The copper anode dissolves. Platinum is an inert electrode, it does not react under normal electrolysis conditions; only the ions in solution are oxidised at its surface (e.g. Cl⁻ → Cl₂ or OH⁻ → O₂). The choice of electrode determines whether the electrode itself participates in the reaction."},{"stem":"Predict the products at each electrode when aqueous magnesium sulfate (MgSO₄) is electrolysed with inert electrodes. Justify each prediction using reactivity series reasoning.","A":"Cathode: magnesium; Anode: sulfur dioxide","B":"Cathode: hydrogen; Anode: oxygen","C":"Cathode: magnesium; Anode: oxygen","D":"Cathode: hydrogen; Anode: sulfur","correct":"B","explain":"Cathode: Mg²⁺ or H⁺ (from water). Magnesium is high in the reactivity series, Mg²⁺ is very difficult to reduce. H⁺ ions (from water) are discharged instead: 2H⁺ + 2e⁻ → H₂(g). Anode: SO₄²⁻ or OH⁻ (from water). Sulfate ions are not discharged under normal conditions. OH⁻ ions are discharged: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Products: hydrogen gas at cathode, oxygen gas at anode. The MgSO₄ effectively remains in solution as its ions are not discharged."},{"stem":"A student measures the pH of 0.1 mol/dm³ solutions of four acids: HCl (pH 1), H₂SO₄ (pH 0.7), ethanoic acid CH₃COOH (pH 2.9) and carbonic acid H₂CO₃ (pH 3.7). Place these acids in order of strength (strongest first) and explain the reasoning.","A":"HCl > H₂SO₄ > CH₃COOH > H₂CO₃","B":"H₂SO₄ > HCl > CH₃COOH > H₂CO₃","C":"CH₃COOH > H₂CO₃ > HCl > H₂SO₄","D":"All four are equally strong, differences are due to concentration only","correct":"B","explain":"All four solutions have the same concentration (0.1 mol/dm³), so differences in pH reflect differences in degree of ionisation (strength), not concentration. Lower pH = higher [H⁺] = more ionisation = stronger acid. Ranking by pH (lowest = strongest): H₂SO₄ (pH 0.7) > HCl (pH 1) > CH₃COOH (pH 2.9) > H₂CO₃ (pH 3.7). H₂SO₄ gives a lower pH than HCl because each H₂SO₄ molecule releases two H⁺ ions on full ionisation."},{"stem":"Calculate the volume of 2 mol/dm³ HCl needed to completely neutralise 50 cm³ of 1 mol/dm³ NaOH. Show your working.","A":"100 cm³","B":"50 cm³","C":"25 cm³","D":"10 cm³","correct":"C","explain":"Moles of NaOH = concentration × volume = 1 × 0.050 = 0.05 mol. Equation: HCl + NaOH → NaCl + H₂O (1:1 ratio). Moles of HCl needed = 0.05 mol. Volume of HCl = moles ÷ concentration = 0.05 ÷ 2 = 0.025 dm³ = 25 cm³. Always convert cm³ to dm³ (÷1000) before using concentration calculations."},{"stem":"Explain why the electrolysis of molten sodium chloride gives sodium metal at the cathode, but the electrolysis of aqueous sodium chloride gives hydrogen gas at the cathode instead.","A":"In molten NaCl, there are no water molecules, Na⁺ is the only cation and must be discharged; in aqueous NaCl, H⁺ from water is also present and is preferentially discharged because H is less reactive than Na","B":"In molten NaCl, the temperature is too high for hydrogen to form; in aqueous solution, the temperature is lower so hydrogen forms instead","C":"In molten NaCl, the electrode is copper which reduces sodium; in aqueous NaCl, the electrode is graphite which reduces hydrogen","D":"Aqueous NaCl contains fewer Na⁺ ions than molten NaCl, so sodium cannot be deposited","correct":"A","explain":"In molten NaCl: only Na⁺ and Cl⁻ ions are present, Na⁺ must be reduced at the cathode: Na⁺ + e⁻ → Na(l). In aqueous NaCl: both Na⁺ and H⁺ (from water) are present. Na is extremely reactive (very hard to reduce); H is much less reactive. H⁺ ions are preferentially discharged: 2H⁺ + 2e⁻ → H₂(g). The presence of water provides an alternative cation (H⁺) that is easier to reduce than Na⁺."},{"stem":"A student titrates 25.0 cm³ of sodium hydroxide with 0.2 mol/dm³ hydrochloric acid. The average titre is 18.5 cm³. Calculate the concentration of the sodium hydroxide solution.","A":"0.148 mol/dm³","B":"0.200 mol/dm³","C":"0.270 mol/dm³","D":"0.135 mol/dm³","correct":"A","explain":"Moles of HCl = 0.2 × (18.5 ÷ 1000) = 0.2 × 0.0185 = 0.0037 mol. Equation: HCl + NaOH → NaCl + H₂O (1:1 ratio). Moles of NaOH = 0.0037 mol. Concentration of NaOH = moles ÷ volume = 0.0037 ÷ 0.025 = 0.148 mol/dm³."},{"stem":"Explain the industrial importance of the three products of the chlor-alkali process, and describe one environmental concern associated with chlorine production.","A":"Hydrogen → used in the Haber process and fuel cells; Chlorine → used in making bleach, PVC, and disinfectants; NaOH → used in soap and paper making; environmental concern: chlorine is toxic, accidental release poses health risks","B":"Hydrogen → used in water treatment; Chlorine → used in fertilisers; NaOH → used in petrol refining; environmental concern: NaOH causes water pollution","C":"Hydrogen → used in making explosives; Chlorine → used as a cleaning agent only; NaOH → used in fertiliser production; environmental concern: electrolysis uses too much electricity","D":"All three products are used only in the chemical industry for making polymers","correct":"A","explain":"Hydrogen: used in the Haber process (making ammonia/fertilisers), fuel cells (produces water only as a by-product), and hydrogenation of oils. Chlorine: used to make bleach (NaClO for household and water disinfection), PVC (a widely used polymer), and pharmaceuticals. Sodium hydroxide: used in soap making (saponification of fats), paper making (breaking down wood pulp), and as a laboratory alkali. Environmental concern: chlorine gas is highly toxic, a leakage from a chlorine production plant or transport accident causes serious health hazards. Historically, chlorine was also used as a chemical weapon."},{"stem":"A student claims that every acid-base reaction produces a salt and water. Is this always true? Give an example to support or challenge this claim.","A":"True, all acid-base reactions produce salt + water without exception","B":"Partially true, acid + metal hydroxide always gives salt + water; but acid + metal carbonate gives salt + water + CO₂; and acid + metal gives salt + hydrogen (no water), so \"salt + water\" is not universal","C":"False, no acid-base reaction produces water; water only forms in combustion reactions","D":"True, water is always produced in any reaction involving H⁺ ions","correct":"B","explain":"Acid + metal hydroxide (base) → salt + water ✓ (e.g. HCl + NaOH → NaCl + H₂O). Acid + metal oxide (base) → salt + water ✓ (e.g. H₂SO₄ + CuO → CuSO₄ + H₂O). Acid + metal carbonate → salt + water + CO₂ (not just salt + water). Acid + metal → salt + hydrogen (no water at all; metal is not a base). So salt + water describes only two of the four acid reactions, the claim is too broad. Metal carbonates and metals give different products."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
