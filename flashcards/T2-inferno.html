<script>const QUESTIONS=[{"stem":"A chromatogram has a solvent front at 12.0 cm. Substance P has its spot centre at 7.2 cm and substance Q has its spot centre at 3.6 cm. Calculate the Rf values of both substances and explain which is more strongly attracted to the stationary phase.","A":"P = 0.6, Q = 0.3; P is more attracted to the stationary phase","B":"P = 0.6, Q = 0.3; Q is more attracted to the stationary phase","C":"P = 1.67, Q = 3.33; Q is more attracted to the stationary phase","D":"P = 0.3, Q = 0.6; P is more attracted to the stationary phase","correct":"B","explain":"Rf(P) = 7.2 ÷ 12.0 = 0.60. Rf(Q) = 3.6 ÷ 12.0 = 0.30. A lower Rf means the substance travelled a shorter distance → it spent more time adsorbed on the stationary phase (paper) and less time dissolved in the mobile phase. Q (Rf = 0.30) has a stronger attraction to the stationary phase."},{"stem":"A student heats a mixture of ice and salt. They observe that the mixture starts melting at −5 °C and is completely liquid by −1 °C. Explain these observations in terms of particle theory and state what this tells you about the sample.","A":"The mixture melts over a range because it contains two different substances with different forces between particles, it is not a pure substance","B":"The mixture melts over a range because salt lowers the kinetic energy of water molecules, causing erratic melting","C":"The mixture starts melting below 0 °C because the salt reacts chemically with the ice to form a new substance","D":"The mixture melts over a range because it is a pure substance and all pure substances melt like this","correct":"A","explain":"Pure water melts sharply at 0 °C. The salt-water mixture starts melting at −5 °C (below 0 °C, impurities lower the melting point) and finishes at −1 °C. The range of temperatures shows this is a mixture: different particles (water and dissolved Na⁺ and Cl⁻ ions) interact by different forces and break free at different temperatures. This is why salt is spread on icy roads, it lowers the temperature at which ice melts."},{"stem":"A chemist needs to separate a mixture of three substances: an insoluble coloured pigment, a dissolved salt, and a coloured soluble dye. Design a separation scheme giving the technique for each step and justifying each choice.","A":"Step 1: chromatography (separates all three at once)","B":"Step 1: filtration (removes insoluble pigment); Step 2: chromatography or evaporation (separates salt and dye from the filtrate); Step 3: crystallisation (recovers salt)","C":"Step 1: distillation (removes water); Step 2: filtration (separates pigment from salt and dye)","D":"Step 1: sedimentation (all three settle); Step 2: decanting (removes liquid)","correct":"B","explain":"Step 1, filtration: the insoluble pigment is trapped on the filter; the salt and dye solution passes through as filtrate. Step 2, chromatography: identifies and separates the soluble dye from the salt solution (dye moves; ionic salt is less likely to partition into organic mobile phase). Step 3, crystallisation: evaporate the water from the salt solution to recover solid salt. Each technique matches a specific property of the component being separated."},{"stem":"Two white solids, W and X, both have sharp melting points, W at 122 °C and X at 84 °C. A student claims both samples are pure and that they are the same substance. Evaluate this claim.","A":"The claim is correct, both samples are pure and identical because both have sharp melting points","B":"The claim is partially correct, both samples are pure (sharp melting points confirm this), but they cannot be the same substance because their melting points are different","C":"The claim is incorrect, a sharp melting point means the sample is a mixture","D":"The claim is incorrect, sharp melting points are only possible for elements, not compounds","correct":"B","explain":"A sharp melting point confirms that each sample is pure (a single substance). However, two different pure substances have different melting points. W (122 °C) and X (84 °C) have different melting points, so they cannot be the same substance. To identify the substance, the measured sharp melting point must be compared to a literature value. Sharp melting point = pure; matching literature value = identified."},{"stem":"Explain why energy input during boiling does not raise the temperature of a liquid above its boiling point, even though the heat source is continuous.","A":"Heat is reflected back into the environment by the vapour above the liquid","B":"The boiling liquid absorbs heat from the environment to compensate for the heat source","C":"All the energy supplied goes into breaking the forces of attraction between particles to change state from liquid to gas, none goes into increasing kinetic energy, so temperature stays constant at the boiling point","D":"The heat source automatically turns off at the boiling point to prevent overheating","correct":"C","explain":"Temperature is a measure of the average kinetic energy of particles. During boiling, energy goes into breaking the intermolecular forces that hold liquid particles together, this is the latent heat of vaporisation. None of this energy increases particle kinetic energy, so the temperature stays constant at the boiling point. This is why there is a flat plateau on a heating curve at the boiling point, just as there is at the melting point."},{"stem":"A student runs two chromatography experiments on the same unknown substance, one using water as the solvent and one using ethanol. The Rf values differ between the two experiments. The student concludes \"the substance must be a mixture.\" Evaluate this conclusion.","A":"Correct, the same substance always gives the same Rf in all solvents, so different values prove it is a mixture","B":"Incorrect, Rf values depend on the choice of solvent; the same pure substance gives different Rf values in different solvents; this does not prove the substance is a mixture","C":"Correct, Rf values are a fixed physical property of a substance, independent of solvent choice","D":"Incorrect, the student should have measured the boiling point instead","correct":"B","explain":"Rf values depend on both the substance AND the solvent chosen. The same pure substance will have one Rf in water and a different Rf in ethanol, because its relative attractions to the two different mobile phases differ. Getting different Rf values in different solvents tells you nothing about purity, it is expected. To test purity, the student should see if the substance gives ONE spot or multiple spots in each solvent."},{"stem":"Water treatment by sedimentation and filtration removes insoluble particles. Explain why these steps alone are insufficient to produce safe drinking water, and what further step is essential and why.","A":"The water must be distilled after filtration to remove all dissolved salts before drinking","B":"Sedimentation and filtration only remove insoluble particles, dissolved microbes and bacteria remain in the water and would cause disease; chlorination must be added to kill these microbes","C":"The water must be heated to boiling after filtration to remove all dissolved gases","D":"A final electrolysis step is needed to split any remaining water molecules into hydrogen and oxygen","correct":"B","explain":"Microbes (bacteria, viruses) are too small to be removed by filtration through sand beds, they pass straight through. Without a disinfection step, the filtered water would still cause waterborne diseases such as typhoid and cholera. Chlorination kills bacteria and microbes, making the water safe (potable). Sedimentation + filtration + chlorination together give the complete public water treatment process."},{"stem":"A student claims: \"Distilled water is better for drinking than tap water because it is purer.\" Evaluate this claim from a chemistry perspective.","A":"Correct, distilled water is always safer to drink than tap water","B":"Partially correct, distilled water IS chemically purer (only H₂O), but this does not automatically make it better for drinking; tap water is potable and contains mineral ions beneficial to health; distilled water lacks minerals and may not meet biological needs","C":"Incorrect, distilled water contains more dissolved substances than tap water","D":"Correct, the higher the chemical purity of water, the safer it is to drink","correct":"B","explain":"In chemistry, distilled water is purer (only H₂O). However, \"purer\" does not mean \"better for drinking.\" Potable tap water contains dissolved calcium, magnesium and other ions at safe concentrations, which contribute to nutrition. Distilled water lacks these minerals. Distilled water is used for chemical analysis, where dissolved ions would interfere with tests, not for drinking."},{"stem":"A gas is compressed into a smaller volume by pushing a piston. Explain what happens to the temperature of the gas during compression, and link this to the particle model.","A":"The temperature decreases because the particles lose energy when compressed","B":"The temperature remains the same, compression does not affect particle energy","C":"The temperature increases, compressing the gas does work on the particles, increasing their kinetic energy and therefore their temperature","D":"The temperature decreases because the particles have less space to move in","correct":"C","explain":"When a gas is compressed, an external force does work on the particles, pushing them into a smaller space. This transfers energy to the particles, increasing their average kinetic energy, and kinetic energy is what we measure as temperature. This is why a bicycle pump gets warm during pumping: the air inside is being compressed and its temperature rises."},{"stem":"A student is asked to identify an unknown colourless liquid. They measure its boiling point as 100.0 °C with a sharp transition. A second student argues this proves the liquid is pure water. Evaluate this argument, explaining what additional evidence would be needed.","A":"The argument is correct, a sharp boiling point of exactly 100 °C is definitive proof of pure water","B":"The argument is partially correct, a sharp boiling point at 100 °C confirms the sample is pure and consistent with water, but other evidence is needed to confirm identity: the melting point should be 0.0 °C, and a chemical test for water (e.g. cobalt chloride paper turning pink) should be used","C":"The argument is incorrect, pure water boils at 99 °C, not 100 °C","D":"The argument is incorrect, boiling point cannot be used to test purity; only melting point can","correct":"B","explain":"A sharp boiling point of 100 °C confirms the liquid is pure (a single substance) and is consistent with pure water. However, 100 °C alone does not identify it as water, other substances could boil near this temperature. Full identification requires: (1) sharp boiling point at 100 °C, (2) sharp melting point at 0 °C, and (3) a positive chemical test for water. Meeting all three criteria gives a confident identification."},{"stem":"During the fractional distillation of crude oil, hexane (boiling point 69 °C) and octane (boiling point 126 °C) are collected at different levels of the fractionating column. Explain why hexane is collected higher up the column than octane.","A":"Hexane has a lower density so it rises higher","B":"Hexane has a higher boiling point so it condenses higher up the column","C":"Hexane has a lower boiling point so it remains as vapour higher up the column where temperatures are lower, it only condenses when it reaches the cooler region near 69 °C; octane condenses lower down where the temperature first drops below 126 °C","D":"Hexane molecules are smaller so they travel further up the column before hitting the sides","correct":"C","explain":"The fractionating column has a temperature gradient, hottest at the bottom (near the furnace), coolest at the top. As vapours rise, they cool. Octane (bp 126 °C) condenses as soon as the temperature drops to 126 °C, relatively low in the column. Hexane (bp 69 °C) remains as vapour past the octane condensation zone and only condenses when the temperature drops to 69 °C, higher up the column. This is how fractional distillation separates liquids with different boiling points."},{"stem":"A student adds impurities to a sample of pure benzoic acid (sharp melting point 122.4 °C). Predict two changes to the melting behaviour, and explain both using particle theory.","A":"The melting point rises and becomes sharper because the impurities fill gaps in the lattice","B":"The melting point lowers and the melting range broadens, impurity particles disrupt the regular lattice, reducing the energy needed to break it down; different particles then need different energies to break free, giving a range rather than a sharp point","C":"The melting point stays the same but the melting time increases because there are more particles","D":"The melting point rises and the melting range broadens because the impurities add extra mass","correct":"B","explain":"Prediction 1, the melting point starts lower than 122.4 °C. Reason: impurity particles disrupt the regular lattice of benzoic acid, creating weaker regions that break apart at lower temperatures. Prediction 2, melting occurs over a range rather than at one sharp temperature. Reason: different particle interactions (benzoic acid–benzoic acid vs benzoic acid–impurity) have different strengths and break apart at different temperatures, causing gradual rather than sharp melting."},{"stem":"Explain why the same substance can exist in three different states at different temperatures, using the relationship between kinetic energy, forces of attraction and temperature.","A":"At different temperatures the substance contains different numbers of atoms, giving different states","B":"Temperature controls particle kinetic energy, at low temperature, forces of attraction dominate and hold particles in a fixed lattice (solid); as temperature rises, kinetic energy increases until particles can slide past each other (liquid); at high enough temperature, kinetic energy overcomes all forces of attraction and particles move freely (gas)","C":"The chemical formula of a substance changes at different temperatures, giving different states","D":"At higher temperatures, atoms lose electrons, becoming ions which form liquids and gases","correct":"B","explain":"Temperature is a measure of average particle kinetic energy. Below the melting point: kinetic energy is low; forces of attraction between particles are stronger than the kinetic energy → particles locked in a regular lattice = solid. Between melting and boiling points: kinetic energy is enough to overcome some but not all forces → particles slide past each other = liquid. Above boiling point: kinetic energy exceeds all forces of attraction → particles move freely = gas. Same substance, same formula, just different energy and spacing."},{"stem":"A student claims that paper chromatography can be used to determine whether sea water is potable. Evaluate this claim.","A":"Correct, chromatography separates dissolved salts from the water, confirming safety","B":"Incorrect, chromatography separates organic substances that partition between mobile and stationary phases; dissolved inorganic salts (e.g. Na⁺, Cl⁻) are ionic and would not separate on paper chromatography; different analytical techniques are needed to assess potability","C":"Correct, chromatography detects all dissolved substances in water, including salts and bacteria","D":"Incorrect, chromatography could be used, but only if the salt concentration is very high","correct":"B","explain":"Chromatography works well for organic molecules (dyes, pigments, amino acids) that have varying solubility in organic solvents. Dissolved inorganic ions (Na⁺, Cl⁻, Ca²⁺) remain charged in solution and do not separate on paper. To assess potability, you need: ion tests, conductivity measurements, or biological tests for microbes, not paper chromatography."},{"stem":"Calculate the Rf value of a substance where the substance moved 5.4 cm and the solvent front moved 9.0 cm. A reference table shows Substance A: Rf = 0.55; Substance B: Rf = 0.60; Substance C: Rf = 0.45. Which reference substance does the unknown most likely match?","A":"Substance A (Rf = 0.55)","B":"Substance B (Rf = 0.60)","C":"Substance C (Rf = 0.45)","D":"Cannot be determined, the Rf must match exactly","correct":"B","explain":"Rf = 5.4 ÷ 9.0 = 0.60. This matches Substance B exactly (Rf = 0.60). In practice, experimental Rf values may vary slightly due to measurement error, so the closest match is chosen. Here the calculated value is 0.60, which matches B precisely. Rf values are rounded to 2 decimal places to account for measurement uncertainty."},{"stem":"Describe the full sequence of particle changes when a solid is heated until it becomes a gas, explaining what happens to arrangement, movement and energy at each stage.","A":"Solid → liquid: particles gain energy, break into irregular arrangement, slide past each other; Liquid → gas: particles gain more energy, overcome all forces, move freely far apart","B":"Solid → liquid: covalent bonds break, particles become ions; Liquid → gas: ions move freely","C":"Solid → gas: particles gain energy and split into smaller particles that float as a gas","D":"Solid → liquid: particles lose energy and become more ordered; Liquid → gas: particles gain energy","correct":"A","explain":"Stage 1 (melting): particles gain kinetic energy; vibrations increase until particles can break free of fixed positions. Arrangement changes from regular (touching) to irregular (still touching); particles slide past each other. Temperature stays constant at the melting point while intermolecular forces are being broken. Stage 2 (boiling): particles gain more energy until they overcome all remaining forces of attraction. Arrangement becomes random and far apart; particles move freely in random directions. Temperature stays constant at the boiling point during this stage."},{"stem":"A student distils 200 cm³ of sea water. Near the end, the thermometer reading rises above 100 °C. What does this suggest, and what should the student do?","A":"A higher temperature is normal in distillation, there is no cause for concern","B":"As the water volume decreases, the salt concentration increases, raising the boiling point of the remaining solution above 100 °C; the student should stop collecting distillate to avoid collecting salty water","C":"The thermometer must be faulty if it reads above 100 °C during water distillation","D":"A temperature above 100 °C means the glassware is overheating and should be removed immediately","correct":"B","explain":"When sea water is distilled, pure water vapour leaves and the dissolved salt becomes more concentrated in the remaining solution. A concentrated salt solution has a higher boiling point than pure water (boiling point elevation). When the temperature at the side-arm rises above 100 °C, the composition of the vapour is changing, some salt-contaminated material may be distilling. The student should stop collecting to ensure the product is pure water."},{"stem":"Explain why gases are much less dense than solids of the same substance, using the particle model.","A":"Gas particles are smaller than solid particles of the same substance","B":"Gas particles have less mass than solid particles because they lose neutrons when they gain energy","C":"In a gas, particles are far apart with large gaps between them, the same mass of particles occupies a much larger volume than in the solid, where particles are touching; density = mass ÷ volume, so larger volume with same mass gives much lower density","D":"Gas particles move quickly so they push each other apart, reducing their individual masses","correct":"C","explain":"The particles in a gas and in a solid of the same substance are identical, same atoms, same masses. The difference is spacing. In a solid, particles are touching (close-packed). In a gas, particles are far apart with large gaps. Density = mass ÷ volume. Same mass, much larger volume → much lower density. One mole of liquid water (~18 cm³) becomes ~22 400 cm³ of water vapour at room temperature and pressure."},{"stem":"A student compares two water purification methods, chlorination of river water and distillation of sea water. Evaluate both methods in terms of the quality and cost of the water produced.","A":"Distillation produces higher quality water (chemically pure) but is more energy-intensive and expensive; chlorinated river water is potable but not chemically pure, and is much cheaper to produce at scale","B":"Chlorination produces chemically pure water; distillation only produces potable water","C":"Both methods produce identical quality water; distillation is cheaper because no chemicals are needed","D":"Chlorination is better in all ways, it produces purer water at lower cost","correct":"A","explain":"Chlorination of river water: inexpensive, scalable for public supply, produces potable water (safe to drink), but not chemically pure (dissolved salts remain). Distillation of sea water: removes all dissolved salts → produces chemically pure water, but requires enormous energy to boil large volumes → expensive; used in water-scarce regions (e.g. the Middle East). For general public supply, chlorination of fresh water is far more economical."},{"stem":"A student calculates Rf = distance of spot ÷ distance of solvent front. They measure the spot distance as 6 cm and the solvent front as 4 cm, giving Rf = 1.5. Identify the error and explain what the correct Rf value should be.","A":"The measurements are swapped, the spot (4 cm) cannot exceed the solvent front (6 cm); the formula is correct (spot ÷ solvent front) but the values must be switched; correct Rf = 4 ÷ 6 ≈ 0.67","B":"The error is that Rf values are always rounded to the nearest whole number; Rf = 2","C":"There is no error, Rf can be greater than 1 if the spot travels faster than the solvent","D":"The error is that the spot distance should be subtracted from the solvent front; Rf = 4 − 6 = −2","correct":"A","explain":"Rf = distance moved by substance ÷ distance moved by solvent front. The substance (spot) can NEVER travel further than the solvent front, it is carried by the solvent. If the student measured 6 cm for the spot and 4 cm for the solvent front, they have swapped the measurements. The correct calculation is Rf = 4 ÷ 6 ≈ 0.67. Rf > 1 is physically impossible in paper chromatography, a value over 1 is always a sign of an error in measurement."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
