</head><body>
<header class="site-header">

  <h1>T4 &mdash; Extracting Metals &amp; Equilibria</h1>
  <span class="tier-badge flame">&#x1F525;&#x1F525; Flame</span>
</header>
<main>
<div class="deck-meta"><span>15 cards &mdash; Flame (Apply)</span><span class="counter" id="counter">1 / 15</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question &mdash; tap to reveal answer</div><div class="card-q" id="card-q"></div></div>

</div></div>

<script>const QUESTIONS=[{"stem":"Iron can be extracted from iron oxide by heating with carbon, but aluminium cannot. Explain why the two metals require different extraction methods.","A":"Iron has a higher melting point than aluminium so it needs more heat to extract","B":"Iron is below carbon in the reactivity series so carbon can reduce iron oxide; aluminium is above carbon so carbon cannot reduce aluminium oxide, electrolysis is needed instead","C":"Aluminium is toxic so it must be extracted using electricity for safety reasons","D":"Iron is a transition metal so it reacts with carbon; aluminium is in Group 3 so it does not","correct":"B","explain":"Carbon is a reducing agent, it can only reduce oxides of metals below it in the reactivity series. Iron (below C) can be extracted: Fe₂O₃ + 3C → 2Fe + 3CO₂. Aluminium (above C) cannot be reduced by carbon, Al₂O₃ is more stable. Instead, electrolysis of molten aluminium oxide is used, with Al³⁺ ions reduced at the cathode. Electrolysis is more expensive (high electrical energy cost)."},{"stem":"In the Haber process, ammonia is produced but not all the nitrogen and hydrogen react. Unreacted gases are recycled back into the reactor. Explain why this is done and how it links to the concept of a reversible reaction.","A":"Recycling is done to cool the gases down before they re-enter the reactor","B":"Because the Haber process is a reversible reaction, 100% conversion is impossible; recycling unreacted N₂ and H₂ ensures no raw material is wasted and increases the overall yield over multiple passes through the reactor","C":"Unreacted gases are recycled because they are too expensive to dispose of safely","D":"Recycling reduces the pressure inside the reactor to the required 200 atm","correct":"B","explain":"N₂ + 3H₂ ⇌ 2NH₃ is reversible, at equilibrium, only about 15% of the mixture is ammonia at 450 °C and 200 atm. The ammonia is condensed and removed; the remaining N₂ and H₂ are recycled through the reactor to react again. This makes the process economical, effectively achieving a high overall conversion even though the equilibrium conversion per pass is low."},{"stem":"A student adds magnesium ribbon to a blue copper sulfate solution. Write the word equation and the ionic equation for the reaction, and explain which metal is oxidised and which is reduced.","A":"Word equation: copper + magnesium sulfate → magnesium + copper sulfate; ionic: Cu + Mg²⁺ → Cu²⁺ + Mg; Mg is reduced, Cu is oxidised","B":"Word equation: magnesium + copper sulfate → magnesium sulfate + copper; ionic: Mg + Cu²⁺ → Mg²⁺ + Cu; Mg is oxidised, Cu²⁺ is reduced","C":"Word equation: magnesium + copper sulfate → magnesium oxide + copper sulfide; no ionic equation possible","D":"No reaction, magnesium is below copper in the reactivity series","correct":"B","explain":"Magnesium is more reactive than copper → displacement occurs. Word equation: magnesium + copper sulfate → magnesium sulfate + copper. Ionic equation: Mg + Cu²⁺ → Mg²⁺ + Cu. Magnesium loses electrons → oxidised (Mg → Mg²⁺ + 2e⁻). Cu²⁺ gains electrons → reduced (Cu²⁺ + 2e⁻ → Cu). Redox: both occur simultaneously."},{"stem":"Explain why using 200 atmospheres in the Haber process gives a better yield of ammonia than using lower pressure, using the equation N₂ + 3H₂ ⇌ 2NH₃.","A":"Higher pressure increases the temperature, which increases the yield of ammonia","B":"Higher pressure shifts the equilibrium toward the side with fewer moles of gas, the right side (2 mol) has fewer moles than the left (4 mol), so more ammonia is produced","C":"Higher pressure increases the reaction rate so equilibrium is reached faster, giving a higher yield","D":"Higher pressure prevents the ammonia from decomposing back into nitrogen and hydrogen","correct":"B","explain":"Left side: 1 mol N₂ + 3 mol H₂ = 4 mol gas. Right side: 2 mol NH₃ = 2 mol gas. Le Chatelier's principle: increasing pressure shifts equilibrium toward the side with fewer gas moles (to reduce pressure) → toward the right → more ammonia. 200 atm is a compromise, higher pressures give even better yield but require much more expensive, reinforced equipment."},{"stem":"Bioleaching and phytomining are described as low-environmental-impact methods of metal extraction. Evaluate one advantage and one disadvantage of bioleaching compared to traditional smelting.","A":"Advantage: faster than smelting; Disadvantage: requires more electricity","B":"Advantage: can exploit low-grade ores that are uneconomical to smelt, reducing the need to mine new land; Disadvantage: very slow process (months to years) and produces acidic waste water that can pollute local waterways","C":"Advantage: cheaper to set up than electrolysis; Disadvantage: can only extract silver and gold","D":"Advantage: does not require water; Disadvantage: produces large amounts of CO₂","correct":"B","explain":"Advantage of bioleaching: it works on low-grade ores (containing < 1% metal) that cannot be economically smelted, extending the useful lifetime of existing ore deposits and reducing the environmental impact of new mining. Disadvantage: bioleaching is very slow (months to years); bacteria also produce sulfuric acid as a by-product, which can drain into nearby rivers and streams, causing acid mine drainage and killing aquatic life."},{"stem":"A reversible reaction has the equation: A + B ⇌ C + D. At equilibrium, [C] and [D] are much greater than [A] and [B]. More of compound A is then added to the equilibrium mixture. What happens?","A":"The position of equilibrium shifts to the left, producing more A and B","B":"The equilibrium does not shift, adding a reactant has no effect on a system at equilibrium","C":"The position of equilibrium shifts to the right, consuming A and producing more C and D","D":"The concentrations of all substances remain unchanged because the system is at equilibrium","correct":"C","explain":"Le Chatelier's principle: adding a reactant disturbs the equilibrium. The system opposes the disturbance by shifting to consume the added reactant. Shift is to the right (forward reaction) → more C and D are produced. The new equilibrium has more products and slightly more A than before the addition (the position shifts right but not all the way). Adding a product would shift the equilibrium left."},{"stem":"Silver nitrate solution is added to iron filings. Predict whether a reaction occurs, what you would observe if it does, and write the word equation.","A":"No reaction, iron is less reactive than silver","B":"Reaction occurs because iron is more reactive than silver: iron + silver nitrate → iron nitrate + silver; grey silver deposits on the iron filings and the colourless solution develops a faint green tinge (Fe²⁺)","C":"Reaction occurs: silver + iron nitrate → silver nitrate + iron; no observable colour change","D":"Reaction occurs: iron + silver → iron-silver alloy; no observable colour change","correct":"B","explain":"Iron is above silver in the reactivity series, iron can displace silver from its salt solution. Fe + 2AgNO₃ → Fe(NO₃)₂ + 2Ag. Observations: grey/white silver crystals deposit on the iron; the colourless AgNO₃ solution slowly turns pale green as Fe²⁺ ions form. Ionic equation: Fe + 2Ag⁺ → Fe²⁺ + 2Ag."},{"stem":"Why is the temperature of 450 °C chosen for the Haber process rather than a lower temperature that would give a higher yield of ammonia?","A":"At lower temperatures, iron becomes non-reactive as a catalyst","B":"The Haber process is exothermic in the forward direction; lower temperatures favour the forward reaction and give higher yield but the rate becomes too slow to be commercially viable, 450 °C is a compromise between acceptable rate and acceptable yield","C":"Lower temperatures cause ammonia to decompose back into nitrogen and hydrogen","D":"Lower temperatures increase the pressure inside the reactor to unsafe levels","correct":"B","explain":"The forward reaction (N₂ + 3H₂ → 2NH₃) is exothermic. Lower temperature shifts the equilibrium right (more ammonia), but also dramatically slows the reaction rate, making it take too long to reach equilibrium in a commercial setting. 450 °C is a compromise: yield is lower (~15%) but the reaction is fast enough to produce ammonia at a profitable rate. The iron catalyst also helps by increasing rate without affecting equilibrium position."},{"stem":"A student argues that adding a catalyst to a Haber process reactor will shift the equilibrium toward more ammonia. Evaluate this claim.","A":"Correct, the catalyst makes the forward reaction faster than the reverse, shifting equilibrium right","B":"Incorrect, a catalyst speeds up both the forward and reverse reactions equally, so equilibrium is reached faster but the final equilibrium position (and % yield) is unchanged","C":"Incorrect, the iron catalyst only affects the reverse reaction, slowing decomposition of ammonia","D":"Correct, the catalyst increases temperature which shifts equilibrium toward more ammonia","correct":"B","explain":"A catalyst increases the rate of both the forward and reverse reactions by the same factor (it lowers the activation energy for both). The equilibrium position, and therefore the percentage yield of ammonia, is not changed by the catalyst. The only effect is that equilibrium is reached more quickly. This is a very commonly misunderstood concept: catalysts affect rate, not equilibrium yield."},{"stem":"Life cycle assessment (LCA) is used to evaluate the environmental impact of using a metal. Describe two stages in the life of a metal product that would be assessed, and explain why recycling can improve the LCA score.","A":"Only the extraction stage and the disposal stage are assessed; recycling has no effect on LCA","B":"Extraction (mining and reduction), manufacturing, use, disposal/recycling, all stages contribute to environmental impact; recycling improves LCA because it replaces energy-intensive extraction with a less energy-intensive process, reducing CO₂ emissions and conserving ore reserves","C":"LCA only measures CO₂ emissions from burning fuels; it does not include water use or land damage","D":"Recycling worsens LCA because collecting and melting old metals requires more energy than mining new ore","correct":"B","explain":"An LCA covers: raw material extraction (mining and ore processing), manufacturing and transport, use phase, and end-of-life disposal or recycling. Recycling improves the LCA score because: (1) it requires less energy than primary extraction (e.g. recycling aluminium uses ~5% of the energy of electrolytic extraction); (2) it reduces demand for new mining (less habitat destruction and CO₂ from smelting); (3) it extends the useful life of finite ore reserves."},{"stem":"Copper can be displaced from copper sulfate solution by adding iron. Write the ionic equation and identify the oxidising agent.","A":"Fe + Cu²⁺ → Fe²⁺ + Cu; iron is the oxidising agent","B":"Fe + Cu²⁺ → Fe²⁺ + Cu; Cu²⁺ is the oxidising agent","C":"Fe²⁺ + Cu → Fe + Cu²⁺; Fe²⁺ is the oxidising agent","D":"Fe + CuSO₄ → FeSO₄ + Cu; sulfate is the oxidising agent","correct":"B","explain":"Ionic equation: Fe(s) + Cu²⁺(aq) → Fe²⁺(aq) + Cu(s). Iron loses electrons → iron is oxidised → iron is the reducing agent. Cu²⁺ gains electrons → Cu²⁺ is reduced → Cu²⁺ is the oxidising agent. OIL RIG: Oxidation Is Loss; Reduction Is Gain. The oxidising agent is the species that gets reduced (it causes something else to be oxidised)."},{"stem":"A student says: \"Increasing the pressure in the Haber process always increases the yield.\" Is this correct? Explain with reference to Le Chatelier's principle.","A":"Correct, increasing pressure always shifts equilibrium to the right in any reversible reaction","B":"Correct for the Haber process specifically, but only because the forward reaction is exothermic","C":"Correct for the Haber process, because there are fewer moles of gas on the right-hand side, increasing pressure always favours the side with fewer gas moles","D":"Incorrect, increasing pressure decreases the yield by compressing the ammonia molecules","correct":"C","explain":"For N₂ + 3H₂ ⇌ 2NH₃: left = 4 mol gas, right = 2 mol gas. Le Chatelier: increasing pressure favours the side with fewer gas moles → right → more ammonia (higher yield). This is correct for the Haber process. However, pressure only affects equilibria where gas moles differ between the two sides, if both sides had the same number of gas moles, pressure would have no effect."},{"stem":"Aluminium is more abundant in the Earth's crust than iron, yet aluminium is more expensive. Explain why.","A":"Aluminium ore is rarer and more difficult to mine than iron ore","B":"Aluminium requires electrolysis for extraction, a high-energy, expensive process; iron can be extracted more cheaply by heating with carbon","C":"Aluminium is harder to shape and requires more expensive machinery in manufacturing","D":"There is less global demand for aluminium than for iron, so production costs are higher per unit","correct":"B","explain":"Aluminium is the third most abundant element in the crust, but extracting it requires electrolysis of molten aluminium oxide (bauxite) at very high temperatures. Electrolysis uses large amounts of electrical energy → high cost. Iron is extracted using carbon (coke) in a blast furnace, which is much cheaper. The cost difference reflects energy requirements, not ore scarcity."},{"stem":"Explain what happens at the molecular level when a reversible reaction first reaches dynamic equilibrium in a closed system.","A":"All molecules stop moving, the reaction has ended","B":"The concentrations of all species become equal, products and reactants are present in 1:1 ratio","C":"The forward reaction rate and the reverse reaction rate become equal, both reactions still occur, but there is no further net change in concentration","D":"The forward reaction stops and only the reverse reaction continues to maintain equilibrium","correct":"C","explain":"At the start, only forward reaction occurs. As products build up, the reverse reaction begins. Over time, the forward rate slows (reactants consumed) and the reverse rate increases (products accumulate). When forward rate = reverse rate → dynamic equilibrium. Concentrations are constant (not necessarily equal). Both reactions still happen, this is why it is \"dynamic.\" In a closed system, this state is maintained indefinitely unless conditions change."},{"stem":"The Haber process produces only about 15% ammonia at equilibrium under industrial conditions. Explain why the industry does not use a much lower temperature to increase the yield closer to 100%.","A":"Lower temperatures would require a different catalyst that is too expensive","B":"Lower temperatures give a higher equilibrium yield but the reaction becomes too slow to produce ammonia at a commercially viable rate, the 15% yield with fast rate is more profitable than a 50% yield with an impractically slow rate","C":"Lower temperatures cause the ammonia to liquify inside the reactor, blocking the pipes","D":"Lower temperatures shift the equilibrium toward reactants, reducing the yield further","correct":"B","explain":"The Haber process forward reaction is exothermic, lower temperature favours a higher equilibrium yield of NH₃. However, at lower temperatures the activation energy barrier is harder to overcome and the reaction rate drops dramatically. At economically viable rates, the process would produce too little ammonia per unit time. 450 °C (with an iron catalyst) is the compromise where rate is acceptable even though equilibrium yield is only ~15%."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
