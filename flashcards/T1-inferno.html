@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.card-face{padding:1.2rem 1.3rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<header class="site-header">
  <a href="practice.html" class="back-link">&larr; All Topics</a>
  <h1>T1 Atomic Structure &amp; the Periodic Table</h1>
  <span class="tier-badge inferno">&#x1F525;&#x1F525;&#x1F525; Inferno</span>
</header>
<main>
<div class="deck-meta"><span>20 cards | Inferno (Analyse)</span><span class="counter" id="counter">1 / 20</span></div>
<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question: tap to reveal answer</div><div class="card-q" id="card-q"></div></div>
  <div class="card-face card-back"><div class="card-hint">Answer</div><div class="card-ans" id="card-ans"></div><div class="card-ex" id="card-ex"></div></div>
</div></div>

</div>

</main>
<script>const QUESTIONS=[{"stem":"In Rutherford's gold foil experiment, a very small number of alpha particles bounced almost straight back. What does this prove, and why could the plum pudding model not explain this result?","A":"It proves electrons are in shells; the plum pudding model had no shells so could not predict deflections","B":"It proves the positive charge is concentrated in a tiny, dense nucleus; the plum pudding model's spread-out positive charge could never generate a large enough repulsive force to turn a fast alpha particle around","C":"It proves atoms contain neutrons; the plum pudding model ignored neutrons","D":"It proves atoms are mostly empty space; the plum pudding model predicted all particles would be absorbed","correct":"B","explain":"A fast, positively charged alpha particle can only be deflected back if it encounters a very concentrated region of positive charge, a tiny, dense nucleus. In the plum pudding model, positive charge is spread thinly throughout the atom, so the repulsive force on any passing alpha particle would be very small and no large deflections would occur. The large-angle deflections and back-scattering disproved the plum pudding model."},{"stem":"Chlorine exists as ³⁵Cl (75% abundance) and ³⁷Cl (25% abundance). Calculate the relative atomic mass of chlorine and explain why the answer is not a whole number.","A":"Ar = 36.0; not a whole number because chlorine has two isotopes of equal abundance","B":"Ar = 35.5; not a whole number because it is a weighted average of two isotopes with different abundances","C":"Ar = 35.5; not a whole number because chlorine-35 and chlorine-37 each have fractional masses","D":"Ar = 36.5; not a whole number because neutrons have a mass of 0.5","correct":"B","explain":"Ar = (75 × 35 + 25 × 37) ÷ 100 = (2625 + 925) ÷ 100 = 3550 ÷ 100 = 35.5. The Ar is a weighted average, each isotope's mass is multiplied by its fractional abundance. Because the two isotopes are not present in equal amounts, the average falls between them but is not a whole number."},{"stem":"Graphene is a single layer of graphite. It conducts electricity extremely well. Diamond does not conduct. Both are pure carbon. Explain this difference at the atomic level.","A":"Graphene contains ionic carbon; diamond contains covalent carbon","B":"Diamond has more electrons per carbon atom than graphene","C":"In graphene each C forms 3 bonds leaving 1 electron per atom delocalised across the whole layer; in diamond each C forms 4 bonds using all outer electrons so no free electrons remain","D":"Graphene is a simple molecular substance so electrons can escape the molecule; diamond is giant covalent so they cannot","correct":"C","explain":"In graphene (one layer of graphite), each carbon uses 3 of its 4 outer electrons in covalent bonds. The fourth electron per carbon is fully delocalised across the layer, these electrons are free to carry charge. In diamond, all 4 outer electrons per carbon are used in 4 covalent bonds; there are no free electrons. Structure determines electrical conductivity."},{"stem":"Calculate the percentage by mass of iron in iron(III) oxide, Fe₂O₃. (Fe = 56, O = 16)","A":"56%","B":"70%","C":"48%","D":"33%","correct":"B","explain":"Mr(Fe₂O₃) = (2 × 56) + (3 × 16) = 112 + 48 = 160. Mass of Fe in one formula unit = 2 × 56 = 112. % Fe = (112 ÷ 160) × 100 = 70%. This type of calculation is used to compare the iron content of different ores to decide which is most economical to process."},{"stem":"A compound contains 40.0% calcium, 12.0% carbon and 48.0% oxygen by mass. Determine the empirical formula. (Ca = 40, C = 12, O = 16)","A":"Ca₂CO₃","B":"CaCO₃","C":"CaC₂O₄","D":"Ca₂C₂O₄","correct":"B","explain":"Divide each % by the respective Ar: Ca = 40.0/40 = 1.0; C = 12.0/12 = 1.0; O = 48.0/16 = 3.0. Ratio Ca:C:O = 1:1:3. Empirical formula = CaCO₃ (calcium carbonate). Empirical formula calculations always follow: % ÷ Ar → simplest whole number ratio."},{"stem":"A student claims: \"All carbon atoms have 6 neutrons.\" Evaluate this claim using your knowledge of isotopes.","A":"Correct, the atomic number of carbon is 6 so all carbon atoms have 6 neutrons","B":"Incorrect, carbon atoms always have 6 protons but can have different numbers of neutrons; carbon-12 has 6 neutrons but carbon-13 has 7 and carbon-14 has 8","C":"Incorrect, carbon atoms have 6 protons and 6 neutrons only in the plum pudding model","D":"Correct, neutron number is fixed by the atomic number for all elements","correct":"B","explain":"The atomic number (6 for carbon) fixes the number of protons, not neutrons. Different isotopes of the same element have different neutron numbers. Carbon-12 (6 neutrons), carbon-13 (7 neutrons) and carbon-14 (8 neutrons) all exist naturally. The student has confused atomic number with neutron number."},{"stem":"A substance has empirical formula MgO and a melting point of 2852°C. It conducts electricity when dissolved in water but not as a solid. What can you deduce about its structure and bonding?","A":"It is a simple molecular compound with strong intermolecular forces","B":"It is a giant covalent structure with only covalent bonds","C":"It is a giant ionic lattice, the very high melting point shows strong electrostatic forces throughout the lattice; conductivity only when dissolved confirms ions are fixed in the solid","D":"It is a metallic structure, only metals have such high melting points","correct":"C","explain":"MgO (magnesium oxide) has: very high melting point → giant structure with strong bonds throughout. Conducts when dissolved (Mg²⁺ and O²⁻ free to move) but not as a solid (ions fixed) → ionic lattice. A simple molecular substance would have a low melting point; metals conduct as solids."},{"stem":"How many moles of atoms are in 5.4 g of aluminium? (Al = 27). Then state how many atoms this represents. (Avogadro's number = 6.02 × 10²³)","A":"0.1 mol; 6.02 × 10²² atoms","B":"0.2 mol; 1.20 × 10²³ atoms","C":"2 mol; 1.20 × 10²⁴ atoms","D":"0.5 mol; 3.01 × 10²³ atoms","correct":"B","explain":"Moles = mass ÷ Ar = 5.4 ÷ 27 = 0.2 mol. Number of atoms = 0.2 × 6.02 × 10²³ = 1.204 × 10²³ ≈ 1.20 × 10²³. One mole of any substance contains 6.02 × 10²³ particles (Avogadro's number)."},{"stem":"Bohr's model added electron shells to Rutherford's nuclear model. What experimental evidence supported the idea of fixed energy levels?","A":"The gold foil experiment showed electrons must be in defined positions","B":"The discovery of the neutron confirmed electrons must be at fixed distances from the nucleus","C":"The line emission spectra of elements, atoms only emit light at specific wavelengths, showing electrons can only exist at fixed energy levels and release specific amounts of energy when dropping between them","D":"The plum pudding model predicted electrons in fixed shells, which Bohr confirmed","correct":"C","explain":"When elements are heated, they emit light only at specific wavelengths (line spectra, not a continuous spectrum). This can only be explained if electrons occupy fixed energy levels and emit a specific photon of light when dropping from a higher to a lower energy level. A continuous spectrum would imply electrons could have any energy."},{"stem":"An unknown ionic compound contains only calcium (Ca = 40), nitrogen and oxygen. Its Mr is 164. Given that calcium forms Ca²⁺ ions, deduce the formula and name of the compound. (N = 14, O = 16)","A":"Ca(NO₃)₂, calcium nitrate; Ca²⁺ requires two 1− anions; remaining Mr = 164 − 40 = 124; two anions each Mr = 62; NO₃⁻ has Mr = 14 + 48 = 62","B":"CaNO₃, calcium nitrate; one NO₃ anion carries charge 2− so only one is needed","C":"Ca(NO₂)₂, calcium nitrite; NO₂⁻ has Mr = 46, giving total Mr = 40 + 92 = 132, does not match 164","D":"Ca₂(NO₃)₂, dicalcium nitrate; Mr = 80 + 124 = 204, does not match 164","correct":"A","explain":"Mr of anion(s) = 164 − 40 = 124. Ca²⁺ has charge 2+, so requires 2− overall from anions. Two identical 1− anions each have Mr = 124 ÷ 2 = 62. Check NO₃⁻: N = 14, O₃ = 3 × 16 = 48, total = 62 ✓. Formula: Ca(NO₃)₂, calcium nitrate, an important fertiliser. Key steps: (1) subtract cation Mr from total Mr; (2) use charge balance to find number of anions; (3) divide to find Mr of one anion; (4) identify the anion."},{"stem":"Fullerene C₆₀ has a Mr of 720 and a melting point of 280°C. Diamond melts above 3500°C. Both are pure carbon. Explain the large difference in melting points.","A":"Diamond has a higher carbon content per gram than C₆₀","B":"C₆₀ is a simple molecular substance, only weak intermolecular forces between molecules need to be overcome; diamond has a giant covalent lattice, all strong covalent bonds must be broken","C":"C₆₀ molecules contain double bonds which are weaker than the single bonds in diamond","D":"Diamond is denser than C₆₀ so more energy is needed to separate its atoms","correct":"B","explain":"C₆₀ consists of discrete molecules. On melting, only the weak London dispersion forces between C₆₀ molecules are overcome, the covalent bonds within each molecule remain intact. Diamond has millions of covalent bonds per mole extending throughout the giant lattice, ALL must be broken to melt it. Breaking covalent bonds requires far more energy than overcoming intermolecular forces."},{"stem":"A student calculates the Ar of magnesium using three isotopes: ²⁴Mg (79% abundance), ²⁵Mg (10% abundance) and ²⁶Mg (11% abundance). Calculate the Ar to 1 decimal place.","A":"24.0","B":"25.0","C":"24.3","D":"24.8","correct":"C","explain":"Ar = (79×24 + 10×25 + 11×26) ÷ 100 = (1896 + 250 + 286) ÷ 100 = 2432 ÷ 100 = 24.32 ≈ 24.3. With three isotopes, include all three in the weighted average. The most abundant isotope (²⁴Mg at 79%) pulls the average close to 24."},{"stem":"An ionic compound forms between aluminium (Group 3) and oxygen (Group 6). Deduce the formula using charge balance.","A":"AlO","B":"Al₂O₃","C":"AlO₃","D":"Al₃O₂","correct":"B","explain":"Al³⁺ (loses 3 electrons, Group 3) and O²⁻ (gains 2 electrons, Group 6). To balance: need total charge = 0. LCM of 3 and 2 is 6. Need 2 × Al³⁺ (+6) and 3 × O²⁻ (−6). Formula: Al₂O₃. Cross-multiply the charges to get subscripts: Al³⁺ gets subscript 2; O²⁻ gets subscript 3."},{"stem":"A scientist argues the nuclear model is better than the plum pudding model because it explains more evidence. Describe TWO specific pieces of evidence the nuclear model explains that the plum pudding model cannot.","A":"The nuclear model explains why metals conduct electricity and why non-metals do not","B":"The nuclear model explains why most alpha particles bounced back (concentrated nucleus) and why most passed straight through (mostly empty space), neither result is possible with the spread-out positive charge of the plum pudding model","C":"The nuclear model explains isotopes and electron shells; the plum pudding model has electrons in shells already","D":"The nuclear model explains chemical bonding; the plum pudding model has no bonding theory","correct":"B","explain":"From Rutherford's experiment: (1) Most alpha particles passed straight through → most of the atom is empty space; (2) A tiny fraction bounced back → positive charge and mass are concentrated in a tiny nucleus. The plum pudding model predicts only small, uniform deflections, it cannot explain either the straight-through passage (no empty space in a solid sphere) or the back-scattering (no concentrated charge to generate a large repulsive force)."},{"stem":"Calculate the number of moles of NaCl in 11.7 g. Then calculate the mass of sodium ions (Na⁺) in this sample. (Na = 23, Cl = 35.5)","A":"0.1 mol NaCl; 2.3 g Na⁺","B":"0.2 mol NaCl; 4.6 g Na⁺","C":"0.5 mol NaCl; 11.5 g Na⁺","D":"0.1 mol NaCl; 3.55 g Na⁺","correct":"B","explain":"Mr(NaCl) = 23 + 35.5 = 58.5. Moles = 11.7 ÷ 58.5 = 0.2 mol. In 0.2 mol NaCl there are 0.2 mol Na⁺. Mass of Na⁺ = 0.2 × 23 = 4.6 g. Multi-step mole calculations require: (1) find Mr, (2) find moles, (3) use ratio, (4) find mass of ion."},{"stem":"Sodium chloride (NaCl) conducts electricity when dissolved but not as a solid. Silicon dioxide (SiO₂) does not conduct in either state. Explain both observations in terms of structure and bonding.","A":"NaCl has electrons that are released when dissolved; SiO₂ has no electrons at all","B":"NaCl has ionic bonding, ions fixed in solid but free in solution; SiO₂ has giant covalent bonding, no ions ever present and no delocalised electrons","C":"NaCl dissolves to form atoms that carry charge; SiO₂ does not dissolve","D":"NaCl has metallic bonding when dissolved; SiO₂ has covalent bonding that prevents conduction","correct":"B","explain":"NaCl: giant ionic lattice → ions fixed in solid, no conduction; dissolved in water → ions free to move → conducts. SiO₂: giant covalent lattice → no ions at all, no delocalised electrons → cannot conduct in any state. The charge carriers are different: NaCl uses ions; metals use delocalised electrons; SiO₂ has neither."},{"stem":"A reaction between zinc and sulfuric acid produces zinc sulfate and hydrogen. If 0.5 mol of zinc is used, calculate the mass of zinc sulfate produced. (Zn = 65, S = 32, O = 16; assume 100% yield)","A":"0.5 g","B":"80.5 g","C":"161 g","D":"97 g","correct":"B","explain":"Zn + H₂SO₄ → ZnSO₄ + H₂. 1:1 ratio, so 0.5 mol Zn produces 0.5 mol ZnSO₄. Mr(ZnSO₄) = 65 + 32 + (4×16) = 65 + 32 + 64 = 161. Mass = 0.5 × 161 = 80.5 g. Always check the molar ratio from the balanced equation before calculating mass."},{"stem":"Two students debate whether changing the number of neutrons in an atom changes its chemical properties. Student A says yes; Student B says no. Who is correct and why?","A":"Student A, neutrons affect the mass of the nucleus which changes how strongly electrons are held","B":"Student B, neutrons carry no charge and do not affect the number or arrangement of electrons, so chemical properties (which depend on electron configuration) are unchanged","C":"Student A, heavier isotopes have stronger bonds so they react at different rates","D":"Both are partially correct, neutrons affect physical properties but only slightly change chemical properties","correct":"B","explain":"Chemical properties depend on the number and arrangement of outer electrons. Neutrons carry no charge and do not affect electron number or configuration. Isotopes of the same element have identical electron arrangements → identical chemical properties. They may differ in physical properties (e.g. density, rate of diffusion) because mass is different."},{"stem":"Calculate the concentration (in mol/dm³) of a solution containing 5.85 g of NaCl dissolved in 500 cm³ of water. (Na = 23, Cl = 35.5)","A":"0.1 mol/dm³","B":"0.5 mol/dm³","C":"0.05 mol/dm³","D":"0.2 mol/dm³","correct":"D","explain":"Mr(NaCl) = 58.5. Moles = 5.85 ÷ 58.5 = 0.1 mol. Volume = 500 cm³ = 0.5 dm³. Concentration = moles ÷ volume = 0.1 ÷ 0.5 = 0.2 mol/dm³. Always convert cm³ to dm³ (÷ 1000) before using the concentration formula."},{"stem":"A student investigates limiting reagents: 2.0 g of magnesium reacts with 3.65 g of hydrochloric acid solution (containing 0.1 mol HCl). Mg + 2HCl → MgCl₂ + H₂. Which is the limiting reagent and how much H₂ is produced? (Mg = 24)","A":"Mg is limiting; 0.083 mol H₂ produced","B":"HCl is limiting; 0.05 mol H₂ produced","C":"Mg is limiting; 0.05 mol H₂ produced","D":"Neither limits the reaction, both are used up simultaneously","correct":"B","explain":"Moles Mg = 2.0 ÷ 24 = 0.083 mol. Moles HCl = 0.1 mol. From the equation: 1 mol Mg needs 2 mol HCl. So 0.083 mol Mg needs 0.167 mol HCl, but only 0.1 mol HCl is available. HCl is the limiting reagent. Moles H₂ = moles HCl ÷ 2 = 0.1 ÷ 2 = 0.05 mol. Always compare what you have to what the equation requires."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
