<div class="card-scene"><div class="card" id="card">
  <div class="card-face card-front"><div class="card-hint">Question &mdash; tap to reveal answer</div><div class="card-q" id="card-q"></div></div>

<script>const QUESTIONS=[{"stem":"A student performs a flame test on an unknown solid and observes a lilac flame. They then add sodium hydroxide solution to a solution of the same solid and observe no precipitate, but a pungent gas is produced on warming. What does this tell them?","A":"The solid contains potassium carbonate, K⁺ gives lilac and carbonate gives CO₂ gas","B":"The lilac flame suggests K⁺ and the pungent gas suggests NH₄⁺ are both present, two different cations","C":"The lilac flame confirms K⁺; but the gas from NaOH warming is irrelevant to the test","D":"The lilac flame confirms K⁺; pungent gas turning damp red litmus blue confirms NH₄⁺, the solid contains both K⁺ and NH₄⁺","correct":"D","explain":"Lilac flame = K⁺ confirmed. Adding NaOH to a solution of the solid, no precipitate rules out metal cations; pungent gas on warming that turns damp red litmus paper blue is ammonia (NH₃), confirming NH₄⁺. The solid contains both potassium ions and ammonium ions (e.g. ammonium potassium chloride or potassium ammonium sulfate)."},{"stem":"A student adds silver nitrate solution (with dilute nitric acid) to three solutions, one containing Cl⁻, one Br⁻, one I⁻. What are the precipitate colours in that order?","A":"Yellow, cream, white","B":"White, cream, yellow","C":"Cream, white, yellow","D":"All three give a white precipitate","correct":"B","explain":"AgCl is white, AgBr is cream, AgI is yellow. The colour deepens as you go down the halide group, this is a useful pattern. The acidification step (dilute HNO₃) is essential first to remove carbonate or sulfate ions that could also form precipitates with Ag⁺ and give misleading results."},{"stem":"Why is it essential to acidify a solution before testing for sulfate ions with barium chloride?","A":"To dissolve the barium chloride before it is added","B":"To ensure the reaction is exothermic","C":"To remove carbonate and sulfite ions that would also give a white precipitate with barium ions","D":"To produce bubbles so you can see when to add the barium chloride","correct":"C","explain":"Barium ions (Ba²⁺) react with both carbonate (CO₃²⁻) and sulfate (SO₄²⁻) to form white precipitates. If carbonate ions are present and you test without acidifying first, you get a white precipitate that could be BaCO₃ rather than BaSO₄, giving a false positive for sulfate. Adding dilute HCl first decomposes any carbonate (releasing CO₂) so that any subsequent white precipitate must be BaSO₄."},{"stem":"Propene (C₃H₆) is shaken with orange bromine water. What happens and why?","A":"No reaction, propene is a hydrocarbon so it cannot react with halogens","B":"The bromine water turns colourless as Br₂ adds across the C=C double bond","C":"The bromine water turns blue, indicating the presence of carbon","D":"The bromine water remains orange but becomes more concentrated","correct":"B","explain":"Propene is an alkene with a C=C double bond. This reacts with Br₂ in an addition reaction: CH₃CH=CH₂ + Br₂ → CH₃CHBrCH₂Br. The two bromine atoms add across the double bond, forming a dibromoalkane. The orange/brown colour of the bromine water disappears because the Br₂ has been used up."},{"stem":"Ethanol (C₂H₅OH) can be made by two different industrial methods. Which entry correctly identifies them?","A":"Fermentation of glucose (using enzymes in yeast) OR hydration of ethene from crude oil","B":"Fermentation of starch (using bacteria) OR reduction of ethanoic acid","C":"Hydration of ethane OR oxidation of methanol","D":"Cracking of ethane (from natural gas) OR fermentation of sucrose without yeast","correct":"A","explain":"Ethanol is made either by fermentation (C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂, catalysed by enzymes in yeast) or by hydration of ethene (C₂H₄ + H₂O → C₂H₅OH, using steam at high temperature and pressure over an acid catalyst). Fermentation uses a renewable carbohydrate feedstock; hydration is continuous and faster but uses ethene derived from non-renewable crude oil."},{"stem":"A student dissolves an unknown solid in water and adds NaOH solution. A green precipitate forms, which does not dissolve in excess NaOH. Identify the cation and explain your reasoning.","A":"Fe³⁺, iron(III) hydroxide is green","B":"Fe²⁺, iron(II) hydroxide is green and stays insoluble in excess NaOH","C":"Cu²⁺, copper(II) hydroxide is sometimes described as green","D":"Al³⁺, aluminium hydroxide can appear greenish","correct":"B","explain":"Iron(II) ions (Fe²⁺) give a green precipitate of Fe(OH)₂ with NaOH. Iron(III) ions give an orange-brown precipitate. Copper gives a blue precipitate. Al³⁺ gives white. The key confirmatory step here is that the precipitate does not dissolve in excess NaOH, if it did dissolve, it would be Al³⁺."},{"stem":"Nanoparticulate titanium dioxide (TiO₂) is used in sunscreen. Explain why the nanoparticulate form is more effective than bulk TiO₂.","A":"Nanoparticulate TiO₂ has a lower melting point, making it easier to apply to skin","B":"Nanoparticulate TiO₂ has a much larger surface area to volume ratio, so it absorbs UV light more effectively while remaining transparent to visible light","C":"Nanoparticulate TiO₂ is coloured white so it reflects sunlight effectively","D":"Nanoparticulate TiO₂ has stronger covalent bonds that resist UV radiation","correct":"B","explain":"Bulk TiO₂ is a white pigment that blocks visible light, making it look opaque on the skin. Nanoparticulate TiO₂ has an enormously higher SA:V ratio. Its particles are small enough (1–100 nm) to be transparent to visible light but still absorb UV radiation effectively, protecting the skin without leaving a white coating. The key mark phrase is \"absorbs UV light from the sun\"."},{"stem":"What is the equation for the addition polymerisation of ethene?","A":"CH₂=CH₂ + Br₂ → CH₂BrCH₂Br","B":"n CH₂=CH₂ → (–CH₂–CH₂–)ₙ","C":"C₂H₄ + H₂O → C₂H₅OH","D":"C₂H₄ + 2O₂ → 2CO₂ + 2H₂O","correct":"B","explain":"Addition polymerisation of ethene: n CH₂=CH₂ → (–CH₂–CH₂–)ₙ. Many ethene monomers join together, the C=C double bonds open up, and the carbons link to form a long chain. The repeating unit is –CH₂–CH₂–, shown in brackets with subscript n. No other products form, all atoms end up in the polymer."},{"stem":"A student tests a gas by holding damp red litmus paper at the mouth of the tube. The paper turns blue. What does this indicate?","A":"Chlorine is present, it bleaches indicators","B":"Carbon dioxide is present, it turns litmus red","C":"Ammonia is present, it is alkaline and turns damp red litmus blue","D":"Hydrogen is present, it is a reducing agent that decolourises indicators","correct":"C","explain":"Ammonia (NH₃) is an alkaline gas. When it dissolves in the moisture on damp red litmus paper, it forms an alkaline solution that turns the indicator blue. This is the standard test for ammonia and is also used to confirm ammonium ions (NH₄⁺) in the NaOH cation test, warming a solution of NH₄⁺ with NaOH releases NH₃ gas."},{"stem":"In condensation polymerisation, what small molecule is released each time an ester link forms in a polyester?","A":"Carbon dioxide","B":"Hydrogen","C":"Methanol","D":"Water","correct":"D","explain":"When a –COOH group (from a dicarboxylic acid) reacts with a –OH group (from a diol), the O–H of the carboxylic acid and the H of the alcohol –OH combine to release water. Each new ester linkage (–COO–) formed releases one molecule of H₂O. This is why the process is called condensation polymerisation."},{"stem":"What is the molecular formula of propene?","A":"C₃H₄","B":"C₃H₆","C":"C₃H₈","D":"C₂H₄","correct":"B","explain":"Propene is the three-carbon alkene. Using the general formula CₙH₂ₙ with n=3: 2×3=6, giving C₃H₆. Ethene is C₂H₄ (n=2) and butene is C₄H₈ (n=4). Propane (the saturated alkane) has formula C₃H₈, two more hydrogens than propene, as expected."},{"stem":"Why is the test for any ion required to be unique?","A":"To make the testing procedure as simple as possible","B":"So that only one ion can give that particular result, making identification definitive","C":"So that the same test can be reused for different ions","D":"To ensure the test works at room temperature without heating","correct":"B","explain":"If two different ions gave the same observation in a test, you could not tell which one you had. A unique test gives one distinctive result for one ion only. This is why each of the five flame test colours is different, and why the NaOH precipitate test gives different colours for different metal cations, the results must be distinguishable."},{"stem":"Why is yeast used in fermentation rather than a simple chemical catalyst?","A":"Yeast produces ethanol directly, whereas a chemical catalyst would produce acetic acid","B":"Yeast provides enzymes (biological catalysts) that are highly specific for converting glucose to ethanol at low temperature","C":"Yeast is cheaper and easier to source than any chemical catalyst","D":"Chemical catalysts cannot be used in aqueous reactions involving sugars","correct":"B","explain":"Yeast contains enzymes, biological catalysts that are highly specific and work under mild conditions (around 30 °C, aqueous, atmospheric pressure). The reaction glucose → ethanol + CO₂ is catalysed specifically by these enzymes, without significant side-reactions. A key point: if the temperature is too high (above about 40–50 °C), the enzymes are denatured and the reaction stops, the yeast \"dies\" because its enzymes lose their shape."},{"stem":"An atom is approximately 1 × 10⁻¹⁰ m in diameter. A nanoparticle is 10 nm in diameter. How many times larger is the nanoparticle than the atom?","A":"10","B":"100","C":"1000","D":"10 000","correct":"B","explain":"Convert: 10 nm = 10 × 10⁻⁹ m = 1 × 10⁻⁸ m. Atom diameter = 1 × 10⁻¹⁰ m. Ratio = (1 × 10⁻⁸) ÷ (1 × 10⁻¹⁰) = 100. The nanoparticle is 100 times larger than a single atom, which is consistent with the general rule that a nanoparticle 10 nm across contains roughly 100 atoms across its diameter."},{"stem":"Ethanoic acid (CH₃COOH) is dissolved in water. What type of acid is it, and why?","A":"A strong acid, it fully dissociates in water","B":"A weak acid, it only partially dissociates in water","C":"A neutral substance, it does not change the pH of water","D":"An alkali, the –OH group donates hydroxide ions","correct":"B","explain":"Carboxylic acids are weak acids. In water, only a small proportion of CH₃COOH molecules dissociate to release H⁺ ions (CH₃COOH ⇌ CH₃COO⁻ + H⁺). This gives acidic properties (pH below 7) but because most molecules stay undissociated, it is a weaker acid than, say, hydrochloric acid, which fully dissociates."},{"stem":"A flame photometer gives a light-intensity reading of 45 units at 589 nm (the wavelength for sodium). Using the calibration curve, the student reads off a concentration of 12 mg/dm³. What does 589 nm represent?","A":"The size of the sodium atom in nanometres","B":"The wavelength of light emitted by sodium ions in the flame","C":"The concentration of sodium in parts per million","D":"The temperature of the flame in the photometer","correct":"B","explain":"589 nm is the wavelength of the characteristic yellow light emitted by sodium ions when their electrons fall back to a lower energy level after being excited in the flame. Each metal ion emits at its own characteristic wavelength(s), this is what makes the flame photometer able to identify specific ions even in a mixture, because it detects light at specific wavelengths rather than just overall brightness."},{"stem":"Give one reason why nanoparticles in consumer products may pose a health risk not shared by the same substance in bulk form.","A":"Nanoparticles are more colourful and therefore distract consumers","B":"Nanoparticles are too small for manufacturers to count, so quality control is impossible","C":"Nanoparticles can penetrate skin, enter the bloodstream and reach organs that bulk particles cannot access","D":"Nanoparticles are denser than bulk material and therefore harder to wash off skin","correct":"C","explain":"Nanoparticles (1–100 nm) are small enough to pass through pores in the skin and across biological membranes. Once in the bloodstream, they can reach the brain, liver and other organs that bulk-sized particles could never enter. Their high SA:V makes them potentially reactive inside cells, and long-term accumulation effects are not yet fully understood, this novelty is itself a risk factor."},{"stem":"Methanoic acid is the first member of the carboxylic acid homologous series. What is its molecular formula?","A":"CH₃COOH","B":"HCOOH","C":"C₂H₄O₂","D":"CH₂O","correct":"B","explain":"Methanoic acid has just one carbon atom, the one in the –COOH group, with no alkyl chain. So its formula is simply HCOOH. The general formula CₙH₂ₙ₊₁COOH breaks down for the n=0 case (methanoic acid), but you can derive it by saying: one carbon in –COOH, no additional carbons, one hydrogen attached to the carboxyl carbon → HCOOH. A common error is writing CH₃COOH, which is ethanoic acid (two carbons)."},{"stem":"Why does the addition reaction of Br₂ with ethene produce only one product?","A":"Ethene is a very large molecule and can only react once","B":"Only one reactant contains a C=C double bond, so only one product forms","C":"Both carbon atoms and all bromine atoms end up in a single product molecule, with no atoms left over","D":"The reaction needs a catalyst to produce additional products","correct":"C","explain":"Addition reactions are defined by the fact that two reactants join to give exactly one product, with 100% atom economy. CH₂=CH₂ + Br₂ → CH₂BrCH₂Br. Every H, C and Br atom from the reactants ends up in the product. There are no leftover atoms to form a second product. The C=C double bond becomes a C–C single bond and the two bromine atoms attach to adjacent carbons."},{"stem":"Explain why fermentation is described as an anaerobic process.","A":"It produces acid, which is the definition of anaerobic","B":"It takes place in water, which excludes oxygen automatically","C":"It occurs without oxygen, yeast converts glucose to ethanol and CO₂ only in the absence of oxygen","D":"Anaerobic means using yeast rather than bacteria","correct":"C","explain":"Anaerobic means in the absence of oxygen. Without oxygen, yeast metabolises glucose via fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. If oxygen is present, yeast undergoes full aerobic respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, producing CO₂ and water but no ethanol. Ethanol production therefore requires the exclusion of oxygen."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
