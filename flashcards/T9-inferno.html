<script>const QUESTIONS=[{"stem":"An unknown solid X gives a lilac flame test. When dissolved in water and treated with NaOH, no precipitate forms and no gas is released on warming. Dilute HCl is then added, effervescence occurs, and the gas turns limewater milky. Identify the solid and justify your answer using each test.","A":"Potassium sulfate, K⁺ gives lilac; sulfate gives white precipitate with NaOH","B":"Potassium carbonate, K⁺ gives lilac; no precipitate confirms no interfering metal cation; CO₂ from acid confirms carbonate","C":"Lithium carbonate, lilac is the correct flame colour for lithium","D":"Potassium chloride, K⁺ gives lilac; chloride reacts with acid to give CO₂","correct":"B","explain":"Step 1, lilac flame = K⁺. Step 2, no NaOH precipitate = no metal cation other than K⁺ (K⁺ doesn't precipitate); no gas = no NH₄⁺. Step 3, effervescence with dilute HCl; CO₂ confirmed by milky limewater = CO₃²⁻. Conclusion: solid contains K⁺ and CO₃²⁻ = potassium carbonate (K₂CO₃). Lithium gives a red (crimson) flame, not lilac; chloride gives no gas with acid."},{"stem":"Draw and explain the addition reaction between propene and bromine. Why is propene described as an unsaturated hydrocarbon?","A":"CH₃CH=CH₂ + Br₂ → CH₃CH₂CH₂Br; unsaturated because it contains only C and H","B":"CH₃CH=CH₂ + Br₂ → CH₃CHBrCH₂Br; unsaturated because it contains a C=C double bond which can react with additional molecules","C":"CH₃CH=CH₂ + Br₂ → CH₃CBr₂CH₃; unsaturated because it reacts with water","D":"CH₃CH=CH₂ + 2Br₂ → CH₃CBr₂CH₂Br₂; two bromine molecules add across one double bond","correct":"B","explain":"Propene is CH₃CH=CH₂ (C₃H₆). Addition with Br₂: one Br attaches to each of the two carbons that shared the double bond. Product: CH₃CHBrCH₂Br (1,2-dibromopropane). \"Unsaturated\" means the molecule contains a C=C double bond, so it is not fully saturated with hydrogen atoms and can undergo addition reactions by using the second bond in C=C. Only one Br₂ molecule is needed, one double bond, one addition."},{"stem":"A student adds excess NaOH to two white precipitates formed by Al³⁺ and Ca²⁺ separately. Explain what happens in each case and write the ionic equation for the reaction that occurs with the aluminium precipitate.","A":"Both precipitates dissolve; Al(OH)₃ + 3NaOH → NaAlO₃; Ca(OH)₂ dissolves in acid","B":"Al(OH)₃ dissolves in excess NaOH (amphoteric); Ca(OH)₂ remains insoluble; Al(OH)₃ + OH⁻ → Al(OH)₄⁻","C":"Both stay insoluble, NaOH does not react with metal hydroxides","D":"Ca(OH)₂ dissolves; Al(OH)₃ stays insoluble; no ionic equation is needed for GCSE","correct":"B","explain":"Aluminium hydroxide is amphoteric, it reacts with both acids and alkalis. In excess NaOH: Al(OH)₃(s) + OH⁻(aq) → Al(OH)₄⁻(aq). The precipitate dissolves, giving a colourless solution of the tetrahydroxoaluminate ion. Calcium hydroxide is not amphoteric, it does not dissolve in excess NaOH, so the white Ca(OH)₂ precipitate remains. This difference is the standard way to distinguish Al³⁺ from Ca²⁺."},{"stem":"Fermentation of glucose is carried out at 30 °C. Explain what would happen if the temperature were raised to 80 °C, and why.","A":"The reaction would speed up because higher temperature means faster-moving molecules","B":"The reaction would stop because the yeast enzymes would be denatured and lose their catalytic activity","C":"The reaction would produce more CO₂ but less ethanol due to Le Chatelier's principle","D":"The yeast would produce a different alcohol at high temperature","correct":"B","explain":"Enzymes are proteins with a specific 3D shape (the active site) that fits only the substrate molecule. Above about 40–50 °C, the increased thermal energy disrupts the weak interactions (hydrogen bonds) holding the protein in shape. The enzyme denatures, its active site changes shape, the substrate can no longer bind, and catalytic activity is lost. At 80 °C, all the yeast enzymes would be denatured almost instantly, stopping fermentation entirely."},{"stem":"The condensation polymer polyester is formed from a dicarboxylic acid and a diol. Explain, with reference to the functional groups, why it is a condensation polymer.","A":"It is a condensation polymer because it requires heat and pressure to form","B":"Each time an ester linkage (–COO–) forms between a –COOH group of the acid and a –OH group of the diol, a water molecule is eliminated as a by-product","C":"It is a condensation polymer because the monomers are condensed (compressed) together at high pressure","D":"It is a condensation polymer because the polymer has a smaller molecular mass than the total mass of the monomers","correct":"B","explain":"Condensation polymerisation is defined by the loss of a small molecule each time monomers join. Here: –COOH (from the dicarboxylic acid) + –OH (from the diol) → –COO– (ester linkage) + H₂O. Both functional groups are used up in forming the new bond. Because each monomer has two functional groups (one at each end), the chain can grow from both ends, and a water molecule is released at every junction. The collective name for this family is polyester, because the polymer chain is held together by ester linkages."},{"stem":"A calibration curve for sodium ions shows that a light intensity of 30 units corresponds to a concentration of 20 mg/dm³, and 60 units corresponds to 40 mg/dm³. An unknown sample gives 45 units. What is the concentration of sodium ions?","A":"25 mg/dm³","B":"30 mg/dm³","C":"35 mg/dm³","D":"45 mg/dm³","correct":"B","explain":"The calibration curve is linear: 30 units → 20 mg/dm³; 60 units → 40 mg/dm³. So 30 units corresponds to 20 mg/dm³, meaning 1 unit corresponds to 20/30 = 0.667 mg/dm³, or we use proportional reasoning: 45 units is exactly halfway between 30 and 60 units, so it corresponds to exactly halfway between 20 and 40 mg/dm³ = 30 mg/dm³. Reading a value off a calibration curve using interpolation is the key skill here."},{"stem":"A nanoparticle cube has a side length of 2 nm. Calculate its surface area to volume ratio and compare it to a bulk cube with a side length of 2 mm.","A":"Nano: SA:V = 3 nm⁻¹; bulk: SA:V = 3 mm⁻¹; they are the same","B":"Nano: SA:V = 3 nm⁻¹; bulk: SA:V = 0.003 mm⁻¹; the nanoparticle has a ratio 1 000 000 times larger","C":"Nano: SA:V = 6 nm⁻¹; bulk: SA:V = 6 mm⁻¹; they are the same if in different units","D":"Nano: SA:V = 24 nm²/8 nm³; bulk: SA:V is impossible to calculate without a mass","correct":"B","explain":"For a cube of side l: SA = 6l²; V = l³; SA:V = 6/l. Nano (l=2 nm): SA:V = 6/2 = 3 nm⁻¹. Bulk (l=2 mm): SA:V = 6/2 = 3 mm⁻¹. To compare, convert to same units: 3 mm⁻¹ = 3 × 10⁻⁶ nm⁻¹ (since 1 mm = 10⁶ nm, so 1/mm = 10⁻⁶/nm → 3/mm = 3×10⁻⁶/nm). So the nanoparticle SA:V is 3 nm⁻¹ vs 3×10⁻⁶ nm⁻¹, a million times greater. This quantifies why nanoparticles are so much more reactive than bulk material."},{"stem":"Explain, in terms of molecular structure, why alkanes do not decolourise bromine water but alkenes do.","A":"Alkanes contain more carbon atoms than alkenes, so they cannot react with small molecules","B":"Alkanes contain only C–C single bonds and cannot undergo addition reactions; alkenes contain a C=C double bond that can open to allow Br₂ to add across it","C":"Alkanes dissolve in bromine water, diluting it; alkenes react chemically, removing the colour","D":"Alkenes contain oxygen in the C=C group, which reacts with bromine; alkanes do not","correct":"B","explain":"The key difference is saturation. Alkanes are saturated, all C–C bonds are single bonds, and there are no available bonding positions for additional atoms. To react with Br₂, an alkane would need to break a C–H bond (which requires UV light, not something that happens when simply shaken). Alkenes are unsaturated, the C=C double bond has a second pair of electrons that can be used to bond to Br₂ in an addition reaction, forming a dibromoalkane and removing the orange colour."},{"stem":"An unknown cation gives an orange-red flame test. It also gives a white precipitate with NaOH that remains insoluble when excess NaOH is added. Suggest which cation is present and explain how you would confirm your identification using a second test.","A":"Na⁺, yellow flame, white precipitate with NaOH; confirm with a second NaOH test","B":"Ca²⁺, orange-red flame; white precipitate insoluble in excess NaOH confirms Ca²⁺ rather than Al³⁺","C":"Cu²⁺, orange-red is the same as blue-green for copper; insoluble precipitate confirms this","D":"Li⁺, orange-red is the same as crimson; the precipitate confirms lithium","correct":"B","explain":"Orange-red flame = Ca²⁺ (not Na⁺ which is yellow, not Li⁺ which is red/crimson). White precipitate with NaOH = could be Ca²⁺ or Al³⁺. The precipitate remains insoluble in excess NaOH, this rules out Al³⁺ (which dissolves in excess, being amphoteric) and confirms Ca²⁺. To further confirm: a flame test showing orange-red is itself strong confirmation; alternatively test the original solution, Ca²⁺ does not give a pungent gas with NaOH (ruling out NH₄⁺)."},{"stem":"Give two differences between addition polymerisation and condensation polymerisation.","A":"Addition uses alkenes; condensation uses alcohols; both release water","B":"In addition polymerisation no by-product is formed and the monomer must contain C=C; in condensation polymerisation water is released and the monomers contain two reactive functional groups each","C":"Addition polymers are always longer than condensation polymers; condensation uses heat","D":"Addition polymers are natural; condensation polymers are always synthetic","correct":"B","explain":"Difference 1, by-product: addition produces no by-product (100% atom economy); condensation releases a small molecule (water) each time a bond forms. Difference 2, monomers: addition monomers must contain a C=C double bond (e.g. ethene); condensation monomers must contain two reactive functional groups (e.g. –COOH and –OH), one at each end of the molecule. These two contrasts often appear as a 4-mark question requiring two points with explanation."},{"stem":"An unknown solution is tested with dilute nitric acid and then silver nitrate. A cream precipitate forms. What ion is present, and write the ionic equation for its formation.","A":"Cl⁻, AgCl is a white precipitate; Ag⁺ + Cl⁻ → AgCl","B":"I⁻, AgI is a yellow precipitate; Ag⁺ + I⁻ → AgI","C":"Br⁻, AgBr is cream; Ag⁺ + Br⁻ → AgBr","D":"SO₄²⁻, BaSO₄ is white; Ba²⁺ + SO₄²⁻ → BaSO₄","correct":"C","explain":"The three silver halide precipitate colours are: AgCl = white, AgBr = cream, AgI = yellow. A cream precipitate with acidified silver nitrate confirms bromide ions (Br⁻). The ionic equation is: Ag⁺(aq) + Br⁻(aq) → AgBr(s). Note: dilute nitric acid (not HCl) must be used for acidification, using HCl would introduce Cl⁻ ions, which would also give a white precipitate with Ag⁺, making the test invalid."},{"stem":"Why must researchers investigate the long-term effects of nanoparticles used in medicines and cosmetics, even if short-term trials show no harm?","A":"Because all new chemicals must be tested for 50 years before approval","B":"Because nanoparticles may accumulate in tissues over time, and their interactions inside cells are not yet fully understood","C":"Because nanoparticles always become toxic after six months of use","D":"Because bulk forms of the same substances are known to be harmful","correct":"B","explain":"Nanoparticles may enter the bloodstream, cross biological barriers and accumulate in organs including the brain. The long-term effects of this accumulation, including whether nanoparticles might catalyse harmful reactions inside cells, trigger inflammation, or disrupt cell function, are not yet known because the technology is relatively new. Short-term studies show no acute toxicity, but that does not rule out effects that only manifest after years of low-level exposure. Scientific caution is warranted."},{"stem":"Predict the molecular formula of propanoic acid and explain why methanoic acid is the \"odd one out\" in the carboxylic acid homologous series.","A":"C₃H₆O₂; methanoic acid is the odd one out because it has the most hydrogen atoms","B":"C₂H₅COOH (= C₃H₆O₂); methanoic acid (HCOOH) is the odd one out because it has no alkyl group, the –COOH carbon is directly bonded to H, not to a CH₃ group","C":"C₃H₇COOH; methanoic acid is an alkane not a carboxylic acid","D":"C₃H₈O₂; methanoic acid is odd because it contains two oxygens but no –COOH group","correct":"B","explain":"General formula CₙH₂ₙ₊₁COOH works for n≥1. For propanoic acid: n=2, so C₂H₅COOH = C₃H₆O₂. For methanoic acid: n=0, meaning there is no alkyl group (–CH₃ or longer), the carboxyl group itself carries an H directly (H–COOH). This makes it structurally unlike all other carboxylic acids, which have at least a methyl group attached. The common error is writing methanoic acid as CH₃COOH (which is ethanoic acid, already has one alkyl carbon)."},{"stem":"A student oxidises ethanol (C₂H₅OH) in the presence of oxygen. What organic product forms, and what functional group does it contain?","A":"Ethene (C₂H₄), functional group C=C","B":"Ethanoic acid (CH₃COOH), functional group –COOH","C":"Propanol (C₃H₇OH), functional group –OH","D":"Diethyl ether, functional group –O–","correct":"B","explain":"Oxidation of ethanol (e.g. by bacteria in the presence of air, or using acidified potassium dichromate as an oxidising agent) converts the –OH group to a –COOH group. The carbon count stays the same (2 C → 2 C), and two hydrogen atoms are removed. Product: CH₃COOH (ethanoic acid). This is what happens when wine \"goes off\" and turns to vinegar, ethanol in the wine is oxidised to ethanoic acid by bacteria."},{"stem":"Describe how to carry out the test for chloride ions in solution, giving the reagents, the expected result, and the reason for the acidification step.","A":"Add dilute sulfuric acid, then silver nitrate, white precipitate of silver sulfate confirms chloride","B":"Acidify with dilute nitric acid to remove interfering anions (especially CO₃²⁻), then add silver nitrate solution, white precipitate of AgCl confirms chloride; HNO₃ is used (not HCl) to avoid introducing more Cl⁻","C":"Add dilute hydrochloric acid, then silver nitrate, cream precipitate confirms bromide ions","D":"Add sodium hydroxide solution, white precipitate of AgCl confirms chloride","correct":"B","explain":"Test: acidify with dilute nitric acid (not HCl, using HCl would introduce Cl⁻ and give a false positive); then add silver nitrate solution, AgNO₃(aq). Result: white precipitate of silver chloride, AgCl(s). Ionic equation: Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Reason for HNO₃: to destroy any carbonate ions (CO₃²⁻ + 2H⁺ → CO₂ + H₂O) that would otherwise react with Ag⁺ to form Ag₂CO₃ (a yellow-white precipitate) and interfere with the result. HNO₃ is chosen over HCl because it does not introduce Cl⁻."},{"stem":"Explain why silver halide precipitates change colour from white (AgCl) to cream (AgBr) to yellow (AgI) down the halide group, relating this to the properties of the silver-halide bonds.","A":"The colours change because the halide ions are increasingly large and absorb different visible wavelengths","B":"Colour deepens because AgI is less soluble than AgBr which is less soluble than AgCl; more covalent character in the bond → absorbs different wavelengths of visible light","C":"The colour change reflects the flame test colours of the parent elements (Cl₂ is green, Br₂ is red-brown, I₂ is grey)","D":"The colour is determined by the charge on the halide ion, more negative ions give more coloured precipitates","correct":"B","explain":"Going down Group 7: iodide ions are larger, more polarisable, and interact more strongly with the small Ag⁺ ion. The bonding in AgI has significantly more covalent character than in AgCl. Greater covalent character leads to energy levels that absorb visible light (higher-energy visible wavelengths), whereas AgCl only absorbs near-UV. As a result: AgCl appears white (no absorption in visible), AgBr appears cream (absorbs slightly in blue-visible), AgI appears yellow (absorbs strongly in blue/violet, transmitting yellow). (Note: this is primarily a qualitative exam point, the exam expects the colour order and that it relates to the precipitate's properties.)"},{"stem":"Poly(ethene) and a polyester are both polymers, but they have very different properties. Give two differences in their chemistry and properties that explain why polyesters can be used in clothing but poly(ethene) cannot.","A":"Polyesters contain ester linkages that can be hydrolysed (broken by water/steam), making them biodegradable fibre-formers; poly(ethene) has only C–C bonds, is chemically inert, and cannot form the long straight chains needed for fibres","B":"Polyesters are formed by addition; poly(ethene) by condensation; this makes polyesters stronger","C":"Poly(ethene) is a liquid; polyester is always a solid, making it more suitable for clothing","D":"Polyesters contain oxygen in the backbone, which is toxic; poly(ethene) contains only carbon and hydrogen","correct":"A","explain":"Difference 1, structure: polyesters have ester linkages (–COO–) in the backbone, which makes chains polar and able to interact with dyes (polyester can be coloured). Poly(ethene) has only C–C and C–H bonds (non-polar), makes a flexible waxy solid, and cannot be spun into fibres in the way polyester can. Difference 2, fibre formation: polyester molecules form strong, straight chains that can be drawn into fibres with high tensile strength, suitable for weaving into fabric. Poly(ethene) is too soft and floppy in its usual forms."},{"stem":"State the conditions needed for fermentation and explain why each is required.","A":"High temperature (80 °C) and an acid catalyst; these speed up the enzyme-catalysed reaction","B":"Temperature around 30 °C (enzymes work at optimum rate but are not denatured), absence of oxygen (anaerobic conditions produce ethanol), aqueous solution (enzymes and substrate must be dissolved), yeast (provides the enzymes)","C":"Temperature of 0 °C to slow decomposition of glucose, neutral pH, aerobic conditions","D":"High pressure and temperature of 200 °C with an aluminium oxide catalyst","correct":"B","explain":"Correct conditions: (1) ~30 °C, warm enough for yeast enzymes to work efficiently, but below the denaturation temperature (~40–50 °C); (2) anaerobic, without oxygen, yeast produces ethanol; with oxygen it fully respires to CO₂ and water, no ethanol; (3) aqueous solution, glucose must dissolve, and enzymes function in water; (4) yeast, contains the enzymes (biological catalysts) that are specific for converting glucose to ethanol. Each condition has a chemical or biological reason, not just a practical one."},{"stem":"An unknown compound X contains only C, H and O atoms. X reacts with bromine water, decolouring it. X also has a molecular formula of C₃H₆O. Suggest a possible structure for X and explain your reasoning.","A":"X is propanol (C₃H₈O), it reacts with bromine because alcohols decolourise bromine","B":"X is an unsaturated ketone or aldehyde with a C=C double bond, the C=C decolourises bromine; with 3 C, 6 H and 1 O, it could be propenol (CH₂=CHCH₂OH)","C":"X is propanoic acid (C₃H₆O₂), carboxylic acids decolourise bromine water","D":"X is propene (C₃H₆), it decolourises bromine, but this has no oxygen","correct":"B","explain":"X decolourises bromine water → it contains a C=C double bond. X has formula C₃H₆O, with one oxygen. A likely structure is prop-2-en-1-ol (allyl alcohol): CH₂=CH–CH₂OH. This has 3 C, 6 H, 1 O ✓ and contains a C=C double bond that reacts with Br₂ in an addition reaction, decolouring bromine water. The –OH group means it is also an alcohol. This is a Separate Chemistry reasoning question requiring integration of organic chemistry principles."},{"stem":"A student investigates how the surface area to volume ratio of a catalyst affects the rate of a reaction. They use 2 g of a solid catalyst in each experiment: (a) as a single 2 g cube; (b) as 8 small cubes of equal size; (c) as 64 even smaller cubes. Explain, with reference to SA:V ratio, why experiment (c) gives the fastest rate.","A":"In (c), the total mass of catalyst is highest, giving more catalyst particles overall","B":"In (c), the catalyst is divided into 64 small cubes, greatly increasing the total surface area relative to volume, more surface atoms are exposed as active sites, so more reactant molecules can simultaneously contact the catalyst, increasing the rate","C":"In (c), the smaller cubes react more vigorously and release more energy, increasing the temperature","D":"In (c), the catalyst is in solid form, which always reacts faster than liquids or gases","correct":"B","explain":"The total mass of catalyst (2 g) is the same in all three experiments. The total volume is also the same. But cutting the cube into 64 pieces multiplies the surface area by 64^(1/3) × 64^(1/3) = … more precisely, dividing a cube into n³ equal cubes increases surface area by a factor of n. Cutting into 64 small cubes (4³) increases SA:V by a factor of 4 relative to the single cube. More surface = more active sites where reactant molecules can adsorb and react. This directly links the nanoparticle principle (size controls SA:V controls reactivity) to a macro-scale experimental context."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
showCard(0);</script></body></html>
