<script>const QUESTIONS=[{"stem":"A student adds excess copper carbonate to dilute hydrochloric acid. Describe what they would observe and give the word equation for the reaction.","A":"The solution turns blue; word equation: acid + carbonate → salt + hydrogen","B":"Fizzing occurs and the green solid dissolves (with some excess remaining); word equation: acid + metal carbonate → salt + water + carbon dioxide","C":"The solution turns orange; word equation: acid + carbonate → metal + water + oxygen","D":"No observable change, copper carbonate does not react with acid","correct":"B","explain":"Acid + metal carbonate → salt + water + carbon dioxide. CO₂ causes fizzing (effervescence). Copper carbonate is a green solid, you would see the solid dissolving with fizzing, producing colourless copper chloride solution. Carbon dioxide gas can be confirmed by passing it through limewater, which turns milky."},{"stem":"A solution has pH 3. The concentration of H⁺ ions is increased by a factor of 10. What is the new pH?","A":"4","B":"30","C":"2","D":"1","correct":"C","explain":"The pH scale is logarithmic, a tenfold increase in [H⁺] causes a decrease of 1 in pH. Starting at pH 3, multiplying [H⁺] by 10 gives pH 2. This inverse relationship (more H⁺ = lower pH) is one of the most important Higher tier ideas in this topic."},{"stem":"Why does molten sodium chloride conduct electricity but solid sodium chloride does not?","A":"Molten NaCl contains more ions than solid NaCl","B":"Molten NaCl has a lower density than solid NaCl, making conduction easier","C":"In the solid, ions are fixed in the lattice and cannot move; in the molten state the lattice has broken down and ions are free to migrate towards the electrodes","D":"Solid NaCl contains covalent bonds that prevent conduction; molten NaCl forms ionic bonds","correct":"C","explain":"Conduction requires mobile charge carriers. In solid NaCl, Na⁺ and Cl⁻ ions are locked in a giant ionic lattice, they cannot move. Melting supplies enough energy to break down the lattice, freeing the ions. Mobile ions can then migrate to the electrodes and carry charge. The same principle applies to dissolving in water, ions become free to move."},{"stem":"Ethanoic acid (CH₃COOH) and hydrochloric acid are both at the same concentration (0.1 mol/dm³). The pH of the ethanoic acid solution is 3.0 but the pH of the HCl solution is 1.0. Explain why.","A":"Ethanoic acid is a stronger acid so it releases more H⁺ ions per molecule","B":"HCl is a weak acid so it releases fewer H⁺ ions; ethanoic acid is strong so it releases more","C":"HCl is a strong acid, it fully ionises to give many H⁺ ions (low pH); ethanoic acid is weak, it only partially ionises so fewer H⁺ ions are released (higher pH)","D":"Ethanoic acid has a higher molecular mass than HCl so fewer molecules fit in the same volume","correct":"C","explain":"Strength (degree of ionisation) and concentration are different. Both solutions have the same concentration (0.1 mol/dm³), but HCl fully ionises (strong acid) → high [H⁺] → pH 1. Ethanoic acid only partially ionises (weak acid) → lower [H⁺] at the same concentration → pH 3. This two-unit pH difference represents a 100-fold difference in [H⁺]."},{"stem":"A student electrolyses aqueous sodium chloride solution. At the cathode, hydrogen gas is produced rather than sodium. Explain why.","A":"Sodium ions do not carry enough charge to be discharged","B":"The cathode repels sodium ions because sodium is a metal","C":"At the cathode, H⁺ ions (from water) are preferentially discharged because hydrogen is less reactive than sodium, sodium ions remain in solution","D":"Sodium is liquid at room temperature so it cannot be deposited on the cathode","correct":"C","explain":"At the cathode, the ion discharged is whichever cation requires less energy, i.e. the less reactive metal or hydrogen. Sodium is very high in the reactivity series (very reactive), so Na⁺ ions are very difficult to discharge. H⁺ ions (present in water) are discharged instead, releasing hydrogen gas. Sodium only forms at the cathode when molten NaCl is electrolysed (no water present)."},{"stem":"During a titration, a student adds sodium hydroxide from a burette into a conical flask containing hydrochloric acid and phenolphthalein indicator. At the end point, the indicator changes from colourless to pink. Explain what has happened chemically at the end point.","A":"All the H⁺ ions have been removed from the solution and the NaOH has converted the acid into salt and water, at this exact point the solution becomes neutral then just alkaline","B":"The NaCl produced reacts with the indicator, changing its colour","C":"All the Na⁺ ions have been removed from solution, leaving only water","D":"The solution has become strongly acidic, which turns phenolphthalein pink","correct":"A","explain":"During the titration, H⁺ (from HCl) + OH⁻ (from NaOH) → H₂O. As long as excess H⁺ remains, the solution is acidic and phenolphthalein is colourless. At the equivalence point, all H⁺ has been neutralised. The very first drop of excess NaOH makes the solution faintly alkaline, turning phenolphthalein pink. This colour change marks the end point."},{"stem":"Copper sulfate solution is electrolysed with copper electrodes (not inert). The cathode gains mass but the anode loses mass. Explain these observations.","A":"The cathode gains copper by reduction of Cu²⁺ ions; the anode loses copper by oxidation, copper atoms dissolve from the anode to replace the Cu²⁺ ions deposited at the cathode","B":"Both electrodes gain mass because copper is deposited on both","C":"The cathode gains water molecules; the anode loses water molecules","D":"The anode loses mass because it reacts with sulfate ions; the cathode gains from hydrogen ions","correct":"A","explain":"At the cathode: Cu²⁺(aq) + 2e⁻ → Cu(s), copper is deposited, cathode gains mass. At the anode (copper): Cu(s) → Cu²⁺(aq) + 2e⁻, copper dissolves, anode loses mass. The Cu²⁺ concentration in solution stays constant. This is the principle of electroplating and copper refining, the anode acts as a copper source, and pure copper is deposited on the cathode."},{"stem":"A student uses universal indicator to test five solutions and records these pH values: 2, 6, 7, 9, 13. Which solution would turn universal indicator dark purple/violet?","A":"pH 2","B":"pH 6","C":"pH 7","D":"pH 13","correct":"D","explain":"Universal indicator is dark purple/violet at very high pH (strongly alkaline). pH 2 = red (strongly acidic); pH 6 = yellow/orange (weakly acidic); pH 7 = green (neutral); pH 9 = blue (weakly alkaline); pH 13 = dark purple/violet (strongly alkaline). The colour corresponds to the concentration of OH⁻ ions relative to H⁺ ions."},{"stem":"When dilute sulfuric acid reacts with zinc, a salt and a gas are produced. Name the salt, name the gas, and state how you would test for the gas.","A":"Salt = zinc chloride; gas = carbon dioxide; test with limewater","B":"Salt = zinc sulfate; gas = hydrogen; test with a lighted splint, squeaky pop","C":"Salt = zinc sulfate; gas = oxygen; test with a glowing splint, relights","D":"Salt = zinc oxide; gas = hydrogen; test with a lighted splint, squeaky pop","correct":"B","explain":"Acid + metal → salt + hydrogen. H₂SO₄ + Zn → ZnSO₄ + H₂. The salt is zinc sulfate (sulfuric acid gives sulfate salts). The gas is hydrogen, identified by the squeaky pop: collect the gas in a test tube and hold a lighted splint at the opening, hydrogen burns with a squeaky pop."},{"stem":"A solution has pH 11. What can you deduce about the concentration of H⁺ ions compared with a solution of pH 9?","A":"pH 11 has 100 times more H⁺ ions than pH 9","B":"pH 11 has 2 times fewer H⁺ ions than pH 9","C":"pH 11 has 100 times fewer H⁺ ions than pH 9","D":"pH 11 and pH 9 have the same H⁺ concentration, the difference is in OH⁻ only","correct":"C","explain":"Each unit increase in pH corresponds to a tenfold decrease in [H⁺]. From pH 9 to pH 11 is an increase of 2 units → [H⁺] decreases by a factor of 10 × 10 = 100. pH 11 has 100 times fewer H⁺ ions than pH 9. Both are alkaline solutions, but pH 11 is much more strongly alkaline."},{"stem":"Name the products formed at each electrode when aqueous sodium chloride is electrolysed with inert electrodes.","A":"Sodium at cathode; chlorine at anode","B":"Hydrogen at cathode; oxygen at anode","C":"Hydrogen at cathode; chlorine at anode","D":"Sodium at cathode; oxygen at anode","correct":"C","explain":"Cathode: H⁺ ions from water are preferentially discharged (sodium is too reactive): 2H⁺ + 2e⁻ → H₂. Anode: Cl⁻ ions are preferentially discharged over OH⁻ when Cl⁻ concentration is high: 2Cl⁻ → Cl₂ + 2e⁻. This is the chlor-alkali process, important industrially for producing hydrogen, chlorine and (from the remaining NaOH solution) sodium hydroxide."},{"stem":"A student adds magnesium oxide to excess hydrochloric acid and the solid slowly dissolves. Explain why, and give the balanced symbol equation.","A":"MgO is an acid that reacts with HCl to form a gas; equation: MgO + HCl → MgCl + H₂","B":"MgO is a base (metal oxide) that reacts with HCl; the Mg²⁺ and Cl⁻ ions form magnesium chloride and H⁺ combines with O²⁻ to form water; equation: MgO + 2HCl → MgCl₂ + H₂O","C":"MgO dissolves because magnesium is a reactive metal; equation: Mg + 2HCl → MgCl₂ + H₂","D":"HCl converts MgO into an oxide of chlorine; equation: MgO + Cl₂ → MgCl₂ + O","correct":"B","explain":"Metal oxides are bases. MgO accepts H⁺ from the acid: O²⁻ + 2H⁺ → H₂O. Mg²⁺ combines with Cl⁻ to form MgCl₂. Balanced equation: MgO(s) + 2HCl(aq) → MgCl₂(aq) + H₂O(l). The solid gradually disappears, a visual sign that the base is being consumed."},{"stem":"An acid has a concentration of 0.1 mol/dm³ and pH 1. A second sample of the same acid at the same concentration has pH 3. What does this tell you about the two acids?","A":"The pH 1 sample is more concentrated than the pH 3 sample","B":"They are the same acid, the pH difference is due to measurement error","C":"The pH 1 acid fully ionises (strong acid); the pH 3 acid only partially ionises (weak acid), the same concentration gives different [H⁺] because of different degrees of ionisation","D":"The pH 1 acid has more water in it, diluting the H⁺ ions","correct":"C","explain":"Both samples have the same concentration (same number of acid molecules per dm³), but one gives pH 1 and the other pH 3. A two-unit pH difference means 100-fold more H⁺ in the pH 1 sample. The only explanation is that the pH 1 acid is strong (fully ionises → maximum H⁺) while the pH 3 acid is weak (partially ionises → fewer H⁺)."},{"stem":"What happens to the pH of an acid solution as it is gradually neutralised by adding sodium hydroxide?","A":"pH stays constant until the end point, then drops suddenly","B":"pH rises gradually from below 7 towards 7 at the equivalence point, then continues to rise above 7 if excess alkali is added","C":"pH drops steadily as more NaOH is added","D":"pH oscillates between acidic and alkaline values","correct":"B","explain":"At the start, excess H⁺ ions keep the pH low. As NaOH is added, OH⁻ ions neutralise H⁺ (H⁺ + OH⁻ → H₂O), reducing [H⁺] and raising the pH. At the equivalence point, all H⁺ is neutralised (pH = 7 for a strong acid-strong base). Adding excess NaOH beyond the equivalence point introduces excess OH⁻, raising pH above 7."},{"stem":"Chlorine gas is produced at the anode during electrolysis of brine (sodium chloride solution). Write the half-equation for this process and state whether it is oxidation or reduction.","A":"2Cl⁻ → Cl₂ + 2e⁻; this is oxidation","B":"Cl₂ + 2e⁻ → 2Cl⁻; this is reduction","C":"2Cl⁻ + 2e⁻ → Cl₂; this is oxidation","D":"2H⁺ + 2e⁻ → H₂; this is reduction","correct":"A","explain":"At the anode (positive electrode), Cl⁻ ions are attracted and lose electrons: 2Cl⁻ → Cl₂ + 2e⁻. Loss of electrons = oxidation. The anode is always the site of oxidation. The electrons released travel through the external circuit to the cathode. Remember: OIL RIG, Oxidation Is Loss of electrons; Reduction Is Gain of electrons."},{"stem":"A student tests the pH of a rainwater sample and gets pH 5. Is this evidence that the rain is acid rain? Explain your reasoning.","A":"No, pH 5 is alkaline, so it is not acid rain","B":"No, normal rainwater has a natural pH of around 5–6 due to dissolved CO₂ forming carbonic acid; acid rain caused by pollution typically has pH below 5","C":"Yes, any pH below 7 is caused by industrial pollution and counts as acid rain","D":"Yes, pH 5 is well below neutral, so it must be caused by sulfur dioxide from power stations","correct":"B","explain":"Normal (unpolluted) rainwater has a pH of around 5.6 because atmospheric CO₂ dissolves to form weak carbonic acid (H₂CO₃). This is not acid rain. Acid rain, caused by SO₂ and NO₂ from burning fossil fuels, typically has pH below 5, sometimes as low as 2 or 3. A pH of 5 alone is not sufficient evidence of acid rain."},{"stem":"Ammonia (NH₃) acts as a base in water. Explain why it is classified as a base, even though it contains no OH⁻ groups.","A":"Ammonia is basic because it contains nitrogen, which is always basic","B":"Ammonia dissolves in water and reacts with it: NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, it produces OH⁻ ions indirectly, making the solution alkaline","C":"Ammonia is basic because it reacts with oxygen in the air to release OH⁻ ions","D":"Ammonia does not act as a base, it is a neutral gas","correct":"B","explain":"Bases are substances that can neutralise acids. Ammonia does this by reacting with water to produce OH⁻ ions: NH₃(g) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq). The OH⁻ ions give ammonia solution its alkaline character. The equilibrium lies to the left, ammonia is a weak base (partial reaction with water). The resulting solution (ammonium hydroxide) has a pH above 7."},{"stem":"A student electrolyses dilute sulfuric acid with inert platinum electrodes. What is produced at each electrode?","A":"Hydrogen at cathode; sulfur trioxide at anode","B":"Hydrogen at cathode; oxygen at anode","C":"Sulfur at cathode; oxygen at anode","D":"Oxygen at cathode; hydrogen at anode","correct":"B","explain":"In dilute sulfuric acid, H⁺ ions are present (from ionisation of H₂SO₄ and from water). Cathode: 2H⁺ + 2e⁻ → H₂ (hydrogen gas). Anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻ (OH⁻ from water discharge → oxygen gas). Sulfate ions (SO₄²⁻) are not discharged. Twice as much hydrogen is produced as oxygen, matching the 2:1 ratio in water (H₂O)."},{"stem":"What is the purpose of adding excess insoluble base (e.g. copper oxide) when preparing a soluble salt such as copper sulfate from dilute sulfuric acid?","A":"Excess base ensures the reaction goes to completion and all the acid is neutralised; the excess solid is then removed by filtration, giving a pure salt solution","B":"Excess base increases the temperature of the reaction, speeding it up","C":"Excess base prevents the copper sulfate from crystallising too quickly","D":"Excess base changes the colour of the solution to show the reaction is complete","correct":"A","explain":"Adding excess insoluble base guarantees that all the acid is consumed, so no acid remains in the final product. Because the base is insoluble and the salt is soluble, the excess base can be removed by filtration, leaving a pure solution of copper sulfate. Evaporation/crystallisation then recovers the pure blue crystals."},{"stem":"Describe what happens to ions at each electrode when molten lead(II) bromide (PbBr₂) is electrolysed. Include the half-equations.","A":"Cathode: Pb²⁺ + 2e⁻ → Pb; Anode: 2Br⁻ → Br₂ + 2e⁻","B":"Cathode: 2Br⁻ → Br₂ + 2e⁻; Anode: Pb²⁺ + 2e⁻ → Pb","C":"Cathode: Pb²⁺ − 2e⁻ → Pb; Anode: 2Br⁻ + 2e⁻ → Br₂","D":"Cathode: Pb²⁺ + 2e⁻ → Pb; Anode: Br₂ + 2e⁻ → 2Br⁻","correct":"A","explain":"Cathode (negative): Pb²⁺ ions are attracted and each gains two electrons → reduced to lead metal: Pb²⁺ + 2e⁻ → Pb(l). Anode (positive): Br⁻ ions are attracted and each loses an electron → oxidised to bromine gas: 2Br⁻ → Br₂(g) + 2e⁻. Molten ionic compounds contain only the ions of the compound, no water, so the products are predictably the constituent elements."}];var cur=0,flipped=false;
var order=QUESTIONS.map(function(_,i){return i;});
function showCard(idx){
  cur=idx;
  var q=QUESTIONS[order[idx]];
  document.getElementById('card-q').innerHTML=q.stem;
  document.getElementById('card-ans').innerHTML='<strong>'+q.correct+'.</strong> '+q[q.correct];
  document.getElementById('card-ex').textContent=q.explain;
  document.getElementById('counter').textContent=(idx+1)+' / '+QUESTIONS.length;
  document.getElementById('card').classList.remove('flipped');
  flipped=false;
  document.getElementById('btn-prev').disabled=(cur===0);
  document.getElementById('btn-next').disabled=(cur===order.length-1);
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped');}
document.getElementById('card').addEventListener('click',flip);
document.getElementById('btn-prev').addEventListener('click',function(){if(cur>0)showCard(cur-1);});
document.getElementById('btn-next').addEventListener('click',function(){if(cur<order.length-1)showCard(cur+1);});
document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  showCard(0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){if(cur<order.length-1)showCard(cur+1);}
  else if(e.key==='ArrowLeft'){if(cur>0)showCard(cur-1);}
  else if(e.key===' '){e.preventDefault();flip();}
});
