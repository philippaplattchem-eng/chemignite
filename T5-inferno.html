<head>

<title>T5 Inferno &mdash; Separate Chemistry 1</title>
<style>:root{--pr:#3f51b5;--pr-dk:#283593;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(63,81,181,.10);--sh2:0 6px 24px rgba(63,81,181,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}

/* ── quiz-page header ── */
.site-header{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}

/* ── landing hero ── */
.hero{background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDQiPjxwb2x5Z29uIHBvaW50cz0iMzAsMiA1OCwxNyA1OCw0NyAzMCw2MiAyLDQ3IDIsMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwuMDcpIiBzdHJva2Utd2lkdGg9IjEuNCIvPjxwb2x5Z29uIHBvaW50cz0iMCw1NCAyOCw2OSAyOCw5OSAwLDExNCAtMjgsOTkgLTI4LDY5IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsLjA3KSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48cG9seWdvbiBwb2ludHM9IjYwLDU0IDg4LDY5IDg4LDk5IDYwLDExNCAzMiw5OSAzMiw2OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LC4wNykiIHN0cm9rZS13aWR0aD0iMS40Ii8+PC9zdmc+") center/60px 104px repeat,linear-gradient(135deg,#0d1b3e 0%,#1a2f6e 45%,#3f51b5 80%,#5c6bc0 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center}
.hero-icon{font-size:2.8rem;margin-bottom:.6rem;display:block}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.88;max-width:480px;margin:0 auto .5rem}
.hero-pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
.hero-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:600}

/* ── tier legend ── */
.tier-legend{display:flex;gap:0;max-width:700px;margin:1.8rem auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tier-leg-item{flex:1;padding:.85rem 1rem;text-align:center;border-right:1px solid var(--bdr)}
.tier-leg-item:last-child{border-right:none}
.tl-name{font-weight:700;font-size:.9rem;margin-bottom:.15rem}
.tl-desc{font-size:.78rem;color:var(--txm)}
.tl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.tl-dot.spark{background:var(--sp)}.tl-dot.flame{background:var(--fl)}.tl-dot.inferno{background:var(--inf)}

/* ── topic grid ── */
.topics-section{max-width:960px;margin:2rem auto 4rem;padding:0 1.2rem}
.topics-heading{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txm);margin-bottom:1rem;padding-left:.2rem}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.topic-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tc-top{padding:1.1rem 1.2rem .9rem;flex:1}
.tc-num{display:inline-block;background:var(--pr);color:#fff;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:6px;letter-spacing:.05em;margin-bottom:.55rem}
.tc-name{font-weight:700;font-size:.95rem;line-height:1.4;color:var(--tx)}
.tc-btns{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1.1rem 1.1rem}
.tc-btn{display:flex;align-items:center;justify-content:flex-start;gap:.45rem;padding:.55rem .9rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;color:#fff;transition:filter .15s,transform .1s}
.tc-btn:hover{filter:brightness(1.1);transform:translateX(2px)}
.tc-btn.spark{background:var(--sp)}.tc-btn.flame{background:var(--fl)}.tc-btn.inferno{background:var(--inf)}

/* ── quiz page ── */
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d1b3e,#1a2f6e 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(63,81,181,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(63,81,181,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:700px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}.hero h1{font-size:1.5rem}.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}.tier-legend{flex-direction:column}.tier-leg-item{border-right:none;border-bottom:1px solid var(--bdr)}.tier-leg-item:last-child{border-bottom:none}}.hero{position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(92,107,192,.35) 0%,transparent 70%);pointer-events:none}.hero h1,.hero p,.hero-icon,.hero-pills,.hero-sub,.tier-legend{position:relative;z-index:1}</style>

<script>
const QUESTIONS=[{"stem":"Iron is used in construction despite its tendency to rust. Evaluate three methods of preventing rusting, considering cost, practicality and effectiveness.","A":"Only galvanising is effective, the other methods fail when the coating is damaged","B":"Painting: cheap, easy to apply, but must be maintained, if chipped, unprotected iron rusts quickly. Galvanising (zinc coating): provides both barrier and sacrificial protection, zinc corrodes first even if scratched, making it very effective; used for outdoor metalwork. Sacrificial blocks: very effective for large structures (ships, oil pipelines) where zinc or magnesium blocks are attached; must be replaced periodically","C":"Tin plating is the best method because tin is more reactive than iron","D":"The only fully effective method is alloying iron with chromium to make stainless steel","correct":"B","explain":"Painting: inexpensive, widely used, but provides only a physical barrier, any chip exposes iron. Galvanising (zinc coat): provides barrier AND sacrificial protection (zinc higher in reactivity series than iron corrodes first, protecting iron even if scratched) → excellent for outdoor use (fencing, guttering). Sacrificial protection (attached zinc/magnesium blocks): ideal for large immersed structures (ships, pipelines), electrochemical protection extends over a wide area; blocks replaced when consumed. Stainless steel: most expensive but self-repairing Cr₂O₃ layer makes it virtually maintenance-free for cutlery and medical instruments."},{"stem":"Calculate the mass of calcium carbonate needed to produce 2.4 dm³ of CO₂ at RTP, given the equation: CaCO₃ → CaO + CO₂. (CaCO₃ Mr = 100; molar volume = 24 dm³/mol)","A":"24 g","B":"10 g","C":"4.8 g","D":"100 g","correct":"B","explain":"Moles CO₂ = volume ÷ molar volume = 2.4 ÷ 24 = 0.1 mol. From equation: 1 mol CaCO₃ → 1 mol CO₂ (1:1 ratio). Moles CaCO₃ = 0.1 mol. Mass CaCO₃ = 0.1 × 100 = 10 g. Multi-step: gas volume → moles → use ratio → moles of solid → mass."},{"stem":"A student carries out a titration to find the concentration of an unknown HNO₃ solution. They pipette 25.0 cm³ of KOH (0.200 mol/dm³) into a conical flask, then titrate with HNO₃. Their concordant titres are 18.6 cm³ and 18.5 cm³. Calculate the concentration of the HNO₃.","A":"0.268 mol/dm³","B":"0.200 mol/dm³","C":"0.214 mol/dm³","D":"0.135 mol/dm³","correct":"A","explain":"Mean titre = (18.6 + 18.5) ÷ 2 = 18.55 cm³. Moles KOH = 0.200 × (25.0/1000) = 0.005 mol. Equation: HNO₃ + KOH → KNO₃ + H₂O (1:1). Moles HNO₃ = 0.005 mol. Concentration HNO₃ = 0.005 ÷ (18.55/1000) = 0.005 ÷ 0.01855 = 0.2695 ≈ 0.269 mol/dm³. Note: answer may vary slightly depending on rounding, accept 0.27 mol/dm³."},{"stem":"Two industrial routes to ethanol are compared: Route A: C₂H₄ + H₂O → C₂H₅OH (atom economy 100%, yield 5%); Route B: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ (atom economy ~51%, yield ~90%). Evaluate which route is preferable for industrial production, considering atom economy, yield and sustainability.","A":"Route A is always better because of its 100% atom economy","B":"Route B is always better because of its 90% yield","C":"Both routes have advantages and disadvantages, Route A (hydration of ethene) has 100% atom economy but 5% yield per pass (ethene is recycled; uses ethene from crude oil, non-renewable). Route B (fermentation) has only ~51% atom economy (CO₂ wasted) but 90% yield and uses renewable sugar crops, more sustainable feedstock","D":"Neither route is suitable, ethanol cannot be made industrially","correct":"C","explain":"Route A (hydration of ethene): 100% atom economy; ethene recycled so overall yield acceptable; continuous process (faster); but ethene comes from crude oil (non-renewable). Route B (fermentation): 90% yield; renewable sugar feedstock (sustainable); batch process (slower); CO₂ byproduct (51% atom economy); requires purification (dilute 12% ethanol needs distillation). Industry uses Route A where speed and purity matter most; Route B is preferred where sustainability/renewability is the priority. Neither is universally \"better\", context determines choice."},{"stem":"Calculate the number of moles of gas produced and the total volume at RTP when 10 g of calcium carbonate completely decomposes. CaCO₃ → CaO + CO₂. (CaCO₃ = 100, molar volume = 24 dm³/mol)","A":"0.1 mol; 2.4 dm³","B":"1.0 mol; 24 dm³","C":"0.1 mol; 24 dm³","D":"10 mol; 240 dm³","correct":"A","explain":"Moles CaCO₃ = 10 ÷ 100 = 0.1 mol. Equation: 1:1 ratio → moles CO₂ = 0.1 mol. Volume = 0.1 × 24 = 2.4 dm³. Only CO₂ is a gas product (CaO is a solid). Molar volume only applies to gases, never to solids or liquids in the product mixture."},{"stem":"A student produces iron(III) chloride by reacting iron with chlorine: 2Fe + 3Cl₂ → 2FeCl₃. They use 5.6 g of iron (Fe = 56) and obtain 10.83 g of FeCl₃ (Mr = 162.5). Calculate the theoretical yield and the percentage yield.","A":"Theoretical = 16.25 g; % yield = 66.6%","B":"Theoretical = 8.125 g; % yield = 133%","C":"Theoretical = 16.25 g; % yield = 66.7%","D":"Theoretical = 9.125 g; % yield = 118%","correct":"C","explain":"Moles Fe = 5.6 ÷ 56 = 0.1 mol. Equation: 2Fe → 2FeCl₃ (1:1 ratio). Moles FeCl₃ (theoretical) = 0.1 mol. Theoretical yield = 0.1 × 162.5 = 16.25 g. % yield = (10.83 ÷ 16.25) × 100 = 66.6%. The student lost approximately 33% of the theoretical product, perhaps due to the volatile chlorine not fully reacting or losses during transfer."},{"stem":"Evaluate the use of hydrogen fuel cells compared with petrol engines for powering vehicles, considering energy efficiency, environmental impact, and practical limitations.","A":"Fuel cells are better in every respect, they should completely replace petrol engines","B":"Fuel cells: highly efficient (convert chemical energy to electrical energy directly, ~60% efficient vs ~25% for petrol engines); no CO₂ emissions during use (only water produced); but: hydrogen storage is difficult and potentially dangerous, hydrogen currently mostly produced from natural gas (releasing CO₂), limited refuelling infrastructure; petrol engines: well-established infrastructure, energy-dense fuel, but CO₂ emissions contribute to climate change","C":"Petrol engines are better because they produce CO₂, which plants use for photosynthesis","D":"Fuel cells are better only for commercial vehicles; petrol engines are better for private cars","correct":"B","explain":"Fuel cell advantages: higher efficiency (~60% vs ~25%); zero CO₂ during operation (only water emitted); no combustion → quieter and fewer particulates. Disadvantages: hydrogen currently 96% produced from fossil fuels (grey hydrogen) → significant upstream CO₂; hydrogen is highly flammable and must be stored at very high pressure; limited refuelling network. For full environmental benefit, hydrogen must be produced by electrolysis powered by renewable electricity (green hydrogen). Fuel cells are ideal for the future but face practical infrastructure and production challenges now."},{"stem":"Compare atom economy and percentage yield as measures of industrial efficiency. In what situations might each be the more important factor?","A":"They are the same measurement, one is just expressed differently","B":"Atom economy is a theoretical measure fixed by the balanced equation, it tells you the maximum fraction of reactant atoms that can become desired product; percentage yield is a practical measure, it tells you how much of the theoretical maximum you actually achieved in the experiment. Atom economy matters when choosing between reactions (design stage); yield matters when optimising conditions for a chosen reaction","C":"Atom economy measures environmental impact; yield measures economic cost, they cannot be compared","D":"Yield is always more important than atom economy because you can improve yield but not atom economy","correct":"B","explain":"Atom economy is determined by the balanced equation, it is the same regardless of how well you run the reaction. It guides choice of reaction pathway. Percentage yield measures practical efficiency, how well you ran the chosen reaction under specific conditions. Both matter: a route with 100% atom economy but 5% yield wastes most reactants as unreacted starting material; a route with 90% yield but 30% atom economy produces large amounts of waste. Industrial chemists optimise both."},{"stem":"A chemist wants to make magnesium sulfate (MgSO₄) by two routes: Route A: MgO + H₂SO₄ → MgSO₄ + H₂O (Mr MgO=40, H₂SO₄=98, MgSO₄=120, H₂O=18); Route B: Mg + H₂SO₄ → MgSO₄ + H₂ (Mr Mg=24, H₂=2). Calculate the atom economy of each route for MgSO₄ production and identify which is more atom-efficient.","A":"Route A: 86%; Route B: 98%; Route B is more atom-efficient","B":"Route A: 50%; Route B: 98%; Route B is more atom-efficient","C":"Route A: 86%; Route B: 60%; Route A is more atom-efficient","D":"Both routes have 100% atom economy","correct":"A","explain":"Route A: sum of all products = 120 + 18 = 138. AE = (120/138) × 100 = 87.0% ≈ 87%. Route B: sum of all products = 120 + 2 = 122. AE = (120/122) × 100 = 98.4% ≈ 98%. Route B (using Mg metal) is more atom-efficient because H₂ has much lower Mr than H₂O as a byproduct, fewer atoms are wasted. However, Mg is more expensive and reactive than MgO, so other factors must also be considered."},{"stem":"Describe the full process of electroplating a steel spoon with silver, explaining the role of each component and what happens at each electrode.","A":"Spoon (cathode): Ag⁺ + e⁻ → Ag (silver deposits); Silver anode: Ag → Ag⁺ + e⁻ (silver dissolves); Electrolyte: silver nitrate solution (source of Ag⁺ ions); DC supply: drives ions in correct direction","B":"Spoon (anode): silver deposits; Silver (cathode): iron dissolves into solution","C":"Spoon (cathode): Fe²⁺ ions are released; Silver anode: silver ions are absorbed","D":"Either AC or DC can be used; the spoon can be either electrode","correct":"A","explain":"Cathode (spoon, connected to negative terminal): Ag⁺(aq) + e⁻ → Ag(s), silver ions from solution are reduced and deposited as a thin, even silver layer on the spoon surface. Anode (silver, connected to positive terminal): Ag(s) → Ag⁺(aq) + e⁻, silver atoms in the anode are oxidised and dissolve into solution, replacing the Ag⁺ ions used at the cathode. Electrolyte: silver nitrate solution provides Ag⁺ ions and allows ion migration. DC supply: essential to maintain fixed electrode identities and direction of ion flow. The concentration of Ag⁺ in solution stays approximately constant throughout."},{"stem":"Explain, using both the particle model and the concept of metallic bonding, why pure aluminium is too soft for aircraft construction and why the alloy duralumin (Al + 4% Cu) is used instead.","A":"Pure Al has strong covalent bonds; duralumin has weaker ionic bonds, allowing it to be shaped more easily","B":"Pure Al has regularly spaced identical atoms, layers can slide easily (malleable, soft); duralumin contains Cu atoms of different size that disrupt the regular layers, preventing sliding and dramatically increasing strength and hardness, while the metallic bonding (delocalised electrons) is maintained, keeping good conductivity and ductility","C":"Pure Al reacts with oxygen in air, weakening it; Cu in duralumin prevents oxidation","D":"Duralumin is lighter than pure aluminium, which is why it is used in aircraft","correct":"B","explain":"Pure Al: all atoms same size → regular close-packed layers → layers slide easily under stress → soft, easily deformed (malleable). Not strong enough for structural aircraft use. Duralumin: copper atoms (different size and electronic structure) inserted into aluminium lattice → layers no longer regular → much harder to slide → greatly increased strength and hardness. Metallic bonding (sea of delocalised electrons) is maintained → still good thermal and electrical conductivity, and still ductile enough to be shaped. Weight is similar to pure Al, making duralumin ideal for aerospace."},{"stem":"A student measures the volume of H₂ produced in a reaction between zinc and excess hydrochloric acid. They collect 240 cm³ of gas at RTP. Calculate the mass of zinc that reacted. Zn + 2HCl → ZnCl₂ + H₂ (Zn = 65, molar volume = 24 dm³)","A":"0.65 g","B":"6.5 g","C":"0.975 g","D":"15.6 g","correct":"A","explain":"Volume H₂ = 240 cm³ = 0.240 dm³. Moles H₂ = 0.240 ÷ 24 = 0.01 mol. Mole ratio Zn : H₂ = 1 : 1. Moles Zn = 0.01 mol. Mass Zn = 0.01 × 65 = 0.65 g. Working backwards from gas volume to mass of solid is a common multi-step calculation: volume → moles (÷ molar volume) → mole ratio → moles of solid → mass (× Mr)."},{"stem":"A chemist needs to choose between two methods of making sodium sulfate: Method A: Na₂CO₃ + H₂SO₄ → Na₂SO₄ + H₂O + CO₂; Method B: 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O. (Mr: Na₂SO₄ = 142, H₂O = 18, CO₂ = 44, Na₂CO₃ = 106, NaOH = 40) Calculate the atom economy of each method for Na₂SO₄ and identify the more atom-efficient route.","A":"A = 69%; B = 80%; B is more efficient","B":"A = 80%; B = 69%; A is more efficient","C":"A = 100%; B = 100%; both are equally efficient","D":"A = 69%; B = 69%; both are equally efficient","correct":"A","explain":"Method A: products = Na₂SO₄ + H₂O + CO₂. Sum Mr = 142 + 18 + 44 = 204. AE = (142/204) × 100 = 69.6% ≈ 70%. Method B: products = Na₂SO₄ + 2H₂O. Sum Mr = 142 + (2×18) = 142 + 36 = 178. AE = (142/178) × 100 = 79.8% ≈ 80%. Method B is more atom-efficient because its only byproduct (water) has a small Mr, wasting fewer atoms."},{"stem":"A student titrates 20.0 cm³ of Ca(OH)₂ solution with 0.100 mol/dm³ HCl. The mean titre is 28.0 cm³. Calculate the concentration of the Ca(OH)₂ solution. Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O","A":"0.100 mol/dm³","B":"0.070 mol/dm³","C":"0.140 mol/dm³","D":"0.050 mol/dm³","correct":"B","explain":"Moles HCl = 0.100 × (28.0/1000) = 0.0028 mol. Equation: Ca(OH)₂ : HCl = 1 : 2. Moles Ca(OH)₂ = 0.0028 ÷ 2 = 0.0014 mol. Concentration Ca(OH)₂ = 0.0014 ÷ (20.0/1000) = 0.0014 ÷ 0.020 = 0.070 mol/dm³. The 1:2 mole ratio (one Ca(OH)₂ neutralises two HCl) is the critical step, missing the ÷2 gives twice the correct answer."},{"stem":"Evaluate the properties of transition metals that make them essential in modern industry, giving three specific examples of transition metals as catalysts or structural materials.","A":"Transition metals are only useful as catalysts; they have no structural applications","B":"Transition metals combine high melting point (structural applications at high temperatures), high density (important for small, heavy components), coloured compounds (indicators/pigments), and catalytic activity (accelerating reactions). Examples: iron, structural steel for buildings/bridges and Haber process catalyst; copper, electrical wiring (excellent conductor) and copper pipes; titanium, aircraft and medical implants (strong, light, corrosion-resistant); platinum/palladium, catalytic converters in vehicle exhausts; chromium, stainless steel for corrosion resistance","C":"Transition metals are only useful because they form alloys, their pure forms have no industrial use","D":"Transition metals are only used in the chemical industry as catalysts","correct":"B","explain":"High melting point → structural uses at elevated temperatures (iron in engines, tungsten in light bulb filaments). High density → radiation shielding (lead). Coloured compounds → pigments (titanium dioxide white paint, iron oxide red pigment). Catalytic activity → iron (Haber process), vanadium pentoxide (sulfuric acid production), platinum/rhodium (catalytic converters). Transition metals' variable oxidation states allow them to form temporary bonds with reactants, making them versatile catalysts. Their combination of properties makes them indispensable across many industries."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect — correct answer: <strong>'+q.correct+'</strong>':'Not answered — correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks — excellent work!':score>=Math.round(total*0.7)?'Good work — check the explanations for any you missed.':'Keep practising — work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'% — '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
