<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.4 Thermodynamics | Chemistry Cracked</title>
<style>:root{--pr:#2d6a4f;--pr-dk:#1b4332;--sp:#40916c;--fl:#2d6a4f;--inf:#1b4332;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(45,106,79,.10);--sh2:0 6px 24px rgba(45,106,79,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}.tier-badge.mcq{background:#52b788}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px;display:none}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#0d2e1e,#1b4332 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(45,106,79,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="alevel-practice.html" class="back-link">&larr; All Topics</a>
  <h1>5.4 Thermodynamics</h1>
  <span class="tier-badge spark">&#x1F525; Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>10 questions</span>
    <span>Spark: Recall &amp; definitions</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[{"stem":"Using the OCR convention, lattice enthalpy (ΔLEH) is defined as the enthalpy change when:","A":"One mole of an ionic compound dissociates into its constituent gaseous ions","B":"One mole of an ionic solid is formed from its constituent gaseous ions under standard conditions","C":"One mole of an ionic compound dissolves in a large excess of water","D":"One mole of gaseous atoms combine to form one mole of an ionic compound","correct":"B","explain":"OCR uses the <b>lattice formation</b> convention: gaseous ions → solid ionic lattice. This is always <b>exothermic</b> (ΔH negative). State symbols are essential: ions must be gaseous (g) and the product must be solid (s). Option A is the <b>lattice dissociation</b> enthalpy — the reverse process, which is endothermic; some older textbooks use this convention but OCR does not. Option C describes the enthalpy of solution. Option D describes the enthalpy of atomisation (for a metal) — a different term entirely. When writing the equation for ΔLEH of NaCl: Na⁺(g) + Cl⁻(g) → NaCl(s), state symbols are non-negotiable."},{"stem":"Which of the following enthalpy changes is always endothermic?","A":"Lattice enthalpy (formation)","B":"First electron affinity","C":"Enthalpy change of hydration","D":"Standard enthalpy of atomisation","correct":"D","explain":"The standard enthalpy of atomisation (ΔatH) is <b>always endothermic</b> because it involves breaking bonds in the element in its standard state to produce gaseous atoms — energy must be supplied. Options A and C (lattice enthalpy formation and hydration enthalpy) are always <b>exothermic</b>: both involve new attractions forming between oppositely charged species. Option B (first electron affinity) is also exothermic: the effective nuclear charge of the neutral atom attracts the incoming electron and releases energy on gain of the first electron. Only the <b>second</b> (and higher) electron affinity is endothermic, because it involves adding an electron to an already-negative ion, requiring energy to overcome electron–electron repulsion."},{"stem":"Which correctly ranks the standard molar entropy of water in its three phases at 298 K?","A":"S°(liquid) > S°(gas) > S°(solid)","B":"S°(solid) > S°(liquid) > S°(gas)","C":"S°(gas) >> S°(liquid) > S°(solid)","D":"S°(gas) > S°(solid) > S°(liquid)","correct":"C","explain":"The correct order is <b>S°(gas) >> S°(liquid) > S°(solid)</b>. In a gas, particles can occupy any position in the container with access to many translational, rotational and vibrational energy levels — the number of accessible arrangements is enormous, so entropy is very high (typically 130–250 J K⁻¹ mol⁻¹). In a liquid, particles can move past each other but remain in close contact — entropy is intermediate (70–200 J K⁻¹ mol⁻¹). In a solid, particles are locked into a lattice and can only vibrate about fixed positions — very few arrangements are accessible and entropy is low (30–100 J K⁻¹ mol⁻¹). The double \">>\" between gas and liquid reflects the vast gap created by the freedom of translation in the gas phase. A perfect crystal at 0 K has S = 0 (Third Law)."},{"stem":"A reaction is thermodynamically feasible when:","A":"ΔG is positive","B":"ΔG equals zero","C":"ΔG is negative","D":"ΔH is negative","correct":"C","explain":"A reaction is feasible (spontaneous in the thermodynamic sense) when <b>ΔG < 0</b>. When ΔG > 0, the reverse reaction is feasible. When ΔG = 0, the system is at equilibrium. Option D (ΔH negative) is a necessary but not sufficient condition — many endothermic reactions are feasible at high temperatures because the TΔS term can overcome a positive ΔH. The full criterion is ΔG = ΔH − TΔS < 0, so both the sign of ΔH and the magnitude of TΔS must be considered. Stating \"exothermic\" as the criterion for feasibility is incomplete and loses marks in examination answers. (H432/01 June 2022 mark scheme required explicit statement of \"ΔG is negative\" to justify feasibility.)"},{"stem":"The first electron affinity of chlorine is exothermic because:","A":"A Cl–Cl bond forms when the electron is added","B":"The effective nuclear charge of the Cl atom attracts the incoming electron, releasing energy as new attraction forms","C":"Chlorine's outer shell becomes full, lowering its energy by achieving a noble-gas configuration","D":"The electron enters an already-occupied orbital, releasing energy through pairing","correct":"B","explain":"The first electron affinity is exothermic because the effective nuclear charge (net positive charge felt by the outer electrons after shielding) <b>attracts the incoming electron</b> — a new attractive interaction forms, and bond/attraction formation always releases energy. Option C (achieving noble-gas configuration) is a commonly cited but incorrect reason — the energy change comes from the electrostatic attraction, not from \"completing the shell\" as such. Option D mistakes electron pairing (which costs energy from inter-electron repulsion) for the main effect. Option A is wrong — no covalent bond forms; the electron is added to an isolated gaseous atom. The <b>second</b> electron affinity of oxygen (O⁻ + e⁻ → O²⁻) is endothermic because the repulsion from the existing negative charge dominates over the nuclear attraction."},{"stem":"When ΔH is negative and ΔS is negative, the reaction is feasible:","A":"At all temperatures","B":"Only at low temperatures","C":"Only at high temperatures","D":"Never","correct":"B","explain":"ΔG = ΔH − TΔS. When ΔH is negative and ΔS is negative: −TΔS is positive (because −(negative × negative) = positive). At low T, the −TΔS term is small, so the favourable negative ΔH dominates and ΔG is negative (feasible). As T rises, −TΔS grows and eventually ΔG becomes positive — the reaction ceases to be feasible. The threshold temperature is T = ΔH/ΔS. Examples of this case include condensation of steam (large negative ΔH, negative ΔS because gas→liquid) and the formation of ammonia (Haber process, exothermic with decrease in moles of gas). This is the \"Case B\" scenario: feasible only below T_threshold."},{"stem":"Going down Group 1 from Li⁺ to Cs⁺, the enthalpy of hydration becomes:","A":"Less exothermic because the ionic radius increases, reducing the electrostatic attraction to water molecules","B":"More exothermic because larger ions can accommodate more water molecules in their hydration sphere","C":"Unchanged because all Group 1 cations carry the same +1 charge","D":"Less exothermic because the ionisation energy decreases down the group","correct":"A","explain":"ΔhydH becomes <b>less exothermic</b> (less negative) down Group 1 because the <b>ionic radius increases</b> (Li⁺: 76 pm → Cs⁺: 167 pm). Larger ions have lower charge density, so the electrostatic attraction between the cation and the δ⁻ oxygen of water molecules is weaker — less energy is released when the hydration shell forms. The charge (+1) is the same throughout, so option C is wrong: charge is not the differentiating factor here, radius is. Option D incorrectly invokes ionisation energy — this is about removing electrons from an atom and has no bearing on hydration. Option B confuses size with attraction strength: larger ions attract water less strongly even if the geometry of the hydration sphere changes. (H432/01 Nov 2021: \"ionic radius is incorrect in this context\" — always specify <b>ionic</b> radius, not atomic radius.)"},{"stem":"The second electron affinity of oxygen (O⁻(g) + e⁻ → O²⁻(g)) is endothermic because:","A":"Oxygen already has a full outer shell in O⁻ and cannot accommodate further electrons","B":"The incoming electron must overcome the electrostatic repulsion from the already-negative O⁻ ion","C":"All second electron affinities are endothermic for all elements in the periodic table","D":"The second electron occupies a new shell that is very far from the nucleus","correct":"B","explain":"Adding the first electron to neutral O produces O⁻ — this is exothermic because the nuclear charge attracts the incoming electron. However, adding a <b>second</b> electron to the already-negative O⁻ requires energy to overcome the <b>electron–electron repulsion</b> between the incoming electron and the negative charge on the ion. The nuclear attraction at this point is outweighed by the repulsive effect of the existing negative charge. This is why the formation of O²⁻ from O(g) has an overall positive enthalpy change for the second EA step (EA₂ ≈ +844 kJ mol⁻¹), even though EA₁ is exothermic (≈ −141 kJ mol⁻¹). Without the very exothermic lattice enthalpy of ionic oxides like MgO (−3791 kJ mol⁻¹), O²⁻-containing lattices could not form at all. Option C states a correct generalisation — all EA₂ values are endothermic for every element, because adding a second electron to an already-negative ion always requires energy to overcome repulsion — but it does not explain the underlying mechanism. A 'because' question requires the mechanistic reason (electron–electron repulsion), not just a restatement of the observed pattern."},{"stem":"The units of standard molar entropy (S°) are:","A":"kJ mol⁻¹","B":"kJ K⁻¹ mol⁻¹","C":"J K⁻¹ mol⁻¹","D":"J mol⁻¹","correct":"C","explain":"Standard molar entropy has units of <b>J K⁻¹ mol⁻¹</b> — note joules (not kilojoules) and per kelvin. This is the most important unit distinction in thermodynamics: enthalpy changes use <b>kJ mol⁻¹</b> but entropy uses <b>J K⁻¹ mol⁻¹</b>. When combining ΔS with ΔH in the Gibbs equation ΔG = ΔH − TΔS, ΔS must be <b>divided by 1000</b> to convert to kJ K⁻¹ mol⁻¹ so that both sides have the same energy unit. Forgetting this conversion is the single most common error in ΔG calculations and produces answers wrong by a factor of 1000 (e.g. threshold temperature of 1.1 K instead of 1100 K). The temperature T in the TΔS term must always be in kelvin (not Celsius)."},{"stem":"A reaction is feasible at all temperatures when:","A":"ΔH is positive and ΔS is positive","B":"ΔH is negative and ΔS is negative","C":"ΔH is positive and ΔS is negative","D":"ΔH is negative and ΔS is positive","correct":"D","explain":"When ΔH is <b>negative</b> (exothermic) and ΔS is <b>positive</b> (more disordered), ΔG = ΔH − TΔS is always negative at any positive temperature T. The negative ΔH and the positive TΔS term both act in the same direction, making ΔG increasingly negative as T rises — so the reaction is feasible at all temperatures (Case A). Option A (ΔH+, ΔS+) gives a reaction feasible only at high T (CaCO₃ decomposition). Option B (ΔH−, ΔS−) gives feasibility only at low T. Option C (ΔH+, ΔS−) means ΔG is always positive — the reaction is never feasible. Memorising all four cases is essential for Section A multiple-choice questions on thermodynamic feasibility (H432/01 November 2021 Q11)."}];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    document.querySelectorAll('input[name="q'+n+'"]').forEach(function(r){r.disabled=true;});
    document.getElementById('opt-'+n+'-'+q.correct).classList.add('hl-ok');
    if(sel&&sel.value===q.correct){
      score++;card.classList.add('correct');
      res.innerHTML='&#10003; Correct';res.className='res-icon res-ok';
    }else{
      card.classList.add('wrong');
      if(sel)document.getElementById('opt-'+n+'-'+sel.value).classList.add('hl-bad');
      var ans=sel?'Incorrect. Correct answer: <strong>'+q.correct+'</strong>':'Not answered. Correct answer: <strong>'+q.correct+'</strong>';
      res.innerHTML='&#10007; '+ans;res.className='res-icon res-bad';
    }
    res.style.display='block';ex.style.display='block';
  });
  var pct=Math.round(score/total*100);
  var msg=score===total?'Full marks, excellent work!':score>=Math.round(total*0.7)?'Good work. Check the explanations for any you missed.':'Keep practising. Work through all the explanations below.';
  var banner=document.getElementById('score-banner');
  banner.innerHTML='<h2><span id="score-num">0</span> / '+total+'</h2><p>'+pct+'%: '+msg+'</p>';
  (function(){if(score===0)return;var el=document.getElementById('score-num'),cur=0,t=setInterval(function(){el.textContent=++cur;if(cur>=score)clearInterval(t);},Math.min(120,Math.round(700/score)));})();
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Submitted';
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
